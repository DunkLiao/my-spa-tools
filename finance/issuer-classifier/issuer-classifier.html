<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issuer Classifier｜債券發行人分類器</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#fff;--ink:#1c2430;--muted:#6b7686;--line:#dfe4ec;
  --brand:#1f5fbf;--brand-ink:#fff;--side:#14233b;--side-ink:#cfd9ea;
  --crit:#c62828;--high:#e65100;--med:#b7791f;--low:#2e7d32;--info:#3b6ea5;
  --crit-bg:#fdecea;--high-bg:#fff0e0;--med-bg:#fff7db;--low-bg:#e8f5e9;--info-bg:#e8f1fb;
  --radius:10px;--shadow:0 1px 3px rgba(20,35,59,.10),0 4px 14px rgba(20,35,59,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151d;--panel:#18202c;--ink:#e6ebf2;--muted:#93a0b3;--line:#2a3545;--brand:#4b8df0;--side:#0b111b;--side-ink:#aebbd0;
  --crit-bg:#3a1a1a;--high-bg:#3a2a16;--med-bg:#3a3316;--low-bg:#173322;--info-bg:#18283d;--shadow:none}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:flex;height:100vh}
#side{width:216px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;flex:none}
#side h1{font-size:15px;margin:0;padding:18px 16px 4px;color:#fff;letter-spacing:.3px}
#side .sub{padding:0 16px 14px;font-size:11px;opacity:.7}
#side nav{flex:1;overflow:auto}
#side a{display:block;padding:10px 16px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
#side a:hover{background:rgba(255,255,255,.06)}
#side a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#6aa5ff}
#side .foot{padding:12px 16px;font-size:11px;opacity:.65;border-top:1px solid rgba(255,255,255,.1)}
#main{flex:1;overflow:auto;padding:20px 24px 60px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
textarea{min-height:90px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
button{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
button:hover{border-color:var(--brand)}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.dng{color:var(--crit);border-color:var(--crit)}
button.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>.f{flex:1;min-width:140px}
.spacer{flex:1}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--line) 35%,transparent);font-weight:600;position:sticky;top:0;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
tr.clk{cursor:pointer}tr.clk:hover td{background:color-mix(in srgb,var(--brand) 7%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-Critical{background:var(--crit-bg);color:var(--crit)}.b-High{background:var(--high-bg);color:var(--high)}
.b-Medium{background:var(--med-bg);color:var(--med)}.b-Low{background:var(--low-bg);color:var(--low)}
.b-info{background:var(--info-bg);color:var(--info)}.b-gray{background:var(--line);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:Consolas,monospace}
.trace{background:#0f1722;color:#d6e2f3;border-radius:8px;padding:12px;font:12.5px/1.65 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-all}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.bar .n{width:170px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:var(--line);border-radius:4px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand)}
.bar .c{width:56px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:12px;max-width:880px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h3{margin-top:0}
.toast-box{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2a40;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px}
.toast.err{background:#a62a2a}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand);width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--info-bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13px}.kv>b{color:var(--muted);font-weight:500}.kv{margin-bottom:8px}
td button{white-space:nowrap}
.rvcls{min-width:170px}.rvwhy{min-width:150px}
.cond{display:grid;grid-template-columns:150px 130px 1fr 32px;gap:6px;margin-bottom:6px}
.help{font-size:12px;color:var(--muted);margin-top:4px}
details summary{cursor:pointer;color:var(--brand)}
.warn{background:var(--med-bg);border:1px solid var(--med);color:var(--med);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Issuer Classifier</h1>
    <div class="sub">債券發行人分類器 v1.0｜本機離線</div>
    <nav id="nav"></nav>
    <div class="foot" id="sideFoot">載入中…</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast-box" id="toasts"></div>
<div id="modalRoot"></div>
<script>
'use strict';
// ==== ENGINE START ====
const APP_VERSION = '1.0.1';
const SEED_VER = 2;   // 預設規則／名單／權數表版本；變更預設值時遞增，舊資料庫會提示套用
const CLS = {SOV:'主權國家',PSE:'非中央政府公共部門',MDB:'多邊開發銀行',BANK:'銀行',SOE:'國營事業',CORP:'民營企業',SEC:'證券化暴險',UNKNOWN:'無法判定'};
const CLS_CODES = Object.keys(CLS);
const SEV_ORDER = {Critical:4,High:3,Medium:2,Low:1};
const FINDING_DEF = {
  F01_TYPE_MISMATCH:{sev:'High',name:'暴險類別不符'},
  F02_RW_UNDERSTATED:{sev:'Critical',name:'風險權數低估'},
  F03_RW_OVERSTATED:{sev:'Medium',name:'風險權數高估'},
  F04_LOW_CONFIDENCE:{sev:'Medium',name:'分類信心不足'},
  F05_RULE_CONFLICT:{sev:'Medium',name:'規則衝突'},
  F06_RATING_MISSING:{sev:'Low',name:'缺少外部評等'},
  F07_SAME_ISSUER_INCONSISTENT:{sev:'High',name:'同一發行人申報不一致'}
};
const BOND_EXPECT = {MUNI:'PSE',GOVT:'SOV',MBS:'SEC',CMO:'SEC',FIN:'BANK',CORP:'CORP'};

/* ---------- 名稱正規化 ---------- */
const SUFFIX_RE = /\b(INC|INCORPORATED|LTD|LIMITED|CORP|CORPORATION|CO|COMPANY|LLC|PLC|SA|AG|NV|LP|LLP)\b/g;
function normBase(s){
  s = String(s == null ? '' : s).normalize('NFKC').toUpperCase().replace(/臺/g,'台');
  s = s.replace(/[.,;:'"`()\[\]{}\/\\&\-_*+!?@#%^=|<>~，。、；：「」『』（）【】]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function normName(s){
  const b = normBase(s);
  const r = b.replace(SUFFIX_RE,' ').replace(/股份有限公司|有限公司|股份公司/g,' ').replace(/\s+/g,' ').trim();
  return r || b;
}
const _reCache = new Map();
function kwMatch(hay, kw){
  if(!kw) return false;
  if(/^[\x00-\x7F]+$/.test(kw)){
    let re = _reCache.get(kw);
    if(!re){ re = new RegExp('(^|[^A-Z0-9])' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '($|[^A-Z0-9])'); _reCache.set(kw,re); }
    return re.test(hay);
  }
  return hay.includes(kw);
}

/* ---------- 規則編譯與比對 ---------- */
function compileCond(c){
  const isName = c.field === 'ISSUER_NAME_N' || c.field === 'ISSUER_NAME';
  const raw = Array.isArray(c.value) ? c.value.join(',') : String(c.value == null ? '' : c.value);
  let vals, re = null;
  if(c.op === 'regex'){ vals = [raw]; try{ re = new RegExp(raw,'i'); }catch(e){ re = null; } }
  else{
    const parts = (Array.isArray(c.value) ? c.value : raw.split(/[,，、\n]+/)).map(x=>String(x).trim()).filter(Boolean);
    vals = parts.map(x => isName ? (normName(x) || normBase(x)) : x.toUpperCase());
  }
  return {field:c.field, op:c.op, vals, isName, re};
}
function compileRules(rules){
  return (rules || []).filter(r => r.enabled !== false)
    .map(r => ({...r, _cond:(r.conditions||[]).map(compileCond), _excl:(r.excludes||[]).map(compileCond)}))
    .sort((a,b) => b.priority - a.priority);
}
function fieldVal(rec, n, field){
  switch(field){
    case 'ISSUER_NAME_N': return n;
    case 'ISSUER_NAME': return normBase(rec.issuerName);
    case 'ISSUER_COUNTRY': return String(rec.country || '').toUpperCase();
    case 'BOND_TYPE': return String(rec.bondType || '').toUpperCase();
    case 'CUST_ID': return String(rec.custId || '').toUpperCase();
  }
  return '';
}
function evalCond(cc, rec, n){
  const v = fieldVal(rec, n, cc.field);
  switch(cc.op){
    case 'equals': return cc.vals.some(x => v === x);
    case 'in': return cc.vals.includes(v);
    case 'containsAny': return cc.vals.some(x => cc.isName ? kwMatch(v,x) : v.includes(x));
    case 'containsAll': return cc.vals.length > 0 && cc.vals.every(x => cc.isName ? kwMatch(v,x) : v.includes(x));
    case 'startsWith': return cc.vals.some(x => v.startsWith(x));
    case 'regex': return cc.re ? cc.re.test(cc.field === 'ISSUER_NAME_N' ? v : String(rec.issuerName || '')) : false;
    case 'isNull': return v === '';
    case 'notNull': return v !== '';
  }
  return false;
}
function matchRules(rec, n, rules){
  const hits = [];
  for(const r of rules){
    if(!r._cond.length) continue;
    if(!r._cond.every(c => evalCond(c, rec, n))) continue;
    if(r._excl.length && r._excl.some(c => evalCond(c, rec, n))) continue;
    hits.push(r);
  }
  return hits;
}
function compileLists(lists){
  return (lists || []).slice().sort((a,b) => (a.order||0) - (b.order||0)).map(l => ({
    listId:l.listId, name:l.name, cls:l.cls, tag:l.tag,
    items:(l.items||[]).map(x => String(x).trim()).filter(Boolean).map(x => {
      const exact = x.startsWith('=');
      const n = normName(exact ? x.slice(1) : x) || normBase(x);
      return {n, exact};
    })
  }));
}
function matchLists(n, lists){
  for(const l of lists){
    for(const it of l.items){
      if(it.exact ? n === it.n : kwMatch(n, it.n)) return {listId:l.listId, name:l.name, cls:l.cls, tag:l.tag, item:it.n};
    }
  }
  return null;
}

/* ---------- 評等 ---------- */
const NO_RATING = /^(NR|N\/R|WR|NA|N\/A|NONE|無|無評等|未評等|-|—)?$/i;
function bandOf(idx){ return idx <= 3 ? 1 : idx <= 6 ? 2 : idx <= 9 ? 3 : idx <= 15 ? 4 : 5; }
const BAND_LABEL = ['','AAA～AA-','A+～A-','BBB+～BBB-','BB+～B-','CCC+以下'];
function parseRating(agency, raw, maps){
  let s = String(raw == null ? '' : raw).normalize('NFKC').trim().toUpperCase();
  if(NO_RATING.test(s)) return {empty:true};
  const m = maps[agency];
  if(!m) return {bad:true, raw:s};
  if(m.type === 'map'){
    s = s.replace(/\(TWN\)|\(TW\)/g,'').replace(/^TW/,'').replace(/[*\s]/g,'');
    return (s in m.map) ? {idx:m.map[s]} : {bad:true, raw:s};
  }
  s = s.replace(/[*\s]/g,'').replace(/\/.*$/,'');
  const i = m.scale.map(x => String(x).toUpperCase()).indexOf(s);
  return i >= 0 ? {idx:i} : {bad:true, raw:s};
}
function pickRating(rec, maps){
  const defs = [['SP','S&P',rec.ratings.sp],['MDY','Moody\'s',rec.ratings.mdy],['FITCH','Fitch',rec.ratings.fitch],
                ['TW','中華信評',rec.ratings.trc],['TW','Fitch(台灣)',rec.ratings.fitchTw],['SP','評等',rec.ratings.generic]];
  const list = [], bad = [];
  for(const [ag,label,raw] of defs){
    const p = parseRating(ag, raw, maps);
    if(p.empty) continue;
    if(p.bad){ bad.push(label + ':' + p.raw); continue; }
    list.push({src:label, ag, raw:String(raw).trim(), idx:p.idx});
  }
  if(!list.length) return {rating:null, bad};
  const sorted = list.slice().sort((a,b) => a.idx - b.idx);
  const sel = sorted.length === 1 ? sorted[0] : sorted[1];     // 擇低原則：兩家取較低；三家以上先取最好兩家再取較低
  return {rating:{idx:sel.idx, band:bandOf(sel.idx), list, sel}, bad};
}
function twScaleIdx(raw){
  const s = String(raw == null ? '' : raw).normalize('NFKC').toUpperCase().replace(/\(TWN\)|\(TW\)/g,'').replace(/^TW/,'').replace(/[*\s]/g,'');
  return SP_SCALE.indexOf(s);
}
const TW_HINT = /台灣|台北|新北|桃園|台中|台南|高雄|基隆|新竹|嘉義|宜蘭|苗栗|彰化|南投|雲林|屏東|花蓮|台東|澎湖|金門|連江|中華民國|財政部|國庫署|台電|中油|台水|台鐵|中華郵政|國立|TAIWAN|TAIPEI|CHUNGHWA/;
function isDomestic(rec, n){
  const c = String(rec.country || '').trim().toUpperCase();
  if(c) return c === 'TW' || c === 'TWN' || c === '台灣';
  return TW_HINT.test(n);
}
function normReportedType(s){
  s = String(s == null ? '' : s).trim();
  if(!s) return null;
  const u = s.toUpperCase();
  if(CLS[u] && u !== 'UNKNOWN') return u;
  if(/非中央|公共部門|PUBLIC.?SECTOR|SUB.?SOVEREIGN/.test(u)) return 'PSE';
  if(/多邊|MULTILATERAL/.test(u)) return 'MDB';
  if(/國營|STATE.?OWNED/.test(u)) return 'SOE';
  if(/證券化|MBS|CMO|SECURITI/.test(u)) return 'SEC';
  if(/主權|SOVEREIGN|中央政府|央行/.test(u)) return 'SOV';
  if(/銀行|BANK/.test(u)) return 'BANK';
  if(/企業|公司|CORP/.test(u)) return 'CORP';
  return null;
}

/* ---------- 權數查定 ---------- */
function computeRW(cls, tag, rec, rating, cfg, dom){
  const B = cfg.bands, S = Object.assign({}, DEFAULT_RW.specials, cfg.specials), notes = [];
  const band = rating ? rating.band : null, rated = !!rating;
  const pick = row => row.r[band - 1];
  const R = (rw, basis, dep, extra) => ({rw, basis, dep, notes:(extra ? [extra] : []).concat(notes)});
  switch(cls){
    case 'SOV':
      if(dom) return R(S.SOV_DOM, 'SPECIAL', false, '本國中央政府／中央銀行');
      return rated ? R(pick(B.SOV), 'RATED', true) : R(B.SOV.un, 'UNRATED', true, '未評等，採未評等權數');
    case 'PSE':
      if(tag === 'UNIV' && !rated) return R(S.UNIV, 'SPECIAL', false, '國立大學（無外部評等）');
      if(dom && tag !== 'UNIV') return R(S.PSE_DOM, 'SPECIAL', false, '本國地方政府／中央行政法人');
      return rated ? R(pick(B.PSE), 'RATED', true) : R(B.PSE.un, 'UNRATED', true, '未評等，採未評等權數');
    case 'MDB':
      if(tag === 'MDB_ZERO'){
        if(!rated) return R(S.MDB_ZERO, 'SPECIAL', false, 'BCBS 明定 0% 名單（未提供評等，假設不低於 AA-）');
        if(band <= 1) return R(S.MDB_ZERO, 'SPECIAL', false, 'BCBS 明定名單且評等不低於 AA-');
        return R(pick(B.MDB), 'RATED', true, '雖在 BCBS 名單但評等低於 AA-，改依評等');
      }
      return rated ? R(pick(B.MDB), 'RATED', true) : R(B.MDB.un, 'UNRATED', true, '未評等多邊開發銀行');
    case 'BANK': {
      if(tag === 'CHP') return R(rec.shortTerm === true ? S.CHP_ST : S.CHP, 'SPECIAL', false, '中華郵政（無外部評等）');
      const st = rec.shortTerm === true, row = st ? B.BANK_ST : B.BANK;
      if(rated){
        let rw = row.r[band - 1];
        if(st && band === 4 && rating.idx >= 13) rw = S.BANK_ST_LOWB;
        return R(rw, 'RATED', true, st ? '銀行短期債權' : null);
      }
      let g = String(rec.bankGrade || '').trim().toUpperCase();
      let extra = '未評等銀行，依資本適足等級 ';
      const given = ['A','B','C'].includes(g);
      if(!given){ g = 'B'; extra = '未提供 BANK_GRADE，暫以 B 級計 '; }
      return R(cfg.bankUnrated[st ? 'ST' : 'LT'][g], 'UNRATED', !given, extra + g + (st ? '（短期）' : '（長期）'));
    }
    case 'SOE': return R(S.SOE, 'SPECIAL', false, '國營事業');
    case 'CORP':
      if(dom){
        if(rated){
          if(rating.sel.ag === 'TW'){          // 手冊 2-6：中華信評／Fitch(台灣) twAA 以上 50%；twA 以上 75%
            const ti = twScaleIdx(rating.sel.raw);
            if(ti >= 0 && ti <= 2) return R(S.CORP_TW_AA, 'RATED', true, '境內民營企業：本土評等 twAA 以上');
            if(ti >= 0 && ti <= 5) return R(S.CORP_TW_A, 'RATED', true, '境內民營企業：本土評等 twA 以上（低於 twAA）');
            return R(band >= 5 ? B.CORP_TW.r[4] : B.CORP_TW.r[3], 'RATED', true, '境內民營企業：本土評等低於 twA，手冊未明列，依評等帶保守計');
          }
          return R(B.CORP_TW.r[band - 1], 'RATED', true, '境內民營企業（國際評等帶）');
        }
        if(rec.revenue == null) return R(S.CORP_TW_UN_HIGH, 'UNRATED', true, '未提供營收，保守以 100% 計');
        return R(rec.revenue <= S.CORP_REV_THRESHOLD ? S.CORP_TW_UN_LOW : S.CORP_TW_UN_HIGH, 'UNRATED', false, '境內無評等，依營收門檻 ' + S.CORP_REV_THRESHOLD.toLocaleString('en-US'));
      }
      return rated ? R(pick(B.CORP), 'RATED', true) : R(B.CORP.un, 'UNRATED', true, '未評等企業債權');
    case 'SEC':
      if(tag === 'GNMA') return R(S.GNMA, 'SPECIAL', false, 'Ginnie Mae');
      if(tag === 'GSE'){
        if(rec.passThrough === true) return R(S.GSE_PT, 'SPECIAL', false, 'Fannie／Freddie 純轉付架構');
        if(rec.passThrough === false) return R(S.GSE_NPT, 'SPECIAL', false, '非純轉付架構（法定區間 15%～30%，取上限）');
        return R(S.GSE_PT, 'SPECIAL', false, '未提供 PASS_THROUGH，暫以純轉付計');
      }
      return R(null, 'N/A', false, '證券化暴險須人工查定');
  }
  return R(null, 'N/A', false);
}

/* ---------- 分類主流程 ---------- */
function classify(rec, ctx){
  const set = ctx.settings, cfg = ctx.rw, trace = [];
  const n = normName(rec.issuerName);
  const dom = isDomestic(rec, n);
  trace.push('ISSUER_NAME : ' + rec.issuerName);
  trace.push('Normalized  : ' + n + (rec.country ? '   COUNTRY=' + rec.country : (dom ? '   COUNTRY=（未提供，依名稱推定境內）' : '   COUNTRY=（未提供，視為境外）')));

  // ② Master
  let master = null, mSrc = '';
  const m1 = rec.custId ? ctx.byKey.get(String(rec.custId)) : null;
  if(m1 && m1.status === 'confirmed'){ master = m1; mSrc = 'CUST_ID'; }
  else { const m2 = n ? ctx.byName.get(n) : null; if(m2 && m2.status === 'confirmed'){ master = m2; mSrc = '名稱'; } }
  trace.push('② Master    : ' + (master ? '✔ 已覆核（' + mSrc + '）→ ' + master.expoType + (master.reason ? '｜' + master.reason : '') : '未命中'));
  // ③ Alias
  let aliasM = null;
  if(!master && ctx.aliasMap.has(n)){
    const m = ctx.byKey.get(ctx.aliasMap.get(n));
    if(m && m.status === 'confirmed') aliasM = m;
  }
  trace.push('③ Alias     : ' + (aliasM ? '✔ 別名指向 ' + aliasM.key + ' → ' + aliasM.expoType : (master ? '（略過）' : '未命中')));
  // ④ Lists
  const lh = matchLists(n, ctx.lists);
  trace.push('④ Lists     : ' + (lh ? '✔ ' + lh.name + '（' + lh.item + '）→ ' + lh.cls : '未命中'));
  // ⑤ Rules
  const hits = matchRules(rec, n, ctx.rules);
  if(hits.length) hits.forEach((h,i) => trace.push((i ? '             ' : '⑤ Keyword   : ') + (i ? '· ' : '') + '✔ ' + h.ruleId + '（P' + h.priority + '）→ ' + h.result.expoType));
  else trace.push('⑤ Keyword   : 未命中');

  let cls = null, conf = 0, source = '', tag = null, ruleId = null, rwOverride = null, conflict = false;
  if(master){ cls = master.expoType; conf = 100; source = 'MASTER'; rwOverride = master.rwOverride; }
  else if(aliasM){ cls = aliasM.expoType; conf = 95; source = 'ALIAS'; rwOverride = aliasM.rwOverride; }
  else if(lh){ cls = lh.cls; conf = 95; source = 'LIST'; tag = lh.tag; ruleId = lh.listId; }
  else if(hits.length){
    const top = hits[0];
    cls = top.result.expoType; conf = top.result.confidence != null ? top.result.confidence : 70;
    source = 'RULE'; ruleId = top.ruleId; tag = top.result.tag || null;
    const others = top.result.exclusive ? [] : hits.filter(h => h.result.expoType !== cls && h.priority >= top.priority - 10);
    if(others.length){ conflict = true; conf = Math.max(0, conf - 15); trace.push('             ⚠ 與 ' + others.map(o => o.ruleId + '→' + o.result.expoType).join('、') + ' 衝突，信心 -15'); }
  }
  // 標籤沿用（覆核命中時仍保留名單／規則的特殊權數標籤）
  if(!tag && (source === 'MASTER' || source === 'ALIAS')){
    if(lh && lh.cls === cls) tag = lh.tag;
    else { const h = hits.find(x => x.result.expoType === cls && x.result.tag); if(h) tag = h.result.tag; }
  }
  // ⑥ Context
  const exp = BOND_EXPECT[String(rec.bondType || '').toUpperCase()];
  if(!cls){
    if(!n){ cls = 'UNKNOWN'; conf = 0; source = 'DEFAULT'; trace.push('⑥ Context   : ISSUER_NAME 為空，無法判定（信心 0）'); }
    else if(exp){ cls = exp; conf = 65; source = 'CONTEXT'; trace.push('⑥ Context   : BOND_TYPE=' + rec.bondType + ' → 推定 ' + exp + '（信心 65）'); }
    else { cls = 'CORP'; conf = set.defaultConf; source = 'DEFAULT'; trace.push('⑥ Context   : 無可用線索 → 預設 CORP（信心 ' + conf + '）'); }
  }else if(source === 'RULE' && exp && ['PSE','SOV','SEC'].includes(exp)){
    if(exp !== cls){ conflict = true; conf = Math.max(0, conf - 15); trace.push('⑥ Context   : ⚠ BOND_TYPE=' + rec.bondType + ' 暗示 ' + exp + '，與名稱規則 ' + cls + ' 不一致，信心 -15'); }
    else trace.push('⑥ Context   : BOND_TYPE=' + rec.bondType + ' → 維持 ' + cls);
  }else trace.push('⑥ Context   : ' + (rec.bondType ? 'BOND_TYPE=' + rec.bondType + '，' : '') + '維持 ' + cls);

  // ⑧ Rating / RW
  const pr = pickRating(rec, ctx.rmaps);
  const rating = pr.rating;
  let ratingText = '';
  if(rating){
    ratingText = rating.list.map(x => x.src + ' ' + x.raw).join(' / ') + (rating.list.length > 1 ? ' → 擇低 ' + rating.sel.src + ' ' + rating.sel.raw : '') + ' → 評等帶 ' + BAND_LABEL[rating.band];
  }
  if(rating && rating.sel.ag === 'TW'){ const ti = twScaleIdx(rating.sel.raw); if(ti >= 6 && ti <= 14) ratingText += '（本土評等 twA-～twB 為手冊合併區間 BBB+～B-，採保守帶）'; }
  if(pr.bad.length) ratingText += (ratingText ? '；' : '') + '無法辨識：' + pr.bad.join(',');
  const rwr = cls === 'UNKNOWN' ? {rw:null, basis:'N/A', dep:false, notes:['無法判定']} : computeRW(cls, tag, rec, rating, cfg, dom);
  if(rwOverride != null && !isNaN(rwOverride)){ rwr.rw = Number(rwOverride); rwr.basis = 'OVERRIDE'; rwr.notes.unshift('發行人主檔指定權數'); }
  trace.push('⑧ Rating    : ' + (ratingText || '（無外部評等）'));
  trace.push('   RW 查定  : ' + (rwr.rw == null ? '—' : rwr.rw + '%') + '（' + rwr.basis + '）' + (rwr.notes.length ? ' ' + rwr.notes.join('；') : ''));

  // ⑨ Compare + Findings
  const findings = [];
  const add = (code, msg) => findings.push({code, sev:FINDING_DEF[code].sev, msg});
  const rptCls = normReportedType(rec.reportedType);
  if(rec.reportedType && !rptCls) trace.push('   申報類別  : 「' + rec.reportedType + '」無法對應內部類別代碼');
  if(rptCls && cls !== 'UNKNOWN' && rptCls !== cls) add('F01_TYPE_MISMATCH', '申報「' + CLS[rptCls] + '」，建議「' + CLS[cls] + '」');
  const skipRw = rwr.dep && !rating && set.skipRwWhenNoRating;
  if(rec.reportedRw != null && rwr.rw != null && !skipRw){
    if(rwr.rw > rec.reportedRw + 1e-9) add('F02_RW_UNDERSTATED', '申報 RW ' + rec.reportedRw + '% < 建議 ' + rwr.rw + '%（低估）');
    else if(rwr.rw < rec.reportedRw - 1e-9) add('F03_RW_OVERSTATED', '申報 RW ' + rec.reportedRw + '% > 建議 ' + rwr.rw + '%（高估）');
  }
  if(conf < set.confThreshold) add('F04_LOW_CONFIDENCE', '信心 ' + conf + ' < 門檻 ' + set.confThreshold);
  if(conflict) add('F05_RULE_CONFLICT', '命中多項衝突規則或與 BOND_TYPE 不一致');
  if(rwr.dep && !rating) add('F06_RATING_MISSING', cls + ' 需依外部評等查定權數，但資料無評等');
  let delta = null;
  if(rec.reportedRw != null && rwr.rw != null && rec.exposureAmt != null && !skipRw) delta = rec.exposureAmt * (rwr.rw - rec.reportedRw) / 100;
  trace.push('⑨ Compare   : 申報 ' + (rptCls || rec.reportedType || '—') + ' / ' + (rec.reportedRw == null ? '—' : rec.reportedRw + '%') + '  →  ' + (findings.length ? findings.map(f => f.code.split('_')[0]).join(' + ') : '無缺失'));
  if(skipRw && rec.reportedRw != null) trace.push('             （無評等資料，略過 RW 高低估判斷；僅提供參考權數）');

  const res = {
    key: rec.custId ? String(rec.custId) : 'N:' + n,
    custId: rec.custId || '', issuerName: rec.issuerName || '', nameN: n, country: rec.country || '', bondType: rec.bondType || '', bondId: rec.bondId || '',
    reportedType: rec.reportedType || '', reportedCls: rptCls, reportedRw: rec.reportedRw,
    sugCls: cls, sugRw: rwr.rw, rwBasis: rwr.basis, confidence: conf, source, ruleId, tag,
    ratingText, ratingBand: rating ? rating.band : null, exposureAmt: rec.exposureAmt, deltaRwa: delta,
    findings, trace: trace.join('\n'), ruleVersion: ctx.ruleVersion
  };
  recalc(res);
  return res;
}
function recalc(res){
  res.findingCodes = res.findings.map(f => f.code);
  let top = '', o = 0;
  for(const f of res.findings){ if(SEV_ORDER[f.sev] > o){ o = SEV_ORDER[f.sev]; top = f.sev; } }
  res.severity = top;
}
function postProcess(results){
  const byCust = new Map();
  for(const r of results){
    if(!r.custId || !r.reportedCls) continue;
    if(!byCust.has(r.custId)) byCust.set(r.custId, new Set());
    byCust.get(r.custId).add(r.reportedCls);
  }
  for(const r of results){
    const s = byCust.get(r.custId);
    if(s && s.size > 1 && r.reportedCls){
      r.findings.push({code:'F07_SAME_ISSUER_INCONSISTENT', sev:'High', msg:'同一 CUST_ID 被申報為 ' + [...s].map(x => CLS[x]).join('、')});
      recalc(r);
    }
  }
  return results;
}

function toBool(v){
  const s = String(v == null ? '' : v).trim().toUpperCase();
  if(['Y','YES','TRUE','T','1','是','Ｙ'].includes(s)) return true;
  if(['N','NO','FALSE','F','0','否'].includes(s)) return false;
  return null;
}
function toNum(v){
  if(v == null) return null;
  const s = String(v).replace(/[,\s%]/g,'');
  if(s === '' || s === '-') return null;
  const x = Number(s);
  return isNaN(x) ? null : x;
}

/* ---------- CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n/, 1)[0];
  let delim = ',', best = -1;
  for(const d of [',','\t',';','|']){ const c = first.split(d).length - 1; if(c > best){ best = c; delim = d; } }
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ row.push(f); f = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += ch;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function rowsToObjects(rows){
  const seen = {};
  const headers = rows[0].map(h => {
    let k = String(h).trim() || 'COL'; if(seen[k]){ seen[k]++; k = k + '_' + seen[k]; } else seen[k] = 1; return k;
  });
  const data = rows.slice(1).map(r => { const o = {}; headers.forEach((h,i) => o[h] = r[i] == null ? '' : r[i]); return o; });
  return {headers, data};
}
function csvEscape(v){
  if(v == null) return '';
  let s = String(v);
  // 防止 Excel 公式注入：以 = + - @ 開頭的文字（非純數字）前置單引號
  if(typeof v === 'string' && /^[=+\-@\t\r]/.test(s) && !/^[+-]?\d+(\.\d+)?$/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(headers, rows){ return headers.map(csvEscape).join(',') + '\r\n' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n'); }

const DB_NAME = 'IssuerClassifierDB', DB_VER = 1;
let db = null;
function openDB(){
  return new Promise((res, rej) => {
    if(!window.indexedDB) return rej(new Error('此瀏覽器不支援 IndexedDB'));
    const q = indexedDB.open(DB_NAME, DB_VER);
    q.onupgradeneeded = () => {
      const d = q.result;
      const mk = (n, opt, idx) => { const s = d.createObjectStore(n, opt); (idx || []).forEach(([a, b, o]) => s.createIndex(a, b, o || {})); };
      mk('issuers', {keyPath:'key'}, [['nameN','nameN'],['expoType','expoType'],['status','status']]);
      mk('aliases', {keyPath:'aliasN'}, [['key','key']]);
      mk('rules', {keyPath:'ruleId'}, [['priority','priority']]);
      mk('lists', {keyPath:'listId'});
      mk('rwTables', {keyPath:'id'});
      mk('ratingMaps', {keyPath:'agency'});
      mk('batches', {keyPath:'batchId'}, [['createdAt','createdAt']]);
      mk('records', {keyPath:['batchId','chunk']}, [['batchId','batchId']]);   // 每 500 列一個區塊，大幅降低 IndexedDB 寫入負擔
      mk('results', {keyPath:['batchId','chunk']}, [['batchId','batchId']]);
      mk('mappings', {keyPath:'mappingId'});
      mk('auditLogs', {autoIncrement:true}, [['ts','ts'],['entity','entity']]);
      mk('settings', {keyPath:'key'});
    };
    q.onsuccess = () => { q.result.onversionchange = () => { q.result.close(); toast('資料庫已在另一個分頁升級，請重新整理頁面', true); }; res(q.result); };
    q.onerror = () => rej(q.error);
    q.onblocked = () => toast('資料庫被其他分頁佔用，請關閉其他 Issuer Classifier 分頁後重試', true);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m) => db.transaction(n, m || 'readonly').objectStore(n);
const dbAll = n => req(store(n).getAll());
const dbGet = (n, k) => req(store(n).get(k));
const dbPut = (n, v) => req(store(n, 'readwrite').put(v));
const dbDel = (n, k) => req(store(n, 'readwrite').delete(k));
const dbClear = n => req(store(n, 'readwrite').clear());
const dbByIndex = (n, i, k) => req(store(n).index(i).getAll(IDBKeyRange.only(k)));
function dbPutMany(n, arr){
  return new Promise((res, rej) => {
    const t = db.transaction(n, 'readwrite'), s = t.objectStore(n);
    arr.forEach(v => s.put(v));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
function dbDelByIndex(n, i, k){
  return new Promise((res, rej) => {
    const t = db.transaction(n, 'readwrite');
    const c = t.objectStore(n).index(i).openCursor(IDBKeyRange.only(k));
    c.onsuccess = () => { const cur = c.result; if(cur){ cur.delete(); cur.continue(); } };
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const audit = (action, entity, detail) => dbPut('auditLogs', {ts:Date.now(), action, entity, detail:detail || ''}).catch(() => {});

async function getCtx(force){

async function loadBatches(){

const CHUNK = 500;
async function saveChunks(storeName, batchId, rows, onStep){
  const STEP = CHUNK * 4;
  for(let i = 0; i < rows.length; i += STEP){
    const arr = [];
    for(let j = i; j < Math.min(rows.length, i + STEP); j += CHUNK) arr.push({batchId, chunk:j / CHUNK, rows:rows.slice(j, j + CHUNK)});
    await dbPutMany(storeName, arr);
    if(onStep) onStep(Math.min(rows.length, i + STEP), rows.length);
  }
}
async function loadChunks(storeName, batchId){
  const cs = await dbByIndex(storeName, 'batchId', batchId);
  cs.sort((a, b) => a.chunk - b.chunk);
  const out = [];
  cs.forEach(c => { for(const r of c.rows) out.push(r); });
  return out;
}
async function getResults(batchId){
  if(state.cache.batchId === batchId && state.cache.results) return state.cache.results;
  const rs = (await loadChunks('results', batchId)).sort((a, b) => a.rowNo - b.rowNo);
  state.cache = {batchId, results:rs};
  return rs;
}
const invalidateResults = () => { state.cache = {batchId:null, results:null}; };
function summarize(rs){
  const s = {total:rs.length, withFindings:0, Critical:0, High:0, Medium:0, Low:0, deltaPos:0, issuers:new Set()};
  rs.forEach(r => {
    s.issuers.add(r.key);
    if(r.findings.length) s.withFindings++;
    if(r.severity) s[r.severity]++;
    if(r.deltaRwa > 0) s.deltaPos += r.deltaRwa;
  });
  s.issuers = s.issuers.size;
  return s;
}

function buildDefects(rs){
  const g = new Map();
  rs.forEach(r => {
    const has = r.findingCodes.some(c => /^F0[123]_/.test(c));
    if(!has || r.reportedRw == null && !r.reportedCls) return;
    const k = [r.reportedCls, r.sugCls, r.reportedRw, r.sugRw].join('|');
    if(!g.has(k)) g.set(k, {rpt:r.reportedCls, sug:r.sugCls, rptRw:r.reportedRw, sugRw:r.sugRw, rows:0, issuers:new Map(), delta:0});
    const o = g.get(k); o.rows++; o.issuers.set(r.key, r.issuerName); if(r.deltaRwa != null) o.delta += r.deltaRwa;
  });
  return [...g.values()].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).map((o, i) => {
    const names = [...o.issuers.values()], ex = names.slice(0, 3).join('、') + (names.length > 3 ? ' 等' + names.length + '家發行人' : '');
    let txt;
    if(o.rpt && o.rpt !== o.sug) txt = '持有 ' + ex + '所發行之債券，應為「' + clsLabel(o.sug) + '」暴險類型，風險權數 ' + rwTxt(o.sugRw) + '，誤列「' + clsLabel(o.rpt) + '」暴險類型，風險權數 ' + rwTxt(o.rptRw);
    else txt = '持有 ' + ex + '所發行之債券（' + clsLabel(o.sug) + '），風險權數應為 ' + rwTxt(o.sugRw) + '，誤列 ' + rwTxt(o.rptRw);
    return {no:i + 1, cls:clsLabel(o.rpt || o.sug), text:txt, rows:o.rows, issuers:names.length, delta:o.delta};
  });
}

/* ---------- 重跑批次 ---------- */
async function classifyRecords(recs, ctx, batchId, onProgress){
  const results = [];
  for(let i = 0; i < recs.length; i += 1000){
    recs.slice(i, i + 1000).forEach(rc => { const r = classify(rc.m, ctx); r.batchId = batchId; r.rowNo = rc.rowNo; results.push(r); });
    if(onProgress) onProgress(Math.min(recs.length, i + 1000), recs.length);
    await sleep0();
  }
  postProcess(results);
  return results;
}
async function rerunBatch(batchId, silent){
  const ctx = await getCtx(true);
  const recs = (await loadChunks('records', batchId)).sort((a, b) => a.rowNo - b.rowNo);
  const old = new Map((await loadChunks('results', batchId)).map(r => [r.rowNo, r]));
  const news = await classifyRecords(recs, ctx, batchId);
  const diffs = [];
  news.forEach(n => {
    const o = old.get(n.rowNo);
    if(!o) return;
    if(o.sugCls !== n.sugCls || o.sugRw !== n.sugRw || o.findingCodes.join() !== n.findingCodes.join()) diffs.push({o, n});
  });
  await saveChunks('results', batchId, news);   // 區塊鍵相同，直接覆寫；中途失敗時舊結果仍完整
  const b = await dbGet('batches', batchId);
  b.ruleVersion = ctx.ruleVersion; b.summary = summarize(news); b.rerunAt = Date.now();
  await dbPut('batches', b);
  await audit('RERUN', 'batch:' + batchId, '重跑 ' + news.length + ' 筆，結果變動 ' + diffs.length + ' 筆（' + ctx.ruleVersion + '）');
  invalidateResults(); await loadBatches();
  return diffs;
}

async function importFile(file){
  try{
    const buf = await file.arrayBuffer(); let text;
    try{ text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(e){ try{ text = new TextDecoder('big5').decode(buf); toast('偵測到非 UTF-8 編碼，已改用 Big5 解碼'); }catch(e2){ text = new TextDecoder().decode(buf); } }
    await loadImportData(file.name, text);
  }catch(e){ toast('讀取失敗：' + e.message, true); }
}
async function loadImportData(name, text){
  let headers, data;
  if(/\.json$/i.test(name) || /^\s*[\[{]/.test(text)){
    let j = JSON.parse(text);
    if(!Array.isArray(j)) j = j.records || j.data || [];
    const hs = new Set(); j.forEach(o => Object.keys(o).forEach(k => hs.add(k)));
    headers = [...hs]; data = j;
  }else{
    const rows = parseCSV(text);
    if(rows.length < 2) throw new Error('檔案沒有資料列');
    ({headers, data} = rowsToObjects(rows));
  }
  if(!data.length) throw new Error('檔案沒有資料列');
  const sig = headers.map(hkey).sort().join('|');
  const saved = await dbGet('mappings', sig);
  const mapping = saved ? saved.mapping : autoMapping(headers);
  state.imp = {name, headers, data, mapping, sig, rwUnit:saved ? saved.rwUnit : state.S.rwUnit, usedSaved:!!saved};
  if(location.hash !== '#/import') location.hash = '#/import'; else renderImpBody();
}

function filterResults(rs){
  const f = state.rf, q = f.q.trim().toUpperCase();
  return rs.filter(r => (!f.only || r.findings.length) && (!f.sev || r.severity === f.sev) && (!f.code || r.findingCodes.includes(f.code)) &&
    (!f.cls || r.sugCls === f.cls) && (!f.src || r.source === f.src) && (!q || (r.issuerName + ' ' + r.custId + ' ' + r.nameN + ' ' + r.bondId).toUpperCase().includes(q)));
}
function sortResults(rs){
  const {k, d} = state.sort;
  const val = {row:r => r.rowNo, cust:r => r.custId, name:r => r.issuerName, sev:r => (SEV_ORDER[r.severity] || 0) * 1e15 + Math.abs(r.deltaRwa || 0), conf:r => r.confidence, delta:r => r.deltaRwa == null ? -Infinity : r.deltaRwa}[k];
  return rs.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : a.rowNo - b.rowNo) * d; });
}

async function pgReview(){
  await loadBatches();
  if(!state.batchId){ main().innerHTML = '<h2>覆核佇列</h2>' + emptyBatch(); return; }
  const rs = await getResults(state.batchId);
  const g = new Map();
  rs.forEach(r => {
    if(r.source === 'MASTER' || r.source === 'ALIAS') return;
    if(!r.findingCodes.some(c => /^F0[1-5]_/.test(c))) return;
    if(!g.has(r.key)) g.set(r.key, {key:r.key, r, n:0, rpt:new Set(), codes:new Set(), delta:0, sevMax:0});
    const o = g.get(r.key); o.n++; if(r.reportedCls) o.rpt.add(r.reportedCls); r.findingCodes.forEach(c => o.codes.add(c.split('_')[0]));
    if(r.deltaRwa != null) o.delta += r.deltaRwa; o.sevMax = Math.max(o.sevMax, SEV_ORDER[r.severity] || 0);
    if(Math.abs(r.deltaRwa || 0) > Math.abs(o.r.deltaRwa || 0)) o.r = r;
  });
  state.queue = [...g.values()].sort((a, b) => b.sevMax - a.sevMax || Math.abs(b.delta) - Math.abs(a.delta));
  const shown = state.queue.slice(0, 300);
  main().innerHTML = '<h2>覆核佇列</h2>' + batchPicker() +
    '<div class="card"><div class="row"><div class="f" style="flex:2"><label>批次確認理由（勾選後一次確認用）</label><input type="text" id="bulkWhy" placeholder="例如：已逐筆核對發行人身分，採系統建議"></div>' +

function readConds(sel){
  return $$(sel + ' .cond').map(d => {
    const op = $('.co', d).value, raw = $('.cv', d).value;
    return {field:$('.cf', d).value, op, value:op === 'regex' ? raw : raw.split(/[,，、\n]+/).map(x => x.trim()).filter(Boolean)};
  }).filter(c => ['isNull','notNull'].includes(c.op) || (Array.isArray(c.value) ? c.value.length : c.value));
}
async function ruleSave(){

  if(!conds.length){ toast('至少需要一個條件', true); return; }
  if(isNaN(pri) || isNaN(conf) || conf < 0 || conf > 100){ toast('優先序／信心數值不正確', true); return; }

async function rwSave(){
  const cfg = JSON.parse(JSON.stringify((await getCtx()).rw)), num = id => { const v = $('#' + id).value.trim(); return v === '' ? null : Number(v); };
  cfg.version = $('#rw_ver').value.trim() || cfg.version;
  BAND_ROWS.forEach(([k]) => { cfg.bands[k].r = cfg.bands[k].r.map((_, i) => num('b_' + k + '_' + i)); cfg.bands[k].un = num('b_' + k + '_un'); });
  ['LT','ST'].forEach(t => ['A','B','C'].forEach(g => cfg.bankUnrated[t][g] = num('bu_' + t + '_' + g)));
  Object.keys(cfg.specials).forEach(k => cfg.specials[k] = num('sp_' + k));
  const bad = BAND_ROWS.some(([k]) => cfg.bands[k].r.some(v => v == null || isNaN(v))) || Object.values(cfg.specials).some(v => v == null || isNaN(v));
  if(bad){ toast('評等帶與特殊權數不可留空', true); return; }
  const all = BAND_ROWS.flatMap(([k]) => cfg.bands[k].r.concat(cfg.bands[k].un == null ? [] : [cfg.bands[k].un])).concat(Object.entries(cfg.specials).filter(([k]) => k !== 'CORP_REV_THRESHOLD').map(([, v]) => v), Object.values(cfg.bankUnrated.LT), Object.values(cfg.bankUnrated.ST));

  await dbPut('rwTables', cfg); await audit('RW_SAVE', 'rwTables', cfg.version); await bumpRev(); toast('權數表已儲存'); pgRW();
}

async function bkRestore(file){
  try{
    const j = JSON.parse(await file.text());
    if(j.app !== 'IssuerClassifier' || !j.data) throw new Error('不是有效的備份檔');
    if(!confirm('還原會覆蓋備份檔內含的資料表，確定繼續？')) return;
    for(const [n, rows] of Object.entries(j.data)){
      if(!db.objectStoreNames.contains(n)) continue;
      await dbClear(n);
      for(let i = 0; i < rows.length; i += 2000) await dbPutMany(n, rows.slice(i, i + 2000));
    }
    await audit('RESTORE', 'system', file.name);
    await loadSettings(); state.ctx = null; invalidateResults(); toast('還原完成'); pgSettings();
  }catch(e){ toast('還原失敗：' + e.message, true); }
}

    if(isNaN(th) || isNaN(df) || th < 0 || th > 100 || df < 0 || df > 100){ toast('信心門檻與預設信心需介於 0～100', true); return; }
    Object.assign(state.S, {confThreshold:Number($('#st_thr').value), defaultConf:Number($('#st_def').value), pageSize:Number($('#st_ps').value), rwUnit:$('#st_unit').value, skipRwWhenNoRating:$('#st_skip').checked});
    await saveSettings(); await audit('SETTINGS', 'settings', JSON.stringify(state.S)); toast('設定已儲存，請重跑批次套用');
  },
  bkLight(){ bkExport(false); }, bkFull(){ bkExport(true); }, bkImport(){ $('#bkFile').click(); },
  async clrBatches(){ if(!confirmBox('清除所有批次、原始資料與結果？（主檔與規則不受影響）')) return; for(const n of ['batches','records','results']) await dbClear(n); invalidateResults(); state.batchId = null; await audit('CLEAR_BATCHES', 'system', ''); toast('已清除'); pgSettings(); },
  async clrAll(){ if(!confirmBox('這會刪除所有資料並還原預設規則，確定？')) return; await resetAll(); toast('已重置'); pgSettings(); },
  async applySeed(){
    if(!confirmBox('這會以新版預設覆蓋「規則、名單、權數表、評等對照」（發行人主檔與批次資料不受影響；自訂的規則與名單將遺失，建議先匯出備份）。確定？')) return;
    await dbClear('rules'); await dbClear('lists'); await dbClear('ratingMaps');
    await dbPutMany('rules', DEFAULT_RULES); await dbPutMany('lists', DEFAULT_LISTS); await dbPutMany('ratingMaps', DEFAULT_RMAPS); await dbPut('rwTables', DEFAULT_RW);
    await dbPut('settings', {key:'seeded', v:SEED_VER}); state.seedStale = false;
    await audit('SEED_UPGRADE', 'system', '套用預設版本 ' + SEED_VER); await bumpRev(); toast('已套用新版預設，請重跑批次'); route();
  },
  dismissSeed(){ state.seedDismissed = true; const b = $('#seedWarn'); if(b) b.remove(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = actions[el.dataset.act];
  if(fn){ Promise.resolve(fn(el, e)).catch(err => { console.error(err); toast('發生錯誤：' + err.message, true); }); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('.modal-bg')) actions.closeModal(); });
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-chg]'); if(!el) return;
  const t = el.dataset.chg;
  try{
    if(t === 'pickBatch'){ state.batchId = el.value; state.page = 1; route(); }
    else if(t === 'rf'){ state.rf[el.dataset.k] = el.value; state.page = 1; renderResultsTable(); }
    else if(t === 'rfOnly'){ state.rf.only = el.checked; state.page = 1; renderResultsTable(); }
    else if(t === 'mapSel'){ if(el.value) state.imp.mapping[el.dataset.f] = el.value; else delete state.imp.mapping[el.dataset.f]; }
    else if(t === 'ruleOn'){ const r = await dbGet('rules', el.dataset.id); r.enabled = el.checked; await dbPut('rules', r); await audit('RULE_TOGGLE', 'rule:' + r.ruleId, String(el.checked)); await bumpRev(); toast(el.checked ? '已啟用' : '已停用'); }
  }catch(err){ console.error(err); toast(err.message, true); }
});

async function updateFoot(){
  try{ const [a, b] = await Promise.all([dbAll('issuers'), dbAll('batches')]); $('#sideFoot').innerHTML = '主檔 ' + a.length + ' 家｜批次 ' + b.length + '<br>' + esc(state.ctx ? state.ctx.rw.version : DEFAULT_RW.version); }catch(e){}
}
let routeSeq = 0, routing = Promise.resolve();
function route(){          // 序列化路由：快速切換頁面時，舊頁面的非同步渲染不會覆蓋新頁面
  const seq = ++routeSeq;
  routing = routing.then(() => seq === routeSeq ? doRoute() : null).catch(e => console.error(e));
  return routing;
}
async function doRoute(){
  const raw = (location.hash || '#/dashboard').replace(/^#\//, '').split('?')[0] || 'dashboard';
  const name = Object.prototype.hasOwnProperty.call(PAGES, raw) ? raw : 'dashboard';
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.r === name));
  try{ main().scrollTop = 0; await PAGES[name](); await getCtx(); }
  catch(e){ console.error(e); main().innerHTML = '<div class="card"><b>發生錯誤</b><pre class="small">' + esc(e.stack || e.message) + '</pre></div>'; }
  if(state.seedStale && !state.seedDismissed) main().insertAdjacentHTML('afterbegin', '<div class="warn" id="seedWarn"><b>預設規則已更新（v' + SEED_VER + '）。</b>你的資料庫仍是舊版預設（含中華信評對照與國內企業評等門檻的修正）。 <button class="sm pri" data-act="applySeed">套用新版預設</button> <button class="sm" data-act="dismissSeed">稍後</button></div>');
  updateFoot();
}
(async function boot(){
  $('#nav').innerHTML = NAV.map(([k, v]) => '<a href="#/' + k + '" data-r="' + k + '">' + v + '</a>').join('');
  try{
    db = await openDB(); await seedIfEmpty(); await loadSettings();
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // 要求持久化儲存，避免瀏覽器在空間不足時清除資料
    window.addEventListener('hashchange', route);
    await route();
  }catch(e){
    console.error(e);
    main().innerHTML = '<div class="card"><h3>無法啟動</h3><p>' + esc(e.message) + '</p><p class="muted">IndexedDB 無法使用。請確認不是無痕／隱私模式，並允許此頁面儲存資料。</p></div>';
  }
})();
</script>
