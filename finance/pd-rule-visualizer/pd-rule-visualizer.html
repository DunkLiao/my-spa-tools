<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD Rule Visualizer</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e2e6ee;--brand:#2563eb;--brand-ink:#fff;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--code:#0f172a;--code-ink:#e5e7eb;--hover:#eef2ff}
[data-theme=dark]{--bg:#0f1420;--panel:#171e2e;--ink:#e5e7eb;--muted:#94a3b8;--line:#2a3550;--brand:#60a5fa;--brand-ink:#0b1220;--hover:#1e2a44;--code:#0a0f1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h1{font-size:16px;margin:0;padding:14px 14px 4px}
aside .sub{padding:0 14px 10px;color:var(--muted);font-size:12px}
#plist{flex:1;overflow:auto;padding:4px 8px}
.pitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;display:flex;justify-content:space-between;gap:6px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--brand);color:var(--brand-ink)}
.pitem small{opacity:.75}
.aside-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:2px;padding:8px 12px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}
#tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:14px;white-space:nowrap}
#tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
#view{flex:1;overflow:auto;padding:16px}
#status{padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>label{display:flex;gap:6px;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.muted{color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{background:var(--hover)}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.danger{color:var(--err)}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=text],input:not([type]),input[type=number]{min-width:0}
textarea{width:100%;min-height:150px;font-family:Consolas,"Courier New",monospace;font-size:13px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--bg);position:sticky;top:0;font-weight:600;z-index:1}
th[data-act=sort]{cursor:pointer}
table.grid td input{width:100%}
table.grid td input.w-s{width:90px}
table.grid td input.w-m{width:150px}
table.grid td input.w-l{width:230px}
.sub-t{font-size:12px;color:var(--muted);padding-top:2px}
.sub-t.bad{color:var(--err)}
tr.off td{opacity:.45}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;color:#fff}
.b-err{background:var(--err)}.b-warn{background:var(--warn)}.b-ok{background:var(--ok)}.b-info{background:#64748b}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
.kpi b{font-size:22px;display:block}
pre.code{background:var(--code);color:var(--code-ink);padding:12px;border-radius:8px;overflow:auto;max-height:520px;font:12.5px/1.5 Consolas,"Courier New",monospace;white-space:pre}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
svg text{font-family:inherit}
.svgbox{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.warn-box{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
[data-theme=dark] .warn-box{background:#2a1c10;color:#fdba74;border-color:#5b3a1c}
#toast{position:fixed;right:18px;bottom:44px;background:#111827;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;max-width:420px;z-index:9}
#toast.on{opacity:.95}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:190px}.two{grid-template-columns:1fr}}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--err);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>📐 PD Rule Visualizer</h1>
    <div class="sub">離線 · 本機 IndexedDB · 無 API Key · v1.1</div>
    <div id="plist"></div>
    <div class="aside-foot">
      <button class="pri" data-act="newProject">＋ 新增專案</button>
      <button data-act="themeToggle">🌓 切換主題</button>
    </div>
  </aside>
  <main>
    <nav id="tabs"></nav>
    <section id="view"></section>
    <footer id="status"></footer>
  </main>
</div>
<div id="toast"></div>

<script>
'use strict';
// ==ENGINE_START==
/* ============ 核心引擎：純函式，不依賴 DOM ============ */
const DEFAULT_DEFS = { lowerOp: '>=', upperOp: '<' };

function normText(s) {
  return String(s == null ? '' : s).normalize('NFKC')
    .replace(/[≥≧⩾]/g, '>=').replace(/[≤≦⩽]/g, '<=')
    .replace(/=>/g, '>=').replace(/=</g, '<=')
    .replace(/[–—−﹣‐]/g, '-').replace(/[〜∼～]/g, '~').replace(/∞/g, 'inf').trim();
}
function toNum(x) {
  if (x == null) return null;
  const s = String(x).normalize('NFKC').replace(/,/g, '').trim();
  if (s === '') return null;
  return Number(s);
}
function fnum(v) { return String(parseFloat(Number(v).toPrecision(12))); }

function emptyIv(raw) { return { lower: null, lowerOp: null, upper: null, upperOp: null, raw: raw || '', err: null }; }

function parseInterval(text, defs) {
  defs = defs || DEFAULT_DEFS;
  const raw = text == null ? '' : String(text);
  const iv = emptyIv(raw.trim());
  let s = normText(raw);
  if (s === '' || /^(-+|n\/a|na|null|none|無|無限|不限|全部|all|\*)$/i.test(s)) return iv;
  const fail = (m) => { iv.err = m; return iv; };

  // 括號表示法 [a, b) / (a, b]
  let m = s.match(/^([\[\(])\s*([^,;]*?)\s*[,;]\s*([^,;]*?)\s*([\]\)])$/);
  if (m) {
    const pv = (t) => { t = t.trim(); if (t === '' || /^[+-]?inf(inity)?$/i.test(t)) return null; const n = Number(t); return isNaN(n) ? NaN : n; };
    const a = pv(m[2]), b = pv(m[3]);
    if (Number.isNaN(a) || Number.isNaN(b)) return fail('括號區間內有非數字');
    if (a != null) { iv.lower = a; iv.lowerOp = m[1] === '[' ? '>=' : '>'; }
    if (b != null) { iv.upper = b; iv.upperOp = m[4] === ']' ? '<=' : '<'; }
    return validateIv(iv);
  }

  // 千分位逗號（1,000 → 1000）
  s = s.replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
  // 中文敘述
  s = s.replace(/大於等於|不小於|至少/g, '>=').replace(/小於等於|不大於|至多/g, '<=')
       .replace(/大於|超過/g, '>').replace(/小於|未滿|低於/g, '<');
  s = s.replace(/(-?\d+(?:\.\d+)?)\s*以上/g, '>=$1').replace(/(-?\d+(?:\.\d+)?)\s*以下/g, '<=$1');
  // 分隔符：數字或 inf 後面接 - ~ to 至 到 → 視為「至」
  s = s.replace(/(\d|inf)\s*(?:-|~|to|至|到)\s*/gi, '$1 ~ ');

  const re = /(>=|<=|>|<|=)?\s*([+-]?\d+(?:\.\d+)?(?:e[+-]?\d+)?|[+-]?inf(?:inity)?)/gi;
  const toks = []; let mm;
  while ((mm = re.exec(s))) {
    const isInf = /inf/i.test(mm[2]);
    toks.push({ op: mm[1] || null, val: isInf ? null : Number(mm[2]) });
  }
  const left = s.replace(re, '').replace(/and|且|及|[~&,;\s]/gi, '');
  if (left !== '') return fail('無法解析：' + raw.trim());
  if (toks.length === 0) return fail('找不到數字');
  if (toks.length > 2) return fail('數值超過 2 個');
  const isL = (o) => o === '>' || o === '>=';
  const isU = (o) => o === '<' || o === '<=';
  let lo = null, up = null;
  if (toks.length === 1) {
    const t = toks[0];
    if (isL(t.op)) lo = { v: t.val, op: t.op };
    else if (isU(t.op)) up = { v: t.val, op: t.op };
    else { lo = { v: t.val, op: '>=' }; up = { v: t.val, op: '<=' }; }
  } else {
    const [a, b] = toks;
    if (isL(a.op)) {
      lo = { v: a.val, op: a.op };
      if (isL(b.op)) return fail('兩個都是下限');
      up = { v: b.val, op: b.op || defs.upperOp };
    } else if (isU(a.op)) {
      up = { v: a.val, op: a.op };
      if (isU(b.op)) return fail('兩個都是上限');
      lo = { v: b.val, op: b.op || defs.lowerOp };
    } else {
      if (isL(b.op)) return fail('順序不明確，請改用 下限~上限');
      lo = { v: a.val, op: defs.lowerOp };
      up = { v: b.val, op: b.op || defs.upperOp };
    }
  }
  if (lo && lo.v != null) { iv.lower = lo.v; iv.lowerOp = lo.op; }
  if (up && up.v != null) { iv.upper = up.v; iv.upperOp = up.op; }
  return validateIv(iv);
}
function validateIv(iv) {
  if (iv.lower != null && iv.upper != null) {
    if (iv.lower > iv.upper) iv.err = '下限大於上限';
    else if (iv.lower === iv.upper && (iv.lowerOp === '>' || iv.upperOp === '<')) iv.err = '區間為空（上下限相同且含開區間）';
  }
  return iv;
}
function ivBounded(iv) { return iv && (iv.lower != null || iv.upper != null); }
function fmtIv(iv, x) {
  x = x || 'X';
  if (!iv) return '不限';
  if (iv.err) return '⚠ ' + iv.err;
  const L = iv.lower != null, U = iv.upper != null;
  if (!L && !U) return '不限';
  if (L && U && iv.lower === iv.upper) return `${x} = ${fnum(iv.lower)}`;
  const lo = L ? `${fnum(iv.lower)} ${iv.lowerOp === '>=' ? '≤' : '<'} ${x}` : null;
  if (L && U) return `${lo} ${iv.upperOp === '<=' ? '≤' : '<'} ${fnum(iv.upper)}`;
  if (L) return `${x} ${iv.lowerOp === '>=' ? '≥' : '>'} ${fnum(iv.lower)}`;
  return `${x} ${iv.upperOp === '<=' ? '≤' : '<'} ${fnum(iv.upper)}`;
}
function canonIv(iv) {
  if (!iv || iv.err) return iv ? iv.raw : '';
  const p = [];
  if (iv.lower != null) p.push(iv.lowerOp + fnum(iv.lower));
  if (iv.upper != null) p.push(iv.upperOp + fnum(iv.upper));
  return p.join(' & ');
}
function ivKey(iv) { return `${iv.lowerOp || ''}${iv.lower}|${iv.upperOp || ''}${iv.upper}`; }

function matchIv(v, iv) {
  if (!iv || iv.err) return false;
  if (iv.lower == null && iv.upper == null) return true;
  if (v == null || typeof v !== 'number' || !isFinite(v)) return false;
  const okL = iv.lower == null || (iv.lowerOp === '>=' ? v >= iv.lower : v > iv.lower);
  const okU = iv.upper == null || (iv.upperOp === '<=' ? v <= iv.upper : v < iv.upper);
  return okL && okU;
}
function segOk(rule, seg) {
  const rs = (rule.segment == null ? '' : String(rule.segment)).trim();
  if (rs === '') return true;
  return seg != null && String(seg).trim() === rs;
}
function findHits(rules, v1, v2, seg) {
  return rules.filter(r => r.enabled !== false && segOk(r, seg) && matchIv(v1, r.f1) && matchIv(v2, r.f2));
}

/* ---------- 匯入：文字 → 表格 → 規則 ---------- */
function parseDelimited(text, delim) {
  text = String(text).replace(/^\uFEFF/, '');
  if (!delim) {
    const first = text.split(/\r?\n/, 1)[0] || '';
    delim = first.includes('\t') ? '\t' : (first.split(',').length >= first.split(';').length ? ',' : ';');
  }
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"' && cur === '') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function guessMap(headers) {
  const low = headers.map(x => normText(x).toLowerCase().replace(/[\s_]/g, ''));
  const find = (...pats) => low.findIndex(x => pats.some(p => x.includes(p)));
  const m = { ruleNo: find('規則編號', '規則', 'ruleno', 'rule'), pd: find('pd值', 'pd', '違約'), seg: find('分群', '產業', 'segment'), f1: {}, f2: {} };
  [[1, ['因子一', '因子1', 'factor1', 'f1']], [2, ['因子二', '因子2', 'factor2', 'f2']]].forEach(([k, tags]) => {
    const cols = low.map((x, i) => [x, i]).filter(([x]) => tags.some(t => x.includes(t)));
    const f = { iv: -1, lo: -1, up: -1, ops: -1 };
    cols.forEach(([x, i]) => {
      if (/運算|op/.test(x)) { if (f.ops < 0) f.ops = i; }
      else if (/下限|lower|min|low/.test(x)) { if (f.lo < 0) f.lo = i; }
      else if (/上限|upper|max/.test(x)) { if (f.up < 0) f.up = i; }
      else { if (f.iv < 0) f.iv = i; }
    });
    m['f' + k] = f;
  });
  return m;
}
function buildIvFromRow(row, m, defs) {
  const cell = (i) => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
  const ivs = cell(m.iv);
  if (ivs !== '') return parseInterval(ivs, defs);
  const lo = cell(m.lo), up = cell(m.up);
  let lop = defs.lowerOp, uop = defs.upperOp;
  const ops = normText(cell(m.ops)).match(/>=|<=|>|<|=/g) || [];
  ops.forEach(o => { if (o === '>' || o === '>=') lop = o; else if (o === '<' || o === '<=') uop = o; else { lop = '>='; uop = '<='; } });
  const hasOp = (t) => /[<>=]/.test(normText(t));
  const parts = [];
  if (lo !== '') parts.push(hasOp(lo) ? normText(lo) : lop + normText(lo));
  if (up !== '') parts.push(hasOp(up) ? normText(up) : uop + normText(up));
  if (!parts.length) return emptyIv('');
  const iv = parseInterval(parts.join(' & '), defs);
  iv.raw = parts.join(' & ');
  return iv;
}
function buildRules(rows, map, defs) {
  const out = [];
  const body = rows.slice(1);
  body.forEach((row, idx) => {
    if (!row.some(c => String(c).trim() !== '')) return;
    const cell = (i) => (i >= 0 && row[i] != null ? String(row[i]).trim() : '');
    out.push({
      id: 'r' + Math.random().toString(36).slice(2, 9) + idx,
      ruleNo: cell(map.ruleNo) || ('R' + String(out.length + 1).padStart(3, '0')),
      pd: cell(map.pd), segment: cell(map.seg),
      f1: buildIvFromRow(row, map.f1 || {}, defs), f2: buildIvFromRow(row, map.f2 || {}, defs),
      enabled: true, note: ''
    });
  });
  return out;
}

/* ---------- 健檢：座標壓縮 + 2D 差分陣列 ---------- */
function buildAxis(ivs, d) {
  d = d || {};
  const set = new Set();
  ivs.forEach(iv => { if (iv.lower != null) set.add(iv.lower); if (iv.upper != null) set.add(iv.upper); });
  const dmin = d.min != null && isFinite(d.min) ? d.min : null;
  const dmax = d.max != null && isFinite(d.max) ? d.max : null;
  if (dmin != null) set.add(dmin);
  if (dmax != null) set.add(dmax);
  const openLow = ivs.some(iv => iv.lower == null && iv.upper != null), openHigh = ivs.some(iv => iv.upper == null && iv.lower != null);
  const b = [...set].sort((x, y) => x - y), n = b.length;
  const reps = [];
  for (let k = 0; k <= 2 * n; k++) {
    if (k % 2 === 1) reps.push(b[(k - 1) / 2]);
    else if (n === 0) reps.push(0);
    else if (k === 0) reps.push(b[0] - 1);
    else if (k === 2 * n) reps.push(b[n - 1] + 1);
    else reps.push((b[k / 2 - 1] + b[k / 2]) / 2);
  }
  // 未設定有效範圍時：預設為端點的最小~最大值；若有規則明確延伸到無限遠（只有上限或只有下限），該側也納入檢查
  const s0 = dmin != null ? 2 * b.indexOf(dmin) + 1 : (n > 0 ? (openLow ? 0 : 1) : 0);
  const s1 = dmax != null ? 2 * b.indexOf(dmax) + 1 : (n > 0 ? (openHigh ? 2 * n : 2 * n - 1) : 0);
  return { b, n, reps, s0, s1: Math.max(s0, s1) };
}
function segIndex(ax, v) {
  const b = ax.b; let j = 0;
  while (j < b.length && b[j] < v) j++;
  if (j < b.length && b[j] === v) return 2 * j + 1;
  return 2 * j;
}
function rangeDesc(ax, a, z) {
  const b = ax.b, n = ax.n;
  if (a === z && a % 2 === 1) return '= ' + fnum(b[(a - 1) / 2]);
  const lo = a % 2 === 1 ? `[${fnum(b[(a - 1) / 2])}` : (a === 0 ? '(-∞' : `(${fnum(b[a / 2 - 1])}`);
  const up = z % 2 === 1 ? `${fnum(b[(z - 1) / 2])}]` : (z === 2 * n ? '∞)' : `${fnum(b[z / 2])})`);
  return `${lo}, ${up}`;
}
function mergeCells(cells) { // cells: [c,r]，需依 r、c 排序
  const runs = [];
  for (const [c, r] of cells) {
    const last = runs[runs.length - 1];
    if (last && last.y === r && last.x1 === c - 1) last.x1 = c; else runs.push({ x0: c, x1: c, y: r });
  }
  const out = []; let curY = -9, cur = new Map(), prev = new Map();
  for (const ru of runs) {
    if (ru.y !== curY) { prev = (ru.y === curY + 1) ? cur : new Map(); cur = new Map(); curY = ru.y; }
    const key = ru.x0 + '_' + ru.x1, p = prev.get(key);
    if (p) { p.y1 = ru.y; cur.set(key, p); }
    else { const rc = { x0: ru.x0, x1: ru.x1, y0: ru.y, y1: ru.y }; out.push(rc); cur.set(key, rc); }
  }
  return out;
}
function buildGrid(rules, dom) {
  dom = dom || {};
  const ax = buildAxis(rules.map(r => r.f1), dom.f1), ay = buildAxis(rules.map(r => r.f2), dom.f2);
  const W = ax.s1 - ax.s0 + 1, H = ay.s1 - ay.s0 + 1;
  if (W * H > 4000000) return { tooBig: true, ax, ay, W, H, rules, rects: [], cnt: new Int32Array(0) };
  const rangeOf = (axis, iv) => {
    let a = -1, z = -1;
    for (let k = axis.s0; k <= axis.s1; k++) if (matchIv(axis.reps[k], iv)) { if (a < 0) a = k; z = k; }
    return a < 0 ? null : [a, z];
  };
  const stride = W + 1, diff = new Int32Array(stride * (H + 1)), rects = [];
  rules.forEach(r => {
    const xr = rangeOf(ax, r.f1), yr = rangeOf(ay, r.f2);
    if (!xr || !yr) return;
    const x0 = xr[0] - ax.s0, x1 = xr[1] - ax.s0, y0 = yr[0] - ay.s0, y1 = yr[1] - ay.s0;
    rects.push({ r, x0, x1, y0, y1 });
    diff[y0 * stride + x0]++; diff[y0 * stride + x1 + 1]--; diff[(y1 + 1) * stride + x0]--; diff[(y1 + 1) * stride + x1 + 1]++;
  });

      const key = hit.map(t => t.r.id).join('||');

const DB = {
  db: null, useMem: false, mem: { projects: new Map(), versions: new Map(), testSets: new Map(), settings: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('pd_rule_visualizer', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          d.createObjectStore('projects', { keyPath: 'id' });
          d.createObjectStore('versions', { keyPath: 'id' }).createIndex('projectId', 'projectId');
          d.createObjectStore('testSets', { keyPath: 'id' }).createIndex('projectId', 'projectId');

  _do(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.useMem ? Promise.resolve([...this.mem[s].values()]) : this._do(s, 'readonly', o => o.getAll()); },
  get(s, k) { return this.useMem ? Promise.resolve(this.mem[s].get(k)) : this._do(s, 'readonly', o => o.get(k)); },
  put(s, v) { if (this.useMem) { this.mem[s].set(v.id != null ? v.id : v.key, JSON.parse(JSON.stringify(v))); return Promise.resolve(); } return this._do(s, 'readwrite', o => o.put(JSON.parse(JSON.stringify(v)))); },

function renderMatrix(grid, nm, opt) {

    return `<div class="card"><h3>「${esc(v.name)}」 → 目前版本 差異</h3><p>新增 ${d.added.length}（${esc(d.added.join('、') || '—')}）　刪除 ${d.removed.length}（${esc(d.removed.join('、') || '—')}）　修改 ${d.changed.length}</p>
    ${d.changed.length ? `<div class="tblwrap"><table><thead><tr><th>規則</th><th>原（啟用|PD|分群|因子一|因子二）</th><th>現</th></tr></thead><tbody>${d.changed.map(c => `<tr><td>${esc(c.no)}</td><td>${esc(c.from)}</td><td>${esc(c.to)}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`; })() : '';
  return `<div class="tblwrap"><table><thead><tr><th>快照名稱</th><th>時間</th><th>規則數</th><th></th></tr></thead><tbody>${V.map(v => `<tr data-vid="${v.id}"><td>${esc(v.name)}</td><td>${new Date(v.createdAt).toLocaleString()}</td><td>${v.rules.length}</td><td><button class="sm" data-act="verDiff">與目前比較</button> <button class="sm" data-act="verRestore">還原</button> <button class="sm danger" data-act="verDel">刪除</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">尚無快照</td></tr>'}</tbody></table></div>${diff}`;
}
function viewProject() {
  const p = S.cur, d = p.domain || { f1: {}, f2: {} };
  const dv = (x) => x == null ? '' : x;
  return `<div class="two"><div class="card"><h3>專案設定</h3>
  <div class="row"><label>專案名稱 <input data-chg="projName" value="${esc(p.name)}" style="width:220px"></label></div>
  <div class="row"><label>因子一名稱 <input data-chg="fname0" value="${esc(p.factorNames[0])}" style="width:140px"></label><label>因子二名稱 <input data-chg="fname1" value="${esc(p.factorNames[1])}" style="width:140px"></label></div>
  <h3 style="margin-top:14px">因子有效範圍（用於缺口判斷，選填）</h3>
  <div class="row"><label>${esc(p.factorNames[0])} 最小 <input data-chg="dom" data-k="f1.min" value="${dv(d.f1 && d.f1.min)}" style="width:80px"></label><label>最大 <input data-chg="dom" data-k="f1.max" value="${dv(d.f1 && d.f1.max)}" style="width:80px"></label></div>
  <div class="row"><label>${esc(p.factorNames[1])} 最小 <input data-chg="dom" data-k="f2.min" value="${dv(d.f2 && d.f2.min)}" style="width:80px"></label><label>最大 <input data-chg="dom" data-k="f2.max" value="${dv(d.f2 && d.f2.max)}" style="width:80px"></label></div>
  <p class="muted">範圍為閉區間 [最小, 最大]，例如 0 ~ 1。留空則以規則端點的最小~最大值為範圍（若有規則只設上限或只設下限，該側視為延伸到無限遠，也會檢查）。</p>
  <h3 style="margin-top:14px">區間字串預設運算子</h3>
  <div class="row"><label>下限 <select data-chg="defL"><option value="&gt;=" ${S.settings.lowerOp === '>=' ? 'selected' : ''}>&gt;=</option><option value="&gt;" ${S.settings.lowerOp === '>' ? 'selected' : ''}>&gt;</option></select></label>
  <label>上限 <select data-chg="defU"><option value="&lt;" ${S.settings.upperOp === '<' ? 'selected' : ''}>&lt;</option><option value="&lt;=" ${S.settings.upperOp === '<=' ? 'selected' : ''}>&lt;=</option></select></label></div>
  <p class="muted">套用於「0.35 - 0.9」這類未標明運算子的寫法（下次解析起生效）。「0.35 - &lt;0.9」這類有標明者不受影響。</p>
  <div class="bar" style="margin-top:12px"><button data-act="dupProject">複製專案</button><button class="danger" data-act="delProject">刪除專案</button></div></div>
  <div class="card"><h3>備份與還原</h3><div class="bar"><button data-act="expProject">匯出此專案 JSON</button><button data-act="expAll">匯出全部（含快照與測試案例）</button></div>
  <p class="muted">匯入 JSON 請至「① 匯入」貼上，或：</p><input type="file" accept=".json" data-chg="jsonFile">
  <h3 style="margin-top:16px">版本快照</h3><div class="bar"><input id="verName" placeholder="快照名稱（選填）" style="width:200px"><button class="pri" data-act="verSave">建立快照</button></div><div id="verBox">${versionsHtml()}</div></div></div>`;
}
CHG.projName = el => { S.cur.name = el.value.trim() || '未命名'; touch(); };
CHG.fname0 = el => { S.cur.factorNames[0] = el.value.trim() || '因子一'; touch(); };
CHG.fname1 = el => { S.cur.factorNames[1] = el.value.trim() || '因子二'; touch(); };
CHG.dom = el => { const [f, k] = el.dataset.k.split('.'); const v = toNum(el.value); (S.cur.domain = S.cur.domain || { f1: {}, f2: {} })[f] = S.cur.domain[f] || {}; S.cur.domain[f][k] = (v == null || isNaN(v)) ? null : v; touch(); };
CHG.defL = el => { S.settings.lowerOp = el.value; saveSettings(); };
CHG.defU = el => { S.settings.upperOp = el.value; saveSettings(); };
CHG.jsonFile = async el => { const f = el.files[0]; if (f) { try { await importJson(await readFileText(f)); } catch (e) { toast('JSON 匯入失敗：' + e.message); } } };
ACT.verSave = async () => {
  const name = ($('#verName').value || '').trim() || new Date().toLocaleString();
  await DB.put('versions', { id: 'v' + uid(), projectId: S.cur.id, name, createdAt: Date.now(), rules: JSON.parse(JSON.stringify(S.cur.rules)), factorNames: S.cur.factorNames.slice(), domain: JSON.parse(JSON.stringify(S.cur.domain || {})) });
  toast('已建立快照'); await loadVersions();
};
ACT.verDiff = el => { S.diffId = el.closest('tr').dataset.vid; $('#verBox').innerHTML = versionsHtml(); };
ACT.verRestore = async el => {
  const v = S.versions.find(x => x.id === el.closest('tr').dataset.vid); if (!v || !confirm('以此快照覆蓋目前規則？（建議先建立快照）')) return;
  S.cur.rules = JSON.parse(JSON.stringify(v.rules)); S.cur.factorNames = v.factorNames || S.cur.factorNames; if (v.domain) S.cur.domain = v.domain; touch(); render(); toast('已還原');
};
ACT.verDel = async el => { await DB.del('versions', el.closest('tr').dataset.vid); S.diffId = ''; await loadVersions(); };
ACT.expProject = async () => download(`${S.cur.name}.pdrv.json`, JSON.stringify({ app: 'PDRuleVisualizer', projects: [S.cur], versions: await DB.byProject('versions', S.cur.id), testSets: await DB.byProject('testSets', S.cur.id) }, null, 1), 'application/json');
ACT.expAll = async () => download(`PDRuleVisualizer_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'PDRuleVisualizer', projects: S.projects, versions: await DB.all('versions'), testSets: await DB.all('testSets') }, null, 1), 'application/json');
ACT.dupProject = async () => { const p = JSON.parse(JSON.stringify(S.cur)); p.id = 'p' + uid(); p.name += '（複本）'; p.updatedAt = Date.now(); await DB.put('projects', p); S.projects.push(p); await openProject(p.id); };
ACT.delProject = async () => {
  if (!confirm(`確定刪除專案「${S.cur.name}」及其快照？此動作無法復原。`)) return;
  const id = S.cur.id; await DB.del('projects', id); await DB.del('testSets', id);
  for (const v of await DB.byProject('versions', id)) await DB.del('versions', v.id);
  S.projects = S.projects.filter(p => p.id !== id);
  if (!S.projects.length) { const p = newProject('新專案'); S.projects.push(p); await DB.put('projects', p); }
  await openProject(S.projects[0].id);
};

/* ============ 專案切換 / 全域事件 ============ */
async function openProject(id) {
  S.cur = S.projects.find(p => p.id === id); S.analysis = null; S.diffId = ''; S.viz.group = ''; S.hgroup = ''; S.filter = ''; S.hfilter = '';
  S.imp.table = null; S.imp.map = null; S.imp.text = '';
  S.batch.table = null; S.batch.result = null; S.batch.text = ''; S.batch.filter = '';
  S.test.v1 = S.test.v2 = S.test.seg = '';
  if (!S.cur.domain) S.cur.domain = { f1: {}, f2: {} };
  const ts = await DB.get('testSets', S.cur.id); S.test.cases = ts ? ts.cases : [];
  S.settings.lastId = id; saveSettings(); render();
}
ACT.openProject = el => openProject(el.dataset.id);
ACT.tab = el => { S.tab = el.dataset.k; render(); };
ACT.newProject = async () => { const name = prompt('專案名稱', '新專案'); if (!name) return; const p = newProject(name); S.projects.push(p); await DB.put('projects', p); await openProject(p.id); S.tab = 'import'; render(); };
ACT.themeToggle = () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); render(); };
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });

async function boot() {
  await DB.open();
  try { const st = await DB.get('settings', 'app'); if (st) Object.assign(S.settings, st.value); } catch (e) { }
  applyTheme();
  S.projects = await DB.all('projects');
  if (!S.projects.length) { const p = newProject('示範專案', true); S.projects.push(p); await DB.put('projects', p); }
  const last = S.projects.find(p => p.id === S.settings.lastId) || S.projects[0];
  await openProject(last.id);
}
if (typeof document !== 'undefined' && typeof window !== 'undefined' && !window.__PD_TEST__) boot();
</script>
