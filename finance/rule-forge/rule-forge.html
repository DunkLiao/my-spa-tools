<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rule Forge｜監理檢核規則鑄造台</title>
<style>
:root{
  --bg:#f4f5f8;--panel:#fff;--panel2:#f8f9fc;--text:#1d2433;--muted:#6b7488;--line:#dfe3ec;
  --brand:#3b5bdb;--brand-d:#2f49b0;--brand-s:#e7ecff;--ok:#2b8a3e;--ok-s:#e3f6e8;
  --warn:#b26a00;--warn-s:#fff3d6;--err:#c92a2a;--err-s:#ffe3e3;--info:#1971c2;--info-s:#e1efff;
  --code-bg:#0f1629;--code-fg:#e6eaf5;--c-kw:#7aa2ff;--c-str:#9be28f;--c-cm:#7d8bad;--c-par:#ffc66b;
  --radius:8px;--shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05);
}
[data-theme="dark"]{
  --bg:#12151d;--panel:#1b2030;--panel2:#212840;--text:#e7eaf3;--muted:#98a2bb;--line:#2e3650;
  --brand:#748ffc;--brand-d:#91a7ff;--brand-s:#262f55;--ok:#69db7c;--ok-s:#1d3a27;
  --warn:#ffc078;--warn-s:#3d3017;--err:#ff8787;--err-s:#431f24;--info:#74c0fc;--info-s:#1b3248;
  --code-bg:#0a0e1a;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
#app{display:grid;grid-template-columns:208px 1fr;grid-template-rows:52px 1fr;height:100vh}
header.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .logo{font-weight:700;font-size:16px;letter-spacing:.3px}
header.top .logo span{color:var(--brand)}
header.top .sp{flex:1}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
nav.side a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--text);margin-bottom:2px}
nav.side a:hover{background:var(--panel2);text-decoration:none}
nav.side a.on{background:var(--brand-s);color:var(--brand-d);font-weight:600}
nav.side a .n{margin-left:auto;font-size:11px;color:var(--muted)}
main#main{overflow:auto;padding:18px 22px 60px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:Consolas,"Courier New",monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2:first-child{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--err)}.btn.danger:hover{border-color:var(--err)}
.btn.sm{padding:2px 8px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-s)}
textarea{resize:vertical;min-height:60px;font-family:Consolas,"Courier New",monospace;font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.fld{margin-bottom:10px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:1px 2px 1px 0}
.chip.on{background:var(--brand-s);border-color:var(--brand);color:var(--brand-d)}
.chip.btnlike{cursor:pointer;user-select:none}
.sev{display:inline-block;padding:0 7px;border-radius:4px;font-size:11px;font-weight:600}
.sev.HIGH,.sev.ERROR{background:var(--err-s);color:var(--err)}.sev.MEDIUM,.sev.WARN{background:var(--warn-s);color:var(--warn)}
.sev.LOW,.sev.INFO{background:var(--info-s);color:var(--info)}
.st{display:inline-block;padding:0 7px;border-radius:4px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}
.st.ACTIVE,.st.DONE{background:var(--ok-s);color:var(--ok);border-color:transparent}.st.DRAFT,.st.OPEN{background:var(--warn-s);color:var(--warn);border-color:transparent}
.st.DEPRECATED{color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:hover td{background:var(--panel2)}
table.tbl td input[type=text],table.tbl td select{padding:3px 6px}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.bar{height:8px;background:var(--brand);border-radius:4px;min-width:2px}
.barrow{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* builder */
.bgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.sticky{position:sticky;top:0}
pre.sql{margin:0;background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:6px;overflow:auto;max-height:50vh;font:12.5px/1.55 Consolas,"Courier New",monospace;white-space:pre}
pre.sql .sq-kw{color:var(--c-kw);font-weight:600}pre.sql .sq-st{color:var(--c-str)}pre.sql .sq-cm{color:var(--c-cm)}pre.sql .sq-pa{color:var(--c-par)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:3px 12px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;margin:6px 0;background:var(--panel2)}
.grp.or{border-left-color:#e67700}
.grp.off,.cond.off{opacity:.5}
.grp-head{display:flex;gap:6px;align-items:center;padding:5px 8px;flex-wrap:wrap}
.grp-body{padding:2px 8px 8px 12px}
.grp-head select{width:auto}
.cond{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;padding:6px;margin:4px 0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.cond.dragover,.grp-head.dragover{outline:2px dashed var(--brand)}
.drag{cursor:grab;color:var(--muted);padding:2px 4px;user-select:none}
.cond .c-field{width:150px}.cond .c-op{width:128px}.cond .c-vt{width:78px}.cond .c-k{width:96px}
.cond .c-val{flex:1;min-width:180px;display:flex;gap:4px;flex-wrap:wrap}
.cond .c-val textarea{min-height:34px;height:34px}
.mod{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding-top:6px}
.mod input[type=text]{width:60px}
.lint{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.lint code{font-size:11px}
/* layout bits */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.list{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);max-height:72vh;overflow:auto}
.list .it{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:hover{background:var(--panel2)}.list .it.on{background:var(--brand-s)}
.diff{font:12px/1.5 Consolas,monospace;white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:42vh;overflow:auto}
.diff div{padding:0 8px}.diff .a{background:var(--ok-s)}.diff .d{background:var(--err-s)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg{background:var(--panel);border-radius:10px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg.wide{max-width:980px}
.dlg>h2{padding:14px 18px 0;margin:0}
.dlg .bd{padding:12px 18px;overflow:auto}
.dlg .ft{padding:10px 18px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#1d2433;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px;font-size:13px}
.toast.err{background:#c92a2a}.toast.ok{background:#2b8a3e}.toast.warn{background:#b26a00}
.note{padding:8px 12px;border-radius:6px;background:var(--info-s);color:var(--info);font-size:13px;margin-bottom:10px}
.note.warn{background:var(--warn-s);color:var(--warn)}.note.err{background:var(--err-s);color:var(--err)}
.kbd{font:11px Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2)}
@media(max-width:1100px){.bgrid,.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#app{grid-template-columns:1fr}nav.side{display:none}header.top{grid-column:1}}
@media print{nav.side,header.top{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">⚒ Rule <span>Forge</span></div>
    <span class="muted small">監理檢核規則鑄造台</span>
    <div class="sp"></div>
    <span id="hdrSchema" class="chip" title="預設 Schema（可在設定修改）"></span>
    <button class="btn sm" id="btnTheme" title="切換深色／淺色">🌓</button>
    <button class="btn sm" id="btnHelp" title="快捷鍵">?</button>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="empty">載入中…</div></main>
</div>
<div id="toasts"></div>
<noscript>需要啟用 JavaScript。</noscript>
<script>
'use strict';
/* ============================================================
 * Rule Forge v1.2  —  單檔 SPA（Vanilla JS + IndexedDB，離線、無 API Key）
 * ============================================================ */
const APP_VERSION = '1.2.1';
const DB_NAME = 'rule_forge_db';
const DB_VERSION = 3;
const SCHEMA_VERSION = 3;

/* ---------- utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowISO = () => new Date().toISOString();
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const sortBy = (arr, f, dir) => arr.slice().sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * (dir || 1); });
const csvList = s => String(s || '').split(/[,，;；\n]+/).map(x => x.trim()).filter(Boolean);

function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function toast(msg, type, ms) {
  const d = document.createElement('div'); d.className = 'toast ' + (type || ''); d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(() => d.remove(), ms || 3200);
}
function readFile(file) { /* 先以 UTF-8 嚴格解碼；失敗時改用 Big5（繁中 Excel 另存的 CSV 常見編碼） */
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const buf = r.result; readFile.enc = 'utf-8';
      try { res(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
      catch (e) { try { const t = new TextDecoder('big5').decode(buf); readFile.enc = 'big5'; res(t); } catch (e2) { res(new TextDecoder('utf-8').decode(buf)); } }
    };
    r.onerror = () => rej(r.error); r.readAsArrayBuffer(file);
  });
}
function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept || '';
    i.onchange = () => res(i.files && i.files[0] || null);
    i.addEventListener('cancel', () => res(null)); i.click();
  });
}
function stable(o) { return JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => { a[x] = v[x]; return a; }, {}) : v)); }
const pad = (n, w) => String(n).padStart(w, '0');

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const rows = []; let row = [], cur = '', q = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
    i++;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function toCSV(rows) {
  return '\uFEFF' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
}

/* ---------- line diff (LCS) ---------- */
function lineDiff(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 4000000) { return a.map(x => ({ t: 'd', s: x })).concat(b.map(x => ({ t: 'a', s: x }))); }
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: '=', s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push({ t: 'd', s: a[i++] });
    else out.push({ t: 'a', s: b[j++] });
  }
  while (i < n) out.push({ t: 'd', s: a[i++] });
  while (j < m) out.push({ t: 'a', s: b[j++] });
  return out;
}

/* ---------- modal ---------- */
function modal(o) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'ov';
    const btns = (o.buttons || [{ label: '關閉', value: null }]);
    ov.innerHTML = `<div class="dlg ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true"><h2>${esc(o.title || '')}</h2><div class="bd">${o.html || ''}</div><div class="ft">${btns.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);
    const close = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(v); };
    const collect = () => o.collect ? o.collect(ov) : undefined;
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(undefined); } };
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('mousedown', e => { if (e.target === ov && !o.sticky) close(undefined); });
    ov.querySelectorAll('.ft button').forEach(b => b.addEventListener('click', async () => {
      const spec = btns[+b.dataset.i];
      if (spec.validate) { const msg = spec.validate(ov); if (msg) { toast(msg, 'err'); return; } }
      const data = spec.value === undefined ? undefined : collect();
      close(spec.value === null ? null : { value: spec.value, data });
    }));
    if (o.onOpen) o.onOpen(ov, close);
    const f = ov.querySelector('[autofocus],input[type=text],textarea,select'); if (f) f.focus();
  });
}
async function confirmBox(msg, okLabel, danger) {
  const r = await modal({ title: '確認', html: `<p style="white-space:pre-wrap">${esc(msg)}</p>`, buttons: [{ label: '取消', value: null }, { label: okLabel || '確定', value: 'ok', cls: danger ? 'danger' : 'primary' }] });
  return !!(r && r.value === 'ok');
}

/* ---------- IndexedDB ---------- */
const STORES = ['rules', 'ruleVersions', 'findings', 'tables', 'fields', 'valueSets', 'settings', 'auditLog'];
let DB = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ev => {
      const db = req.result, tx = req.transaction, old = ev.oldVersion;
      if (old < 1) {
        const r = db.createObjectStore('rules', { keyPath: 'ruleId' });
        ['category', 'severity', 'status', 'findingId', 'updatedAt'].forEach(k => r.createIndex(k, k));
        r.createIndex('tags', 'tags', { multiEntry: true });
        const v = db.createObjectStore('ruleVersions', { keyPath: 'versionId' }); v.createIndex('ruleId', 'ruleId'); v.createIndex('createdAt', 'createdAt');
        const f = db.createObjectStore('findings', { keyPath: 'findingId' }); f.createIndex('exposureType', 'exposureType'); f.createIndex('status', 'status');
        const t = db.createObjectStore('tables', { keyPath: 'tableKey' }); t.createIndex('schema', 'schema');
        const fl = db.createObjectStore('fields', { keyPath: 'fieldKey' }); fl.createIndex('tableKey', 'tableKey'); fl.createIndex('fieldName', 'fieldName');
        const vs = db.createObjectStore('valueSets', { keyPath: 'setId' }); vs.createIndex('name', 'name');
        db.createObjectStore('settings', { keyPath: 'key' });
        const a = db.createObjectStore('auditLog', { keyPath: 'logId', autoIncrement: true }); a.createIndex('entityId', 'entityId'); a.createIndex('at', 'at');
      }
      if (old < 2) { /* v1 -> v2：targetSchema / defaultSchema / identifierCase */
        const rs = tx.objectStore('rules');
        rs.openCursor().onsuccess = e => { const c = e.target.result; if (c) { const r = c.value; if (!('targetSchema' in r)) { r.targetSchema = null; c.update(r); } c.continue(); } };
        const st = tx.objectStore('settings');
        st.put({ key: 'defaultSchema', value: 'bis' }); st.put({ key: 'identifierCase', value: 'lower' });
      }
      if (old < 3) { /* v2 -> v3：schemaList */
        const st = tx.objectStore('settings');
        const list = [{ name: 'bis', label: 'BIS 資本適足', builtin: true }, { name: 'irb_dw', label: 'IRB 資料倉儲', builtin: true }];
        tx.objectStore('tables').openCursor().onsuccess = e => {
          const c = e.target.result;
          if (c) { const n = String(c.value.schema || '').toLowerCase(); if (n && !list.some(s => s.name === n)) list.push({ name: n, label: n, builtin: false }); c.continue(); }
          else st.put({ key: 'schemaList', value: list });
        };
      }
    };

const LIB = { q: '', cat: '', sev: '', status: '', schema: '', finding: '', sort: 'updatedAt', dir: -1, sel: new Set(), limit: 200 };
function libFiltered() {
  const q = LIB.q.trim().toLowerCase();
  let a = S.rules.filter(r => {
    if (LIB.cat && r.category !== LIB.cat) return false; if (LIB.sev && r.severity !== LIB.sev) return false;
    if (LIB.status && r.status !== LIB.status) return false; if (LIB.schema && effSchema(r).toLowerCase() !== LIB.schema) return false;
    if (LIB.finding && (LIB.finding === '__none__' ? r.findingId : r.findingId !== LIB.finding)) return false;
    if (!q) return true;
    return (r.ruleId + ' ' + r.ruleName + ' ' + (r.description || '') + ' ' + (r.tags || []).join(' ') + ' ' + r.targetTable + ' ' + (r.expected || '') + ' ' + (r.regulationRef || '') + ' ' + (r.findingId || '')).toLowerCase().includes(q);
  });
  const key = { updatedAt: r => r.updatedAt || '', ruleId: r => r.ruleId, severity: r => SEVERITIES.indexOf(r.severity), status: r => r.status, ruleName: r => r.ruleName || '' }[LIB.sort] || (r => r.updatedAt);
  return sortBy(a, key, LIB.dir);
}

const FD_STATUS = ['OPEN', 'IN_PROGRESS', 'DONE'];

/* ---------- Finding Registry ---------- */
function nextFindingId(seq) {
  if (seq != null && seq !== '' && !isNaN(+seq)) { const id = 'FD-' + pad(+seq, 3); if (!S.findingMap.has(id)) return id; }
  let max = 0; S.findings.forEach(f => { const m = /^FD-(\d+)$/.exec(f.findingId); if (m) max = Math.max(max, +m[1]); });
  return 'FD-' + pad(max + 1, 3);
}
async function saveFinding(f, linkedIds) {
  const ops = [{ store: 'findings', op: 'put', val: f }];
  S.rules.forEach(r => {
    const should = linkedIds.includes(r.ruleId), is = r.findingId === f.findingId;
    if (should !== is) { const c = clone(r); c.findingId = should ? f.findingId : ''; c.updatedAt = nowISO(); ops.push({ store: 'rules', op: 'put', val: c }); }
  });
  await idb.multi(ops); await reload(['findings', 'rules']); await refreshFindingLinks(); await audit('save', 'finding', f.findingId, ''); await bumpSaveCount();
}

const FLD = { schema: '', q: '', fq: '' };
async function ensureSchemaInList(name) {
  if (!RE_IDENT.test(name)) return;
  const l = getSet('schemaList'); if (!l.some(s => s.name.toLowerCase() === name.toLowerCase())) { l.push({ name: name.toLowerCase(), label: name.toLowerCase(), builtin: false }); await setSet('schemaList', l); }
}
async function importDDLText(text, fallbackSchema) {
  const all = parseDDL(text, fallbackSchema);
  const parsed = all.filter(t => RE_IDENT.test(t.schema || fallbackSchema || '') && RE_IDENT.test(t.table));   /* schema／表名含特殊字元者略過，避免之後產生不合法 SQL */
  const skipped = all.length - parsed.length;
  if (!parsed.length) return { tables: 0, fields: 0, skipped };
  const ops = []; let nf = 0;
  for (const t of parsed) {
    if (!t.schema) t.schema = String(fallbackSchema).toLowerCase();
    await ensureSchemaInList(t.schema);
    const key = tkey(t.schema, t.table), old = S.tableMap.get(key);
    const oldF = new Map((S.fieldsByTable.get(key) || []).map(x => [x.fieldName, x]));
    ops.push({ store: 'tables', op: 'put', val: { tableKey: key, schema: t.schema, table: t.table, label: old ? old.label : '', note: t.comment || (old ? old.note : ''), source: 'ddl', updatedAt: nowISO() } });
    oldF.forEach(x => ops.push({ store: 'fields', op: 'del', key: x.fieldKey }));
    t.fields.forEach((f, i) => {
      const o = oldF.get(f.fieldName); nf++;
      ops.push({ store: 'fields', op: 'put', val: { fieldKey: key + '.' + f.fieldName, tableKey: key, fieldName: f.fieldName, dataType: f.dataType, length: f.length, precision: f.precision, scale: f.scale, nullable: f.nullable, isPk: !!f.isPk, fk: f.fk || '', label: (o && o.label) || f.comment || '', note: o ? o.note : '', enumValues: o ? o.enumValues : [], ordinal: i + 1 } });
    });
  }
  await idb.multi(ops); await reload(['tables', 'fields', 'settings']); await audit('import', 'ddl', '', parsed.length + ' 張表');

}

/* ---------- Value Sets ---------- */
function slugId(name) { return 'VS-' + String(name).trim().toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
function rulesUsingSet(id) { return S.rules.filter(r => { let hit = false; walkTree(r.condition, n => { if (n.type === 'cond' && n.value && n.value.kind === 'valueSet' && n.value.setId === id) hit = true; }); return hit; }); }
const VSD = { draft: null, dirty: false };
function viewValueSets(setId, keep) {
  const cur = setId ? S.vsMap.get(setId) : null;
  if (!keep || !VSD.draft || VSD.draft.setId !== (cur && cur.setId)) { VSD.draft = cur ? clone(cur) : null; VSD.dirty = false; }

/* ---------- 匯入 ---------- */
const KEYOF = { findings: 'findingId', valueSets: 'setId', rules: 'ruleId', ruleVersions: 'versionId', tables: 'tableKey', fields: 'fieldKey' };
const STORE_LABEL = { valueSets: 'Value Sets', findings: '缺失態樣', rules: '規則', ruleVersions: '規則版本', tables: '資料表', fields: '欄位' };
function existingOf(st, all) { return st === 'rules' ? S.rulesMap : st === 'findings' ? S.findingMap : st === 'valueSets' ? S.vsMap : st === 'tables' ? S.tableMap : st === 'fields' ? new Map(S.fields.map(x => [x.fieldKey, x])) : new Map((all[st] || []).map(x => [x[KEYOF[st]], x])); }
function normalizePayload(p) {
  const st = p.stores || {}; const out = {}; let skipped = 0;
  const obj = x => x && typeof x === 'object' && !Array.isArray(x);
  const keep = (k, test) => { const arr = Array.isArray(st[k]) ? st[k] : []; out[k] = arr.filter(x => { const ok = obj(x) && test(x); if (!ok) skipped++; return ok; }); };
  const str = x => typeof x === 'string' && x.trim() !== '';
  STORES.forEach(k => { out[k] = []; });
  keep('rules', x => typeof x.ruleId === 'string' && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(x.ruleId));
  keep('findings', x => str(x.findingId));
  keep('valueSets', x => str(x.setId));
  keep('tables', x => str(x.tableKey) && RE_IDENT.test(String(x.schema || '')) && RE_IDENT.test(String(x.table || '')));
  keep('fields', x => str(x.fieldKey) && str(x.tableKey) && str(x.fieldName));
  keep('ruleVersions', x => str(x.versionId) && str(x.ruleId));
  keep('settings', x => str(x.key));
  keep('auditLog', x => true);
  out.rules = out.rules.map(r => normalizeRule(clone(r)));
  out.findings = out.findings.map(f => Object.assign({}, f, { seqNo: f.seqNo == null ? '' : f.seqNo, exposureType: String(f.exposureType || ''), description: String(f.description || ''), correctTreatment: String(f.correctTreatment || ''), wrongTreatment: String(f.wrongTreatment || ''), status: FD_STATUS.includes(f.status) ? f.status : 'OPEN', ruleIds: Array.isArray(f.ruleIds) ? f.ruleIds.map(String) : [] }));
  out.valueSets = out.valueSets.map(v => Object.assign({}, v, { name: String(v.name || v.setId), valueType: v.valueType === 'NUMBER' ? 'NUMBER' : 'STRING', renderMode: v.renderMode === 'CTE' ? 'CTE' : 'IN_LIST', items: (Array.isArray(v.items) ? v.items : []).filter(obj).map(i => ({ value: i.value == null ? '' : String(i.value), label: i.label == null ? '' : String(i.label) })) }));
  const tk = new Set(out.tables.map(t => t.tableKey));   /* 欄位必須屬於檔案內或現有的表，否則視為孤兒略過 */
  out.fields = out.fields.filter(f => { const ok = tk.has(f.tableKey) || S.tableMap.has(f.tableKey); if (!ok) skipped++; return ok; });
  out._skipped = skipped;
  return out;
}
async function sanitizeSettings() {   /* 匯入後確保設定值合法，避免之後產生不合法 SQL */
  const l = (getSet('schemaList') || []).filter(s => s && RE_IDENT.test(String(s.name || ''))).map(s => ({ name: String(s.name).toLowerCase(), label: String(s.label || s.name), builtin: !!s.builtin }));
  const seen = new Set(); const dedup = l.filter(s => (seen.has(s.name) ? false : (seen.add(s.name), true)));
  await setSet('schemaList', dedup);
  if (!RE_IDENT.test(String(getSet('defaultSchema') || ''))) await setSet('defaultSchema', 'bis');
  if (!['lower', 'upper', 'preserve'].includes(getSet('identifierCase'))) await setSet('identifierCase', 'lower');
  if (!['oracle', 'ansi'].includes(getSet('dialect'))) await setSet('dialect', 'oracle');
  if (!['auto', 'light', 'dark'].includes(getSet('theme'))) await setSet('theme', 'auto');
  if (!Number.isFinite(Number(getSet('backupEvery'))) || Number(getSet('backupEvery')) < 0) await setSet('backupEvery', 20);
  await ensureSchemaDefaults();
}
function analyze(inc, all) {
  const res = {};
  Object.keys(KEYOF).forEach(st => {
    const ex = existingOf(st, all), cmpKey = st === 'rules' ? ruleCoreJson : stable; let nw = 0, same = 0; const conf = [];
    inc[st].forEach(x => { const e = ex.get(x[KEYOF[st]]); if (!e) nw++; else if (cmpKey(e) === cmpKey(x)) same++; else conf.push(x[KEYOF[st]]); });
    res[st] = { total: inc[st].length, nw, same, conf };
  }); return res;
}
async function syncSchemaList() {
  const l = getSet('schemaList'); let ch = false;
  const add = n => { n = String(n || '').toLowerCase(); if (RE_IDENT.test(n) && !l.some(s => s.name.toLowerCase() === n)) { l.push({ name: n, label: n, builtin: false }); ch = true; } };
  S.tables.forEach(t => add(t.schema)); S.rules.forEach(r => r.targetSchema && add(r.targetSchema)); if (ch) await setSet('schemaList', l);
}

async function importFlowCore() {

  if (!payload || typeof payload !== 'object' || Array.isArray(payload)) { toast('這不是 Rule Forge 匯出的檔案', 'err'); return; }
  if (!payload || !payload.stores || typeof payload.stores !== 'object') { toast('這不是 Rule Forge 匯出的檔案（缺少 stores）', 'err'); return; }
  const inc = normalizePayload(payload), full = payload.kind === 'full' || payload.kind === undefined;
  const all = { ruleVersions: await idb.all('ruleVersions') }, an = analyze(inc, all);
  const rows = Object.keys(KEYOF).filter(st => an[st].total).map(st => `<tr><td>${STORE_LABEL[st]}</td><td>${an[st].total}</td><td>${an[st].nw}</td><td>${an[st].same}</td><td>${an[st].conf.length ? `<b style="color:var(--warn)">${an[st].conf.length}</b> <span class="muted small">${esc(an[st].conf.slice(0, 4).join('、'))}${an[st].conf.length > 4 ? '…' : ''}</span>` : 0}</td></tr>`).join('');
  const html = `${inc._skipped ? `<div class="note warn">檔案內有 ${inc._skipped} 筆資料格式不正確（缺少編號、編號不合法或孤立的欄位），已自動略過。</div>` : ''}<p class="muted small">檔案：${esc(file.name)}・類型：${esc(payload.kind || 'full')}・schemaVersion ${esc(payload.schemaVersion || '?')}・匯出於 ${esc(fmtTime(payload.exportedAt))}</p>
    <table class="tbl"><thead><tr><th>項目</th><th>檔案內</th><th>新增</th><th>完全相同</th><th>衝突（同 ID 但內容不同）</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">檔案內沒有可匯入的資料</td></tr>'}</tbody></table>
    <h3>匯入方式</h3>
    <label style="display:block"><input type="radio" name="im" value="merge" checked> <b>合併</b>：保留現有資料，只處理檔案內的項目</label>

      <label><input type="radio" name="st" value="skip" checked> 略過</label>　<label><input type="radio" name="st" value="overwrite"> 覆蓋</label>　<label><input type="radio" name="st" value="newid"> 另存新 ID</label>
      <div class="muted">「另存新 ID」只適用於規則／缺失態樣／Value Set（連結會自動重新對應）；資料表與欄位字典只能略過或覆蓋。</div></div>
    ${full ? `<label style="display:block"><input type="radio" name="im" value="replace"> <b style="color:var(--err)">完整取代</b>：先清空整個資料庫，再還原檔案內容（含設定與操作紀錄）</label>` : ''}`;
  const r = await modal({ title: '匯入預覽與衝突處理', html, wide: true, buttons: [{ label: '取消', value: null }, { label: '開始匯入', value: 'ok', cls: 'primary' }], collect: ov => ({ mode: ov.querySelector('input[name=im]:checked').value, strategy: ov.querySelector('input[name=st]:checked').value }) });
  if (!r) return;
  if (r.data.mode === 'replace' && !(await confirmBox('「完整取代」會清空目前所有規則、字典與設定，再匯入檔案內容。\n建議先匯出目前資料備份。確定繼續？', '清空並匯入', true))) return;
  const s = r.data.mode === 'replace' ? await applyReplace(payload, inc) : await applyMerge(payload, inc, r.data.strategy, all);
  await sanitizeSettings(); toast(s, 'ok', 5000);
  applyTheme(); renderNav(); route();
}
async function applyReplace(payload, inc) {
  const ops = STORES.map(st => ({ store: st, op: 'clear' }));
  STORES.forEach(st => { (st === 'rules' ? inc.rules : inc[st]).forEach(x => ops.push({ store: st, op: 'put', val: x })); });
  await idb.multi(ops); await reload();
  await ensureSchemaDefaults(); await syncSchemaList();
  return `已完整還原：${inc.rules.length} 條規則、${inc.findings.length} 個缺失、${inc.tables.length} 張表、${inc.valueSets.length} 個 Value Set`;
}
function remapTree(rule, vsMap) { walkTree(rule.condition, n => { if (n.type === 'cond' && n.value && n.value.kind === 'valueSet' && vsMap.has(n.value.setId)) n.value.setId = vsMap.get(n.value.setId); }); }
async function applyMerge(payload, inc, strategy, all) {
  const ops = [], stat = { add: 0, ow: 0, skip: 0, nid: 0 };
  const vsMap = new Map(), fdMap = new Map(), ruleMap = new Map();
  const usedVS = new Set(S.vsMap.keys()), usedFD = new Set(S.findingMap.keys());
  const uniq = (id, used) => { let n = id, k = 1; while (used.has(n)) n = id + '-' + (++k); used.add(n); return n; };
  const same = (a, b) => stable(a) === stable(b);
  inc.valueSets.forEach(x => { const e = S.vsMap.get(x.setId); if (!e) { ops.push({ store: 'valueSets', op: 'put', val: x }); stat.add++; } else if (same(e, x)) stat.skip++; else if (strategy === 'overwrite') { ops.push({ store: 'valueSets', op: 'put', val: x }); stat.ow++; } else if (strategy === 'newid') { const id = uniq(x.setId, usedVS); vsMap.set(x.setId, id); ops.push({ store: 'valueSets', op: 'put', val: Object.assign({}, x, { setId: id, name: x.name + '（匯入）' }) }); stat.nid++; } else stat.skip++; });
  inc.findings.forEach(x => { const e = S.findingMap.get(x.findingId); if (!e) { ops.push({ store: 'findings', op: 'put', val: x }); stat.add++; } else if (same(e, x)) stat.skip++; else if (strategy === 'overwrite') { ops.push({ store: 'findings', op: 'put', val: x }); stat.ow++; } else if (strategy === 'newid') { const id = uniq(x.findingId, usedFD); fdMap.set(x.findingId, id); ops.push({ store: 'findings', op: 'put', val: Object.assign({}, x, { findingId: id, ruleIds: [] }) }); stat.nid++; } else stat.skip++; });
  const newRuleIds = [];
  const verBy = new Map(); inc.ruleVersions.forEach(v => { (verBy.get(v.ruleId) || verBy.set(v.ruleId, []).get(v.ruleId)).push(v); });
  const ctx = makeCtx();
  const snap = r => ({ versionId: uid(), ruleId: r.ruleId, version: r.version, createdAt: r.updatedAt, note: '匯入', snapshot: clone(r), sql: buildQuery(r, { mode: 'detail' }, ctx).sql });
  inc.rules.forEach(x => {
    const r = clone(x); remapTree(r, vsMap); if (r.findingId && fdMap.has(r.findingId)) r.findingId = fdMap.get(r.findingId);
    const e = S.rulesMap.get(x.ruleId);
    if (!e || strategy === 'newid' && ruleCoreJson(e) !== ruleCoreJson(r)) {
      let isNewId = false;
      if (e) { r.ruleId = nextRuleId(newRuleIds); isNewId = true; ruleMap.set(x.ruleId, r.ruleId); }
      newRuleIds.push(r.ruleId); r.version = r.version || 1; ops.push({ store: 'rules', op: 'put', val: r });
      const vs = verBy.get(x.ruleId) || []; if (vs.length) vs.forEach(v => ops.push({ store: 'ruleVersions', op: 'put', val: Object.assign({}, v, { versionId: uid(), ruleId: r.ruleId }) })); else ops.push({ store: 'ruleVersions', op: 'put', val: snap(r) });
      isNewId ? stat.nid++ : stat.add++;
    } else if (ruleCoreJson(e) === ruleCoreJson(r)) stat.skip++;
    else if (strategy === 'overwrite') { r.version = (e.version || 0) + 1; r.updatedAt = nowISO(); r.createdAt = e.createdAt || r.createdAt; ops.push({ store: 'rules', op: 'put', val: r }); ops.push({ store: 'ruleVersions', op: 'put', val: Object.assign(snap(r), { note: '匯入覆蓋' }) }); stat.ow++; }
    else stat.skip++;
  });
  const tblIn = new Set();
  inc.tables.forEach(x => { const e = S.tableMap.get(x.tableKey); if (!e) { ops.push({ store: 'tables', op: 'put', val: x }); tblIn.add(x.tableKey); stat.add++; } else if (same(e, x)) stat.skip++; else if (strategy === 'overwrite') { ops.push({ store: 'tables', op: 'put', val: x }); tblIn.add(x.tableKey); (S.fieldsByTable.get(x.tableKey) || []).forEach(f => ops.push({ store: 'fields', op: 'del', key: f.fieldKey })); stat.ow++; } else stat.skip++; });
  const fm = new Map(S.fields.map(f => [f.fieldKey, f]));
  inc.fields.forEach(x => { const e = fm.get(x.fieldKey); if (!e || tblIn.has(x.tableKey)) { ops.push({ store: 'fields', op: 'put', val: x }); } else if (strategy === 'overwrite' && !same(e, x)) ops.push({ store: 'fields', op: 'put', val: x }); });
  const skipKeys = ['saveCount', 'lastBackupAt'];
  inc.settings.forEach(s => {
    if (skipKeys.includes(s.key)) return;
    if (s.key === 'schemaList') { const l = getSet('schemaList'); (s.value || []).forEach(n => { if (n && n.name && !l.some(z => z.name.toLowerCase() === String(n.name).toLowerCase())) l.push({ name: String(n.name).toLowerCase(), label: n.label || n.name, builtin: !!n.builtin }); }); ops.push({ store: 'settings', op: 'put', val: { key: 'schemaList', value: l } }); }
    else if (strategy === 'overwrite' && ['defaultSchema', 'identifierCase', 'dialect'].includes(s.key)) ops.push({ store: 'settings', op: 'put', val: s });
  });
  if (ops.length) await idb.multi(ops);
  await reload(); await refreshFindingLinks(); await ensureSchemaDefaults(); await syncSchemaList();
  await audit('import', 'json', '', `新增 ${stat.add}、覆蓋 ${stat.ow}、新ID ${stat.nid}、略過 ${stat.skip}（策略：${strategy}）`);
  return `匯入完成：新增 ${stat.add}、覆蓋 ${stat.ow}、另存新 ID ${stat.nid}、略過 ${stat.skip}`;
}

  const prev = () => { $('#sPrev', v).textContent = `FROM ${idCase(getSet('defaultSchema'), getSet('identifierCase'))}.${idCase('CAL_CR3000_DETAIL', getSet('identifierCase'))} t`; };
  prev();
  try { if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { $('#sPersist', v).textContent = p ? '✔ 瀏覽器已授予持久儲存，不會被自動清除。' : '⚠ 瀏覽器尚未授予持久儲存，空間不足時資料可能被清除，請定期備份。'; }); } catch (e) { }
  $('#sDef', v).onchange = async e => { if (!RE_IDENT.test(e.target.value)) { toast('預設 Schema 不合法（L007）', 'err'); return; } await setSet('defaultSchema', e.target.value); prev(); renderNav(); viewSettings(); };
  $$('input[name=sCs]', v).forEach(r => r.onchange = async () => { await setSet('identifierCase', r.value); prev(); });
  $('#sDi', v).onchange = async e => { await setSet('dialect', e.target.value); };
  $('#sTh', v).onchange = async e => { await setSet('theme', e.target.value); applyTheme(); };
  $('#sBk', v).onchange = async e => { await setSet('backupEvery', Math.max(0, parseInt(e.target.value, 10) || 0)); };
  $('#sAdd', v).onclick = async () => {
    const n = normalizeSchemaInput($('#sNew', v).value); if (!n.valid) { toast('Schema 格式不合法（L007）：需以英文字母開頭，僅限英數字、_ $ #', 'err'); return; }
    const name = n.value.toLowerCase(); if (sl.some(s => s.name === name)) { toast('此 schema 已在清單中', 'err'); return; }
    if (n.changed) toast('已自動移除多餘符號：' + name, 'warn');
    sl.push({ name, label: $('#sNewLb', v).value.trim() || name, builtin: false }); await setSet('schemaList', sl); viewSettings();
  };
  v.addEventListener('change', async e => { if (e.target.matches('[data-lb]')) { sl[+e.target.closest('tr').dataset.i].label = e.target.value; await setSet('schemaList', sl); } });
  v.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-del')) {
      const i = +b.closest('tr').dataset.i, s = sl[i]; if (s.builtin) return;
      if (s.name === getSet('defaultSchema').toLowerCase()) { toast('這是目前的預設 Schema，請先改選其他預設再刪除', 'err'); return; }
      const aff = S.rules.filter(r => r.targetSchema && r.targetSchema.toLowerCase() === s.name), nt = S.tables.filter(t => t.schema === s.name).length;
      if (aff.length || nt) { if (!(await confirmBox(`Schema「${s.name}」仍被使用：\n・規則 ${aff.length} 條${aff.length ? '（' + aff.slice(0, 8).map(r => r.ruleId).join('、') + (aff.length > 8 ? '…' : '') + '）' : ''}\n・欄位字典資料表 ${nt} 張\n\n刪除只會從清單移除，規則與字典不會被改動，但會出現 L011 提醒。確定刪除？`, '仍要刪除', true))) return; }
      sl.splice(i, 1); await setSet('schemaList', sl); await audit('delete', 'schema', s.name, ''); viewSettings();
    } else if (b.id === 'sExp') { await exportFull(); viewSettings(); }
    else if (b.id === 'sImp') importFlow();
    else if (b.id === 'sSample') { await loadSampleData(); toast('已載入範例資料', 'ok'); viewSettings(); }
    else if (b.id === 'sLogClr') { await idb.clear('auditLog'); viewSettings(); }
    else if (b.id === 'sClear') {
      const r = await modal({ title: '清除所有資料', html: `<div class="note err">此動作會刪除所有規則、版本、缺失、字典、Value Set 與設定，無法復原。</div><p>請輸入 <b>DELETE</b> 確認：</p><input type="text" id="cT">`, buttons: [{ label: '取消', value: null }, { label: '清除', value: 'ok', cls: 'danger', validate: ov => (ov.querySelector('#cT').value.trim() === 'DELETE' ? '' : '請輸入 DELETE') }] });
      if (!r) return; await idb.multi(STORES.map(st => ({ store: st, op: 'clear' }))); await reload(); await idb.put('settings', { key: 'defaultSchema', value: 'bis' }); await idb.put('settings', { key: 'identifierCase', value: 'lower' }); await reload(); await ensureSchemaDefaults(); applyTheme(); renderNav(); toast('已清除所有資料', 'ok'); go('#/dashboard'); route();
    }
  });
}

/* ---------- 啟動 ---------- */
function applyTheme() {
  const t = getSet('theme'); const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function showHelp() {
  modal({ title: '快捷鍵與小提示', html: `<table class="tbl"><tbody><tr><td><span class="kbd">Ctrl</span>+<span class="kbd">S</span></td><td>在 Rule Builder 儲存規則</td></tr><tr><td><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span></td><td>在 Rule Builder 複製目前 SQL</td></tr><tr><td><span class="kbd">?</span></td><td>開啟此說明</td></tr><tr><td><span class="kbd">Esc</span></td><td>關閉對話框</td></tr></tbody></table>
  <p class="small muted">條件列左側的 ⋮⋮ 可拖曳排序（含跨群組）；取消勾選會停用該條件（不產生 SQL）。Schema 的決定順序：臨時覆寫 → 規則的 Schema → 全域預設。</p>`, buttons: [{ label: '關閉', value: null }] });
}
async function boot() {
  try { await openDB(); } catch (e) { $('#main').innerHTML = `<div class="card"><h2>無法開啟 IndexedDB</h2><p>${esc(e && e.message || e)}</p><p class="muted">請確認瀏覽器未停用儲存功能，且不是在無痕模式中使用。</p></div>`; return; }
  await reload(); await sanitizeSettings(); applyTheme();
  const heal = []; S.rules.forEach(r => { const n = normalizeRule(clone(r)); if (stable(n) !== stable(r)) heal.push(n); });
  if (heal.length) { await idb.bulkPut('rules', heal); await reload('rules'); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  $('#btnTheme').onclick = async () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark'; await setSet('theme', dark ? 'light' : 'dark'); applyTheme(); };
  $('#btnHelp').onclick = showHelp;
  window.addEventListener('hashchange', route);
  window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('發生錯誤：' + ((e.reason && e.reason.message) || e.reason), 'err', 5000); });
  window.addEventListener('error', e => { if (e.message) toast('發生錯誤：' + e.message, 'err', 5000); });
  window.addEventListener('beforeunload', e => { if (GUARD && GUARD()) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', e => {
    if (document.querySelector('.ov')) return;   /* 對話框開啟時不觸發頁面快捷鍵 */
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 's' || e.key === 'S')) { if (CUR.view === 'builder' && B.save) { e.preventDefault(); B.save(); } }
    else if (mod && e.key === 'Enter') { if (CUR.view === 'builder' && B.copy) { e.preventDefault(); B.copy(); } }
    else if (e.key === '?' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) showHelp();
  });
  if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/dashboard');
  await route();
}
boot();
</script>
