<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>預期信用損失變動分析器 ECL Movement Analyzer v1.4</title>
<style>
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f8fafc;--text:#1f2937;--muted:#6b7280;--line:#e2e8f0;
  --primary:#1f4e79;--primary2:#2e75b6;--accent:#0f766e;--up:#c0392b;--down:#1e8449;
  --warn:#b45309;--warnbg:#fef3c7;--errbg:#fee2e2;--err:#b91c1c;--infobg:#e0f2fe;--info:#075985;--okbg:#dcfce7;--ok:#166534;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.05);
  --font:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#273449;--text:#e5e7eb;--muted:#94a3b8;--line:#334155;
  --primary:#5aa2e0;--primary2:#7bb6ec;--accent:#2dd4bf;--up:#f87171;--down:#4ade80;
  --warn:#fbbf24;--warnbg:#422006;--errbg:#450a0a;--err:#fca5a5;--infobg:#082f49;--info:#7dd3fc;--okbg:#052e16;--ok:#86efac;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num,td.n,th.n,.mono{font-variant-numeric:tabular-nums;font-family:Consolas,"Cascadia Mono","Microsoft JhengHei",monospace}
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;box-shadow:var(--shadow)}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1}
header.top h1 small{font-weight:400;opacity:.8;margin-left:8px;font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--primary2);color:var(--primary2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.15);color:#fff;border-color:#fff}
.btn.sm{padding:3px 10px;font-size:12px}
nav.tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;position:sticky;top:52px;z-index:15}
nav.tabs button{border:0;background:none;padding:12px 16px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:disabled{opacity:.4;cursor:not-allowed}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;text-align:center}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
section.tab{display:none}section.tab.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-ov{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.grid2,.grid-ov{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px;font-size:15px;color:var(--primary)}
.card h2{font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--up)}.dn{color:var(--down)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--panel2);transition:.15s}
.drop:hover,.drop.over{border-color:var(--primary2);background:var(--infobg)}
.drop b{color:var(--primary)}
.fileinfo{margin-top:10px;font-size:13px}
.fileinfo .name{font-weight:700;word-break:break-all}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:4px}
.tag.error{background:var(--errbg);color:var(--err)}.tag.warning{background:var(--warnbg);color:var(--warn)}.tag.info{background:var(--infobg);color:var(--info)}.tag.ok{background:var(--okbg);color:var(--ok)}
details.map{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
details.map summary{cursor:pointer;padding:8px 12px;font-weight:600}
.mapgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:10px 12px}
.mapgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.mapgrid select,.f select,.f input[type=number],.f input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
.mapgrid label.req span::after{content:" *";color:var(--err)}
.mapgrid label.miss select{border-color:var(--err)}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--primary);color:#fff;font-weight:600;z-index:1;text-align:center}
table.t td.n,table.t th.n{text-align:right}
table.t tbody tr:hover{background:var(--infobg)}
table.t tr.tot td{font-weight:700;background:var(--panel2)}
table.t tr.hl td{font-weight:700;background:var(--panel2)}
table.t td.click{cursor:pointer}
table.t td.click:hover{outline:2px solid var(--primary2);outline-offset:-2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:#fff}
.explain p{margin:0 0 8px;line-height:1.75}
.explain p.item{padding-left:6px}
.alert{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13px;line-height:1.6}
.alert.error{background:var(--errbg);color:var(--err)}.alert.warning{background:var(--warnbg);color:var(--warn)}.alert.info{background:var(--infobg);color:var(--info)}.alert.ok{background:var(--okbg);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{width:100%;height:auto;display:block;min-width:640px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:8px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:rgba(17,24,39,.94);color:#fff;padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.6;z-index:100;display:none;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border-radius:12px;max-width:1200px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal.narrow{max-width:620px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;flex:1;font-size:16px;color:var(--primary)}
.modal .mb{padding:16px 18px;overflow:auto}
.f{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center;margin-bottom:12px}
.f>label{color:var(--muted)}
.order{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.order li{padding:6px 14px;border:1px solid var(--primary2);border-radius:6px;cursor:grab;background:var(--panel2);user-select:none}
.order li.drag{opacity:.4}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:35%;background:var(--accent);animation:slide 1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.heat{color:#111}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=number],.toolbar select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
@media print{
  header.top,nav.tabs,.toolbar button,.btn,.pager{display:none!important}
  section.tab{display:none!important}section.tab.on{display:block!important}
  body{background:#fff}.card,.kpi{box-shadow:none}
  .tbl-wrap{max-height:none;overflow:visible}
  @page{size:A4 landscape;margin:10mm}
}

.tr-tbl input[type=text]{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);width:150px}
.tr-tbl td.sub{padding:0 10px 8px}
.tr-tbl details.map{margin-top:0}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-title h2{margin:0;font-size:16px;color:var(--primary)}
.sec-title .line{flex:1;height:1px;background:var(--line)}
.wtbl input[type=number]{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
.wtbl td{padding:6px 10px}
.spark{vertical-align:middle}
.tag.sc0{background:#dbeafe;color:#1e40af}.tag.sc1{background:#dcfce7;color:#166534}.tag.sc2{background:#fee2e2;color:#991b1b}
.mt{margin-top:16px}

.grid2>*,.grid-ov>*{min-width:0}
.chartbox.narrow{max-width:1000px;margin:0 auto}

.grid-12{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:16px;align-items:start}
@media(max-width:1100px){.grid-12{grid-template-columns:1fr}}
.grid-12>*{min-width:0}

.chartbox.small svg{min-width:0}

</style>
</head>
<body>
<header class="top">
  <h1>預期信用損失變動分析器<small>ECL Movement Analyzer v1.4</small></h1>
  <span id="busyMsg" style="font-size:12px;opacity:.9"></span>
  <button class="btn ghost" id="btnHelp" title="使用說明">？說明</button>
  <button class="btn ghost" id="btnPrint" title="列印目前分頁（A4 橫式）">列印</button>
  <button class="btn ghost" id="btnExport" disabled>匯出 Excel</button>
  <button class="btn primary" id="btnAnalyze" disabled>開始分析</button>
  <button class="btn ghost" id="btnSettings" title="設定">⚙ 設定</button>
</header>
<div class="prog" id="progBar" style="position:sticky;top:52px;z-index:30;margin:0;border-radius:0"><i></i></div>
<nav class="tabs" id="tabs">
  <button data-tab="import" class="on">資料匯入</button>
  <button data-tab="overview" disabled>總覽</button>

  <button data-tab="matrix" disabled>Stage 矩陣</button>
  <button data-tab="dim" disabled>維度分析</button>
  <button data-tab="movers" disabled>Top Movers</button>
  <button data-tab="rating" disabled>評等轉移</button>
  <button data-tab="ifrs7" disabled>IFRS 7 調節表</button>
  <button data-tab="scen" disabled>情境權重</button>
  <button data-tab="trend">多期趨勢</button>
  <button data-tab="dq">資料品質<span class="badge" id="dqBadge" style="display:none"></span></button>
  <button data-tab="acct" disabled>帳戶明細</button>
</nav>
<main>
  <section class="tab on" id="tab-import"></section>
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-waterfall"></section>
  <section class="tab" id="tab-matrix"></section>
  <section class="tab" id="tab-dim"></section>
  <section class="tab" id="tab-movers"></section>
  <section class="tab" id="tab-rating"></section>
  <section class="tab" id="tab-ifrs7"></section>
  <section class="tab" id="tab-scen"></section>
  <section class="tab" id="tab-trend"></section>
  <section class="tab" id="tab-dq"></section>
  <section class="tab" id="tab-acct"></section>
</main>
<div id="tip"></div>

  for (let i = 0; i < labels.length; i++) { if (i === 2 && Math.abs(S.fx[2]) < 1e-9 && S.cnt[2] === 0) continue; items.push({ t: 'eff', i, label: labels[i], v: S.fx[i], cnt: S.cnt[i] }); }

  const n = items.length, band = (W - mL - mR) / n, bw = band * 0.6;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Microsoft JhengHei,sans-serif" font-size="12">`;
  s += `<rect width="${W}" height="${H}" fill="${C.panel}"/>`;
  const ticks = niceTicks(lo, hi, 5), stepU = ticks.length > 1 ? (ticks[1] - ticks[0]) / (EN.UNITS[ST.unit] || 1) : 1, axDec = stepU >= 1 ? 0 : (stepU >= 0.1 ? 1 : (stepU >= 0.01 ? 2 : 4));
  ticks.forEach(v => { const yy = y(v); s += `<line x1="${mL}" x2="${W - mR}" y1="${yy}" y2="${yy}" stroke="${C.line}"/><text x="${mL - 8}" y="${yy + 4}" text-anchor="end" fill="${C.muted}">${esc(EN.fmtAmt(v, ST.unit, axDec, false))}</text>`; });
  s += `<text x="${mL}" y="16" fill="${C.muted}">單位：${esc(ST.unit)}${truncated ? '　※縱軸未從 0 起算' : ''}${o.note != null ? (o.note ? '　｜' + o.note : '') : (R && R.method ? '　｜歸因方法：' + methodTxt(R.method, R.order) : '')}</text>`;
  items.forEach((it, k) => {
    const cx = mL + band * k + band / 2, x = cx - bw / 2;

    if (it.t === 'eff') { top = y(Math.max(it.from, it.to)); bot = y(Math.min(it.from, it.to)); col = colors[it.i]; label = A(it.v, true); tip = `${it.label}¦金額：${A(it.v, true)} ${ST.unit}` + (it.cnt != null ? `¦涉及：${N0(it.cnt)} ${cntUnit}` : '') + (o.noClick ? '' : '¦（點擊查看帳戶明細）'); }
    else { top = y(it.v); bot = y(base); col = '#2f5f8f'; label = A(it.v); tip = `${it.label}¦${A(it.v)} ${ST.unit}`; }
    const h = Math.max(bot - top, 1.5);

    if (it.t === 'eff') s += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" fill="none" stroke="${colorOf(it.v)}" stroke-width="${Math.abs(it.v) > 0 ? 2 : 0}" rx="2" pointer-events="none"/>`;
    s += `<text x="${cx}" y="${top - 6}" text-anchor="middle" font-weight="700" fill="${it.t === 'eff' ? colorOf(it.v) : C.text}">${esc(label)}</text>`;
    s += `<text x="${cx}" y="${H - mB + 18}" text-anchor="middle" fill="${C.text}">${esc(it.label)}</text>`;
    if (it.t === 'eff' && it.cnt != null) s += `<text x="${cx}" y="${H - mB + 34}" text-anchor="middle" fill="${C.muted}">${N0(it.cnt)} ${cntUnit}</text>`;

}
function stackedSVG(list, total) {

  const tot = (mp + mn) || 1, pw = W - mL - mR, x0 = mL + mn / tot * pw, sc = pw / tot;

  s += `<line x1="${x0}" x2="${x0}" y1="${mT - 6}" y2="${H - 18}" stroke="${C.muted}"/>`;

    });

  let hi = Math.max.apply(null, [].concat.apply([], series.map(se => se.vals)).concat([1e-9])) * 1.18; const ticks = niceTicks(0, hi, 5); hi = Math.max(hi, ticks[ticks.length - 1] || hi);
  const ph = H - mT - mB, y = v => mT + (hi - v) / hi * ph, band = (W - mL - mR) / n, dec = (ticks[1] - ticks[0]) * 100 >= 1 ? 0 : ((ticks[1] - ticks[0]) * 100 >= 0.1 ? 1 : 2);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Microsoft JhengHei,sans-serif" font-size="12"><rect width="${W}" height="${H}" fill="${C.panel}"/>`;
  ticks.forEach(v => { const yy = y(v); s += `<line x1="${mL}" x2="${W - mR}" y1="${yy}" y2="${yy}" stroke="${C.line}"/><text x="${mL - 8}" y="${yy + 4}" text-anchor="end" fill="${C.muted}">${(v * 100).toFixed(dec)}%</text>`; });
  cats.forEach((c, i) => { catLines(c).forEach((ln, k) => { s += `<text x="${mL + band * i + band / 2}" y="${H - mB + 18 + k * 15}" text-anchor="middle" fill="${k ? C.muted : C.text}">${esc(ln)}</text>`; }); });
  series.forEach((se, si) => {
    const pts = se.vals.map((v, i) => [mL + band * i + band / 2, y(v)]);
    s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2.4"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${C.panel}" stroke="${se.color}" stroke-width="2.2" data-tip="${esc(catLines(cats[i]).join(' ') + '¦' + se.name + '：' + (se.vals[i] * 100).toFixed(2) + '%')}"/>`; if (n <= 10) s += `<text x="${p[0]}" y="${p[1] + (si === 2 ? 18 : -10)}" text-anchor="middle" fill="${se.color}" font-weight="700" font-size="11" stroke="${C.panel}" stroke-width="3" paint-order="stroke">${(se.vals[i] * 100).toFixed(2)}%</text>`; });
  });
  return s + '</svg>';
}

function divergingColsSVG(cats, series, net) {
  const C = themeColors(), W = 980, H = 420, mL = 78, mR = 20, mT = 34, mB = 62, n = cats.length;
  const pos = cats.map((_, i) => series.reduce((s, se) => s + Math.max(0, se.vals[i]), 0)), neg = cats.map((_, i) => series.reduce((s, se) => s + Math.max(0, -se.vals[i]), 0));
  let hi = Math.max.apply(null, pos.concat([1e-9])) * 1.15, lo = -Math.max.apply(null, neg.concat([1e-9])) * 1.15;
  const ticks = niceTicks(lo, hi, 6), fm = axisFmt(ticks); if (ticks.length) { hi = Math.max(hi, ticks[ticks.length - 1]); lo = Math.min(lo, ticks[0]); }
  const ph = H - mT - mB, y = v => mT + (hi - v) / (hi - lo) * ph, band = (W - mL - mR) / n, bw = Math.min(band * 0.6, 96);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Microsoft JhengHei,sans-serif" font-size="12"><rect width="${W}" height="${H}" fill="${C.panel}"/>`;
  ticks.forEach(v => { const yy = y(v); s += `<line x1="${mL}" x2="${W - mR}" y1="${yy}" y2="${yy}" stroke="${Math.abs(v) < 1e-9 ? C.muted : C.line}"/><text x="${mL - 8}" y="${yy + 4}" text-anchor="end" fill="${C.muted}">${esc(fm(v))}</text>`; });
  s += `<text x="${mL}" y="16" fill="${C.muted}">單位：${esc(ST.unit)}　｜◆ ＝ 該期 ECL 淨變動</text>`;
  cats.forEach((c, i) => {
    const cx = mL + band * i + band / 2, x = cx - bw / 2; let up = 0, dn = 0;
    series.forEach(se => {
      const v = se.vals[i]; if (Math.abs(v) < 1e-9) return; const tip = esc(catLines(c).join('') + '¦' + se.name + '：' + A(v, true) + ' ' + ST.unit);
      if (v > 0) { s += `<rect x="${x}" y="${y(up + v)}" width="${bw}" height="${Math.max(y(up) - y(up + v), 0.8)}" fill="${se.color}" data-tip="${tip}"/>`; up += v; }
      else { s += `<rect x="${x}" y="${y(dn)}" width="${bw}" height="${Math.max(y(dn + v) - y(dn), 0.8)}" fill="${se.color}" opacity=".85" data-tip="${tip}"/>`; dn += v; }
    });
    const ny = y(net[i]); s += `<path d="M${cx} ${ny - 7} l7 7 l-7 7 l-7 -7 z" fill="${C.text}" stroke="${C.panel}" stroke-width="1.5" data-tip="${esc(catLines(c).join('') + '¦淨變動：' + A(net[i], true) + ' ' + ST.unit)}"/>`;
    s += `<text x="${cx + 14}" y="${ny + 4}" fill="${C.text}" font-weight="700" font-size="11">${esc(A(net[i], true))}</text>`;
    catLines(c).forEach((ln, k) => { s += `<text x="${cx}" y="${H - mB + 18 + k * 15}" text-anchor="middle" fill="${k ? C.muted : C.text}">${esc(ln)}</text>`; });
  });
  return s + '</svg>';
}

function sparkSVG(vals) {
  const w = 110, h = 28, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = (mx - mn) || 1, n = vals.length;
  const pts = vals.map((v, i) => [n > 1 ? 4 + i * (w - 8) / (n - 1) : w / 2, h - 4 - (v - mn) / rg * (h - 8)]);
  const up = vals[n - 1] >= vals[0];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${up ? colorOf(1) : colorOf(-1)}" stroke-width="1.8"/><circle cx="${pts[n - 1][0].toFixed(1)}" cy="${pts[n - 1][1].toFixed(1)}" r="2.6" fill="${up ? colorOf(1) : colorOf(-1)}"/></svg>`;
}

async function trendLoad(p, file, sampleData) {
  busy(true, '讀取 ' + p.label + '…');
  try {
    if (sampleData) {
      await call('putRows', p.key, sampleData.slice(1));
      p.parsed = { sheets: [p.label], sheet: p.label, headers: sampleData[0], nrows: sampleData.length - 1, map: EN.autoMap(sampleData[0]) };
    } else {
      p.buf = await file.arrayBuffer();
      const parsed = await call('parseFile', p.key, file.name, p.buf, null); parsed.map = mapFromSaved(parsed.headers, parsed.map); p.parsed = parsed;
    }
    p.map = p.parsed.map; p.norm = await call('normalize', p.key, p.map, { pctMode: ST.pctMode });
  } catch (err) { p.err = err.message; p.parsed = null; p.norm = null; }
  finally { busy(false); }
}
async function trendAddFiles(files) {
  TR.res = null;
  for (const file of Array.from(files)) {
    const id = ++TR.seq, p = { id, key: 't' + id, label: file.name.replace(/\.[^.]+$/, ''), name: file.name, buf: null, parsed: null, map: null, norm: null, err: '' };
    TR.periods.push(p); renderTrend(); await trendLoad(p, file);
  }
  renderTrend();
}
async function trendClear() {
  for (const p of TR.periods) { try { await call('dropKey', p.key); } catch (e) { } }
  TR.periods = []; TR.res = null; renderTrend();
}
async function trendSample() {
  await trendClear();
  const data = EN.sampleSeries(4), labels = ['2025Q4', '2026Q1', '2026Q2', '2026Q3'];
  for (let i = 0; i < data.length; i++) {
    const id = ++TR.seq, p = { id, key: 't' + id, label: labels[i], name: '範例資料_' + labels[i] + '（模擬）', buf: null, parsed: null, map: null, norm: null, err: '' };
    TR.periods.push(p); await trendLoad(p, null, data[i]);
  }
  renderTrend();
}
async function runTrend() {
  if (!trReady()) return;
  busy(true, '趨勢分析中…');
  try { TR.res = await call('trendSummary', TR.periods.map(p => p.key), { method: ST.method, order: ST.order }); TR.keys = TR.periods.map(p => p.key).join(','); }
  catch (err) { toast('趨勢分析失敗：' + err.message, 'error'); }
  finally { busy(false); }
  renderTrend();
}

function trendDimKeys(P, dim) {
  const total = {}; P.forEach(p => { Object.keys(p.dims[dim] || {}).forEach(k => { total[k] = Math.max(total[k] || 0, p.dims[dim][k].ecl); }); });
  return Object.keys(total).sort((a, b) => total[b] - total[a]);
}
function trendDimRows(P, dim) {
  const keys = trendDimKeys(P, dim), top = keys.slice(0, 12), rest = keys.slice(12);
  const rows = top.map(k => ({ key: k, vals: P.map(p => (p.dims[dim][k] || { ecl: 0 }).ecl) }));
  if (rest.length) rows.push({ key: '其他（' + rest.length + ' 項）', vals: P.map(p => rest.reduce((s, k) => s + (p.dims[dim][k] ? p.dims[dim][k].ecl : 0), 0)) });
  return rows;
}
function trendCum(Q) {
  const fx = new Array(8).fill(0), cnt = new Array(8).fill(0);
  Q.forEach(q => q.S.fx.forEach((v, i) => { fx[i] += v; cnt[i] += q.S.cnt[i]; }));
  return { fx, cnt };
}
function trendHtml() {

  const first = P[0], last = P[n - 1], cum = last.ecl - first.ecl, cp = trendCum(Q);
  const trans = Q.map((_, i) => [L[i], '→ ' + L[i + 1]]);
  const diffTot = Q.reduce((a, q) => a + Math.abs(q.S.diff), 0), misTot = Q.reduce((a, q) => a + q.mismatch, 0);

    ${k('累計變動', A(cum, true), `${first.ecl ? (cum / Math.abs(first.ecl) * 100 >= 0 ? '+' : '') + (cum / Math.abs(first.ecl) * 100).toFixed(2) + '%' : ''}（${ST.unit}）`, cls(cum))}
    ${k('覆蓋率', P2(cov[n - 1]), `首期 ${P2(cov[0])}`)}${k('Stage 3 占 EAD', P2(s3[n - 1]), `首期 ${P2(s3[0])}`)}
    ${n > 2 ? k('單期最大增幅', A(Q[maxIdx].S.delta, true), esc(L[maxIdx]) + ' → ' + esc(L[maxIdx + 1]), cls(Q[maxIdx].S.delta)) : ''}</div>`;
  const badge = (diffTot <= 1 && misTot === 0) ? `<span class="tag ok">逐期勾稽通過｜各期各效果合計與 ECL 變動差異合計 ${EN.fmtNum(diffTot, 2)} 元</span>` : `<span class="tag error">勾稽未通過｜差異 ${N0(diffTot)} 元，${misTot} 戶異常</span>`;

  // 逐期 bridge 表

  mat += `<tr class="tot"><td>情境可歸屬小計 ／ 合計（ECL 變動）</td>${colSub.map(v => `<td class="n ${cls(v)}">${amtCell(v, true)}</td>`).join('')}<td class="n ${cls(r.delta)}"><b>${A(r.delta, true)}</b></td><td></td></tr>`;
  // 情境總表
  const rowsS = [0, 1, 2].map(s => `<tr><td><span class="tag sc${s}">${SC_NAME[s]}</span></td><td class="n">${pctTxt(r.w0[s])}</td><td class="n">${A(r.tp.M[s])}</td><td class="n">${A(r.tp.M[s] * r.w0[s])}</td><td class="n">${pctTxt(r.w1[s])}</td><td class="n">${A(r.tc.M[s])}</td><td class="n">${A(r.tc.M[s] * r.w1[s])}</td><td class="n ${cls(r.tc.M[s] * r.w1[s] - r.tp.M[s] * r.w0[s])}">${A(r.tc.M[s] * r.w1[s] - r.tp.M[s] * r.w0[s], true)}</td></tr>`).join('');
  const totS = `<tr class="tot"><td>加權模型 ECL</td><td class="n">100%</td><td></td><td class="n">${A(m0)}</td><td class="n">100%</td><td></td><td class="n">${A(m1)}</td><td class="n ${cls(m1 - m0)}">${A(m1 - m0, true)}</td></tr>
    <tr><td>模型外調整（帳上 − 加權模型）</td><td></td><td></td><td class="n">${A(r.tp.book - m0)}</td><td></td><td></td><td class="n">${A(r.tc.book - m1)}</td><td class="n ${cls((r.tc.book - m1) - (r.tp.book - m0))}">${A((r.tc.book - m1) - (r.tp.book - m0), true)}</td></tr>
    <tr class="tot"><td>帳上 ECL</td><td></td><td></td><td class="n">${A(r.tp.book)}</td><td></td><td></td><td class="n">${A(r.tc.book)}</td><td class="n ${cls(r.delta)}">${A(r.delta, true)}</td></tr>`;
  const contrib = [0, 1, 2].map(s => ({ name: SC_NAME[s], color: SC_COLOR[s], vals: [r.tp.M[s] * r.w0[s], r.tc.M[s] * r.w1[s]] }));
  // 敏感度
  const sens = [];
  [-20, -10, 0, 10, 20].forEach(dl => { const d = r.w1[2] + dl / 100, b = r.w1[0] - dl / 100; if (d < -1e-9 || b < -1e-9) return; sens.push({ label: dl === 0 ? '目前權重（' + wTxt(r.w1) + '）' : `Downside ${dl > 0 ? '＋' : '－'}${Math.abs(dl)} pp（Base ${dl > 0 ? '－' : '＋'}${Math.abs(dl)} pp）→ ${wTxt([b, r.w1[1], d])}`, m: b * r.tc.M[0] + r.w1[1] * r.tc.M[1] + d * r.tc.M[2], base: dl === 0 }); });
  [0, 1, 2].forEach(s => sens.push({ label: `100% ${SC_NAME[s]}`, m: r.tc.M[s], base: false }));
  const sensRows = sens.map(x => { const est = r.tc.book + (x.m - m1), d = x.m - m1; return `<tr class="${x.base ? 'hl' : ''}"><td>${x.label}</td><td class="n">${A(x.m)}</td><td class="n ${cls(d)}">${x.base ? '—' : A(d, true)}</td><td class="n">${A(est)}</td></tr>`; }).join('');
  // Stage / 維度
  const fxHead = `<th class="n">新增</th><th class="n">除列</th><th class="n">轉銷</th><th class="n">Stage</th><th class="n">權重</th><th class="n">PD</th><th class="n">LGD</th><th class="n">EAD</th><th class="n">其他</th>`;
  const bRow = (label, b) => `<tr><td>${label}</td><td class="n">${N0(b.cnt)}</td><td class="n">${A(b.ecl0)}</td><td class="n">${A(b.ecl1)}</td><td class="n ${cls(b.ecl1 - b.ecl0)}"><b>${A(b.ecl1 - b.ecl0, true)}</b></td>${b.fx.map(v => `<td class="n ${cls(v)}">${amtCell(v, true)}</td>`).join('')}</tr>`;
  const stageRows = [1, 2, 3].map(s => bRow('Stage ' + s + '（期末）', r.byStage[s])).join('');
  const dimHas = d => (r.byDim[d] || []).some(b => b.key !== '(未填)');
  if (!dimHas(SCN.dim)) { const f = DIMS.find(d => dimHas(d.k)); if (f) SCN.dim = f.k; }
  const dimOpts = DIMS.map(d => `<option value="${d.k}" ${d.k === SCN.dim ? 'selected' : ''} ${dimHas(d.k) ? '' : 'disabled'}>${d.label}${dimHas(d.k) ? '' : '（無資料）'}</option>`).join('');
  const dimRows = (r.byDim[SCN.dim] || []).slice(0, 300).map(b => bRow(esc(b.key), b)).join('');
  return `${secTitle('情境權重拆解結果', `<span class="muted small">金額單位：${ST.unit}｜歸因方法：${methodTxt(r.method, r.order)}（權重效果排在最前）</span>`)}
    <div class="row" style="margin-bottom:12px">${badge}${wChanged ? '' : '<span class="tag info">前後期權重相同，情境權重效果為 0</span>'}</div>${kpis}
    <div class="grid-ov" style="align-items:start">
      <div class="card"><h3>ECL 變動瀑布圖（含情境權重效果）</h3><div class="chartbox">${waterfallSVG(S, { labels: SCE_LABEL, colors: SCE_COLOR, noClick: true, note: '前瞻性情境權重拆解' })}</div></div>
      <div class="card explain"><div class="row"><h3 style="margin:0">變動說明</h3><span class="spacer"></span><button class="btn sm" data-act="copy-sexplain">複製</button></div><div id="sExplain" style="margin-top:10px">${scenExplain(r).map(t => `<p>${esc(t)}</p>`).join('')}</div></div>
    </div>
    ${secTitle('效果 × 情境（' + ST.unit + '）')}<div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>效果</th><th class="n">${SC_NAME[0]}</th><th class="n">${SC_NAME[1]}</th><th class="n">${SC_NAME[2]}</th><th class="n">合計</th><th class="n">涉及戶數</th></tr></thead><tbody>${mat}</tbody></table></div>
    <p class="muted small">Stage 轉換、情境權重、PD、LGD、EAD 可歸屬到各情境；新增、除列、轉銷與模型及其他以帳上金額計，僅列合計。Stage 有變動帳戶的 PD 差異（各情境）歸入「Stage 轉換」。</p>
    <div class="grid-12 mt">
      <div class="card"><h3>各情境加權貢獻（加權模型 ECL）</h3><div class="chartbox small">${stackColsSVG(['前期', '本期'], contrib)}</div>${legendOf(contrib)}</div>
      <div class="card"><h3>情境總表</h3><div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>情境</th><th class="n">前期權重</th><th class="n">前期 100% 情境</th><th class="n">前期加權貢獻</th><th class="n">本期權重</th><th class="n">本期 100% 情境</th><th class="n">本期加權貢獻</th><th class="n">加權貢獻變動</th></tr></thead><tbody>${rowsS}${totS}</tbody></table></div><p class="muted small">「100% 情境」＝ 全部帳戶僅以該情境的 PD、LGD 計算的模型 ECL。</p></div>
    </div>
    ${secTitle('權重敏感度（本期）')}<div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>權重假設</th><th class="n">加權模型 ECL</th><th class="n">較目前權重</th><th class="n">估計帳上 ECL</th></tr></thead><tbody>${sensRows}</tbody></table></div><p class="muted small">估計帳上 ECL ＝ 本期帳上 ECL ＋（假設權重下的加權模型 ECL － 目前權重下的加權模型 ECL），假設模型外調整不變。</p>
    ${secTitle('依 Stage（期末）')}<div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>Stage</th><th class="n">戶數</th><th class="n">前期 ECL</th><th class="n">本期 ECL</th><th class="n">變動</th>${fxHead}</tr></thead><tbody>${stageRows}</tbody></table></div>
    ${secTitle('依維度', `<select data-act="s-dim">${dimOpts}</select>`)}<div class="tbl-wrap"><table class="t"><thead><tr><th>${DIM_LABEL[SCN.dim]}</th><th class="n">戶數</th><th class="n">前期 ECL</th><th class="n">本期 ECL</th><th class="n">變動</th>${fxHead}</tr></thead><tbody>${dimRows}</tbody></table></div>`;
}
function scenExplain(r) {
  const { m0, m1 } = scenMw(r), out = [], Aa = v => A(Math.abs(v)) + ' ' + ST.unit, wTxt = w => w.map(pctTxt).join(' / ');
  out.push(`本期加權模型 ECL 為 ${Aa(m1)}，較前期 ${m1 >= m0 ? '增加' : '減少'} ${Aa(m1 - m0)}；帳上 ECL 由 ${Aa(r.tp.book)} ${r.delta >= 0 ? '增加' : '減少'}至 ${Aa(r.tc.book)}（${r.delta >= 0 ? '+' : '-'}${Aa(r.delta)}）。`);
  const wc = r.w0.some((v, i) => Math.abs(v - r.w1[i]) > 1e-9);
  if (wc) {
    const parts = [0, 1, 2].filter(s => Math.abs(r.sc[4][s]) > 1e-9).sort((a, b) => Math.abs(r.sc[4][b]) - Math.abs(r.sc[4][a]));
    out.push(`情境權重（Base／Upside／Downside）由 ${wTxt(r.w0)} 調整為 ${wTxt(r.w1)}，使 ECL ${r.fx[4] >= 0 ? '增加' : '減少'} ${Aa(r.fx[4])}` + (parts.length ? '（' + parts.map(s => `${SC_SHORT[s]} ${r.sc[4][s] >= 0 ? '+' : '-'}${Aa(r.sc[4][s])}`).join('、') + '）' : '') + '。');
  } else out.push(`前後期情境權重相同（${wTxt(r.w1)}），無情境權重效果。`);
  const gross = r.fx.reduce((a, v) => a + Math.abs(v), 0) || 1, thr = ST.thr / 100, items = [];
  [3, 5, 6, 7].forEach(i => [0, 1, 2].forEach(s => { const v = r.sc[i][s]; if (Math.abs(v) / gross >= thr) items.push({ t: `${SC_SHORT[s]} 情境的 ${SCE_LABEL[i]}`, v }); }));
  [0, 1, 2, 8].forEach(i => { const v = r.fx[i]; if (Math.abs(v) / gross >= thr) items.push({ t: SCE_LABEL[i], v }); });
  items.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  if (items.length) out.push('其他主要變動來源：' + items.slice(0, 6).map(x => `${x.t}${x.v > 0 ? '增加 ' : '減少 '}${Aa(x.v)}`).join('、') + '。');
  out.push(`涉及新增 ${N0(r.nNew)} 戶、除列 ${N0(r.nDer)} 戶、轉銷呆帳 ${N0(r.nWo)} 戶、Stage 轉換 ${N0(r.nStageChg)} 戶。`);
  return out;
}
function scenSheets() {
  const r = SCN.res, { m0, m1 } = scenMw(r), out = [], defs = [[0, '新增帳戶'], [1, '除列帳戶'], [2, '轉銷呆帳'], [3, 'Stage 轉換（PD 差異）', 1], [4, '情境權重效果', 1], [5, 'PD 效果', 1], [6, 'LGD 效果', 1], [7, 'EAD 效果', 1], [8, '模型及其他']];
  const b = [[HS('效果（元）'), HS(SC_NAME[0]), HS(SC_NAME[1]), HS(SC_NAME[2]), HS('合計'), HS('涉及戶數')]];
  defs.forEach(([i, l, sc]) => b.push([l, sc ? nx(r.sc[i][0]) : '', sc ? nx(r.sc[i][1]) : '', sc ? nx(r.sc[i][2]) : '', nx(r.fx[i]), nx(r.cnt[i])]));
  b.push(['ECL 變動（本期 − 前期）', '', '', '', nx(r.delta)], ['勾稽差異', '', '', '', nx(r.diff, 4)], [], [{ v: '情境權重', s: 7 }], [HS(''), HS(SC_NAME[0]), HS(SC_NAME[1]), HS(SC_NAME[2])], ['前期權重', nx(r.w0[0], 3), nx(r.w0[1], 3), nx(r.w0[2], 3)], ['本期權重', nx(r.w1[0], 3), nx(r.w1[1], 3), nx(r.w1[2], 3)], [], [{ v: '變動說明', s: 7 }]);
  scenExplain(r).forEach(t => b.push([t]));
  out.push({ name: 'Scenario_Bridge', rows: b, widths: [28, 18, 18, 18, 18, 12] });
  const t = [[HS('情境'), HS('前期權重'), HS('前期100%情境模型ECL'), HS('前期加權貢獻'), HS('本期權重'), HS('本期100%情境模型ECL'), HS('本期加權貢獻'), HS('加權貢獻變動')]];
  [0, 1, 2].forEach(s => t.push([SC_NAME[s], nx(r.w0[s], 3), nx(r.tp.M[s]), nx(r.tp.M[s] * r.w0[s]), nx(r.w1[s], 3), nx(r.tc.M[s]), nx(r.tc.M[s] * r.w1[s]), nx(r.tc.M[s] * r.w1[s] - r.tp.M[s] * r.w0[s])]));
  t.push(['加權模型 ECL', '', '', nx(m0), '', '', nx(m1), nx(m1 - m0)], ['模型外調整（帳上 − 加權模型）', '', '', nx(r.tp.book - m0), '', '', nx(r.tc.book - m1), nx((r.tc.book - m1) - (r.tp.book - m0))], ['帳上 ECL', '', '', nx(r.tp.book), '', '', nx(r.tc.book), nx(r.delta)]);
  out.push({ name: 'Scenario_Totals', rows: t, widths: [30, 12, 22, 18, 12, 22, 18, 18] });
  const s = [[HS('權重假設'), HS('加權模型ECL'), HS('較目前權重'), HS('估計帳上ECL')]];
  [-20, -10, 0, 10, 20].forEach(dl => { const d = r.w1[2] + dl / 100, bb = r.w1[0] - dl / 100; if (d < -1e-9 || bb < -1e-9) return; const m = bb * r.tc.M[0] + r.w1[1] * r.tc.M[1] + d * r.tc.M[2]; s.push([`Base ${pctTxt(bb)} / Upside ${pctTxt(r.w1[1])} / Downside ${pctTxt(d)}`, nx(m), nx(m - m1), nx(r.tc.book + (m - m1))]); });
  [0, 1, 2].forEach(i => s.push(['100% ' + SC_NAME[i], nx(r.tc.M[i]), nx(r.tc.M[i] - m1), nx(r.tc.book + (r.tc.M[i] - m1))]));
  out.push({ name: 'Scenario_Sensitivity', rows: s, widths: [52, 18, 18, 18] });
  const head = [HS('項目'), HS('戶數'), HS('前期ECL'), HS('本期ECL'), HS('變動')].concat(SCE_LABEL.map(HS));
  const brow = (l, x) => [l, nx(x.cnt), nx(x.ecl0), nx(x.ecl1), nx(x.ecl1 - x.ecl0)].concat(x.fx.map(v => nx(v)));
  const st = [head]; [1, 2, 3].forEach(i => st.push(brow('Stage ' + i + '（期末）', r.byStage[i])));
  out.push({ name: 'Scenario_Stage', rows: st, widths: [18, 9, 16, 16, 16].concat(SCE_LABEL.map(() => 15)) });
  const dm = [[HS(DIM_LABEL[SCN.dim])].concat(head.slice(1))]; (r.byDim[SCN.dim] || []).forEach(x => dm.push(brow(x.key, x)));
  out.push({ name: 'Scenario_Dimension', rows: dm, freeze: 1, widths: [18, 9, 16, 16, 16].concat(SCE_LABEL.map(() => 15)) });
  return out;
}

/* ---- 情境事件 ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act;
  if (a === 'goto-import') goTab('import');
  else if (a === 's-run') { SCN.res = null; runScenario(); }
  else if (a === 's-export') exportBook(['Scenario'], 'ECL情境權重拆解');
  else if (a === 'copy-sexplain') copyText($('#sExplain').innerText);
  else if (a === 's-same') { ST.sc.curr = ST.sc.prev.slice(); saveST(); SCN.res = null; renderScen(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || t.dataset.act !== 's-w') return;
  const v = parseFloat(t.value); ST.sc[t.dataset.w][parseInt(t.dataset.i, 10)] = isNaN(v) ? 0 : Math.max(0, v);
  const c = $('#sSum_' + t.dataset.w); if (c) c.innerHTML = sumCell(t.dataset.w);
  const b = $('[data-act=s-run]'); if (b) b.disabled = !weightsValid();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset && t.dataset.act;
  if (a === 's-w') { saveST(); SCN.res = null; if (weightsValid()) runScenario(); else renderScenRes(); }
  else if (a === 's-dim') { SCN.dim = t.value; renderScenRes(); }
});
/* ================= 初始化 ================= */
applyTheme(); renderImport(); renderDQ(); updateButtons(); lockTabs();
window.__ECL = { get R() { return R; }, F, ST, UI, EN, call, TR, SCN };
})();
