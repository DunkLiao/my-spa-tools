<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD Migration 解釋器 v1.1</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--text:#1f2937;--muted:#6b7280;--border:#e2e6ec;
  --accent:#2563eb;--accent-soft:#e8f0fe;--bad:#d64545;--good:#2e9e6a;--info:#7c8aa5;--diag:#d5dbe5;
  --shadow:0 1px 3px rgba(16,24,40,.08);
  --font:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,"Cascadia Mono","Microsoft JhengHei",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;display:flex;flex-direction:column;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bad{color:var(--bad)}.good{color:var(--good)}.muted{color:var(--muted)}
/* header */
.top{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1;min-width:260px}
.steps li{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--border)}
.steps li b{width:20px;height:20px;border-radius:50%;background:var(--border);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.steps li.done{color:var(--text)}.steps li.done b{background:var(--good);color:#fff}
.steps li.cur{border-color:var(--accent);color:var(--accent)}.steps li.cur b{background:var(--accent);color:#fff}
.steps li.err b{background:var(--bad);color:#fff}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:relative}
.btn{border:1px solid var(--border);background:var(--panel);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{opacity:.9;color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu{position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;min-width:200px;z-index:30;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
/* layout */
.layout{display:flex;flex:1 0 auto;align-items:flex-start}
aside{width:380px;flex:none;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto}
main{flex:1;min-width:0;padding:12px 14px 30px 2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
details.card>summary{padding:9px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted)}
details.card:not([open])>summary::after{content:"▸"}
details.card>.body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.drop{border:1.5px dashed var(--border);border-radius:8px;padding:8px 10px;text-align:center;cursor:pointer;background:var(--panel2);display:block;font-size:13px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop.ok{border-style:solid;border-color:var(--good);text-align:left}
.drop .nm{font-weight:600;word-break:break-all}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--border);border-radius:6px;padding:4px 7px;background:var(--panel);color:var(--text)}
.hint{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--border);background:var(--panel2)}
.badge.err{background:#fde8e8;color:#b42318;border-color:#f7c1c1}
.badge.warn{background:#fff4d6;color:#8a5a00;border-color:#f2dc9b}
.badge.info{background:#e8f0fe;color:#1d4ed8;border-color:#c5d6fb}
[data-theme=dark] .badge.err{background:#4a1d1d;color:#ffb4b4;border-color:#7a2d2d}
[data-theme=dark] .badge.warn{background:#4a3a14;color:#ffd98a;border-color:#7a6224}
[data-theme=dark] .badge.info{background:#1c2b4d;color:#a9c3ff;border-color:#304878}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--muted);background:var(--panel2);position:sticky;top:0}
td.r,th.r{text-align:right}
.ms-table input[type=text],.ms-table input[type=number]{width:100%;border:1px solid var(--border);border-radius:5px;padding:2px 4px;background:var(--panel);min-width:0}
.ms-table td,.ms-table th{padding:2px 3px}
.ms-table input[type=number]::-webkit-inner-spin-button,.ms-table input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ms-table input[type=number]{-moz-appearance:textfield}
.ms-table th:nth-child(1),.ms-table td:nth-child(1){width:58px}.ms-table th:nth-child(2),.ms-table td:nth-child(2){width:44px}.ms-table th:nth-child(5),.ms-table td:nth-child(5){width:40px}.ms-table th:nth-child(6),.ms-table td:nth-child(6){width:34px}
.scroll{overflow:auto;max-width:100%}
.scroll.max{max-height:420px}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab kbd{font-size:10px;border:1px solid var(--border);border-radius:3px;padding:0 4px;margin-left:5px;color:var(--muted)}
.hl{outline:3px solid var(--accent);outline-offset:1px;border-radius:6px;transition:outline .1s}
svg .hl{outline:none;stroke:var(--accent)!important;stroke-width:3px!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media(max-width:1250px){.grid2{grid-template-columns:1fr}}
.pad{padding:12px 14px}
h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h3{font-size:14px;margin:12px 0 6px}
.chartbox{overflow:auto}
svg.chart{max-width:100%;height:auto;display:block;margin:0 auto}
svg .bar{cursor:pointer}svg .bar:hover{opacity:.8}
.cell{cursor:pointer}.cell:hover rect{stroke:var(--text);stroke-width:1.5px}
.sent{margin-right:.35em;padding:1px 3px;border-radius:4px;cursor:default}.sent:hover{background:var(--accent-soft)}
.narr p{margin:.5em 0;font-size:15px;line-height:1.85}
.seg-ctl{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg-ctl button{border:0;background:var(--panel);padding:4px 11px;cursor:pointer;font-size:13px}
.seg-ctl button.on{background:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-size:12px}
.chip button{border:0;background:none;cursor:pointer;color:inherit;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.errbox{border-left:4px solid var(--bad);padding:10px 14px;margin-bottom:12px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{justify-content:center;font-size:20px;color:var(--text)}
.range-row{display:grid;grid-template-columns:auto 1fr 70px;gap:8px;align-items:center}
.range-row input[type=number]{width:70px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:var(--panel)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px 22px}
.modal h2{font-size:17px}
.modal .map-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:5px 0}
.modal select{width:100%;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--panel)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:8px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw}
.toast.show{opacity:1}
footer{padding:10px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--panel);text-align:center}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:6px 0}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--accent)}
.tag{display:inline-block;padding:0 7px;border-radius:5px;font-size:12px;background:var(--panel2);border:1px solid var(--border)}
.eff-info{padding:10px 14px;margin-top:8px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px}
input[type=range]{width:100%}
@media(max-width:900px){.layout{flex-direction:column}aside{width:100%;position:static;max-height:none}main{padding:0 12px 30px}}
@media print{aside,.top,.tabs,footer{display:none}}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">PD</span><span>PD Migration 解釋器 <small>v1.1</small></span></div>
  <ol class="steps" id="steps"></ol>
  <div class="tools">
    <span class="hint" id="perf"></span>
    <button class="btn" data-act="help">說明</button>
    <button class="btn" id="t-cb" data-act="cb" title="色盲安全配色（橘／藍）">色盲安全</button>
    <button class="btn" id="t-rev" data-act="rev" title="反轉上升／下降的紅綠配色">反轉紅綠</button>
    <button class="btn" id="t-theme" data-act="theme">🌙 深色</button>
    <button class="btn primary" data-act="exp-menu">匯出 ▾</button>
    <div class="menu" id="menu-exp">
      <button data-exp data-act="exp-xlsx">Excel（.xlsx）　Ctrl+E</button>
      <button data-exp data-act="exp-md">Markdown（.md）</button>
      <button data-exp data-act="exp-png">目前分頁圖表（PNG）</button>
      <button data-act="exp-json">專案設定（JSON）</button>
      <button data-act="imp-json">載入專案設定…</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside>
    <details class="card" open><summary>① 資料載入</summary><div class="body" id="src"></div></details>
    <details class="card" open><summary>② 主尺度（Master Scale）</summary><div class="body" id="msbox"></div></details>
    <details class="card"><summary>篩選條件</summary><div class="body" id="filterbox"></div></details>
    <details class="card"><summary>參數與顯示</summary><div class="body" id="parambox"></div></details>
    <details class="card" open><summary>驗證結果</summary><div class="body" id="valid"></div></details>
  </aside>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <section id="view"></section>
  </main>
</div>
<footer>本工具結果僅供分析參考，不取代正式 ECL 系統與核定流程。資料僅於本機瀏覽器處理，不會上傳。</footer>
<div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="f-ms" accept=".csv,.json,.txt,.tsv" style="display:none">
<input type="file" id="f-json" accept=".json" style="display:none">
<script>
/* ===== PD Migration 解釋器 — 核心運算（無 DOM 相依，可於 Node 測試） ===== */
const PDM = (function () {
  'use strict';

  /* ---------- 工具 ---------- */
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\s_\-().]/g, '');
  const normRating = s => String(s == null ? '' : s).trim().toUpperCase();
  const isNum = x => typeof x === 'number' && isFinite(x);

  /* ---------- 欄位別名 ---------- */
  const FIELDS = [
    { key: 'obligor_id', label: '借戶代號 obligor_id', required: true },
    { key: 'rating', label: '評等 rating', required: true },
    { key: 'ead', label: '曝險額 ead', required: true },
    { key: 'pd', label: 'PD pd（選填）' },
    { key: 'segment', label: '分群 segment（選填）' },
    { key: 'stage', label: '階段 stage（選填）' },
    { key: 'override_flag', label: '人工調整 override_flag（選填）' },
    { key: 'exit_reason', label: '退出原因 exit_reason（選填）' },
    { key: 'period', label: '期別 period（合併檔用）' }
  ];
  const ALIASES = {
    obligor_id: ['obligorid', 'id', 'customerid', 'clientid', 'borrowerid', 'custid', '借戶代號', '借戶id', '客戶id', '客戶代號', '客戶編號', '借款人', '借款人代號', '戶號', '借戶編號', '借戶', '借户代号', '借户id', '客户id', '客户代号', '客户编号', '借款人代号', '户号', '借户编号'],
    rating: ['rating', 'grade', 'ratinggrade', '評等', '信用評等', '評等等級', '等級', '內部評等', '風險等級', '評等級', '评等', '信用评等', '评等等级', '等级', '内部评等', '风险等级', '评级', '信用评级', '評級', '信用評級'],
    ead: ['ead', 'exposure', 'exposureatdefault', '曝險', '曝險額', '曝險金額', '餘額', '金額', '曝險餘額', '曝险', '曝险额', '曝险金额', '余额', '金额', '曝险余额'],
    pd: ['pd', 'pdvalue', '違約機率', '違約率', 'pd值', '實際pd', '违约机率', '违约概率', '违约率'],
    segment: ['segment', 'sector', 'industry', '業務別', '產業', '產業別', '分群', '模型別', '業務', '行業別', '产业', '产业别', '业务别', '模型别', '行业别', '业务'],
    stage: ['stage', '階段', 'ifrs9階段', 'ifrs9stage', '阶段', 'ifrs9阶段'],
    override_flag: ['overrideflag', 'override', '人工調整', '覆寫', '調整註記', '人工覆寫', '人工调整', '覆写', '调整注记', '人工覆写'],
    exit_reason: ['exitreason', '退出原因'],
    period: ['period', '期別', '期間', '資料期', '資料日期', '年月', '報導期間', 'asofdate', '期别', '期间', '资料期', '资料日期', '报导期间']
  };

  function autoMap(headers) {
    const m = {}; const used = new Set();
    const nh = headers.map(norm);
    FIELDS.forEach(f => {
      let idx = -1;
      for (const a of ALIASES[f.key]) { const i = nh.indexOf(a); if (i >= 0 && !used.has(i)) { idx = i; break; } }
      if (idx >= 0) { used.add(idx); m[f.key] = headers[idx]; } else m[f.key] = null;
    });
    return m;
  }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    const cand = [',', '\t', ';', '|'];
    let delim = ',', best = -1;
    cand.forEach(d => { const c = firstLine.split(d).length; if (c > best) { best = c; delim = d; } });
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row); }
    return rows;
  }
  function csvEscape(v) {
    const s = v == null ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map(r => r.map(csvEscape).join(',')).join('\r\n'); }

  function tableToRecords(rows) {
    if (!rows.length) return { headers: [], records: [] };
    const headers = rows[0].map(h => String(h == null ? '' : h).trim());
    const records = [];
    for (let i = 1; i < rows.length; i++) {
      const o = {};
      headers.forEach((h, j) => { o[h] = rows[i][j] == null ? '' : rows[i][j]; });
      o.__line = i + 1;
      records.push(o);
    }
    return { headers, records };
  }

  /* ---------- 建立標準列 ---------- */
  function parseNumber(v) {
    if (typeof v === 'number') return { n: v, pct: false };
    let s = String(v == null ? '' : v).trim();
    if (s === '') return { n: null, pct: false };
    let pct = false;
    if (s.endsWith('%')) { pct = true; s = s.slice(0, -1); }
    s = s.replace(/,/g, '');
    const n = Number(s);
    return { n: s === '' || isNaN(n) ? NaN : n, pct };
  }

  // 回傳 { rows, issues }
  function buildRows(records, mapping, periodLabel) {
    const issues = []; const rows = [];
    const g = (r, k) => mapping[k] ? r[mapping[k]] : undefined;
    const pdTmp = [];
    records.forEach(r => {
      const id = String(g(r, 'obligor_id') == null ? '' : g(r, 'obligor_id')).trim();
      const rating = normRating(g(r, 'rating'));
      const e = parseNumber(g(r, 'ead'));
      const row = { id, rating, ead: 0, pd: null, seg: '', stage: null, ovr: '', exitReason: '', line: r.__line, period: periodLabel };
      if (!id) issues.push({ code: 'V00', level: 'error', period: periodLabel, id: '(空白)', line: r.__line, detail: '借戶代號空白' });
      if (e.n === null || isNaN(e.n) || e.n < 0) {
        issues.push({ code: 'V03', level: 'error', period: periodLabel, id, line: r.__line, detail: 'EAD 為負值、空白或非數值：' + g(r, 'ead') });
        row.ead = 0; row.badEad = true;
      } else row.ead = e.n;
      if (mapping.pd) {
        const p = parseNumber(g(r, 'pd'));
        if (p.n !== null) {
          if (isNaN(p.n)) { issues.push({ code: 'V04', level: 'error', period: periodLabel, id, line: r.__line, detail: 'PD 非數值：' + g(r, 'pd') }); }
          else { row.pd = p.n; if (p.pct) row.pdPct = true; pdTmp.push(row); }
        }
      }
      if (mapping.segment) row.seg = String(g(r, 'segment') == null ? '' : g(r, 'segment')).trim();
      if (mapping.stage) { const st = parseInt(g(r, 'stage'), 10); row.stage = [1, 2, 3].includes(st) ? st : null; }
      if (mapping.override_flag) row.ovr = /^(y|yes|1|true|是)$/i.test(String(g(r, 'override_flag')).trim()) ? 'Y' : 'N';
      if (mapping.exit_reason) row.exitReason = String(g(r, 'exit_reason') || '').trim();
      rows.push(row);
    });
    // PD 單位判斷：任一非 % 標記值 > 1 → 視為百分比
    let maxRaw = 0;
    pdTmp.forEach(r => { if (!r.pdPct && r.pd > maxRaw) maxRaw = r.pd; });
    const scaleAll = maxRaw > 1;
    pdTmp.forEach(r => {
      if (r.pdPct || scaleAll) r.pd = r.pd / 100;
      if (r.pd < 0 || r.pd > 1) issues.push({ code: 'V04', level: 'error', period: periodLabel, id: r.id, line: r.line, detail: 'PD 超出 0–1：' + r.pd });
    });
    return { rows, issues, pdScaled: scaleAll };
  }

  /* ---------- 主尺度 ---------- */
  function msMap(ms) {
    const m = {};
    ms.forEach(x => { m[normRating(x.rating)] = x; });
    return m;
  }
  function sortedMs(ms) { return ms.slice().sort((a, b) => a.rank - b.rank); }

  function defaultMasterScale() {
    const prev = [0.0003, 0.0007, 0.0015, 0.0035, 0.008, 0.018, 0.04, 0.09, 0.20];
    const ms = prev.map((p, i) => ({ rating: String(i + 1), rank: i + 1, pdPrev: p, pdCur: p * 1.05, isDefault: false }));
    ms.push({ rating: 'D', rank: 10, pdPrev: 1, pdCur: 1, isDefault: true });
    return ms;
  }

  /* ---------- 驗證 ---------- */
  function validate(prev, cur, ms, tolBp) {
    const issues = [];
    const msm = msMap(ms);
    const dupCheck = (rows, label) => {
      const seen = new Map();
      rows.forEach(r => {
        if (!r.id) return;
        if (seen.has(r.id)) { issues.push({ code: 'V01', level: 'error', period: label, id: r.id, line: r.line, detail: '同期借戶代號重複（首次出現於第 ' + seen.get(r.id) + ' 行）' }); }
        else seen.set(r.id, r.line);
      });
    };
    dupCheck(prev, '前期'); dupCheck(cur, '本期');
    const chkRating = (rows, label) => rows.forEach(r => {
      if (!msm[r.rating]) issues.push({ code: 'V02', level: 'error', period: label, id: r.id, line: r.line, detail: '評等不在主尺度：' + (r.rating || '(空白)') });
    });
    chkRating(prev, '前期'); chkRating(cur, '本期');
    const tol = (tolBp == null ? 1 : tolBp) / 1e4;
    const chkPd = (rows, label, key) => rows.forEach(r => {
      const m = msm[r.rating];
      if (r.pd != null && m && Math.abs(r.pd - m[key]) > tol) {
        issues.push({ code: 'V05', level: 'warn', period: label, id: r.id, line: r.line, detail: 'PD 與主尺度差異 ' + ((r.pd - m[key]) * 1e4).toFixed(1) + ' bp（視為個別調整）' });
      }
    });
    chkPd(prev, '前期', 'pdPrev'); chkPd(cur, '本期', 'pdCur');
    // V06 治癒
    const pm = new Map(prev.map(r => [r.id, r]));
    cur.forEach(r => {
      const p = pm.get(r.id);
      if (p && msm[p.rating] && msm[r.rating] && msm[p.rating].isDefault && !msm[r.rating].isDefault)
        issues.push({ code: 'V06', level: 'info', period: '本期', id: r.id, line: r.line, detail: '前期已違約、本期非違約（治癒）：' + p.rating + ' → ' + r.rating });
    });
    const sumE = a => a.reduce((s, r) => s + r.ead, 0);
    if (prev.length && sumE(prev) === 0) issues.push({ code: 'V07', level: 'error', period: '前期', id: '-', line: 0, detail: '前期 EAD 合計為 0' });
    if (cur.length && sumE(cur) === 0) issues.push({ code: 'V07', level: 'error', period: '本期', id: '-', line: 0, detail: '本期 EAD 合計為 0' });
    if (!prev.length) issues.push({ code: 'V07', level: 'error', period: '前期', id: '-', line: 0, detail: '前期無資料' });
    if (!cur.length) issues.push({ code: 'V07', level: 'error', period: '本期', id: '-', line: 0, detail: '本期無資料' });
    return issues;
  }

  /* ---------- 加權 PD ---------- */
  function wpd(items, eadF, pdF) {
    let n = 0, d = 0;
    for (let i = 0; i < items.length; i++) { const e = eadF(items[i]); n += e * pdF(items[i]); d += e; }
    return d > 0 ? n / d : 0;
  }

  const EFFECTS = [
    { key: 'exit', no: '①', name: '退出效果', desc: '前期存在、本期已退出（還清、轉銷、出售等）的借戶離開後，對組合加權 PD 的影響。' },
    { key: 'expo', no: '②', name: '曝險結構效果', desc: '存續戶 EAD 增減造成各借戶權重改變，使加權 PD 變動（評等與 PD 仍維持前期）。' },
    { key: 'mig', no: '③', name: '評等遷移效果', desc: '存續戶評等由前期改為本期，並以前期主尺度計價的 PD 變化，反映客戶信用品質的真實變化（內含「前期個別調整反轉」子項）。' },
    { key: 'cal', no: '④', name: '主尺度校準效果', desc: '本期主尺度（評等對應 PD）相對前期更新所造成的變化，反映模型／校準調整而非客戶本身改變。' },
    { key: 'adj', no: '⑤', name: '個別調整效果', desc: '實際使用 PD 與本期主尺度 PD 之差（如前瞻性調整、人工覆寫、管理加成）。' },
    { key: 'new', no: '⑥', name: '新增效果', desc: '本期新進的借戶加入後，對組合加權 PD 的影響。' }
  ];

  /* pairs: [{p:{..}|null, c:{..}|null}] ；回傳狀態與效果 */
  function decompose(pairs, msm) {
    const pdP = r => (r.pd != null ? r.pd : msm[r.rating].pdPrev);
    const pdC = r => (r.pd != null ? r.pd : msm[r.rating].pdCur);
    const surv = [], exits = [], news = [];
    pairs.forEach(x => { if (x.p && x.c) surv.push(x); else if (x.p) exits.push(x); else news.push(x); });
    const allPrev = pairs.filter(x => x.p), allCur = pairs.filter(x => x.c);
    const S = [];
    S[0] = wpd(allPrev, x => x.p.ead, x => pdP(x.p));
    S[1] = wpd(surv, x => x.p.ead, x => pdP(x.p));
    S[2] = wpd(surv, x => x.c.ead, x => pdP(x.p));
    S[3] = wpd(surv, x => x.c.ead, x => msm[x.c.rating].pdPrev);
    S[4] = wpd(surv, x => x.c.ead, x => msm[x.c.rating].pdCur);
    S[5] = wpd(surv, x => x.c.ead, x => pdC(x.c));
    S[6] = wpd(allCur, x => x.c.ead, x => pdC(x.c));
    const Sprime = wpd(surv, x => x.c.ead, x => msm[x.p.rating].pdPrev); // 前期評等、前期主尺度、本期 EAD
    const eff = EFFECTS.map((e, i) => ({ ...e, v: S[i + 1] - S[i] }));
    const total = S[6] - S[0];
    return {
      S, effects: eff, total,
      migPure: S[3] - Sprime,
      migRev: Sprime - S[2],
      counts: { surv: surv.length, exit: exits.length, new: news.length },
      avgPdExit: wpd(exits, x => x.p.ead, x => pdP(x.p)),
      avgPdNew: wpd(news, x => x.c.ead, x => pdC(x.c)),
      residual: total - eff.reduce((s, e) => s + e.v, 0)
    };
  }

  /* ---------- 主分析 ---------- */
  function analyze(prevRows, curRows, ms, opts) {
    opts = opts || {};
    const msm = msMap(ms);
    const rankOf = r => msm[r].rank;
    const isDef = r => !!msm[r].isDefault;
    const P = new Map(prevRows.map(r => [r.id, r]));
    const C = new Map(curRows.map(r => [r.id, r]));
    const ids = new Set([...P.keys(), ...C.keys()]);
    const pairs = [];
    ids.forEach(id => {
      const p = P.get(id) || null, c = C.get(id) || null;
      const key = c || p;
      pairs.push({ id, p, c, seg: key.seg || '(未分群)', stage: key.stage, ovr: key.ovr });
    });
    const pdP = r => (r.pd != null ? r.pd : msm[r.rating].pdPrev);
    const pdC = r => (r.pd != null ? r.pd : msm[r.rating].pdCur);

    const dec = decompose(pairs, msm);
    const surv = pairs.filter(x => x.p && x.c);
    const exits = pairs.filter(x => x.p && !x.c);
    const news = pairs.filter(x => !x.p && x.c);

    const Tp = prevRows.reduce((s, r) => s + r.ead, 0);
    const Tc = curRows.reduce((s, r) => s + r.ead, 0);

    /* 遷移矩陣 */
    const order = sortedMs(ms).map(x => normRating(x.rating));
    const idx = {}; order.forEach((r, i) => { idx[r] = i; });
    const n = order.length;
    const mk = () => Array.from({ length: n }, () => new Array(n).fill(0));
    const cnt = mk(), ead = mk();
    const exitCnt = new Array(n).fill(0), exitEad = new Array(n).fill(0);
    const newCnt = new Array(n).fill(0), newEad = new Array(n).fill(0);
    surv.forEach(x => { const i = idx[x.p.rating], j = idx[x.c.rating]; cnt[i][j]++; ead[i][j] += x.c.ead; });
    exits.forEach(x => { const i = idx[x.p.rating]; exitCnt[i]++; exitEad[i] += x.p.ead; });
    news.forEach(x => { const j = idx[x.c.rating]; newCnt[j]++; newEad[j] += x.c.ead; });

    /* 指標 */
    let up = 0, down = 0, same = 0, notchW = 0, notchD = 0, notchSum = 0;
    surv.forEach(x => {
      const d = rankOf(x.c.rating) - rankOf(x.p.rating);
      if (d > 0) down++; else if (d < 0) up++; else same++;
      notchW += d * x.c.ead; notchD += x.c.ead; notchSum += d;
    });
    const ns = surv.length;
    let newDef = 0, nonDefPrevSurv = 0, cures = 0;
    surv.forEach(x => {
      if (!isDef(x.p.rating)) { nonDefPrevSurv++; if (isDef(x.c.rating)) newDef++; }
      else if (!isDef(x.c.rating)) cures++;
    });
    const metrics = {
      survivors: ns, up, down, same,
      upRate: ns ? up / ns : 0, downRate: ns ? down / ns : 0,
      ratio: down > 0 ? up / down : (up > 0 ? Infinity : NaN),
      net: ns ? (up - down) / ns : 0,
      avgNotch: notchD > 0 ? notchW / notchD : 0,
      avgNotchSimple: ns ? notchSum / ns : 0,
      stability: ns ? same / ns : 0,
      newDefault: newDef, nonDefPrevSurv,
      newDefaultRate: nonDefPrevSurv ? newDef / nonDefPrevSurv : 0,
      cures
    };

    /* 借戶貢獻 */
    const contrib = pairs.map(x => {
      const nP = x.p ? x.p.ead * pdP(x.p) : 0, nC = x.c ? x.c.ead * pdC(x.c) : 0;
      const c = (Tc > 0 ? nC / Tc : 0) - (Tp > 0 ? nP / Tp : 0);
      let type = x.p && x.c ? '存續' : (x.p ? '退出' : '新增');
      let cause = '';
      if (x.p && x.c) {
        const rp = x.p.rating, rc = x.c.rating;
        const mig = x.c.ead * (msm[rc].pdPrev - msm[rp].pdPrev);
        const cal = x.c.ead * (msm[rc].pdCur - msm[rc].pdPrev);
        const adj = x.c.ead * ((pdC(x.c) - msm[rc].pdCur) - (pdP(x.p) - msm[rp].pdPrev));
        const exp = (x.c.ead - x.p.ead) * pdP(x.p);
        const arr = [['遷移', mig], ['校準', cal], ['調整', adj], ['曝險', exp]];
        arr.sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
        cause = Math.abs(arr[0][1]) < 1e-15 ? '無變動' : arr[0][0];
      } else cause = type;
      const rp = x.p ? x.p.rating : '', rc = x.c ? x.c.rating : '';
      return {
        id: x.id, type, seg: x.seg, stage: x.stage, ovr: x.ovr,
        rp, rc, notch: x.p && x.c ? rankOf(rc) - rankOf(rp) : null,
        ep: x.p ? x.p.ead : null, ec: x.c ? x.c.ead : null,
        pp: x.p ? pdP(x.p) : null, pc: x.c ? pdC(x.c) : null,
        c, cause
      };
    });

    /* 分群 */
    const segNames = [...new Set(pairs.map(x => x.seg))].sort();
    const segments = segNames.map(sn => {
      const sp = pairs.filter(x => x.seg === sn);
      const d = decompose(sp, msm);
      const eadP = sp.reduce((s, x) => s + (x.p ? x.p.ead : 0), 0);
      const eadC = sp.reduce((s, x) => s + (x.c ? x.c.ead : 0), 0);
      const contribution = contrib.filter(x => x.seg === sn).reduce((s, x) => s + x.c, 0);
      return { name: sn, d, eadP, eadC, shareP: Tp ? eadP / Tp : 0, shareC: Tc ? eadC / Tc : 0, pdP: d.S[0], pdC: d.S[6], contribution, n: sp.length };
    });

    /* 校準：各等級影響 */
    const calByRating = order.map(r => {
      let e = 0;
      surv.forEach(x => { if (x.c.rating === r) e += x.c.ead; });
      const surC = surv.reduce((s, x) => s + x.c.ead, 0);
      return { rating: r, v: surC > 0 ? e * (msm[r].pdCur - msm[r].pdPrev) / surC : 0 };
    });

    /* 降等集中 */
    const downByFrom = {}, downBySeg = {};
    surv.forEach(x => {
      if (rankOf(x.c.rating) > rankOf(x.p.rating)) {
        downByFrom[x.p.rating] = (downByFrom[x.p.rating] || 0) + 1;
        downBySeg[x.seg] = (downBySeg[x.seg] || 0) + 1;
      }
    });

    /* 個別調整戶數（本期） */
    const tol = ((opts.tolBp == null ? 1 : opts.tolBp)) / 1e4;
    const adjCount = curRows.filter(r => r.pd != null && Math.abs(r.pd - msm[r.rating].pdCur) > tol).length;

    /* SICR */
    const sicr = computeSicr(surv, msm, opts.sicr || defaultSicr(), pdP, pdC);

    return {
      msm, order, idx,
      Tp, Tc, nPrev: prevRows.length, nCur: curRows.length,
      pdPrev: dec.S[0], pdCur: dec.S[6], delta: dec.total,
      dec, metrics,
      matrix: { cnt, ead, exitCnt, exitEad, newCnt, newEad },
      contrib, segments, calByRating, downByFrom, downBySeg, adjCount,
      sicr,
      pairs
    };
  }

  function recomputeSicr(res, params) {
    const msm = res.msm;
    const pdP = r => (r.pd != null ? r.pd : msm[r.rating].pdPrev);
    const pdC = r => (r.pd != null ? r.pd : msm[r.rating].pdCur);
    return computeSicr(res.pairs.filter(x => x.p && x.c), msm, params, pdP, pdC);
  }
  function defaultSicr() { return { relOn: true, rel: 2, absOn: true, abs: 50, notchOn: true, notch: 3, mode: 'any' }; }

  function computeSicr(surv, msm, p, pdP, pdC) {
    const hits = [];
    surv.forEach(x => {
      if (msm[x.p.rating].isDefault) return;
      const a = pdP(x.p), b = pdC(x.c);
      const rel = a > 0 ? b / a : (b > 0 ? Infinity : 1);
      const abs = (b - a) * 1e4;
      const notch = msm[x.c.rating].rank - msm[x.p.rating].rank;
      const conds = [];
      if (p.relOn) conds.push(rel >= p.rel);
      if (p.absOn) conds.push(abs >= p.abs);
      if (p.notchOn) conds.push(notch >= p.notch);
      if (!conds.length) return;
      const ok = p.mode === 'all' ? conds.every(Boolean) : conds.some(Boolean);
      if (ok) hits.push({
        id: x.id, seg: x.seg, stage: x.stage, rp: x.p.rating, rc: x.c.rating, notch, pp: a, pc: b, rel, abs,
        ec: x.c.ead, reasons: [p.relOn && rel >= p.rel ? '相對增幅' : null, p.absOn && abs >= p.abs ? '絕對增幅' : null, p.notchOn && notch >= p.notch ? '降等' : null].filter(Boolean).join('／')
      });
    });
    const nonDef = surv.filter(x => !msm[x.p.rating].isDefault);
    const byStage = {};
    [1, 2, 3, '未知'].forEach(s => { byStage[s] = { total: 0, hit: 0, ead: 0 }; });
    nonDef.forEach(x => { const s = x.stage || '未知'; byStage[s].total++; });
    hits.forEach(h => { const s = h.stage || '未知'; byStage[s].hit++; byStage[s].ead += h.ec; });
    return { hits, base: nonDef.length, byStage, params: p };
  }

  /* ---------- 解釋文字 ---------- */
  function narrate(res, o) {
    o = o || {};
    const tone = o.tone || 'formal', len = o.len || 'standard', unit = o.unit || 'bp';
    const formal = tone === 'formal';
    const pctS = x => (x * 100).toFixed(2) + '%';
    const bp = x => (Math.abs(x) * 1e4).toFixed(1) + ' bp';
    const sbp = x => (x >= 0 ? '+' : '−') + (Math.abs(x) * 1e4).toFixed(1) + ' bp';
    const dmag = x => unit === 'bp' ? bp(x) : (Math.abs(x) * 100).toFixed(3) + ' 個百分點';
    const sd = x => unit === 'bp' ? sbp(x) : (x >= 0 ? '+' : '−') + (Math.abs(x) * 100).toFixed(3) + ' 個百分點';
    const out = [];
    const d = res.delta, eff = res.dec.effects, m = res.metrics;
    const totalAbs = Math.abs(d);
    const flat = totalAbs * 1e4 < 1;

    // 1 總結
    if (flat) out.push({ ref: 'kpi', text: `${formal ? '本期組合 EAD 加權 PD' : '這期整體加權 PD'}由 ${pctS(res.pdPrev)} 變為 ${pctS(res.pdCur)}，整體 PD 大致持平（變動 ${sbp(d)}）。` });
    else out.push({ ref: 'kpi', text: `${formal ? '本期組合 EAD 加權 PD' : '這期整體加權 PD'}由 ${pctS(res.pdPrev)} ${d > 0 ? '上升' : '下降'}至 ${pctS(res.pdCur)}，${d > 0 ? '增加' : '減少'} ${dmag(d)}。` });

    // 2 主因
    const ranked = eff.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
    const main = ranked[0], second = ranked[1];
    const hasMain = Math.abs(main.v) * 1e4 >= 0.05;
    if (hasMain && !flat) {
      const share = totalAbs > 0 ? Math.abs(main.v) / totalAbs * 100 : 0;
      let t = '';
      if (second && Math.abs(second.v) >= 0.8 * Math.abs(main.v) && Math.abs(second.v) * 1e4 >= 0.05) {
        t = `${formal ? '主要驅動因子為' : '主要是'}${main.name}（${sd(main.v)}）與${second.name}（${sd(second.v)}）${formal ? '共同驅動' : '一起造成'}。`;
      } else {
        t = `${formal ? '主要驅動因子為' : '主要是'}${main.name}（${sd(main.v)}，${formal ? '占總變動' : '佔總變動的'} ${share.toFixed(0)}%）` + (second && Math.abs(second.v) * 1e4 >= 0.05 ? `，其次為${second.name}（${sd(second.v)}）` : '') + '。';
      }
      const opp = eff.filter(e => Math.sign(e.v) !== Math.sign(main.v) && Math.abs(e.v) * 1e4 >= 0.05);
      const oppSum = opp.reduce((s, e) => s + Math.abs(e.v), 0);
      if (opp.length && oppSum > 0.5 * Math.abs(main.v)) {
        const o2 = opp.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v))[0];
        t += `${formal ? '惟' : '不過'}部分被${o2.name}（${sd(o2.v)}）抵銷。`;
      }
      out.push({ ref: 'eff-' + main.key, text: t });
    } else if (!flat) {
      out.push({ ref: 'wf', text: '各項效果皆很小，沒有明顯的單一驅動因子。' });
    }

    // 3 遷移
    {
      let t = `${formal ? '存續戶' : '兩期都在的借戶共'} ${m.survivors.toLocaleString()} 戶中，降等 ${m.down.toLocaleString()} 戶、升等 ${m.up.toLocaleString()} 戶、維持 ${m.same.toLocaleString()} 戶，升降比 ${isFinite(m.ratio) ? m.ratio.toFixed(2) : (isNaN(m.ratio) ? 'N/A' : '∞')}`;
      const topFrom = Object.entries(res.downByFrom).sort((a, b) => b[1] - a[1])[0];
      const segs = Object.entries(res.downBySeg).sort((a, b) => b[1] - a[1]);
      const parts = [];
      if (topFrom && m.down > 0) parts.push(`前期 ${topFrom[0]} 級`);
      if (segs.length > 1 && m.down > 0 && segs[0][1] / m.down >= 0.4) parts.push(segs[0][0]);
      if (parts.length) t += `，降等主要集中於${parts.join('、')}`;
      t += '。';
      out.push({ ref: 'matrix', text: t });
    }

    if (len === 'short') return out;

    // 4 校準
    const cal = eff.find(e => e.key === 'cal');
    if (Math.abs(cal.v) * 1e4 >= 0.05) {
      const top = res.calByRating.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v))[0];
      out.push({ ref: 'eff-cal', text: `${formal ? '本期主尺度更新' : '主尺度這期有調整'}使 PD ${cal.v > 0 ? '上升' : '下降'} ${dmag(cal.v)}，影響最大的等級為 ${top.rating} 級。` });
    }

    // 5 新增／退出
    {
      const c = res.dec.counts;
      if (c.new || c.exit) {
        const net = res.dec.effects.find(e => e.key === 'exit').v + res.dec.effects.find(e => e.key === 'new').v;

  <tr><td>S0</td><td>前期全部</td><td>前期</td><td>前期</td><td>前期實際 PD</td></tr><tr><td>S1</td><td>存續戶</td><td>前期</td><td>前期</td><td>前期實際 PD</td></tr><tr><td>S2</td><td>存續戶</td><td>本期</td><td>前期</td><td>前期實際 PD</td></tr><tr><td>S3</td><td>存續戶</td><td>本期</td><td>本期</td><td>前期主尺度</td></tr><tr><td>S4</td><td>存續戶</td><td>本期</td><td>本期</td><td>本期主尺度</td></tr><tr><td>S5</td><td>存續戶</td><td>本期</td><td>本期</td><td>本期實際 PD</td></tr><tr><td>S6</td><td>本期全部</td><td>本期</td><td>本期</td><td>本期實際 PD</td></tr></tbody></table>
  <p>①退出＝S1−S0；②曝險結構＝S2−S1；③評等遷移＝S3−S2；④主尺度校準＝S4−S3；⑤個別調整＝S5−S4；⑥新增＝S6−S5。<br>拆解結果與順序有關；本工具採固定順序，使結果可重現、可稽核。</p>
  <p><b>檔案編碼：</b>自動偵測 UTF-8（含／不含 BOM）、Big5／Big5-HKSCS／CP950（繁體 ANSI）、UTF-16 LE／BE（Excel「Unicode 文字」）、UTF-32、GBK／GB18030。若中文顯示不正常，可在檔案卡片下方手動改選編碼。xlsx 不受編碼影響。</p><p><b>快速鍵：</b>1–6 切換分頁、/ 搜尋借戶、Ctrl+E 匯出 Excel、Esc 關閉視窗。</p>
  <p><b>限制：</b>本工具不估計 PD、不計算完整 ECL；SICR 門檻為預設參數；結果僅供分析參考，不取代正式 ECL 系統與核定流程。</p>
  <p><b>隱私：</b>資料只在瀏覽器記憶體內處理，不對外傳送；只有「主尺度與參數設定」會存在本機 localStorage，借戶資料不會儲存。</p>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="modal-close">關閉</button></div>`;
  $('#modal').classList.add('open');
}

/* ===== 事件 ===== */
function copyText(t) { if (navigator.clipboard && window.isSecureContext !== false) { navigator.clipboard.writeText(t).then(() => toast('已複製'), () => fallbackCopy(t)); } else fallbackCopy(t); }
function fallbackCopy(t) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('複製失敗，請手動選取'); } ta.remove(); }
function setTab(t) { S.ui.tab = t; renderTabs(); renderView(); window.scrollTo({ top: 0 }); }
function refreshSicr() { if (!S.res) return; S.res.sicr = PDM.recomputeSicr(S.res, S.params.sicr); const o = $('#sicr-out'); if (o) o.innerHTML = sicrOut(S.res); U.saveSettings(); }

document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('.tools')) $$('.menu.open').forEach(m => m.classList.remove('open'));
  const drop = t.closest('.drop');
  if (drop && !t.closest('button') && t.tagName !== 'INPUT') { drop.querySelector('input[type=file]').click(); return; }
  const cell = t.closest('g.cell'); if (cell) { S.drill = { from: cell.dataset.from, to: cell.dataset.to }; S.dpage = 0; S.dq = ''; S.dtype = ''; setTab('detail'); return; }
  const eff = t.closest('[data-eff]');
  if (eff) { S.ui.sel = eff.dataset.eff; if (S.ui.tab !== 'decomp') { setTab('decomp'); } else { renderView(); } return; }
  const tb = t.closest('[data-tab]'); if (tb && !tb.dataset.act) { setTab(tb.dataset.tab); return; }
  const mv = t.closest('[data-mview]'); if (mv) { S.ui.mview = mv.dataset.mview; renderView(); return; }
  const un = t.closest('[data-unit]'); if (un) { S.ui.unit = un.dataset.unit; U.saveSettings(); renderParams(); renderView(); return; }
  const nr = t.closest('[data-narr]'); if (nr) { S.ui[nr.dataset.narr] = nr.dataset.v; U.saveSettings(); renderParams(); renderView(); return; }
  const sm = t.closest('[data-sicrmode]'); if (sm) { S.params.sicr.mode = sm.dataset.sicrmode; renderView(); refreshSicr(); return; }
  const so = t.closest('[data-sort]'); if (so) { const k = so.dataset.sort; S.dsort = { k, d: S.dsort.k === k ? -S.dsort.d : (['id', 'type', 'seg', 'rp', 'rc', 'cause'].includes(k) ? 1 : -1) }; S.dpage = 0; $('#dtl').innerHTML = detailTableHtml(); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, slot = a.dataset.slot;
  switch (act) {
    case 'sample': U.loadSample(); break;
    case 'sample-csv': { const d = PDM.sampleData(); download('範例_前期.csv', '\ufeff' + PDM.rowsToCsv(d.prev), 'text/csv'); setTimeout(() => download('範例_本期.csv', '\ufeff' + PDM.rowsToCsv(d.cur), 'text/csv'), 300); break; }
    case 'clear': U.clearAll(); break;
    case 'map': openMapping(slot); break;
    case 'rm': S.src[slot] = null; U.afterDataChange(); break;
    case 'map-apply': { const src = S.src[slot]; $$('[data-mapf]').forEach(s => { src.mapping[s.dataset.mapf] = s.value || null; }); if (slot === 'combo') { const ps = U.distinctPeriods(src); S.period.prev = ps.length >= 2 ? ps[ps.length - 2] : (ps[0] || null); S.period.cur = ps.length >= 2 ? ps[ps.length - 1] : null; } $('#modal').classList.remove('open'); U.afterDataChange(); break; }
    case 'modal-close': $('#modal').classList.remove('open'); break;
    case 'ms-add': { const mx = S.ms.reduce((s, m) => Math.max(s, m.rank), 0); S.ms.push({ rating: String(mx + 1), rank: mx + 1, pdPrev: 0, pdCur: 0, isDefault: false }); U.saveSettings(); U.afterDataChange(); break; }
    case 'ms-del': S.ms.splice(+a.dataset.i, 1); U.saveSettings(); U.afterDataChange(); break;
    case 'ms-reset': S.ms = PDM.defaultMasterScale(); U.saveSettings(); U.afterDataChange(); break;
    case 'ms-fill': {
      const have = new Set(S.ms.map(m => PDM.normRating(m.rating))); const add = new Map();
      [S.rows.prev, S.rows.cur].forEach((rows, pi) => rows.forEach(r => { if (r.rating && !have.has(r.rating)) { const o = add.get(r.rating) || { n: 0, p: [0, 0], e: [0, 0] }; o.n++; if (r.pd != null) { o.p[pi] += r.pd * r.ead; o.e[pi] += r.ead; } add.set(r.rating, o); } }));
      if (!add.size) { toast('沒有缺少的等級'); break; }
      let mx = S.ms.reduce((s, m) => Math.max(s, m.rank), 0);
      [...add.keys()].sort().forEach(k => { const o = add.get(k); mx++; S.ms.push({ rating: k, rank: mx, pdPrev: o.e[0] ? o.p[0] / o.e[0] : 0, pdCur: o.e[1] ? o.p[1] / o.e[1] : 0, isDefault: false }); });
      U.saveSettings(); U.afterDataChange(); toast('已補上 ' + add.size + ' 個等級，請確認序號與 PD'); break;
    }
    case 'ms-import': $('#f-ms').click(); break;
    case 'ms-csv': download('主尺度.csv', '\ufeff' + msCsv(), 'text/csv'); break;
    case 'ms-json': download('主尺度.json', JSON.stringify(S.ms, null, 2), 'application/json'); break;
    case 'fclear': S.filters = { seg: [], stage: [], eadMin: '', eadMax: '', ovr: '' }; U.afterDataChange(); break;
    case 'valid-csv': download('驗證問題明細.csv', '\ufeff' + PDM.toCSV([['代碼', '等級', '期別', '行號', '借戶', '說明']].concat(S.issues.map(i => [i.code, i.level, i.period, i.line || '', idv(i.id), i.detail]))), 'text/csv'); break;
    case 'tab': setTab(a.dataset.tab); break;
    case 'drill-clear': S.drill = null; S.dpage = 0; renderView(); break;
    case 'page': S.dpage += +a.dataset.d; $('#dtl').innerHTML = detailTableHtml(); break;
    case 'detail-csv': download('借戶明細.csv', '\ufeff' + PDM.toCSV([['借戶', '類型', '分群', '前期評等', '本期評等', 'Notch', '前期EAD', '本期EAD', '前期PD', '本期PD', '貢獻bp', '主因']].concat(detailRows().map(r => [idv(r.id), r.type, r.seg, r.rp, r.rc, r.notch == null ? '' : r.notch, r.ep == null ? '' : r.ep, r.ec == null ? '' : r.ec, r.pp == null ? '' : r.pp, r.pc == null ? '' : r.pc, (r.c * 1e4).toFixed(4), r.cause]))), 'text/csv'); break;
    case 'sicr-csv': download('SICR命中清單.csv', '\ufeff' + PDM.toCSV([['借戶', '分群', 'Stage', '前期評等', '本期評等', 'Notch', '前期PD', '本期PD', '相對增幅', '絕對增幅bp', '本期EAD', '觸發條件']].concat(S.res.sicr.hits.map(h => [idv(h.id), h.seg, h.stage || '', h.rp, h.rc, h.notch, h.pp, h.pc, isFinite(h.rel) ? h.rel : 'inf', h.abs.toFixed(2), h.ec, h.reasons]))), 'text/csv'); break;
    case 'copy-txt': copyText(sentences().map(x => x.text).join('\n')); break;
    case 'copy-md': copyText(mdText()); break;
    case 'exp-menu': $('#menu-exp').classList.toggle('open'); break;
    case 'exp-xlsx': exportXlsx(); break;
    case 'exp-md': if (S.res) { download(`PD_Migration_${dateTag()}.md`, mdText(), 'text/markdown'); toast('已匯出 Markdown'); } break;
    case 'exp-png': exportPng().catch(err => toast('PNG 匯出失敗：' + err)); break;
    case 'exp-json': download('PD_Migration_專案設定.json', projectJson(), 'application/json'); break;
    case 'imp-json': $('#f-json').click(); break;
    case 'help': openHelp(); break;
    case 'theme': S.ui.theme = S.ui.theme === 'dark' ? 'light' : 'dark'; U.saveSettings(); renderAll(); break;
    case 'cb': S.ui.cb = !S.ui.cb; U.saveSettings(); renderAll(); break;
    case 'rev': S.ui.rev = !S.ui.rev; U.saveSettings(); renderAll(); break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.enc) { await U.reloadEnc(t.dataset.enc, t.value); return; }
  if (t.matches('input[type=file][data-slot]')) { if (t.files[0]) await U.handleFile(t.files[0], t.dataset.slot); t.value = ''; return; }
  if (t.id === 'f-ms') { const f = t.files[0]; if (f) { try { importMs(PDM.decodeBuffer(await f.arrayBuffer(), 'auto').text, f.name); U.saveSettings(); U.afterDataChange(); toast('已匯入主尺度'); } catch (err) { toast('匯入失敗：' + err.message); } } t.value = ''; return; }
  if (t.id === 'f-json') { const f = t.files[0]; if (f) { try { importProject(PDM.decodeBuffer(await f.arrayBuffer(), 'auto').text); } catch (err) { toast('專案設定讀取失敗：' + err.message); } } t.value = ''; return; }
  if (t.dataset.ms != null) {
    const m = S.ms[+t.dataset.ms], k = t.dataset.k;
    if (k === 'rating') m.rating = t.value.trim(); else if (k === 'rank') m.rank = parseFloat(t.value); else if (k === 'isDefault') { m.isDefault = t.checked; if (t.checked) { m.pdPrev = 1; m.pdCur = 1; } } else m[k] = parseFloat(t.value) / 100;
    U.saveSettings(); U.afterDataChange(); return;
  }
  if (t.dataset.period) { S.period[t.dataset.period] = t.value; U.afterDataChange(); return; }
  if (t.dataset.fseg != null) { const a = S.filters.seg, v = t.dataset.fseg; S.filters.seg = t.checked ? a.concat(v) : a.filter(x => x !== v); U.afterDataChange(); return; }
  if (t.dataset.fstage != null) { const a = S.filters.stage, v = t.dataset.fstage; S.filters.stage = t.checked ? a.concat(v) : a.filter(x => x !== v); U.afterDataChange(); return; }
  if (t.dataset.fead) { S.filters[t.dataset.fead] = t.value; U.afterDataChange(); return; }
  if (t.dataset.fovr != null) { S.filters.ovr = t.value; U.afterDataChange(); return; }
  if (t.dataset.tol != null) { S.params.tolBp = Math.max(0, parseFloat(t.value) || 0); U.saveSettings(); U.afterDataChange(); return; }
  if (t.dataset.deid != null) { S.ui.deid = t.checked; U.saveSettings(); renderValid(); renderView(); return; }
  if (t.dataset.dtype != null) { S.dtype = t.value; S.dpage = 0; $('#dtl').innerHTML = detailTableHtml(); return; }
});
let sicrT = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sicr) {
    const k = t.dataset.sicr, p = S.params.sicr;
    if (t.type === 'checkbox') p[k] = t.checked; else { p[k] = parseFloat(t.value) || 0; $$(`[data-sicr="${k}"]`).forEach(x => { if (x !== t) x.value = t.value; }); }
    clearTimeout(sicrT); sicrT = setTimeout(refreshSicr, 120); return;
  }
  if (t.dataset.dq != null) { S.dq = t.value; S.dpage = 0; clearTimeout(sicrT); sicrT = setTimeout(() => { $('#dtl').innerHTML = detailTableHtml(); }, 150); }
});
// 拖曳
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('.drop'); if (d) d.classList.remove('over'); }));
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('.drop'); if (d && e.dataTransfer.files.length) { e.preventDefault(); U.handleFile(e.dataTransfer.files[0], d.dataset.slot); } else if (e.dataTransfer && e.dataTransfer.files.length) e.preventDefault(); });
document.addEventListener('dragover', e => e.preventDefault());
// 句子 → 圖表高亮
document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.sent'); if (!s) return; $$('.hl').forEach(x => x.classList.remove('hl')); const r = s.dataset.sref; $$(`[data-ref~="${r}"]`).forEach(x => x.classList.add('hl')); if (r === 'wf') $$('.bar').forEach(x => x.classList.add('hl')); });
document.addEventListener('mouseout', e => { const s = e.target.closest && e.target.closest('.sent'); if (s) $$('.hl').forEach(x => { if (!x.classList.contains('eff-row')) x.classList.remove('hl'); }); });
// 快速鍵
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (e.key === 'Escape') { $('#modal').classList.remove('open'); $$('.menu.open').forEach(m => m.classList.remove('open')); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); exportXlsx(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key)) { if (S.res) setTab(TABS[+e.key - 1][0]); }
  else if (e.key === '/') { if (S.res) { e.preventDefault(); if (S.ui.tab !== 'detail') setTab('detail'); const q = $('[data-dq]'); if (q) q.focus(); } }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); });

U.loadSettings(); renderAll();
})();

</script>
