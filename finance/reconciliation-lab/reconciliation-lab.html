<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; worker-src blob:; img-src data: blob:; connect-src 'none'">
<title>Reconciliation Lab 資料勾稽工作台</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--text:#1d2433;--muted:#667085;--line:#d9dee7;
  --brand:#1f5fbf;--brand-d:#174a96;--ok:#1a7f4b;--warn:#b26a00;--bad:#c62828;--info:#5b4bc4;
  --ok-bg:#e3f4ea;--warn-bg:#fff2d9;--bad-bg:#fde7e7;--info-bg:#ebe8fb;--gray-bg:#eceff3;
  --shadow:0 1px 3px rgba(16,24,40,.12);--mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--panel:#1b1f27;--panel2:#232833;--text:#e6e9ef;--muted:#9aa4b5;--line:#313846;
  --brand:#5b9cff;--brand-d:#7fb2ff;--ok:#4cc48a;--warn:#f0b04a;--bad:#ff7b7b;--info:#a99cff;
  --ok-bg:#16301f;--warn-bg:#33270f;--bad-bg:#3a1b1b;--info-bg:#25214a;--gray-bg:#2a303b;--shadow:none}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header .sp{flex:1}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:0}
nav{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--text);text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a:hover{background:var(--panel2)}
nav a.active{background:var(--brand);color:#fff}
nav a .n{width:22px;height:22px;border-radius:50%;background:var(--gray-bg);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
nav a.active .n{background:rgba(255,255,255,.25);color:#fff}
nav a .ck{margin-left:auto;color:var(--ok);font-weight:700}
nav a.active .ck{color:#fff}
nav .sep{height:1px;background:var(--line);margin:8px 4px}
main{padding:16px 20px;overflow:auto;min-width:0}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.top{align-items:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;min-width:0}
input[type=number]{width:90px}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
label.inl{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--panel2);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td.num,table.t th.num{text-align:right;font-family:var(--mono)}
table.t td.mono{font-family:var(--mono)}
table.t td{white-space:nowrap}
table.t td.wrap{white-space:normal}
.tscroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:6px}
.badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;line-height:20px;font-weight:600;white-space:nowrap}
.b-MATCH,.b-EQ,.b-Fixed{background:var(--ok-bg);color:var(--ok)}
.b-DIFF,.b-NE,.b-Open{background:var(--bad-bg);color:var(--bad)}
.b-TOL,.b-Explained{background:var(--warn-bg);color:var(--warn)}
.b-A_ONLY,.b-B_ONLY,.b-NULL_A,.b-NULL_B{background:var(--info-bg);color:var(--info)}
.b-DUP_A,.b-DUP_B,.b-NULL_KEY,.b-Accepted{background:var(--gray-bg);color:var(--text)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;border:1px solid var(--line);background:var(--panel2)}
.msg.err{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.msg.okm{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.msg.wn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--panel2);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);cursor:pointer}
.kpi:hover{border-color:var(--brand)}
.kpi.sel{outline:2px solid var(--brand)}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono)}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{height:10px;background:var(--gray-bg);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.vl{border:1px solid var(--line);border-radius:6px;overflow:auto;position:relative;background:var(--panel)}
.vl .vrow{position:absolute;left:0;right:0;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 8px;gap:8px;cursor:pointer;font-size:13px}
.vl .vrow:hover{background:var(--panel2)}
.vl .vrow.sel{background:var(--panel2);outline:1px solid var(--brand);outline-offset:-1px}
.vl .vrow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vhead{display:flex;gap:8px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;font-weight:600;font-size:12px}
.vhead+.vl{border-radius:0 0 6px 6px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
@media (max-width:1250px){.split{grid-template-columns:1fr}}
.drawer{position:sticky;top:0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border-radius:10px;padding:18px;max-width:760px;width:92%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.toast{white-space:pre-line;position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;max-width:420px}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:1px 10px;background:var(--panel2);font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:13px}
.kv b{color:var(--muted);font-weight:500}
pre.code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-family:var(--mono);font-size:12px;margin:6px 0}
.progress{height:14px;background:var(--gray-bg);border-radius:7px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .15s}
.hidden{display:none!important}
@media print{header,nav,.noprint{display:none!important}.layout{display:block}main{overflow:visible}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
 * ENGINE（純函式，可在 Web Worker 或主執行緒執行）
 * 重要：此函式會被 toString() 後放進 Blob Worker，內部不可引用外部變數
 * ============================================================ */
function makeEngine(){
  const NUM_RE=/^(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/;
  const SIMPLE_NUM=/^-?\d+(\.\d+)?$/;
  const EPS=1e-9;
  const SEP='\u0001';

  /* ---------- 基礎轉換 ---------- */
  function toHalf(s){
    return s.replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/\u3000/g,' ');
  }
  const TRANSFORMS={
    trim:function(){return function(s){return s.trim();};},
    upper:function(){return function(s){return s.toUpperCase();};},
    lower:function(){return function(s){return s.toLowerCase();};},
    half:function(){return toHalf;},
    squash:function(){return function(s){return s.replace(/\s+/g,' ').trim();};},
    digits:function(){return function(s){return s.replace(/\D+/g,'');};},
    ltrimZeros:function(){return function(s){var t=s.replace(/^0+/,'');return t===''&&s!==''?'0':t;};},
    padStart:function(a){var n=parseInt(a[0],10),c=(a[1]===undefined||a[1]==='')?'0':a[1];if(!(n>=0&&n<=64))throw new Error('padStart 長度需為 0~64');return function(s){return s.padStart(n,c);};},
    padEnd:function(a){var n=parseInt(a[0],10),c=(a[1]===undefined||a[1]==='')?' ':a[1];if(!(n>=0&&n<=64))throw new Error('padEnd 長度需為 0~64');return function(s){return s.padEnd(n,c);};},
    removeChars:function(a){var set=a.join(':');if(set==='')throw new Error('removeChars 需指定要移除的字元');return function(s){var o='';for(var i=0;i<s.length;i++){if(set.indexOf(s[i])<0)o+=s[i];}return o;};},
    substr:function(a){var st=parseInt(a[0],10),ln=parseInt(a[1],10);if(isNaN(st)||isNaN(ln))throw new Error('substr 需 start:length');return function(s){return s.substr(st,ln);};},
    left:function(a){var n=parseInt(a[0],10);if(isNaN(n))throw new Error('left 需長度');return function(s){return s.slice(0,n);};},
    right:function(a){var n=parseInt(a[0],10);if(isNaN(n)||n<0)throw new Error('right 需長度');return function(s){return n===0?'':s.slice(-n);};}
  };
  function compileTransform(spec){
    var p=String(spec).trim();
    if(p==='')return null;
    var parts=p.split(':'),name=parts[0],mk=Object.prototype.hasOwnProperty.call(TRANSFORMS,name)?TRANSFORMS[name]:null;
    if(!mk)throw new Error('未知的轉換函式：'+name);
    return mk(parts.slice(1));
  }
  function compileTransforms(list){
    var out=[];
    for(var i=0;i<(list||[]).length;i++){var f=compileTransform(list[i]);if(f)out.push(f);}
    return out;
  }
  function validateTransform(spec){try{compileTransform(spec);return null;}catch(e){return e.message;}}
  function applyFns(fns,s){for(var i=0;i<fns.length;i++)s=fns[i](s);return s;}
  function str(v){return v===null||v===undefined?'':String(v);}

  /* ---------- 型別解析 ---------- */
  function parseNumber(v){
    if(typeof v==='number')return isFinite(v)?v:NaN;
    if(typeof v==='string'&&SIMPLE_NUM.test(v))return parseFloat(v);   // 快速路徑
    var s=toHalf(str(v)).trim(),neg=false;
    if(s==='')return NaN;
    if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1).trim();}
    if(s[0]==='-'||s[0]==='+'){if(s[0]==='-')neg=!neg;s=s.slice(1).trim();}
    s=s.replace(/^(NT\$|NTD|TWD|USD|US\$|RMB|CNY|JPY|EUR|HK\$|\$|¥|￥|€)\s*/i,'');
    s=s.replace(/,/g,'').replace(/\s/g,'');
    if(s.slice(-1)==='-'){neg=!neg;s=s.slice(0,-1);}
    if(s.slice(-1)==='%')s=s.slice(0,-1);
    if(!NUM_RE.test(s))return NaN;
    var n=parseFloat(s);
    return neg?-n:n;
  }
  function validYMD(y,m,d){
    if(!(y>=1&&y<=9999&&m>=1&&m<=12&&d>=1&&d<=31))return null;
    var dt=new Date(Date.UTC(y,m-1,d));
    if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
    return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  /* 支援 YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD / YYYYMMDD / 民國 YYY/MM/DD / YYYMMDD / 115年10月27日；年份 ≤3 位視為民國 */
  function parseDate(v){
    var s=toHalf(str(v)).trim(),m;
    if(s==='')return null;
    s=s.split(/[ T]/)[0];
    if((m=/^(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(s))||(m=/^(\d{1,4})年(\d{1,2})月(\d{1,2})日?$/.exec(s))){
      var y=parseInt(m[1],10);if(m[1].length<=3)y+=1911;
      return validYMD(y,parseInt(m[2],10),parseInt(m[3],10));
    }
    if((m=/^(\d{7})$/.exec(s)))return validYMD(parseInt(s.slice(0,3),10)+1911,parseInt(s.slice(3,5),10),parseInt(s.slice(5,7),10));
    if((m=/^(\d{8})$/.exec(s)))return validYMD(parseInt(s.slice(0,4),10),parseInt(s.slice(4,6),10),parseInt(s.slice(6,8),10));
    return null;
  }
  var BOOL_T={'y':1,'yes':1,'true':1,'t':1,'1':1,'是':1,'有':1,'真':1};
  var BOOL_F={'n':1,'no':1,'false':1,'f':1,'0':1,'否':1,'無':1,'假':1};
  function parseBool(v){
    var s=toHalf(str(v)).trim().toLowerCase();
    if(BOOL_T[s])return true;
    if(BOOL_F[s])return false;
    return null;
  }
  function round(n,d){var k=Math.pow(10,d);return Math.round(n*k)/k;}

  /* ---------- 欄位比對 ---------- */
  function compileField(f,idx){
    return {
      idx:idx,a:f.a,b:f.b,type:f.type||'string',
      fns:compileTransforms(f.transform||[]),
      nb:f.nullEqualsBlank!==false,
      ic:!!f.ignoreCase,half:!!f.half,squash:!!f.squash,
      dec:(f.decimals===null||f.decimals===undefined||f.decimals==='')?null:parseInt(f.decimals,10),
      abs:(f.tolerance&&f.tolerance.abs!==null&&f.tolerance.abs!==undefined&&f.tolerance.abs!=='')?Number(f.tolerance.abs):null,
      pct:(f.tolerance&&f.tolerance.pct!==null&&f.tolerance.pct!==undefined&&f.tolerance.pct!=='')?Number(f.tolerance.pct):null
    };
  }
  function isEmpty(v,nb){
    if(v===null||v===undefined||v==='')return true;
    if(typeof v!=='string')v=String(v);
    var t=v.trim();
    return nb?(t===''||t==='-'):t==='';
  }
  function kindOf(v){if(v===null||v===undefined)return 'null';var t=String(v).trim();return t===''?'blank':(t==='-'?'dash':'v');}
  function normField(v,f){
    var t=applyFns(f.fns,str(v));
    if(f.type==='number'){
      var n=parseNumber(t);
      if(isNaN(n))return {bad:'無法解析為數值',p:t,s:t};
      if(f.dec!==null&&!isNaN(f.dec))n=round(n,f.dec);
      return {p:n,s:String(n)};
    }
    if(f.type==='date'){
      var d=parseDate(t);
      if(d===null)return {bad:'無法解析為日期',p:t,s:t};
      return {p:d,s:d};
    }
    if(f.type==='bool'){
      var b=parseBool(t);
      if(b===null)return {bad:'無法解析為布林',p:t,s:t};
      return {p:b,s:b?'TRUE':'FALSE'};
    }
    if(f.half)t=toHalf(t);
    if(f.squash)t=t.replace(/\s+/g,' ').trim();
    if(f.ic)t=t.toLowerCase();
    return {p:t,s:t};
  }
  /* 數值比較：誤差範圍隨數值大小放大，避免大金額的浮點誤差造成誤判（例如 9876543210.5 − 9876543210.4 ≠ 0.1） */
  function numOf(v,f){
    var n=parseNumber(f.fns.length?applyFns(f.fns,str(v)):v);
    if(n===n&&f.dec!==null&&!isNaN(f.dec))n=round(n,f.dec);
    return n;
  }
  function compareNum(x,y,f){
    var d=x-y,ad=Math.abs(d),mx=Math.max(Math.abs(x),Math.abs(y)),eps=Math.max(EPS,mx*1e-15);
    var sx=String(x),sy=String(y);
    if(ad<=eps)return ['EQ',sx,sy,0,0,''];
    var pc=y!==0?d/Math.abs(y)*100:null;
    if(f.abs!==null&&!isNaN(f.abs)&&ad<=f.abs+eps)return ['TOL',sx,sy,d,pc,'差異 '+round(ad,6)+' ≤ 絕對容差 '+f.abs];
    if(f.pct!==null&&!isNaN(f.pct)){
      var base=y!==0?Math.abs(y):Math.abs(x);
      if(ad<=base*f.pct/100+eps)return ['TOL',sx,sy,d,pc,'差異比例 ≤ 相對容差 '+f.pct+'%'];
    }
    return ['NE',sx,sy,d,pc,''];
  }
  /* 回傳 [level, aNorm, bNorm, diff, pct, note] */
  function compareValue(av,bv,f){
    var aE=isEmpty(av,f.nb),bE=isEmpty(bv,f.nb);
    if(aE&&bE){
      if(f.nb||kindOf(av)===kindOf(bv))return ['EQ','','',null,null,''];
      return ['NE','','',null,null,'空值型態不同（null / 空白）'];
    }
    if(f.type==='number'&&!aE&&!bE){
      var x=numOf(av,f),y=numOf(bv,f);
      if(x===x&&y===y)return compareNum(x,y,f);
    }
    var na=aE?null:normField(av,f),nb=bE?null:normField(bv,f);
    if(aE)return ['NULL_A','',nb.s,null,null,'A 為空值'];
    if(bE)return ['NULL_B',na.s,'',null,null,'B 為空值'];
    if(na.bad||nb.bad){
      var same=String(na.p)===String(nb.p);
      var note=(na.bad&&nb.bad)?'兩側皆'+na.bad+'，改以字串比對':(na.bad?'A 側'+na.bad:'B 側'+nb.bad);
      if(na.bad&&nb.bad&&same)return ['EQ',na.s,nb.s,null,null,note];
      return ['NE',na.s,nb.s,null,null,note];
    }
    return [na.p===nb.p?'EQ':'NE',na.s,nb.s,null,null,''];
  }

  /* ---------- 檔案解析 ---------- */
  function decodeBuf(buf,enc){
    var u8=new Uint8Array(buf);
    if(enc==='auto'){
      if(u8.length>=2&&u8[0]===0xFF&&u8[1]===0xFE)return {text:new TextDecoder('utf-16le').decode(u8),enc:'utf-16le'};
      if(u8.length>=2&&u8[0]===0xFE&&u8[1]===0xFF)return {text:new TextDecoder('utf-16be').decode(u8),enc:'utf-16be'};
      try{return {text:new TextDecoder('utf-8',{fatal:true}).decode(u8),enc:'utf-8'};}
      catch(e){return {text:new TextDecoder('big5').decode(u8),enc:'big5'};}
    }
    return {text:new TextDecoder(enc).decode(u8),enc:enc};
  }
  /* 略過前 N 個非空白行之後的文字（用來在「略過標題列」之後再偵測分隔符號） */
  function afterLines(text,n){
    var i=0,c=0,len=text.length;
    while(c<n&&i<len){
      var j=text.indexOf('\n',i),line=j<0?text.slice(i):text.slice(i,j);
      if(line.trim()!=='')c++;
      if(j<0)return '';
      i=j+1;
    }
    return text.slice(i);
  }
  function detectDelimiter(text){
    var cands=[',','\t',';','|'],best=',',bestN=0,q=false,counts={',':0,'\t':0,';':0,'|':0};
    var lim=Math.min(text.length,20000),i=0;
    while(i<lim&&(text[i]==='\n'||text[i]==='\r'))i++;
    for(;i<lim;i++){
      var c=text[i];
      if(c==='"')q=!q;
      else if(!q){if(c==='\n'||c==='\r')break;if(counts[c]!==undefined)counts[c]++;}
    }
    for(var k=0;k<cands.length;k++){if(counts[cands[k]]>bestN){bestN=counts[cands[k]];best=cands[k];}}
    return best;
  }
  function parseCSV(text,delim){
    var rows=[],row=[],i=0,n=text.length,D=delim.charCodeAt(0),f,cc;
    while(i<n){
      var c=text.charCodeAt(i);
      if(c===34){
        i++;var buf='';
        for(;;){
          var j=text.indexOf('"',i);
          if(j<0){buf+=text.slice(i);i=n;break;}
          buf+=text.slice(i,j);
          if(text.charCodeAt(j+1)===34){buf+='"';i=j+2;}else{i=j+1;break;}
        }
        while(i<n){cc=text.charCodeAt(i);if(cc===D||cc===10||cc===13)break;buf+=text[i];i++;}
        f=buf;
      }else{
        var s=i;
        while(i<n){cc=text.charCodeAt(i);if(cc===D||cc===10||cc===13)break;i++;}
        f=text.slice(s,i);
      }
      row.push(f);
      if(i>=n){rows.push(row);row=null;break;}
      cc=text.charCodeAt(i);
      if(cc===D){i++;if(i>=n){row.push('');rows.push(row);row=null;break;}}
      else{
        if(cc===13&&text.charCodeAt(i+1)===10)i+=2;else i++;

  function cellStr(v){

  }
  function finishTable(raw,hasHeader,skip){
    raw=raw.slice(skip||0);
    var headers,rows;
    if(hasHeader&&raw.length){headers=raw[0].map(function(x){return x===null?'':String(x).trim();});rows=raw.slice(1);}
    else{headers=[];rows=raw;}
    var maxc=headers.length;
    for(var i=0;i<rows.length;i++)if(rows[i].length>maxc)maxc=rows[i].length;
    var seen={},out=[];
    for(var c=0;c<maxc;c++){
      var h=headers[c];
      if(h===undefined||h==='')h='COL_'+(c+1);
      if(seen[h]){var k=2;while(seen[h+'_'+k])k++;h=h+'_'+k;}
      seen[h]=1;out.push(h);
    }
    for(var r=0;r<rows.length;r++){while(rows[r].length<maxc)rows[r].push('');}
    return {headers:out,rows:rows};
  }
  function inferTypes(headers,rows){
    var types=[],lim=Math.min(rows.length,500);
    for(var c=0;c<headers.length;c++){
      var vals=[];
      for(var r=0;r<lim;r++){var v=rows[r][c];if(v!==null&&v!==undefined&&String(v).trim()!==''&&String(v).trim()!=='-')vals.push(String(v));}
      if(!vals.length){types.push('string');continue;}
      var nNum=0,nDate=0,nBool=0,lead0=0,d8=0;
      for(var i=0;i<vals.length;i++){
        var s=vals[i];
        if(!isNaN(parseNumber(s))){nNum++;if(/^0\d+$/.test(s.trim()))lead0++;}
        if(parseDate(s)!==null){nDate++;if(/^\d{7,8}$/.test(s.trim()))d8++;}
        if(parseBool(s)!==null&&!/^[01]$/.test(s.trim()))nBool++;
      }
      var N=vals.length,t='string';
      var dateHint=/date|dt|日期|時間|_d$/i.test(headers[c]);
      if(nDate/N>=0.95&&(d8===0||d8/N<0.5||dateHint)&&!(nNum===N&&d8===N&&!dateHint))t='date';
      else if(nNum/N>=0.95&&lead0/N<0.5)t='number';
      else if(nBool/N>=0.95)t='bool';
      if(t==='string'&&nDate/N>=0.95&&d8===N&&dateHint)t='date';

  function parseFile(P){
    var kind=P.kind,text,enc=P.encoding||'auto',delim=P.delimiter||'auto',raw;
    var d=decodeBuf(P.buffer,enc);text=d.text;enc=d.enc;
    if(kind==='json'){
      var js=JSON.parse(text);
      if(!Array.isArray(js)&&js&&typeof js==='object'){
        var ks=Object.keys(js),arrKey=null;
        for(var i=0;i<ks.length;i++)if(Array.isArray(js[ks[i]])){arrKey=ks[i];break;}
        if(arrKey===null)throw new Error('JSON 內容需為陣列，或包含一個陣列屬性');
        js=js[arrKey];
      }
      if(!Array.isArray(js))throw new Error('JSON 內容需為陣列');
      if(js.length&&js[0]!==null&&typeof js[0]==='object'&&!Array.isArray(js[0])){
        var hs=[],hseen={};
        for(var r=0;r<js.length;r++){var o=js[r]||{};for(var k in o){if(!hseen[k]){hseen[k]=1;hs.push(k);}}}
        raw=[hs];
        for(var r2=0;r2<js.length;r2++){var o2=js[r2]||{};raw.push(hs.map(function(k){return cellStr(o2[k]);}));}
        var t1=finishTable(raw,true,0);
        return {headers:t1.headers,rows:t1.rows,types:inferTypes(t1.headers,t1.rows),encoding:enc,delimiter:'json'};
      }
      raw=js.map(function(r){return Array.isArray(r)?r.map(cellStr):[cellStr(r)];});

      if(delim==='auto')delim=detectDelimiter((P.skip||0)>0?afterLines(text,P.skip):text);

    var t=finishTable(raw,P.hasHeader!==false,P.skip||0);

  /* ---------- 索引 / Key ---------- */
  function headerMap(headers){var m={};for(var i=0;i<headers.length;i++)if(m[headers[i]]===undefined)m[headers[i]]=i;return m;}
  function indexSide(S,cols,fnsList){
    var map=new Map(),nulls=[],rows=S.rows,nc=cols.length;
    for(var i=0;i<rows.length;i++){
      var r=rows[i],kk='',bad=false;
      for(var j=0;j<nc;j++){
        var v=applyFns(fnsList[j],str(r[cols[j]]));
        if(v.trim()===''){bad=true;break;}
        kk+=(j?SEP:'')+v;
      }
      if(bad){nulls.push(i+1);continue;}
      var e=map.get(kk);
      if(e===undefined)map.set(kk,i);

  }
  function prepKeys(P){

    if(!keys.length)throw new Error('尚未設定 Key');

      if(hmA[k.a]===undefined)errs.push('Key '+(i+1)+'：A 來源找不到欄位「'+k.a+'」');
      if(hmB[k.b]===undefined)errs.push('Key '+(i+1)+'：B 來源找不到欄位「'+k.b+'」');
      ka.push(hmA[k.a]);kb.push(hmB[k.b]);

  function health(P,progress){

    var ia=indexSide(P.A,K.ka,K.fa);
    if(progress)progress({phase:'index B',pct:50});
    var ib=indexSide(P.B,K.kb,K.fb);
    function stat(ix,other){
      var dupKeys=0,dupRows=0,common=0,only=[];
      ix.map.forEach(function(e,k){
        if(typeof e!=='number'){dupKeys++;dupRows+=e.length;}
        if(other.map.has(k))common++;else if(only.length<5)only.push(k.split(SEP).join(' | '));
      });
      return {rows:ix.total,nullKeys:ix.nulls.length,distinct:ix.map.size,dupKeys:dupKeys,dupRows:dupRows,common:common,sampleOnly:only};
    }

  /* ---------- 勾稽主流程 ---------- */
  function run(P,progress){

    var K=prepKeys(P),errs=[];
    var fields=[],fa=[],fb=[];
    (prof.fields||[]).forEach(function(f,i){
      if(f.compare===false)return;

      if(K.hmB[f.b]===undefined)errs.push('欄位對應 '+(i+1)+'：B 來源找不到欄位「'+f.b+'」');

    var polA=prof.dupPolicyA||prof.duplicatePolicy||'flag',polB=prof.dupPolicyB||prof.duplicatePolicy||'flag';
    var nf=fields.length;

    var ia=indexSide(A,K.ka,K.fa);

  /* ---------- 自動建議 ---------- */
  function normName(s){return String(s).toLowerCase().replace(/[\s_\-\.]/g,'');}
  function suggest(A,B){

    B.headers.forEach(function(h,i){var n=normName(h);if(nB[n]===undefined)nB[n]=i;});
    A.headers.forEach(function(h,i){
      var j=hmB[h];
      if(j===undefined){var n=normName(h);if(nB[n]!==undefined)j=nB[n];}
      if(j!==undefined&&!usedB[j]){usedB[j]=1;pairs.push({ai:i,bi:j});}
    });

      for(var r=0;r<lim;r++){var k='';for(var c=0;c<cols.length;c++)k+=String(A.rows[r][cols[c]]===null?'':A.rows[r][cols[c]]).trim()+SEP;s.add(k);}
      return lim?s.size/lim:0;
    }
    var cands=pairs.filter(function(p){return hint.test(A.headers[p.ai]);});
    var scored=cands.map(function(p){return {p:p,u:uniq([p.ai])};}).sort(function(x,y){return y.u-x.u;});
    var keys=[];
    if(scored.length&&scored[0].u>=0.999)keys=[scored[0].p];
    else{

      for(var i=0;i<cs.length&&!found;i++)for(var j=i+1;j<cs.length&&!found;j++){if(uniq([cs[i].ai,cs[j].ai])>=0.999)found=[cs[i],cs[j]];}
      if(found)keys=found;
      else if(scored.length)keys=[scored[0].p];
      else if(pairs.length){var all=pairs.map(function(p){return {p:p,u:uniq([p.ai])};}).sort(function(x,y){return y.u-x.u;});keys=[all[0].p];}

const APP_VERSION='1.1.0';

const STATUS_LABEL={MATCH:'完全相符',DIFF:'數值差異',A_ONLY:'僅 A 有',B_ONLY:'僅 B 有',DUP_A:'A 重複 Key',DUP_B:'B 重複 Key',NULL_KEY:'Key 為空'};

const ENG=makeEngine();   // 主執行緒副本（預覽、驗證、自我檢測用）

/* ---------- DOM helper（一律以 DOM API 建立節點與文字，不拼接 HTML 字串） ---------- */
function h(tag,attrs){
  const e=document.createElement(tag);
  const kids=Array.prototype.slice.call(arguments,2);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v===null||v===undefined||v===false||k==='value')continue;
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='disabled'||k==='selected'||k==='multiple'||k==='readOnly')e[k]=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){
    if(c===null||c===undefined||c===false)continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  if(attrs&&attrs.value!==undefined&&attrs.value!==null)e.value=attrs.value;
  return e;
}

async function sha256(buf){
  try{
    if(window.crypto&&crypto.subtle){
      const d=await crypto.subtle.digest('SHA-256',buf);
      return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  const u=new Uint8Array(buf);let x=0x811c9dc5;
  for(let i=0;i<u.length;i++){x^=u[i];x=Math.imul(x,16777619)>>>0;}
  return 'fnv-'+u.length+'-'+x.toString(16).padStart(8,'0');
}

/* ---------- IndexedDB ---------- */
const DB={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const rq=indexedDB.open(DB_NAME,DB_VER);
      rq.onupgradeneeded=()=>{
        const d=rq.result;
        const mk=(n,kp,idx)=>{if(d.objectStoreNames.contains(n))return;const st=d.createObjectStore(n,{keyPath:kp});(idx||[]).forEach(i=>st.createIndex(i[0],i[1]));};
        mk('projects','id',[['updatedAt','updatedAt']]);
        mk('datasets','id',[['projectId','projectId'],['hash','hash']]);
        mk('datasetChunks',['datasetId','seq']);
        mk('profiles','id',[['projectId','projectId']]);
        mk('runs','id',[['projectId','projectId'],['createdAt','createdAt']]);
        mk('results',['runId','rowKey'],[['runId','runId'],['status','status']]);   // v1 舊格式（逐筆），僅保留以相容讀取
        mk('resultChunks',['runId','seq']);                                          // v2：每 2000 筆一塊，無索引，寫入快 10 倍以上
        mk('annotations',['profileId','rowKey'],[['status','status']]);
        mk('settings','key');
      };
      rq.onsuccess=()=>{DB.db=rq.result;DB.db.onversionchange=()=>{DB.db.close();toast('資料庫已在其他分頁更新，請重新整理本頁',6000);};res();};
      rq.onerror=()=>rej(rq.error);
      rq.onblocked=()=>rej(new Error('資料庫被其他分頁鎖定'));
    });
  },
  _tx(stores,mode,fn){
    return new Promise((res,rej)=>{
      const tx=DB.db.transaction(stores,mode);let out;
      tx.oncomplete=()=>res(out);
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('交易中止'));
      out=fn(tx);
    });
  },
  _rq(rq){return new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});},
  get(store,key){return DB._rq(DB.db.transaction(store).objectStore(store).get(key));},
  all(store){return DB._rq(DB.db.transaction(store).objectStore(store).getAll());},
  byIndex(store,index,key){return DB._rq(DB.db.transaction(store).objectStore(store).index(index).getAll(key));},
  range(store,lo,hi){return DB._rq(DB.db.transaction(store).objectStore(store).getAll(IDBKeyRange.bound(lo,hi)));},
  put(store,val){return DB._tx(store,'readwrite',tx=>{tx.objectStore(store).put(val);});},
  putMany(store,arr){return DB._tx(store,'readwrite',tx=>{const s=tx.objectStore(store);for(let i=0;i<arr.length;i++)s.put(arr[i]);});},
  del(store,key){return DB._tx(store,'readwrite',tx=>{tx.objectStore(store).delete(key);});},
  delRange(store,lo,hi){return DB._tx(store,'readwrite',tx=>{tx.objectStore(store).delete(IDBKeyRange.bound(lo,hi));});},
  clear(stores){return DB._tx(stores,'readwrite',tx=>{stores.forEach(s=>tx.objectStore(s).clear());});}
};

/* ---------- Worker 橋接（Blob inline Worker；Worker 無法使用時自動退回主執行緒） ---------- */
const Bridge={
  url:null,jobs:new Set(),supported:true,
  _src(){
    return 'const makeEngine='+makeEngine.toString()+';const E=makeEngine();'+
      'onmessage=function(ev){var m=ev.data;try{var r;'+
      'if(m.cmd==="run")r=E.run(m.payload,function(p){postMessage({progress:p});});'+
      'else if(m.cmd==="health")r=E.health(m.payload,function(p){postMessage({progress:p});});'+
      'else if(m.cmd==="parse")r=E.parseFile(m.payload);'+
      'else throw new Error("unknown cmd");'+
      'postMessage({done:r});}catch(e){postMessage({error:String(e&&e.message||e)});}};';
  },
  _local(cmd,payload,onProgress){
    return new Promise((resolve,reject)=>setTimeout(()=>{
      try{resolve((cmd==='run'?ENG.run:(cmd==='health'?ENG.health:ENG.parseFile))(payload,onProgress));}catch(e){reject(e);}
    },30));
  },
  call(cmd,payload,onProgress){
    return new Promise((resolve,reject)=>{
      let w=null;
      if(Bridge.supported){
        try{
          if(!Bridge.url)Bridge.url=URL.createObjectURL(new Blob([Bridge._src()],{type:'text/javascript'}));
          w=new Worker(Bridge.url);
        }catch(e){Bridge.supported=false;w=null;}
      }
      if(!w){Bridge._local(cmd,payload,onProgress).then(resolve,reject);return;}
      const job={w:w,cmd:cmd,reject:reject,got:false};
      Bridge.jobs.add(job);
      const finish=()=>{try{w.terminate();}catch(e){}Bridge.jobs.delete(job);};
      w.onmessage=ev=>{
        const m=ev.data;job.got=true;
        if(m.progress){if(onProgress)onProgress(m.progress);return;}
        finish();
        if(m.error)reject(new Error(m.error));else resolve(m.done);
      };
      w.onerror=ev=>{
        finish();
        if(ev&&ev.preventDefault)ev.preventDefault();
        if(!job.got&&!job.cancelled){   // Worker 根本沒跑起來（被 CSP / 環境封鎖）→ 改在主執行緒執行
          Bridge.supported=false;
          Bridge._local(cmd,payload,onProgress).then(resolve,reject);
        }else reject(new Error(ev&&ev.message||'Worker 錯誤'));
      };
      w.postMessage({cmd:cmd,payload:payload});
    });
  },
  cancel(){
    Bridge.jobs.forEach(j=>{if(j.cmd==='run'){j.cancelled=true;try{j.w.terminate();}catch(e){}Bridge.jobs.delete(j);j.reject(new Error('已取消'));}});
  }
};

/* ---------- 資料集存取 ---------- */
const DataStore={
  cache:new Map(),
  async save(projectId,side,meta,parsed){
    const id=uid('ds_');
    const rec=Object.assign({id:id,projectId:projectId,side:side,importedAt:Date.now(),
      rowCount:parsed.rows.length,headers:parsed.headers,types:parsed.types,chunks:Math.ceil(parsed.rows.length/CHUNK_ROWS)},meta);
    try{
      for(let i=0;i*CHUNK_ROWS<parsed.rows.length;i+=10){   // 每 10 塊（5 萬列）一個交易，避免單一交易過大
        const chunks=[];
        for(let j=i;j<i+10&&j*CHUNK_ROWS<parsed.rows.length;j++)chunks.push({datasetId:id,seq:j,rows:parsed.rows.slice(j*CHUNK_ROWS,(j+1)*CHUNK_ROWS)});
        await DB.putMany('datasetChunks',chunks);
      }
      await DB.put('datasets',rec);
    }catch(e){
      try{await DB.delRange('datasetChunks',[id,0],[id,Infinity]);}catch(e2){}   // 失敗時清掉殘留區塊
      throw new Error(e&&e.name==='QuotaExceededError'?'瀏覽器儲存空間不足，無法保存這份資料快照（可刪除舊快照或舊的執行紀錄後再試）':(e&&e.message)||'寫入失敗');
    }
    DataStore.cache.set(id,{headers:parsed.headers,rows:parsed.rows,types:parsed.types});
    return rec;
  },
  async load(meta){
    if(DataStore.cache.has(meta.id))return DataStore.cache.get(meta.id);
    const chunks=await DB.range('datasetChunks',[meta.id,0],[meta.id,Infinity]);
    chunks.sort((a,b)=>a.seq-b.seq);
    const rows=[];
    chunks.forEach(c=>{for(let i=0;i<c.rows.length;i++)rows.push(c.rows[i]);});
    const d={headers:meta.headers,rows:rows,types:meta.types};
    DataStore.cache.set(meta.id,d);
    while(DataStore.cache.size>3)DataStore.cache.delete(DataStore.cache.keys().next().value);   // 最多快取 3 份，避免佔用記憶體
    return d;
  },
  async remove(id){
    await DB.delRange('datasetChunks',[id,0],[id,Infinity]);
    await DB.del('datasets',id);
    DataStore.cache.delete(id);
  }
};

function newProfile(projectId,name){
  return {id:uid('pf_'),projectId:projectId,name:name||'勾稽範本',createdAt:Date.now(),updatedAt:Date.now(),version:1,
    keys:[],fields:[],dupPolicyA:'flag',dupPolicyB:'flag',keepMatch:false,
    defaults:{abs:'',pct:'',nullEqualsBlank:true}};
}
function newField(a,b,type,d){
  d=d||{};
  return {a:a,b:b,type:type||'string',compare:true,transform:[],tolerance:{abs:d.abs===undefined?'':d.abs,pct:d.pct===undefined?'':d.pct},
    decimals:'',nullEqualsBlank:d.nullEqualsBlank!==false,ignoreCase:false,half:false,squash:false,control:true};
}

  await DB.put('profiles',S.profile);

  S.project.updatedAt=Date.now();
  await DB.put('projects',S.project);

function sanitizeProfile(p){
  if(!p||typeof p!=='object')throw new Error('範本格式錯誤');
  if(!Array.isArray(p.keys)||!Array.isArray(p.fields))throw new Error('範本缺少 keys 或 fields');
  const types=['string','number','date','bool'],pols=['flag','first','aggregate'];
  const tf=arr=>{
    const a=Array.isArray(arr)?arr.map(String):[];
    a.forEach(x=>{const e=ENG.validateTransform(x);if(e)throw new Error('轉換函式不合法：'+x+'（'+e+'）');});
    return a;
  };
  const out=newProfile(null,String(p.name||'匯入的範本'));
  out.keys=p.keys.map(k=>({a:String(k.a),b:String(k.b),transform:tf(k.transform)}));
  out.fields=p.fields.map(f=>({a:String(f.a),b:String(f.b),type:types.includes(f.type)?f.type:'string',compare:f.compare!==false,
    transform:tf(f.transform),tolerance:{abs:(f.tolerance&&f.tolerance.abs!==undefined&&f.tolerance.abs!==null)?f.tolerance.abs:'',pct:(f.tolerance&&f.tolerance.pct!==undefined&&f.tolerance.pct!==null)?f.tolerance.pct:''},
    decimals:(f.decimals===undefined||f.decimals===null)?'':f.decimals,nullEqualsBlank:f.nullEqualsBlank!==false,
    ignoreCase:!!f.ignoreCase,half:!!f.half,squash:!!f.squash,control:f.control!==false}));
  const pol=p.duplicatePolicy;
  out.dupPolicyA=pols.includes(p.dupPolicyA)?p.dupPolicyA:(pols.includes(pol)?pol:'flag');
  out.dupPolicyB=pols.includes(p.dupPolicyB)?p.dupPolicyB:(pols.includes(pol)?pol:'flag');
  out.keepMatch=!!p.keepMatch;
  out.defaults=Object.assign({abs:'',pct:'',nullEqualsBlank:true},p.defaults||{});
  return out;
}

async function deleteProject(){
  if(!await confirmBox('確定刪除專案「'+S.project.name+'」？所有資料、範本、執行結果與註記都會被刪除，且無法復原。'))return;
  await deleteProjectData(S.project.id);
  S.project=null;
  await loadProjects();
  if(S.projects.length)location.hash='#/p/'+S.projects[0].id+'/data';else{location.hash='#/home';await route();}
}
async function deleteProjectData(pid){
  const ds=await DB.byIndex('datasets','projectId',pid);
  for(const d of ds)await DataStore.remove(d.id);
  const runs=await DB.byIndex('runs','projectId',pid);
  for(const r of runs){await removeResults(r.id);await DB.del('runs',r.id);}
  const pfs=await DB.byIndex('profiles','projectId',pid);
  for(const p of pfs){await DB.delRange('annotations',[p.id,''],[p.id,'\uffff']);await DB.del('profiles',p.id);}
  await DB.del('projects',pid);
}

  return h('div',{class:'tscroll'},t);

function guessKind(f){return /\.json$/i.test(f.name)?'json':'csv';}
async function pickFile(side,file){
  if(!file)return;
  const buf=await file.arrayBuffer();
  S.pending[side]={file:{name:file.name,size:file.size},buf:buf,kind:guessKind(file),enc:'auto',delim:'auto',header:true,skip:0,parsed:null,err:null,busy:false};
  await parsePending(side);
}
async function parsePending(side){
  const p=S.pending[side];if(!p)return;
  const seq=(p.seq=(p.seq||0)+1);   // 序號：避免快速切換選項時，較慢的舊解析結果蓋掉新結果
  p.busy=true;p.err=null;renderMain();
  let parsed=null,err=null;
  try{parsed=await Bridge.call('parse',{buffer:p.buf,kind:p.kind,encoding:p.enc,delimiter:p.delim,hasHeader:p.header,skip:p.skip});}
  catch(e){err=e.message;}
  if(S.pending[side]!==p||p.seq!==seq)return;
  p.parsed=parsed;p.err=err;p.busy=false;renderMain();
}
async function confirmImport(side){
  const p=S.pending[side];if(!p||!p.parsed||p.busy)return;
  try{
    const hash=await sha256(p.buf),optKey=JSON.stringify({enc:p.enc,delim:p.delim,header:p.header,skip:p.skip});
    const same=S.datasets.find(d=>d.side===side&&d.hash===hash&&d.sizeBytes===p.file.size&&JSON.stringify(d.options||{})===optKey);
    if(same){
      const use=await modal('已有相同內容的快照',h('div',null,'「'+same.fileName+'」（'+fmtTime(same.importedAt)+' 匯入）內容與解析設定完全相同。'),
        [{label:'重新匯入一份',value:'new'},{label:'直接使用既有快照',pri:true,value:'use'}]);
      if(use===null)return;
      if(use==='use'){S.project['source'+side]=same.id;await saveProject();S.pending[side]=null;S.health=null;await loadSources();renderMain();return;}
    }
    const meta=await DataStore.save(S.project.id,side,{fileName:p.file.name,sizeBytes:p.file.size,hash:hash,encoding:p.parsed.encoding,delimiter:p.parsed.delimiter,
      options:{enc:p.enc,delim:p.delim,header:p.header,skip:p.skip}},p.parsed);
    S.datasets.unshift(meta);
    S.project['source'+side]=meta.id;await saveProject();
    S.pending[side]=null;S.health=null;
    await loadSources();
    if(S.A&&S.B&&!S.profile.keys.length&&!S.profile.fields.length){
      autoSetup(true);await saveProfile();
      toast('已匯入 '+meta.rowCount.toLocaleString()+' 列'+(S.profile.fields.length||S.profile.keys.length?'；並依欄位名稱自動建議 Key 與欄位對應':'；兩邊欄位名稱不同，請到 ② ③ 手動設定，或在 ③ 使用「依欄位順序對應」'),4500);
    }else toast('已匯入 '+meta.rowCount.toLocaleString()+' 列並存成快照');
    renderMain();
  }catch(e){errorBox('匯入失敗',e.message);}
}

function colSelect(headers,cur,onchange){
  const opts=headers.slice();
  if(cur&&!opts.includes(cur))opts.unshift(cur);
  return h('select',{value:cur||'',onchange:e=>onchange(e.target.value),style:{minWidth:'130px'},class:cur&&!headers.includes(cur)?'bad':''},
    h('option',{value:''},'（選擇欄位）'),opts.map(c=>h('option',{value:c},headers.includes(c)?c:c+'（不存在）')));
}
const TF_TEMPLATES=['trim','upper','lower','half','squash','digits','ltrimZeros','padStart:4:0','padEnd:4:0','removeChars:-','substr:0:4','left:4','right:4'];
function tfInput(list,onsave){
  const inp=h('input',{type:'text',value:(list||[]).join(', '),placeholder:'例：trim, upper, padStart:4:0',style:{width:'190px'},
    onchange:()=>{
      const arr=inp.value.split(',').map(x=>x.trim()).filter(Boolean);
      for(const t of arr){const e=ENG.validateTransform(t);if(e){toast('「'+t+'」不合法：'+e,4000);inp.value=(list||[]).join(', ');return;}}
      onsave(arr);
    }});
  const sel=h('select',{style:{width:'46px'},title:'插入常用轉換',onchange:e=>{
    if(!e.target.value)return;inp.value=(inp.value.trim()?inp.value.trim()+', ':'')+e.target.value;e.target.value='';inp.dispatchEvent(new Event('change'));}},
    h('option',{value:''},'＋'),TF_TEMPLATES.map(t=>h('option',{value:t},t)));
  return h('span',{class:'row',style:{gap:'2px',flexWrap:'nowrap'}},inp,sel);
}
function sampleKey(side,col,fns){
  const d=S[side];if(!d||!col)return '';
  const ci=d.headers.indexOf(col);if(ci<0)return '';
  const out=[];
  try{const f=ENG.compileTransforms(fns||[]);
    for(let i=0;i<d.rows.length&&out.length<2;i++){const v=d.rows[i][ci];const raw=v===null||v===undefined?'':String(v);out.push(JSON.stringify(raw)+' → '+JSON.stringify(ENG.applyFns(f,raw)));}
  }catch(e){return e.message;}
  return out.join('；');
}
function autoSetup(replaceAll){
  const sg=ENG.suggest(S.A,S.B);
  const dflt=S.profile.defaults||{};
  const keyA=new Set();
  S.profile.keys=sg.keys.map(p=>{keyA.add(S.A.headers[p.ai]);return {a:S.A.headers[p.ai],b:S.B.headers[p.bi],transform:['trim']};});
  if(replaceAll){
    S.profile.fields=sg.pairs.filter(p=>!keyA.has(S.A.headers[p.ai])).map(p=>{
      const ta=S.A.types[p.ai],tb=S.B.types[p.bi];
      return newField(S.A.headers[p.ai],S.B.headers[p.bi],ta===tb?ta:'string',dflt);
    });
  }
}

function makeVList(o){

    }

function preflight(){
  const errors=[],warns=[],P=S.profile;
  if(!S.A)errors.push('尚未選擇 A 來源資料');
  if(!S.B)errors.push('尚未選擇 B 來源資料');
  if(!P.keys.length)errors.push('尚未設定 Key');
  if(S.A&&S.B){
    P.keys.forEach((k,i)=>{
      if(!k.a||!S.A.headers.includes(k.a))errors.push('Key '+(i+1)+'：A 來源找不到欄位「'+(k.a||'未選擇')+'」');
      if(!k.b||!S.B.headers.includes(k.b))errors.push('Key '+(i+1)+'：B 來源找不到欄位「'+(k.b||'未選擇')+'」');
    });
    P.fields.filter(f=>f.compare).forEach((f,i)=>{
      if(!f.a||!S.A.headers.includes(f.a))errors.push('欄位「'+(f.a||'未選擇')+'」在 A 來源不存在');
      if(!f.b||!S.B.headers.includes(f.b))errors.push('欄位「'+(f.b||'未選擇')+'」在 B 來源不存在');
    });
  }
  if(!P.fields.some(f=>f.compare))warns.push('沒有任何欄位列入比對：只會檢查 Key 是否存在於兩邊（僅 A 有 / 僅 B 有 / 重複）。');
  return {errors:errors,warns:warns};
}
async function execRun(){
  const pf=preflight();if(pf.errors.length||S.running)return;
  S.running=true;renderMain();
  const setP=p=>{const b=document.getElementById('pgbar'),t=document.getElementById('pgtxt');if(b)b.style.width=p.pct+'%';if(t)t.textContent=p.phase+'（'+p.pct+'%）';};

    const t0=Date.now();
    const out=await Bridge.call('run',enginePayload(),setP);
    const run={id:uid('run_'),projectId:S.project.id,profileId:S.profile.id,profileName:S.profile.name,profileSnapshot:JSON.parse(JSON.stringify(S.profile)),
      datasetA:{id:S.A.meta.id,name:S.A.meta.fileName,rows:S.A.meta.rowCount,hash:S.A.meta.hash},
      datasetB:{id:S.B.meta.id,name:S.B.meta.fileName,rows:S.B.meta.rowCount,hash:S.B.meta.hash},
      labelA:S.project.labelA,labelB:S.project.labelB,createdAt:Date.now(),keepMatch:!!S.profile.keepMatch,summary:out.summary,ms:Date.now()-t0};
    await saveResults(run.id,out.results,(n,tot)=>setP({pct:90+Math.round(n/Math.max(tot,1)*9),phase:'寫入 IndexedDB（'+n.toLocaleString()+' / '+tot.toLocaleString()+'）'}));
    await DB.put('runs',run);
    S.runs.unshift(run);
    S.keepResults={};S.keepResults[run.id]=out.results;
    // 只保留最新 20 次執行
    const old=S.runs.slice(20);
    for(const r of old){await removeResults(r.id);await DB.del('runs',r.id);}
    S.runs=S.runs.slice(0,20);
    S.running=false;
    go('result',run.id);
  }catch(e){
    S.running=false;renderMain();
    if(e.message==='已取消')toast('已取消執行');
    else errorBox('執行失敗',e&&e.name==='QuotaExceededError'?'瀏覽器儲存空間不足，無法保存結果。請刪除舊的執行紀錄或資料快照後再試。':e.message);
  }
}
/* ---- 結果儲存：每 RES_CHUNK 筆一塊（resultChunks）；舊版逐筆格式（results）仍可讀取 ---- */
async function saveResults(runId,results,onProg){
  const tot=results.length;
  for(let i=0;i<tot;i+=RES_CHUNK*5){   // 每個交易寫 5 塊（1 萬筆）
    const recs=[];
    for(let j=i;j<Math.min(tot,i+RES_CHUNK*5);j+=RES_CHUNK)recs.push({runId:runId,seq:j/RES_CHUNK,rows:results.slice(j,j+RES_CHUNK)});
    await DB.putMany('resultChunks',recs);
    if(onProg)onProg(Math.min(i+RES_CHUNK*5,tot),tot);
  }
}
function upgradeLegacy(r){
  /* v1 舊格式：逐欄陣列 f → 轉成緊湊格式 lv / va / vb */
  if(!r.f||r.lv!==undefined&&r.lv!==null)return r;
  const CODE={EQ:'E',TOL:'T',NE:'N',NULL_A:'A',NULL_B:'B'};
  if(r.st==='DIFF'||r.st==='MATCH'){r.lv=r.f.map(x=>CODE[x[1]]||'E').join('');r.va=r.f.map(x=>x[2]);r.vb=r.f.map(x=>x[3]);}
  else{r.lv=null;r.va=r.st==='A_ONLY'?r.f.map(x=>x[2]):null;r.vb=r.st==='B_ONLY'?r.f.map(x=>x[3]):null;}
  delete r.f;return r;
}
async function readResults(runId){
  const chunks=await DB.range('resultChunks',[runId,0],[runId,Infinity]);
  if(chunks.length){
    chunks.sort((a,b)=>a.seq-b.seq);
    const out=[];chunks.forEach(c=>{for(let i=0;i<c.rows.length;i++)out.push(c.rows[i]);});

function runRowsForExport(rows){
  const sm=R.run.summary,nk=sm.keyNames.length;
  const head=['分類','分類說明'].concat(sm.keyNames.map(n=>'Key:'+n),['A 筆數','B 筆數']);
  sm.fields.forEach(f=>{const n=f.a+(f.a!==f.b?'/'+f.b:'');head.push(n+'_A',n+'_B',n+'_差異(A-B)',n+'_判定');});
  head.push('註記狀態','備註');
  const out=[head];
  rows.forEach(r=>{
    const parts=r.st==='NULL_KEY'?[r.ks]:r.kk.split(ENG.SEP);
    while(parts.length<nk)parts.push('');
    const line=[r.st,STATUS_LABEL[r.st]].concat(parts.slice(0,Math.max(nk,1)),[r.na,r.nb]);
    const fr=(r.lv||r.va||r.vb)?fieldRows(r,true):null;
    sm.fields.forEach((_,i)=>{const x=fr?fr[i]:null;line.push(x?x[2]:'',x?x[3]:'',x&&x[6]!==null&&x[6]!==undefined?x[6]:'',x?(x[1]==='-'?'':x[1]):'');});
    const a=R.ann.get(r.kk);line.push(a?a.status:'',a?a.note:'');
    out.push(line);
  });
  return out;
}

function restoreFlow(){
  const inp=h('input',{type:'file',accept:'.json,application/json'});
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      const js=JSON.parse(await f.text());
      if(js.type!=='ReconLabBackup'||!js.stores)throw new Error('不是 Reconciliation Lab 的備份檔');
      if(!await confirmBox('還原會「清除並取代」目前瀏覽器中的所有資料，確定要繼續？'))return;
      const all=['projects','datasets','datasetChunks','profiles','runs','results','resultChunks','annotations','settings'];
      await DB.clear(all);
      for(const s of all){
        const arr=js.stores[s]||[];
        for(let i=0;i<arr.length;i+=4000)await DB.putMany(s,arr.slice(i,i+4000));
      }
      DataStore.cache.clear();S.keepResults={};S.project=null;
      await loadProjects();
      if(!S.projects.length)await createProject('我的第一個勾稽專案');
      toast('還原完成');
      location.hash='#/p/'+S.projects[0].id+'/data';
      await route();
    }catch(e){toast('還原失敗：'+e.message,5000);}
  };
  inp.click();
}

function mkField(o){return ENG.compileField(Object.assign({a:'x',b:'x',type:'number'},o),0);}
async function runSelfTests(){
  const T=[];
  const add=(name,fn)=>T.push({name:name,fn:fn});
  add('驗收 3：容差 abs=1，100.4 vs 101 → TOL',()=>ENG.compareValue('100.4','101',mkField({tolerance:{abs:1}}))[0]==='TOL');
  add('驗收 3：容差 abs=1，100 vs 102 → NE',()=>ENG.compareValue('100','102',mkField({tolerance:{abs:1}}))[0]==='NE');
  add('驗收 4：padStart:4:0 後 "0001" 與 "1" 為相同 Key',()=>{
    const P={keys:[{a:'k',b:'k',transform:['trim','padStart:4:0']}],fields:[{a:'v',b:'v',type:'string',compare:true}]};
    const r=ENG.run({A:{headers:['k','v'],rows:[['1','x']]},B:{headers:['k','v'],rows:[['0001','x']]},profile:P,opts:{keepMatch:true}});
    return r.summary.counts.MATCH===1&&r.summary.counts.A_ONLY===0;});
  add('驗收 5：民國 115/10/27 與 2026-10-27 相等',()=>ENG.compareValue('115/10/27','2026-10-27',ENG.compileField({a:'d',b:'d',type:'date'},0))[0]==='EQ');
  add('日期：YYYYMMDD、民國 1151027、115年10月27日 皆為 2026-10-27',()=>['20261027','1151027','115年10月27日','2026.10.27'].every(x=>ENG.parseDate(x)==='2026-10-27')&&ENG.parseDate('2026-02-30')===null);
  add('數值：千分位、括號負數、貨幣符號',()=>ENG.parseNumber('1,234.5')===1234.5&&ENG.parseNumber('(50)')===-50&&ENG.parseNumber('NT$ 1,000')===1000&&isNaN(ENG.parseNumber('abc')));
  add('布林：Y / 是 / 1 / true 相同',()=>{const f=ENG.compileField({a:'b',b:'b',type:'bool'},0);return ENG.compareValue('Y','是',f)[0]==='EQ'&&ENG.compareValue('1','true',f)[0]==='EQ'&&ENG.compareValue('Y','N',f)[0]==='NE';});
  add('驗收 2：分類筆數與 Key 聯集一致（含重複、空 Key）',()=>{
    const P={keys:[{a:'k',b:'k',transform:['trim']}],dupPolicyA:'flag',dupPolicyB:'flag',fields:[{a:'v',b:'v',type:'number',compare:true,tolerance:{abs:0}}]};
    const A={headers:['k','v'],rows:[['a','1'],['b','2'],['c','3'],['c','3'],['','9'],['e','5']]};
    const B={headers:['k','v'],rows:[['a','1'],['b','9'],['d','4'],['e','5'],['e','5']]};
    const r=ENG.run({A:A,B:B,profile:P,opts:{keepMatch:false}}),c=r.summary.counts;
    return r.summary.check.ok&&c.MATCH===1&&c.DIFF===1&&c.A_ONLY===0&&c.B_ONLY===1&&c.DUP_A===1&&c.DUP_B===1&&c.NULL_KEY===1&&r.summary.unionKeys===5;});
  add('重複 Key aggregate（一對多）：A 額度 vs B 多筆動撥加總',()=>{
    const P={keys:[{a:'k',b:'k',transform:[]}],dupPolicyA:'flag',dupPolicyB:'aggregate',fields:[{a:'v',b:'v',type:'number',compare:true,tolerance:{abs:0}}]};
    const r=ENG.run({A:{headers:['k','v'],rows:[['a','100']]},B:{headers:['k','v'],rows:[['a','40'],['a','60']]},profile:P,opts:{}});
    return r.summary.counts.MATCH===1;});
  add('CSV 解析：引號、跳脫、欄位內換行、CRLF',()=>{
    const r=ENG.parseCSV('a,b\r\n"x,1","he said ""hi""\nline2"\r\n3,\r\n',',');
    return r.length===3&&r[1][0]==='x,1'&&r[1][1]==='he said "hi"\nline2'&&r[2][1]==='';});
  add('Big5 解碼',()=>{
    const bytes=new Uint8Array([0xA7,0xDA]);  // 「我」
    return new TextDecoder('big5').decode(bytes)==='我';});
  add('修正：大金額 + 小容差不因浮點誤差誤判（9876543210.5 vs .4，abs=0.1）',()=>ENG.compareValue('9876543210.5','9876543210.4',mkField({tolerance:{abs:0.1}}))[0]==='TOL'&&ENG.compareValue('1234567890.12','1234567890.11',mkField({tolerance:{abs:0.01}}))[0]==='TOL'&&ENG.compareValue('100','102',mkField({tolerance:{abs:0}}))[0]==='NE');
  add('修正：TSV 前置標題列時仍能偵測分隔符號',()=>{
    const r=ENG.parseFile({buffer:new TextEncoder().encode('報表標題\n製表日期：2026/10/27\nid\tamt\n1\t100\n').buffer,kind:'csv',encoding:'utf-8',delimiter:'auto',hasHeader:true,skip:2});
    return r.headers.join('|')==='id|amt'&&r.rows.length===1;});
  add('修正：UTF-16LE（BOM）自動偵測',()=>{
    const u=new Uint8Array(2+2*13);u[0]=0xFF;u[1]=0xFE;const t='id\tamt\n1\t100\n';for(let i=0;i<t.length;i++){u[2+i*2]=t.charCodeAt(i);}
    const r=ENG.parseFile({buffer:u.buffer.slice(0,2+t.length*2),kind:'csv',encoding:'auto',delimiter:'auto',hasHeader:true,skip:0});
    return r.encoding==='utf-16le'&&r.headers.join('|')==='id|amt';});
  add('修正：熱度表差異金額只統計「不相等」，不含容差內',()=>{
    const P={keys:[{a:'k',b:'k',transform:[]}],fields:[{a:'v',b:'v',type:'number',compare:true,tolerance:{abs:1}}]};
    const r=ENG.run({A:{headers:['k','v'],rows:[['a','100'],['b','100']]},B:{headers:['k','v'],rows:[['a','100.5'],['b','150']]},profile:P,opts:{}});
    return r.summary.heat[0].absSum===50&&r.summary.heat[0].tol===1&&r.summary.heat[0].ne===1;});
  add('結果採緊湊格式：判定碼 lv 與原始值 va / vb',()=>{
    const P={keys:[{a:'k',b:'k',transform:[]}],fields:[{a:'v',b:'v',type:'number',compare:true,tolerance:{abs:1}},{a:'w',b:'w',type:'string',compare:true}]};
    const r=ENG.run({A:{headers:['k','v','w'],rows:[['a','100','x']]},B:{headers:['k','v','w'],rows:[['a','100.5','y']]},profile:P,opts:{}});
    const d=r.results[0];return d.st==='DIFF'&&d.lv==='TN'&&d.va[1]==='x'&&d.vb[1]==='y'&&d.f===undefined;});
  add('相容：舊版（v1）逐筆結果可轉成緊湊格式',()=>{
    const old={st:'DIFF',kk:'k',f:[[0,'NE','1','2','1','2',-1,-50,''],[1,'EQ','x','x','x','x',null,null,''],[2,'TOL','5','5.5','5','5.5',-0.5,-9,'']],lv:undefined};
    const r=upgradeLegacy(old);const a=upgradeLegacy({st:'A_ONLY',f:[[0,'-','7','','','',null,null,'']]});
    return r.lv==='NET'&&r.va.join()==='1,x,5'&&r.vb.join()==='2,x,5.5'&&r.f===undefined&&a.lv===null&&a.va[0]==='7'&&a.vb===null;});
  add('結果分塊寫入 / 讀回 / 刪除（resultChunks）',async()=>{
    const rid='__selftest_run',rows=Array.from({length:4500},(_,i)=>({kk:'k'+i,st:'DIFF',lv:'N',va:['1'],vb:['2']}));
    await saveResults(rid,rows);const back=await readResults(rid);const ok=back.length===4500&&back[0].kk==='k0'&&back[4499].kk==='k4499';
    await removeResults(rid);return ok&&(await readResults(rid)).length===0;});
  add('驗收 8：程式碼不含動態執行、HTML 字串注入與網路 API 的寫法',()=>{
    const src=Array.from(document.scripts).map(s=>s.textContent).join('\n');
    const bad=['ev'+'al(','new Fun'+'ction','inner'+'HTML','outer'+'HTML','insertAdjacent'+'HTML','fet'+'ch(','XMLHttp'+'Request','Web'+'Socket','send'+'Beacon','document.wri'+'te'];
    const hit=bad.filter(t=>src.indexOf(t)>=0);
    return hit.length===0||('發現：'+hit.join(', '));});
  add('IndexedDB 讀寫（settings）',async()=>{
    await setSetting('__selftest',{t:Date.now()});const v=await getSetting('__selftest',null);await DB.del('settings','__selftest');return !!(v&&v.t);});
  add('Web Worker（Blob inline）可用：解析 + 勾稽往返',async()=>{
    const buf=new TextEncoder().encode('k,v\n1,2\n').buffer;
    const r=await Bridge.call('parse',{buffer:buf,kind:'csv',encoding:'utf-8',delimiter:'auto',hasHeader:true,skip:0});
    return (r.rows.length===1&&r.headers[1]==='v')?(Bridge.supported||'Worker 不可用，已退回主執行緒（功能正常）'):false;});
  const out=[];
  for(const t of T){
    let ok=false,note='';
    try{const r=await t.fn();ok=(r===true);if(typeof r==='string'){note=r;ok=r.indexOf('不可用')>=0;}}catch(e){ok=false;note=e.message;}
    out.push({name:t.name,ok:ok,note:note});
  }
  return out;
}
function genPerfData(n,cols,seed){
  const rows=new Array(n);
  for(let i=0;i<n;i++){
    const r=new Array(cols+1);r[0]='K'+i;
    for(let c=1;c<=cols;c++)r[c]=String(((i*(c+3))%100000)/100+(seed&&i%17===0&&c===1?1:0));
    rows[i]=r;
  }
  return rows;
}
async function perfTest(outEl){
  const N=50000,C=20;
  clear(outEl).append(msg('產生測試資料並執行中…'));
  const hd=['K'].concat(Array.from({length:C},(_,i)=>'c'+(i+1)));
  const P={keys:[{a:'K',b:'K',transform:['trim']}],dupPolicyA:'flag',dupPolicyB:'flag',fields:hd.slice(1).map(c=>({a:c,b:c,type:'number',compare:true,tolerance:{abs:0}}))};
  const A={headers:hd,rows:genPerfData(N,C,0)},B={headers:hd,rows:genPerfData(N,C,1)};
  const t0=performance.now();let ticks=0,lastGap=0,last=performance.now();
  const timer=setInterval(()=>{const now=performance.now();lastGap=Math.max(lastGap,now-last-50);last=now;ticks++;},50);
  try{
    const r=await Bridge.call('run',{A:A,B:B,profile:P,opts:{keepMatch:false}});
    clearInterval(timer);
    const ms=performance.now()-t0;
    clear(outEl).append(msg('完成：A、B 各 '+N.toLocaleString()+' 列 × '+C+' 欄，耗時 '+(ms/1000).toFixed(2)+' 秒（'+(ms<5000?'✓ 達成 < 5 秒目標':'✗ 超過 5 秒目標')+'）；比對期間主執行緒最長停頓約 '+Math.max(0,Math.round(lastGap))+' ms（'+(Bridge.supported?'Worker 執行':'主執行緒執行')+'）。結果：相符 '+fmtNum(r.summary.counts.MATCH)+'、差異 '+fmtNum(r.summary.counts.DIFF)+'。',ms<5000?'okm':'wn'));
  }catch(e){clearInterval(timer);clear(outEl).append(msg('失敗：'+e.message,'err'));}
}
async function selfTestFlow(){
  const out=h('div',null,msg('檢測中…'));
  const perf=h('div',{style:{marginTop:'10px'}});
  const modalP=modal('自我檢測',h('div',null,out,h('div',{class:'row',style:{marginTop:'10px'}},h('button',{class:'btn',onclick:()=>perfTest(perf)},'效能測試（5 萬列 × 20 欄）')),perf),[{label:'關閉',value:null}]);
  const res=await runSelfTests();
  const pass=res.filter(r=>r.ok).length;
  clear(out).append(msg(pass+' / '+res.length+' 項通過',pass===res.length?'okm':'err'),
    h('table',{class:'t'},h('tbody',null,res.map(r=>h('tr',null,h('td',{style:{width:'30px'}},r.ok?'✅':'❌'),h('td',null,r.name,r.note?h('div',{class:'muted',style:{fontSize:'12px'}},r.note):null))))));
  await modalP;
}

/* ============================================================
 * 啟動
 * ============================================================ */
async function boot(){
  const app=$root();
  window.addEventListener('unhandledrejection',e=>{e.preventDefault();const r=e.reason;toast('發生錯誤：'+((r&&r.message)||r),6000);});
  window.addEventListener('error',e=>{toast('發生錯誤：'+(e.message||'未知錯誤'),6000);});
  if(!window.indexedDB){app.append(msg('此瀏覽器不支援 IndexedDB，無法使用本工具。','err'));return;}
  try{await DB.open();}
  catch(e){app.append(msg('無法開啟 IndexedDB：'+e.message+'（請確認不是無痕模式，或未被封鎖網站資料儲存）','err'));return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}   // 盡量避免瀏覽器在空間不足時自動清除資料
  await loadProjects();
  if(!S.projects.length)await createProject('我的第一個勾稽專案');
  if(!/^#\/(p\/[^/]+|home)/.test(location.hash)){
    const last=await getSetting('lastProject',null);
    const p=S.projects.find(x=>x.id===last)||S.projects[0];
    history.replaceState(null,'','#/p/'+p.id+'/data');
  }
  window.addEventListener('hashchange',route);
  await route();
}
boot();
