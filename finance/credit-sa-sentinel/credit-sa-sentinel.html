<script>
'use strict';
/* ============================================================

const DEFAULT_SETTINGS = {
  twSovereignRating: 'AA+', rwTol: 0.001, amtTol: 1, relTol: 0.0001,
  critRwa: 1000000000, highRwa: 10000000, matThresholds: [1000000, 10000000, 1000000000],
  maskExport: false, pageSize: 50, curBatchId: null,
  mdbWhitelist: ['INTERNATIONAL BANK FOR RECONSTRUCTION AND DEVELOPMENT', 'INTERNATIONAL FINANCE CORPORATION', 'MULTILATERAL INVESTMENT GUARANTEE AGENCY', 'ASIAN DEVELOPMENT BANK', 'AFRICAN DEVELOPMENT BANK', 'EUROPEAN BANK FOR RECONSTRUCTION AND DEVELOPMENT', 'EUROPEAN INVESTMENT BANK', 'EUROPEAN INVESTMENT FUND', 'INTER-AMERICAN DEVELOPMENT BANK', 'ISLAMIC DEVELOPMENT BANK', 'COUNCIL OF EUROPE DEVELOPMENT BANK', 'NORDIC INVESTMENT BANK', 'CARIBBEAN DEVELOPMENT BANK', 'ASIAN INFRASTRUCTURE INVESTMENT BANK', 'IDB INVEST', '世界銀行', '亞洲開發銀行', '亞洲基礎設施投資銀行'],
  urfiWhitelist: ['中華郵政', 'CHUNGHWA POST', '臺灣期貨交易所', '台灣期貨交易所', 'TAIWAN FUTURES EXCHANGE'],
  nameRules: [
    { label: '地方政府', kw: ['STATE OF', 'COMMONWEALTH OF', 'PROVINCE OF', 'PREFECTURE', 'METROPOLITAN GOVERNMENT', 'CITY OF', 'COUNTY OF', 'MUNICIPALITY', '縣政府', '市政府', '州政府'], exclude: [], expect: ['PSE_TW', 'PSE_OTHER'], suggestTW: 'PSE_TW', suggestOther: 'PSE_OTHER' },
    { label: '中央銀行', kw: ['CENTRAL BANK', '中央銀行'], exclude: [], expect: ['SOV_TW', 'SOV_OTHER'], suggestTW: 'SOV_TW', suggestOther: 'SOV_OTHER' },
    { label: '中央政府', kw: ['REPUBLIC OF', 'KINGDOM OF', 'GOVERNMENT OF', 'MINISTRY OF FINANCE', '財政部'], exclude: [], expect: ['SOV_TW', 'SOV_OTHER'], suggestTW: 'SOV_TW', suggestOther: 'SOV_OTHER' },
    { label: '開發銀行', kw: ['DEVELOPMENT BANK', '開發銀行'], exclude: [], expect: ['MDBS_BASEL', 'MDBS_OTHER', 'BANK', 'PSE_TW', 'PSE_OTHER', 'IAC', 'SOV_OTHER', 'SOV_TW'], suggestTW: null, suggestOther: 'MDBS_OTHER' },
    { label: '銀行', kw: ['BANK', '銀行', '信用合作社'], exclude: ['CENTRAL BANK', '中央銀行', 'DEVELOPMENT BANK', '開發銀行'], expect: ['BANK', 'URFI', 'MDBS_BASEL', 'MDBS_OTHER', 'SOV_TW', 'SOV_OTHER', 'IAC', 'SOES'], suggestTW: 'BANK', suggestOther: 'BANK' }
  ]
};

function defaultRwTable() {
  const codeMap = {
    IGO: { cls: 'IGO', label: '國際組織（歐盟等）' }, SOV_TW: { cls: 'SOVEREIGN', label: '我國中央政府部門及央行' },
    SOV_OTHER: { cls: 'SOVEREIGN', label: '其他主權國家或央行' }, IAC: { cls: 'NCG_PSE', label: '中央行政法人' },
    NPPE: { cls: 'NCG_PSE', label: '非營利國營企業' }, PSE_TW: { cls: 'NCG_PSE', label: '國內地方政府' },
    PSE_OTHER: { cls: 'NCG_PSE', label: '他國地方政府' }, MDBS_BASEL: { cls: 'MDB', label: '法規定義風險權數可為0%之多邊開發銀行' },
    MDBS_OTHER: { cls: 'MDB', label: '非法規定義風險權數可為0%之多邊開發銀行' }, URFI: { cls: 'BANK', label: '無評等之類金融機構（中華郵政及期交所）' },
    BANK: { cls: 'BANK', label: '一般銀行' }, FI_CORP: { cls: 'CORPORATE', label: '保險／證券／期貨公司' },
    CORP: { cls: 'CORPORATE', label: '一般企業' }, SOES: { cls: 'CORPORATE', label: '營利國營企業' }
  };
  return {
    version: 'RW-2025.07', effectiveFrom: '2025-07-01', verified: false,
    note: '預設範例參數，上線前必須逐項核對主管機關現行規定。',
    weights: {
      SOVEREIGN: [0, 20, 50, 100, 100, 150, 100],
      NCG_PSE: [20, 50, 100, 100, 150, 150, 100],
      MDB: [20, 50, 50, 100, 150, 150, 50],
      BANK: [20, 50, 50, 100, 150, 150, 50],
      CORPORATE: [20, 50, 100, 100, 150, 150, 100]
    },
    special: { MDBS_BASEL: 0, IGO: 0, URFI: 50, SOV_TW_TWD: 0 },
    params: {
      ratingValidMonths: 12, pastDueDays: 90, pastDueProducts: ['LOAN'], pastDueProvisionThreshold: 20, pastDueRwLow: 100, pastDueRwHigh: 150,
      shortTermMonths: 3, shortTermProducts: ['LOAN', 'DEPOSIT_PLACED', 'BILL'], bankShortTermRw: 20,
      classEquivalents: { IGO: ['IGO', 'SOVEREIGN', 'MDB'] }
    },
    ratingOverrides: {},
    codeMap
  };
}

function validRwTable(t) {
  const err = []; const num = x => typeof x === 'number' && isFinite(x);
  if (!t || typeof t !== 'object') return ['格式錯誤'];
  if (typeof t.version !== 'string' || !t.version) err.push('缺少版本名稱');
  if (typeof t.effectiveFrom !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.effectiveFrom) || isNaN(Date.parse(t.effectiveFrom))) err.push('生效日格式錯誤（YYYY-MM-DD）');
  if (!t.weights || typeof t.weights !== 'object') err.push('缺少權數表');
  else for (const c of RW_CLASSES) { const w = t.weights[c]; if (!Array.isArray(w) || w.length !== 7 || w.some(x => !num(x) || x < 0 || x > 1250)) err.push(c + ' 的權數必須是 7 個 0~1250 的數字'); }
  if (!t.special || typeof t.special !== 'object') err.push('缺少特例權數');
  else for (const k of ['MDBS_BASEL', 'IGO', 'URFI', 'SOV_TW_TWD']) if (!num(t.special[k]) || t.special[k] < 0 || t.special[k] > 1250) err.push('特例權數 ' + k + ' 必須是 0~1250 的數字');
  const P = t.params;
  if (!P || typeof P !== 'object') err.push('缺少其他參數');
  else {
    ['ratingValidMonths', 'pastDueDays', 'pastDueProvisionThreshold', 'pastDueRwLow', 'pastDueRwHigh', 'shortTermMonths', 'bankShortTermRw'].forEach(k => { if (!num(P[k]) || P[k] < 0) err.push('參數 ' + k + ' 必須是大於或等於 0 的數字'); });
    ['pastDueProducts', 'shortTermProducts'].forEach(k => { if (!Array.isArray(P[k])) err.push('參數 ' + k + ' 必須是陣列'); });
    if (P.classEquivalents !== undefined && (typeof P.classEquivalents !== 'object' || P.classEquivalents === null || Object.values(P.classEquivalents).some(v => !Array.isArray(v)))) err.push('參數 classEquivalents 格式錯誤');
  }
  if (!t.codeMap || typeof t.codeMap !== 'object') err.push('缺少代碼表');
  else for (const [k, v] of Object.entries(t.codeMap)) if (!v || !hasOwn(CLASS_LABEL, v.cls)) err.push('代碼 ' + k + ' 的暴險類別無效');
  if (t.ratingOverrides !== undefined && (typeof t.ratingOverrides !== 'object' || t.ratingOverrides === null || Object.values(t.ratingOverrides).some(v => !Number.isInteger(v) || v < 1 || v > 7))) err.push('評等自訂對應的等級必須是 1~7 的整數');
  return err;
}
function validNameRules(v) {
  if (!Array.isArray(v)) return ['必須是陣列'];
  const err = []; v.forEach((r, i) => {
    if (!r || typeof r !== 'object') return err.push('第 ' + (i + 1) + ' 筆格式錯誤');
    if (!Array.isArray(r.kw) || !r.kw.length || r.kw.some(x => typeof x !== 'string')) err.push('第 ' + (i + 1) + ' 筆 kw 必須是字串陣列');
    if (!Array.isArray(r.expect) || r.expect.some(x => typeof x !== 'string')) err.push('第 ' + (i + 1) + ' 筆 expect 必須是字串陣列');
    if (r.exclude !== undefined && (!Array.isArray(r.exclude) || r.exclude.some(x => typeof x !== 'string'))) err.push('第 ' + (i + 1) + ' 筆 exclude 必須是字串陣列');
    if (typeof r.label !== 'string') err.push('第 ' + (i + 1) + ' 筆缺少 label');
  }); return err;
}
const strList = v => Array.isArray(v) && v.every(x => typeof x === 'string');

/* ============================================================
 * 02 Utils
 * ============================================================ */
const sleep0 = () => new Promise(r => setTimeout(r, 0));
const clone = o => JSON.parse(JSON.stringify(o));
const isNil = v => v === null || v === undefined || v === '';
function fullToHalf(s) { return String(s).replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' '); }
function normName(s) { if (isNil(s)) return ''; return String(s).normalize('NFKC').toUpperCase().replace(/臺/g, '台').replace(/[\s.,()\-_'"&/、，。．·]/g, ''); }
function upperName(s) { return isNil(s) ? '' : String(s).normalize('NFKC').toUpperCase().replace(/臺/g, '台'); }
function parseNum(v) {
  if (isNil(v)) return null;
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = fullToHalf(String(v)).trim().replace(/[,\s%]/g, '');
  if (s === '' || s === '-' || /^(null|n\/a|na)$/i.test(s)) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  const n = Number(s);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function parseDate(v) {
  if (isNil(v)) return null;
  if (v instanceof Date) return v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
  const s = fullToHalf(String(v)).trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  let y, mo, d;

    { id: 'MAP-009', cat: 'MAP', sev: 'MEDIUM', name: '代碼與國別矛盾', remed: '更正國別或分類代碼', check(e, ctx, p, d) { if (!d.subType || isNil(e.issuerCountry)) return null; const tw = e.issuerCountry === 'TW'; if (['SOV_TW', 'PSE_TW'].includes(d.subType) && !tw) return hit('issuerCountry', e.issuerCountry, 'TW', `${d.subType} 為國內代碼，但國別為 ${e.issuerCountry}`); if (['SOV_OTHER', 'PSE_OTHER'].includes(d.subType) && tw) return hit('issuerCountry', e.issuerCountry, '非 TW', `${d.subType} 為國外代碼，但國別為 TW`); return null; } },
    /* --- CLASSIFICATION --- */

    { id: 'CL-003', cat: 'CLASSIFICATION', sev: 'MEDIUM', name: '非營利國營企業／行政法人誤列企業', remed: '重分類為非中央政府公共部門', check(e, ctx, p, d) { return ['NPPE', 'IAC'].includes(d.subType) && e.reportedClass === 'CORPORATE' ? hit('reportedClass', 'CORPORATE', 'NCG_PSE', `${d.subType} 申報為企業暴險`) : null; } },

    /* --- RISK_WEIGHT --- */
    { id: 'RW-003', cat: 'RISK_WEIGHT', sev: 'HIGH', name: '外幣主權暴險套用本國幣 0%', remed: '外幣暴險依主權評等計算', check(e, ctx, p, d) { return d.subType === 'SOV_TW' && e.currency !== 'TWD' && d.expectedRw > 0 && e.reportedRw === 0 ? hit('reportedRw', 0, d.expectedRw, `外幣（${e.currency}）暴險不適用新臺幣 0% 特例`) : null; } },

    { id: 'RW-001', cat: 'RISK_WEIGHT', sev: 'HIGH', name: '申報權數低於推導權數（RWA 低估）', remed: '依推導步驟更正權數並重算 RWA', check(e, ctx, p, d) { if (d.expectedRw === null || RW_SPECIFIC.some(id => ctx.hits.has(id))) return null; if (!(e.reportedRw < d.expectedRw - ctx.settings.rwTol)) return null; const imp = d.calculatedRwa !== null ? d.calculatedRwa - (e.reportedRwa || 0) : null; return hit('reportedRw', e.reportedRw, d.expectedRw, `申報權數 ${e.reportedRw}%，推導應為 ${d.expectedRw}%`, { sev: imp === null ? 'HIGH' : dynSev(imp, ctx) }); } },

    { id: 'CALC-001', cat: 'CALCULATION', sev: 'MEDIUM', name: '申報 EAD 與重算不符', remed: '核對備抵、CCF 與抵減', check(e, ctx, p, d) { if (isNil(e.reportedEad) || d.calculatedEad === null) return null; const tol = Math.max(ctx.settings.amtTol, ctx.settings.relTol * d.calculatedEad); return Math.abs(e.reportedEad - d.calculatedEad) > tol ? hit('reportedEad', e.reportedEad, d.calculatedEad, `申報 EAD ${fmt(e.reportedEad)}，重算 ${fmt(d.calculatedEad)}`) : null; } },

  const expMap = new Map(exps.map(e => [e.id, e])); const RM = new Map(Engine.RULES.map(r => [r.id, r]));
  anoms.forEach(a => { const r = RM.get(a.ruleId) || {}; const e = expMap.get(a.expKey);

// 比對案件是否有實質變動（忽略 updatedAt）；重跑時沒變動的資料不重寫，IndexedDB 覆寫比新增慢很多
const ANOM_KEYS = ['batchId', 'exposureId', 'expKey', 'reportingDate', 'custId', 'ruleId', 'ruleVersion', 'severity', 'field', 'reportedValue', 'expectedValue', 'rwaImpact', 'priorityScore', 'rootCauseId', 'message', 'status', 'assignee', 'createdAt', 'waived'];
const sameAnomaly = (a, b) => ANOM_KEYS.every(k => { const x = a[k] === undefined ? null : a[k], y = b[k] === undefined ? null : b[k]; return x === y; });
async function processBatch(batch, exps, upd, isCancelled) {
  const [mapRecs, waivers, oldAn] = await Promise.all([DB.getAll('mapRecords'), DB.getAll('waivers'), DB.getAllByIndex('anomalies', 'batchId', batch.batchId)]);
  const table = pickTable(S.rwTables, batch.reportingDate);
  let prior = null;
  if (batch.baseBatchId) { const pb = await DB.get('importBatches', batch.baseBatchId); if (pb) prior = { exps: await DB.getAllByIndex('exposures', 'batchId', pb.batchId), anomalies: await DB.getAllByIndex('anomalies', 'batchId', pb.batchId), stats: pb.stats }; }
  const prevSig = new Map(); exps.forEach(e => { if (e.derived) prevSig.set(e.id, fnv(JSON.stringify(e.derived))); });
  const res = await Engine.run({ batch, exps, mapRecs, table, settings: S.settings, ruleCfg: S.ruleCfg, waivers, oldAnomalies: oldAn, prior, onProgress: (d, t) => upd && upd(d, t, '執行規則'), isCancelled });
  exps.forEach(e => { delete e.collateralKey; });
  batch.stats = res.stats; batch.rwTableVersion = table.version;
  const expsToWrite = exps.filter(e => prevSig.get(e.id) !== fnv(JSON.stringify(e.derived)));
  const oldMap = new Map(oldAn.map(a => [a.anomalyId, a]));
  const anToWrite = res.anomalies.filter(n => { const o = oldMap.get(n.anomalyId); if (!o) return true; if (sameAnomaly(n, o)) { n.updatedAt = o.updatedAt; return false; } return true; });
  await DB.putMany('exposures', expsToWrite, 2000, (d, t) => upd && upd(d, t, '寫入暴險與推導結果'));
  const keep = new Set(res.anomalies.map(a => a.anomalyId));
  await DB.putMany('anomalies', anToWrite, 2000, (d, t) => upd && upd(d, t, '寫入異常案件'));
  await DB.deleteKeys('anomalies', oldAn.filter(a => !keep.has(a.anomalyId)).map(a => a.anomalyId));
  await DB.put('importBatches', batch);
  await DB.log('RUN_RULES', { batchId: batch.batchId, anomalies: res.anomalies.length, written: { exposures: expsToWrite.length, anomalies: anToWrite.length }, ruleSet: RULESET_VERSION, rwTable: table.version });
  invalidate(); await refreshBatches(); return res;
}
async function runBatch(batchId, upd, isCancelled) {
  const batch = await DB.get('importBatches', batchId); if (!batch) throw new Error('批次不存在');
  const exps = await DB.getAllByIndex('exposures', 'batchId', batchId);
  return processBatch(batch, exps, upd, isCancelled);
}

async function createBatch(records, meta, upd, isCancelled) {
  const batchId = 'B' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
  for (const r of records) { r.reportingDate = r.reportingDate || meta.reportingDate; }
  const dates = new Map(); records.forEach(r => { if (r.reportingDate) dates.set(r.reportingDate, (dates.get(r.reportingDate) || 0) + 1); });
  const topDate = [...dates.entries()].sort((a, b) => b[1] - a[1])[0]; const reportingDate = topDate && topDate[0];
  if (!reportingDate) throw new Error('無法判斷基準日，請指定基準日');
  const cnt = new Map();
  records.forEach(r => { const b = isNil(r.exposureId) ? 'ROW' + r.rowNo : r.exposureId; const c = (cnt.get(b) || 0) + 1; cnt.set(b, c); r.id = batchId + ':' + b + (c > 1 ? '#' + r.rowNo : ''); r.batchId = batchId; r.derived = null; });
  const base = S.batches.filter(b => b.reportingDate < reportingDate).sort((a, b) => a.reportingDate < b.reportingDate ? 1 : -1)[0];
  const batch = { batchId, reportingDate, fileName: meta.fileName || '(貼上資料)', fileHash: meta.fileHash || null, createdAt: new Date().toISOString(), rowCount: records.length, errorCount: (meta.errors || []).length, unit: meta.unit || 1, baseBatchId: base ? base.batchId : null, stats: null };
  try {
    await processBatch(batch, records, upd, isCancelled);
    if (meta.errors && meta.errors.length) await DB.putMany('importErrors', meta.errors.map(e => Object.assign({ batchId }, e)));
  } catch (err) {
    try { await DB.deleteBatchData(batchId); } catch (e2) { console.warn('清理失敗批次時發生錯誤', e2); } // 失敗時整批回復，不留下半套資料
    await refreshBatches(); throw err;
  }
  await DB.log('IMPORT', { batchId, rows: records.length, file: batch.fileName, hash: batch.fileHash });
  S.settings.curBatchId = batchId; await saveSetting('curBatchId', batchId);
  return batchId;
}
async function importMapRecords(records, meta) {
  const groups = new Map();
  for (const r of records) { if (isNil(r.CUST_ID) || isNil(r.DATADATE)) continue; const k = r.DATADATE + '|' + r.CUST_ID; (groups.get(k) || groups.set(k, []).get(k)).push(r); }
  const out = [];
  groups.forEach((arr, k) => {
    const codes = [...new Set(arr.map(a => a.SUB_EXPTYPE_BOT))]; const f = arr[0];
    const o = { key: k, DATADATE: f.DATADATE, CUST_ID: f.CUST_ID, CUST_NAME: f.CUST_NAME || null, SUB_EXPTYPE_BOT: f.SUB_EXPTYPE_BOT, importedAt: new Date().toISOString(), source: meta.fileName || '' };
    if (codes.length > 1) { o.conflict = true; o.codes = codes; }
    out.push(o);
  });
  await DB.putMany('mapRecords', out); await DB.log('IMPORT_MAP', { rows: out.length, file: meta.fileName });
  return out.length;
}
