function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('此瀏覽器無法使用 IndexedDB'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases',{keyPath:'caseId'});if(!db.objectStoreNames.contains('prefs'))db.createObjectStore('prefs',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('資料庫開啟失敗'));req.onblocked=()=>reject(Error('資料庫升級被其他分頁阻擋，請關閉其他工作站分頁'))})}

function getKey(row){return canonicalKey(row,state.map.key)}
function validateRows(){const seen=new Map(),blank=[],dupes=[],badAmount=[],badDate=[];for(let i=0;i<state.rows.length;i++){const row=state.rows[i],key=getKey(row),display=state.map.key.map(c=>String(row[c]??'')).join(' / ');if(state.map.key.length===0||state.map.key.some(c=>String(row[c]??'').trim()===''))blank.push(row.__row||i+2);else if(seen.has(key)){dupes.push({key:display,rows:[seen.get(key),row.__row||i+2]})}else seen.set(key,row.__row||i+2);if(state.map.amount&&String(row[state.map.amount]??'').trim()!==''&&!Number.isFinite(parseAmount(row[state.map.amount])))badAmount.push(row.__row||i+2);if(state.map.date&&String(row[state.map.date]??'').trim()!==''&&!parseDate(row[state.map.date]))badDate.push(row.__row||i+2)}return{total:state.rows.length,blank,dupes,badAmount,badDate,validKeys:state.rows.length-blank.length-dupes.length}}

function parseDate(v){if(v instanceof Date)return Number.isNaN(v.getTime())?null:v; if(typeof v==='number'&&v>20000&&v<90000)return new Date((v-25569)*86400000);const s=String(v??'').trim();if(!s)return null;let d=new Date(s);if(!Number.isNaN(d.getTime()))return d;const m=s.match(/^(\d{2,4})[/.年-](\d{1,2})[/.月-](\d{1,2})/);if(m){let y=Number(m[1]);if(y<100)y+=1911;d=new Date(y,Number(m[2])-1,Number(m[3]));return Number.isNaN(d.getTime())?null:d}return null}

e><thead><tr><th>#</th><th>識別鍵</th><th>原始列</th>${headers.filter(h=>!state.map.key.includes(h)).map(h=>`<th>${escapeHtml(h)}</th>`).join('')}<th>選入來源</th><th>測試結果</th></tr></thead><tbody>${shown.map((r,i)=>`<tr><td>${begin+i+1}</td><td>${escapeHtml(r.key)}</td><td>${fmt(r.originalRowNumber)}</td>${headers.filter(h=>!state.map.key.includes(h)).map(h=>`<td>${escapeHtml(r.values[h]??'')}</td>`).join('')}<td><span class="badge">${r.selectedReason==='CERTAINTY'?'CERTAINTY':'RANDOM'}</span></td><td>＿＿＿＿</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>顯示 ${fmt(begin+1)}–${fmt(Math.min(begin+PAGE_SIZE,selected.length))} / ${fmt(selected.length)}</span><div class="row"><button class="btn small" id="reviewPrev" ${begin===0?'disabled':''}>上一頁</button><button class="btn small" id="reviewNext" ${begin+PAGE_SIZE>=selected.length?'disabled':''}>下一頁</button></div></div></section><section class="card"><h3>抽樣稽核資訊</h3><div class="grid two"><div class="callout">演算法：${escapeHtml(run.algorithm)}<br>來源檔：${escapeHtml(run.population.sourceFileName)}<br>來源 SHA-256：<span style="word-break:break-all">${escapeHtml(run.population.sourceSha256)}</span></div><div class="callout">正規化母體 SHA-256：<span style="word-break:break-all">${escapeHtml(run.population.normalizedPopulationSha256)}</span><br>排除筆數：${fmt(run.excludedRows)}<br>appVersion：${APP_VERSION}</div></div></section>${navActions()}`}

function maskValue(v,col){if(!state.redactMode||state.map.key.includes(col))return v;const s=String(v??'');if(!s)return'';if(typeof v==='number'||(s!==''&&Number.isFinite(Number(s))))return'0';return s.length<=4?'＊'.repeat(s.length):'＊'.repeat(Math.max(0,s.length-4))+s.slice(-4)}

async function importProjectFile(file){try{if(file.size>2*1024*1024)throw Error('設定檔超過 2 MB');const obj=JSON.parse(await file.text());if(obj.schema!=='audit-sampling-studio-project'||obj.schemaVersion!==1)throw Error('設定檔 schema 或版本不相容');if(!Array.isArray(obj.source?.headers)||!obj.fieldMapping||!obj.sampling)throw Error('設定檔缺少必要欄位');if(state.headers.length&&obj.source.headers.some(h=>!state.headers.includes(h)))throw Error('設定檔欄位不存在於目前母體，請確認匯入來源');if(obj.sampling.sampleSize!==undefined&&(!Number.isInteger(obj.sampling.sampleSize)||obj.sampling.sampleSize<1))throw Error('設定檔樣本數無效');state.map=obj.fieldMapping;state.filters=Array.isArray(obj.filters)?obj.filters:[];Object.assign(state,{method:obj.sampling.method||'SRS',sampleSize:obj.sampling.sampleSize||20,seed:obj.sampling.seed||'AUDIT-2026',sortColumns:obj.sampling.sortColumns||[],stratumColumn:obj.sampling.stratumColumn||'',allocation:obj.sampling.allocation||'PROPORTIONAL',manualAllocation:obj.sampling.manualAllocation||{},minOne:!!obj.sampling.minOnePerStratum,certaintyRules:obj.sampling.certaintyRules||[]});state.run=null;state.step=1;render();await saveCurrent(false);toast('設定已驗證並套用；須重新執行抽樣。')}catch(e){toast(`設定匯入失敗：${e.message}`,true)}}
function changeMap(e){if(e.target.matches('[data-map-key]')){const h=e.target.dataset.mapKey;if(e.target.checked){if(state.map.key.length>=3){e.target.checked=false;toast('複合識別鍵最多 3 欄。',true);return}state.map.key.push(h)}else state.map.key=state.map.key.filter(k=>k!==h);state.issues=validateRows()}else if(e.target.matches('[data-map]'))state.map[e.target.dataset.map]=e.target.value;state.run=null;render();maybeSave()}
function setFilter(i,key,v){if(!state.filters[i])return;state.filters[i][key]=v}
function bindStepEvents(){const app=$('#app');if(state.step===0){$('#chooseFile')?.addEventListener('click',e=>{e.stopPropagation();$('#fileInput').click()});$('#dropzone')?.addEventListener('click',e=>{if(e.target.id!=='chooseFile')$('#fileInput').click()});$('#dropzone')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#fileInput').click()}});$('#dropzone')?.addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.classList.add('drag')});$('#dropzone')?.addEventListener('dragleave',e=>e.currentTarget.classList.remove('drag'));$('#dropzone')?.addEventListener('drop',e=>{e.preventDefault();e.currentTarget.classList.remove('drag');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});$('#fileInput')?.addEventListener('change',e=>e.target.files[0]&&handleFile(e.target.files[0]));$('#encoding').onchange=e=>{state.encoding=e.target.value;if(state.fileBuffer&&state.sourceName.toLowerCase().endsWith('.csv'))reparseCurrent()};$('#headerRow').onchange=()=>{state.headerRow=Math.max(1,Number($('#headerRow').value)||1);if(state.fileBuffer)reparseCurrent()};$('#sheetSelect')?.addEventListener('change',e=>{state.selectedSheet=e.target.value;reparseCurrent()});$('#demoBtn').onclick=loadDemo}
if(state.step===1){app.querySelectorAll('[data-map-key],[data-map]').forEach(el=>el.onchange=changeMap);$('#validateBtn').onclick=()=>{state.issues=validateRows();render()}}
if(state.step===2){$('#addFilter').onclick=()=>{state.filters.push({column:state.headers[0]||'',operator:'=',value:''});render()};app.querySelectorAll('[data-filter-column]').forEach(e=>e.onchange=()=>{setFilter(Number(e.dataset.filterColumn),'column',e.value);state.run=null});app.querySelectorAll('[data-filter-op]').forEach(e=>e.onchange=()=>{setFilter(Number(e.dataset.filterOp),'operator',e.value);render()});app.querySelectorAll('[data-filter-value]').forEach(e=>e.oninput=()=>setFilter(Number(e.dataset.filterValue),'value',e.value));app.querySelectorAll('[data-remove-filter]').forEach(e=>e.onclick=()=>{state.filters.splice(Number(e.dataset.removeFilter),1);render()});$('#clearFilters').onclick=()=>{state.filters=[];state.exclusionLog=[];state.eligible=state.rows.slice();state.run=null;render()};$('#applyFilters').onclick=applyFilters}
if(state.step===3){app.querySelectorAll('[name="method"]').forEach(e=>e.onchange=()=>{state.method=e.value;state.run=null;render()});$('#sampleSize').onchange=e=>{state.sampleSize=Number(e.target.value);state.run=null};$('#seed').onchange=e=>{state.seed=e.target.value.trim();state.run=null};$('#sortColumn')?.addEventListener('change',e=>state.sortColumns=[e.target.value]);$('#stratumColumn')?.addEventListener('change',e=>{state.stratumColumn=e.target.value;render()});$('#allocation')?.addEventListener('change',e=>{state.allocation=e.target.value;render()});$('#minOne')?.addEventListener('change',e=>state.minOne=e.target.checked);app.querySelectorAll('[data-stratum-allocation]').forEach(e=>e.onchange=()=>state.manualAllocation[e.dataset.stratumAllocation]=Number(e.value));$('#addCertainty')?.addEventListener('click',()=>{state.certaintyRules.push({column:state.headers[0],operator:'=',value:''});render()});app.querySelectorAll('[data-cert-col]').forEach(e=>e.onchange=()=>state.certaintyRules[Number(e.dataset.certCol)].column=e.value);app.querySelectorAll('[data-cert-op]').forEach(e=>e.onchange=()=>state.certaintyRules[Number(e.dataset.certOp)].operator=e.value);app.querySelectorAll('[data-cert-value]').forEach(e=>e.oninput=()=>state.certaintyRules[Number(e.dataset.certValue)].value=e.value);app.querySelectorAll('[data-remove-cert]').forEach(e=>e.onclick=()=>{state.certaintyRules.splice(Number(e.dataset.removeCert),1);render()});$('#runSampling')?.addEventListener('click',executeSampling)}
if(state.step===4){$('#toSample')?.addEventListener('click',()=>goStep(3));$('#rerun')?.addEventListener('click',()=>goStep(3));$('#reviewPrev')?.addEventListener('click',()=>{state.reviewPage--;render()});$('#reviewNext')?.addEventListener('click',()=>{state.reviewPage++;render()})}
if(state.step===5){$('#redactToggle').onchange=e=>{state.redactMode=e.target.checked;render()};app.querySelectorAll('[data-export-col]').forEach(e=>e.onchange=()=>state.exportColumns=selectedExportCols());$('#exportXlsx').onclick=exportXlsx;$('#exportCsv').onclick=exportCsv;$('#exportJson').onclick=exportJson;$('#importJson').onclick=()=>$('#jsonInput').click();$('#jsonInput').onchange=e=>e.target.files[0]&&importProjectFile(e.target.files[0]);$('#printWorkpaper')?.addEventListener('click',printWorkpaper)}
bindNav()}
async function handleFile(file){if(file.size>MAX_FILE){toast('檔案超過 50 MB 上限，請先切分母體。',true);return}const ext=file.name.split('.').pop().toLowerCase();if(!['csv','xlsx'].includes(ext)){toast('目前僅支援 CSV 與 XLSX 檔案。',true);return}try{setBusy(true,'讀取並驗證檔案');const buffer=await file.arrayBuffer();state.fileBuffer=buffer;state.caseId=crypto.randomUUID();state.sourceName=file.name;state.sourceHash=await digestBytes(buffer);state.sheetNames=[];state.formulaWarnings=0;if(ext==='csv'){const decoded=decodeCsvBytes(buffer,state.encoding);state.encodingDetected=`${decoded.encoding} (${decoded.reason})`;const parsed=await parseCsvInWorker(decoded.text,state.headerRow);state.headers=parsed.headers;state.rows=parsed.rows}else{if(/\.xlsm$/i.test(file.name))throw Error('不支援含巨集的活頁簿；請另存為 XLSX');state.xlsx=await readXlsx(buffer);state.sheetNames=state.xlsx.sheetNames;state.selectedSheet=state.sheetNames[0];const parsed=state.xlsx.readSheet(state.selectedSheet,state.headerRow-1);state.headers=parsed.headers;state.rows=parsed.rows;state.formulaWarnings=parsed.formulaMissing}state.preview=state.rows.slice(0,100);state.caseName=file.name.replace(/\.[^.]+$/,'');state.map={key:state.headers.length?[state.headers[0]]:[],amount:'',date:'',stratum:'',risk:''};state.issues=validateRows();state.eligible=state.rows.slice();state.filters=[];state.exclusionLog=[];state.run=null;state.exportColumns=[];state.reviewPage=0;state.step=0;await maybeSave();render();toast(state.formulaWarnings?`已匯入 ${fmt(state.rows.length)} 筆；${state.formulaWarnings} 個公式欄位無快取值，已留空。`:`已匯入 ${fmt(state.rows.length)} 筆資料，SHA-256 已計算。`,!!state.formulaWarnings)}catch(e){toast(`匯入失敗：${e.message}`,true)}finally{setBusy(false)}}
async function reparseCurrent(){try{if(!state.fileBuffer)return;const ext=state.sourceName.split('.').pop().toLowerCase();setBusy(true,'重新解析母體');if(ext==='csv'){const decoded=decodeCsvBytes(state.fileBuffer,state.encoding);state.encodingDetected=`${decoded.encoding} (${decoded.reason})`;const parsed=await parseCsvInWorker(decoded.text,state.headerRow);state.headers=parsed.headers;state.rows=parsed.rows}else{const parsed=state.xlsx.readSheet(state.selectedSheet,state.headerRow-1);state.headers=parsed.headers;state.rows=parsed.rows}state.preview=state.rows.slice(0,100);state.map={key:state.headers.length?[state.headers[0]]:[],amount:'',date:'',stratum:'',risk:''};state.filters=[];state.exclusionLog=[];state.issues=validateRows();state.eligible=state.rows.slice();state.run=null;await maybeSave();render()}catch(e){toast(`重新解析失敗：${e.message}`,true)}finally{setBusy(false)}}
async function maybeSave(){if(state.persistEnabled&&state.rows.length)await saveCurrent(false)}
async function loadDemo(){const headers=['交易編號','分行','交易日期','交易金額','風險等級','交易類型','客戶代碼'];const rows=[];const branches=['台北','台中','高雄','新竹'];const risks=['低','中','高'];const types=['轉帳','存款','提款','匯款'];for(let i=1;i<=100;i++)rows.push({'交易編號':`TX-${String(i).padStart(4,'0')}`,'分行':branches[(i*7)%4],'交易日期':`2026-${String(1+(i%9)).padStart(2,'0')}-${String(1+(i*3)%28).padStart(2,'0')}`,'交易金額':1000+((i*7919)%900000),'風險等級':risks[(i*11)%3],'交易類型':types[(i*13)%4],'客戶代碼':`C-${String(10000+(i*37)%997).padStart(5,'0')}`,'__row':i+1});state.headers=headers;state.rows=rows;state.preview=rows.slice(0,100);state.sourceName='虛構示範母體.csv';state.fileBuffer=null;state.xlsx=null;state.sourceHash=await sha256Hex(JSON.stringify(rows));state.caseId=crypto.randomUUID();state.caseName='虛構示範母體';state.map={key:['交易編號'],amount:'交易金額',date:'交易日期',stratum:'分行',risk:'風險等級'};state.issues=validateRows();state.eligible=rows.slice();state.filters=[];state.exclusionLog=[];state.run=null;state.method='SRS';state.sampleSize=20;state.seed='AUDIT-2026';state.step=0;await maybeSave();render();toast('已載入 100 筆完全虛構示範資料。')}
function applyFilters(){let current=state.rows.slice();const logs=[];for(const f of state.filters){if(!f.column)continue;const before=current.length;current=current.filter(r=>testRule(r[f.column],f.operator,f.value));logs.push({column:f.column,operator:f.operator,value:f.value,before,after:current.length,excluded:before-current.length})}state.eligible=current;state.exclusionLog=logs;state.run=null;render();toast(`篩選完成，可抽母體 ${fmt(current.length)} 筆。`);maybeSave()}
async function normalizedPopulationHash(records){const cols=[...state.headers].sort(stableCompare);const rows=records.map(r=>{const o={};for(const c of cols){const v=r[c];o[c]=v===undefined||v===null?'':typeof v==='string'?v.normalize('NFC').trim():v}return o}).sort((a,b)=>stableCompare(canonicalKey(a,state.map.key),canonicalKey(b,state.map.key)));return sha256Hex(JSON.stringify({normalizationVersion:'canonical-v1',columns:cols,rows}))}
async function normalizedPopulationHashWorker(records,headers,keyColumns){const cols=[...headers].sort(stableCompare);const rows=records.map(r=>{const o={};for(const c of cols){const v=r.values[c];o[c]=v===undefined||v===null?'':typeof v==='string'?v.normalize('NFC').trim():v}return o}).sort((a,b)=>stableCompare(canonicalKey(a,keyColumns),canonicalKey(b,keyColumns)));return sha256Hex(JSON.stringify({normalizationVersion:'canonical-v1',columns:cols,rows}))}
function getNormalizedRecords(source=state.eligible){if(state.issues?.blank.length||state.issues?.dupes.length)throw Error('識別鍵有空白或重複，請修正母體後再抽樣');if(!state.map.key.length)throw Error('請至少選擇一個識別鍵欄位');return source.map(row=>({key:getKey(row),originalRowNumber:row.__row||0,values:Object.fromEntries(state.headers.map(h=>[h,row[h]??'']))})).sort((a,b)=>stableCompare(a.key,b.key))}
async function executeSampling(){try{state.sampleSize=Number($('#sampleSize').value);state.seed=$('#seed').value.trim();if(!state.seed)throw Error('請輸入隨機種子');if(state.method==='STRATIFIED'){state.stratumColumn=$('#stratumColumn')?.value||state.map.stratum;if(!state.stratumColumn)throw Error('請指定分層欄位');if(state.allocation==='MANUAL')$$('[data-stratum-allocation]').forEach(e=>state.manualAllocation[e.dataset.stratumAllocation]=Number(e.value)||0)}if(state.method==='CERTAINTY_PLUS_SRS'){state.certaintyRules=$$('[data-cert-col]').map((e,i)=>({column:e.value,operator:$(`[data-cert-op="${i}"]`).value,value:$(`[data-cert-value="${i}"]`).value}))}const records=getNormalizedRecords();if(!records.length)throw Error('可抽母體為空，請調整篩選條件');if(!Number.isInteger(state.sampleSize)||state.sampleSize<1||state.sampleSize>records.length)throw Error(`樣本數須介於 1 與可抽母體 ${records.length} 之間`);if(state.method==='SYSTEMATIC')state.sortColumns=[$('#sortColumn')?.value||state.map.key[0]];setBusy(true,'計算抽樣結果');const samplePayload={records,hashRecords:getNormalizedRecords(state.rows),headers:state.headers,keyColumns:state.map.key,method:state.method,n:state.sampleSize,seed:state.seed,stratum:state.stratumColumn,allocation:state.allocation,manualAllocation:state.manualAllocation,minOne:state.minOne,certaintyRules:state.certaintyRules};const workerOutput=await workerRequest('sample',samplePayload);const sampled=workerOutput?.sampling||await runSampling(samplePayload);const normHash=workerOutput?.populationHash||await normalizedPopulationHash(state.rows);const byKey=new Map(records.map(r=>[r.key,r]));const selected=sampled.selected.map(r=>({...r,values:byKey.get(r.key).values,originalRowNumber:byKey.get(r.key).originalRowNumber}));const strata=sampled.allocations.map(x=>({stratum:x.stratum,population:records.filter(r=>stratumValue(r.values[state.stratumColumn])===x.stratum).length,sample:x.count}));state.run={runId:crypto.randomUUID(),runAt:new Date().toISOString(),algorithm:ALGORITHM_VERSION,appVersion:APP_VERSION,population:{sourceFileName:state.sourceName,sourceSha256:state.sourceHash,importedRows:state.rows.length,eligibleRows:records.length,keyColumns:state.map.key,normalizedPopulationSha256:normHash},populationN:records.length,excludedRows:state.rows.length-records.length,config:{method:state.method,sampleSize:state.sampleSize,seed:state.seed,algorithmVersion:ALGORITHM_VERSION,sortColumns:state.sortColumns,stratumColumn:state.stratumColumn,allocation:state.allocation,manualAllocation:state.manualAllocation,minOnePerStratum:state.minOne,certaintyRules:state.certaintyRules},selected,strata};state.reviewPage=0;state.step=4;await maybeSave();render();toast(`抽樣完成，產生 ${fmt(selected.length)} 筆樣本。`)}catch(e){toast(`無法執行抽樣：${e.message}`,true);const w=$('#sampleWarnings');if(w)w.innerHTML=`<div class="alert bad">${escapeHtml(e.message)}</div>`}finally{setBusy(false)}}
function showModal(title,body,actions){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><section class="modal"><h2>${title}</h2>${body}<div class="modal-actions">${actions}</div></section></div>`}
function applyTheme(){document.documentElement.dataset.theme=state.theme;const dark=state.theme==='dark',button=$('#themeBtn');if(button){button.setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');button.innerHTML=dark?'<span aria-hidden="true">☀</span><span id="themeLabel">淺色模式</span>':'<span aria-hidden="true">◐</span><span id="themeLabel">深色模式</span>'}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101921':'#f3f7f6'}
function bindGlobal(){applyTheme();$('#themeBtn').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme()};updatePersistenceUi().then(()=>refreshSaved()).catch(e=>toast(`初始化 IndexedDB 失敗：${e.message}`,true));$('#persistenceBtn').onclick=async()=>{try{if(!state.persistEnabled){showModal('啟用本機案件保存',`<p>啟用後，目前已匯入的工作案件與之後案件會存入此瀏覽器的 IndexedDB，包含匯入列與抽樣結果。資料不會加密或同步到其他裝置。是否啟用？</p>`,`<button class="btn" id="persistCancel">取消</button><button class="btn primary" id="persistConfirm">啟用並保存</button>`);$('#persistCancel').onclick=()=>$('#modalRoot').innerHTML='';$('#persistConfirm').onclick=async()=>{try{await dbOp('prefs','readwrite','put',{key:'persist',value:true});await updatePersistenceUi();$('#modalRoot').innerHTML='';await maybeSave();toast('已啟用 IndexedDB 本機保存。')}catch(e){toast(`啟用保存失敗：${e.message}`,true)}}}else{showModal('停用本機保存',`<p>停用後，新匯入與後續修改將不再寫入 IndexedDB。既有保存案件會保留，需在案件管理中刪除。</p>`,`<button class="btn" id="persistCancel">取消</button><button class="btn primary" id="persistConfirm">停用保存</button>`);$('#persistCancel').onclick=()=>$('#modalRoot').innerHTML='';$('#persistConfirm').onclick=async()=>{try{await dbOp('prefs','readwrite','put',{key:'persist',value:false});await updatePersistenceUi();$('#modalRoot').innerHTML='';toast('已停用保存；既有案件保留。')}catch(e){toast(`停用保存失敗：${e.message}`,true)}}}}catch(e){toast(`保存設定失敗：${e.message}`,true)}};
$('#savedBtn').onclick=showSavedCases;$('#clearAllBtn').onclick=()=>showModal('清除全部保存案件',`<p>此操作會刪除 IndexedDB 中所有已保存案件，無法復原。確認清除？</p>`,`<button class="btn" id="clearCancel">取消</button><button class="btn danger" id="clearConfirm">清除全部</button>`);$('#clearAllBtn').addEventListener('click',()=>{$('#clearCancel').onclick=()=>$('#modalRoot').innerHTML='';$('#clearConfirm').onclick=async()=>{try{await dbOp('cases','readwrite','clear');await refreshSaved();$('#modalRoot').innerHTML='';toast('已清除全部保存案件。')}catch(e){toast(`清除失敗：${e.message}`,true)}}});}
async function showSavedCases(){try{await refreshSaved();const rows=state.savedCases;showModal('已保存案件',`<p>案件保存在此瀏覽器的 IndexedDB。刪除後無法復原。</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>案件</th><th>更新時間</th><th>筆數</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${new Date(r.savedAt).toLocaleString('zh-TW')}</td><td>${fmt(r.rows?.length||0)}</td><td><button class="btn small" data-load-case="${escapeHtml(r.caseId)}">開啟</button> <button class="btn small danger" data-delete-case="${escapeHtml(r.caseId)}">刪除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚無保存案件</div>'}`,`<button class="btn" id="savedClose">關閉</button>`);$('#savedClose').onclick=()=>$('#modalRoot').innerHTML='';$$('[data-load-case]').forEach(b=>b.onclick=()=>loadSaved(b.dataset.loadCase));$$('[data-delete-case]').forEach(b=>b.onclick=()=>confirmDeleteSaved(b.dataset.deleteCase))}catch(e){toast(`案件清單讀取失敗：${e.message}`,true)}}
async function loadSaved(id){try{const item=await dbOp('cases','readonly','get',id);if(!item)throw Error('找不到保存案件');Object.assign(state,{caseId:item.caseId,caseName:item.name,sourceName:item.sourceName,sourceHash:item.sourceHash,headers:item.headers,rows:item.rows,preview:item.rows.slice(0,100),map:item.map,filters:item.filters||[],exclusionLog:item.exclusionLog||[],eligible:applyFilterData(item.rows,item.filters||[]),method:item.method,sampleSize:item.sampleSize,seed:item.seed,stratumColumn:item.stratumColumn,allocation:item.allocation,manualAllocation:item.manualAllocation||{},minOne:item.minOne,certaintyRules:item.certaintyRules||[],run:item.run,settings:item.settings||{},step:item.run?4:0,issues:null});state.issues=validateRows();$('#modalRoot').innerHTML='';render();toast('已開啟本機保存案件。')}catch(e){toast(`開啟案件失敗：${e.message}`,true)}}
function applyFilterData(rows,filters){let result=rows.slice();for(const f of filters)result=result.filter(r=>testRule(r[f.column],f.operator,f.value));return result}
async function confirmDeleteSaved(id){try{const item=await dbOp('cases','readonly','get',id);if(!item)throw Error('找不到保存案件');showModal('刪除保存案件',`<p>即將永久刪除「${escapeHtml(item.name)}」，無法復原。確認刪除？</p>`,`<button class="btn" id="deleteCancel">保留案件</button><button class="btn danger" id="deleteConfirm">刪除案件</button>`);$('#deleteCancel').onclick=()=>showSavedCases();$('#deleteConfirm').onclick=()=>deleteSaved(id)}catch(e){toast(`無法刪除：${e.message}`,true)}}
async function deleteSaved(id){try{await dbOp('cases','readwrite','delete',id);await refreshSaved();toast('已刪除保存案件。');showSavedCases()}catch(e){toast(`刪除失敗：${e.message}`,true)}}
function printWorkpaper(){if(!state.run)return;const run=state.run,root=$('#app'),old=root.innerHTML;root.innerHTML=`<div class="page-head"><h2>稽核抽樣工作底稿</h2></div><section class="card"><h3>抽樣摘要</h3><p>案件：${escapeHtml(state.caseName||state.sourceName)}</p><p>查核主題：＿＿＿＿　查核期間：＿＿＿＿　查核目的：＿＿＿＿</p><p>母體：${fmt(run.populationN)} 筆　樣本：${fmt(run.selected.length)} 筆　方法：${escapeHtml(run.config.method)}　seed：${escapeHtml(run.config.seed)}</p><p>樣本數核定依據：＿＿＿＿　測試程序：＿＿＿＿　覆核人員：＿＿＿＿</p><p>runId：${escapeHtml(run.runId)}　執行時間：${escapeHtml(run.runAt)}</p>${tableHtml(['序號','識別鍵','原始列','選入來源','測試結果'],run.selected.map((r,i)=>({'序號':i+1,'識別鍵':r.key,'原始列':r.originalRowNumber,'選入來源':r.selectedReason,'測試結果':'＿＿＿＿'})),true)}</section>`;window.print();root.innerHTML=old;render()}
