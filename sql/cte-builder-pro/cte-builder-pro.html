<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTE Builder Pro｜CTE 組裝工作台</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--panel2:#f8f9fb;--bd:#d9dde3;--tx:#1f2430;--mut:#6b7385;--pri:#0f6cbd;--pri2:#0b5394;--priTx:#fff;--ok:#1a7f4b;--warn:#b26a00;--err:#c4262e;--info:#546e8a;--sel:#e3f0fb;--code:#fbfcfd;--kw:#0b5cad;--str:#a31515;--cm:#6a8a4a;--par:#b5179e;--num:#1b7f79;--ph:#c2410c;--shadow:0 6px 24px rgba(0,0,0,.18)}
[data-theme=dark]{--bg:#16181d;--panel:#1e2128;--panel2:#252931;--bd:#363b46;--tx:#e6e8ee;--mut:#9aa3b5;--pri:#4aa3f0;--pri2:#2b86d6;--priTx:#0b1220;--ok:#4cc38a;--warn:#e0a03a;--err:#ff6b73;--info:#8aa4c0;--sel:#26384d;--code:#1a1d23;--kw:#6cb6ff;--str:#ff9a8b;--cm:#8fbf7a;--par:#f08be0;--num:#5fd0c8;--ph:#ffb067;--shadow:0 6px 24px rgba(0,0,0,.6)}

html,body{height:100%;margin:0}
body{font:13px/1.45 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel2);border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--priTx)}button.pri:hover{background:var(--pri2)}
button.danger{color:var(--err)}button.sm{padding:1px 7px;font-size:12px}button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}

.tabs{display:flex;gap:2px}.tabs button{border-radius:6px 6px 0 0;border-bottom-color:transparent}.tabs button.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}

#bottom .bh{display:flex;gap:4px;padding:3px 8px;background:var(--panel2);border-bottom:1px solid var(--bd);align-items:center}
#bottom .bb{flex:1;overflow:auto;padding:8px;min-height:0}
.list-item{padding:6px 10px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.list-item:hover{background:var(--panel2)}.list-item.on{background:var(--sel)}
.list-item .t{font-weight:600;word-break:break-all}.list-item .s{color:var(--mut);font-size:11px}

.badge.q{color:var(--kw)}.badge.v{color:var(--ok)}.badge.r{color:var(--par)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;margin-top:5px;background:transparent}
.dot.E{background:var(--err)}.dot.W{background:var(--warn)}.dot.I{background:var(--info)}

.cte-item:hover{background:var(--panel2)}.cte-item.on{background:var(--sel);outline:1px solid var(--pri);outline-offset:-1px}.cte-item.off .nm{text-decoration:line-through;color:var(--mut)}
.cte-item.drop{box-shadow:inset 0 3px 0 var(--pri)}.cte-item .nm{font-weight:600;flex:1;word-break:break-all}.cte-item .grab{cursor:grab;color:var(--mut)}
#center{display:grid;grid-template-rows:auto auto minmax(0,1fr)}
#cteList{overflow:auto;max-height:30vh;border-bottom:1px solid var(--bd)}
#editor{overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.frm{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.frm label{color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row.grow>*{flex:1}
.sqled{position:relative;flex:1;min-height:180px;border:1px solid var(--bd);border-radius:6px;background:var(--code);overflow:hidden}

.sqled pre{overflow:hidden;pointer-events:none;color:var(--tx)}
.sqled textarea{background:transparent;color:transparent;caret-color:var(--tx);resize:none;overflow:auto;outline:none}
.sqled textarea::selection{background:rgba(15,108,189,.28);color:transparent}
.tk-kw{color:var(--kw);font-weight:600}.tk-str{color:var(--str)}.tk-cm{color:var(--cm);font-style:italic}.tk-par{color:var(--par)}.tk-num{color:var(--num)}.tk-ph{color:var(--ph);font-weight:600}
#preview{font:12.5px/1.5 Consolas,"Cascadia Mono","Courier New",monospace;white-space:pre;margin:0;padding:8px 10px;background:var(--code);min-height:100%;overflow:visible}
.msg{padding:3px 8px;border-radius:5px;margin:2px 0;display:flex;gap:6px;cursor:pointer}.msg:hover{background:var(--panel2)}
.msg.E{color:var(--err)}.msg.W{color:var(--warn)}.msg.I{color:var(--info)}.msg b{font-weight:700;width:14px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);background:var(--panel2);border-radius:12px;padding:0 8px;margin:2px}.chip.rm{text-decoration:line-through;opacity:.6}.chip.man{border-color:var(--pri)}
.muted{color:var(--mut)}.small{font-size:11.5px}
.grid{display:flex;flex-direction:column;gap:6px;min-height:0}
.gvp{height:330px;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:var(--panel);position:relative}
.ghead{position:sticky;top:0;z-index:2;display:grid;background:var(--panel2);border-bottom:1px solid var(--bd);width:max-content;min-width:100%}

.gsp{position:relative;width:max-content;min-width:100%}.gin{position:absolute;left:0;right:0;top:0}
.gr{display:grid;height:28px;border-bottom:1px solid var(--bd);width:max-content;min-width:100%}.gr.sel{background:var(--sel)}.gr.bad .grn{color:var(--err);font-weight:700}
.grn{padding:4px 6px;color:var(--mut);border-right:1px solid var(--bd);cursor:pointer;text-align:right;font-size:11.5px;user-select:none}
.gc{border:0;border-right:1px solid var(--bd);border-radius:0;background:transparent;padding:0 6px;height:27px;width:100%;font-size:12.5px}.gc:focus{background:var(--panel);outline:2px solid var(--pri);outline-offset:-2px}
table.t{border-collapse:collapse;width:100%}table.t th,table.t td{border:1px solid var(--bd);padding:3px 6px;text-align:left}table.t th{background:var(--panel2)}
table.t input[type=text],table.t input[type=number],table.t select{width:100%}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}

.modal>h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--bd);font-size:15px}.modal>.mb{padding:12px 14px;overflow:auto;min-height:0}.modal>.mf{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}

.menu{position:absolute;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shadow);z-index:90;min-width:190px;padding:4px}
.menu div{padding:5px 10px;border-radius:5px;cursor:pointer}.menu div:hover{background:var(--sel)}.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.diff{font:12px/1.45 Consolas,monospace;white-space:pre-wrap}.diff .a{background:rgba(26,127,75,.18)}.diff .d{background:rgba(196,38,46,.18)}
svg text{font:12px "Segoe UI","Microsoft JhengHei",sans-serif;fill:var(--tx)}
.nodeb{fill:var(--panel2);stroke:var(--bd)}.node{cursor:pointer}.node:hover .nodeb{stroke:var(--pri)}.node.sel .nodeb{stroke:var(--pri);stroke-width:2}.node.cyc .nodeb{stroke:var(--err);stroke-width:2}
.edge{fill:none;stroke:var(--mut);stroke-width:1.3}.edge.cyc{stroke:var(--err)}
#paneNav{display:none}
@media (max-width:1000px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:46px 36px minmax(0,1fr) auto}#top,#bottom{grid-column:1}
 #paneNav{display:flex;gap:4px;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--bd)}#paneNav button.on{background:var(--pri);color:var(--priTx)}
 #left,#center,#right{display:none}body[data-pane=left] #left,body[data-pane=center] #center,body[data-pane=right] #right{display:flex}body[data-pane=center] #center{display:grid}
 #bottom{height:200px}#pname{width:140px}#status{display:none}
}
</style>

<body data-pane="center">
<div id="app">
  <div id="top"></div>

<script>
/* ================= CORE：純邏輯（可在 Node 測試） ================= */
const APP_NAME = 'CTE Builder Pro';
const APP_VER = '1.0.1';
const CHUNK = 1000, MAX_ROWS = 100000, MAX_COLS = 20, DB_NAME = 'cte_builder_pro', DB_VER = 2, SCHEMA_VER = 2, LIB_HIST = 5;
const NAME_RE = /^[A-Za-z][A-Za-z0-9_]{0,29}$/;
const RESERVED = new Set('ACCESS ADD ALL ALTER AND ANY AS ASC AUDIT BETWEEN BY CHAR CHECK CLUSTER COLUMN COMMENT COMPRESS CONNECT CREATE CURRENT DATE DECIMAL DEFAULT DELETE DESC DISTINCT DROP ELSE EXCLUSIVE EXISTS FILE FLOAT FOR FROM GRANT GROUP HAVING IDENTIFIED IMMEDIATE IN INCREMENT INDEX INITIAL INSERT INTEGER INTERSECT INTO IS LEVEL LIKE LOCK LONG MAXEXTENTS MINUS MLSLABEL MODE MODIFY NOAUDIT NOCOMPRESS NOT NOWAIT NULL NUMBER OF OFFLINE ON ONLINE OPTION OR ORDER PCTFREE PRIOR PRIVILEGES PUBLIC RAW RENAME RESOURCE REVOKE ROW ROWID ROWNUM ROWS SELECT SESSION SET SHARE SIZE SMALLINT START SUCCESSFUL SYNONYM SYSDATE TABLE THEN TO TRIGGER UID UNION UNIQUE UPDATE USER VALIDATE VALUES VARCHAR VARCHAR2 VIEW WHENEVER WHERE WITH'.split(' '));
const KEYWORDS = new Set('SELECT FROM WHERE AND OR NOT IN JOIN LEFT RIGHT INNER OUTER FULL CROSS ON AS GROUP BY ORDER HAVING UNION ALL MINUS INTERSECT DISTINCT CASE WHEN THEN ELSE END NULL IS LIKE BETWEEN EXISTS WITH USING CONNECT START PRIOR ASC DESC OVER PARTITION'.split(' '));
const FROM_STOP = new Set('WHERE GROUP ORDER HAVING CONNECT START UNION MINUS INTERSECT FETCH OFFSET MODEL JOIN LEFT RIGHT INNER FULL CROSS NATURAL ON USING PIVOT UNPIVOT SAMPLE PARTITION SELECT FROM WINDOW'.split(' '));

const DEFAULT_SETTINGS = {
  theme: 'auto', targetDbVersion: '19c', unionAllMax: 1000, unionAllWarn: 5000, sqlSizeWarnMB: 10,
  autoSnapMin: 10, maxVersions: 50, maxListSnaps: 5, prefer23aiValues: false, headerComment: true, jsonErrorOnError: true
};
const DEFAULT_OUTPUT = { keywordCase: 'upper', indent: 2, semicolon: true, paramMode: 'bind', defineOff: false };
const DEFAULT_INLINE = { clobPieceBytes: 3000, unionBlockSize: 1000, dateFormat: 'YYYY-MM-DD' };
const DEFAULT_TEMP = { name: '', gtt: true, batchSize: 500, commitEvery: 20, indexCol: '', dropFirst: false };

const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/'/g, "''");
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const tick = () => new Promise(r => setTimeout(r, 0));
const pad = (n, w = 2) => String(n).padStart(w, '0');
const nowStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtNum = n => Number(n).toLocaleString('en-US');
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
const clone = o => JSON.parse(JSON.stringify(o));

function u8(s) { let b = 0; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); if (c < 0x80) b++; else if (c < 0x800) b += 2; else if (c >= 0xD800 && c < 0xDC00) { b += 4; i++; } else b += 3; } return b; }

function hashRows(rows) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (const r of rows) {
    for (let c = 0; c < r.length; c++) {
      const s = r[c] == null ? '' : String(r[c]);
      for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
      h1 = Math.imul(h1 ^ 31, 2654435761); h2 = Math.imul(h2 ^ 31, 1597334677);
    }
    h1 = Math.imul(h1 ^ 10, 2654435761); h2 = Math.imul(h2 ^ 10, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return rows.length.toString(36) + '-' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function hashStr(s) { return hashRows([[s]]); }

/* ---------- SQL 掃描：遮蔽字串與註解，檢查括號/引號 ---------- */
function scan(sql) {
  const n = sql.length, out = []; let i = 0, line = 0, depth = 0, error = null; const strLines = new Set();
  const blank = seg => seg.replace(/[^\n]/g, ' ');
  while (i < n) {
    const c = sql[i], d = sql[i + 1];
    if (c === '\n') { line++; out.push(c); i++; continue; }
    if (c === '-' && d === '-') { let j = sql.indexOf('\n', i); if (j < 0) j = n; out.push(' '.repeat(j - i)); i = j; continue; }
    if (c === '/' && d === '*') {
      const j = sql.indexOf('*/', i + 2); const end = j < 0 ? n : j + 2;
      if (j < 0 && !error) error = { pos: i, msg: '區塊註解未結束' };
      const seg = sql.slice(i, end); out.push(blank(seg)); line += (seg.match(/\n/g) || []).length; i = end; continue;
    }
    let end = -1;
    if ((c === 'q' || c === 'Q') && d === "'" && i + 2 < n && !(i > 0 && /[\w$#]/.test(sql[i - 1]))) {
      const o = sql[i + 2], cl = { '[': ']', '{': '}', '(': ')', '<': '>' }[o] || o; const j = sql.indexOf(cl + "'", i + 3);
      end = j < 0 ? n : j + 2; if (j < 0 && !error) error = { pos: i, msg: 'q 引號字串未結束' };
    } else if (c === "'") {
      let j = i + 1;
      for (; ;) {
        if (j >= n) { if (!error) error = { pos: i, msg: '字串單引號未結束' }; break; }
        if (sql[j] === "'") { if (sql[j + 1] === "'") { j += 2; continue; } j++; break; }
        j++;
      }
      end = Math.min(j, n);
    } else if (c === '"') {
      const j = sql.indexOf('"', i + 1); end = j < 0 ? n : j + 1; if (j < 0 && !error) error = { pos: i, msg: '雙引號識別字未結束' };
    }
    if (end >= 0) {
      const seg = sql.slice(i, end), nl = (seg.match(/\n/g) || []).length;
      if (c !== '"') for (let k = 1; k <= nl; k++) strLines.add(line + k);
      out.push(blank(seg)); line += nl; i = end; continue;
    }
    if (c === '(') depth++;
    else if (c === ')') { depth--; if (depth < 0) { if (!error) error = { pos: i, msg: '多餘的右括號 )' }; depth = 0; } }
    out.push(c); i++;
  }
  if (depth > 0 && !error) error = { pos: n, msg: `有 ${depth} 個左括號未閉合` };
  return { masked: out.join(''), strLines, error };
}
function replaceInCode(sql, re, fn) {
  const { masked } = scan(sql); let out = '', last = 0, m; re.lastIndex = 0;
  while ((m = re.exec(masked))) { out += sql.slice(last, m.index) + fn(m); last = m.index + m[0].length; if (m[0].length === 0) re.lastIndex++; }
  return out + sql.slice(last);
}
function upperKeywords(sql) {
  const { masked } = scan(sql); const re = /\b[A-Za-z_]+\b/g; let out = '', last = 0, m;
  while ((m = re.exec(masked))) { if (KEYWORDS.has(m[0].toUpperCase()) && sql[m.index - 1] !== '.') { out += sql.slice(last, m.index) + m[0].toUpperCase(); last = m.index + m[0].length; } }
  return out + sql.slice(last);
}
/* 去掉結尾的分號與 SQL*Plus 的單獨一行 "/" 結束符 */
function stripTrailingSemi(sql) { return sql.replace(/\s+$/, '').replace(/\n[ \t]*\/$/, '').replace(/[\s;]+$/, ''); }
function reindent(sql, ind) {
  sql = sql.replace(/\r\n?/g, '\n'); const { strLines } = scan(sql); let lines = sql.split('\n'); const inStr = i => strLines.has(i);
  let a = 0, b = lines.length; while (a < b && lines[a].trim() === '' && !inStr(a)) a++; while (b > a && lines[b - 1].trim() === '' && !inStr(b - 1)) b--;
  const seg = []; let min = Infinity;
  for (let i = a; i < b; i++) {
    let l = lines[i]; const s = inStr(i);
    if (!s) { l = l.replace(/^\t+/, m => '  '.repeat(m.length)).replace(/\s+$/, ''); if (l.trim() !== '') min = Math.min(min, l.match(/^ */)[0].length); }
    seg.push({ l, s });
  }
  if (min === Infinity) min = 0;
  return seg.map(x => x.s ? x.l : (x.l.trim() === '' ? '' : ind + x.l.slice(min))).join('\n');
}

/* ---------- 相依偵測 ---------- */
function fromRefs(m, start) {
  const out = [], n = m.length; let i = start; const ws = () => { while (i < n && /\s/.test(m[i])) i++; };
  const skipParen = () => { let d = 0; for (; i < n; i++) { if (m[i] === '(') d++; else if (m[i] === ')') { d--; if (d === 0) { i++; break; } } } };
  for (; ;) {
    ws();
    if (m[i] === '(') skipParen();
    else {
      const r = /^([A-Za-z_][\w$#]*)(\s*\.\s*[A-Za-z_][\w$#]*)*/.exec(m.slice(i, i + 200));
      if (!r) return out;
      i += r[0].length; const qualified = r[0].includes('.'); ws();
      if (m[i] === '(') skipParen(); else if (!qualified) out.push(r[1]);
    }
    ws();
    let w = /^[A-Za-z_][\w$#]*/.exec(m.slice(i, i + 130));
    if (w && w[0].toUpperCase() === 'AS') { i += 2; ws(); w = /^[A-Za-z_][\w$#]*/.exec(m.slice(i, i + 130)); }
    if (w && !FROM_STOP.has(w[0].toUpperCase())) { i += w[0].length; ws(); }
    if (m[i] === ',') { i++; continue; }
    return out;
  }
}
/* FROM 是否位於 EXTRACT( / TRIM( 之內（那不是資料表來源） */
function insideFnParen(m, pos) {
  let d = 0;
  for (let i = pos - 1; i >= 0; i--) {
    const ch = m[i];
    if (ch === ')') d++;
    else if (ch === '(') { if (d === 0) { const w = /([A-Za-z_][\w$#]*)\s*$/.exec(m.slice(Math.max(0, i - 40), i)); return !!w && /^(EXTRACT|TRIM)$/i.test(w[1]); } d--; }
  }
  return false;
}
function findDeps(sql, nameKeys) {
  const { masked } = scan(sql); const res = new Set(), re = /\b(FROM|JOIN)\b/gi; let m;
  while ((m = re.exec(masked))) {
    if (m[1].toUpperCase() === 'FROM' && insideFnParen(masked, m.index)) continue;
    for (const id of fromRefs(masked, m.index + m[0].length)) { const k = id.toLowerCase(); if (nameKeys.has(k)) res.add(k); }
  }
  return res;
}
function findCycle(items) {

    if (!(await S.db.has('listChunks', chunkId(sid, 0))) && ls.rows.length) { const ops = []; for (let k = 0; k * CHUNK < ls.rows.length; k++) ops.push({ s: 'listChunks', put: { id: chunkId(sid, k), cteId: sid, chunkNo: k, rows: ls.rows.slice(k * CHUNK, (k + 1) * CHUNK) } }); await S.db.batch(ops); }

  const others = all.filter(v => v.projectId !== S.project.id); const ops = [], cand = new Set();
  const gone = mine.slice(st.maxVersions), vs = mine.slice(0, st.maxVersions);
