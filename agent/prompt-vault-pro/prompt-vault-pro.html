<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Prompt Vault Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<style>
:root{
  --bg:#f5f6fa;--panel:#fff;--panel2:#f0f2f7;--text:#1d2330;--muted:#6b7385;--border:#dfe3ec;
  --accent:#5b5bd6;--accent2:#8b5cf6;--accent-soft:rgba(91,91,214,.10);--ring:rgba(91,91,214,.25);
  --ok:#2f9e6b;--danger:#d64545;--warn:#c9821b;--star:#f5b301;
  --shadow:0 4px 18px rgba(20,30,60,.08);--radius:10px;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",Menlo,monospace;
}
[data-theme=dark]{
  --bg:#0f1117;--panel:#171a23;--panel2:#1f2330;--text:#e6e8ef;--muted:#8a91a5;--border:#2a2f3d;
  --accent:#8b84ff;--accent2:#b18cff;--accent-soft:rgba(139,132,255,.14);--ring:rgba(139,132,255,.3);
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.pad{padding:4px 10px}
em{color:var(--danger);font-style:normal}
/* top bar */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:6px;user-select:none}
.logo .pro{font-size:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:2px 7px;border-radius:6px;font-weight:700}
.search{flex:1;max-width:560px;margin:0 auto}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.btn{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,.card:focus-visible,.tag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger:hover,.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:none;background:transparent;font-size:18px;cursor:pointer;padding:6px 8px;border-radius:8px;line-height:1}
.icon-btn:hover{background:var(--panel2)}
.banner{flex:none;background:#fff3cd;color:#7a5600;padding:8px 14px;border-bottom:1px solid #f0d78c;font-size:13px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
[data-theme=dark] .banner{background:#3a2f12;color:#f3d48a;border-color:#5a4a1c}
/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:230px 380px 1fr}
.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:14px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;border:none;background:none;width:100%;text-align:left;min-height:34px}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.nav-item .edit{opacity:0}
.nav-item:hover .edit,.nav-item .edit:focus{opacity:1}
.side-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 10px 4px;letter-spacing:.05em}
.mini{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
.mini:hover{background:var(--panel2);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag small{color:var(--muted);font-size:10px}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.active small{color:rgba(255,255,255,.8)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 10px 2px;border-top:1px solid var(--border);line-height:1.6}
.scrim{display:none}
.side-head .grp{display:flex;gap:2px}
.tm-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.tm-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--border);border-radius:8px}
.tm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* list */
.listpane{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;min-height:0}
.list-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.list-title{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:6px 8px;cursor:pointer}
.active-filters{display:flex;flex-wrap:wrap;gap:6px}
.active-filters:not(:empty){padding:8px 12px;border-bottom:1px solid var(--border)}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border:none;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.batchbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--border)}
.batchbar #batchCount{font-weight:600;margin-right:4px}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .12s,box-shadow .12s;flex:none}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.card.checked{background:var(--accent-soft)}
.card .thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:var(--panel2)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card-top{display:flex;align-items:center;gap:6px}
.card-title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-snippet{color:var(--muted);font-size:12px;line-height:1.5;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--mono)}
.card-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.card-foot .tags{display:flex;gap:4px;overflow:hidden;flex:1;min-width:0}
.chip{padding:1px 7px;border-radius:999px;background:var(--panel2);font-size:11px;white-space:nowrap;border:1px solid var(--border)}
.star-btn{border:none;background:none;cursor:pointer;font-size:16px;color:var(--muted);padding:0 2px;line-height:1}
.star-btn.on,.icon-btn.star.on{color:var(--star)}
.copy-btn{border:1px solid var(--border);background:var(--panel2);border-radius:6px;cursor:pointer;padding:2px 7px;font-size:12px}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.chk{width:16px;height:16px;margin:3px 0 0;accent-color:var(--accent);flex:none;pointer-events:none}
.empty{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center;padding:24px}
.empty .big{font-size:44px}
.more{align-self:center;margin:6px 0 12px}
/* editor */
.editorpane{overflow:auto;background:var(--panel);min-width:0;min-height:0;display:flex;flex-direction:column}
.editor{width:100%;max-width:920px;margin:0 auto;padding:16px 22px 0;display:flex;flex-direction:column;gap:14px}
.ed-head{display:flex;gap:6px;align-items:center}
.title-input{flex:1;min-width:0;font-size:20px;font-weight:700;border:none;border-bottom:2px solid transparent;background:none;padding:6px 2px;outline:none}
.title-input:focus{border-bottom-color:var(--accent)}
.ed-meta{font-size:12px;color:var(--muted);margin-top:-8px}
.field{display:flex;flex-direction:column;gap:6px}
.field-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field-head label,.lbl{font-weight:600;font-size:13px}
.counter{margin-left:auto;font-size:12px;color:var(--muted)}
textarea,.inp{width:100%;border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:9px 11px;outline:none}
textarea{resize:vertical;font-family:var(--mono);line-height:1.6;font-size:13px}
textarea:focus,.inp:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);transition:opacity .15s}
.mini-field.dim{opacity:.45}
.mini-field .inp{color:var(--text);font-size:13px;padding:7px 9px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:6px 8px;min-height:40px;cursor:text}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.tagbox input{border:none;background:none;outline:none;flex:1;min-width:140px;padding:3px}
.tagchip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 3px 2px 10px;font-size:12px}
.tagchip button{border:none;background:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 4px;border-radius:50%}
.tagchip button:hover{background:var(--ring)}
details.params>summary{cursor:pointer;font-weight:600;font-size:13px;margin-bottom:10px;user-select:none}
.imgbox{border:2px dashed var(--border);border-radius:10px;min-height:110px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:8px;outline:none}
.imgbox:focus-visible{border-color:var(--accent)}
.imgbox.drag{border-color:var(--accent);background:var(--accent-soft)}
.imgbox img{max-width:100%;max-height:300px;display:block;border-radius:6px}
.imgbox .rm{position:absolute;top:8px;right:8px}
.composer{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px;margin-top:-6px}
.comp-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.snip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:4px 2px 4px 10px;cursor:grab;font-size:12.5px;user-select:none}
.snip:hover{border-color:var(--accent);color:var(--accent)}
.snip .x{border:none;background:none;cursor:pointer;color:var(--muted);opacity:0;padding:0 5px;font-size:13px}
.snip:hover .x,.snip .x:focus{opacity:1}
.hint{font-size:11.5px;color:var(--muted)}
.ed-actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;z-index:2}
.copy-group{display:flex}
.copy-group .btn{border-radius:8px 0 0 8px}
.copy-group select{border-radius:0 8px 8px 0;border-left:none}
.dirty{color:var(--warn);font-size:12px;font-weight:600;margin-left:auto}
/* toast */
.toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:1000;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:#1f2330;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font-size:13px;animation:tin .2s;max-width:90vw}
.toast.ok{background:#1e6b4a}.toast.err{background:var(--danger)}
.toast button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;align-items:center;justify-content:center;z-index:900;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:470px;max-height:90vh;display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal-h{padding:14px 18px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px;line-height:1.6}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.err-box{background:rgba(214,69,69,.1);color:var(--danger);border-radius:8px;padding:10px 12px;word-break:break-word}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io-card{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;background:var(--panel2);text-align:left}
.io-card:hover{border-color:var(--accent)}
.io-card b{display:block;font-size:15px;margin-bottom:4px}
.vwrap{display:grid;grid-template-columns:260px 1fr;gap:14px;min-height:300px}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.vitem{border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.vitem.active{border-color:var(--accent);background:var(--accent-soft)}
.vbtns{display:flex;gap:6px}
.diff{border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow:auto;max-height:60vh}
.diff h4{margin:10px 0 4px;font-size:13px}.diff h4:first-child{margin-top:0}
.tok{display:inline-block;padding:1px 7px;border-radius:5px;margin:2px;font-family:var(--mono);font-size:12px;background:var(--panel2);text-decoration:none}
ins.tok{background:rgba(47,158,107,.18);color:var(--ok)}
del.tok{background:rgba(214,69,69,.15);color:var(--danger)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2)}
.only-mobile{display:none!important}
@media (max-width:900px){
  .only-mobile{display:inline-flex!important}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;top:56px;left:0;bottom:0;width:270px;z-index:600;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.drawer .sidebar{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:550}
  .listpane{border-right:none}
  .editorpane{position:fixed;inset:0;z-index:700;display:none}
  body.editing .editorpane{display:flex}
  .editor{padding:10px 14px 0}
  .grid4{grid-template-columns:1fr 1fr}
  .btn-label,.logo b{display:none}
  .vwrap{grid-template-columns:1fr}
}
@media (max-width:560px){.grid2,.io-grid{grid-template-columns:1fr}.topbar{gap:6px;padding:0 8px}}
</style>
</head>
<body>
<header class="topbar">
  <button id="btnMenu" class="icon-btn only-mobile" aria-label="開啟選單">☰</button>
  <div class="logo" title="Prompt Vault Pro v1.1">🔐 <b>Prompt Vault</b> <span class="pro">PRO</span></div>
  <div class="search"><input id="q" type="search" placeholder="搜尋標題、Prompt、標籤、備註…（Ctrl+K）" aria-label="搜尋 Prompt"></div>
  <button id="btnNew" class="btn primary" aria-label="新增 Prompt">＋<span class="btn-label"> 新增</span></button>
  <button id="btnIO" class="btn" aria-label="匯入或匯出">⇅<span class="btn-label"> 匯入/匯出</span></button>
  <button id="btnHelp" class="icon-btn" aria-label="快捷鍵說明">⌨️</button>
  <button id="btnTheme" class="icon-btn" aria-label="切換深淺色主題">🌙</button>
</header>
<div id="banner" class="banner hidden" role="alert"><span id="bannerText"></span><button class="mini" id="bannerClose" aria-label="關閉提示">✕</button></div>
<main class="layout">
  <aside id="sidebar" class="sidebar" aria-label="導覽">
    <nav id="navViews"></nav>
    <div>
      <div class="side-head">分類 <button id="btnAddCat" class="mini" aria-label="新增分類">＋ 新增</button></div>
      <div id="navCats"></div>
    </div>
    <div>
      <div class="side-head">標籤 <span class="grp"><button id="btnManageTags" class="mini" aria-label="管理標籤">管理</button><button id="btnClearTags" class="mini" aria-label="清除標籤篩選">清除</button></span></div>
      <div id="tagCloud" class="tag-cloud"></div>
    </div>
    <div class="side-foot" id="storageInfo">—</div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <section class="listpane" aria-label="Prompt 列表">
    <div class="list-toolbar">
      <div id="listTitle" class="list-title">全部</div>
      <select id="sortSel" aria-label="排序方式">
        <option value="updated">最近更新</option>
        <option value="created">建立時間</option>
        <option value="use">使用次數</option>
        <option value="name">名稱</option>
      </select>
      <button id="btnSelect" class="btn sm" aria-pressed="false">多選</button>
    </div>
    <div id="activeFilters" class="active-filters"></div>
    <div id="batchBar" class="batchbar hidden">
      <span id="batchCount">已選 0</span>
      <button class="btn sm" data-batch="all">全選</button>
      <button class="btn sm" data-batch="fav">⭐ 收藏</button>
      <button class="btn sm" data-batch="unfav">取消收藏</button>
      <button class="btn sm" data-batch="cat">改分類</button>
      <button class="btn sm" data-batch="tag">加標籤</button>
      <button class="btn sm danger" data-batch="del">刪除</button>
    </div>
    <div id="list" class="list" role="list"></div>
  </section>
  <section id="editorPane" class="editorpane" aria-label="編輯區">
    <div id="emptyEditor" class="empty">
      <div class="big">✨</div>
      <div>選擇左側的 Prompt，或建立一筆新的</div>
      <button class="btn primary" id="btnNew2">＋ 新增 Prompt</button>
      <div class="hint"><kbd>Ctrl</kbd>+<kbd>K</kbd> 搜尋　<kbd>Alt</kbd>+<kbd>N</kbd> 新增　<kbd>Ctrl</kbd>+<kbd>S</kbd> 儲存</div>
    </div>
    <form id="editor" class="editor hidden" autocomplete="off" novalidate>
      <div class="ed-head">
        <button type="button" id="edBack" class="icon-btn only-mobile" aria-label="返回列表">←</button>
        <input id="fTitle" class="title-input" maxlength="100" placeholder="Prompt 標題（必填）" aria-label="標題">
        <button type="button" id="fFav" class="icon-btn star" aria-label="收藏" aria-pressed="false">☆</button>
      </div>
      <div class="ed-meta" id="edMeta"></div>

      <div class="field">
        <div class="field-head">
          <label for="fPrompt">正面 Prompt <em>*</em></label>
          <button type="button" class="btn sm" id="btnComposer" aria-expanded="false">🧩 組合器</button>
          <span class="counter" id="cPrompt"></span>
        </div>
        <textarea id="fPrompt" rows="7" spellcheck="false" placeholder="masterpiece, best quality, ..."></textarea>

/* ---------- 工具函式 ---------- */

/* ---------- 設定（僅 UI 設定放 localStorage） ---------- */
const Settings = {

/* ---------- IndexedDB 封裝 ---------- */
const DB = {
  name: 'PromptVaultPro', version: 1, db: null, fresh: false,
  STORES: ['prompts', 'categories', 'tags', 'history', 'versions', 'snippets', 'images'],
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) return reject(new Error('此瀏覽器不支援 IndexedDB'));
      let req; try { req = indexedDB.open(this.name, this.version); } catch (e) { return reject(e); }
      req.onupgradeneeded = e => {
        const d = req.result; this.fresh = e.oldVersion === 0;

          const s = d.createObjectStore('prompts', { keyPath: 'id' });

          s.createIndex('tags', 'tags', { multiEntry: true });
        }

          const s = d.createObjectStore('categories', { keyPath: 'id' });
          s.createIndex('name', 'name', { unique: true }); s.createIndex('order', 'order');
        }
        if (!d.objectStoreNames.contains('tags')) d.createObjectStore('tags', { keyPath: 'name' });
        for (const n of ['history', 'versions']) if (!d.objectStoreNames.contains(n)) {
          const s = d.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
          s.createIndex('promptId', 'promptId'); s.createIndex('at', 'at');
        }
        if (!d.objectStoreNames.contains('snippets')) d.createObjectStore('snippets', { keyPath: 'id' }).createIndex('group', 'group');
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'promptId' });
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { this.db.close(); UI.banner('資料庫已在其他分頁升級，請重新整理此頁面。'); };
        resolve(this.db);
      };
      req.onerror = () => reject(req.error || new Error('開啟資料庫失敗'));
      req.onblocked = () => UI.banner('資料庫被其他分頁占用，請關閉其他 Prompt Vault Pro 分頁後重新整理。');
    });
  },
  /** 執行交易；fn 內同步發出請求，交易 complete 才 resolve。 */
  tx(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      let t; try { t = this.db.transaction(stores, mode); } catch (e) { return reject(e); }
      let out; t.oncomplete = () => resolve(out);
      t.onabort = () => reject(t.error || new Error('交易已中止'));
      try { out = fn(t); } catch (e) { try { t.abort(); } catch { /* */ } reject(e); }

  delete(store, key) { return this.tx([store], 'readwrite', t => { t.objectStore(store).delete(key); }); },

  },

/* ---------- 狀態 ---------- */
const S = {
  prompts: [], cats: [], tags: new Map(), snippets: [], images: new Map(), imgUrls: new Map(), hay: new Map(),
  view: { type: 'all', id: null }, tagFilters: [], query: '', sort: 'updated', selectedId: null,

/* ---------- 跨分頁同步 ---------- */
const Sync = {

  ping() { try { this.ch && this.ch.postMessage({ t: now() }); } catch { /* */ } },
  init() {

        else if (!Editor.dirty && p.updatedAt !== Editor.cur.updatedAt) Editor.open(p);

/* ---------- Repository ---------- */
const Repo = {
  async loadAll() {
    const [p, c, t, s, i] = await Promise.all(['prompts', 'categories', 'tags', 'snippets', 'images'].map(n => DB.getAll(n)));
    S.prompts = p.map(normalizePrompt); S.hay.clear(); S.prompts.forEach(x => Search.index(x));
    S.cats = c.sort((a, b) => a.order - b.order);
    S.tags = new Map(t.map(x => [x.name, x.count]));
    S.snippets = s.sort((a, b) => (Number.isFinite(a.order) ? a.order : 1e9) - (Number.isFinite(b.order) ? b.order : 1e9) || String(a.label).localeCompare(String(b.label), 'zh-Hant'));
    S.imgUrls.forEach(u => URL.revokeObjectURL(u)); S.imgUrls.clear();
    S.images = new Map(i.map(x => [x.promptId, x.blob]));
  },
  async seed() {
    const t = now();

    let so = 0; const snippets = DEFAULT_SNIPPETS.flatMap(([group, items]) => items.map(([label, value]) => ({ id: uid(), group, label, value, order: so++ })));
    const samples = SAMPLE_PROMPTS.map((s, i) => normalizePrompt({ ...s, id: uid(), categoryId: cats.find(c => c.name === s.cat)?.id, createdAt: t - i * 60000, updatedAt: t - i * 60000 }));
    const counts = new Map(); samples.forEach(p => p.tags.forEach(x => counts.set(x, (counts.get(x) || 0) + 1)));

      cats.forEach(c => tx.objectStore('categories').put(c));
      snippets.forEach(s => tx.objectStore('snippets').put(s));
      samples.forEach(p => {

      tx.objectStore('history').add({ promptId: p.id, action: old ? 'update' : 'create', at: p.updatedAt });
      tx.objectStore('versions').add({ promptId: p.id, snapshot: p, at: p.updatedAt });
      if (image === null) tx.objectStore('images').delete(p.id);

  async patch(id, fn, action) {

  async batchUpdate(ids, fn) {

  async deleteMany(ids) {

    await DB.tx(['prompts', 'tags', 'images'], 'readwrite', tx => {

    await DB.tx(['prompts', 'tags', 'images'], 'readwrite', tx => {

  },
  purgeAux(ids) { return DB.tx(['history', 'versions'], 'readwrite', tx => ids.forEach(id => { DB.purgeIn(tx, 'history', id); DB.purgeIn(tx, 'versions', id); })); },
  async saveCat(c) {

    await DB.put('categories', c);

    await DB.tx(['categories', 'prompts'], 'readwrite', tx => { tx.objectStore('categories').delete(id); affected.forEach(p => tx.objectStore('prompts').put(p)); });
    S.cats = S.cats.filter(c => c.id !== id); affected.forEach(replaceInState); Sync.ping();

  },
  async moveCat(id, dir) {

    const arr = [...S.cats];[arr[i], arr[j]] = [arr[j], arr[i]]; arr.forEach((c, k) => { c.order = k; });

  },
  nextCatOrder() { return S.cats.reduce((m, c) => Math.max(m, c.order), -1) + 1; },
  async pruneVersions(id, keep = MAX_VERSIONS) {
    const vs = await DB.byIndex('versions', 'promptId', id); if (vs.length <= keep) return;

  async maintain() {
    const ids = new Set(S.prompts.map(p => p.id));
    const [vs, hs] = await Promise.all([DB.getAll('versions'), DB.getAll('history')]);
    const delV = [], delH = [], by = new Map();
    for (const v of vs) { if (!ids.has(v.promptId)) delV.push(v.id); else { if (!by.has(v.promptId)) by.set(v.promptId, []); by.get(v.promptId).push(v); } }

  },
  /** 標籤改名（newName 已存在則合併）；newName 為 null 代表刪除標籤 */

  versions(id) { return DB.byIndex('versions', 'promptId', id); },
  history(id) { return DB.byIndex('history', 'promptId', id); },

/* ---------- 搜尋 ---------- */
const Search = {
  index(p) { S.hay.set(p.id, [p.title, p.prompt, p.negative, p.tags.join(' '), p.note].join('\n').toLowerCase()); },
  filter(list, q, { tags = [] } = {}) {
    const terms = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length && !tags.length) return list;
    return list.filter(p => {
      if (tags.length && !tags.every(t => p.tags.includes(t))) return false;
      if (terms.length) { const h = S.hay.get(p.id) || ''; return terms.every(t => h.includes(t)); }
      return true;
    });
  },
};
function getVisible() {
  const v = S.view; let list = S.prompts; let ordered = false;
  const catIds = new Set(S.cats.map(c => c.id));
  if (v.type === 'fav') list = list.filter(p => p.favorite);
  else if (v.type === 'cat') list = list.filter(p => p.categoryId === v.id);
  else if (v.type === 'uncat') list = list.filter(p => !p.categoryId || !catIds.has(p.categoryId));
  else if (v.type === 'recent') { list = list.filter(p => p.lastUsedAt > 0).sort((a, b) => b.lastUsedAt - a.lastUsedAt).slice(0, 100); ordered = true; }
  else if (v.type === 'top') { list = list.filter(p => p.useCount > 0).sort((a, b) => b.useCount - a.useCount || b.lastUsedAt - a.lastUsedAt).slice(0, 100); ordered = true; }
  list = Search.filter(list, S.query, { tags: S.tagFilters });
  if (!ordered) {
    const cmp = {
      updated: (a, b) => b.updatedAt - a.updatedAt, created: (a, b) => b.createdAt - a.createdAt,
      use: (a, b) => b.useCount - a.useCount || b.lastUsedAt - a.lastUsedAt,
      name: (a, b) => a.title.localeCompare(b.title, 'zh-Hant'),
    }[S.sort] || ((a, b) => b.updatedAt - a.updatedAt);
    list = [...list].sort(cmp);
  }
  return { list, ordered };
}

/* ---------- 剪貼簿 ---------- */
const Clip = {
  build(p, mode) {
    const pos = (p.prompt || '').trim(), neg = (p.negative || '').trim(), pr = p.params || {};
    const has = v => v !== '' && v !== null && v !== undefined;
    if (mode === 'both') return neg ? `${pos}\nNegative prompt: ${neg}` : pos;
    if (mode === 'params') {
      if (p.platform === 'mj') {
        const f = [];
        if (has(pr.ar)) f.push(`--ar ${pr.ar}`); if (has(pr.stylize)) f.push(`--stylize ${pr.stylize}`);
        if (has(pr.chaos)) f.push(`--chaos ${pr.chaos}`); if (has(pr.seed)) f.push(`--seed ${pr.seed}`);
        if (neg) f.push(`--no ${splitTokens(neg).join(', ')}`);
        return [pos.replace(/\s*\n\s*/g, ' '), ...f].join(' ');
      }
      const kv = [];
      if (has(pr.steps)) kv.push(`Steps: ${pr.steps}`); if (has(pr.sampler)) kv.push(`Sampler: ${pr.sampler}`);
      if (has(pr.cfg)) kv.push(`CFG scale: ${pr.cfg}`); if (has(pr.seed)) kv.push(`Seed: ${pr.seed}`);
      const size = sizeFromAr(pr.ar); if (size) kv.push(`Size: ${size}`);
      if (has(pr.model)) kv.push(`Model: ${pr.model}`);
      return pos + (neg ? `\nNegative prompt: ${neg}` : '') + (kv.length ? `\n${kv.join(', ')}` : '');
    }
    return pos;
  },
  async write(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* fallback */ }
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch { /* */ } ta.remove(); return ok;
  },
};

/* ---------- 匯入 / 匯出 ---------- */
const IO = {
  async exportJSON() {
    const ids = new Set(S.prompts.map(p => p.id)); const images = [];
    for (const [promptId, blob] of S.images) if (ids.has(promptId)) images.push({ promptId, dataUrl: await blobToDataUrl(blob) });
    const data = {
      app: APP, schema: SCHEMA, exportedAt: now(),
      categories: S.cats, prompts: S.prompts.map(p => ({ ...p, favorite: !!p.favorite })), snippets: S.snippets, images,
    };
    const d = new Date(); const name = `prompt-vault-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

  },
  validate(d) {
    const fail = m => { throw new Error(m); };
    if (!d || typeof d !== 'object' || Array.isArray(d)) fail('檔案內容不是 JSON 物件。');
    if (d.app !== APP) fail('這不是 Prompt Vault Pro 的匯出檔（app 欄位不符）。');
    if (d.schema !== SCHEMA) fail(`不支援的 schema 版本：${String(d.schema)}（目前支援 ${SCHEMA}）。`);
    for (const k of ['prompts', 'categories', 'snippets', 'images']) if (d[k] !== undefined && !Array.isArray(d[k])) fail(`${k} 必須是陣列。`);
    const seen = new Set();
    const prompts = (d.prompts || []).map((p, i) => {
      if (!p || typeof p !== 'object') fail(`prompts[${i}] 格式錯誤。`);
      if (typeof p.id !== 'string' || !p.id) fail(`prompts[${i}] 缺少 id。`);
      if (seen.has(p.id)) fail(`prompts 內 id 重複：${p.id}`); seen.add(p.id);
      if (typeof p.title !== 'string' || !p.title.trim()) fail(`prompts[${i}] 缺少 title。`);
      if (typeof p.prompt !== 'string') fail(`prompts[${i}] 缺少 prompt。`);
      if (p.tags !== undefined && !Array.isArray(p.tags)) fail(`prompts[${i}].tags 必須是陣列。`);
      return normalizePrompt(p);
    });
    const names = new Set();
    const categories = (d.categories || []).map((c, i) => {
      if (!c || typeof c.id !== 'string' || !c.id || typeof c.name !== 'string' || !c.name.trim()) fail(`categories[${i}] 格式錯誤。`);
      const name = c.name.trim().slice(0, 30); if (names.has(name)) fail(`分類名稱重複：${name}`); names.add(name);
      return { id: c.id, name, color: safeColor(c.color), order: Number.isFinite(+c.order) ? +c.order : i };
    });
    const snippets = (d.snippets || []).map((s, i) => {
      if (!s || typeof s.id !== 'string' || typeof s.group !== 'string' || typeof s.label !== 'string' || typeof s.value !== 'string') fail(`snippets[${i}] 格式錯誤。`);
      return { id: s.id, group: s.group.trim() || 'other', label: s.label.slice(0, 40), value: s.value, order: Number.isFinite(+s.order) ? +s.order : i };
    });
    const images = (d.images || []).filter(m => m && typeof m.promptId === 'string' && typeof m.dataUrl === 'string' && m.dataUrl.startsWith('data:image/'));
    return { prompts, categories, snippets, images };
  },
  async importData(v, mode) {
    const blobs = new Map();
    for (const m of v.images) { try { blobs.set(m.promptId, dataUrlToBlob(m.dataUrl)); } catch { /* 略過壞圖 */ } }
    const stats = { added: 0, updated: 0, skipped: 0, cats: 0, snippets: 0 };
    let catsToWrite, promptsToWrite, snippetsToWrite; const finalMap = new Map();
    if (mode === 'overwrite') {
      catsToWrite = v.categories; const ids = new Set(catsToWrite.map(c => c.id));
      promptsToWrite = v.prompts.map(p => ids.has(p.categoryId) ? p : { ...p, categoryId: null });
      snippetsToWrite = v.snippets; stats.added = promptsToWrite.length; stats.cats = catsToWrite.length; stats.snippets = snippetsToWrite.length;
    } else {
      const remap = new Map(); catsToWrite = []; let order = Repo.nextCatOrder();
      const byId = new Map(S.cats.map(c => [c.id, c])), byName = new Map(S.cats.map(c => [c.name, c]));
      for (const c of v.categories) {
        if (byId.has(c.id)) continue;
        if (byName.has(c.name)) { remap.set(c.id, byName.get(c.name).id); continue; }
        const nc = { ...c, order: order++ }; catsToWrite.push(nc); byId.set(nc.id, nc); byName.set(nc.name, nc);
      }
      stats.cats = catsToWrite.length;
      S.prompts.forEach(p => finalMap.set(p.id, p)); promptsToWrite = [];
      for (const p0 of v.prompts) {
        let cid = remap.get(p0.categoryId) || p0.categoryId; if (!byId.has(cid)) cid = null;
        const p = { ...p0, categoryId: cid }; const ex = finalMap.get(p.id);
        if (!ex) { stats.added++; promptsToWrite.push(p); } else if (p.updatedAt > ex.updatedAt) { stats.updated++; promptsToWrite.push(p); } else stats.skipped++;
      }
      const sid = new Set(S.snippets.map(s => s.id));
      snippetsToWrite = v.snippets.filter(s => !sid.has(s.id)); stats.snippets = snippetsToWrite.length;
    }
    promptsToWrite.forEach(p => finalMap.set(p.id, p));
    const counts = new Map(); finalMap.forEach(p => p.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
    const at = now();
    await DB.tx(DB.STORES, 'readwrite', tx => {
      if (mode === 'overwrite') DB.STORES.forEach(n => tx.objectStore(n).clear()); else tx.objectStore('tags').clear();
      catsToWrite.forEach(c => tx.objectStore('categories').put(c));
      promptsToWrite.forEach(p => {
        tx.objectStore('prompts').put(p);
        tx.objectStore('versions').add({ promptId: p.id, snapshot: p, at });
        tx.objectStore('history').add({ promptId: p.id, action: 'import', at });
        if (blobs.has(p.id)) tx.objectStore('images').put({ promptId: p.id, blob: blobs.get(p.id) });
      });
      snippetsToWrite.forEach(s => tx.objectStore('snippets').put(s));
      counts.forEach((count, name) => tx.objectStore('tags').put({ name, count }));
    });
    await Repo.loadAll(); Sync.ping(); return stats;
  },
};

/* ---------- Toast / Modal ---------- */
function toast(msg, { type = '', ms = 2200, action } = {}) {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.setAttribute('role', 'status');
  const sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { el.remove(); action.fn(); }; el.appendChild(b); }
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}
function handleErr(e, prefix = '操作失敗') {
  console.error(e);
  const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
  if (quota) { UI.banner('⚠️ 瀏覽器儲存空間不足，資料未寫入。請立即「匯出 JSON」備份，並刪除不需要的圖片或 Prompt。'); toast('儲存空間不足', { type: 'err', ms: 5000 }); }
  else toast(`${prefix}：${(e && e.message) || e}`, { type: 'err', ms: 4500 });
}
const Modal = {
  stack: [],
  get isOpen() { return this.stack.length > 0; },
  open({ title, body, actions = [{ label: '關閉' }], wide = false }) {
    return new Promise(resolve => {
      const bg = document.createElement('div'); bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><span>${esc(title)}</span><button type="button" class="icon-btn" data-close aria-label="關閉">✕</button></div><div class="modal-b"></div><div class="modal-f"></div></div>`;
      const b = $('.modal-b', bg), f = $('.modal-f', bg);
      if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
      const entry = { bg, resolve, prevFocus: document.activeElement };
      const close = v => this._close(entry, v);
      actions.forEach(a => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn ' + (a.cls || ''); btn.textContent = a.label;
        if (a.primary) btn.dataset.primary = '1';
        btn.onclick = async () => {
          if (a.onClick) { let r; try { r = await a.onClick(); } catch (e) { handleErr(e); return; } if (r === false) return; close(r === undefined ? a.value : r); }
          else close(a.value);
        };
        f.appendChild(btn);
      });
      bg.addEventListener('mousedown', e => { if (e.target === bg) close(undefined); });
      $('[data-close]', bg).onclick = () => close(undefined);
      bg.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !['checkbox', 'color', 'file'].includes(e.target.type) && !e.isComposing) {
          const p = $('[data-primary]', f); if (p) { e.preventDefault(); p.click(); }
        }
      });
      $('#modalRoot').appendChild(bg); this.stack.push(entry);
      setTimeout(() => { const el = bg.querySelector('.modal-b input:not([type=hidden]), .modal-b select, .modal-b textarea') || $('[data-primary]', f) || f.lastElementChild; el && el.focus(); }, 30);
    });
  },
  _close(entry, v) {
    const i = this.stack.indexOf(entry); if (i < 0) return;
    this.stack.splice(i, 1); entry.bg.remove();
    try { entry.prevFocus && entry.prevFocus.focus && entry.prevFocus.focus(); } catch { /* */ }
    entry.resolve(v);
  },
  closeTop() { const e = this.stack[this.stack.length - 1]; if (e) this._close(e, undefined); },
  confirm(msg, { title = '確認', ok = '確定', danger = false } = {}) {
    return this.open({ title, body: `<div>${esc(msg).replace(/\n/g, '<br>')}</div>`, actions: [{ label: '取消', value: false }, { label: ok, cls: danger ? 'danger solid' : 'primary', value: true, primary: true }] }).then(v => v === true);
  },
  input({ title, label, value = '', placeholder = '', ok = '確定' }) {
    const body = document.createElement('div');
    body.innerHTML = `<label class="mini-field">${esc(label)}<input class="inp" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;
    const inp = $('input', body);
    return this.open({ title, body, actions: [{ label: '取消' }, { label: ok, cls: 'primary', primary: true, onClick: () => inp.value }] });
  },
};

/* ---------- UI 渲染 ---------- */
const UI = {

  viewTitle() {

    return { all: '📚 全部', fav: '⭐ 收藏', recent: '🕘 最近使用', top: '🔥 最常使用', uncat: '📭 未分類' }[v.type] || '全部';
  },
  renderSidebar() {
    const catIds = new Set(S.cats.map(c => c.id)); const cnt = { all: S.prompts.length, fav: 0, recent: 0, top: 0, uncat: 0 }; const catCnt = new Map();
    for (const p of S.prompts) {

async function processImage(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error('請選擇圖片檔');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('無法讀取圖片')); i.src = url; });
    if (!img.naturalWidth || !img.naturalHeight) throw new Error('無法取得圖片尺寸（不支援的格式）');
    const max = 768, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h; const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.85));
    if (!blob || blob.type !== 'image/webp') { // 不支援 WebP 編碼（如舊版 Safari）：JPEG 不支援透明，先墊白底
      cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
      blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    }
    if (!blob) throw new Error('圖片轉換失敗');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- 版本比對 ---------- */
function tokenDiff(a, b) {
  const A = splitTokens(a), B = splitTokens(b), sa = new Set(A), sb = new Set(B); const out = [];
  B.forEach(t => out.push(sa.has(t) ? `<span class="tok">${esc(t)}</span>` : `<ins class="tok">+ ${esc(t)}</ins>`));
  A.filter(t => !sb.has(t)).forEach(t => out.push(`<del class="tok">− ${esc(t)}</del>`));
  return out.join('') || '<span class="muted small">（空）</span>';
}
function diffHTML(oldV, cur) {
  const catName = id => (S.cats.find(c => c.id === id) || {}).name || '未分類';
  const paramStr = pr => PARAM_KEYS.filter(k => pr && pr[k] !== '' && pr[k] !== undefined).map(k => `${k}=${pr[k]}`).join(', ');
  const line = (label, a, b) => a === b ? `<h4>${label}</h4><span class="tok">${esc(b) || '—'}</span>` : `<h4>${label}</h4><del class="tok">− ${esc(a) || '—'}</del> <ins class="tok">+ ${esc(b) || '—'}</ins>`;
  return `<div class="hint">綠色 = 目前內容新增；紅色 = 目前內容已移除（相對於所選版本）</div>
    ${line('標題', oldV.title, cur.title)}
    <h4>正面 Prompt</h4>${tokenDiff(oldV.prompt, cur.prompt)}
    <h4>負面 Prompt</h4>${tokenDiff(oldV.negative, cur.negative)}
    <h4>標籤</h4>${tokenDiff((oldV.tags || []).join(','), (cur.tags || []).join(','))}
    ${line('分類', catName(oldV.categoryId), catName(cur.categoryId))}
    ${line('平台', PLATFORMS[oldV.platform] || oldV.platform, PLATFORMS[cur.platform] || cur.platform)}
    ${line('參數', paramStr(oldV.params), paramStr(cur.params))}
    ${line('備註', oldV.note || '', cur.note || '')}`;
}

/* ---------- 路由（hash） ---------- */
const Router = {
  last: '', noGuard: false,
  parse() {
    const h = location.hash.replace(/^#\/?/, ''); const qi = h.indexOf('?');
    const path = qi >= 0 ? h.slice(0, qi) : h, qs = qi >= 0 ? h.slice(qi + 1) : '';
    const parts = path.split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } });
    const sp = new URLSearchParams(qs); let view = { type: 'all', id: null };
    if (['all', 'fav', 'recent', 'top', 'uncat'].includes(parts[0])) view = { type: parts[0], id: null };
    else if (parts[0] === 'cat' && parts[1]) view = { type: 'cat', id: parts[1] };
    const tags = (sp.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean);
    return { view, tags, p: sp.get('p') || null };
  },
  build({ view, tags, p }) {
    const path = view.type === 'cat' ? `cat/${encodeURIComponent(view.id)}` : view.type;
    const sp = new URLSearchParams(); if (tags && tags.length) sp.set('tags', tags.join(',')); if (p) sp.set('p', p);
    const qs = sp.toString(); return '#/' + path + (qs ? '?' + qs : '');
  },
  go(patch, { replace = false, noGuard = false } = {}) {
    const next = { view: S.view, tags: S.tagFilters, p: S.selectedId, ...patch };
    if (!noGuard && 'p' in patch && next.p !== S.selectedId) { if (!guard()) return; noGuard = true; } // 先詢問，避免取消後歷史紀錄多出一筆
    const h = this.build(next);
    if (noGuard) this.noGuard = true;
    if (replace || h === location.hash) { history.replaceState(null, '', h); this.apply(); }
    else location.hash = h;
  },
  apply() {
    const r = this.parse(); const noGuard = this.noGuard; this.noGuard = false;
    if (r.p && !S.prompts.some(x => x.id === r.p)) { r.p = null; history.replaceState(null, '', this.build(r)); }
    if (r.view.type === 'cat' && !S.cats.some(c => c.id === r.view.id)) { r.view = { type: 'all', id: null }; history.replaceState(null, '', this.build(r)); }
    const pChanged = r.p !== S.selectedId;
    if (pChanged && !noGuard && !guard()) { history.replaceState(null, '', this.last || '#/all'); return; }
    S.view = r.view; S.tagFilters = r.tags;
    if (pChanged) {
      S.selectedId = r.p;
      if (r.p) Editor.open(S.prompts.find(x => x.id === r.p));
      else if (!(Editor.cur && Editor.cur._new)) Editor.close();
    }
    this.last = location.hash; UI.renderSidebar(); UI.renderList();
  },
};

/* ---------- 動作 ---------- */
const Actions = {
  newPrompt() {
    if (!guard()) return;
    const v = S.view; S.selectedId = null;
    Editor.newDraft({ categoryId: v.type === 'cat' ? v.id : null, tags: [...S.tagFilters] });
    Router.go({ p: null }, { noGuard: true }); document.body.classList.remove('drawer');
  },
  async toggleFav(id) {
    try { const np = await Repo.toggleFav(id); Editor.syncFrom(np); UI.renderSidebar(); UI.renderList(); } catch (e) { handleErr(e); }
  },
  async copyById(id) {
    const p = S.prompts.find(x => x.id === id); if (!p) return;
    const mode = Settings.get().copyMode;
    if (!await Clip.write(Clip.build(p, mode))) return toast('複製失敗', { type: 'err' });
    try { const np = await Repo.markUsed(id); Editor.syncFrom(np); UI.renderSidebar(); UI.renderList(); } catch (e) { handleErr(e); }
    toast(`已複製「${p.title}」（${COPY_MODES[mode]}）`, { type: 'ok' });
  },
  async deleteWithUndo(ids) {
    let backups; try { backups = await Repo.deleteMany(ids); } catch (e) { return handleErr(e, '刪除失敗'); }
    if (Editor.cur && ids.includes(Editor.cur.id)) { Editor.close(); S.selectedId = null; Router.go({ p: null }, { replace: true, noGuard: true }); }
    UI.renderAll();
    let undone = false;
    const timer = setTimeout(() => { if (!undone) Repo.purgeAux(ids).catch(() => { }); }, 5300);
    toast(`已刪除 ${backups.length} 筆 Prompt`, {
      ms: 5000, action: {
        label: '復原', fn: async () => {
          undone = true; clearTimeout(timer);
          try { await Repo.restoreMany(backups); UI.renderAll(); toast('已復原', { type: 'ok' }); } catch (e) { handleErr(e, '復原失敗'); }
        },
      },
    });
  },
  async editCategory(cat) {
    const isNew = !cat; const body = document.createElement('div');
    body.innerHTML = `<label class="mini-field">名稱<input class="inp" id="cName" maxlength="30" value="${esc(cat ? cat.name : '')}" placeholder="例如：ESG"></label>
      <label class="mini-field">顏色<input type="color" id="cColor" value="${safeColor(cat ? cat.color : randColor())}" style="width:64px;height:34px;border:none;background:none;padding:0"></label>
      ${isNew ? '' : `<div style="display:flex;gap:6px"><button type="button" class="btn sm" data-mv="-1">↑ 上移</button><button type="button" class="btn sm" data-mv="1">↓ 下移</button></div>`}`;
    body.addEventListener('click', async e => {
      const b = e.target.closest('[data-mv]'); if (!b) return;
      try { await Repo.moveCat(cat.id, +b.dataset.mv); UI.renderAll(); } catch (er) { handleErr(er); }
    });
    const actions = [];
    if (!isNew) actions.push({
      label: '刪除分類', cls: 'danger left', onClick: async () => {
        const n = S.prompts.filter(p => p.categoryId === cat.id).length;
        if (!await Modal.confirm(`刪除分類「${cat.name}」？${n ? `\n其中 ${n} 筆 Prompt 會改為「未分類」，Prompt 本身不會刪除。` : ''}`, { ok: '刪除', danger: true })) return false;
        await Repo.deleteCat(cat.id);
        if (S.view.type === 'cat' && S.view.id === cat.id) Router.go({ view: { type: 'all', id: null } }, { replace: true, noGuard: true });
        if (Editor.cur && !Editor.dirty && !Editor.cur._new) { const p = S.prompts.find(x => x.id === Editor.cur.id); p && Editor.open(p); }
        UI.renderAll(); toast('已刪除分類');
      },
    });
    actions.push({ label: '取消' }, {
      label: isNew ? '新增' : '儲存', cls: 'primary', primary: true, onClick: async () => {
        const name = $('#cName', body).value.trim().slice(0, 30); if (!name) { toast('請輸入分類名稱', { type: 'err' }); return false; }
        const c = isNew ? { id: uid(), name, color: $('#cColor', body).value, order: Repo.nextCatOrder() } : { ...cat, name, color: $('#cColor', body).value };
        try { await Repo.saveCat(c); } catch (e) { toast(e.message, { type: 'err' }); return false; }
        UI.renderAll(); toast(isNew ? '已新增分類' : '已更新分類', { type: 'ok' });
      },
    });
    await Modal.open({ title: isNew ? '新增分類' : '編輯分類', body, actions });
  },
  async batch(act) {
    if (act === 'all') {
      const vis = S.visibleIds || []; const allOn = vis.length && vis.every(id => S.checked.has(id));
      vis.forEach(id => allOn ? S.checked.delete(id) : S.checked.add(id)); UI.renderList(); return;
    }
    const ids = [...S.checked]; if (!ids.length) return toast('請先勾選項目');
    const refresh = () => {
      if (Editor.cur && ids.includes(Editor.cur.id)) { const p = S.prompts.find(x => x.id === Editor.cur.id); if (p) { if (Editor.dirty) Editor.syncFrom(p); else Editor.open(p); } }
      UI.renderAll();
    };
    try {
      if (act === 'fav' || act === 'unfav') { await Repo.batchUpdate(ids, p => ({ ...p, favorite: act === 'fav' ? 1 : 0 })); refresh(); toast(`已更新 ${ids.length} 筆`, { type: 'ok' }); }
      else if (act === 'cat') {
        const body = `<label class="mini-field">移至分類<select class="inp" id="bCat"><option value="">（未分類）</option>${S.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label>`;
        const v = await Modal.open({ title: `變更 ${ids.length} 筆的分類`, body, actions: [{ label: '取消' }, { label: '套用', cls: 'primary', primary: true, onClick: () => ({ v: $('#bCat').value }) }] });
        if (!v) return;
        await Repo.batchUpdate(ids, p => ({ ...p, categoryId: v.v || null, updatedAt: now() })); refresh(); toast(`已變更 ${ids.length} 筆的分類`, { type: 'ok' });
      } else if (act === 'tag') {
        const s = await Modal.input({ title: `為 ${ids.length} 筆加上標籤`, label: '標籤（以逗號分隔）', placeholder: '例如：精選, 2026', ok: '加入' });
        const add = String(s || '').split(/[,，]/).map(normTag).filter(Boolean); if (!add.length) return;
        await Repo.batchUpdate(ids, p => ({ ...p, tags: [...new Set([...p.tags, ...add])], updatedAt: now() })); refresh(); toast(`已加入標籤：${add.join('、')}`, { type: 'ok' });
      } else if (act === 'del') {
        if (Editor.cur && ids.includes(Editor.cur.id) && Editor.dirty && !confirm('編輯中的 Prompt 有未儲存修改，仍要刪除？')) return;
        if (!await Modal.confirm(`確定刪除選取的 ${ids.length} 筆 Prompt？\n5 秒內可復原。`, { title: '批次刪除', ok: '刪除', danger: true })) return;
        await this.deleteWithUndo(ids); S.checked.clear(); UI.renderList();
      }
    } catch (e) { handleErr(e); }
  },
  async manageTags() {
    const body = document.createElement('div'); let filter = '';
    const draw = () => {
      const arr = [...S.tags].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      body.innerHTML = arr.length ? `<input class="inp" id="tmFilter" placeholder="篩選標籤…" aria-label="篩選標籤" value="${esc(filter)}"><div class="tm-list">${arr.map(([n, c]) => `<div class="tm-row" data-name="${esc(n)}"><span class="tm-name">${esc(n)}</span><span class="muted small">${c} 筆</span><button type="button" class="btn sm" data-tm="rename">改名</button><button type="button" class="btn sm danger" data-tm="del">刪除</button></div>`).join('')}</div><div class="hint">改名成既有標籤的名稱即可合併。標籤變更會同步套用到所有 Prompt。</div>` : '<div class="muted">尚無標籤</div>';
      applyFilter();
    };
    const applyFilter = () => $$('.tm-row', body).forEach(r => r.classList.toggle('hidden', !!filter && !r.dataset.name.toLowerCase().includes(filter.toLowerCase())));
    body.addEventListener('input', e => { if (e.target.id === 'tmFilter') { filter = e.target.value.trim(); applyFilter(); } });
    body.addEventListener('click', async e => {
      const b = e.target.closest('[data-tm]'); if (!b) return; const name = b.closest('.tm-row').dataset.name;
      try {
        let to = null;
        if (b.dataset.tm === 'rename') {
          const v = await Modal.input({ title: `重新命名標籤「${name}」`, label: '新名稱（與現有標籤同名則合併）', value: name, ok: '套用' });
          const nn = normTag(v || ''); if (!nn || nn === name) return; to = nn;
        } else if (!await Modal.confirm(`刪除標籤「${name}」？\n只會從 ${S.tags.get(name) || 0} 筆 Prompt 移除此標籤，Prompt 本身不會刪除。`, { ok: '刪除', danger: true })) return;
        const n = await Repo.renameTag(name, to);
        if (S.tagFilters.includes(name)) { const f = [...new Set(S.tagFilters.map(x => x === name ? to : x).filter(Boolean))]; Router.go({ tags: f }, { replace: true, noGuard: true }); }
        if (Editor.cur && !Editor.cur._new) {
          if (!Editor.dirty) { const p = S.prompts.find(x => x.id === Editor.cur.id); p && Editor.open(p); }
          else { Editor.tags = [...new Set(Editor.tags.map(x => x === name ? to : x).filter(Boolean))]; Editor.renderTags(); Editor.updateDirty(); }
        }
        UI.renderAll(); draw(); toast(to ? `已將「${name}」改為「${to}」（${n} 筆）` : `已刪除標籤「${name}」`, { type: 'ok' });
      } catch (er) { handleErr(er); }
    });
    draw(); await Modal.open({ title: '🏷️ 標籤管理', body, actions: [{ label: '關閉' }] });
  },
  toggleMulti(on = !S.multi) {
    S.multi = on; S.checked.clear(); const b = $('#btnSelect');
    b.textContent = on ? '完成' : '多選'; b.setAttribute('aria-pressed', on); b.classList.toggle('primary', on); UI.renderList();
  },
  openIO() {
    const body = `<div class="io-grid">
      <button type="button" class="io-card" data-io="export"><b>⬇️ 匯出 JSON</b><span class="muted small">備份全部 Prompt、分類、片段與範例圖</span></button>
      <button type="button" class="io-card" data-io="import"><b>⬆️ 匯入 JSON</b><span class="muted small">可選擇「合併」或「覆蓋」</span></button></div>
      <div class="hint">資料只存在本機瀏覽器的 IndexedDB。清除瀏覽資料會一併刪除，建議定期匯出備份。</div>`;
    const p = Modal.open({ title: '匯入 / 匯出', body, actions: [{ label: '關閉' }] });
    const root = Modal.stack[Modal.stack.length - 1].bg;
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-io]'); if (!b) return;
      if (b.dataset.io === 'import') { $('#fileImport').click(); Modal.closeTop(); }
      else { Modal.closeTop(); IO.exportJSON().catch(er => handleErr(er, '匯出失敗')); }
    });
    return p;
  },
  async importFile(f) {
    let v;
    try {
      const text = await f.text(); let d;
      try { d = JSON.parse(text); } catch { throw new Error('JSON 解析失敗，檔案可能已損毀或不是 JSON。'); }
      v = IO.validate(d);
    } catch (e) {
      return Modal.open({ title: '匯入失敗', body: `<div class="err-box">${esc(e.message)}</div><div class="muted">現有資料沒有任何變更。</div>` });
    }
    const mode = await Modal.open({
      title: '匯入資料',
      body: `<div>檔案：<b>${esc(f.name)}</b></div><div>Prompt <b>${v.prompts.length}</b> 筆 · 分類 <b>${v.categories.length}</b> · 片段 <b>${v.snippets.length}</b> · 圖片 <b>${v.images.length}</b></div>
        <div class="hint"><b>合併</b>：用 id 比對，相同 id 保留 updatedAt 較新的那筆。<br><b>覆蓋</b>：先清空現有資料（含版本紀錄），再寫入。</div>`,
      actions: [{ label: '取消' }, { label: '覆蓋', cls: 'danger', value: 'overwrite' }, { label: '合併', cls: 'primary', value: 'merge', primary: true }],
    });
    if (!mode) return;
    if (mode === 'overwrite' && !await Modal.confirm(`確定清空現有 ${S.prompts.length} 筆 Prompt 並以匯入檔覆蓋？\n此動作無法復原，建議先匯出備份。`, { title: '二次確認', ok: '確定覆蓋', danger: true })) return;
    if (!guard()) return;
    try {
      const st = await IO.importData(v, mode);
      Editor.close(); S.selectedId = null; S.checked.clear();
      Router.go({ view: { type: 'all', id: null }, tags: [], p: null }, { replace: true, noGuard: true }); UI.renderAll();
      toast(mode === 'overwrite' ? `已覆蓋匯入 ${st.added} 筆 Prompt` : `合併完成：新增 ${st.added}、更新 ${st.updated}、略過 ${st.skipped}`, { type: 'ok', ms: 4500 });
    } catch (e) { handleErr(e, '匯入失敗，現有資料未變更'); }
  },
  showHelp() {
    const rows = [['Ctrl / ⌘ + K', '聚焦搜尋'], ['Alt + N（或 Ctrl + N*）', '新增 Prompt'], ['Ctrl / ⌘ + S', '儲存'], ['Ctrl / ⌘ + Shift + C', '複製目前 Prompt'], ['Esc', '關閉視窗 / 返回']];
    Modal.open({
      title: '⌨️ 快捷鍵', body: `<table style="border-collapse:collapse;width:100%">${rows.map(([k, v]) => `<tr><td style="padding:6px 0"><kbd>${esc(k)}</kbd></td><td>${esc(v)}</td></tr>`).join('')}</table>
      <div class="hint">* Chrome / Edge 會保留 Ctrl+N（開新視窗），請改用 Alt+N。</div>`,
    });
  },
};

/* ---------- 事件綁定 ---------- */
function bindEvents() {
  const q = $('#q');
  q.addEventListener('input', debounce(() => { S.query = q.value.trim(); UI.renderList(); }, 300));
  $('#btnNew').onclick = $('#btnNew2').onclick = () => Actions.newPrompt();
  $('#btnIO').onclick = () => Actions.openIO();
  $('#fileImport').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) Actions.importFile(f); };
  $('#btnHelp').onclick = () => Actions.showHelp();
  $('#btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; Settings.set('theme', t); UI.applyTheme(t); };
  $('#btnMenu').onclick = () => document.body.classList.toggle('drawer');
  $('#scrim').onclick = () => document.body.classList.remove('drawer');
  $('#bannerClose').onclick = () => $('#banner').classList.add('hidden');
  $('#btnAddCat').onclick = () => Actions.editCategory(null);
  $('#btnClearTags').onclick = () => Router.go({ tags: [] });
  $('#btnManageTags').onclick = () => Actions.manageTags();
  $('#sortSel').onchange = e => { S.sort = e.target.value; Settings.set('sort', S.sort); UI.renderList(); };
  $('#btnSelect').onclick = () => Actions.toggleMulti();
  $('#batchBar').onclick = e => { const b = e.target.closest('[data-batch]'); if (b) Actions.batch(b.dataset.batch); };

  // sidebar
  $('#sidebar').addEventListener('click', e => {
    const ec = e.target.closest('[data-editcat]');
    if (ec) { e.stopPropagation(); return Actions.editCategory(S.cats.find(c => c.id === ec.dataset.editcat)); }
    const v = e.target.closest('[data-view]'), c = e.target.closest('[data-cat]'), t = e.target.closest('[data-tag]');
    if (v) { Router.go({ view: { type: v.dataset.view, id: null } }); document.body.classList.remove('drawer'); }
    else if (c) { Router.go({ view: { type: 'cat', id: c.dataset.cat } }); document.body.classList.remove('drawer'); }
    else if (t) { const n = t.dataset.tag; const tags = S.tagFilters.includes(n) ? S.tagFilters.filter(x => x !== n) : [...S.tagFilters, n]; Router.go({ tags }); }
  });
  $('#navCats').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-cat]')) { e.preventDefault(); e.target.click(); } });
  $('#activeFilters').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.clear === 'q') { q.value = ''; S.query = ''; UI.renderList(); }
    else if (b.dataset.clearTag !== undefined) Router.go({ tags: S.tagFilters.filter(x => x !== b.dataset.clearTag) });
  };

  // list
  const list = $('#list');
  list.addEventListener('click', e => {
    const actEl = e.target.closest('[data-act]'); const act = actEl && actEl.dataset.act; const card = e.target.closest('.card'); const id = card && card.dataset.id;
    if (act === 'new') return Actions.newPrompt();
    if (act === 'more') { S.limit += 200; return UI.renderList(); }
    if (!card) return;
    if (act === 'fav') return Actions.toggleFav(id);
    if (act === 'copy') return Actions.copyById(id);
    if (S.multi) { S.checked.has(id) ? S.checked.delete(id) : S.checked.add(id); return UI.renderList(); }
    if (id === S.selectedId && Editor.cur && Editor.cur.id === id) { document.body.classList.add('editing'); return; }
    Router.go({ p: id });
  });
  list.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) { e.preventDefault(); e.target.click(); } });

  // editor
  const form = $('#editor');
  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('input', e => {
    if (e.target.id === 'fTagInput') return;
    if (e.target.id === 'fPrompt' || e.target.id === 'fNegative') Editor.updateCounters();
    Editor.updateDirty();
  });
  form.addEventListener('change', e => { if (e.target.id === 'fPlatform') Editor.updatePlatform(); Editor.updateDirty(); });
  $('#btnSave').onclick = () => Editor.save();
  $('#btnCopy').onclick = () => Editor.copy();
  $('#btnDup').onclick = () => Editor.duplicate();
  $('#btnDelete').onclick = () => Editor.remove();
  $('#btnVersions').onclick = () => showVersions();
  $('#copyMode').onchange = e => Settings.set('copyMode', e.target.value);
  $('#fFav').onclick = () => {
    if (!Editor.cur) return;
    if (Editor.cur._new) { Editor.fav = !Editor.fav; Editor.renderFav(); } else Actions.toggleFav(Editor.cur.id);
  };
  $('#edBack').onclick = () => {
    if (Editor.cur && Editor.cur._new) { if (!guard()) return; Editor.close(); return; }
    Router.go({ p: null });
  };

  // tags input
  const ti = $('#fTagInput');
  ti.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === ',' || e.key === '，') { e.preventDefault(); Editor.addTagsFrom(ti.value); ti.value = ''; }
    else if (e.key === 'Backspace' && !ti.value && Editor.tags.length) { Editor.tags.pop(); Editor.renderTags(); Editor.updateDirty(); }
  });
  ti.addEventListener('input', () => { if (/[,，]/.test(ti.value)) { Editor.addTagsFrom(ti.value); ti.value = ''; } });
  ti.addEventListener('blur', () => { if (ti.value.trim()) { Editor.addTagsFrom(ti.value); ti.value = ''; } });
  $('#tagBox').addEventListener('click', e => {
    const b = e.target.closest('[data-rmtag]');
    if (b) { Editor.tags.splice(+b.dataset.rmtag, 1); Editor.renderTags(); Editor.updateDirty(); } else ti.focus();
  });

  // image
  const box = $('#imgBox'), fi = $('#fileImage');
  box.addEventListener('click', e => { if (e.target.closest('[data-rmimg]')) { e.stopPropagation(); return Editor.removeImage(); } fi.click(); });
  box.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === box) { e.preventDefault(); fi.click(); } });
  fi.onchange = () => { const f = fi.files[0]; fi.value = ''; if (f) Editor.setImageFile(f); };
  ['dragenter', 'dragover'].forEach(n => box.addEventListener(n, e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); box.classList.add('drag'); } }));
  ['dragleave', 'drop'].forEach(n => box.addEventListener(n, () => box.classList.remove('drag')));
  box.addEventListener('drop', e => { const f = [...e.dataTransfer.files].find(x => /^image\//.test(x.type)); if (f) { e.preventDefault(); Editor.setImageFile(f); } });
  document.addEventListener('paste', e => {
    if (!Editor.cur || Modal.isOpen) return;
    const f = [...(e.clipboardData && e.clipboardData.files || [])].find(x => /^image\//.test(x.type));
    if (f) { e.preventDefault(); Editor.setImageFile(f); toast('已貼上範例圖（尚未儲存）'); }
  });

  // composer
  $('#btnComposer').onclick = () => {
    const c = $('#composer'); const show = c.classList.contains('hidden'); c.classList.toggle('hidden', !show);
    $('#btnComposer').setAttribute('aria-expanded', show); if (show) Composer.render();
  };
  $('#compTabs').onclick = e => {
    const t = e.target.closest('[data-group]'); if (!t) return;
    S.compGroup = t.dataset.group; $('#compTarget').value = S.compGroup === 'negative' ? 'fNegative' : 'fPrompt'; Composer.render();
  };
  $('#btnAddSnip').onclick = () => Composer.addSnippet();
  const chips = $('#compChips');
  chips.addEventListener('click', async e => {
    const del = e.target.closest('[data-delsnip]');
    if (del) {
      const s = S.snippets.find(x => x.id === del.dataset.delsnip);
      if (s && await Modal.confirm(`刪除片段「${s.label}」？`, { ok: '刪除', danger: true })) { try { await Repo.deleteSnippet(s.id); Composer.render(); } catch (er) { handleErr(er); } }
      return;
    }
    const sn = e.target.closest('.snip'); if (!sn) return;
    const s = S.snippets.find(x => x.id === sn.dataset.sid); if (s) Composer.insert($('#' + $('#compTarget').value), s.value);
  });
  chips.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('snip')) { e.preventDefault(); e.target.click(); } });
  chips.addEventListener('dragstart', e => {
    const sn = e.target.closest('.snip'); if (!sn) return;
    const s = S.snippets.find(x => x.id === sn.dataset.sid); if (s) { e.dataTransfer.setData('text/plain', s.value + ', '); e.dataTransfer.effectAllowed = 'copy'; }
  });

  // hash / keyboard / unload
  window.addEventListener('hashchange', () => Router.apply());
  window.addEventListener('beforeunload', e => { if (Editor.dirty) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
    if (e.key === 'Escape') {
      if (Modal.isOpen) { e.preventDefault(); return Modal.closeTop(); }
      if (document.body.classList.contains('drawer')) return document.body.classList.remove('drawer');
      if (matchMedia('(max-width:900px)').matches && document.body.classList.contains('editing')) return $('#edBack').click();
      if (document.activeElement === q && q.value) { q.value = ''; S.query = ''; UI.renderList(); }
      return;
    }
    if (Modal.isOpen) return;
    if (mod && !e.shiftKey && k === 'k') { e.preventDefault(); q.focus(); q.select(); }
    else if ((mod && k === 'n') || (e.altKey && k === 'n')) { e.preventDefault(); Actions.newPrompt(); }
    else if (mod && !e.shiftKey && k === 's') { e.preventDefault(); if (Editor.cur) Editor.save(); }
    else if (mod && e.shiftKey && k === 'c') { if (Editor.cur) { e.preventDefault(); Editor.copy(); } }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!Settings.get().theme) UI.applyTheme(null); });
}

async function showVersions() {
  if (!Editor.cur || Editor.cur._new) return toast('新 Prompt 尚無版本紀錄');
  let vs; try { vs = (await Repo.versions(Editor.cur.id)).sort((a, b) => b.at - a.at); } catch (e) { return handleErr(e); }
  const body = document.createElement('div'); body.className = 'vwrap';
  body.innerHTML = `<div class="vlist">${vs.map((v, i) => `<div class="vitem" data-i="${i}">
      <div><b>v${vs.length - i}</b> <span class="muted small">${fmtTime(v.at)}</span> ${i === 0 ? '<span class="chip">最新儲存</span>' : ''}
      <div class="small">${esc(v.snapshot.title)} · ${splitTokens(v.snapshot.prompt).length} 詞</div></div>
      <div class="vbtns"><button type="button" class="btn sm" data-a="diff">比對</button><button type="button" class="btn sm" data-a="restore">還原</button></div></div>`).join('') || '<div class="muted">沒有版本紀錄</div>'}</div>
    <div class="diff" id="diffOut"><div class="muted">選擇左側版本，與「目前編輯中」的內容比對。</div></div>`;
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const item = b.closest('.vitem'); const v = vs[+item.dataset.i];
    if (b.dataset.a === 'diff') { $$('.vitem', body).forEach(x => x.classList.toggle('active', x === item)); $('#diffOut', body).innerHTML = diffHTML(v.snapshot, Editor.read()); }
    else { Editor.fill(v.snapshot); Editor.updateDirty(); Modal.closeTop(); toast('已載入該版本內容，按「儲存」後才會生效', { ms: 3500 }); }
  });
  Modal.open({ title: `🕘 版本紀錄 — ${Editor.cur.title}（${vs.length}）`, body, wide: true });
  if (vs[1]) setTimeout(() => body.querySelector('.vitem[data-i="1"] [data-a="diff"]')?.click(), 0);
}

/* ---------- 啟動 ---------- */
async function init() {
  const st = Settings.get(); UI.applyTheme(st.theme);
  S.sort = st.sort; $('#sortSel').value = S.sort; $('#copyMode').value = COPY_MODES[st.copyMode] ? st.copyMode : 'pos';
  bindEvents();
  try { await DB.open(); }
  catch (e) {
    console.error(e);
    UI.banner(`無法開啟 IndexedDB（${e && e.message || e}）。若以 file:// 開啟或使用無痕模式，瀏覽器可能限制儲存；建議改用本機伺服器（例如 python -m http.server）或 GitHub Pages。`);
    $('#list').innerHTML = '<div class="empty"><div class="big">⚠️</div><div>資料庫無法使用</div></div>'; return;
  }
  try { if (DB.fresh) await Repo.seed(); await Repo.loadAll(); } catch (e) { handleErr(e, '載入資料失敗'); }
  try {
    if (navigator.storage && navigator.storage.persisted) {
      S.persisted = await navigator.storage.persisted();
      if (!S.persisted && navigator.storage.persist) S.persisted = await navigator.storage.persist();
    }
  } catch { /* */ }
  Repo.maintain().catch(e => console.warn('maintain', e));
  Sync.init();
  if (!location.hash) history.replaceState(null, '', '#/all');
  Router.apply(); UI.renderAll();
}
document.addEventListener('DOMContentLoaded', init);
</script>
