<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>離線速記便箋 (Offline Scratchpad)</title>
  <style>
    /* ==========================================================
       CSS Variables & Design System (Dark & Light Theme)
       100% Self-Contained, Zero External CDN Dependency
       ========================================================== */
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      
      --color-primary: #3b82f6;
      --color-primary-hover: #2563eb;
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
      --color-success: #10b981;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
      --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s ease;
    }

    [data-theme="dark"] {
      --bg-base: #0f172a;
      --bg-surface: #1e293b;
      --bg-elevated: #334155;
      --bg-subtle: #1e293b80;
      --border-color: #334155;
      --border-focus: #60a5fa;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      
      --card-bg-default: #1e293b;
      --card-bg-amber: #451a03;
      --card-bg-emerald: #064e3b;
      --card-bg-sky: #082f49;
      --card-bg-purple: #3b0764;
      --card-bg-rose: #4c0519;

      --card-border-default: #334155;
      --card-border-amber: #78350f;
      --card-border-emerald: #065f46;
      --card-border-sky: #075985;
      --card-border-purple: #581c87;
      --card-border-rose: #881337;
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-subtle: #f8fafc90;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      
      --card-bg-default: #ffffff;
      --card-bg-amber: #fffbeb;
      --card-bg-emerald: #ecfdf5;
      --card-bg-sky: #f0f9ff;
      --card-bg-purple: #faf5ff;
      --card-bg-rose: #fff1f2;

      --card-border-default: #e2e8f0;
      --card-border-amber: #fde68a;
      --card-border-emerald: #a7f3d0;
      --card-border-sky: #bae6fd;
      --card-border-purple: #e9d5ff;
      --card-border-rose: #fecdd3;
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-faint);
    }

    /* Top Navigation Header */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      user-select: none;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-badge {
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-weight: 500;
    }

    /* Search Bar */
    .search-box {
      flex: 1;
      max-width: 460px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.55rem 2.25rem 0.55rem 2.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background: var(--bg-surface);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: var(--text-faint);
      background: var(--border-color);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      pointer-events: none;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* General Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      transition: all var(--transition-fast);
      user-select: none;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      box-shadow: var(--shadow-md);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-ghost:hover {
      background: var(--bg-elevated);
      color: var(--text-main);
    }

    .btn-icon {
      padding: 0.5rem;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border-color);
    }

    .btn-icon:hover {
      color: var(--text-main);
      background: var(--bg-elevated);
    }

    .btn-danger {
      background: var(--color-danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: var(--color-danger-hover);
    }

    /* Main Container & Layout */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.5rem;
      max-width: 1560px;
      margin: 0 auto;
      width: 100%;
      gap: 1.25rem;
    }

    /* Navigation / Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .tag-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .tag-pill:hover {
      background: var(--bg-elevated);
      color: var(--text-main);
    }

    .tag-pill.active {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }

    .pill-count {
      font-size: 0.7rem;
      opacity: 0.8;
      background: rgba(0, 0, 0, 0.15);
      padding: 0.05rem 0.35rem;
      border-radius: var(--radius-full);
    }

    .view-toggles {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Note Grid (Masonry-like Auto-Fit) */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      align-items: start;
    }

    .notes-section-title {
      grid-column: 1 / -1;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Note Card */
    .note-card {
      background: var(--card-bg-default);
      border: 1px solid var(--card-border-default);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
      position: relative;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
      overflow: hidden;
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-focus);
    }

    /* Card Color Modifiers */
    .note-card[data-color="amber"] { background: var(--card-bg-amber); border-color: var(--card-border-amber); }
    .note-card[data-color="emerald"] { background: var(--card-bg-emerald); border-color: var(--card-border-emerald); }
    .note-card[data-color="sky"] { background: var(--card-bg-sky); border-color: var(--card-border-sky); }
    .note-card[data-color="purple"] { background: var(--card-bg-purple); border-color: var(--card-border-purple); }
    .note-card[data-color="rose"] { background: var(--card-bg-rose); border-color: var(--card-border-rose); }

    .note-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .note-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .note-card-pin {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      padding: 0.2rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
    }

    .note-card-pin:hover, .note-card-pin.pinned {
      color: #f59e0b;
    }

    .note-card-content {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-height: 180px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 7;
      -webkit-box-orient: vertical;
      white-space: pre-wrap;
    }

    .note-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: auto;
    }

    .card-tag {
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      background: rgba(148, 163, 184, 0.15);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
    }

    .note-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.3rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(148, 163, 184, 0.2);
      font-size: 0.72rem;
      color: var(--text-faint);
    }

    .note-card-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .note-card:hover .note-card-actions {
      opacity: 1;
    }

    .action-btn-sm {
      background: transparent;
      border: none;
      color: var(--text-faint);
      padding: 0.3rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .action-btn-sm:hover {
      color: var(--text-main);
      background: rgba(148, 163, 184, 0.2);
    }

    .action-btn-sm[data-action="copy"]:hover {
      color: var(--color-primary);
      background: rgba(59, 130, 246, 0.15);
    }

    .action-btn-sm[data-action="duplicate"]:hover {
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }

    .action-btn-sm[data-action="delete"]:hover,
    .action-btn-sm[data-action="perm-delete"]:hover {
      color: var(--color-danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .action-btn-sm[data-action="restore"]:hover {
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      text-align: center;
      color: var(--text-muted);
      gap: 1rem;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
    }

    /* Modal / Note Editor */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      transform: scale(0.97);
      transition: transform var(--transition-normal);
      overflow: hidden;
    }

    .modal-backdrop.open .modal-window {
      transform: scale(1);
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-title-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .save-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      color: var(--text-muted);
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
      box-shadow: 0 0 6px var(--color-success);
    }

    .save-dot.saving {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .modal-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Color Palette Picker */
    .color-picker {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.4rem;
      background: var(--bg-elevated);
      border-radius: var(--radius-full);
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      border-color: var(--text-main);
      transform: scale(1.15);
    }

    .dot-default { background: #94a3b8; }
    .dot-amber { background: #f59e0b; }
    .dot-emerald { background: #10b981; }
    .dot-sky { background: #0ea5e9; }
    .dot-purple { background: #a855f7; }
    .dot-rose { background: #f43f5e; }

    /* Modal Form Body */
    .modal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1.25rem;
      gap: 0.75rem;
    }

    .editor-title-input {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      padding: 0.25rem 0;
      font-family: inherit;
    }

    .editor-title-input::placeholder {
      color: var(--text-faint);
    }

    .editor-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .editor-tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-main);
    }

    .tag-remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .tag-remove-btn:hover {
      color: var(--color-danger);
    }

    .editor-tag-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.8rem;
      color: var(--text-main);
      padding: 0.2rem 0.4rem;
      min-width: 120px;
    }

    /* Editor Modes: Edit / Split / Preview */
    .editor-mode-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.25rem 0;
    }

    .mode-pills {
      display: flex;
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      padding: 0.2rem;
      gap: 0.2rem;
    }

    .mode-pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: all var(--transition-fast);
    }

    .mode-pill.active {
      background: var(--bg-surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .editor-content-area {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      min-height: 280px;
      gap: 1rem;
    }

    .editor-content-area.split {
      grid-template-columns: 1fr 1fr;
    }

    .editor-textarea {
      width: 100%;
      height: 100%;
      min-height: 320px;
      resize: vertical;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.6;
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .editor-textarea:focus {
      border-color: var(--border-focus);
    }

    /* Markdown Previewer */
    .markdown-preview {
      width: 100%;
      height: 100%;
      min-height: 320px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      overflow-y: auto;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3, .markdown-preview h4 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }
    .markdown-preview h1:first-child, .markdown-preview h2:first-child {
      margin-top: 0;
    }
    .markdown-preview p {
      margin-bottom: 0.75rem;
    }
    .markdown-preview ul, .markdown-preview ol {
      margin-left: 1.5rem;

  <!-- ==========================================================
       Client-Side Logic: IndexedDB Storage & App Architecture
       ========================================================== -->
  <script>
    /**
     * 1. IndexedDB Manager (Promise-based)
     */
    class IndexedDBManager {
      constructor(dbName = 'OfflineScratchpadDB', version = 1) {
        this.dbName = dbName;
        this.version = version;
        this.db = null;
      }

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, this.version);

          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('notes')) {
              const notesStore = db.createObjectStore('notes', { keyPath: 'id' });
              notesStore.createIndex('idx_updatedAt', 'updatedAt', { unique: false });
              notesStore.createIndex('idx_isPinned', 'isPinned', { unique: false });
              notesStore.createIndex('idx_isDeleted', 'isDeleted', { unique: false });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings', { keyPath: 'key' });
            }
          };

          request.onsuccess = (event) => {
            this.db = event.target.result;
            resolve(this.db);
          };

          request.onerror = (event) => {
            console.error('IndexedDB open error:', event.target.error);
            reject(event.target.error);
          };
        });
      }

      async getAllNotes() {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(['notes'], 'readonly');
          const store = transaction.objectStore('notes');
          const request = store.getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      async getNoteById(id) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(['notes'], 'readonly');
          const store = transaction.objectStore('notes');
          const request = store.get(id);

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async saveNote(note) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(['notes'], 'readwrite');
          const store = transaction.objectStore('notes');
          const request = store.put(note);

          request.onsuccess = () => resolve(note);
          request.onerror = () => reject(request.error);
        });
      }

      async deleteNotePermanently(id) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(['notes'], 'readwrite');
          const store = transaction.objectStore('notes');
          const request = store.delete(id);

          request.onsuccess = () => resolve(id);
          request.onerror = () => reject(request.error);
        });
      }

      async clearDeletedNotes() {
        const allNotes = await this.getAllNotes();
        const deleted = allNotes.filter(n => n.isDeleted);
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(['notes'], 'readwrite');
          const store = transaction.objectStore('notes');
          deleted.forEach(n => store.delete(n.id));
          transaction.oncomplete = () => resolve(deleted.length);
          transaction.onerror = () => reject(transaction.error);
        });
      }

      async getSetting(key, defaultValue = null) {
        return new Promise((resolve) => {
          try {
            const transaction = this.db.transaction(['settings'], 'readonly');
            const store = transaction.objectStore('settings');
            const request = store.get(key);
            request.onsuccess = () => resolve(request.result ? request.result.value : defaultValue);
            request.onerror = () => resolve(defaultValue);
          } catch (e) {
            resolve(defaultValue);
          }
        });
      }

      async setSetting(key, value) {
        return new Promise((resolve, reject) => {
          try {
            const transaction = this.db.transaction(['settings'], 'readwrite');
            const store = transaction.objectStore('settings');
            const request = store.put({ key, value });
            request.onsuccess = () => resolve(value);
            request.onerror = () => reject(request.error);
          } catch (e) {
            reject(e);
          }
        });
      }
    }

    /**
     * 2. Lightweight & Safe Markdown Renderer
     */
    class MarkdownRenderer {
      static escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      static render(rawMarkdown) {
        if (!rawMarkdown) return '';

        let text = rawMarkdown;

        // Fenced code blocks ```lang ... ```
        const codeBlocks = [];
        text = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
          const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
          codeBlocks.push(`<pre><code class="language-${lang}">${MarkdownRenderer.escapeHtml(code.trim())}</code></pre>`);
          return placeholder;
        });

        // Inline code `...`
        const inlineCodes = [];
        text = text.replace(/`([^`\n]+)`/g, (match, code) => {
          const placeholder = `__INLINE_CODE_${inlineCodes.length}__`;
          inlineCodes.push(`<code>${MarkdownRenderer.escapeHtml(code)}</code>`);
          return placeholder;
        });

        // Escape remainder HTML
        text = MarkdownRenderer.escapeHtml(text);

        // Images: ![alt](url)
        text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');

        // Links: [title](url)
        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // Headers # ... ######
        text = text.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
        text = text.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
        text = text.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
        text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        // Blockquotes >
        text = text.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

        // Bold and Italic
        text = text.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
        text = text.replace(/~~(.*?)~~/g, '<del>$1</del>');

        // Checkboxes: - [ ] or - [x]
        text = text.replace(/^\s*-\s*\[ \]\s*(.*$)/gim, '<div style="display:flex;align-items:center;gap:0.4rem;"><input type="checkbox" disabled> <span>$1</span></div>');
        text = text.replace(/^\s*-\s*\[x\]\s*(.*$)/gim, '<div style="display:flex;align-items:center;gap:0.4rem;"><input type="checkbox" checked disabled> <del>$1</del></div>');

        // Unordered lists - or *
        text = text.replace(/^\s*[-*]\s+(.*$)/gim, '<li>$1</li>');
        text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

        // Line breaks (preserving paragraphs)
        text = text.replace(/\n\n+/g, '</p><p>');
        text = `<p>${text}</p>`;
        text = text.replace(/\n/g, '<br>');

        // Restore code blocks and inline code
        inlineCodes.forEach((code, index) => {
          text = text.replace(`__INLINE_CODE_${index}__`, code);
        });
        codeBlocks.forEach((block, index) => {
          text = text.replace(`__CODE_BLOCK_${index}__`, block);
        });

        return text;
      }
    }

    /**
     * 3. UI Toast Notification
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      
      let iconSvg = '';
      if (type === 'success') {
        iconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (type === 'error') {
        iconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      } else {
        iconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }

      toast.innerHTML = `${iconSvg}<span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 2500);
    }

    /**
     * 4. Main App Controller
     */
    class ScratchpadApp {
      constructor() {
        this.db = new IndexedDBManager();
        this.notes = [];
        this.currentFilter = 'all'; // 'all' | 'pinned' | 'trash' | or a custom tag string
        this.searchQuery = '';
        this.editingNote = null;
        this.editorMode = 'edit'; // 'edit' | 'split' | 'preview'
        this.saveTimeout = null;
      }

      async init() {
        await this.db.init();

        // Load Theme setting
        const savedTheme = await this.db.getSetting('theme', 'dark');
        this.setTheme(savedTheme);

        // Load Notes
        await this.loadNotes();

        // Setup DOM event listeners
        this.bindEvents();

        // Initial render
        this.render();
      }

      setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const icon = document.getElementById('themeIcon');
        if (theme === 'light') {
          // Moon icon
          icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
        } else {
          // Sun icon
          icon.innerHTML = `
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          `;
        }
        this.db.setSetting('theme', theme);
      }

      toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        this.setTheme(next);
      }

      async loadNotes() {
        this.notes = await this.db.getAllNotes();
        // If first time ever with 0 notes, generate a welcoming scratch note
        if (this.notes.length === 0) {
          const welcomeNote = {
            id: 'note_' + Date.now(),
            title: '歡迎使用離線速記便箋 ✨',
            content: `這是一款專為**高隱私、完全離線**打造的速記工具。

### 🌟 核心特色：
1. **IndexedDB 大容量儲存**：突破 localStorage 的 5MB 限制，筆記長度無上限！
2. **零連網、零外部 CDN**：即使斷網、或拔掉網路線，打開即用。
3. **支援 Markdown 與截圖粘貼**：可以在文字框直接按 \`Ctrl+V\` 粘貼截圖！
4. **即時自動存檔**：毫秒級背景寫入，防止手殘當機遺失靈感。

### ⌨️ 常用快捷鍵：
- \`Ctrl + N\`：快速新增便箋
- \`/\` 或 \`Ctrl + F\`：聚焦搜尋框
- \`Ctrl + S\`：在編輯視窗立即手動存檔
- \`Esc\`：關閉視窗

祝您使用愉快！`,
            tags: ['指南', '離線'],
            color: 'amber',
            isPinned: true,
            isDeleted: false,
            createdAt: Date.now(),
            updatedAt: Date.now()
          };
          await this.db.saveNote(welcomeNote);
          this.notes = [welcomeNote];
        }
      }

      bindEvents() {
        // Theme toggle
        document.getElementById('btnThemeToggle').addEventListener('click', () => this.toggleTheme());

        // New Note button
        document.getElementById('btnNewNote').addEventListener('click', () => this.openEditorNew());

        // Search Input
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
          this.searchQuery = e.target.value.trim().toLowerCase();
          this.render();
        });

        // Dropdown menu toggle
        const menuDropdown = document.getElementById('menuDropdown');
        const btnMenu = document.getElementById('btnMenu');
        btnMenu.addEventListener('click', (e) => {
          e.stopPropagation();
          menuDropdown.classList.toggle('active');
        });
        document.addEventListener('click', () => menuDropdown.classList.remove('active'));

        // JSON Export & Import
        document.getElementById('btnExportJSON').addEventListener('click', () => this.exportBackupJSON());
        document.getElementById('btnImportJSON').addEventListener('click', () => {
          document.getElementById('fileInputImport').click();
        });
        document.getElementById('fileInputImport').addEventListener('change', (e) => this.handleImportJSON(e));

        // Batch Markdown Export
        document.getElementById('btnExportAllMD').addEventListener('click', () => this.exportAllMarkdown());

        // Empty Trash
        document.getElementById('btnEmptyTrash').addEventListener('click', () => this.emptyTrash());

        // Modal Events
        document.getElementById('modalBtnClose').addEventListener('click', () => this.closeEditor());
        document.getElementById('editorModal').addEventListener('click', (e) => {
          if (e.target.id === 'editorModal') this.closeEditor();
        });

        // Editor inputs: auto-save on typing
        const editorTitle = document.getElementById('editorTitle');
        const editorContent = document.getElementById('editorContent');
        editorTitle.addEventListener('input', () => this.handleEditorInput());
        editorContent.addEventListener('input', () => {
          this.handleEditorInput();
          this.updateEditorStats();
          if (this.editorMode !== 'edit') {
            this.updateMarkdownPreview();
          }
        });

        // Image paste support (Ctrl+V)
        editorContent.addEventListener('paste', (e) => this.handleImagePaste(e));

        // Drag & drop image support
        editorContent.addEventListener('dragover', (e) => e.preventDefault());
        editorContent.addEventListener('drop', (e) => this.handleImageDrop(e));

        // Editor Tag Input
        const tagInput = document.getElementById('editorTagInput');
        tagInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            this.addTagToEditingNote(tagInput.value);
            tagInput.value = '';
          }
        });

        // Mode switch pills (Edit / Split / Preview)
        document.querySelectorAll('.mode-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            const mode = btn.dataset.mode;
            this.setEditorMode(mode);
          });
        });

        // Color Picker Dots in Modal
        document.querySelectorAll('.color-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            if (this.editingNote) {
              this.editingNote.color = dot.dataset.color;
              this.scheduleSave();
            }
          });
        });

        // Modal Pin Button
        document.getElementById('modalBtnPin').addEventListener('click', () => {
          if (!this.editingNote) return;
          this.editingNote.isPinned = !this.editingNote.isPinned;
          this.updateModalPinUI();
          this.scheduleSave();
          showToast(this.editingNote.isPinned ? '已置頂便箋' : '已取消置頂', 'info');
        });

        // Modal Single Export Markdown
        document.getElementById('modalBtnExportMD').addEventListener('click', () => {
          if (!this.editingNote) return;
          this.exportSingleMarkdown(this.editingNote);
        });

        // Modal Delete
        document.getElementById('modalBtnDelete').addEventListener('click', () => {
          if (!this.editingNote) return;
          this.toggleDeleteNote(this.editingNote.id);
          this.closeEditor();
        });

        // Global Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
          // If modal is open
          const modalOpen = document.getElementById('editorModal').classList.contains('open');
          if (modalOpen) {
            if (e.key === 'Escape') {
              this.closeEditor();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
              e.preventDefault();
              this.forceImmediateSave();
            }
            return;
          }

          // Main page shortcuts
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
            e.preventDefault();
            this.openEditorNew();
          } else if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
          }
        });
      }

      /* -------------------------------------------------------------
         Data Operations & Auto-Save
         ------------------------------------------------------------- */
      handleEditorInput() {
        if (!this.editingNote) return;
        this.editingNote.title = document.getElementById('editorTitle').value;
        this.editingNote.content = document.getElementById('editorContent').value;
        this.editingNote.updatedAt = Date.now();
        this.scheduleSave();
      }

      scheduleSave() {
        // UI visual saving state
        const saveDot = document.getElementById('saveDot');
        const statusText = document.getElementById('saveStatusText');
        saveDot.classList.add('saving');
        statusText.innerText = '儲存中...';

        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(async () => {
          await this.forceImmediateSave();
        }, 350);
      }

      async forceImmediateSave() {
        if (!this.editingNote) return;
        await this.db.saveNote(this.editingNote);

        // Update local list
        const idx = this.notes.findIndex(n => n.id === this.editingNote.id);
        if (idx !== -1) {
          this.notes[idx] = { ...this.editingNote };
        } else {
          this.notes.unshift({ ...this.editingNote });
        }

        const saveDot = document.getElementById('saveDot');
        const statusText = document.getElementById('saveStatusText');
        saveDot.classList.remove('saving');
        statusText.innerText = '已即時儲存';

        document.getElementById('modalLastEdited').innerText = `最後更新：${this.formatDate(this.editingNote.updatedAt)}`;
        this.render();
      }

      async togglePinNote(id, event) {
        if (event) event.stopPropagation();
        const note = this.notes.find(n => n.id === id);
        if (!note) return;
        note.isPinned = !note.isPinned;
        note.updatedAt = Date.now();
        await this.db.saveNote(note);
        showToast(note.isPinned ? '便箋已置頂' : '已取消置頂', 'info');
        this.render();
      }

      async toggleDeleteNote(id, event) {
        if (event) event.stopPropagation();
        const note = this.notes.find(n => n.id === id);
        if (!note) return;

        if (note.isDeleted) {
          // Restore
          note.isDeleted = false;
          note.updatedAt = Date.now();
          await this.db.saveNote(note);
          showToast('便箋已自回收筒復原', 'success');
        } else {
          // Soft delete
          note.isDeleted = true;
          note.updatedAt = Date.now();
          await this.db.saveNote(note);
          showToast('便箋已移至資源回收筒', 'info');
        }
        this.render();
      }

      async deletePermanently(id, event) {
        if (event) event.stopPropagation();
        if (!confirm('確定要永久刪除此便箋嗎？此操作無法復原。')) return;

        await this.db.deleteNotePermanently(id);
        this.notes = this.notes.filter(n => n.id !== id);
        showToast('便箋已永久刪除', 'info');
        this.render();
      }

      async duplicateNote(id, event) {
        if (event) event.stopPropagation();
        const original = this.notes.find(n => n.id === id);
        if (!original) return;

        const copy = {
          ...original,
          id: 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          title: original.title ? `${original.title} (副本)` : '副本便箋',
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        await this.db.saveNote(copy);
        this.notes.unshift(copy);
        showToast('已建立便箋副本', 'success');
        this.render();
      }

      async emptyTrash() {
        const deletedCount = this.notes.filter(n => n.isDeleted).length;
        if (deletedCount === 0) {
          showToast('回收筒目前沒有任何便箋', 'info');
          return;
        }
        if (!confirm(`確定要清空回收筒中的 ${deletedCount} 篇便箋嗎？永久刪除後將無法還原！`)) return;

        await this.db.clearDeletedNotes();
        this.notes = this.notes.filter(n => !n.isDeleted);
        showToast(`已清空回收筒 (${deletedCount} 篇)`, 'success');
        this.render();
      }

      /* -------------------------------------------------------------
         Image Paste & Drag-and-Drop
         ------------------------------------------------------------- */
      handleImagePaste(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (const item of items) {
          if (item.type.indexOf('image') !== -1) {
            e.preventDefault();
            const blob = item.getAsFile();
            this.insertImageBlob(blob);
            break;
          }
        }
      }

      handleImageDrop(e) {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('image/')) {
          this.insertImageBlob(files[0]);
        }
      }

      insertImageBlob(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64 = event.target.result;
          const textarea = document.getElementById('editorContent');
          const cursorPosition = textarea.selectionStart;
          const textBefore = textarea.value.substring(0, cursorPosition);
          const textAfter = textarea.value.substring(cursorPosition);
          
          const markdownImg = `\n![圖片備註](${base64})\n`;
          textarea.value = textBefore + markdownImg + textAfter;
          
          this.handleEditorInput();
          this.updateEditorStats();
          if (this.editorMode !== 'edit') this.updateMarkdownPreview();
          showToast('圖片已順利載入並嵌入便箋', 'success');
        };
        reader.readAsDataURL(file);
      }

      /* -------------------------------------------------------------
         Editor Modal UI Management
         ------------------------------------------------------------- */
      openEditorNew() {
        const newNote = {
          id: 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          title: '',
          content: '',
          tags: this.currentFilter !== 'all' && this.currentFilter !== 'pinned' && this.currentFilter !== 'trash' ? [this.currentFilter] : [],
          color: 'default',
          isPinned: false,
          isDeleted: false,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        this.editingNote = newNote;
        this.setupEditorModal();
      }

      openEditor(noteId) {
        const note = this.notes.find(n => n.id === noteId);
        if (!note) return;
        this.editingNote = { ...note, tags: [...(note.tags || [])] };
        this.setupEditorModal();
      }

      setupEditorModal() {
        const note = this.editingNote;
        document.getElementById('editorTitle').value = note.title || '';
        document.getElementById('editorContent').value = note.content || '';
        document.getElementById('modalLastEdited').innerText = `最後更新：${this.formatDate(note.updatedAt)}`;

        // Set color picker
        document.querySelectorAll('.color-dot').forEach(dot => {
          if (dot.dataset.color === (note.color || 'default')) {
            dot.classList.add('active');
          } else {
            dot.classList.remove('active');
          }
        });

        // Set pin icon
        this.updateModalPinUI();

        // Render tags chips
        this.renderEditorTags();

        // Mode reset to default edit
        this.setEditorMode('edit');
        this.updateEditorStats();

        // Delete button text
        const btnDelete = document.getElementById('modalBtnDelete');
        btnDelete.innerText = note.isDeleted ? '永久刪除' : '移至回收筒';

        // Show Modal
        const modal = document.getElementById('editorModal');
        modal.classList.add('open');

        // Focus title or content
        setTimeout(() => {
          if (!note.title) {
            document.getElementById('editorTitle').focus();
          } else {
            document.getElementById('editorContent').focus();
          }
        }, 100);
      }

      updateModalPinUI() {
        const pinBtn = document.getElementById('modalBtnPin');
        if (this.editingNote && this.editingNote.isPinned) {
          pinBtn.style.color = '#f59e0b';
        } else {
          pinBtn.style.color = 'var(--text-muted)';
        }
      }

      renderEditorTags() {
        const row = document.getElementById('editorTagsRow');
        const input = document.getElementById('editorTagInput');
        // Remove existing chips
        row.querySelectorAll('.editor-tag-chip').forEach(el => el.remove());

        (this.editingNote.tags || []).forEach(tag => {
          const chip = document.createElement('span');
          chip.className = 'editor-tag-chip';
          chip.innerHTML = `#${MarkdownRenderer.escapeHtml(tag)} <button class="tag-remove-btn" title="刪除標籤">&times;</button>`;
          chip.querySelector('.tag-remove-btn').addEventListener('click', () => {
            this.editingNote.tags = this.editingNote.tags.filter(t => t !== tag);
            this.renderEditorTags();
            this.scheduleSave();
          });
          row.insertBefore(chip, input);
        });
      }

      addTagToEditingNote(rawTag) {
        const tag = rawTag.trim().replace(/^#/, '');
        if (!tag) return;
        if (!this.editingNote.tags) this.editingNote.tags = [];
        if (!this.editingNote.tags.includes(tag)) {
          this.editingNote.tags.push(tag);
          this.renderEditorTags();
          this.scheduleSave();
        }
      }

      setEditorMode(mode) {
        this.editorMode = mode;
        document.querySelectorAll('.mode-pill').forEach(p => {
          p.classList.toggle('active', p.dataset.mode === mode);
        });

        const contentArea = document.getElementById('editorContentArea');
        const textarea = document.getElementById('editorContent');
        const preview = document.getElementById('editorMarkdownPreview');

        if (mode === 'edit') {
          contentArea.className = 'editor-content-area';
          textarea.style.display = 'block';
          preview.style.display = 'none';
        } else if (mode === 'preview') {
          contentArea.className = 'editor-content-area';
          textarea.style.display = 'none';
          preview.style.display = 'block';
          this.updateMarkdownPreview();
        } else if (mode === 'split') {
          contentArea.className = 'editor-content-area split';
          textarea.style.display = 'block';
          preview.style.display = 'block';
          this.updateMarkdownPreview();
        }
      }

      updateMarkdownPreview() {
        const content = document.getElementById('editorContent').value;
        const preview = document.getElementById('editorMarkdownPreview');
        preview.innerHTML = MarkdownRenderer.render(content);
      }

      updateEditorStats() {
        const text = document.getElementById('editorContent').value;
        const charCount = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const readingTimeMin = Math.ceil(charCount / 300);

        document.getElementById('editorStats').innerHTML = `
          <span>${charCount} 字元</span>
          <span>${words} 詞</span>
          <span>約 ${readingTimeMin} 分鐘閱讀</span>
        `;
      }

      closeEditor() {
        clearTimeout(this.saveTimeout);
        this.forceImmediateSave();
        document.getElementById('editorModal').classList.remove('open');
        this.editingNote = null;
      }

      /* -------------------------------------------------------------
         Rendering & Filtering
         ------------------------------------------------------------- */
      render() {
        this.renderTagPills();
        this.renderNotesGrid();
      }

      renderTagPills() {
        const container = document.getElementById('tagPillsContainer');
        container.innerHTML = '';

        const activeNotes = this.notes.filter(n => !n.isDeleted);
        const pinnedCount = activeNotes.filter(n => n.isPinned).length;
        const trashCount = this.notes.filter(n => n.isDeleted).length;

        // Collect all distinct tags
        const tagMap = new Map();
        activeNotes.forEach(n => {
          (n.tags || []).forEach(t => {
            tagMap.set(t, (tagMap.get(t) || 0) + 1);
          });
        });

        // 1. All
        container.appendChild(this.createTagPill('全部便箋', 'all', activeNotes.length));

        // 2. Pinned
        if (pinnedCount > 0) {
          container.appendChild(this.createTagPill('📌 已置頂', 'pinned', pinnedCount));
        }

        // 3. Dynamic tags
        tagMap.forEach((count, tag) => {
          container.appendChild(this.createTagPill(`#${tag}`, tag, count));
        });

        // 4. Trash
        if (trashCount > 0) {
          container.appendChild(this.createTagPill('🗑️ 回收筒', 'trash', trashCount));
        }
      }

      createTagPill(label, filterKey, count) {
        const pill = document.createElement('div');
        pill.className = `tag-pill ${this.currentFilter === filterKey ? 'active' : ''}`;
        pill.innerHTML = `<span>${label}</span> <span class="pill-count">${count}</span>`;
        pill.addEventListener('click', () => {
          this.currentFilter = filterKey;
          this.render();
        });
        return pill;
      }

      renderNotesGrid() {
        const grid = document.getElementById('notesGrid');
        grid.innerHTML = '';

        // Filter by system state / tag
        let list = this.notes;

        if (this.currentFilter === 'trash') {
          list = list.filter(n => n.isDeleted);
        } else {
          list = list.filter(n => !n.isDeleted);

          if (this.currentFilter === 'pinned') {
            list = list.filter(n => n.isPinned);
          } else if (this.currentFilter !== 'all') {
            list = list.filter(n => (n.tags || []).includes(this.currentFilter));
          }
        }

        // Filter by Search Query
        if (this.searchQuery) {
          const q = this.searchQuery;
          list = list.filter(n => {
            const titleMatch = (n.title || '').toLowerCase().includes(q);
            const contentMatch = (n.content || '').toLowerCase().includes(q);
            const tagsMatch = (n.tags || []).some(t => t.toLowerCase().includes(q));
            return titleMatch || contentMatch || tagsMatch;
          });
        }

        // Update count label
        document.getElementById('notesCountLabel').innerText = `共 ${list.length} 篇便箋`;

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
              </div>
              <div>
                <p style="font-weight: 600; margin-bottom: 0.25rem;">沒有符合條件的便箋</p>
                <p style="font-size: 0.85rem; color: var(--text-faint);">點擊右上角「新增便箋」開始速記，或清除搜尋條件。</p>
              </div>
            </div>
          `;
          return;
        }

        // Separate pinned and regular if in normal view
        if (this.currentFilter !== 'trash' && this.currentFilter !== 'pinned') {
          const pinnedNotes = list.filter(n => n.isPinned).sort((a, b) => b.updatedAt - a.updatedAt);
          const otherNotes = list.filter(n => !n.isPinned).sort((a, b) => b.updatedAt - a.updatedAt);

          if (pinnedNotes.length > 0) {
            const pinnedTitle = document.createElement('div');
            pinnedTitle.className = 'notes-section-title';
            pinnedTitle.innerText = '已置頂便箋';
            grid.appendChild(pinnedTitle);

            pinnedNotes.forEach(note => grid.appendChild(this.createNoteCard(note)));

            if (otherNotes.length > 0) {
              const otherTitle = document.createElement('div');
              otherTitle.className = 'notes-section-title';
              otherTitle.innerText = '其他便箋';
              grid.appendChild(otherTitle);
            }
          }

          otherNotes.forEach(note => grid.appendChild(this.createNoteCard(note)));
        } else {
          // Trash or Pinned only
          list.sort((a, b) => b.updatedAt - a.updatedAt).forEach(note => {
            grid.appendChild(this.createNoteCard(note));
          });
        }
      }

      createNoteCard(note) {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.dataset.color = note.color || 'default';

        // Title and Pin
        const titleHtml = note.title ? MarkdownRenderer.escapeHtml(note.title) : '<span style="color:var(--text-faint); font-style:italic;">未命名便箋</span>';
        
        // Tags
        const tagsHtml = (note.tags || []).map(t => `<span class="card-tag">#${MarkdownRenderer.escapeHtml(t)}</span>`).join('');

        // Action buttons
        let actionsHtml = '';
        if (note.isDeleted) {
          actionsHtml = `
            <button class="action-btn-sm" title="復原便箋" data-action="restore">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            </button>
            <button class="action-btn-sm" title="永久刪除" style="color:var(--color-danger);" data-action="perm-delete">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          `;
        } else {
          actionsHtml = `
            <button class="action-btn-sm" title="複製便箋內文" data-action="copy">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button class="action-btn-sm" title="建立副本" data-action="duplicate">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            <button class="action-btn-sm" title="移至回收筒" data-action="delete">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          `;
        }

        // Preview snippet
        const contentSnippet = note.content 
          ? MarkdownRenderer.escapeHtml(note.content.substring(0, 300))
          : '<span style="color:var(--text-faint); font-style:italic;">(空白內容)</span>';

        card.innerHTML = `
          <div class="note-card-header">
            <h3 class="note-card-title">${titleHtml}</h3>
            ${!note.isDeleted ? `
              <button class="note-card-pin ${note.isPinned ? 'pinned' : ''}" title="${note.isPinned ? '取消置頂' : '置頂'}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
              </button>
            ` : ''}
          </div>
          <div class="note-card-content">${contentSnippet}</div>
          ${tagsHtml ? `<div class="note-card-tags">${tagsHtml}</div>` : ''}
          <div class="note-card-footer">
            <span>${this.formatDate(note.updatedAt)}</span>
            <div class="note-card-actions">
              ${actionsHtml}
            </div>
          </div>
        `;

        // Card Click opens editor
        card.addEventListener('click', (e) => {
          // If clicked on pin or action buttons, don't trigger modal
          if (e.target.closest('button')) return;
          this.openEditor(note.id);
        });

        // Pin Button
        const pinBtn = card.querySelector('.note-card-pin');
        if (pinBtn) {
          pinBtn.addEventListener('click', (e) => this.togglePinNote(note.id, e));
        }

        // Action Buttons
        card.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const action = btn.dataset.action;
            if (action === 'copy') {
              navigator.clipboard.writeText(note.content || '').then(() => showToast('已複製便箋全文至剪貼簿', 'success'));
            } else if (action === 'duplicate') {
              this.duplicateNote(note.id, e);
            } else if (action === 'delete') {
              this.toggleDeleteNote(note.id, e);
            } else if (action === 'restore') {
              this.toggleDeleteNote(note.id, e);
            } else if (action === 'perm-delete') {
              this.deletePermanently(note.id, e);
            }
          });
        });

        return card;
      }

      /* -------------------------------------------------------------
         Backup & Restore (JSON / Markdown)
         ------------------------------------------------------------- */
      exportBackupJSON() {
        const payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          database: 'OfflineScratchpadDB',
          notes: this.notes
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `scratchpad_backup_${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已成功匯出全部備份 JSON 檔案', 'success');
      }

      async handleImportJSON(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const json = JSON.parse(evt.target.result);
            if (!json.notes || !Array.isArray(json.notes)) {
              throw new Error('不合法的備份檔案格式：缺少 notes 陣列');
            }

            let importedCount = 0;
            for (const note of json.notes) {
              if (note.id) {
                await this.db.saveNote(note);
                importedCount++;
              }
            }

            await this.loadNotes();
            this.render();
            showToast(`已成功還原匯入 ${importedCount} 篇便箋！`, 'success');
          } catch (err) {
            console.error('Import error:', err);
            showToast('匯入失敗：' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        // Reset file input
        e.target.value = '';
      }

      exportSingleMarkdown(note) {
        const title = note.title || '無標題便箋';
        const content = `---\ntitle: "${title}"\ndate: ${new Date(note.createdAt).toISOString()}\ntags: [${(note.tags || []).join(', ')}]\n---\n\n${note.content || ''}`;
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const filename = (title.replace(/[\/\\?%*:|"<>]/g, '_')) + '.md';
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`已匯出 ${filename}`, 'success');
      }

      exportAllMarkdown() {
        const activeNotes = this.notes.filter(n => !n.isDeleted);
        if (activeNotes.length === 0) {
          showToast('目前沒有可匯出的便箋', 'info');
          return;
        }

        // Export each note with slight delay to ensure browser downloads
        activeNotes.forEach((note, i) => {
          setTimeout(() => this.exportSingleMarkdown(note), i * 150);
        });
        showToast(`正在批次下載 ${activeNotes.length} 篇 Markdown...`, 'info');
      }

      /* -------------------------------------------------------------
         Utilities
         ------------------------------------------------------------- */
      formatDate(timestamp) {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        const now = new Date();
        const diffMs = now - d;
        const diffMinutes = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMinutes / 60);

        if (diffMinutes < 1) return '剛剛';
        if (diffMinutes < 60) return `${diffMinutes} 分鐘前`;
        if (diffHours < 24) return `${diffHours} 小時前`;

        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        return `${month}/${day} ${hours}:${minutes}`;
      }
    }

    // App Bootstrapping
    document.addEventListener('DOMContentLoaded', () => {
      window.scratchpad = new ScratchpadApp();
      window.scratchpad.init();
    });
  </script>
