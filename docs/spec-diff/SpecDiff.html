<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpecDiff 規格書比對工具</title>
<style>
:root{--bg:#f4f5f7;--pn:#fff;--bd:#d8dce2;--tx:#1f2328;--mu:#6b7280;--pri:#2563eb;--priL:#dbe7ff;
--add:#e7f8ec;--addS:#a6ecb8;--del:#fdecea;--delS:#ffb4ac;--mod:#fff8d6;--mov:#efebff;--movS:#cfc3ff;--cur:#2563eb;--hv:#f0f3f8}
.dark{--bg:#16181d;--pn:#1e2128;--bd:#343842;--tx:#e6e8eb;--mu:#9aa1ac;--pri:#5b8cff;--priL:#25324f;
--add:#14301f;--addS:#1f6b3a;--del:#3a1b1b;--delS:#8a2e2a;--mod:#3a3415;--mov:#2a2545;--movS:#4f3f9a;--cur:#5b8cff;--hv:#252932}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hv)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.sm{padding:1px 7px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],textarea{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
textarea{width:100%;resize:vertical}
header{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header .logo{font-weight:700;font-size:17px;color:var(--pri);margin-right:6px;cursor:pointer;user-select:none;border-radius:6px;padding:0 4px}
header .logo:hover{background:var(--priL)}
header .sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
header .grow{flex:1}
header select{max-width:200px}
#q{width:170px}
.menu{position:relative}
.menu .dd{display:none;position:absolute;right:0;top:110%;background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50;min-width:200px;padding:4px}
.menu.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;border:0;border-radius:4px}
main{flex:1;display:grid;grid-template-columns:250px 1fr 320px;min-height:0}
main>*{min-height:0;overflow:auto;background:var(--pn)}
#outline{border-right:1px solid var(--bd);padding:6px 0}
#review{border-left:1px solid var(--bd);padding:12px}
#center{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;align-items:flex-end;background:var(--bg);border-bottom:1px solid var(--bd)}
.tabs .tab{border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:transparent;padding:5px 14px}
.tabs .tab.on{background:var(--pn);border-color:var(--bd);font-weight:600;margin-bottom:-1px}
.tabs .tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:5px;font-size:13px;color:var(--mu)}
#view{flex:1;overflow:auto;background:var(--pn)}
.olh{padding:4px 12px 8px;font-size:12px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.ol{padding:3px 10px 3px 0;cursor:pointer;display:flex;gap:6px;align-items:baseline;border-left:3px solid transparent;font-size:13px}
.ol:hover{background:var(--hv)}
.ol.on{background:var(--priL);border-left-color:var(--pri)}
.ol .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol .nm{color:var(--mu);font-size:11px}
.ol.zero{color:var(--mu)}
.ol.dl .tt{text-decoration:line-through;color:#c0392b}
.ol.ad .tt{color:#1a7f37}
.bdg{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;background:var(--hv);color:var(--mu)}
.bdg.hot{background:#f59e0b;color:#fff}
/* diff rows */
.r{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bd);content-visibility:auto;contain-intrinsic-size:auto 40px;position:relative}
.r.one{grid-template-columns:1fr}
.c{padding:6px 10px 6px 46px;white-space:pre-wrap;word-break:break-word;position:relative;min-height:30px}
.c+.c{border-left:1px solid var(--bd)}
.c .ln{position:absolute;left:0;top:6px;width:38px;text-align:right;color:var(--mu);font-size:11px;user-select:none}
.r.t-add .c.b,.r.t-add.one .c{background:var(--add)}
.r.t-del .c.a,.r.t-del.one .c{background:var(--del)}
.r.t-mod .c{background:var(--mod)}
.r.t-move .c.b,.r.t-move.one .c{background:var(--mov)}
.r.t-away .c.a,.r.t-away.one .c{background:var(--hv);color:var(--mu)}
.r.t-away.one .c .tx{text-decoration:line-through}
.r.cur{outline:2px solid var(--cur);outline-offset:-2px;z-index:1}
.r.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:inset 0 0 0 999px rgba(255,214,0,.45)}100%{box-shadow:none}}
.r.chg{cursor:pointer}
.r.rv .c:last-child{padding-right:110px}
.ph{color:var(--mu);font-size:12px;font-style:italic}
ins{background:var(--addS);text-decoration:none;border-radius:2px}
del{background:var(--delS);text-decoration:line-through;border-radius:2px}
.r.t-add ins,.r.t-del del{background:transparent}
.h1{font-size:18px;font-weight:700}.h2{font-size:16px;font-weight:700}.h3{font-size:15px;font-weight:700}.h4,.h5,.h6,.h7,.h8,.h9{font-weight:700}
.hn{color:var(--mu);font-weight:400;margin-right:6px;font-size:.85em}
.gap{padding:4px;text-align:center;color:var(--mu);font-size:12px;background:var(--bg);border-bottom:1px solid var(--bd);cursor:pointer}
.gap:hover{color:var(--pri)}
.tag{position:absolute;right:6px;top:4px;font-size:11px;padding:0 6px;border-radius:9px;z-index:2}
.mv{display:inline-block;font-size:11px;color:#6d4cd6;border:1px solid var(--movS);border-radius:4px;padding:0 4px;margin-right:6px;font-style:normal;white-space:nowrap}
table.dt{border-collapse:collapse;width:100%;font-size:13px;white-space:normal}
table.dt td{border:1px solid var(--bd);padding:3px 6px;vertical-align:top;white-space:pre-wrap;background:var(--pn)}
table.dt tr.x-add td{background:var(--add)}
table.dt tr.x-del td{background:var(--del)}
table.dt tr.x-mod td{background:var(--mod)}
table.dt tr.x-ph td{background:var(--bg);height:8px;padding:0}
/* status */
.st0{background:#fff;color:#374151;box-shadow:inset 0 0 0 1.5px #374151}.dark .st0{background:#111;color:#e5e7eb;box-shadow:inset 0 0 0 1.5px #e5e7eb}.st1{background:#64748b;color:#fff}.st2{background:#dc2626;color:#fff}.st3{background:#1d4ed8;color:#fff}.st4{background:#ea580c;color:#fff}.tag{font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.25)}.tag.st0{box-shadow:inset 0 0 0 1.5px #374151}.seg button[class*=st]{border:0}.seg button:not(.on){opacity:.55}.seg button.on{opacity:1;outline:3px solid #111;outline-offset:2px}.dark .seg button.on{outline-color:#fff}.seg button[class*=st]:hover{opacity:.9;filter:none}
.ty{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;font-weight:600}
.ty-add{background:var(--addS)}.ty-del{background:var(--delS)}.ty-mod{background:#fde68a;color:#5b4500}.ty-move{background:var(--movS)}
/* review */
#review h3{margin:0 0 6px;font-size:15px}
.rv-sec{font-size:12px;color:var(--mu);margin-bottom:8px;word-break:break-all}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.seg button{font-size:12px;padding:2px 8px}
.seg button.on{font-weight:700}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
.fld input{width:100%}
.pv{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:260px;overflow:auto;background:var(--bg)}
.muted{color:var(--mu)}
.small{font-size:12px}
/* list */
.lf{position:sticky;top:0;background:var(--pn);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:3;font-size:13px}
.li{border-bottom:1px solid var(--bd);padding:8px 12px;cursor:pointer}
.li:hover{background:var(--hv)}
.li.cur{background:var(--priL)}
.li .hd{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:3px;flex-wrap:wrap}
.li .bd{white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:160px;overflow:hidden}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th,table.grid td{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
table.grid th{position:sticky;top:0;background:var(--bg);z-index:2}
a.lk{color:var(--pri);cursor:pointer;text-decoration:none;margin-right:6px}
footer{display:flex;gap:14px;align-items:center;padding:4px 12px;background:var(--pn);border-top:1px solid var(--bd);font-size:12px;flex-wrap:wrap}
footer b{font-weight:600}
footer .grow{flex:1}
.cA{color:#1a7f37}.cM{color:#9a6700}.cD{color:#cf222e}.cV{color:#6d4cd6}
/* welcome */
.welcome{max-width:720px;margin:40px auto;padding:0 24px}
.welcome h2{color:var(--pri)}
.welcome ol li{margin:6px 0}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:26px;text-align:center;color:var(--mu);margin:10px 0}
.drop.on{border-color:var(--pri);background:var(--priL)}
.hbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.hbar button{padding:6px 14px}
.hcard{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:14px 0;background:var(--pn)}
.hcard h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.hcard h4 .sp{flex:1}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button.on{background:var(--priL);border-color:var(--pri);font-weight:700}
.back{background:var(--priL);border:1px solid var(--pri);border-radius:10px;padding:10px 14px;margin:12px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back .sp{flex:1}
#btnHome.on{background:var(--priL);border-color:var(--pri)}
/* dialog */
dialog{border:1px solid var(--bd);border-radius:10px;padding:0;background:var(--pn);color:var(--tx);width:min(680px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;display:flex;justify-content:space-between}
dialog .db{padding:14px 16px;max-height:70vh;overflow:auto}
dialog .df{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row>label{min-width:80px;color:var(--mu);font-size:13px}
.chk{display:flex;gap:6px;align-items:center;margin:6px 0}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;max-width:80vw}
#toast.show{opacity:.95}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:998}
#busy.show{display:flex}
#busy div{background:var(--pn);padding:16px 26px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.hide{display:none!important}
@media (max-width:1100px){main{grid-template-columns:200px 1fr 270px}}
</style>
</head>
<body>
<header>
  <span class="logo" id="logo" title="回到主畫面">SpecDiff</span>
  <select id="selProj" title="專案"></select>
  <button id="btnNewProj" title="新增專案">＋專案</button>
  <span class="sep"></span>
  <span class="muted small">舊版</span><select id="selOld"></select>
  <button id="btnSwap" title="交換新舊版">⇄</button>
  <span class="muted small">新版</span><select id="selNew"></select>
  <button id="btnCmp" class="pri">比對</button>
  <span class="sep"></span>
  <button id="btnImport">匯入版本</button>
  <span class="grow"></span>
  <input id="q" type="text" placeholder="搜尋 (Ctrl+F，Enter 下一筆)">
  <div class="menu" id="mnuExp"><button>匯出 ▾</button><div class="dd">
    <button data-x="html">HTML 差異報告</button>
    <button data-x="csv">變更清單 CSV</button>
    <button data-x="impact">影響清單 CSV（依模組）</button>
    <hr style="border:0;border-top:1px solid var(--bd)">
    <button data-x="backup">整庫備份 JSON</button>
    <button data-x="restore">還原 / 合併 JSON…</button>
  </div></div>
  <button id="btnManage" title="專案與版本管理">管理</button>
  <button id="btnSet" title="比對選項與設定">⚙</button>
  <button id="btnHome" title="回到主畫面 (Alt+H)">🏠 主畫面</button>
</header>
<main>
  <nav id="outline"></nav>
  <section id="center">
    <div class="tabs">
      <button class="tab on" data-v="side">左右並排</button>
      <button class="tab" data-v="inline">合併檢視</button>
      <button class="tab" data-v="list">變更清單</button>
      <button class="tab" data-v="req">需求編號</button>
      <div class="tools"><label class="chk" style="margin:0"><input type="checkbox" id="chkAll">顯示全部內容</label></div>
    </div>
    <div id="view"></div>
  </section>
  <aside id="review"></aside>
</main>
<footer>
  <span>新增 <b class="cA" id="fA">0</b></span>
  <span>修改 <b class="cM" id="fM">0</b></span>
  <span>刪除 <b class="cD" id="fD">0</b></span>
  <span>移動 <b class="cV" id="fV">0</b></span>
  <span>｜ 已審 <b id="fR">0/0</b></span>
  <span>需改程式 <b id="fP">0</b></span>
  <span class="grow muted" id="fInfo"></span>
  <button class="sm" id="btnPrev" title="上一筆 (F7)">◀ F7</button>
  <span id="fPos">–</span>
  <button class="sm" id="btnNext" title="下一筆 (F8)">F8 ▶</button>
</footer>

<dialog id="dlgImport">
  <div class="dh"><span>匯入規格書版本</span><button class="sm" data-close>✕</button></div>
  <div class="db">
    <div class="row"><label>專案</label><b id="impProj"></b></div>
    <div class="drop" id="impDrop">拖曳 .docx / .txt / .md 檔案到這裡，或 <button id="impPick">選擇檔案</button>
      <input type="file" id="impFile" accept=".docx,.txt,.md,.markdown,.csv,.tsv" multiple hidden>
      <div id="impFiles" class="small" style="margin-top:8px"></div></div>
    <div class="row"><label>或貼上文字</label><span class="muted small">（Markdown 標題 # 與表格 | 會自動辨識）</span></div>
    <textarea id="impText" rows="7" placeholder="在此貼上規格書內容…"></textarea>
    <div class="row" style="margin-top:10px"><label>版本名稱</label><input type="text" id="impVer" placeholder="例如 v1.3（多檔時以檔名為版本名）" style="flex:1"></div>
    <div class="row"><label>文字編碼</label><select id="impEnc"><option value="auto">自動偵測</option><option value="utf-8">UTF-8</option><option value="big5">Big5</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option></select><span class="muted small">僅適用 txt / md</span></div>
  </div>
  <div class="df"><button data-close>取消</button><button class="pri" id="impGo">匯入</button></div>
</dialog>

<dialog id="dlgSet">
  <div class="dh"><span>比對選項與設定</span><button class="sm" data-close>✕</button></div>
  <div class="db">
    <b>正規化（比對時忽略）</b>
    <label class="chk"><input type="checkbox" data-o="ignoreSpace">空白、換行、Tab</label>
    <label class="chk"><input type="checkbox" data-o="ignoreWidth">全形 / 半形差異</label>
    <label class="chk"><input type="checkbox" data-o="ignorePunct">標點符號</label>
    <label class="chk"><input type="checkbox" data-o="ignoreCase">英文大小寫</label>
    <label class="chk"><input type="checkbox" data-o="ignoreNumbering">段首章節 / 項目編號（如 3.2.1、（一）、1)）</label>
    <hr style="border:0;border-top:1px solid var(--bd)">
    <b>比對演算法</b>
    <div class="row"><label>修改判定門檻</label><input type="range" min="0.2" max="0.9" step="0.05" data-o="th" id="thR"><span id="thV"></span><span class="muted small">相似度達門檻視為「修改」，否則為刪除＋新增</span></div>
    <label class="chk"><input type="checkbox" data-o="moveDetect">偵測段落搬移（含搬移後小幅修改）</label>
    <label class="chk"><input type="checkbox" data-o="numHeading">無標題樣式時，依「3.2.1 標題」「第一章」等文字判斷章節</label>
    <hr style="border:0;border-top:1px solid var(--bd)">
    <b>顯示</b>
    <div class="row"><label>上下文段數</label><input type="number" min="0" max="20" data-o="ctx" style="width:80px"><span class="muted small">未勾「顯示全部內容」時，變更前後保留的相同段落數</span></div>
    <div class="row"><label>需求編號格式</label><input type="text" data-o="reqRe" style="flex:1;font-family:Consolas,monospace"><span class="muted small">正規表示式</span></div>
    <label class="chk"><input type="checkbox" data-o="dark">深色模式</label>
  </div>
  <div class="df"><button id="setReset">還原預設</button><span style="flex:1"></span><button data-close>取消</button><button class="pri" id="setGo">套用</button></div>
</dialog>

<dialog id="dlgManage">
  <div class="dh"><span>專案與版本管理</span><button class="sm" data-close>✕</button></div>
  <div class="db" id="mgBody"></div>
  <div class="df"><button data-close>關閉</button></div>
</dialog>

<input type="file" id="restoreFile" accept=".json" hidden>
<div id="toast"></div>
<div id="busy"><div id="busyMsg">處理中…</div></div>
<script>
/* ================= DiffEngine（自包含，可放進 Web Worker） ================= */
function SpecEngine(){
  const PUNCT1=/[\p{P}\p{S}]/u, PUNCTG=/[\p{P}\p{S}]/gu, SPACE1=/\s/u;
  const NUMRE=/^\s*(?:\d+(?:\.\d+)*\.?|[（(]?[一二三四五六七八九十百]+[)）、.．]|[（(]\d+[)）]|\d+[)）、]|[a-zA-Z][.)）]|第[一二三四五六七八九十百零〇\d]+[章節条條款項篇])\s*/;

  function norm(s,o){
    if(!s) return '';
    if(o.ignoreWidth) s=s.normalize('NFKC');
    if(o.ignoreCase) s=s.toLowerCase();
    if(o.ignoreNumbering) s=s.replace(NUMRE,'');
    if(o.ignorePunct) s=s.replace(PUNCTG,'');
    if(o.ignoreSpace) s=s.replace(/\s+/g,'');
    else s=s.replace(/[ \t\u3000]+/g,' ').replace(/ *\n */g,'\n').trim();
    return s;
  }
  function charKey(c,o){
    if(o.ignoreSpace&&SPACE1.test(c)) return null;
    if(o.ignorePunct&&PUNCT1.test(c)) return null;
    if(o.ignoreWidth) c=c.normalize('NFKC');
    if(o.ignoreCase) c=c.toLowerCase();
    return c;
  }
  function blockKey(b,o){
    if(b.t==='table') return 'T\u241D'+b.rows.map(r=>r.map(c=>norm(c,o)).join('\u241F')).join('\u241E');
    return norm(b.text,o);
  }

  /* ---- Myers O(ND)，含上限；超過上限回傳 null ---- */
  function myers(a,a0,a1,b,b0,b1,cap){
    const n=a1-a0,m=b1-b0,max=n+m,lim=Math.min(max,cap),off=max+1;
    const v=new Int32Array(2*max+3),trace=[];
    for(let d=0;d<=lim;d++){
      trace.push(v.slice(off-d,off+d+1));
      for(let k=-d;k<=d;k+=2){
        let x=(k===-d||(k!==d&&v[off+k-1]<v[off+k+1]))?v[off+k+1]:v[off+k-1]+1;
        let y=x-k;
        while(x<n&&y<m&&a[a0+x]===b[b0+y]){x++;y++;}
        v[off+k]=x;

/* ================= ZipReader（零依賴，使用原生 DecompressionStream） ================= */
const ZipReader={
  async open(buf){

    let eocd=-1;
    for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
    if(eocd<0) throw new Error('不是有效的 ZIP / DOCX 檔案');
    const cnt=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
    const td=new TextDecoder('utf-8'),entries={};
    for(let n=0;n<cnt;n++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
      const name=td.decode(u8.subarray(p+46,p+46+nl));
      entries[name]={method,csize,lo};p+=46+nl+el+cl;
    }
    return {
      has:n=>!!entries[n],
      async bytes(n){
        const e=entries[n];if(!e) return null;
        const nl=dv.getUint16(e.lo+26,true),el=dv.getUint16(e.lo+28,true),st=e.lo+30+nl+el;
        const data=u8.subarray(st,st+e.csize);
        if(e.method===0) return data;
        if(e.method!==8) throw new Error('不支援的壓縮方式：'+e.method);
        if(typeof DecompressionStream==='undefined') throw new Error('瀏覽器不支援 DecompressionStream，請使用新版 Edge / Chrome');
        const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(s).arrayBuffer());
      },
      async text(n){const b=await this.bytes(n);return b?new TextDecoder('utf-8').decode(b):null;}
    };
  }
};

/* ================= 章節文字判斷 ================= */
function detectHeading(text){
  const t=(text||'').trim();
  if(!t||t.length>60||/[。；;，,：:]$/.test(t)) return 0;
  let m=t.match(/^(\d+(?:\.\d+){1,5})\.?\s*(?=[^\d.\s])/);
  if(m) return Math.min(m[1].split('.').length,6);
  if(/^\d+\.?(?:\s+|[、　])(?=\S)/.test(t)) return 1;
  if(/^第[一二三四五六七八九十百零〇\d]+[章篇部]/.test(t)) return 1;
  if(/^第[一二三四五六七八九十百零〇\d]+節/.test(t)) return 2;
  return 0;
}

            const b={t:'h',lv:Math.min(lv,9),text:text.trim()};
            if(num&&!/^\s*(\d|第)/.test(text)){
              cnt[lv]++;for(let k=lv+1;k<cnt.length;k++)cnt[k]=0;
              b.num=cnt.slice(1,lv+1).map(x=>x||1).join('.');
            }
            blocks.push(b);
          } else blocks.push({t:'p',text});
        } else if(ln==='tbl'){
          const rows=this.tableRows(c);
          if(rows.some(r=>r.some(x=>x))) blocks.push({t:'table',rows,text:rows.map(r=>r.join(' | ')).join('\n')});
        } else if(ln==='sdt'){const sc=this.child(c,'sdtContent');if(sc)walk(sc);}
        else if(ln==='customXml'||ln==='ins'||ln==='smartTag') walk(c);
      }
    };
    walk(body);
    if(!styled&&opts.numHeading) for(const b of blocks){if(b.t==='p'){const lv=detectHeading(b.text);if(lv){b.t='h';b.lv=lv;b.text=b.text.trim();}}}
    return blocks;
  }
};

/* ================= TextLoader（多編碼偵測 + 純文字 / Markdown 解析） ================= */
const TextLoader={
  decode(u8,enc){
    if(enc&&enc!=='auto') return new TextDecoder(enc).decode(u8);
    if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if(u8[0]===0xFF&&u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if(u8[0]===0xFE&&u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    let z=0;const n=Math.min(u8.length,2000);for(let i=0;i<n;i++)if(u8[i]===0)z++;
    if(n&&z/n>0.2) return new TextDecoder('utf-16le').decode(u8);
    try{return new TextDecoder('utf-8',{fatal:true}).decode(u8);}catch(e){}
    try{return new TextDecoder('big5').decode(u8);}catch(e){}
    return new TextDecoder('utf-8').decode(u8);
  },
  parse(text,isMd,opts){
    const lines=text.replace(/\r\n?/g,'\n').split('\n'),blocks=[];
    let para=[];
    const flushP=()=>{const t=para.join('\n').trim();if(t){const lv=opts.numHeading?detectHeading(t):0;blocks.push(lv&&!t.includes('\n')?{t:'h',lv,text:t}:{t:'p',text:t});}para=[];};
    const pushTable=rows=>{if(rows.length)blocks.push({t:'table',rows,text:rows.map(r=>r.join(' | ')).join('\n')});};
    for(let i=0;i<lines.length;i++){
      const ln=lines[i];
      if(isMd){
        const h=ln.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
        if(h){flushP();blocks.push({t:'h',lv:h[1].length,text:h[2]});continue;}
        if(/^\s*\|.*\|\s*$/.test(ln)){
          flushP();const rows=[];
          while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){
            const L=lines[i].trim();
            if(!/^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(L)) rows.push(L.slice(1,-1).split('|').map(x=>x.trim()));
            i++;
          }
          i--;pushTable(rows);continue;
        }
        if(!ln.trim()){flushP();continue;}
        para.push(ln);
      }else{
        /* 純文字：每一行為一段；連續含 Tab 且欄數一致的行視為表格（例如從 Excel 貼上） */
        if(ln.includes('\t')){
          const nc=ln.split('\t').length;let j=i;const rows=[];
          while(j<lines.length&&lines[j].includes('\t')&&lines[j].split('\t').length===nc){rows.push(lines[j].split('\t').map(x=>x.trim()));j++;}
          if(rows.length>=2){pushTable(rows);i=j-1;continue;}
        }
        para.push(ln);flushP();
      }
    }
    flushP();
    return blocks;
  }
};

/* ================= Store（IndexedDB 封裝；不可用時退回記憶體） ================= */
const Store={
  db:null,mem:null,
  open(){
    return new Promise(res=>{
      let r;
      try{r=indexedDB.open('SpecDiffDB',1);}catch(e){this.useMem();return res(false);}
      r.onupgradeneeded=()=>{
        const d=r.result;
        d.createObjectStore('projects',{keyPath:'id'});
        d.createObjectStore('documents',{keyPath:'id'}).createIndex('projectId','projectId');
        d.createObjectStore('reviews',{keyPath:['pair','key']}).createIndex('pair','pair');
        d.createObjectStore('settings',{keyPath:'key'});
      };
      r.onsuccess=()=>{this.db=r.result;res(true);};
      r.onerror=()=>{this.useMem();res(false);};
    });
  },
  useMem(){this.mem={projects:new Map(),documents:new Map(),reviews:new Map(),settings:new Map()};},
  mk(store,v){return store==='reviews'?v.pair+'\u0001'+v.key:(store==='settings'?v.key:v.id);},
  req(store,mode,fn){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,mode),s=tx.objectStore(store),r=fn(s);
      tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
    });
  },
  get(store,key){
    if(this.mem) return Promise.resolve(this.mem[store].get(Array.isArray(key)?key.join('\u0001'):key));
    return this.req(store,'readonly',s=>s.get(key));
  },
  all(store,index,val){
    if(this.mem){let a=[...this.mem[store].values()];if(index)a=a.filter(x=>x[index]===val);return Promise.resolve(a);}
    return this.req(store,'readonly',s=>index?s.index(index).getAll(val):s.getAll());
  },
  put(store,v){
    if(this.mem){this.mem[store].set(this.mk(store,v),v);return Promise.resolve();}
    return this.req(store,'readwrite',s=>s.put(v));
  },
  putMany(store,arr){
    if(this.mem){arr.forEach(v=>this.mem[store].set(this.mk(store,v),v));return Promise.resolve();}
    return this.req(store,'readwrite',s=>{arr.forEach(v=>s.put(v));});
  },
  del(store,key){
    if(this.mem){this.mem[store].delete(Array.isArray(key)?key.join('\u0001'):key);return Promise.resolve();}
    return this.req(store,'readwrite',s=>s.delete(key));
  }
};

function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}

/* ---------- 比對執行（Web Worker，失敗時退回主執行緒） ---------- */
let WORKER_URL=null;
function engineRun(A,B,o){
  return new Promise((res,rej)=>{
    const local=()=>setTimeout(()=>{try{res(LocalEngine.compare(A,B,o));}catch(e){rej(e);}},30);
    let w=null;
    try{
      if(!WORKER_URL)WORKER_URL=URL.createObjectURL(new Blob([`const E=(${SpecEngine.toString()})();onmessage=e=>{try{postMessage({ok:1,r:E.compare(e.data.A,e.data.B,e.data.o)})}catch(x){postMessage({ok:0,e:String(x&&x.message||x)})}}`],{type:'text/javascript'}));
      w=new Worker(WORKER_URL);
    }catch(e){w=null;}
    if(!w) return local();
    let done=false;
    w.onmessage=e=>{done=true;w.terminate();e.data.ok?res(e.data.r):rej(new Error(e.data.e));};
    w.onerror=e=>{e.preventDefault&&e.preventDefault();w.terminate();if(!done){done=true;local();}};
    try{w.postMessage({A,B,o});}catch(e){w.terminate();local();}
  });
}

async function runCompare(){
  if(!S.oldId||!S.newId||!S.docCache.get(S.oldId)||!S.docCache.get(S.newId)){S.res=null;renderAll();return;}
  if(S.oldId===S.newId){toast('請選擇兩個不同的版本');return;}
  S.A=S.docCache.get(S.oldId);S.B=S.docCache.get(S.newId);S.home=false;
  busy(true,'比對中…');
  try{
    const res=await engineRun(S.A.blocks,S.B.blocks,S.opts);
    S.res=res;post(res);
    S.pair=S.oldId+'|'+S.newId;
    S.reviews=new Map((await Store.all('reviews','pair',S.pair)).map(r=>[r.key,r]));
    S.cur=S.changes.length?0:-1;S.expanded.clear();S.searchRow=-1;
    renderAll();
    $('#fInfo').textContent=`比對耗時 ${res.ms} ms ・ 舊版 ${S.A.blocks.length} 段 / 新版 ${S.B.blocks.length} 段`;
    if(S.cur>=0)select(0,false);
  }catch(e){console.error(e);toast('比對失敗：'+e.message,5000);}
  finally{busy(false);saveLast();}
}

/* ---------- 後處理：章節、變更清單、需求編號 ---------- */
function post(res){
  const A=S.A.blocks,B=S.B.blocks,rows=res.rows,heads=[],stack=[],occ=new Map(),changes=[];
  let re=null;try{re=S.opts.reqRe?new RegExp(S.opts.reqRe,'g'):null;}catch(e){toast('需求編號正規表示式有誤，已略過');}
  const ids=t=>{if(!re||!t)return [];re.lastIndex=0;return [...new Set(t.match(re)||[])];};
  let sec=-1;
  rows.forEach((r,i)=>{
    const blk=r.b!=null?B[r.b]:A[r.a];
    r.lv=(blk.t==='h'&&r.t!=='away')?blk.lv:0;
    if(r.lv){
      while(stack.length&&heads[stack[stack.length-1]].lv>=r.lv)stack.pop();
      const h={row:i,lv:r.lv,text:blk.text,num:blk.num||'',t:r.t,parent:stack.length?stack[stack.length-1]:-1,cnt:0};
      h.path=(h.parent>=0?heads[h.parent].path+' › ':'')+(h.num?h.num+' ':'')+h.text;
      heads.push(h);stack.push(heads.length-1);sec=heads.length-1;
    }
    r.sec=sec;r.ci=undefined;
    if(r.t!=='eq'&&r.t!=='away'){
      const ta=r.a!=null?A[r.a].text:'',tb=r.b!=null?B[r.b].text:'';
      let k=hash(ta)+'.'+hash(tb);const n=occ.get(k)||0;occ.set(k,n+1);if(n)k+='.'+n;
      r.ci=changes.length;
      changes.push({row:i,key:k,t:r.t,secPath:sec>=0?heads[sec].path:'（文件開頭）',req:[...new Set([...ids(ta),...ids(tb)])]});
      for(let s=sec;s>=0;s=heads[s].parent)heads[s].cnt++;
    }
  });
  /* 需求編號彙整 */
  const rm=new Map(),g=id=>{if(!rm.has(id))rm.set(id,{id,inA:false,inB:false,ch:[]});return rm.get(id);};
  A.forEach(b=>ids(b.text).forEach(id=>g(id).inA=true));
  B.forEach(b=>ids(b.text).forEach(id=>g(id).inB=true));
  changes.forEach((c,ci)=>c.req.forEach(id=>g(id).ch.push(ci)));
  S.req=[...rm.values()].map(x=>({...x,st:!x.inA&&x.inB?'新增':x.inA&&!x.inB?'刪除':x.ch.length?'變更':'未變'}))
    .sort((p,q)=>p.id.localeCompare(q.id,'zh-Hant',{numeric:true}));
  S.rows=rows;S.heads=heads;S.changes=changes;
  S.preCnt=changes.filter(c=>rows[c.row].sec<0).length;
}

/* ---------- 內容 HTML ---------- */
const hWrap=(blk,inner)=>blk.t==='h'?`<span class="h${blk.lv}">${blk.num?`<span class="hn">${esc(blk.num)}</span>`:''}${inner}</span>`:inner;
function plainTable(rows){return '<table class="dt">'+rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table>';}
function blockHTML(b){return b.t==='table'?plainTable(b.rows):hWrap(b,esc(b.text));}
function segHTML(segs,side){
  let h='';
  for(const s of segs){
    if(s.op==='=')h+=esc(side==='a'?s.a:s.b);
    else if(s.op==='-'){if(side!=='b')h+=`<del>${esc(s.a)}</del>`;}
    else if(side!=='a')h+=`<ins>${esc(s.b)}</ins>`;
  }
  return h;
}
function tdiffHTML(r,side){
  const ta=S.A.blocks[r.a].rows,tb=S.B.blocks[r.b].rows;
  const nc=Math.max(1,...ta.map(x=>x.length),...tb.map(x=>x.length));
  let h='<table class="dt">';
  for(const x of r.tbl){
    if((side==='a'&&x.a==null)||(side==='b'&&x.b==null)){h+=`<tr class="x-ph"><td colspan="${nc}"></td></tr>`;continue;}
    let cells;
    if(x.t==='mod')cells=x.cells.map(sg=>segHTML(sg,side));
    else{const row=x.t==='del'?ta[x.a]:x.t==='add'?tb[x.b]:(side==='a'?ta[x.a]:tb[x.b]);cells=row.map(esc);}
    h+=`<tr class="${x.t==='eq'?'':'x-'+x.t}">`+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
  }
  return h+'</table>';
}
function diffBody(r,side){return r.tbl?tdiffHTML(r,side):hWrap(S.B.blocks[r.b],segHTML(r.segs,side));}
function cellSide(r,side){
  const A=S.A.blocks,B=S.B.blocks;
  switch(r.t){
    case 'eq':return blockHTML(side==='a'?A[r.a]:B[r.b]);
    case 'del':return side==='a'?blockHTML(A[r.a]):'';
    case 'add':return side==='b'?blockHTML(B[r.b]):'';
    case 'mod':return r.tbl?tdiffHTML(r,side):hWrap(side==='a'?A[r.a]:B[r.b],segHTML(r.segs,side));
    case 'move':return side==='a'?`<span class="ph">⇲ 由舊版第 ${r.a+1} 段移入${r.edited?'（並有修改）':''}</span>`
      :`<span class="mv">移入</span>`+(r.edited?diffBody(r,'b'):blockHTML(B[r.b]));
    case 'away':{
      if(side==='b')return `<span class="ph">⇱ 已移至新版第 ${S.rows[r.to].b+1} 段</span>`;
      const m=S.rows[r.to];
      return `<span class="mv">移出</span>`+(m.edited?(m.tbl?tdiffHTML(m,'a'):hWrap(A[r.a],segHTML(m.segs,'a'))):blockHTML(A[r.a]));
    }
  }
  return '';
}
function cellInline(r){
  const A=S.A.blocks,B=S.B.blocks;
  switch(r.t){
    case 'eq':case 'add':return blockHTML(B[r.b]);
    case 'del':return blockHTML(A[r.a]);
    case 'mod':return r.tbl?tdiffHTML(r,'i'):hWrap(B[r.b],segHTML(r.segs,'i'));
    case 'move':return `<span class="mv">由舊版第 ${r.a+1} 段移入</span>`+(r.edited?diffBody(r,'i'):blockHTML(B[r.b]));
    case 'away':return `<span class="mv">已移至新版第 ${S.rows[r.to].b+1} 段</span><span class="tx">${blockHTML(A[r.a])}</span>`;
  }
  return '';
}

async function homeAction(e){

}
function computeVis(){
  const n=S.rows.length,vis=new Uint8Array(n),ctx=Math.max(0,+S.opts.ctx||0);
  if(S.showAll)vis.fill(1);
  else S.rows.forEach((r,i)=>{if(r.t!=='eq'){for(let k=Math.max(0,i-ctx);k<=Math.min(n-1,i+ctx);k++)vis[k]=1;}else if(r.lv)vis[i]=1;});
  const gapOf=new Int32Array(n).fill(-1);
  for(let i=0;i<n;){if(vis[i]){i++;continue;}const st=i;while(i<n&&!vis[i]){gapOf[i]=st;i++;}}
  S.gapOf=gapOf;return vis;
}
function rowHTML(r,i,one){
  const chg=r.t!=='eq',ci=r.ci;
  const rv=ci!=null?getRv(ci):null;
  const cls=`r t-${r.t}${one?' one':''}${chg?' chg':''}${ci!=null&&ci===S.cur?' cur':''}${rv?' rv':''}`;
  const tag=ci!=null?tagHTML(ci):'';
  if(one){
    const ln=r.b!=null&&r.t!=='away'?r.b+1:'−'+(r.a+1);
    return `<div class="${cls}" id="r${i}" data-r="${i}"><div class="c"><span class="ln">${ln}</span>${cellInline(r)}${tag}</div></div>`;
  }
  const la=r.a!=null&&r.t!=='move'?r.a+1:'',lb=r.b!=null?r.b+1:'';
  return `<div class="${cls}" id="r${i}" data-r="${i}"><div class="c a"><span class="ln">${la}</span>${cellSide(r,'a')}</div><div class="c b"><span class="ln">${lb}</span>${cellSide(r,'b')}${tag}</div></div>`;
}
function renderDiff(){
  const v=$('#view'),one=S.view==='inline',vis=computeVis(),n=S.rows.length,parts=[];
  if(!S.changes.length)parts.push('<div class="gap" style="cursor:default">✔ 依目前比對選項，兩個版本內容相同</div>');
  for(let i=0;i<n;){
    if(vis[i]||S.expanded.has(S.gapOf[i])){parts.push(rowHTML(S.rows[i],i,one));i++;continue;}
    const st=i;while(i<n&&!vis[i])i++;
    parts.push(`<div class="gap" data-g="${st}">⋯ 省略 ${i-st} 段相同內容（點擊展開）</div>`);
  }
  v.innerHTML=parts.join('');
}
function reveal(row){
  const g=S.gapOf?S.gapOf[row]:-1;
  if(g>=0&&!S.expanded.has(g)){S.expanded.add(g);renderDiff();}
}

    if(mq&&!(rv.module||'').toLowerCase().includes(mq))return;
    if(q){const r=S.rows[c.row];const t=((r.a!=null?S.A.blocks[r.a].text:'')+'\n'+(r.b!=null?S.B.blocks[r.b].text:'')+'\n'+c.secPath+'\n'+c.req.join(' ')+'\n'+(rv.note||'')).toLowerCase();if(!t.includes(q))return;}

function select(ci,scroll=true){
  if(ci==null||ci<0||ci>=S.changes.length)return;

  $$('#view .cur').forEach(e=>e.classList.remove('cur'));

    const row=S.changes[ci].row;reveal(row);

  }else if(S.view==='list'){
    const el=$(`#view .li[data-c="${ci}"]`);if(el){el.classList.add('cur');if(scroll)el.scrollIntoView({block:'nearest'});}
  }
  if(!S.home)renderReview();renderStatus();markOutline();

function nav(d){
  if(!S.changes.length)return;
  const arr=S.view==='list'?filtered():S.changes.map((_,i)=>i);
  if(!arr.length)return;
  let i=arr.indexOf(S.cur);
  if(i<0){
    if(d>0){i=arr.findIndex(x=>x>S.cur);if(i<0)i=arr.length-1;}
    else{i=-1;for(let k=arr.length-1;k>=0;k--)if(arr[k]<S.cur){i=k;break;}if(i<0)i=0;}
  }
  else i=Math.min(arr.length-1,Math.max(0,i+d));
  select(arr[i]);
}

function doSearch(dir){
  const q=$('#q').value.trim().toLowerCase();if(!q||!S.res)return;
  leaveHome();
  if(S.view==='list'){S.lf.q=q;renderListItems();return;}
  if(S.view==='req'){S.view='side';renderView();}
  const n=S.rows.length,A=S.A.blocks,B=S.B.blocks;
  let st=S.searchRow>=0?S.searchRow:(S.cur>=0?S.changes[S.cur].row:-1);
  for(let k=1;k<=n;k++){
    const i=((st+dir*k)%n+n)%n,r=S.rows[i];
    const t=((r.a!=null?A[r.a].text:'')+'\n'+(r.b!=null?B[r.b].text:'')).toLowerCase();
    if(t.includes(q)){
      S.searchRow=i;
      const ci=r.ci!=null?r.ci:(r.t==='away'?S.rows[r.to].ci:null);
      reveal(i);
      if(ci!=null&&r.t!=='away')select(ci);
      const el=document.getElementById('r'+i);
      if(el){el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
      return;
    }
  }
  toast('找不到「'+q+'」');
}

async function loadProjects(){S.projects=(await Store.all('projects')).sort((a,b)=>a.createdAt-b.createdAt);}
async function loadProject(pid,sel){
  S.pid=pid||null;S.docs=[];S.docCache.clear();S.res=null;S.changes=[];S.cur=-1;
  if(S.pid){
    S.docs=(await Store.all('documents','projectId',S.pid)).sort((a,b)=>a.importedAt-b.importedAt);
    S.docs.forEach(d=>S.docCache.set(d.id,d));
  }
  const has=id=>id&&S.docCache.has(id);
  S.oldId=sel&&has(sel.oldId)?sel.oldId:(S.docs.length>=2?S.docs[S.docs.length-2].id:null);
  S.newId=sel&&has(sel.newId)?sel.newId:(S.docs.length>=2?S.docs[S.docs.length-1].id:(S.docs[0]?.id||null));
  renderAll();
  if(S.oldId&&S.newId&&S.oldId!==S.newId)await runCompare();else saveLast();
}
async function newProject(name){
  name=name||prompt('新專案名稱','新專案');
  if(!name||!name.trim())return null;
  const p={id:uid(),name:name.trim(),createdAt:Date.now()};
  await Store.put('projects',p);S.projects.push(p);
  await loadProject(p.id);return p;
}
async function deleteReviewsForDoc(ids){
  const all=await Store.all('reviews');

}

async function parseFile(f,enc){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='doc')throw new Error('不支援舊版 .doc，請在 Word 中「另存新檔」為 .docx');
  if(ext==='pdf')throw new Error('暫不支援 PDF，請轉為 docx 或複製文字後貼上');
  const buf=await f.arrayBuffer();
  if(ext==='docx')return DocxParser.parse(buf,S.opts);
  const text=TextLoader.decode(new Uint8Array(buf),enc);
  return TextLoader.parse(text,ext==='md'||ext==='markdown',S.opts);
}
async function doImport(){
  const enc=$('#impEnc').value,ver=$('#impVer').value.trim(),txt=$('#impText').value;
  const items=impFiles.map(f=>({f}));if(txt.trim())items.push({text:txt});
  if(!items.length){toast('請選擇檔案或貼上文字');return;}
  const before=S.docs.length?S.docs[S.docs.length-1].id:null,added=[];
  busy(true,'解析文件中…');
  try{
    for(const it of items){
      let blocks;
      if(it.f)blocks=await parseFile(it.f,enc);
      else blocks=TextLoader.parse(it.text,/^#{1,6}\s/m.test(it.text)||/^\s*\|.*\|\s*$/m.test(it.text),S.opts);
      if(!blocks.length)throw new Error((it.f?it.f.name:'貼上的文字')+' 沒有可比對的內容');
      const label=items.length===1&&ver?ver:(it.f?it.f.name.replace(/\.[^.]+$/,''):(ver||'貼上 '+fmt(Date.now())));
      const d={id:uid(),projectId:S.pid,version:label,fileName:it.f?it.f.name:'(貼上文字)',importedAt:Date.now()+added.length,blocks,
        stats:{blocks:blocks.length,heads:blocks.filter(b=>b.t==='h').length,tables:blocks.filter(b=>b.t==='table').length}};
      await Store.put('documents',d);added.push(d);
    }
  }catch(e){busy(false);toast('匯入失敗：'+e.message,6000);return;}
  busy(false);$('#dlgImport').close();
  const last=added[added.length-1];
  const sel={newId:last.id,oldId:added.length>=2?added[added.length-2].id:before};
  toast(`已匯入 ${added.length} 個版本：`+added.map(d=>`${d.version}（${d.stats.blocks} 段、${d.stats.heads} 標題、${d.stats.tables} 表格）`).join('；'),5000);
  await loadProject(S.pid,sel);
}

function impactData(){
  const m=new Map();
  S.changes.forEach((c,ci)=>{const rv=getRv(ci);if(![2,3,4].includes(rv.status))return;
    const mods=(rv.module||'').split(/[,，;；、\s]+/).filter(Boolean);if(!mods.length)mods.push('(未指定模組)');
    for(const md of mods){if(!m.has(md))m.set(md,{mod:md,s2:0,s3:0,s4:0,ids:[],secs:new Set(),req:new Set()});const x=m.get(md);x['s'+rv.status]++;x.ids.push(ci+1);x.secs.add(c.secPath);c.req.forEach(q=>x.req.add(q));}
  });
  return [...m.values()].sort((a,b)=>a.mod.localeCompare(b.mod,'zh-Hant'));
}

async function exportBackup(){
  const data={app:'SpecDiff',version:1,exportedAt:new Date().toISOString(),
    projects:await Store.all('projects'),documents:await Store.all('documents'),reviews:await Store.all('reviews'),settings:await Store.all('settings')};
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  download(JSON.stringify(data),`SpecDiff_backup_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`,'application/json');

async function restoreBackup(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='SpecDiff')throw new Error('不是 SpecDiff 備份檔');
    if(!confirm(`將合併還原：專案 ${data.projects.length}、版本 ${data.documents.length}、審查 ${data.reviews.length} 筆。\n相同 ID 的資料會被覆蓋，確定嗎？`))return;
    busy(true,'還原中…');
    await Store.putMany('projects',data.projects||[]);await Store.putMany('documents',data.documents||[]);
    await Store.putMany('reviews',data.reviews||[]);
    await loadProjects();busy(false);
    toast('還原完成');await loadProject(S.pid&&S.projects.some(p=>p.id===S.pid)?S.pid:S.projects[0]?.id);
  }catch(e){busy(false);toast('還原失敗：'+e.message,5000);}
}

    if(S.view!=='side'&&S.view!=='inline'){S.view='side';S.home=false;renderView();}
    leaveHome();reveal(row);
    const ci=S.changes.findIndex(c=>c.row>=row&&(h<0||isUnder(S.rows[c.row].sec,h)));
    if(ci>=0)select(ci,false);
    const t=document.getElementById('r'+row);if(t){t.scrollIntoView({block:'start'});requestAnimationFrame(()=>t.scrollIntoView({block:'start'}));}
  });
  $('#outline').addEventListener('change',e=>{if(e.target.id==='olOnly'){S.olOnly=e.target.checked;renderOutline();}});
  /* 審查面板 */
  $('#review').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b&&S.cur>=0)setReview(S.cur,{status:+b.dataset.s});});
  $('#review').addEventListener('input',e=>{
    if(S.cur<0)return;const ci=S.cur;
    const patch=e.target.id==='rvMod'?{module:e.target.value.trim()}:e.target.id==='rvNote'?{note:e.target.value}:null;
    if(!patch)return;
    const v={...getRv(ci),...patch};S.reviews.set(S.changes[ci].key,{...v,pair:S.pair,key:S.changes[ci].key});
    clearTimeout(saveT);saveT=setTimeout(()=>setReview(ci,patch,false),400);
  });
  /* 搜尋 */
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch(e.shiftKey?-1:1);}else if(e.key==='Escape'){e.target.value='';S.lf.q='';if(S.view==='list')renderListItems();e.target.blur();}});
  $('#q').addEventListener('input',e=>{S.searchRow=-1;if(S.view==='list'){S.lf.q=e.target.value.trim();renderListItems();}});
  /* 匯入對話框 */
  $('#impPick').onclick=e=>{e.preventDefault();$('#impFile').click();};
  $('#impFile').onchange=e=>{impFiles.push(...e.target.files);e.target.value='';showImpFiles();};
  $('#impFiles').onclick=e=>{const a=e.target.closest('[data-rmf]');if(a){impFiles.splice(+a.dataset.rmf,1);showImpFiles();}};
  $('#impGo').onclick=doImport;
  /* 管理對話框 */
  $('#mgBody').addEventListener('change',async e=>{
    const t=e.target;
    if(t.dataset.pn){const p=S.projects.find(x=>x.id===t.dataset.pn);p.name=t.value.trim()||p.name;await Store.put('projects',p);renderSelectors();}
    if(t.dataset.dv){const d=S.docCache.get(t.dataset.dv);d.version=t.value.trim()||d.version;await Store.put('documents',d);renderSelectors();}
  });
  $('#mgBody').addEventListener('click',async e=>{
    const t=e.target;
    if(t.dataset.pdel){
      const p=S.projects.find(x=>x.id===t.dataset.pdel);
      if(!confirm(`刪除專案「${p.name}」及其所有版本與審查紀錄？此動作無法復原。`))return;
      const docs=await Store.all('documents','projectId',p.id);
      for(const d of docs)await Store.del('documents',d.id);
      await deleteReviewsForDoc(docs.map(d=>d.id));await Store.del('projects',p.id);
      S.projects=S.projects.filter(x=>x.id!==p.id);
      await loadProject(S.pid===p.id?S.projects[0]?.id:S.pid,{oldId:S.oldId,newId:S.newId});renderManage();
    }
    if(t.dataset.ddel){
      const d=S.docCache.get(t.dataset.ddel);
      if(!confirm(`刪除版本「${d.version}」及相關審查紀錄？`))return;
      await Store.del('documents',d.id);await deleteReviewsForDoc([d.id]);
      await loadProject(S.pid,{oldId:S.oldId,newId:S.newId});renderManage();
    }
  });
  /* 拖曳匯入 */
  let dc=0;
  window.addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#wDrop')?.classList.add('on');$('#impDrop').classList.add('on');});
  window.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#wDrop')?.classList.remove('on');$('#impDrop').classList.remove('on');}});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{
    e.preventDefault();dc=0;$('#wDrop')?.classList.remove('on');$('#impDrop').classList.remove('on');
    const fs=[...(e.dataTransfer?.files||[])];if(!fs.length)return;
    if($('#dlgImport').open){impFiles.push(...fs);showImpFiles();}else openImport(fs);
  });
  /* 快捷鍵 */
  document.addEventListener('keydown',e=>{
    if(document.querySelector('dialog[open]'))return;
    if(e.altKey&&e.key.toLowerCase()==='h'){e.preventDefault();goHome();return;}
    if(e.key==='F7'){e.preventDefault();nav(-1);}
    else if(e.key==='F8'){e.preventDefault();nav(1);}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('#q').focus();$('#q').select();}
    else if(/^[0-4]$/.test(e.key)&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!isTyping(e.target)&&S.cur>=0&&!S.home){e.preventDefault();setReview(S.cur,{status:+e.key});}
  });
}
function isUnder(sec,h){for(let s=sec;s>=0;s=S.heads[s].parent)if(s===h)return true;return false;}

/* ---------- 啟動 ---------- */
(async function init(){
  const ok=await Store.open();
  if(!ok)toast('IndexedDB 無法使用，資料只保存在記憶體中（關閉頁面即遺失）',6000);
  const so=await Store.get('settings','opts');if(so)S.opts={...DEF,...so.value};
  applyTheme();bind();
  await loadProjects();
  const last=(await Store.get('settings','last'))?.value;
  const pid=last&&S.projects.some(p=>p.id===last.pid)?last.pid:S.projects[0]?.id;
  await loadProject(pid,last);
})();
</script>
