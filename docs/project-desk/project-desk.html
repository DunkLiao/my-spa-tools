    const noEstimate = tasks.filter((t) => !t.estimateMin && t.status !== 'done').length;

    const projects = state.activeProjectId === 'all'
      ? state.projects.filter((p) => p.status !== 'archived')
      : state.projects.filter((p) => p.id === state.activeProjectId);

    const projRows = projects.map((p) => {
      const ts = tasks.filter((t) => t.projectId === p.id);
      const n = ts.length;
      const pdone = ts.filter((t) => t.status === 'done').length;
      const cnt = Object.fromEntries(STATUSES.map((s) => [s.id, ts.filter((t) => t.status === s.id).length]));
      const pct = n ? Math.round((pdone / n) * 100) : 0;
      const pOver = ts.filter((t) => t.status !== 'done' && dueState(t) === 'overdue').length;
      return el('div', { class: 'proj-row' },
        el('div', { class: 'proj-row__top' },
          el('span', { class: 'dot', style: { background: p.color } }),
          el('span', { style: { overflow: 'hidden', 'text-overflow': 'ellipsis', 'white-space': 'nowrap' } }, p.name),
          pOver ? el('span', { class: 'chip chip--overdue', text: '逾期 ' + pOver }) : null,
          el('span', { class: 'proj-row__meta', text: pdone + '/' + n + ' · ' + pct + '%' })
        ),
        el('div', { class: 'bar' },
          ...STATUSES.map((s) => el('span', {
            class: 'is-' + s.id, title: s.label + ' ' + cnt[s.id],
            style: { width: (n ? (cnt[s.id] / n) * 100 : 0) + '%' },
          }))
        )
      );
    });

    const hourPct = Math.max(est, act) ? Math.round((act / Math.max(est, act)) * 100) : 0;

    statsEl.replaceChildren(
      el('div', { class: 'stat-tiles' },
        statTile(total, '任務總數'),
        statTile(open, '未完成'),
        statTile(overdue.length, '逾期', overdue.length ? 'stat--danger' : ''),
        statTile(week.length, '七天內到期', week.length ? 'stat--warn' : ''),
        statTile(rate + '%', '完成率', rate === 100 && total ? 'stat--ok' : '')
      ),
      el('div', { class: 'statgrid' },
        el('div', { class: 'panel' },
          el('div', { class: 'panel__head' }, el('h2', { text: '專案進度' }), el('span', { class: 'chip chip--plain', text: total + ' 筆任務' })),
          legend(STATUSES.map((s) => [s.label, 'var(--c-' + s.id + ')'])),
          projRows.length ? el('div', {}, ...projRows) : el('p', { class: 'hint', text: '沒有可顯示的專案。' })
        ),
        el('div', { class: 'panel' },
          el('div', { class: 'panel__head' }, el('h2', { text: '工時' })),
          el('div', { class: 'hours-line' },
            el('div', { class: 'hours-line__head' }, el('span', { text: '預估合計' }), el('strong', { text: fmtMinutes(est) || '0h' })),
            el('div', { class: 'bar' }, el('span', { style: { width: est ? '100%' : '0%' } })),
            el('div', { class: 'hours-line__head' }, el('span', { text: '實際合計' }), el('strong', { text: fmtMinutes(act) || '0h' })),
            el('div', { class: 'bar' }, el('span', { class: 'is-done', style: { width: hourPct + '%' } })),
            el('p', { class: 'hint' },
              est
                ? (act > est ? '已超出預估 ' + fmtMinutes(act - est) : '還剩 ' + fmtMinutes(est - act) + ' 可用')
                : '尚未填寫預估工時。'),
            noEstimate ? el('p', { class: 'hint', text: noEstimate + ' 個未完成任務沒有預估工時。' }) : null
          )
        )
      ),
      el('div', { class: 'statgrid' },
        el('div', { class: 'panel' },
          el('div', { class: 'panel__head' }, el('h2', { text: '逾期任務' }),
            el('span', { class: 'chip ' + (overdue.length ? 'chip--overdue' : 'chip--plain'), text: String(overdue.length) })),
          miniList(overdue.slice().sort(byDue).slice(0, 8), '沒有逾期任務，很好。')
        ),
        el('div', { class: 'panel' },
          el('div', { class: 'panel__head' }, el('h2', { text: '七天內到期' }),
            el('span', { class: 'chip ' + (week.length ? 'chip--today' : 'chip--plain'), text: String(week.length) })),
          miniList(week.slice().sort(byDue).slice(0, 8), '七天內沒有到期任務。')
        )
      )
    );
  }

  /* ───────── 日曆 / 時間軸 ───────── */
  function renderCal() {
    const cursor = state.calCursor;
    calMonth.hidden = state.calMode !== 'month';
    calTimeline.hidden = state.calMode !== 'timeline';

    if (state.calMode === 'month') {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      calTitle.textContent = year + ' 年 ' + (month + 1) + ' 月';
      const first = startOfMonth(cursor);
      const gridStart = startOfWeek(first);
      const tasks = filteredTasks().filter((t) => t.dueDate && parseDay(t.dueDate));
      const today = todayStr();
      const cells = [];
      for (let i = 0; i < 42; i += 1) {
        const d = addDays(gridStart, i);
        const dayStr = toDayStr(d);
        const dayTasks = tasks.filter((t) => t.dueDate === dayStr)
          .sort((a, b) => (PRIORITY_RANK[a.priority] ?? 9) - (PRIORITY_RANK[b.priority] ?? 9));
        const cls = ['cal-cell'];
        if (d.getMonth() !== month) cls.push('is-out');
        if (dayStr === today) cls.push('is-today');
        const shown = dayTasks.slice(0, 3);
        cells.push(el('button', {
          type: 'button', class: cls.join(' '),
          dataset: { act: 'open-day', day: dayStr },
          'aria-label': (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日，' + dayTasks.length + ' 個任務',
        },
          el('span', { class: 'cal-cell__num', text: String(d.getDate()) }),
          ...shown.map((t) => el('span', {
            class: 'cal-cell__chip' + (t.status === 'done' ? ' is-done' : ''),
            style: { '--pc': projectColor(t.projectId) },
            title: t.title,
            text: t.title,
          })),
          dayTasks.length > shown.length
            ? el('span', { class: 'cal-cell__more', text: '+' + (dayTasks.length - shown.length) + ' 更多' })
            : null
        ));
      }
      calGrid.replaceChildren(...cells);
      return;
    }

    /* 時間軸 */
    const rangeStart = startOfWeek(cursor);
    const days = 42;
    const rangeEnd = addDays(rangeStart, days - 1);
    const startStr = toDayStr(rangeStart);
    const endStr = toDayStr(rangeEnd);
    calTitle.textContent = fmtDay(startStr) + ' – ' + fmtDay(endStr);

    const rows = filteredTasks().map((t) => {
      if (!t.dueDate || !parseDay(t.dueDate)) return null;
      const s = t.startDate && parseDay(t.startDate) ? t.startDate : t.dueDate;
      const e = t.dueDate;
      if (e < startStr || s > endStr) return null;
      const cs = s < startStr ? startStr : s;
      const ce = e > endStr ? endStr : e;
      const offset = dayDiff(cs, startStr);
      const span = Math.max(1, dayDiff(ce, cs) + 1);
      return { t, left: (offset / days) * 100, width: (span / days) * 100 };
    }).filter(Boolean).sort((a, b) => a.left - b.left || a.t.title.localeCompare(b.t.title, 'zh-Hant'));

    const weeks = [];
    for (let w = 0; w < 6; w += 1) {
      weeks.push(el('span', { text: fmtDay(toDayStr(addDays(rangeStart, w * 7))) }));
    }

    timelineEl.replaceChildren(
      el('div', { class: 'tl-head' },
        el('span', { class: 'hint', text: '任務' }),
        el('div', { class: 'tl-weeks' }, ...weeks)
      ),
      el('div', { class: 'tl-body' },
        ...(rows.length ? rows.map(({ t, left, width }) => el('div', { class: 'tl-row' },
          el('button', { type: 'button', class: 'tl-row__label', dataset: { act: 'edit-task', id: t.id }, text: t.title, title: t.title }),
          el('div', { class: 'tl-track' },
            el('button', {
              type: 'button', class: 'tl-bar' + (t.status === 'done' ? ' is-done' : ''),
              dataset: { act: 'edit-task', id: t.id },
              style: { left: left + '%', width: width + '%', '--pc': t.status === 'done' ? 'var(--c-done)' : priorityColor(t.priority) },
              'aria-label': t.title + '，' + fmtDayFull(t.startDate || t.dueDate) + ' 到 ' + fmtDayFull(t.dueDate),
              text: width > 9 ? truncate(t.title, Math.max(6, Math.floor(width / 3))) : '',
              title: t.title + ' · ' + fmtDay(t.startDate || t.dueDate) + '–' + fmtDay(t.dueDate),
            })
          )
        )) : [el('p', { class: 'tl-note', text: '這段期間沒有安排任務（需要開始日或到期日）。' })])
      ),
      legend(PRIORITIES.map((p) => [p.label, priorityColor(p.id)]))
    );
  }

  const RENDERERS = {
    kanban: renderKanban,
    list: renderList,
    stats: renderStats,
    cal: renderCal,
  };
  /* ───────── toast ───────── */
  let toastTimer = null;

  function showToast(message, actionLabel, onAction) {
    toastMsg.textContent = message;
    if (actionLabel) {
      toastAct.hidden = false;
      toastAct.textContent = actionLabel;
      toastAct.onclick = () => {
        toastAct.onclick = null;
        hideToast();
        if (onAction) onAction();
      };
    } else {
      toastAct.hidden = true;
      toastAct.onclick = null;
    }
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actionLabel ? 8000 : 3500);
  }

  function hideToast() {
    toast.hidden = true;
    clearTimeout(toastTimer);
  }

  function notifyChange() {
    if (state.broadcast) state.broadcast.postMessage({ type: 'changed', at: Date.now() });
  }

  /* ───────── 確認對話框 ───────── */
  let confirmResolver = null;

  function askConfirm({ title = '確認', body = '', ok = '確定' }) {
    return new Promise((resolve) => {
      if (confirmResolver) {
        const prev = confirmResolver;
        confirmResolver = null;
        prev(false);
      }
      confirmResolver = resolve;
      confirmTitle.textContent = title;
      confirmBody.textContent = body;
      confirmOk.textContent = ok;
      dlgConfirm.showModal();
    });
  }

  function settleConfirm(value) {
    const resolve = confirmResolver;
    confirmResolver = null;
    if (dlgConfirm.open) dlgConfirm.close();
    if (resolve) resolve(value);
  }

  /* ───────── 專案 ───────── */
  function sortedProjects() {
    return state.projects.slice().sort((a, b) =>
      (a.order || 0) - (b.order || 0) || String(a.createdAt).localeCompare(String(b.createdAt)));
  }

  function nextProjectOrder() {
    return state.projects.reduce((max, p) => Math.max(max, p.order || 0), 0) + 100;
  }

  function newProjectRecord(name, opts = {}) {
    const now = nowISO();
    return {
      id: uid(),
      name: name.slice(0, 80),
      desc: '',
      color: opts.color || COLORS[state.projects.length % COLORS.length],
      status: 'active',
      order: nextProjectOrder(),
      startDate: '',
      dueDate: '',
      createdAt: now,
      updatedAt: now,
      ...opts,
    };
  }

  async function createProject(name, opts = {}) {
    const rec = newProjectRecord(name, opts);
    if (!await persist(() => dbPut(STORE_PROJECTS, rec), '建立專案失敗，請先匯出備份')) return null;
    state.projects.push(rec);
    notifyChange();
    return rec;
  }

  async function quickCreateProject(event) {
    event.preventDefault();
    const name = quickProjectName.value.trim();
    if (!name) { quickProjectName.focus(); return; }
    const rec = await createProject(name);
    if (!rec) return;
    quickProjectName.value = '';
    state.activeProjectId = rec.id;
    saveUISoon();
    invalidate();
    render();
    showToast('已建立專案「' + truncate(name, 18) + '」');
  }

  function renderSwatches() {
    projectColors.replaceChildren(...COLORS.map((c) => el('button', {
      type: 'button',
      class: 'swatch' + (state.editingProjectColor === c ? ' is-active' : ''),
      style: { background: c },
      dataset: { act: 'pick-color', color: c },
      'aria-label': '專案顏色 ' + c,
      title: c,
    })));
  }

  function openProject(project) {
    state.editingProjectId = project ? project.id : null;
    state.editingProjectColor = project ? project.color : COLORS[0];
    projectDialogTitle.textContent = project ? '編輯專案' : '新增專案';
    projectNameInput.value = project ? project.name : '';
    projectDesc.value = project ? project.desc || '' : '';
    projectStatusSel.replaceChildren(...PROJECT_STATUSES.map((s) => optionEl(s.id, s.label)));
    projectStatusSel.value = project ? project.status : 'active';
    projectStart.value = project ? project.startDate || '' : '';
    projectDue.value = project ? project.dueDate || '' : '';
    btnDeleteProject.hidden = !project;
    projectNameInput.setCustomValidity('');
    renderSwatches();
    dlgProject.showModal();
    projectNameInput.focus();
    projectNameInput.select();
  }

  function openProjects() {
    renderProjectsDialog();
    dlgProjects.showModal();
  }

  function renderProjectsDialog() {
    const total = state.tasks.length;
    const rows = [
      el('button', {
        type: 'button', class: 'proj-pick' + (state.activeProjectId === 'all' ? ' is-active' : ''),
        dataset: { act: 'pick-project', id: 'all' },
      },
        el('span', { class: 'dot', style: { background: 'var(--accent)' } }),
        el('span', { class: 'proj-pick__main' },
          el('span', { class: 'proj-pick__name', text: '全部任務' }),
          el('span', { class: 'proj-pick__meta', text: total + ' 筆任務' })
        ),
        el('span')
      ),
    ];

    for (const p of sortedProjects()) {
      const ts = state.tasks.filter((t) => t.projectId === p.id);
      const done = ts.filter((t) => t.status === 'done').length;
      const archived = p.status === 'archived';
      rows.push(el('div', { class: 'proj-pick' + (state.activeProjectId === p.id ? ' is-active' : '') },
        el('span', { class: 'dot', style: { background: p.color } }),
        el('button', {
          type: 'button', class: 'proj-pick__main',
          dataset: { act: 'pick-project', id: p.id },
        },
          el('span', { class: 'proj-pick__name' + (archived ? ' is-archived' : '') }, p.name,
            archived ? el('span', { class: 'chip chip--plain', style: { 'margin-left': '6px' }, text: '封存' }) : null),
          el('span', { class: 'proj-pick__meta', text: (PROJECT_STATUS_LABEL[p.status] || '') + ' · ' + done + '/' + ts.length + ' 完成' })
        ),
        el('span', { class: 'proj-pick__actions' },
          el('button', { type: 'button', class: 'btn btn--ghost btn--sm', dataset: { act: 'edit-project', id: p.id }, text: '編輯' }),
          el('button', {
            type: 'button', class: 'btn btn--ghost btn--sm',
            dataset: { act: 'archive-project', id: p.id }, text: archived ? '取消封存' : '封存',
          }),
          el('button', { type: 'button', class: 'btn btn--ghost btn--sm btn--danger', dataset: { act: 'delete-project', id: p.id }, text: '刪除' })
        )
      ));
    }
    projectListEl.replaceChildren(...rows);
  }

  async function saveProject(event) {
    event.preventDefault();
    const name = projectNameInput.value.trim();
    if (!name) {
      projectNameInput.setCustomValidity('請輸入專案名稱');
      projectNameInput.reportValidity();
      return;
    }
    projectNameInput.setCustomValidity('');
    const existing = state.editingProjectId ? projectById(state.editingProjectId) : null;
    const rec = {
      id: existing ? existing.id : uid(),
      name: name.slice(0, 80),
      desc: projectDesc.value.trim().slice(0, 2000),
      color: state.editingProjectColor,
      status: projectStatusSel.value,
      order: existing ? (existing.order || 0) : nextProjectOrder(),
      startDate: validDay(projectStart.value),
      dueDate: validDay(projectDue.value),
      createdAt: existing ? existing.createdAt : nowISO(),
      updatedAt: nowISO(),
    };
    if (!await persist(() => dbPut(STORE_PROJECTS, rec), '儲存專案失敗，請先匯出備份')) return;

    if (existing) Object.assign(existing, rec);
    else state.projects.push(rec);

    if (rec.status === 'archived' && state.activeProjectId === rec.id) state.activeProjectId = 'all';
    if (!existing) state.activeProjectId = rec.id;
    saveUISoon();
    dlgProject.close();
    notifyChange();
    invalidate();
    render();
    showToast(existing ? '已更新專案' : '已建立專案「' + truncate(rec.name, 18) + '」');
  }

  async function toggleArchive(project) {
    const next = {
      ...project,
      status: project.status === 'archived' ? 'active' : 'archived',
      updatedAt: nowISO(),
    };
    if (!await persist(() => dbPut(STORE_PROJECTS, next), '更新專案失敗')) return;
    Object.assign(project, next);
    if (project.status === 'archived' && state.activeProjectId === project.id) state.activeProjectId = 'all';
    saveUISoon();
    notifyChange();
    invalidate();
    render();
    showToast(next.status === 'archived' ? '已封存專案' : '已取消封存');
  }

  async function deleteProject(project) {
    const children = state.tasks.filter((t) => t.projectId === project.id);
    const ok = await askConfirm({
      title: '刪除專案',
      body: '確定刪除「' + project.name + '」與其 ' + children.length + ' 個任務？刪除後可從通知列復原。',
      ok: '刪除專案',
    });
    if (!ok) return;

    const done = await persist(
      () => dbDeleteProject(project.id, children.map((t) => t.id)),
      '刪除專案失敗，請重新整理後再試'
    );
    if (!done) return;

    const snapshot = { project: { ...project }, tasks: children.map((t) => ({ ...t })) };
    state.projects = state.projects.filter((p) => p.id !== project.id);
    state.tasks = state.tasks.filter((t) => t.projectId !== project.id);
    if (state.activeProjectId === project.id) state.activeProjectId = 'all';
    saveUISoon();
    dlgProject.close();
    if (dlgProjects.open) dlgProjects.close();
    invalidate();
    render();
    notifyChange();

    showToast('已刪除「' + truncate(project.name, 16) + '」與 ' + children.length + ' 個任務', '復原', async () => {
      const restored = await persist(
        () => dbWriteBoth([snapshot.project], snapshot.tasks, false),
        '復原失敗'
      );
      if (!restored) return;
      state.projects.push(snapshot.project);
      state.tasks.push(...snapshot.tasks);
      invalidate();
      render();
      showToast('已復原專案');
    });
  }

  /* ───────── 任務 ───────── */
  function validDay(v) {
    return parseDay(v) ? v : '';
  }

  function parseTags(input) {
    const seen = new Set();
    const out = [];
    for (const part of String(input || '').split(/[,，、]/)) {
      const tag = part.trim().slice(0, 24);
      if (!tag) continue;
      const key = tag.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(tag);
      if (out.length >= CONFIG.maxTags) break;
    }
    return out;
  }

  function nextOrder(projectId, status) {
    return state.tasks
      .filter((t) => t.projectId === projectId && t.status === status)
      .reduce((max, t) => Math.max(max, t.order || 0), 0) + 100;
  }

  function defaultProjectId() {
    if (state.activeProjectId !== 'all' && projectById(state.activeProjectId)) return state.activeProjectId;
    const active = sortedProjects().filter((p) => p.status !== 'archived');
    return (active[0] || sortedProjects()[0] || {}).id || '';
  }

  function openTask(task, defaults = {}) {
    if (!state.projects.length) {
      showToast('請先建立一個專案');
      openProject(null);
      return;
    }
    state.editingTaskId = task ? task.id : null;
    const projectId = task ? task.projectId : (defaults.projectId || defaultProjectId());
    const status = task ? task.status : (defaults.status || 'todo');

    taskDialogTitle.textContent = task ? '編輯任務' : '新增任務';
    taskProjectSel.replaceChildren(...sortedProjects().map((p) =>
      optionEl(p.id, p.name + (p.status === 'archived' ? '（封存）' : ''))));
    taskProjectSel.value = projectById(projectId) ? projectId : defaultProjectId();
    taskStatusSel.replaceChildren(...STATUSES.map((s) => optionEl(s.id, s.label)));
    taskStatusSel.value = STATUSES.some((s) => s.id === status) ? status : 'todo';
    taskPrioritySel.replaceChildren(...PRIORITIES.map((p) => optionEl(p.id, p.label)));
    taskPrioritySel.value = task ? task.priority : 'normal';

    taskTitle.value = task ? task.title : '';
    taskOwner.value = task ? task.owner || '' : '';
    taskStart.value = task ? task.startDate || '' : validDay(defaults.startDate || '');
    taskDue.value = task ? task.dueDate || '' : validDay(defaults.dueDate || '');
    taskEstimate.value = task ? minToHoursInput(task.estimateMin) : '';
    taskActual.value = task ? minToHoursInput(task.actualMin) : '';
    taskTags.value = task ? (task.tags || []).join(', ') : '';
    taskNote.value = task ? task.note || '' : '';
    taskTitle.setCustomValidity('');
    taskStart.setCustomValidity('');
    tagOptions.replaceChildren(...allTags().map((tag) => optionEl(tag, tag)));
    btnDeleteTask.hidden = !task;

    state.subtasks = task
      ? (task.subtasks || []).map((s) => ({ id: s.id || uid(), title: s.title, done: Boolean(s.done) }))
      : [];
    renderSubtaskEditor();

    dlgTask.showModal();
    taskTitle.focus();
    if (task) taskTitle.select();
  }

  function renderSubtaskEditor() {
    subtaskCount.textContent = String(state.subtasks.length);
    subtaskDone.textContent = String(state.subtasks.filter((s) => s.done).length);
    if (!state.subtasks.length) {
      subtaskList.replaceChildren(el('p', { class: 'subtasks__empty', text: '沒有子任務。可把任務拆成幾個可勾選的小步驟。' }));
      return;
    }
    subtaskList.replaceChildren(...state.subtasks.map((s, i) => el('div', {
      class: 'subtask' + (s.done ? ' is-done' : ''), dataset: { idx: String(i) },
    },
      el('input', {
        type: 'checkbox', checked: s.done, dataset: { act: 'subtask-toggle', idx: String(i) },
        'aria-label': '子任務完成：' + (s.title || ('第 ' + (i + 1) + ' 項')),
      }),
      el('input', {
        type: 'text', value: s.title, maxlength: '200',
        dataset: { act: 'subtask-title', idx: String(i) },
        'aria-label': '子任務內容', placeholder: '子任務…',
      }),
      el('button', {
        type: 'button', class: 'subtask__del', dataset: { act: 'subtask-del', idx: String(i) },
        'aria-label': '刪除子任務', text: '✕',
      })
    )));
  }

  function addSubtaskRow() {
    if (state.subtasks.length >= CONFIG.maxSubtasks) {
      showToast('子任務最多 ' + CONFIG.maxSubtasks + ' 項');
      return;
    }
    state.subtasks.push({ id: uid(), title: '', done: false });
    renderSubtaskEditor();
    const inputs = $$('input[data-act="subtask-title"]', subtaskList);
    const last = inputs[inputs.length - 1];
    if (last) last.focus();
  }

  async function saveTask(event) {
    event.preventDefault();
    const title = taskTitle.value.trim();
    if (!title) {
      taskTitle.setCustomValidity('請輸入任務標題');
      taskTitle.reportValidity();
      return;
    }
    taskTitle.setCustomValidity('');

    const existing = state.editingTaskId ? findTask(state.editingTaskId) : null;
    const projectId = taskProjectSel.value;
    if (!projectById(projectId)) {
      showBanner('找不到這個專案，請重新選擇。', 'danger');
      return;
    }
    const startDate = validDay(taskStart.value);
    const dueDate = validDay(taskDue.value);
    if (startDate && dueDate && startDate > dueDate) {
      taskStart.setCustomValidity('開始日不能晚於到期日');
      taskStart.reportValidity();
      return;
    }
    taskStart.setCustomValidity('');
    const status = taskStatusSel.value;
    const subs = state.subtasks
      .map((s) => ({ id: s.id, title: String(s.title || '').trim().slice(0, 200), done: Boolean(s.done) }))
      .filter((s) => s.title)
      .slice(0, CONFIG.maxSubtasks);

    const now = nowISO();
    const rec = {
      id: existing ? existing.id : uid(),
      projectId,
      title: title.slice(0, CONFIG.maxTitle),
      note: taskNote.value.trim().slice(0, CONFIG.maxNote),
      status,
      priority: taskPrioritySel.value,
      startDate,
      dueDate,
      tags: parseTags(taskTags.value),
      subtasks: subs,
      estimateMin: hoursToMin(taskEstimate.value),
      actualMin: hoursToMin(taskActual.value),
      owner: taskOwner.value.trim().slice(0, 60),
      order: existing ? (existing.order || 0) : nextOrder(projectId, status),
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now,
      completedAt: status === 'done' ? (existing && existing.completedAt ? existing.completedAt : now) : null,
    };

    if (!await persist(() => dbPut(STORE_TASKS, rec), '儲存任務失敗，請先匯出備份')) return;

    if (existing) Object.assign(existing, rec);
    else state.tasks.push(rec);

    dlgTask.close();
    notifyChange();
    invalidate();
    render();
    showToast(existing ? '已更新任務' : '已新增任務');
  }

  async function deleteTask(id) {
    const task = findTask(id);
    if (!task) return;
    const ok = await askConfirm({
      title: '刪除任務',
      body: '確定刪除「' + task.title + '」？刪除後可從通知列復原。',
      ok: '刪除',
    });
    if (!ok) return;

    if (!await persist(() => dbDelete(STORE_TASKS, id), '刪除任務失敗，請重新整理後再試')) return;

    state.tasks = state.tasks.filter((t) => t.id !== id);
    dlgTask.close();
    if (dlgDay.open) dlgDay.close();
    notifyChange();
    invalidate();
    render();

    showToast('已刪除「' + truncate(task.title, 18) + '」', '復原', async () => {
      if (!await persist(() => dbPut(STORE_TASKS, task), '復原失敗')) return;
      state.tasks.push(task);
      notifyChange();
      invalidate();
      render();
      showToast('已復原');
    });
  }

  async function toggleTaskDone(id, checked) {
    const task = findTask(id);
    if (!task) return;
    const next = {
      ...task,
      status: checked ? 'done' : 'todo',
      completedAt: checked ? (task.completedAt || nowISO()) : null,
      updatedAt: nowISO(),
    };
    if (!await persist(() => dbPut(STORE_TASKS, next), '更新失敗，請先匯出備份')) {
      invalidate();
      render();
      return;
    }
    Object.assign(task, next);
    notifyChange();
    invalidate();
    render();
  }

  async function moveTask(taskId, status, beforeId) {
    const task = findTask(taskId);
    if (!task) return;
    const targetStatus = STATUSES.some((s) => s.id === status) ? status : task.status;
    const prevStatus = task.status;
    if (prevStatus === targetStatus && beforeId === task.id) return;

    const column = state.tasks
      .filter((t) => t.projectId === task.projectId && t.status === targetStatus && t.id !== task.id)
      .sort(compareOrder);
    let index = beforeId ? column.findIndex((t) => t.id === beforeId) : column.length;
    if (index < 0) index = column.length;

    const moved = {
      ...task,
      status: targetStatus,
      completedAt: targetStatus === 'done' ? (task.completedAt || nowISO()) : null,
      updatedAt: nowISO(),
    };
    column.splice(index, 0, moved);

    const updates = column.map((t, i) => ({ ...t, order: (i + 1) * 100 }));
    if (!await persist(() => dbBulkPut(STORE_TASKS, updates), '移動任務失敗，請先匯出備份')) {
      invalidate();
      render();
      return;
    }
    for (const upd of updates) {
      const target = findTask(upd.id);
      if (target) Object.assign(target, upd);
    }
    notifyChange();
    invalidate();
    render();
    if (prevStatus !== targetStatus) showToast('已移到「' + STATUS_LABEL[targetStatus] + '」');
  }

  /* ───────── 某一天 ───────── */
  function fillDay(dayStr) {
    const tasks = scopedTasks()
      .filter((t) => t.dueDate === dayStr)
      .sort((a, b) => (PRIORITY_RANK[a.priority] ?? 9) - (PRIORITY_RANK[b.priority] ?? 9));

  function csvCell(value) {
    return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"';

  async function exportCSV() {
    let projects;
    let tasks;
    try {
      [projects, tasks] = await Promise.all([dbGetAll(STORE_PROJECTS), dbGetAll(STORE_TASKS)]);
    } catch (err) {
      console.error(err);
      showBanner('讀取資料失敗，無法匯出。', 'danger');
      return;
    }
    const names = new Map(projects.map((p) => [p.id, p.name]));
    const header = ['專案', '任務', '狀態', '優先級', '開始日', '到期日', '標籤', '負責人',
      '預估工時', '實際工時', '子任務完成', '子任務總數', '說明', '建立時間', '更新時間'];
    const lines = [header.map(csvCell).join(',')];
    const sorted = tasks.slice().sort((a, b) =>
      String(names.get(a.projectId) || '').localeCompare(String(names.get(b.projectId) || ''), 'zh-Hant')
      || compareOrder(a, b));
    for (const t of sorted) {
      const sub = taskSub(t);
      lines.push([
        names.get(t.projectId) || '',
        t.title,
        STATUS_LABEL[t.status] || t.status,
        PRIORITY_LABEL[t.priority] || t.priority,
        t.startDate || '',
        t.dueDate || '',
        (t.tags || []).join(' '),
        t.owner || '',
        t.estimateMin ? Math.round((t.estimateMin / 60) * 100) / 100 : '',
        t.actualMin ? Math.round((t.actualMin / 60) * 100) / 100 : '',
        sub.done,
        sub.total,
        t.note || '',
        t.createdAt || '',
        t.updatedAt || '',
      ].map(csvCell).join(','));
    }
    downloadFile('project-desk-' + todayStr() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    markBackup();
    showToast('已匯出 ' + tasks.length + ' 筆任務 CSV');

  async function exportMarkdown() {
    let projects;
    let tasks;
    try {
      [projects, tasks] = await Promise.all([dbGetAll(STORE_PROJECTS), dbGetAll(STORE_TASKS)]);
    } catch (err) {
      console.error(err);
      showBanner('讀取資料失敗，無法匯出。', 'danger');
      return;
    }
    const out = [];
    out.push('# 專案報告');
    out.push('');
    out.push('> 匯出時間：' + new Date().toLocaleString('zh-Hant') + '　·　' + projects.length + ' 個專案，' + tasks.length + ' 個任務');
    out.push('');
    for (const p of projects.slice().sort((a, b) => (a.order || 0) - (b.order || 0))) {
      const ts = tasks.filter((t) => t.projectId === p.id)
        .sort((a, b) => (PRIORITY_RANK[a.priority] ?? 9) - (PRIORITY_RANK[b.priority] ?? 9) || byDue(a, b));
      out.push('## ' + p.name);
      out.push('');
      if (p.desc) { out.push(p.desc); out.push(''); }
      const meta = [PROJECT_STATUS_LABEL[p.status] || ''];
      if (p.startDate) meta.push('開始 ' + p.startDate);
      if (p.dueDate) meta.push('目標 ' + p.dueDate);
      const doneCount = ts.filter((t) => t.status === 'done').length;
      meta.push(doneCount + '/' + ts.length + ' 完成');
      out.push('*' + meta.filter(Boolean).join(' · ') + '*');
      out.push('');
      if (!ts.length) { out.push('（尚無任務）'); out.push(''); continue; }
      for (const s of STATUSES) {
        const group = ts.filter((t) => t.status === s.id);
        if (!group.length) continue;
        out.push('### ' + s.label + '（' + group.length + '）');
        out.push('');
        for (const t of group) {
          const bits = [];
          if (t.priority && t.priority !== 'normal') bits.push('**' + PRIORITY_LABEL[t.priority] + '**');
          if (t.dueDate) bits.push('到期 ' + t.dueDate);
          if (t.owner) bits.push('@' + t.owner);
          if (t.tags && t.tags.length) bits.push(t.tags.map((x) => '#' + x).join(' '));
          if (t.estimateMin) bits.push('預估 ' + fmtMinutes(t.estimateMin));
          if (t.actualMin) bits.push('實際 ' + fmtMinutes(t.actualMin));
          out.push('- [' + (t.status === 'done' ? 'x' : ' ') + '] ' + t.title + (bits.length ? ' — ' + bits.join(' · ') : ''));
          if (t.note) {
            for (const line of String(t.note).split('\n')) out.push('  > ' + line);
          }
          for (const sub of t.subtasks || []) {
            out.push('  - [' + (sub.done ? 'x' : ' ') + '] ' + sub.title);
          }
        }
        out.push('');
      }
    }
    downloadFile('project-desk-' + todayStr() + '.md', out.join('\n'), 'text/markdown;charset=utf-8');
    markBackup();
    showToast('已匯出 Markdown 報告');
  }

  /* ───────── 匯入 ───────── */
  let pendingImport = null;

  function normalizeDateValue(value) {
    return parseDay(value) ? value : '';
  }
  function clampMinutes(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return 0;
    return Math.min(599940, Math.round(n));
  }

  function normalizeProject(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const name = String(raw.name == null ? '' : raw.name).trim();
    if (!name) return null;
    const now = nowISO();
    return {
      id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
      name: name.slice(0, 80),
      desc: String(raw.desc == null ? '' : raw.desc).slice(0, 2000),
      color: /^#[0-9a-fA-F]{6}$/.test(String(raw.color || '')) ? raw.color : COLORS[0],
      status: PROJECT_STATUS_LABEL[raw.status] ? raw.status : 'active',
      order: Number.isFinite(raw.order) ? raw.order : nextProjectOrder(),
      startDate: normalizeDateValue(raw.startDate),
      dueDate: normalizeDateValue(raw.dueDate),
      createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : now,
      updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : now,
    };
  }

  function normalizeTask(raw, projectIds) {
    if (!raw || typeof raw !== 'object') return null;
    const title = String(raw.title == null ? '' : raw.title).trim();
    if (!title) return null;
    if (!projectIds.has(raw.projectId)) return null;
    const now = nowISO();
    const tags = Array.isArray(raw.tags)
      ? [...new Set(raw.tags.map((t) => String(t).trim()).filter(Boolean))].slice(0, CONFIG.maxTags)
      : [];
    const subtasks = Array.isArray(raw.subtasks)
      ? raw.subtasks.map((s) => ({
        id: s && typeof s.id === 'string' && s.id ? s.id : uid(),
        title: String((s && s.title) == null ? '' : s.title).trim().slice(0, 200),
        done: Boolean(s && s.done),
      })).filter((s) => s.title).slice(0, CONFIG.maxSubtasks)
      : [];
    const status = STATUS_LABEL[raw.status] ? raw.status : 'todo';
    return {
      id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
      projectId: raw.projectId,
      title: title.slice(0, CONFIG.maxTitle),
      note: String(raw.note == null ? '' : raw.note).slice(0, CONFIG.maxNote),
      status,
      priority: PRIORITY_LABEL[raw.priority] ? raw.priority : 'normal',
      startDate: normalizeDateValue(raw.startDate),
      dueDate: normalizeDateValue(raw.dueDate),
      tags,
      subtasks,
      estimateMin: clampMinutes(raw.estimateMin),
      actualMin: clampMinutes(raw.actualMin),
      owner: String(raw.owner == null ? '' : raw.owner).slice(0, 60),
      order: Number.isFinite(raw.order) ? raw.order : 0,
      createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : now,
      updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : now,
      completedAt: status === 'done'
        ? (typeof raw.completedAt === 'string' ? raw.completedAt : now)
        : null,
    };
  }

  async function importFromFile(file) {
    if (!file) return;
    if (file.size > CONFIG.maxImportBytes) {
      showBanner('匯入失敗：檔案超過 ' + Math.round(CONFIG.maxImportBytes / 1024 / 1024) + ' MB。', 'danger');
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      showBanner('匯入失敗：檔案不是有效的 JSON。', 'danger');
      return;
    }
    if (parsed && typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > CONFIG.version) {
      showBanner('匯入失敗：此備份來自較新版本（v' + parsed.schemaVersion + '），請更新工具後再匯入。', 'danger');
      return;
    }

    const src = parsed && parsed.data ? parsed.data : parsed;
    const rawProjects = src && Array.isArray(src.projects) ? src.projects : [];
    const rawTasks = src && Array.isArray(src.tasks) ? src.tasks : [];
    if (!rawProjects.length && !rawTasks.length) {
      showBanner('匯入失敗：檔案裡找不到專案或任務資料（預期 data.projects / data.tasks）。', 'danger');
      return;
    }

    const projects = rawProjects.map(normalizeProject).filter(Boolean);
    const projectIds = new Set([...state.projects.map((p) => p.id), ...projects.map((p) => p.id)]);
    const tasks = rawTasks.map((t) => normalizeTask(t, projectIds)).filter(Boolean);
    const skipped = (rawProjects.length - projects.length) + (rawTasks.length - tasks.length);

    pendingImport = { projects, tasks };
    importSummary.textContent = '檔案包含 ' + projects.length + ' 個專案、' + tasks.length + ' 個任務。'
      + (skipped ? '另有 ' + skipped + ' 筆無效資料會被略過。' : '');
    importWarn.textContent = '';
    dlgImport.showModal();
  }

  async function applyImport(mode) {
    if (!pendingImport) return;
    const { projects, tasks } = pendingImport;
    if (!projects.length && !tasks.length) {
      dlgImport.close();
      return;
    }

    const backedUp = await exportJSON({ silent: true });
    if (!backedUp) {
      importWarn.textContent = '無法建立匯入前的備份，已取消匯入。請先手動匯出。';
      return;
    }

    if (mode === 'replace') {
      const ids = new Set(projects.map((p) => p.id));
      const kept = tasks.filter((t) => ids.has(t.projectId));
      const dropped = tasks.length - kept.length;
      if (!await persist(() => dbWriteBoth(projects, kept, true),
        '匯入寫入失敗，原有資料已保留，請重試或先匯出目前資料')) return;

      await reload();
      if (state.activeProjectId !== 'all' && !projectById(state.activeProjectId)) state.activeProjectId = 'all';
      pendingImport = null;
      dlgImport.close();
      invalidate();
      notifyChange();
      render();
      showToast('已取代為 ' + projects.length + ' 個專案、' + kept.length + ' 個任務'
        + (dropped ? '（' + dropped + ' 筆找不到專案）' : ''));
      return;
    }

    if (!await persist(() => dbWriteBoth(projects, tasks, false),
      '匯入寫入失敗，請重試或先匯出目前資料')) return;

    await reload();
    pendingImport = null;
    dlgImport.close();
    invalidate();
    notifyChange();
    render();
    showToast('已合併 ' + projects.length + ' 個專案、' + tasks.length + ' 個任務');
  }

  /* ───────── 清空 ───────── */
  async function resetAll() {
    if (!state.projects.length && !state.tasks.length) {
      showToast('目前沒有資料');
      return;
    }
    const ok = await askConfirm({
      title: '清空全部資料',
      body: '將刪除 ' + state.projects.length + ' 個專案與 ' + state.tasks.length + ' 個任務，無法復原。'
        + '建議先「匯出 JSON 備份」。',
      ok: '全部清空',
    });
    if (!ok) return;

    if (!await persist(() => dbWriteBoth([], [], true), '清空失敗')) return;

    state.projects = [];
    state.tasks = [];
    state.activeProjectId = 'all';
    saveUISoon();
    invalidate();
    notifyChange();
    render();
    showToast('已清空所有資料');
  }

  /* ───────── 其他 ───────── */
  async function refreshUsage() {
    if (!navigator.storage || !navigator.storage.estimate) return;
    try {
      const { usage = 0 } = await navigator.storage.estimate();
      usageEl.textContent = '約 ' + (usage / 1024 < 1024
        ? Math.round(usage / 1024) + ' KB'
        : (usage / 1024 / 1024).toFixed(1) + ' MB');
    } catch (_) {}
  }

  function checkBackupReminder() {
    if (!idbOK) return;
    if (!banner.hidden) return;
    if (!state.projects.length && !state.tasks.length) return;
    if (!state.lastBackupAt) {
      if (state.tasks.length) showBanner('資料只存在這個瀏覽器。建議從「⋯ → 匯出 JSON 備份」保存一份。');
      return;
    }
    const days = Math.floor((Date.now() - new Date(state.lastBackupAt).getTime()) / 86400000);
    if (days >= CONFIG.backupReminderDays) {
      showBanner('距離上次備份已 ' + days + ' 天，建議現在匯出 JSON 備份。');
    }
  }
  /* ───────── 檢視切換 / 搜尋 ───────── */
  function setView(view) {
    if (!VIEWS.includes(view)) return;
    state.view = view;
    saveUISoon();
    render();
  }

  function openSearch() {
    if (getComputedStyle(btnSearch).display !== 'none') {
      appbar.classList.add('search-open');
      btnSearch.setAttribute('aria-expanded', 'true');
    }
    inputSearch.focus();
    inputSearch.select();
  }

  function shiftCal(dir) {
    if (state.calMode === 'month') {
      const c = state.calCursor;
      state.calCursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
    } else {
      state.calCursor = addDays(state.calCursor, 28 * dir);
    }
    dirty.cal = true;
    render();
  }

  /* ───────── 事件 ───────── */
  const onSearch = debounce(function () {
    state.query = inputSearch.value;
    invalidate();
    render();
  }, 140);

  function bindEvents() {
    viewTabs.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-view]');
      if (btn) setView(btn.dataset.view);
    });

    calModeTabs.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-calmode]');
      if (!btn) return;
      state.calMode = btn.dataset.calmode;
      saveUISoon();
      dirty.cal = true;
      render();
    });

    calPrev.addEventListener('click', () => shiftCal(-1));
    calNext.addEventListener('click', () => shiftCal(1));
    calToday.addEventListener('click', () => {
      state.calCursor = new Date();
      dirty.cal = true;
      render();
    });

    inputSearch.addEventListener('input', onSearch);
    inputSearch.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        inputSearch.value = '';
        state.query = '';
        appbar.classList.remove('search-open');
        btnSearch.setAttribute('aria-expanded', 'false');
        inputSearch.blur();
        invalidate();
        render();
      }
    });

    btnSearch.addEventListener('click', () => {
      const open = appbar.classList.toggle('search-open');
      btnSearch.setAttribute('aria-expanded', String(open));
      if (open) inputSearch.focus();
    });

    btnTheme.addEventListener('click', cycleTheme);
    btnProject.addEventListener('click', openProjects);
    btnNewTask.addEventListener('click', () => openTask(null));
    btnHelp.addEventListener('click', () => dlgHelp.showModal());
    bannerClose.addEventListener('click', hideBanner);
    toastClose.addEventListener('click', hideToast);
    hideToastAct();

    /* 篩選 */
    document.addEventListener('change', (event) => {
      const sel = event.target.closest('select[data-filter]');
      if (sel) {
        state[sel.dataset.filter] = sel.value;
        saveUISoon();
        invalidate();
        render();
        return;
      }
      const box = event.target.closest('input[data-act="toggle-done"]');
      if (box) toggleTaskDone(box.dataset.id, box.checked);
    });

    /* 子任務編輯 */
    subtaskList.addEventListener('input', (event) => {
      const input = event.target.closest('input[data-act="subtask-title"]');
      if (!input) return;
      const i = Number(input.dataset.idx);
      if (state.subtasks[i]) state.subtasks[i].title = input.value;
    });
    subtaskList.addEventListener('change', (event) => {
      const box = event.target.closest('input[data-act="subtask-toggle"]');
      if (!box) return;
      const i = Number(box.dataset.idx);
      if (!state.subtasks[i]) return;
      state.subtasks[i].done = box.checked;
      const row = box.closest('.subtask');
      if (row) row.classList.toggle('is-done', box.checked);
      subtaskDone.textContent = String(state.subtasks.filter((s) => s.done).length);
    });
    subtaskList.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-act="subtask-del"]');
      if (!btn) return;
      const i = Number(btn.dataset.idx);
      state.subtasks.splice(i, 1);
      renderSubtaskEditor();
    });
    btnAddSubtask.addEventListener('click', addSubtaskRow);

    /* 全域點擊：選單、卡片、對話框關閉 */
    document.addEventListener('click', (event) => {
      if (menuMore.open && !event.target.closest('#menu-more')) menuMore.open = false;

      const closer = event.target.closest('[data-close]');
      if (closer) {
        const d = document.getElementById(closer.dataset.close);
        if (d && d.open) d.close();
        return;
      }

      const target = event.target.closest('[data-act]');
      if (!target) return;
      const act = target.dataset.act;
      const task = target.dataset.id ? findTask(target.dataset.id) : null;
      const project = target.dataset.id ? projectById(target.dataset.id) : null;

      switch (act) {
        case 'clear-filters':
          state.query = '';
          state.priority = '';
          state.due = '';
          state.tag = '';
          inputSearch.value = '';
          saveUISoon();
          invalidate();
          render();
          break;
        case 'new-project':
          openProject(null);
          break;
        case 'pick-color':
          state.editingProjectColor = target.dataset.color;
          renderSwatches();
          break;
        case 'new-in-status':
          openTask(null, { status: target.dataset.status });
          break;
        case 'set-sort':
          state.sort = target.dataset.sort;
          saveUISoon();
          dirty.list = true;
          render();
          break;
        case 'edit-task':
          if (task) openTask(task);
          break;
        case 'delete-task':
          if (task) deleteTask(task.id);
          break;
        case 'open-card':
          if (task) openCardSheet(task);
          break;
        case 'sheet-move': {
          const id = sheetTaskId;
          if (!id) break;
          dlgCard.close();
          moveTask(id, target.dataset.status, null);
          break;
        }
        case 'open-day':
          openDay(target.dataset.day);
          break;
        case 'pick-project':
          state.activeProjectId = target.dataset.id;
          saveUISoon();
          invalidate();
          dlgProjects.close();
          render();
          break;
        case 'edit-project':
          if (project) openProject(project);
          break;
        case 'archive-project':
          if (project) toggleArchive(project);
          break;
        case 'delete-project':
          if (project) deleteProject(project);
          break;
        case 'toggle-done':
          break;
        default:
          break;
      }
    });

    /* 表單 */
    formTask.addEventListener('submit', saveTask);
    btnDeleteTask.addEventListener('click', () => {
      if (state.editingTaskId) deleteTask(state.editingTaskId);
    });
    formProject.addEventListener('submit', saveProject);
    btnDeleteProject.addEventListener('click', () => {
      const p = state.editingProjectId ? projectById(state.editingProjectId) : null;
      if (p) deleteProject(p);
    });
    formQuickProject.addEventListener('submit', quickCreateProject);
    formConfirm.addEventListener('submit', (event) => {
      event.preventDefault();
      settleConfirm(true);
    });
    formImport.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (formImport.dataset.busy === '1') return;
      const modeInput = formImport.querySelector('input[name="import-mode"]:checked');
      const mode = modeInput ? modeInput.value : 'merge';
      const submitBtn = formImport.querySelector('button[type="submit"]');
      formImport.dataset.busy = '1';
      if (submitBtn) submitBtn.disabled = true;
      try {
        await applyImport(mode);
      } finally {
        formImport.dataset.busy = '0';
        if (submitBtn) submitBtn.disabled = false;
      }
    });

    btnDayAdd.addEventListener('click', () => {
      const day = state.selectedDay;
      dlgDay.close();
      openTask(null, { dueDate: day });
    });

    dlgConfirm.addEventListener('close', () => {
      if (confirmResolver) {
        const resolve = confirmResolver;
        confirmResolver = null;
        resolve(false);
      }
    });
    dlgTask.addEventListener('close', () => {
      state.editingTaskId = null;
      state.subtasks = [];
    });
    dlgDay.addEventListener('close', () => {
      state.selectedDay = '';
    });
    dlgCard.addEventListener('close', () => {
      sheetTaskId = '';
    });
    cardSheetEdit.addEventListener('click', () => {
      const task = findTask(sheetTaskId);
      if (!task) return;
      dlgCard.close();
      openTask(task);
    });
    cardSheetDelete.addEventListener('click', () => {
      const task = findTask(sheetTaskId);
      if (!task) return;
      dlgCard.close();
      deleteTask(task.id);
    });
    dlgImport.addEventListener('close', () => {
      pendingImport = null;
      importWarn.textContent = '';
    });

    /* 更多選單 */
    menuMore.addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-menu]');
      if (!btn) return;
      const action = btn.dataset.menu;
      menuMore.open = false;
      if (action === 'export-json') await exportJSON();
      else if (action === 'export-csv') await exportCSV();
      else if (action === 'export-md') await exportMarkdown();
      else if (action === 'import') fileImport.click();
      else if (action === 'projects') openProjects();
      else if (action === 'help') dlgHelp.showModal();
      else if (action === 'reset') await resetAll();
    });

    fileImport.addEventListener('change', async () => {
      const file = fileImport.files && fileImport.files[0];
      fileImport.value = '';
      await importFromFile(file);
    });

    /* 拖曳 */
    let dragId = null;
    board.addEventListener('dragstart', (event) => {
      const card = event.target.closest('.task-card');
      if (!card) return;
      dragId = card.dataset.id;
      card.classList.add('is-dragging');
      event.dataTransfer.effectAllowed = 'move';
      try { event.dataTransfer.setData('text/plain', dragId); } catch (_) {}
    });
    board.addEventListener('dragend', (event) => {
      const card = event.target.closest('.task-card');
      if (card) card.classList.remove('is-dragging');
      for (const b of $$('.col__body')) b.classList.remove('is-over');
      dragId = null;
    });
    board.addEventListener('dragover', (event) => {
      const body = event.target.closest('.col__body');
      if (!body) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      for (const b of $$('.col__body')) if (b !== body) b.classList.remove('is-over');
      body.classList.add('is-over');
    });
    board.addEventListener('dragleave', (event) => {
      const body = event.target.closest('.col__body');
      if (body && !body.contains(event.relatedTarget)) body.classList.remove('is-over');
    });
    board.addEventListener('drop', (event) => {
      const body = event.target.closest('.col__body');
      if (!body) return;
      event.preventDefault();
      let id = dragId;
      try { id = event.dataTransfer.getData('text/plain') || dragId; } catch (_) {}
      const card = event.target.closest('.task-card');
      body.classList.remove('is-over');
      if (!id) return;
      if (card && card.dataset.id === id) return;
      const before = card && card.dataset.id !== id ? card.dataset.id : null;
      moveTask(id, body.dataset.status, before);
    });

    /* 鍵盤 */
    document.addEventListener('keydown', (event) => {
      const elTarget = event.target;
      const typing = elTarget && (elTarget.matches('input, textarea, select') || elTarget.isContentEditable);
      const mod = event.ctrlKey || event.metaKey;

      if (event.key === 'Escape') {
        if (menuMore.open) {
          menuMore.open = false;
          event.preventDefault();
          return;
        }
        return;
      }

      if (mod && event.key === 'Enter') {
        if (dlgTask.open) { event.preventDefault(); formTask.requestSubmit(); return; }
        if (dlgProject.open) { event.preventDefault(); formProject.requestSubmit(); return; }
        if (dlgConfirm.open) { event.preventDefault(); formConfirm.requestSubmit(); return; }
        return;
      }
      if (mod || typing) return;

      if (dlgTask.open || dlgProject.open || dlgProjects.open || dlgDay.open
        || dlgImport.open || dlgConfirm.open || dlgHelp.open || dlgCard.open) {
        if (dlgHelp.open && event.key === '?') { dlgHelp.close(); event.preventDefault(); }
        return;
      }

      if (event.key === '/') {
        event.preventDefault();
        openSearch();
        return;
      }
      if (event.key === '?') {
        event.preventDefault();
        dlgHelp.showModal();
        return;
      }
      if (event.key === 'n' || event.key === 'N') {
        event.preventDefault();
        openTask(null);
        return;
      }
      const idx = ['1', '2', '3', '4'].indexOf(event.key);
      if (idx >= 0) {
        event.preventDefault();
        setView(VIEWS[idx]);
      }
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'auto') applyTheme('auto');
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && uiPending) {
        uiPending = false;
        void saveUINow();
      }
    });
    window.addEventListener('pagehide', () => {
      if (uiPending) {
        uiPending = false;
        void saveUINow();
      }
    });

    if ('BroadcastChannel' in window) {
      const bc = new BroadcastChannel(CONFIG.dbName);
      bc.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'changed' && document.visibilityState === 'visible') {
          reload().then(() => render()).catch(() => {});
        }
      });
      state.broadcast = bc;
    }
  }

  function hideToastAct() {
    toastAct.hidden = true;
    toastAct.onclick = null;
  }

  /* ───────── 載入 ───────── */
  async function reload() {
    try {
      const [projects, tasks] = await Promise.all([
        dbGetAll(STORE_PROJECTS),
        dbGetAll(STORE_TASKS),
      ]);
      state.projects = Array.isArray(projects) ? projects : [];
      state.tasks = Array.isArray(tasks) ? tasks : [];
    } catch (err) {
      console.error(err);
      showBanner('讀取資料失敗，請重新整理頁面。', 'danger');
    }
    invalidate();
  }

  /* ───────── boot ───────── */
  let cachedTheme = 'auto';
  try { cachedTheme = localStorage.getItem('project-desk-theme') || 'auto'; } catch (_) {}

  async function boot() {
    applyTheme(cachedTheme);
    bindEvents();

    try {
      await db();
    } catch (err) {
      console.warn('IndexedDB unavailable, using memory fallback:', err);
      idbOK = false;
      storeModeEl.textContent = '記憶體模式：關閉後資料消失';
      showBanner('目前無法使用瀏覽器資料庫（常見於 file:// 或無痕模式），資料不會保存。請定期從「⋯ → 匯出 JSON 備份」保存。', 'danger');
    }

    if (idbOK) {
      storeModeEl.textContent = '資料存於 IndexedDB';
      try {
        if (navigator.storage && navigator.storage.persist) {
          const persisted = await navigator.storage.persisted();
          if (!persisted) await navigator.storage.persist();
        }
      } catch (_) {}
    }

    let ui = {};
    try {
      ui = (await metaGet('ui', {})) || {};
    } catch (_) {}

    if (['auto', 'light', 'dark'].includes(ui.theme)) applyTheme(ui.theme);
    if (VIEWS.includes(ui.view)) state.view = ui.view;
    if (ui.activeProjectId) state.activeProjectId = ui.activeProjectId;
    if (PRIORITY_LABEL[ui.priority]) state.priority = ui.priority;
    if (['overdue', 'today', 'week', 'none', 'open'].includes(ui.due)) state.due = ui.due;
    if (typeof ui.tag === 'string') state.tag = ui.tag;
    if (SORTS.some((s) => s.id === ui.sort)) state.sort = ui.sort;
    if (ui.calMode === 'timeline' || ui.calMode === 'month') state.calMode = ui.calMode;
    if (typeof ui.lastBackupAt === 'string') state.lastBackupAt = ui.lastBackupAt;

    await reload();
    if (state.activeProjectId !== 'all' && !projectById(state.activeProjectId)) state.activeProjectId = 'all';
    if (state.tag && !allTags().includes(state.tag)) state.tag = '';

    render();
    checkBackupReminder();
    refreshUsage();
  }

  boot().catch((err) => {
    console.error(err);
    showBanner('啟動失敗：' + (err && err.message ? err.message : '未知錯誤') + '。請重新整理頁面。', 'danger');
  });
})();
</script>
