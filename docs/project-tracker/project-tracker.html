<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案時程暨處理流程紀錄系統</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--primary:#2563eb;--primary-weak:#dbeafe;--danger:#dc2626;--warn:#ea580c;--ok:#16a34a;--hover:#f1f5f9;--shadow:0 6px 24px rgba(0,0,0,.12)}
[data-theme=dark]{--bg:#0f172a;--panel:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;--primary:#3b82f6;--primary-weak:#1e3a5f;--hover:#273449;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}
a{color:var(--primary);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
header{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
header .logo{font-weight:700;font-size:16px;margin-right:auto;cursor:pointer}
.hbtn{position:relative;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.hbtn:hover,.hbtn.on{background:var(--primary-weak)}
.hbtn .cnt{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
#app{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
aside .side-top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
#projList{flex:1;overflow:auto;padding:6px}
.pitem{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.pitem:hover{background:var(--hover)}.pitem.act{background:var(--primary-weak)}
.pitem .pn{display:flex;align-items:center;gap:6px;font-weight:600}
.pitem .pm{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--border);border-radius:2px;flex:1;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
main{flex:1;overflow:auto;padding:16px 20px;min-width:0}
h2{margin:0 0 4px;font-size:20px}h3{margin:0;font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-weak);border-color:var(--primary)}
input[type=checkbox]{width:auto}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld>input,.fld>select,.fld>textarea{color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{display:flex;justify-content:flex-end;gap:8px}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:200px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--text);padding:6px 12px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--primary);color:#fff}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stat{font-size:26px;font-weight:700}
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.tbl th{background:var(--hover);font-weight:600;font-size:13px;white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr.clk{cursor:pointer}
.tbl tr.overdue td.due{color:var(--danger);font-weight:700}
.tbl tr.soon td.due{color:var(--warn);font-weight:700}
.tbl tr.done{color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;background:var(--hover);border:1px solid var(--border);margin-right:3px}
.pri-高{color:var(--danger);font-weight:700}.pri-中{color:var(--warn)}.pri-低{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:10px}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto;z-index:100}
.modal{background:var(--panel);border-radius:12px;width:560px;max-width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:960px}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.modal-foot .left{margin-right:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;font-size:14px}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;padding:4px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-weak);color:var(--text);border-radius:14px;padding:3px 10px;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px}
.pcard{background:var(--hover);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7}
/* timeline */
.log-form{background:var(--hover);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--panel)}
.tl-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.tl-ops{margin-left:auto;display:flex;gap:10px;font-size:12px}
.tl-content{white-space:pre-wrap;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;line-height:1.6}
/* attachments */
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin-bottom:12px}
.dropzone.over{border-color:var(--primary);background:var(--primary-weak)}
.att-list{list-style:none;padding:0;margin:0}
.att-list li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.att-list .ic{font-size:20px}
.att-list .info{flex:1;min-width:0}
.att-list .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-list .pt{font-size:12px;color:var(--muted);word-break:break-all}
.att-list .ops{display:flex;gap:10px;font-size:13px;flex:none}
.sec-title{font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
/* gantt */
.gantt{overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 260px)}
.g-head{display:flex;position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--border)}
.g-row{display:flex;border-bottom:1px solid var(--border);cursor:pointer}
.g-row:hover .g-label{background:var(--hover)}
.g-label{width:240px;flex:none;position:sticky;left:0;z-index:2;background:var(--panel);padding:6px 10px;border-right:1px solid var(--border);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.g-label small{color:var(--muted);margin-left:auto}
.g-corner{font-weight:600}
.g-months,.g-days{display:flex}
.g-m{border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px;padding:3px 6px;overflow:hidden;white-space:nowrap;flex:none}
.g-d{flex:none;text-align:center;font-size:11px;padding:3px 0;color:var(--muted);border-right:1px solid var(--border)}
.g-d.wk{background:var(--hover)}.g-d.td{background:var(--danger);color:#fff}
.g-track{position:relative;height:34px;flex:none}
.g-bar{position:absolute;top:7px;height:20px;border-radius:5px;color:#fff;font-size:12px;padding:0 6px;line-height:20px;overflow:hidden;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.g-bar.overdue{outline:2px solid var(--danger);outline-offset:1px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.6;z-index:1}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--border);gap:1px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal .ch{background:var(--hover);text-align:center;padding:6px;font-weight:600}
.cal .cc{background:var(--panel);min-height:104px;padding:4px;font-size:12px}
.cal .cc.oth{opacity:.45}.cal .cc.td{box-shadow:inset 0 0 0 2px var(--primary)}
.cal .dn{font-weight:600;margin-bottom:3px}
.cal .ce{border-radius:4px;color:#fff;padding:1px 5px;margin-bottom:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .ce.overdue{outline:2px solid var(--danger)}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:300;align-items:center}
#toast div{background:#111827;color:#fff;padding:9px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px}
#toast div.err{background:var(--danger)}
.rem-item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--panel);flex-wrap:wrap}
.rem-item .info{flex:1;min-width:220px}
.lbl-ov{color:var(--danger);font-weight:700}.lbl-soon{color:var(--warn);font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center}
@media (max-width:800px){aside{display:none}.grid2,.grid3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.hash='#/'">🗂 專案時程暨處理流程紀錄系統</div>
  <button class="hbtn" id="hbRem" onclick="location.hash='#/reminders'" title="提醒中心">🔔 提醒<span class="cnt" id="remCnt" hidden></span></button>
  <button class="hbtn" id="hbPer" onclick="location.hash='#/persons'" title="共用設定：專案人員">👥 人員</button>
  <button class="hbtn" id="hbSet" onclick="location.hash='#/settings'" title="設定與備份">⚙ 設定／備份</button>
</header>
<div id="app">
  <aside>
    <div class="side-top">
      <div class="row" style="flex-wrap:nowrap"><button class="btn primary" style="flex:1" onclick="openProjectModal()">＋ 新增專案</button><button class="btn" onclick="openImportProject()" title="從 JSON 匯出檔匯入專案">⬆ 匯入專案</button></div>
      <input id="pSearch" placeholder="搜尋專案…" oninput="renderProjList()">
      <select id="pStatus" onchange="renderProjList()"></select>
    </div>
    <div id="projList"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 常數與工具 ================= */
const STATUSES=['未開始','處理中','待確認','已完成','取消'];
const STATUS_COLOR={'未開始':'#64748b','處理中':'#2563eb','待確認':'#a855f7','已完成':'#16a34a','取消':'#9ca3af'};
const PRIORITIES=['高','中','低'];
const PROJ_STATUSES=['規劃中','進行中','暫停','已結案'];
const PROJ_COLORS=['#2563eb','#16a34a','#ea580c','#a855f7','#db2777','#0891b2','#ca8a04','#475569'];
const STORE_NAMES=['projects','persons','events','processLogs','attachments','reminderLogs','settings'];
const DONE=s=>s==='已完成'||s==='取消';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmtD(new Date());
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const nowISO=()=>new Date().toISOString();
const nowLocalDT=()=>{const d=new Date();return `${fmtD(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDT=s=>s?s.replace('T',' ').slice(0,16):'';
const fmtSize=b=>b==null?'':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const statusBadge=s=>`<span class="badge" style="background:${STATUS_COLOR[s]||'#64748b'}">${esc(s)}</span>`;
function leftText(e){if(!e.dueDate)return '';if(DONE(e.status))return '';const l=diffDays(today(),e.dueDate);return l<0?`<span class="lbl-ov">逾期 ${-l} 天</span>`:l===0?'<span class="lbl-ov">今天到期</span>':l<=3?`<span class="lbl-soon">剩 ${l} 天</span>`:`剩 ${l} 天`}
function dueClass(e){if(DONE(e.status))return 'done';if(!e.dueDate)return '';const l=diffDays(today(),e.dueDate);return l<0?'overdue':l<=3?'soon':''}
function toast(msg,err){const d=document.createElement('div');d.textContent=msg;if(err)d.className='err';$('#toast').append(d);setTimeout(()=>d.remove(),err?4500:2600)}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}toast('已複製：'+t)}
function stampName(){const d=new Date();return `${fmtD(d).replace(/-/g,'')}_${pad(d.getHours())}${pad(d.getMinutes())}`}

/* ================= IndexedDB 資料層 ================= */
const DB_NAME='ProjectTrackerDB',DB_VER=1;
const INDEXES={projects:['status'],persons:['name','company'],events:['projectId','dueDate','status'],processLogs:['eventId'],attachments:['eventId'],reminderLogs:['eventId']};
let db;
const req2p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('交易中止'))});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of STORE_NAMES){if(d.objectStoreNames.contains(n))continue;
    if(n==='settings'){d.createObjectStore(n,{keyPath:'key'});continue}
    const s=d.createObjectStore(n,{keyPath:'id'});(INDEXES[n]||[]).forEach(i=>s.createIndex(i,i))}};
  r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error);r.onblocked=()=>toast('資料庫被其他分頁佔用，請關閉其他分頁',true)})}
const DB={
  get:(s,k)=>req2p(db.transaction(s).objectStore(s).get(k)),
  all:s=>req2p(db.transaction(s).objectStore(s).getAll()),
  byIndex:(s,i,v)=>req2p(db.transaction(s).objectStore(s).index(i).getAll(v)),
  keysByIndex:(s,i,v)=>req2p(db.transaction(s).objectStore(s).index(i).getAllKeys(v)),
  put:(s,o)=>req2p(db.transaction(s,'readwrite').objectStore(s).put(o)),
  del:(s,k)=>req2p(db.transaction(s,'readwrite').objectStore(s).delete(k)),
};
function countByEvent(store){return new Promise((res,rej)=>{const m={};const r=db.transaction(store).objectStore(store).index('eventId').openKeyCursor();
  r.onsuccess=()=>{const c=r.result;if(c){m[c.key]=(m[c.key]||0)+1;c.continue()}else res(m)};r.onerror=()=>rej(r.error)})}
async function deleteEventsCascade(ids){const t=db.transaction(['events','processLogs','attachments','reminderLogs'],'readwrite');
  for(const id of ids){t.objectStore('events').delete(id);
    for(const s of ['processLogs','attachments','reminderLogs']){const st=t.objectStore(s);const kr=st.index('eventId').getAllKeys(id);kr.onsuccess=()=>kr.result.forEach(k=>st.delete(k))}}
  return txDone(t)}

/* ================= 狀態 ================= */
const DEFAULT_SETTINGS={remindDays:[7,3,1],maxFileMB:50,theme:'light'};
const S={projects:[],persons:[],events:[],rlogs:{},attCount:{},logCount:{},settings:{...DEFAULT_SETTINGS},
  view:'list',filters:{status:'',handler:'',from:'',to:'',kw:''},sort:{key:'dueDate',dir:1},ganttW:24,calMonth:today().slice(0,7),
  personKw:'',showInactive:false,notified:new Set(),lastProject:null};
async function loadAll(){
  [S.projects,S.persons,S.events]=await Promise.all([DB.all('projects'),DB.all('persons'),DB.all('events')]);
  S.rlogs=Object.fromEntries((await DB.all('reminderLogs')).map(r=>[r.id,r]));
  S.attCount=await countByEvent('attachments');S.logCount=await countByEvent('processLogs');
  const st=await DB.get('settings','app');S.settings={...DEFAULT_SETTINGS,...(st?.value||{})};
  S.projects.sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  S.persons.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'));
}
async function saveSettings(){await DB.put('settings',{key:'app',value:S.settings});applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme==='dark'?'dark':'light'}
const person=id=>S.persons.find(p=>p.id===id);
const pName=id=>person(id)?.name||'';
const project=id=>S.projects.find(p=>p.id===id);
const personLabel=p=>`${p.name}${p.company||p.dept?'（'+[p.company,p.dept].filter(Boolean).join('／')+'）':''}${p.active===false?'［停用］':''}`;
function projStats(pid){const ev=S.events.filter(e=>e.projectId===pid);const valid=ev.filter(e=>e.status!=='取消');const done=ev.filter(e=>e.status==='已完成').length;
  const t=today();return {total:ev.length,done,overdue:ev.filter(e=>!DONE(e.status)&&e.dueDate&&e.dueDate<t).length,rate:valid.length?Math.round(done/valid.length*100):0}}

/* ================= Modal ================= */
function openModal({title,body,wide,buttons=[],onClose,beforeClose}){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x title="關閉">✕</button></div><div class="modal-body"></div><div class="modal-foot"></div></div>`;

function filteredEvents(pid){const f=S.filters;let list=S.events.filter(e=>e.projectId===pid);
  if(f.status)list=list.filter(e=>f.status==='__open'?!DONE(e.status):e.status===f.status);

  const {key,dir}=S.sort;const prOrder={'高':0,'中':1,'低':2};

  return list.sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:0)*dir})}

/* ---------- 甘特 ---------- */
function renderGantt(list){const items=list.filter(e=>e.startDate||e.dueDate);
  if(!items.length)return '<div class="empty">沒有可顯示的事件（需有開始或截止日期）</div>';
  const t=today();let min=t,max=t;
  items.forEach(e=>{const a=e.startDate||e.dueDate,b=e.dueDate||e.startDate;[a,b].forEach(x=>{if(x<min)min=x;if(x>max)max=x})});
  min=addDays(min,-3);max=addDays(max,5);const W=S.ganttW,n=diffDays(min,max)+1;
  let months='',days='',seg=null;
  for(let i=0;i<n;i++){const ds=addDays(min,i),d=parseD(ds),ym=ds.slice(0,7);
    if(!seg||seg.ym!==ym){if(seg)months+=`<div class="g-m" style="width:${seg.c*W}px">${seg.ym}</div>`;seg={ym,c:0}}seg.c++;
    days+=`<div class="g-d ${d.getDay()%6===0?'wk':''} ${ds===t?'td':''}" style="width:${W}px">${W>=18?d.getDate():''}</div>`}
  months+=`<div class="g-m" style="width:${seg.c*W}px">${seg.ym}</div>`;
  const tx=diffDays(min,t)*W+W/2-1;
  const rows=items.map(e=>{let a=e.startDate||e.dueDate,b=e.dueDate||e.startDate;if(a>b)[a,b]=[b,a];
    const x=diffDays(min,a)*W,w=(diffDays(a,b)+1)*W;
    return `<div class="g-row" data-ev="${e.id}"><div class="g-label" title="${esc(e.title)}"><span class="dot" style="background:${STATUS_COLOR[e.status]}"></span>${esc(e.title)}<small>${esc(pName(e.handlerId))}</small></div>
    <div class="g-track" style="width:${n*W}px;background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:${W}px 100%"><div class="g-today" style="left:${tx}px"></div>
    <div class="g-bar ${dueClass(e)}" style="left:${x}px;width:${w}px;background:${STATUS_COLOR[e.status]}" title="${esc(`${e.title}\n${a} ~ ${b}\n${e.status}｜${pName(e.handlerId)}`)}">${w>50?esc(e.title):''}</div></div></div>`}).join('');
  return `<div class="row" style="margin-bottom:8px"><span class="small muted">縮放：</span>${[[10,'月'],[24,'週'],[40,'日']].map(([w,t])=>`<button class="btn sm ${S.ganttW===w?'primary':''}" data-gw="${w}">${t}</button>`).join('')}
    <span class="small muted" style="margin-left:12px">${STATUSES.map(s=>`<span class="dot" style="background:${STATUS_COLOR[s]}"></span> ${s}`).join('　')}　｜　紅框：已逾期　紅線：今天</span></div>
    <div class="gantt"><div class="g-head"><div class="g-label g-corner">事件（${items.length}）</div><div><div class="g-months">${months}</div><div class="g-days">${days}</div></div></div>${rows}</div>`}
/* ---------- 月曆 ---------- */
function renderCalendar(list){const [y,mo]=S.calMonth.split('-').map(Number);const first=new Date(y,mo-1,1);const start=fmtD(new Date(y,mo-1,1-first.getDay()));const t=today();
  const byDue={};list.forEach(e=>{if(e.dueDate)(byDue[e.dueDate]??=[]).push(e)});
  let cells='';for(let i=0;i<42;i++){const ds=addDays(start,i);const evs=byDue[ds]||[];
    cells+=`<div class="cc ${ds.slice(0,7)!==S.calMonth?'oth':''} ${ds===t?'td':''}"><div class="dn">${parseD(ds).getDate()}</div>${evs.map(e=>`<div class="ce ${dueClass(e)==='overdue'?'overdue':''}" data-ev="${e.id}" style="background:${STATUS_COLOR[e.status]}" title="${esc(e.title+'｜'+e.status+'｜'+pName(e.handlerId))}">${esc(e.title)}</div>`).join('')}</div>`}
  return `<div class="row" style="margin-bottom:8px"><button class="btn sm" data-cal="-1">◀</button><b style="font-size:16px;min-width:110px;text-align:center">${y} 年 ${mo} 月</b><button class="btn sm" data-cal="1">▶</button><button class="btn sm" data-cal="0">本月</button><span class="small muted">（依截止日顯示）</span></div>
  <div class="cal">${['日','一','二','三','四','五','六'].map(d=>`<div class="ch">${d}</div>`).join('')}${cells}</div>`}

async function openEventEditor(pid,evId){

    onClose:()=>W.urls.forEach(u=>URL.revokeObjectURL(u)),

  body.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.f==='handlerId'||t.dataset.f==='status'){ev[t.dataset.f]=t.value;setDirty();if(t.dataset.f==='handlerId')renderTab()}

async function saveEvent(m,W){const ev=W.ev;
  ev.title=(ev.title||'').trim();if(!ev.title){W.tab='basic';m.body.querySelector('[data-tab=basic]').click();toast('請輸入事件標題',true);return}
  if(ev.startDate&&ev.dueDate&&ev.dueDate<ev.startDate){toast('截止日期不可早於開始日期',true);return}
  ev.updatedAt=nowISO();
  const strip=o=>{const {_dirty,...x}=o;return x};
  const t=db.transaction(['events','processLogs','attachments'],'readwrite');
  t.objectStore('events').put(ev);
  W.logDel.forEach(id=>t.objectStore('processLogs').delete(id));W.logs.filter(l=>l._dirty).forEach(l=>t.objectStore('processLogs').put(strip(l)));
  W.attDel.forEach(id=>t.objectStore('attachments').delete(id));W.atts.filter(a=>a._dirty).forEach(a=>t.objectStore('attachments').put(strip(a)));
  try{await txDone(t)}catch(err){toast('儲存失敗：'+(err?.name==='QuotaExceededError'?'瀏覽器儲存空間不足':err?.message),true);return}
  await loadAll();m.close(true);render();toast('事件已儲存');checkReminders()}

function pathToUrl(p){p=(p||'').trim().replace(/^"|"$/g,'');
  if(/^[a-z][a-z0-9+.-]*:\/\//i.test(p)||/^mailto:/i.test(p))return p;
  const enc=s=>encodeURI(s).replace(/#/g,'%23').replace(/\?/g,'%3F');
  if(/^\\\\/.test(p))return 'file:'+enc(p.replace(/\\/g,'/'));
  if(/^[a-zA-Z]:[\\/]/.test(p))return 'file:///'+enc(p.replace(/\\/g,'/'));
  if(p.startsWith('/'))return 'file://'+enc(p);
  return p}

async function deletePerson(id){const p=person(id),u=personUsage(id);
  if(u.events){if(p.active===false){toast(`此人員已被 ${u.events} 個事件引用，無法刪除`,true);return}
    if(await confirmDlg(`「${p.name}」已被 ${u.events} 個事件引用，無法刪除。\n是否改為「停用」？（停用後不會出現在選單，但既有紀錄保留）`,{okText:'改為停用'})){p.active=false;await DB.put('persons',p);await loadAll();render();toast('已停用')}return}
  if(!await confirmDlg(`確定刪除人員「${p.name}」？`,{okText:'刪除',danger:true}))return;
  await DB.del('persons',id);await loadAll();render();toast('人員已刪除')}
/* ---------- CSV ---------- */
function parseCSV(text){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(v=>v.trim()!==''))}
const toCSV=rows=>rows.map(r=>r.map(v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
async function decodeFile(file,enc){const buf=await file.arrayBuffer();
  if(enc==='auto'){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,'')}catch{return new TextDecoder('big5').decode(buf)}}
  return new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,'')}
function exportPersonsCSV(){const rows=[['姓名','公司','部門','EMAIL','電話','備註','狀態'],...S.persons.map(p=>[p.name,p.company,p.dept,p.email,p.phone,p.note||'',p.active===false?'停用':'啟用'])];
  downloadBlob(new Blob(['\uFEFF'+toCSV(rows)],{type:'text/csv;charset=utf-8'}),`專案人員_${stampName()}.csv`)}
function importPersonsCSV(){
  openModal({title:'匯入人員 CSV',body:`<div class="fld">CSV 檔案<input type="file" id="ic_file" accept=".csv,.tsv,.txt"></div>
    <label class="fld" style="margin-top:10px">編碼<select id="ic_enc"><option value="auto">自動偵測（UTF-8 → Big5）</option><option value="utf-8">UTF-8</option><option value="big5">Big5</option></select></label>
    <div class="small muted" style="margin-top:10px;line-height:1.7">第一列標題可用：姓名、公司、部門、EMAIL、電話、備註、狀態（順序不拘）。<br>若無標題列，則依上述順序讀取。姓名＋EMAIL 相同者視為同一人並更新資料。</div>`,
    buttons:[{text:'取消'},{text:'匯入',cls:'primary',onClick:async m=>{const file=$('#ic_file',m.el).files[0];if(!file){toast('請選擇檔案',true);return}
      const rows=parseCSV(await decodeFile(file,$('#ic_enc',m.el).value));if(!rows.length){toast('檔案沒有資料',true);return}
      const alias={name:['姓名','name','名稱'],company:['公司','company','單位'],dept:['部門','dept','department'],email:['email','e-mail','電子郵件','信箱'],phone:['電話','phone','tel','分機'],note:['備註','note','remark'],active:['狀態','status','active']};
      const head=rows[0].map(h=>h.trim().toLowerCase());const map={};
      for(const [k,al] of Object.entries(alias)){const i=head.findIndex(h=>al.map(a=>a.toLowerCase()).includes(h));if(i>=0)map[k]=i}
      let data=rows;if(map.name!==undefined)data=rows.slice(1);else ['name','company','dept','email','phone','note','active'].forEach((k,i)=>map[k]=i);
      let add=0,updN=0,skip=0;const t=db.transaction('persons','readwrite');const st=t.objectStore('persons');
      for(const r of data){const g=k=>map[k]!==undefined?(r[map[k]]||'').trim():'';const name=g('name');if(!name){skip++;continue}
        const o={name,company:g('company'),dept:g('dept'),email:g('email'),phone:g('phone'),note:g('note'),active:g('active')!=='停用'};
        const ex=S.persons.find(x=>x.name===name&&(x.email||'').toLowerCase()===o.email.toLowerCase());
        if(ex){st.put({...ex,...o,updatedAt:nowISO()});updN++}else{const np={id:uid(),...o,createdAt:nowISO()};st.put(np);S.persons.push(np);add++}}
      await txDone(t);await loadAll();m.close(true);render();toast(`匯入完成：新增 ${add}、更新 ${updN}、略過 ${skip}`)}}]})}

/* ================= 提醒 ================= */
function reminderState(e){if(!e||DONE(e.status)||!e.dueDate)return null;const left=diffDays(today(),e.dueDate);
  if(left<0)return {e,left,N:-1,kind:'overdue',key:`${e.id}|${e.dueDate}|-1`};
  const hit=(e.remindDays||[]).filter(n=>left<=n).sort((a,b)=>a-b);
  if(!hit.length)return {e,left,N:null,kind:'upcoming'};
  return {e,left,N:hit[0],kind:'due',key:`${e.id}|${e.dueDate}|${hit[0]}`}}
function isActive(r){if(!r.key)return false;const l=S.rlogs[r.key];if(!l)return true;if(l.dismissed)return false;if(l.snoozeUntil&&today()<l.snoozeUntil)return false;return true}
const allReminders=()=>S.events.map(reminderState).filter(Boolean);
const activeReminders=()=>allReminders().filter(r=>r.kind!=='upcoming'&&isActive(r)).sort((a,b)=>a.left-b.left);
async function dismissRem(key,eventId,snooze){const [,due,n]=key.split('|');
  await DB.put('reminderLogs',{id:key,eventId,dueDate:due,remindDay:+n,triggeredAt:S.rlogs[key]?.triggeredAt||nowISO(),dismissed:!snooze,snoozeUntil:snooze?addDays(today(),1):'',updatedAt:nowISO()});
  await loadAll();renderHeader();if(route().name==='reminders'||route().name==='project'||route().name==='home')renderMain()}
function remRow(r,{actions=true}={}){const e=r.e,p=project(e.projectId),act=r.key&&r.kind!=='upcoming'&&isActive(r);
  return `<div class="rem-item"><span class="dot" style="background:${esc(p?.color)}"></span><div class="info"><div><b>${esc(e.title)}</b>　${statusBadge(e.status)}</div>
    <div class="small muted">${esc(p?.name)}｜截止 ${e.dueDate}｜${leftText(e)}｜處理人員：${esc(pName(e.handlerId)||'未指定')}${r.kind==='due'?`｜提醒設定：${r.N===0?'當天':'前 '+r.N+' 天'}`:''}</div></div>
    <button class="btn sm" data-open="${e.id}">開啟</button>${actions&&act?`<button class="btn sm" data-dis="${r.key}" data-eid="${e.id}">✓ 知道了</button><button class="btn sm" data-snz="${r.key}" data-eid="${e.id}">⏰ 延後 1 天</button>`:''}
    <button class="btn sm" data-mail="${e.id}">✉</button><button class="btn sm" data-ics="${e.id}">📅</button></div>`}
function bindRemRows(root,after){
  $$('[data-open]',root).forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.open);openEventEditor(e.projectId,e.id)});
  $$('[data-dis]',root).forEach(b=>b.onclick=async()=>{await dismissRem(b.dataset.dis,b.dataset.eid,false);after&&after()});
  $$('[data-snz]',root).forEach(b=>b.onclick=async()=>{await dismissRem(b.dataset.snz,b.dataset.eid,true);after&&after()});
  $$('[data-mail]',root).forEach(b=>b.onclick=()=>openMail(S.events.find(x=>x.id===b.dataset.mail)));
  $$('[data-ics]',root).forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.ics);downloadBlob(new Blob([buildICS([e])],{type:'text/calendar'}),`${e.title}.ics`)})}
function renderReminders(){const all=allReminders(),act=activeReminders();
  const ov=all.filter(r=>r.kind==='overdue').sort((a,b)=>a.left-b.left),due=all.filter(r=>r.kind==='due').sort((a,b)=>a.left-b.left),up=all.filter(r=>r.kind==='upcoming'&&r.left<=30).sort((a,b)=>a.left-b.left);
  const sec=(t,list,empty)=>`<div class="sec-title">${t}（${list.length}）</div>${list.length?list.map(r=>remRow(r)).join(''):`<div class="muted small" style="padding:6px 0 10px">${empty}</div>`}`;
  $('#main').innerHTML=`<div class="page-head"><div class="grow"><h2>🔔 提醒中心</h2><div class="muted small">今天 ${today()}　｜　桌面通知：${'Notification' in window?({granted:'已允許',denied:'已封鎖',default:'未設定'}[Notification.permission]):'不支援'}</div></div>
    <div class="row">${act.length?'<button class="btn" id="disAll">✓ 全部知道了</button>':''}<button class="btn" id="icsAll">📅 匯出全部未完成事件 .ics</button></div></div>
    ${sec('🆕 未確認提醒',act,'沒有新的提醒')}${sec('🔴 已逾期',ov,'沒有逾期事件')}${sec('🟠 已到提醒日',due,'沒有已到提醒日的事件')}${sec('🔵 30 天內即將到期（尚未到提醒日）',up,'無')}`;
  bindRemRows($('#main'));
  const da=$('#disAll');if(da)da.onclick=async()=>{for(const r of act)await dismissRem(r.key,r.e.id,false);toast('已全部標示為知道了')};
  $('#icsAll').onclick=()=>exportICS()}
function checkReminders(startup){renderHeader();const act=activeReminders();
  if('Notification' in window&&Notification.permission==='granted'){act.filter(r=>!S.notified.has(r.key)).slice(0,5).forEach(r=>{try{const n=new Notification(r.left<0?'⚠ 專案事件已逾期':'⏰ 專案事件即將到期',{body:`${project(r.e.projectId)?.name}－${r.e.title}\n截止 ${r.e.dueDate}（${r.left<0?'逾期 '+(-r.left)+' 天':'剩 '+r.left+' 天'}）`,tag:r.key});n.onclick=()=>{window.focus();openEventEditor(r.e.projectId,r.e.id)}}catch{}S.notified.add(r.key)})}
  if(startup&&act.length){const m=openModal({title:`🔔 到期提醒（${act.length}）`,wide:true,body:'<div id="remPop"></div>',buttons:[{text:'前往提醒中心',onClick:m=>{m.close(true);location.hash='#/reminders'}},{text:'全部知道了',onClick:async m=>{for(const r of activeReminders())await dismissRem(r.key,r.e.id,false);m.close(true)}},{text:'關閉',cls:'primary'}]});
    const draw=()=>{const a=activeReminders();if(!a.length){m.close(true);return}$('#remPop',m.el).innerHTML=a.map(r=>remRow(r)).join('');bindRemRows($('#remPop',m.el),draw)};draw();act.forEach(r=>S.notified.add(r.key))}}
function openMail(e){const p=project(e.projectId),h=person(e.handlerId);const left=diffDays(today(),e.dueDate);
  const cc=[...new Set((e.proposerIds||[]).map(id=>person(id)?.email).filter(x=>x&&x!==h?.email))];
  const subj=`[到期提醒] ${p?.name||''}－${e.title}（${left<0?'已逾期 '+(-left)+' 天':left===0?'今天到期':'剩 '+left+' 天'}）`;
  const body=[`${h?.name||''} 您好：`,'',`以下專案事件${left<0?'已逾期':'即將到期'}，請協助處理：`,'',`專案：${p?.name||''}`,`事件：${e.title}`,`開始日：${e.startDate||'-'}`,`截止日：${e.dueDate}`,`狀態：${e.status}`,`優先等級：${e.priority||'-'}`,`提出人員：${(e.proposerIds||[]).map(pName).filter(Boolean).join('、')||'-'}`,'','說明：',(e.description||'-').slice(0,800),'','謝謝！'].join('\r\n');
  if(!h?.email)toast('處理人員未設定 EMAIL，請在郵件中自行填入收件者',true);
  location.href=`mailto:${h?.email||''}?${cc.length?'cc='+encodeURIComponent(cc.join(';'))+'&':''}subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}
function buildICS(events){const ie=s=>String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const o=[];while(l.length>70){o.push(l.slice(0,70));l=' '+l.slice(70)}o.push(l);return o.join('\r\n')};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ProjectTracker//ZH-TW','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const e of events){if(!e.dueDate)continue;const p=project(e.projectId);
    L.push('BEGIN:VEVENT',`UID:${e.id}@project-tracker.local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${e.dueDate.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(e.dueDate,1).replace(/-/g,'')}`,
      `SUMMARY:${ie(`[到期] ${p?.name||''}－${e.title}`)}`,`DESCRIPTION:${ie(`專案：${p?.name||''}\n事件：${e.title}\n狀態：${e.status}\n處理人員：${pName(e.handlerId)||'-'}\n開始日：${e.startDate||'-'}\n截止日：${e.dueDate}\n\n${e.description||''}`)}`,'TRANSP:TRANSPARENT');
    for(const n of [...(e.remindDays||[])].sort((a,b)=>b-a)){const h=n*24-9;L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ie(`${e.title} ${n===0?'今天到期':n+' 天後到期'}`)}`,`TRIGGER:${h>0?'-PT'+h+'H':'PT9H'}`,'END:VALARM')}
    L.push('END:VEVENT')}
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n')}
function exportICS(pid){const list=S.events.filter(e=>(!pid||e.projectId===pid)&&!DONE(e.status)&&e.dueDate);
  if(!list.length){toast('沒有可匯出的未完成事件（需有截止日）',true);return}
  downloadBlob(new Blob([buildICS(list)],{type:'text/calendar'}),`${pid?project(pid).name:'全部專案'}_到期提醒_${stampName()}.ics`);toast(`已匯出 ${list.length} 個事件`)}

  <div class="card" style="border-color:var(--danger)"><h3 style="margin-bottom:12px;color:var(--danger)">危險區域</h3><button class="btn danger" id="st_clear">清除全部資料</button></div>`;
  const np=()=>{$('#st_np').textContent='Notification' in window?({granted:'✅ 已允許',denied:'⛔ 已封鎖（請至瀏覽器網站設定開啟）',default:'⚪ 未設定'}[Notification.permission]):'此瀏覽器不支援'};np();
  $('#st_save').onclick=async()=>{const rd=[...new Set($('#st_rd').value.split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n)&&n>=0&&n<=365))].sort((a,b)=>b-a);
    S.settings={...s,remindDays:rd,maxFileMB:Math.max(1,+$('#st_mb').value||50),theme:$('#st_theme').value};await saveSettings();toast('設定已儲存');renderSettings()};
  $('#st_nreq').onclick=async()=>{if(!('Notification' in window))return toast('不支援通知',true);try{await Notification.requestPermission()}catch{}np();if(Notification.permission!=='granted')toast('未取得授權（部分瀏覽器在 file:// 下不支援通知）',true)};
  $('#st_ntest').onclick=()=>{try{new Notification('測試通知',{body:'桌面通知運作正常'});}catch(e){toast('無法顯示通知：'+e.message,true)}};
  $('#st_preq').onclick=async()=>{const ok=await navigator.storage?.persist?.();toast(ok?'已取得持久化儲存':'瀏覽器未核准持久化',!ok);showPers()};
  const showPers=async()=>{$('#st_pers').textContent=navigator.storage?.persisted?((await navigator.storage.persisted())?'✅ 已啟用':'⚪ 未啟用'):'不支援'};showPers();
  if(navigator.storage?.estimate){const q=await navigator.storage.estimate();$('#st_q').innerHTML=`已使用 <b>${fmtSize(q.usage)}</b>／可用上限約 ${fmtSize(q.quota)}（${q.quota?(q.usage/q.quota*100).toFixed(2):0}%）`}else $('#st_q').textContent='不支援查詢';
  $('#bk_exp').onclick=()=>exportData();
  $('#bk_imp').onclick=async()=>{const f=$('#bk_file').files[0];if(!f)return toast('請選擇備份檔',true);await importData(f,$('#bk_mode').value)};
  $('#st_clear').onclick=async()=>{if(!await confirmDlg('確定清除全部專案、事件、人員、附件與設定？此動作無法復原。',{danger:true,okText:'清除'}))return;
    if(!await confirmDlg('再次確認：建議先匯出備份。確定清除全部資料？',{danger:true,okText:'確定清除',title:'二次確認'}))return;
    const t=db.transaction(STORE_NAMES,'readwrite');STORE_NAMES.forEach(s=>t.objectStore(s).clear());await txDone(t);await loadAll();applyTheme();toast('已清除全部資料');location.hash='#/'}}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'application/octet-stream'})}
async function exportData(pid){toast('匯出中…');const data={};for(const s of STORE_NAMES)data[s]=await DB.all(s);
  if(pid){data.projects=data.projects.filter(p=>p.id===pid);data.events=data.events.filter(e=>e.projectId===pid);const ids=new Set(data.events.map(e=>e.id));
    ['processLogs','attachments','reminderLogs'].forEach(s=>data[s]=data[s].filter(x=>ids.has(x.eventId)));
    const pids=new Set(data.events.flatMap(e=>[e.handlerId,...(e.proposerIds||[])]).concat(data.processLogs.map(l=>l.personId)).filter(Boolean));data.persons=data.persons.filter(p=>pids.has(p.id));delete data.settings}
  for(const a of data.attachments)if(a.blob){a.blobB64=await blobToB64(a.blob);delete a.blob}
  const json=JSON.stringify({app:'ProjectTracker',version:1,scope:pid?'project':'all',exportedAt:nowISO(),data});
  downloadBlob(new Blob([json],{type:'application/json'}),`${pid?'專案_'+project(pid).name:'專案時程系統_全部'}_備份_${stampName()}.json`);toast('匯出完成（'+fmtSize(json.length)+'）')}
async function importData(file,mode){let obj;try{obj=JSON.parse(await file.text())}catch{return toast('檔案不是有效的 JSON',true)}
  if(obj?.app!=='ProjectTracker'||!obj.data)return toast('不是本系統的備份檔',true);
  const d=obj.data;const cnt=`專案 ${d.projects?.length||0}、事件 ${d.events?.length||0}、人員 ${d.persons?.length||0}、附件 ${d.attachments?.length||0}`;
  if(!await confirmDlg(`備份檔（${obj.scope==='project'?'單一專案':'全部'}，${obj.exportedAt?.slice(0,10)||''}）\n內容：${cnt}\n\n匯入方式：${mode==='overwrite'?'覆蓋 ⚠ 會先清空目前所有資料！':'合併'}\n確定匯入？`,{okText:'匯入',danger:mode==='overwrite'}))return;
  for(const a of d.attachments||[])if(a.blobB64){a.blob=b64ToBlob(a.blobB64,a.mime);delete a.blobB64}
  const t=db.transaction(STORE_NAMES,'readwrite');if(mode==='overwrite')STORE_NAMES.forEach(s=>t.objectStore(s).clear());
  STORE_NAMES.forEach(s=>(d[s]||[]).forEach(r=>t.objectStore(s).put(r)));
  try{await txDone(t)}catch(e){return toast('匯入失敗：'+e?.message,true)}
  await loadAll();applyTheme();render();toast('匯入完成：'+cnt)}

/* ================= 匯入專案 ================= */
function openImportProject(){
  let obj=null;
  const m=openModal({title:'⬆ 匯入專案',wide:true,body:`<div class="fld">專案匯出檔（JSON，可使用「💾 匯出專案」或「匯出全部」產生的檔案）<input type="file" id="ip_file" accept=".json,application/json"></div>
    <div id="ip_preview" style="margin-top:12px"></div>`,
    buttons:[{text:'取消'},{text:'⬆ 匯入',cls:'primary',onClick:async(m,btn)=>{
      if(!obj){toast('請先選擇有效的匯出檔',true);return}
      const pids=$$('input[data-ip]:checked',m.el).map(x=>x.dataset.ip);if(!pids.length){toast('請至少勾選一個專案',true);return}
      const mode=($('input[name=ip_mode]:checked',m.el)||{}).value||'new',renameDup=$('#ip_rename',m.el)?.checked;
      const names=obj.data.projects.filter(p=>pids.includes(p.id)).map(p=>'．'+p.name).join('\n');
      const exist=mode==='replace'?pids.filter(id=>project(id)).length:0;
      if(!await confirmDlg(`將匯入 ${pids.length} 個專案：\n${names}\n\n匯入方式：${mode==='new'?'建立為新專案（不影響現有資料）':`取代同 ID 專案${exist?`\n⚠ 有 ${exist} 個既有專案的事件、處理過程、附件、提醒紀錄將被刪除並以匯入資料取代！`:'（目前無同 ID 專案，將直接新增）'}`}\n\n確定匯入？`,{okText:'匯入',danger:!!exist}))return;
      btn.disabled=true;
      try{const r=await importProjects(obj,pids,mode,renameDup);m.close(true);
        toast(`匯入完成：專案 ${r.projects}、事件 ${r.events}、處理過程 ${r.logs}、附件 ${r.atts}、新增人員 ${r.persons}`);
        if(r.ids.length===1)location.hash='#/project/'+r.ids[0];else render();checkReminders(false)}
      catch(err){btn.disabled=false;toast('匯入失敗：'+(err?.name==='QuotaExceededError'?'瀏覽器儲存空間不足':err?.message||err),true)}}}]});
  $('#ip_file',m.el).onchange=async e=>{const f=e.target.files[0];const pv=$('#ip_preview',m.el);obj=null;if(!f){pv.innerHTML='';return}
    let o;try{o=JSON.parse(await f.text())}catch{pv.innerHTML='<div class="empty">檔案不是有效的 JSON</div>';return}
    if(o?.app!=='ProjectTracker'||!o.data||!Array.isArray(o.data.projects)){pv.innerHTML='<div class="empty">不是本系統的匯出檔</div>';return}
    const d=o.data;if(!d.projects.length){pv.innerHTML='<div class="empty">檔案中沒有專案資料</div>';return}
    obj=o;
    const cnt=(arr,ids)=>(arr||[]).filter(x=>ids.has(x.eventId)).length;
    const rows=d.projects.map(p=>{const evs=(d.events||[]).filter(e=>e.projectId===p.id);const ids=new Set(evs.map(e=>e.id));
      const ex=project(p.id),dupName=S.projects.some(x=>x.name===p.name);
      return `<tr><td><input type="checkbox" data-ip="${esc(p.id)}" checked></td><td><span class="dot" style="background:${esc(p.color||'#2563eb')}"></span> <b>${esc(p.name)}</b></td><td>${esc(p.code||'')}</td><td>${esc(p.status||'')}</td>
        <td>${evs.length}</td><td>${cnt(d.processLogs,ids)}</td><td>${cnt(d.attachments,ids)}</td>
        <td>${ex?'<span class="tag" style="color:var(--warn)">已存在（同 ID）</span>':dupName?'<span class="tag" style="color:var(--warn)">名稱重複</span>':'<span class="tag" style="color:var(--ok)">新專案</span>'}</td></tr>`}).join('');
    pv.innerHTML=`<div class="small muted" style="margin-bottom:6px">檔案類型：${o.scope==='project'?'單一專案':'全部備份'}　｜　匯出時間：${esc(fmtDT((o.exportedAt||'').slice(0,16)))}　｜　專案 ${d.projects.length} 個</div>
      <table class="tbl"><thead><tr><th><input type="checkbox" id="ip_all" checked title="全選"></th><th>專案名稱</th><th>代號</th><th>狀態</th><th>事件</th><th>處理過程</th><th>附件</th><th>比對結果</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sec-title">匯入方式</div>
      <label class="row" style="margin-bottom:6px"><input type="radio" name="ip_mode" value="new" checked style="width:auto"> 建立為新專案（重新產生 ID，不影響現有資料，可重複匯入）</label>
      <label class="row" style="margin:0 0 10px 22px"><input type="checkbox" id="ip_rename" checked> 專案名稱重複時自動加上「（匯入）」</label>
      <label class="row"><input type="radio" name="ip_mode" value="replace" style="width:auto"> 取代同 ID 專案（刪除既有該專案的事件、處理過程、附件後，以匯入資料取代；無同 ID 時直接新增）</label>
      <div class="small muted" style="margin-top:12px;line-height:1.7">ℹ 人員對應：依 ID 或「姓名＋EMAIL」比對共用人員，已存在者沿用，不存在者自動新增到共用設定。上傳的附件檔案會一併還原。</div>`;
    $('#ip_all',pv).onchange=ev=>$$('input[data-ip]',pv).forEach(x=>x.checked=ev.target.checked);
    const syncRen=()=>{$('#ip_rename',pv).disabled=$('input[name=ip_mode]:checked',pv).value!=='new'};$$('input[name=ip_mode]',pv).forEach(r=>r.onchange=syncRen)};
}
async function importProjects(obj,pids,mode,renameDup){
  const d=obj.data,sel=new Set(pids),isNew=mode==='new';
  const projs=d.projects.filter(p=>sel.has(p.id));
  const evs=(d.events||[]).filter(e=>sel.has(e.projectId));const evIds=new Set(evs.map(e=>e.id));
  const logs=(d.processLogs||[]).filter(x=>evIds.has(x.eventId));
  const atts=(d.attachments||[]).filter(x=>evIds.has(x.eventId));
  const rls=(d.reminderLogs||[]).filter(x=>evIds.has(x.eventId));
  // 人員對應
  const used=new Set(evs.flatMap(e=>[e.handlerId,...(e.proposerIds||[])]).concat(logs.map(l=>l.personId)).filter(Boolean));
  const pmap={},newPersons=[];
  for(const ip of d.persons||[]){if(!used.has(ip.id))continue;
    const ex=person(ip.id)||S.persons.find(x=>x.name===ip.name&&(x.email||'').toLowerCase()===(ip.email||'').toLowerCase());
    if(ex)pmap[ip.id]=ex.id;else{newPersons.push({...ip,createdAt:ip.createdAt||nowISO()});pmap[ip.id]=ip.id}}
  const mp=id=>id?(pmap[id]||id):id;
  // ID 對應
  const P={},E={};projs.forEach(p=>P[p.id]=isNew?uid():p.id);evs.forEach(e=>E[e.id]=isNew?uid():e.id);
  const names=new Set(S.projects.map(p=>p.name));
  const outP=projs.map(p=>{const o={...p,id:P[p.id],updatedAt:nowISO()};
    if(isNew){o.createdAt=nowISO();if(renameDup&&names.has(o.name)){let n=o.name+'（匯入）',i=2;while(names.has(n))n=`${o.name}（匯入${i++}）`;o.name=n}names.add(o.name)}return o});
  const outE=evs.map(e=>({...e,id:E[e.id],projectId:P[e.projectId],handlerId:mp(e.handlerId)||'',proposerIds:(e.proposerIds||[]).map(mp)}));
  const outL=logs.map(l=>({...l,id:isNew?uid():l.id,eventId:E[l.eventId],personId:mp(l.personId)||''}));
  const outA=atts.map(a=>{const o={...a,id:isNew?uid():a.id,eventId:E[a.eventId]};if(o.blobB64){o.blob=b64ToBlob(o.blobB64,o.mime);delete o.blobB64}return o});
  const outR=rls.map(r=>({...r,id:isNew?`${E[r.eventId]}|${r.dueDate}|${r.remindDay}`:r.id,eventId:E[r.eventId]}));
  // 取代模式：先取得既有資料的 key
  const del={events:[],processLogs:[],attachments:[],reminderLogs:[]};
  if(!isNew){for(const p of projs){if(!project(p.id))continue;
    for(const e of S.events.filter(x=>x.projectId===p.id)){del.events.push(e.id);
      for(const s of ['processLogs','attachments','reminderLogs'])del[s].push(...await DB.keysByIndex(s,'eventId',e.id))}}}
  const stores=['projects','persons','events','processLogs','attachments','reminderLogs'];
  const t=db.transaction(stores,'readwrite');
  for(const [s,keys] of Object.entries(del))keys.forEach(k=>t.objectStore(s).delete(k));
  newPersons.forEach(p=>t.objectStore('persons').put(p));
  outP.forEach(o=>t.objectStore('projects').put(o));outE.forEach(o=>t.objectStore('events').put(o));
  outL.forEach(o=>t.objectStore('processLogs').put(o));outA.forEach(o=>t.objectStore('attachments').put(o));outR.forEach(o=>t.objectStore('reminderLogs').put(o));
  await txDone(t);await loadAll();
  return {projects:outP.length,events:outE.length,logs:outL.length,atts:outA.length,persons:newPersons.length,ids:outP.map(p=>p.id)}}

async function loadSample(){const t=today();const P=(n,c,d,e)=>({id:uid(),name:n,company:c,dept:d,email:e,phone:'',note:'',active:true,createdAt:nowISO()});
  const ps=[P('XXX','本公司','資訊處','a@b.c'),P('XXX','本公司','業務部','a@b.c'),P('XXX','協力廠商','系統整合部','a@b.c')];
  const pj={id:uid(),name:'範例：核心系統優化專案',code:'DEMO-001',description:'這是範例專案，可自由修改或刪除。',startDate:addDays(t,-20),endDate:addDays(t,60),status:'進行中',color:'#2563eb',createdAt:nowISO()};
  const E=(title,s,d,st,h,pr,pri)=>({id:uid(),projectId:pj.id,title,startDate:addDays(t,s),dueDate:addDays(t,d),status:st,priority:pri||'中',proposerIds:[pr.id],handlerId:h.id,description:'',remindDays:[7,3,1],tags:[],createdAt:nowISO()});
  const evs=[E('需求訪談',-20,-12,'已完成',ps[0],ps[1]),E('規格書確認',-10,-2,'處理中',ps[2],ps[1],'高'),E('系統開發',-5,2,'處理中',ps[2],ps[0],'高'),E('UAT 測試',3,15,'未開始',ps[1],ps[0]),E('上線準備',16,30,'未開始',ps[0],ps[0])];
  const t2=db.transaction(['projects','persons','events','processLogs'],'readwrite');t2.objectStore('projects').put(pj);ps.forEach(p=>t2.objectStore('persons').put(p));evs.forEach(e=>t2.objectStore('events').put(e));
  t2.objectStore('processLogs').put({id:uid(),eventId:evs[1].id,logDate:addDays(t,-5)+'T10:00',personId:ps[2].id,content:'已提交規格書初稿，待業務單位確認。',statusChange:'處理中',createdAt:nowISO()});
  await txDone(t2);await loadAll();location.hash='#/project/'+pj.id;render();checkReminders(true)}

/* ================= 啟動 ================= */
(async()=>{
  if(!window.indexedDB){$('#main').innerHTML='<div class="empty">此瀏覽器不支援 IndexedDB，請改用 Chrome 或 Edge。</div>';return}
  try{await openDB();await loadAll()}catch(e){$('#main').innerHTML=`<div class="empty">資料庫開啟失敗：${esc(e?.message)}<br>（若使用無痕模式或瀏覽器封鎖本機儲存，請改用一般模式）</div>`;return}
  applyTheme();render();checkReminders(true);
  setInterval(()=>{checkReminders(false);if(route().name!=='project'&&!$('#modal-root').children.length)renderMain()},30*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders(false)});
})();
