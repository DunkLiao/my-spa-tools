tion-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}.section-head h2{font-size:13px;margin:0;font-weight:700}.section-head p{margin:4px 0 0;color:var(--muted);font-size:10px}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding:15px}.project-card{border:1px solid var(--line);border-radius:13px;padding:16px;transition:border .15s,transform .15s;cursor:pointer}.project-card:hover{border-color:#bfd4c5;transform:translateY(-2px)}.project-card-top{display:flex;align-items:center;gap:10px}.project-card h3{font-size:13px;margin:0;font-weight:650}.project-card .description{color:var(--muted);font-size:10px;line-height:1.6;min-height:32px;margin:12px 0}.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:7px}.progress{height:5px;border-radius:9px;background:#edf2f6;overflow:hidden}.progress span{height:100%;display:block;background:var(--river);border-radius:9px}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#81909e;font-size:10px}.due-list{display:grid;padding:4px 18px}.due-item{display:grid;grid-template-columns:minmax(0,1fr) 105px 85px;align-items:center;gap:12px;padding:12px 1px;border-bottom:1px solid #edf2f6}.due-item:last-child{border:0}.task-name{font-size:11px;font-weight:600}.task-project{font-size:10px;color:#81909e;margin-top:4px}.due-date{font-size:10px;color:#637687}.pill{border-radius:20px;padding:5px 8px;font-size:9px;white-space:nowrap;width:max-content}.pill.todo{background:#edf2f6;color:#687989}.pill.progressing{background:#eaf1f7;color:#4e7484}.pill.done{background:var(--river-soft);color:var(--river)}.pill.high{background:var(--red-soft);color:var(--red)}.pill.medium{background:var(--amber-soft);color:var(--amber)}.pill.low{background:#edf2f6;color:#748078}.empty{padding:37px 18px;text-align:center;color:#8795a2;font-size:11px}.empty strong{displ task-table th{text-align:left;padding:12px 15px;color:#8795a2;font-size:9px;font-weight:600;background:#fafbfa}.task-table td{padding:13px 15px;border-top:1px solid #eef0ed;font-size:10px}.task-table tr:hover td{background:#fcfdfb}.task-table .task-title-cell{font-size:11px;font-weight:600}.sort-button{border:0;background:transparent;color:inherit;font:inherit;padding:0}.empty-project{max-width:590px;margin:15vh auto;text-align:center;padding:30px}.empty-icon{width:54px;height:54px;background:var(--river-soft);color:var(--river);display:grid;place-items:center;border-radius:18px;font-size:23px;margin:0 auto 18px}.empty-project h2{font-size:19px;margin:0 0 8px}.empty-project p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 20px}
    dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 28px));box-shadow:0 24px 80px #263a4d35;color:var(--ink)}dialog::backdrop{background:#263a4d55;backdrop-filter:blur(3px)}.dialog-head{padding:20px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between}.dialog-head h2{font-size:16px;margin:0}.dialog-head p{font-size:10px;color:var(--muted);margin:5px 0 0}.close-button{border:0;background:transparent;color:#8795a2;font-size:20px}.dialog-form{padding:19px 22px 21px;display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:10px;color:#647067;font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:11px;color:var(--ink);background:#ffffff}.field textarea{resize:vertical;min-height:75px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.color-options{display:flex;gap:9px}.color-choice{width:22px;height:22px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px var(--line);padding:0}.color-choice.selected{box-shadow:0 0 0 2px var(--ink)}.dialog-actions{display:flex;justify-content:space-between;align-items:center;padding-top:4px}.dialog-actions-right{display:flex;gap:8px}.danger{border:0;background:transparent;color:var(--red);font-size:10px;padding:8px}.toast{position:fixed;right:22px;bottom:22px;background:#334b60;color:white;padding:12px 16px;border-radius:10px;font-size:11px;box-shadow:0 8px 28px #263a4d2e;z-index:10;animation:rise .2s ease}.toast.error{background:#8e4c45}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.loading-screen{position:fixed;inset:0;background:var(--canvas);z-index:20;display:grid;place-items:center;color:var(--muted);font-size:12px}.loading-screen.hidden{display:none}.loading-mark{margin:auto auto 10px;width:34px;height:34px;border:3px solid #d9e6ef;border-top-color:var(--river);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-banner{margin:20px auto;max-width:700px;background:var(--red-soft);color:#814a43;padding:20px;border-radius:12px;font-size:12px;line-height:1.7}
    @media(max-width:980px){.sidebar{width:210px}.main{margin-left:210px}.content{padding:28px 25px 48px}.topbar{padding:0 25px}.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.board-column{min-height:170px}.task-stack{min-height:100px}}
    @media(max-width:680px){.sidebar{position:static;width:auto;height:auto;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:2px 3px 10px}.brand-mark{width:30px;height:30px}.brand-sub,.side-label,.nav-icon,.project-section,.sidebar-bottom{display:none}.nav{grid-template-columns:repeat(2,1fr)}.nav button{justify-content:center;padding:8px;font-size:11px}.main{margin-left:0}.topbar{height:52px;padding:0 16px}.today{display:none}.content{padding:24px 15px 40px}.page-head{align-items:flex-start;margin-bottom:20px}.page-head h1{font-size:23px}.page-head p{max-width:230px;line-height:1.6}.page-head .primary{padding:10px;font-size:10px;white-space:nowrap}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:22px}.project-grid{grid-template-columns:1fr;padding:11px}.project-toolbar{gap:7px}.search{min-width:0;flex:1}.segmented{margin-left:0}.board-column{min-height:120px}.due-item{grid-template-columns:minmax(0,1fr) 82px 66px;gap:7px}.field-row{grid-template-columns:1fr}.section-head{padding:15px}.avatar{width:27px;height:27px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</head>
<body>
  <div class="loading-screen" id="loading"><div><div class="loading-mark"></div>正在開啟工作台…</div></div>
  <div class="app" id="app" aria-live="polite">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">序</div><div><div class="brand-name">栖序</div><div class="brand-sub">PROJECT WORKSPACE</div></div></div>
      <div class="side-label">工作台</div>
      <nav class="nav" aria-label="主要導覽">
        <button class="active" data-page="overview"><span class="nav-icon">◫</span>總覽</button>
        <button data-page="tasks"><span class="nav-icon">☷</span>所有任務</button>
      </nav>
      <section class="project-section"><div class="project-header"><div class="side-label">我的專案</div><button class="icon-button" id="add-project-side" aria-label="新增專案">＋</button></div><div class="project-links" id="project-links"></div><div id="archived-project-area"></div></section>
      <div class="sidebar-bottom"><div class="storage-note">資料儲存在這個瀏覽器。匯出備份以便搬移或保存。</div><div class="backup-actions"><button class="small-button" id="export-data">↓ 匯出備份</button><button class="small-button" id="import-trigger">↑ 匯入備份</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></div>
    </aside>
    <main class="main"><header class="topbar"><div class="breadcrumb">栖序　/　<strong id="crumb">總覽</strong></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar" title="個人工作區">我</div></div></header><div class="content" id="content"></div></main>
  </div>
  <dialog id="project-dialog"><div class="dialog-head"><div><h2 id="project-dialog-title">新增專案</h2><p>為這段工作旅程命名。</p></div><button class="close-button" data-close="project-dialog" aria-label="關閉">×</button></div><form class="dialog-form" id="project-form"><input type="hidden" name="id"><div class="field"><label for="project-name">專案名稱 *</label><input id="project-name" name="name" maxlength="70" required placeholder="例如：品牌網站改版"></div><div class="field"><label for="project-description">簡介</label><textarea id="project-description" name="description" maxlength="300" placeholder="這個專案想完成什麼？"></textarea></div><div class="field"><label>識別色</label><div class="color-options" id="color-options"></div><input type="hidden" name="color" value="#57856a"></div><div class="dialog-actions"><div><button type="button" class="secondary" id="archive-project" hidden>封存專案</button><button type="button" class="danger" id="delete-project" hidden>刪除專案</button></div><div class="dialog-actions-right"><button type="button" class="secondary" data-close="project-dialog">取消</button><button class="primary" type="submit">儲存專案</button></div></div></form></dialog>
  <dialog id="task-dialog"><div class="dialog-head"><div><h2 id="task-dialog-title">新增任務</h2><p>把下一步寫下來，讓進度清晰可見。</p></div><button class="close-button" data-close="task-dialog" aria-label="關閉">×</button></div><form class="dialog-form" id="task-form"><input type="hidden" name="id"><div class="field"><label for="task-title">任務名稱 *</label><input id="task-title" name="title" maxlength="100" required placeholder="例如：整理首頁內容架構"></div><div class="field"><label for="task-description">說明</label><textarea id="task-description" name="description" maxlength="500" placeholder="補充背景或完成條件…"></textarea></div><div class="field-row"><div class="field"><label for="task-project">所屬專案 *</label><select id="task-project" name="projectId" required></select></div><div class="field"><label for="task-status">狀態</label><select id="task-status" name="status"><option value="todo">待辦</option><option value="progress">進行中</option><option value="done">已完成</option></select></div></div><div class="field-row"><div class="field"><label for="task-priority">優先級</label><select id="task-priority" name="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></div><div class="field"><label for="task-assignee">負責人</label><input id="task-assignee" name="assignee" maxlength="60" placeholder="姓名"></div></div><div class="field-row"><div class="field"><label for="task-start">開始日期</label><input id="task-start" name="startDate" type="date"></div><div class="field"><label for="task-due">到期日</label><input id="task-due" name="dueDate" type="date"></div></div><div class="dialog-actions"><button type="button" class="danger" id="delete-task" hidden>刪除任務</button><div class="dialog-actions-right"><button type="button" class="secondary" data-close="task-dialog">取消</button><button class="primary" type="submit">儲存任務</button></div></div></form></dialog>
  <script>
  (()=>{
    'use strict';
    const DB_NAME='kiseq-project-workspace',DB_VERSION=1,STATUSES=['todo','progress','done'],STATUS_LABEL={todo:'待辦',progress:'進行中',done:'已完成'},PRIORITY_LABEL={low:'低',medium:'中',high:'高'},COLORS=['#456b89','#6489a7','#b58c6b','#778c9e','#b89a60','#7a8fa5'],LEGACY_PROJECT_COLORS=['#4d8988','#64899a','#56847a','#57856a','#6486a0','#b77959','#8875a6','#bb9952','#528c8a'];
    const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
    const state={projects:[],tasks:[],page:'overview',projectId:null,view:'board',filterStatus:'all',filterPriority:'all',search:'',sort:'dueDate',dragTaskId:null,db:null};
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const formatDate=value=>{if(!value)return '未設定';const [y,m,d]=value.split('-');return `${y}/${m}/${d}`};
    const isOverdue=task=>task.dueDate&&task.dueDate<localDate()&&task.status!=='done';
    const projectById=id=>state.projects.find(p=>p.id===id);
    const projectColor=project=>COLORS.includes(project?.color)?project.color:COLORS[0];
    const dbOpen=()=>new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});if(!db.objectStoreNames.contains('tasks')){const store=db.createObjectStore('tasks',{keyPath:'id'});store.createIndex('projectId','projectId',{unique:false});store.createIndex('status','status',{unique:false})}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('無法開啟資料庫'));request.onblocked=()=>reject(new Error('資料庫正在被其他分頁使用，請關閉其他工作台分頁後重試'))});
    const transact=(stores,mode,action)=>new Promise((resolve,reject)=>{let tx;try{tx=state.db.transaction(stores,mode);action(tx)}catch(error){reject(error);return}tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('資料庫交易失敗'));tx.onabort=()=>reject(tx.error||new Error('資料庫交易已取消'))});
    const readAll=storeName=>new Promise((resolve,reject)=>{try{const tx=state.db.transaction(storeName,'readonly'),req=tx.objectStore(storeName).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('讀取資料失敗'));tx.onabort=()=>reject(tx.error||new Error('讀取交易已取消'))}catch(error){reject(error)}});
    const saveRecord=(storeName,record)=>transact([storeName],'readwrite',tx=>tx.objectStore(storeName).put(record));
    const removeProject=(id)=>transact(['projects','tasks'],'readwrite',tx=>{tx.objectStore('projects').delete(id);const request=tx.objectStore('tasks').index('projectId').openCursor(IDBKeyRange.only(id));request.onsuccess=()=>{const cursor=request.result;if(cursor){cursor.delete();cursor.continue()}}});
    const deleteTask=id=>transact(['tasks'],'readwrite',tx=>tx.objectStore('tasks').delete(id));
    const showToast=(message,error=false)=>{const el=document.createElement('div');el.className=`toast${error?' error':''}`;el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3000)};
    const reload=async()=>{[state.projects,state.tasks]=await Promise.all([readAll('projects'),readAll('tasks')]);state.projects.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));render()};

    const importBackup=async file=>{if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validBackup(parsed))throw new Error('檔案格式不符，請選擇栖序匯出的 JSON 備份');const projectIds=new Set(parsed.projects.map(p=>p.id));if(parsed.tasks.some(t=>!projectIds.has(t.projectId)))throw new Error('備份內有任務找不到所屬專案');if(!confirm(`這會以備份中的 ${parsed.projects.length} 個專案與 ${parsed.tasks.length} 項任務取代目前資料，且無法復原。要繼續嗎？`))return;await transact(['projects','tasks'],'readwrite',tx=>{const ps=tx.objectStore('projects'),ts=tx.objectStore('tasks');ps.clear();ts.clear();parsed.projects.forEach(p=>ps.put(p));parsed.tasks.forEach(t=>ts.put(t))});await reload();showToast('備份已還原')}catch(error){showToast(`匯入失敗：${error.message}`,true)}finally{$('#import-file').value=''}};
    const bindGlobal=()=>{$$('.nav [data-page]').forEach(b=>b.onclick=()=>{ $$('.nav [data-page]').forEach(n=>n.classList.toggle('active',n===b));navigate(b.dataset.page)});$('#add-project-side').onclick=()=>openProjectDialog();$('#project-form').addEventListener('submit',saveProject);$('#task-form').addEventListener('submit',saveTask);$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#archive-project').onclick=async()=>{const id=$('#project-form').elements.id.value,p=projectById(id);if(!p)return;try{await saveRecord('projects',{...p,archived:!p.archived,updatedAt:new Date().toISOString()});$('#project-dialog').close();if(!p.archived&&state.projectId===id){state.page='overview';state.projectId=null}await reload();showToast(p.archived?'專案已恢復':'專案已封存')}catch(error){showToast(`更新失敗：${error.message}`,true)}};$('#delete-project').onclick=async()=>{const id=$('#project-form').elements.id.value,p=projectById(id),count=state.tasks.filter(t=>t.projectId===id).length;if(!confirm(`確定刪除「${p?.name}」與其中 ${count} 項任務？此操作無法復原。`))return;try{await removeProject(id);$('#project-dialog').close();if(state.projectId===id){state.page='overview';state.projectId=null}await reload();showToast('專案與相關任務已刪除')}catch(error){showToast(`刪除失敗：${error.message}`,true)}};$('#delete-task').onclick=async()=>{const id=$('#task-form').elements.id.value,t=state.tasks.find(x=>x.id===id);if(!confirm(`確定刪除任務「${t?.title}」？`))return;try{await deleteTask(id);$('#task-dialog').close();await reload();showToast('任務已刪除')}catch(error){showToast(`刪除失敗：${error.message}`,true)}};$('#export-data').onclick=exportBackup;$('#import-trigger').onclick=()=>$('#import-file').click();$('#import-file').onchange=e=>importBackup(e.target.files[0]);$('#today').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date())};
    const boot=async()=>{bindGlobal();document.addEventListener('click',e=>{const projectButton=e.target.closest('[data-open-project]');if(projectButton&&!projectButton.closest('#content'))openProject(projectButton.dataset.openProject)});document.addEventListener('keydown',e=>{if(e.key==='Escape')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#task-search')?.focus()}});try{if(!('indexedDB'in window))throw new Error('此瀏覽器不支援 IndexedDB，請改用較新版瀏覽器');state.db=await dbOpen();state.db.onversionchange=()=>{state.db.close();showToast('資料庫版本已更新，請重新整理此頁',true)};await reload();$('#loading').classList.add('hidden')}catch(error){$('#loading').classList.add('hidden');$('#content').innerHTML=`<div class="error-banner"><strong>無法載入本機資料庫</strong><br>${esc(error.message)}<br><br>請確認瀏覽器允許此網站使用本機儲存空間，並以 localhost 或 HTTPS 開啟工作台。資料未寫入其他儲存位置。</div>`}};
    boot();
  })();
  </script>
