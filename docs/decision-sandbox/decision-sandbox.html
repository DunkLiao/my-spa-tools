<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>決策沙盤推演系統 V3 | Decision Simulation Lab</title>
<style>
:root{--pri:#2563eb;--pri-d:#1d4ed8;--bg:#f1f5f9;--card:#fff;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--side:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
header{height:58px;background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .logo{font-weight:700;font-size:17px;margin-right:10px;white-space:nowrap;display:flex;align-items:center;gap:8px}
header .logo small{font-weight:400;opacity:.75;font-size:12px}
header select{min-width:260px;max-width:380px;padding:7px 10px;border-radius:6px;border:none;font:inherit}
header .sp{flex:1}

header .btn:hover{background:rgba(255,255,255,.28)}
.layout{display:flex;min-height:calc(100vh - 58px)}
nav{width:196px;background:var(--side);color:#cbd5e1;padding:12px 0;flex-shrink:0;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav a{display:flex;gap:10px;align-items:center;padding:10px 20px;color:inherit;text-decoration:none;cursor:pointer;border-left:3px solid transparent;user-select:none}

main{flex:1;padding:20px 24px 60px;min-width:0}

.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}

.tb tr:hover td{background:#fafcff}
.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.tb td.c,.tb th.c{text-align:center}
.tbw{overflow:auto;max-width:100%}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:var(--pri)}
textarea{width:100%;min-height:70px;resize:vertical}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:#d1fae5;color:#047857}.b-warn{background:#fef3c7;color:#b45309}.b-bad{background:#fee2e2;color:#b91c1c}.b-info{background:#dbeafe;color:#1d4ed8}.b-gray{background:#e2e8f0;color:#475569}.b-pur{background:#ede9fe;color:#6d28d9}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.stat .l{color:var(--mu);font-size:12px}.stat .v{font-size:26px;font-weight:700;margin-top:2px}.stat .d{font-size:12px;color:var(--mu)}
.muted{color:var(--mu)}.small{font-size:12px}.bold{font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:min(640px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(1060px,96vw)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-h .x{margin-left:auto;cursor:pointer;font-size:20px;color:var(--mu);border:none;background:none}

.fr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;margin-bottom:10px}

.alert{padding:10px 14px;border-radius:8px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.a-warn{background:#fffbeb;border:1px solid #fde68a}.a-bad{background:#fef2f2;border:1px solid #fecaca}.a-ok{background:#ecfdf5;border:1px solid #a7f3d0}.a-info{background:#eff6ff;border:1px solid #bfdbfe}

<body>
<header>
  <div class="logo">🎯 決策沙盤推演系統 <small>Decision Simulation Lab V3</small></div>
  <select id="topicSel" onchange="selectTopic(this.value)"></select>
  <button class="btn" onclick="topicModal()">＋ 新增議題</button>
  <button class="btn" onclick="topicModal(cur.topicId)" id="btnEditTopic">✎ 編輯議題</button>
  <div class="sp"></div>
  <button class="btn" onclick="triggerImport()">⤒ 匯入</button>
  <button class="btn" onclick="exportJSON(false)">⤓ 匯出議題</button>
  <button class="btn" onclick="printReport()">🖨 決策報告</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden onchange="handleImport(this)">
<script>
'use strict';
/* =========================================================
   決策沙盤推演系統 V3 — 核心：資料庫、工具、計分引擎、圖表
   ========================================================= */
const DB_NAME = 'DecisionLabDB', DB_VER = 1;
const STORES = ['topics','options','criteria','reviewers','scores','scenarios','decisions','attachments'];
const PALETTE = ['#2563eb','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b','#0ea5e9','#a855f7'];
const CATS = ['成本','效益','風險','時程','人力','品質','自訂'];
const STATUS = ['草稿','評估中','待決議','已決議','取消'];
const STATUS_CLS = {'草稿':'b-gray','評估中':'b-info','待決議':'b-warn','已決議':'b-ok','取消':'b-bad'};
const DIV_CV = 0.25;           // 評審分歧門檻（變異係數）
const S = {}; STORES.forEach(s => S[s] = []);
let db;
const cur = { topicId: null, view: 'overview' };
const UI = { scoreRev: '__agg', showRange: false, sandTab: 'scenario', sensW: null, sensTopic: null, sensCrit: null, mc: {} };

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(s => {
        if (!d.objectStoreNames.contains(s)) {
          const os = d.createObjectStore(s, { keyPath: 'id' });
          if (s !== 'topics') os.createIndex('topicId', 'topicId');
        }
      });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const p = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (s, mode = 'readonly') => db.transaction(s, mode).objectStore(s);
async function loadAll(){ for (const s of STORES) S[s] = await p(store(s).getAll()); }
async function put(s, obj){
  await p(store(s, 'readwrite').put(obj));
  const i = S[s].findIndex(x => x.id === obj.id);
  if (i >= 0) S[s][i] = obj; else S[s].push(obj);
  return obj;
}
async function del(s, id){ await p(store(s, 'readwrite').delete(id)); S[s] = S[s].filter(x => x.id !== id); }
function bulk(s, arr, mode = 'put'){
  return new Promise((res, rej) => {
    if (!arr.length) return res();
    const t = db.transaction(s, 'readwrite'); const os = t.objectStore(s);
    arr.forEach(x => mode === 'put' ? os.put(x) : os.delete(x));
    t.oncomplete = () => {
      if (mode === 'put') arr.forEach(o => { const i = S[s].findIndex(x => x.id === o.id); if (i >= 0) S[s][i] = o; else S[s].push(o); });
      else { const set = new Set(arr); S[s] = S[s].filter(x => !set.has(x.id)); }
      res();
    };
    t.onerror = () => rej(t.error);
  });
}
async function clearStore(s){ await p(store(s, 'readwrite').clear()); S[s] = []; }

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const num = v => { if (v === '' || v == null) return null; const n = Number(v); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const fix = (n, d = 1) => (n == null || isNaN(n)) ? '—' : Number(n).toFixed(d);
const pct = (n, d = 1) => (n == null || isNaN(n)) ? '—' : (n * 100).toFixed(d) + '%';
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const addDays = n => { const d = new Date(Date.now() + n * 864e5); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const color = i => PALETTE[i % PALETTE.length];
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt || 0) - (b.createdAt || 0);
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
const std = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); };
const quant = (sorted, q) => { if (!sorted.length) return null; const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(1) + ' KB';

function toast(msg, type = ''){
  const d = document.createElement('div'); d.className = type; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 2800);
}
function download(name, content, mime = 'application/octet-stream'){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const safeName = s => String(s || '未命名').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

/* ---------- Modal ---------- */
let _mBtns = [];
function openModal(title, body, buttons = [], wide = false){
  _mBtns = buttons;
  const m = $('#modal'); m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = `<div class="modal-h">${esc(title)}<button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" onclick="_mClick(${i})">${esc(b.text)}</button>`).join('')}</div>`;
  $('#modalBg').classList.add('show');
  setTimeout(() => { const f = m.querySelector('.modal-b input:not([type=checkbox]),.modal-b select,.modal-b textarea'); if (f) f.focus(); }, 30);
}
async function _mClick(i){ const b = _mBtns[i]; if (!b) return; if (b.onClick) { const r = await b.onClick(); if (r === false) return; } closeModal(); }
function closeModal(){ $('#modalBg').classList.remove('show'); if (_mResolve) { _mResolve(null); _mResolve = null; } }
let _mResolve = null;
function choice(title, msg, choices){
  return new Promise(res => {
    openModal(title, `<div style="white-space:pre-wrap">${esc(msg)}</div>`, choices.map(c => ({ text: c.text, cls: c.cls, onClick: () => { const r = _mResolve; _mResolve = null; r && r(c.value); } })));
    _mResolve = res;
  });
}
const confirmBox = (msg, title = '請確認') => choice(title, msg, [{ text: '取消', value: false }, { text: '確定', cls: 'danger', value: true }]);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalBg').classList.contains('show')) closeModal(); });

/* ---------- 取資料 ---------- */
const T = () => S.topics.find(t => t.id === cur.topicId);
const OPTS = (tid = cur.topicId) => S.options.filter(x => x.topicId === tid).sort(byOrder);
const CRITS = (tid = cur.topicId) => S.criteria.filter(x => x.topicId === tid).sort(byOrder);
const REVS = (tid = cur.topicId) => S.reviewers.filter(x => x.topicId === tid).sort(byOrder);
const SCENS = (tid = cur.topicId) => S.scenarios.filter(x => x.topicId === tid).sort(byOrder);
const DECS = (tid = cur.topicId) => S.decisions.filter(x => x.topicId === tid).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const ATTS = (refType, refId) => S.attachments.filter(a => a.refType === refType && a.refId === refId);
const scoreKey = (o, c, r) => `${o}|${c}|${r}`;
const nameOf = (arr, id) => (arr.find(x => x.id === id) || {}).name || '（已刪除）';

/* ---------- 評分彙總 ---------- */
function aggregate(tid = cur.topicId){
  const m = {};
  const ok = { o: new Set(OPTS(tid).map(x => x.id)), c: new Set(CRITS(tid).map(x => x.id)), r: new Set(REVS(tid).map(x => x.id)) };
  for (const s of S.scores) {
    if (s.topicId !== tid || s.value == null || !ok.o.has(s.optionId) || !ok.c.has(s.criteriaId) || !ok.r.has(s.reviewerId)) continue;
    m[s.optionId] ??= {};
    const c = m[s.optionId][s.criteriaId] ??= { vals: [], mins: [], maxs: [], by: [] };
    c.vals.push(s.value); c.mins.push(s.min ?? s.value); c.maxs.push(s.max ?? s.value); c.by.push({ r: s.reviewerId, v: s.value });
  }
  for (const o in m) for (const k in m[o]) {
    const c = m[o][k];
    c.mean = mean(c.vals); c.std = std(c.vals); c.n = c.vals.length;
    c.min = Math.min(mean(c.mins), c.mean); c.max = Math.max(mean(c.maxs), c.mean);
    c.cv = Math.abs(c.mean) > 1e-9 ? c.std / Math.abs(c.mean) : c.std;
    c.diverge = c.n >= 2 && c.cv >= DIV_CV;
    c.hasRange = c.max > c.min;
  }
  return m;
}
const meanMatrix = agg => { const m = {}; for (const o in agg) { m[o] = {}; for (const c in agg[o]) m[o][c] = agg[o][c].mean; } return m; };
const baseWeights = (tid = cur.topicId) => { const w = {}; CRITS(tid).forEach(c => w[c.id] = Number(c.weight) || 0); return w; };
const sumW = w => Object.values(w).reduce((s, v) => s + (Number(v) || 0), 0);

function ctx(weights, tid = cur.topicId){
  const t = S.topics.find(x => x.id === tid) || {};
  return { options: OPTS(tid), criteria: CRITS(tid), matrix: meanMatrix(aggregate(tid)), weights: weights || baseWeights(tid), method: t.method || 'wsm', applyThreshold: t.applyThreshold !== false };
}

/* ---------- 計分引擎：WSM / TOPSIS / 門檻淘汰 ---------- */
function compute({ options, criteria, matrix, weights, method = 'wsm', applyThreshold = true }){
  const tw = criteria.reduce((s, c) => s + Math.max(0, Number(weights[c.id]) || 0), 0);
  const W = {}; criteria.forEach(c => W[c.id] = tw > 0 ? Math.max(0, Number(weights[c.id]) || 0) / tw : 1 / (criteria.length || 1));
  const rows = options.map(o => {
    const reasons = [], missing = [];
    criteria.forEach(c => {
      const v = matrix[o.id]?.[c.id];
      if (v == null) { missing.push(c.name); return; }
      if (applyThreshold && c.threshold != null && c.threshold !== '') {
        const t = Number(c.threshold);
        if (c.direction === 'cost' ? v > t : v < t) reasons.push(`${c.name} ${fmt(v, 2)} ${c.direction === 'cost' ? '>' : '<'} 門檻 ${fmt(t, 2)}`);
      }
    });
    return { id: o.id, name: o.name, eliminated: reasons.length > 0, reasons, missing, contrib: {}, norm: {}, score: 0, wsm: 0, rank: null };
  });
  const act = rows.filter(r => !r.eliminated);
  criteria.forEach(c => {
    const vals = act.map(r => matrix[r.id]?.[c.id]).filter(v => v != null);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    act.forEach(r => {
      const v = matrix[r.id]?.[c.id]; let n;
      if (v == null) n = 0; else if (mx === mn) n = 1; else n = c.direction === 'cost' ? (mx - v) / (mx - mn) : (v - mn) / (mx - mn);
      r.norm[c.id] = n; r.contrib[c.id] = W[c.id] * n; r.wsm += W[c.id] * n;
    });
  });
  if (method === 'topsis' && act.length) {
    const dp = {}, dm = {}; act.forEach(r => { dp[r.id] = 0; dm[r.id] = 0; });
    criteria.forEach(c => {
      const xs = act.map(r => matrix[r.id]?.[c.id] ?? 0);
      const den = Math.sqrt(xs.reduce((s, v) => s + v * v, 0)) || 1;
      const vs = xs.map(x => W[c.id] * x / den);
      const best = c.direction === 'cost' ? Math.min(...vs) : Math.max(...vs);
      const worst = c.direction === 'cost' ? Math.max(...vs) : Math.min(...vs);
      act.forEach((r, i) => { dp[r.id] += (vs[i] - best) ** 2; dm[r.id] += (vs[i] - worst) ** 2; });
    });
    act.forEach(r => { const a = Math.sqrt(dp[r.id]), b = Math.sqrt(dm[r.id]); r.score = (a + b) > 0 ? b / (a + b) : 1; r.dPlus = a; r.dMinus = b; });
  } else act.forEach(r => r.score = r.wsm);
  act.sort((a, b) => b.score - a.score);
  act.forEach((r, i) => r.rank = (i > 0 && Math.abs(r.score - act[i - 1].score) < 1e-12) ? act[i - 1].rank : i + 1);
  return { rows: [...act, ...rows.filter(r => r.eliminated)], W, method };
}
const leaderOf = res => (res.rows[0] && !res.rows[0].eliminated) ? res.rows[0] : null;

/* ---------- 敏感度分析 ---------- */
function sensitivity(base, critId, step = 1){
  const others = base.criteria.filter(c => c.id !== critId);
  const sO = others.reduce((s, c) => s + (Number(base.weights[c.id]) || 0), 0);
  const xs = [], series = {}, leaders = [];
  base.options.forEach(o => series[o.id] = []);
  for (let x = 0; x <= 100 + 1e-9; x += step) {
    const w = { [critId]: x };
    others.forEach(c => w[c.id] = sO > 0 ? (Number(base.weights[c.id]) || 0) * (100 - x) / sO : (100 - x) / (others.length || 1));
    const r = compute({ ...base, weights: w });
    xs.push(x);
    r.rows.forEach(row => series[row.id].push(row.eliminated ? null : row.score * 100));
    const l = leaderOf(r); leaders.push(l ? l.id : null);
  }
  const wAt = x => { const w = { [critId]: x }; others.forEach(c => w[c.id] = sO > 0 ? (Number(base.weights[c.id]) || 0) * (100 - x) / sO : (100 - x) / (others.length || 1)); return w; };
  const leadAt = x => { const l = leaderOf(compute({ ...base, weights: wAt(x) })); return l ? l.id : null; };
  const flips = [];
  for (let i = 1; i < leaders.length; i++) if (leaders[i] !== leaders[i - 1]) {
    let lo = xs[i - 1], hi = xs[i];
    for (let k = 0; k < 14; k++) { const m = (lo + hi) / 2; if (leadAt(m) === leaders[i - 1]) lo = m; else hi = m; }
    flips.push({ at: Math.round(hi * 10) / 10, from: leaders[i - 1], to: leaders[i] });
  }
  const tot = sumW(base.weights); const curPct = tot > 0 ? (Number(base.weights[critId]) || 0) / tot * 100 : 0;
  return { xs, series, flips, curPct };
}

/* ---------- 蒙地卡羅模擬 ---------- */
function tri(a, c, b){
  if (b <= a) return c;
  const u = Math.random(), f = (c - a) / (b - a);
  return u < f ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c));
}
function monteCarlo(iter, wPert, weights){
  const base = ctx(weights); const agg = aggregate();
  const st = {}; base.options.forEach(o => st[o.id] = { win: 0, rankSum: 0, scores: [], elim: 0, ranks: {} });
  for (let k = 0; k < iter; k++) {
    const m = {};
    base.options.forEach(o => { m[o.id] = {}; base.criteria.forEach(c => { const a = agg[o.id]?.[c.id]; if (a) m[o.id][c.id] = tri(a.min, a.mean, a.max); }); });
    const w = {};
    base.criteria.forEach(c => { const b = Number(base.weights[c.id]) || 0; w[c.id] = Math.max(0, b * (1 + (Math.random() * 2 - 1) * wPert / 100)); });
    const r = compute({ ...base, matrix: m, weights: w });
    r.rows.forEach(x => {
      const s = st[x.id];
      if (x.eliminated) { s.elim++; return; }
      s.rankSum += x.rank; s.scores.push(x.score * 100); s.ranks[x.rank] = (s.ranks[x.rank] || 0) + 1;
      if (x.rank === 1) s.win++;
    });
  }
  const rows = base.options.map(o => {
    const s = st[o.id]; const sc = s.scores.slice().sort((a, b) => a - b);
    return { id: o.id, name: o.name, winP: s.win / iter, elimP: s.elim / iter, avgRank: sc.length ? s.rankSum / sc.length : null,
      mean: mean(sc), p5: quant(sc, .05), p50: quant(sc, .5), p95: quant(sc, .95), ranks: s.ranks };
  }).sort((a, b) => b.winP - a.winP || (a.avgRank ?? 99) - (b.avgRank ?? 99));
  return { iter, wPert, rows, at: Date.now(), method: base.method };
}

function radar(axes, series, size = 400){
  const n = axes.length;
  if (n < 3) return '<div class="empty">雷達圖需要至少 3 個評估因子</div>';
  if (!series.length) return '<div class="empty">尚無有效方案</div>';
  const cx = size / 2, cy = size / 2, R = size / 2 - 70;
  const xy = (i, r) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let s = `<svg class="chart" viewBox="0 0 ${size} ${size}" ${TXT} font-size="12" style="max-width:${size + 40}px;margin:auto">`;
  for (let l = 1; l <= 5; l++) s += `<polygon points="${axes.map((_, i) => xy(i, R * l / 5).join(',')).join(' ')}" fill="${l % 2 ? '#f8fafc' : '#fff'}" stroke="#e2e8f0"/>`;
  axes.forEach((a, i) => {
    const [x, y] = xy(i, R), [lx, ly] = xy(i, R + 16);
    const anc = Math.abs(lx - cx) < 5 ? 'middle' : lx > cx ? 'start' : 'end';
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#cbd5e1"/><text x="${lx}" y="${ly + 4}" text-anchor="${anc}" fill="#334155">${esc(a)}</text>`;
  });
  series.forEach(se => {
    const pts = se.values.map((v, i) => xy(i, R * Math.max(0, Math.min(1, v || 0))));
    s += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${se.color}" fill-opacity=".13" stroke="${se.color}" stroke-width="2"/>`;
    pts.forEach((p, i) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${se.color}"><title>${esc(se.name)} / ${esc(axes[i])}：${fix((se.values[i] || 0) * 100, 0)}</title></circle>`);
  });
  return s + '</svg>' + legend(series);
}

function lineChart(xs, series, { markX = null, flips = [], w = 900, h = 380, xLabel = '', yLabel = '' } = {}){
  const L = 46, Rr = 16, Tt = 14, B = 40, cw = w - L - Rr, ch = h - Tt - B;
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length) return '<div class="empty">尚無資料</div>';
  let mn = Math.min(...all), mx = Math.max(...all); const pad = (mx - mn) * .08 || 5; mn = Math.max(0, mn - pad); mx = Math.min(100, mx + pad); if (mx - mn < 1) { mx = mn + 1; }
  const X = v => L + cw * (v - xs[0]) / ((xs[xs.length - 1] - xs[0]) || 1), Y = v => Tt + ch * (1 - (v - mn) / (mx - mn));
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" ${TXT} font-size="11">`;
  for (let i = 0; i <= 5; i++) { const v = mn + (mx - mn) * i / 5, y = Y(v); s += `<line x1="${L}" x2="${w - Rr}" y1="${y}" y2="${y}" stroke="#eef2f7"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" fill="#64748b">${v.toFixed(0)}</text>`; }
  for (let i = 0; i <= 10; i++) { const v = xs[0] + (xs[xs.length - 1] - xs[0]) * i / 10, x = X(v); s += `<text x="${x}" y="${h - B + 16}" text-anchor="middle" fill="#64748b">${v.toFixed(0)}</text>`; }
  flips.forEach(f => s += `<line x1="${X(f.at)}" x2="${X(f.at)}" y1="${Tt}" y2="${Tt + ch}" stroke="#ef4444" stroke-dasharray="3 3"/><text x="${X(f.at) + 3}" y="${Tt + 10}" fill="#ef4444">翻盤 ${f.at}%</text>`);
  if (markX != null) s += `<line x1="${X(markX)}" x2="${X(markX)}" y1="${Tt}" y2="${Tt + ch}" stroke="#0f172a" stroke-width="1.5"/><text x="${X(markX) + 3}" y="${Tt + ch - 4}" fill="#0f172a" font-weight="700">目前 ${markX.toFixed(1)}%</text>`;
  series.forEach(se => {
    let d = '', pen = false;
    se.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(xs[i]).toFixed(1) + ',' + Y(v).toFixed(1); pen = true; });
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2"/>`;
  });
  s += `<text x="${L + cw / 2}" y="${h - 6}" text-anchor="middle" fill="#334155">${esc(xLabel)}</text><text x="12" y="${Tt + ch / 2}" transform="rotate(-90 12 ${Tt + ch / 2})" text-anchor="middle" fill="#334155">${esc(yLabel)}</text>`;
  return s + '</svg>' + legend(series);
}

function groupBar(groups, series, { w = 960, h = 340, max = 100 } = {}){
  if (!groups.length || !series.length) return '<div class="empty">尚無資料</div>';

  groups.forEach((g, gi) => {

    series.forEach((se, si) => { const v = se.values[gi]; if (v == null) return; const bh = ch * Math.max(0, v) / max; s += `<rect x="${x0 + si * bw}" y="${Tt + ch - bh}" width="${bw - 3}" height="${bh}" rx="2" fill="${se.color}"><title>${esc(g)} / ${esc(se.name)}：${fix(v, 1)}</title></rect>`; });

}

  (data.scores || []).forEach(x => { x.topicId = nid(x.topicId); x.optionId = nid(x.optionId); x.criteriaId = nid(x.criteriaId); x.reviewerId = nid(x.reviewerId); x.id = scoreKey(x.optionId, x.criteriaId, x.reviewerId); });
  (data.scenarios || []).forEach(x => { x.id = nid(x.id); x.topicId = nid(x.topicId); const w = {}; for (const k in x.weights || {}) w[nid(k)] = x.weights[k]; x.weights = w; });
  (data.decisions || []).forEach(x => {
    x.id = nid(x.id); x.topicId = nid(x.topicId); x.optionId = nid(x.optionId);
    if (x.snapshot) {
      (x.snapshot.criteria || []).forEach(c => { c.id = nid(c.id); });
      (x.snapshot.options || []).forEach(o => { o.id = nid(o.id); });
      (x.snapshot.matrix || []).forEach(o => { o.id = nid(o.id); });
      (x.snapshot.ranking || []).forEach(o => { o.id = nid(o.id); });
    }
  });
  (data.attachments || []).forEach(x => { x.id = nid(x.id); x.topicId = nid(x.topicId); x.refId = nid(x.refId); });
  return data;
}
async function dupTopic(id){
  closeModal();
  const d = topicData(id);
  const blobs = {}; S.attachments.filter(a => a.topicId === id).forEach(a => blobs[a.id] = a.blob);
  d.attachments.forEach(a => a._old = a.id);
  remap(d);
  d.attachments.forEach(a => { a.blob = blobs[a._old]; delete a._old; });
  for (const s of STORES) await bulk(s, d[s] || []);
  selectTopic(d.topics[0].id); toast('已複製議題');
}

   總覽儀表板
   ========================================================= */
function vOverview(){
  const t = T(), O = OPTS(), C = CRITS(), R = REVS(), agg = aggregate(), w = baseWeights(), sw = sumW(w);
  const res = compute(ctx()); const lead = leaderOf(res);
  const total = O.length * C.length * R.length;
  const filled = S.scores.filter(s => s.topicId === t.id && s.value != null && O.some(o => o.id === s.optionId) && C.some(c => c.id === s.criteriaId) && R.some(r => r.id === s.reviewerId)).length;
  const alerts = [];
  if (!O.length) alerts.push(['bad', '尚未建立任何方案。', 'options']);
  if (!C.length) alerts.push(['bad', '尚未建立任何評估因子。', 'criteria']);
  if (!R.length) alerts.push(['warn', '尚未建立評審，請在「評分矩陣」新增評審。', 'scores']);
  if (C.length && Math.abs(sw - 100) > 0.01) alerts.push(['warn', `權重合計為 ${fmt(sw, 2)}%（非 100%）。計算時會自動等比例換算，建議正規化。`, 'criteria']);
  if (total && filled < total) alerts.push(['warn', `評分完成率 ${pct(filled / total, 0)}，仍有 ${total - filled} 格未評分。`, 'scores']);
  const div = []; O.forEach(o => C.forEach(c => { const a = agg[o.id]?.[c.id]; if (a?.diverge) div.push(`${o.name} × ${c.name}（CV ${pct(a.cv, 0)}）`); }));
  if (div.length) alerts.push(['warn', `評審意見分歧 ${div.length} 處：${div.slice(0, 4).join('、')}${div.length > 4 ? '…' : ''}`, 'scores']);
  res.rows.filter(r => r.eliminated).forEach(r => alerts.push(['bad', `方案「${r.name}」因門檻被淘汰：${r.reasons.join('；')}`, 'ranking']));
  if (lead && C.length > 1) {
    const base = ctx(); let near = null;
    C.forEach(c => { const sv = sensitivity(base, c.id, 1); sv.flips.forEach(f => { const d = Math.abs(f.at - sv.curPct); if (!near || d < near.d) near = { d, c, f, cur: sv.curPct }; }); });
    if (near && near.d <= 10) alerts.push(['warn', `排名敏感：「${near.c.name}」權重由 ${fix(near.cur)}% 調整到 ${near.f.at}% 時，第一名會由「${nameOf(O, near.f.from)}」變為「${nameOf(O, near.f.to)}」。`, 'sandbox']);
    else if (near) alerts.push(['ok', `排名穩定：最接近的翻盤點距目前權重 ${fix(near.d)} 個百分點以上。`, 'sandbox']);
    else alerts.push(['ok', '排名穩定：單一因子權重在 0–100% 間變動都不會改變第一名。', 'sandbox']);
  }
  const dec = DECS()[0];
  const act = res.rows.filter(r => !r.eliminated);
  return `<h2 class="pt">${esc(t.name)} <span class="badge ${STATUS_CLS[t.status] || 'b-gray'}">${esc(t.status)}</span></h2>
  <p class="sub">${esc(t.desc || '（無說明）')}</p>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><div class="l">方案數</div><div class="v">${O.length}</div><div class="d">淘汰 ${res.rows.filter(r => r.eliminated).length} 個</div></div>
    <div class="stat"><div class="l">評估因子</div><div class="v">${C.length}</div><div class="d">權重合計 ${fmt(sw, 2)}%</div></div>
    <div class="stat"><div class="l">評審人數</div><div class="v">${R.length}</div><div class="d">分歧 ${div.length} 處</div></div>
    <div class="stat"><div class="l">評分完成率</div><div class="v">${total ? pct(filled / total, 0) : '—'}</div><div class="d">${filled} / ${total} 格</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card ${lead ? 'winner' : ''}"><h3>🏆 目前建議方案 <span class="r"><span class="badge b-pur">${t.method === 'topsis' ? 'TOPSIS' : '加權總分法'}</span></span></h3>
      ${lead ? `<div style="font-size:26px;font-weight:800;color:#1d4ed8">${esc(lead.name)}</div>
        <div class="muted">分數 ${fix(lead.score * 100, 1)}${act[1] ? `，領先第二名「${esc(act[1].name)}」${fix((lead.score - act[1].score) * 100, 1)} 分` : ''}</div>
        <div class="kv" style="margin-top:12px"><b>決策負責人</b><span>${esc(t.owner || '—')}</span><b>截止日</b><span>${esc(t.dueDate || '—')}${t.dueDate ? ` <span class="badge ${t.dueDate < today() ? 'b-bad' : 'b-gray'}">${t.dueDate < today() ? '已逾期' : '剩 ' + Math.ceil((new Date(t.dueDate) - new Date(today())) / 864e5) + ' 天'}</span>` : ''}</span>
        <b>最新決議</b><span>${dec ? `${esc(nameOf(O, dec.optionId) || dec.snapshot?.optionName)}（${esc(dec.date)}）` : '尚未決議'}</span></div>` : '<div class="empty">尚無可排名的方案</div>'}
    </div>
    <div class="card"><h3>🔔 提醒事項</h3>${alerts.length ? alerts.map(a => `<div class="alert a-${a[0]}" style="cursor:pointer" onclick="go('${a[2]}')">${a[0] === 'ok' ? '✅' : a[0] === 'bad' ? '⛔' : '⚠️'} <span>${esc(a[1])}</span></div>`).join('') : '<div class="alert a-ok">✅ 一切就緒</div>'}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>總分排名</h3>${barH(act.map(r => ({ label: r.name, value: r.score * 100, color: color(O.findIndex(o => o.id === r.id)) })), { max: 100 })}</div>
    <div class="card"><h3>各因子表現（正規化）</h3>${radar(C.map(c => c.name), act.map(r => ({ name: r.name, color: color(O.findIndex(o => o.id === r.id)), values: C.map(c => r.norm[c.id]) })), 380)}</div>
  </div>`;
}

async function setScore(o, c, r, field, v){

  const oc = id => color(O.findIndex(o => o.id === id));

    <label>演算法：<select onchange="saveTopicSetting('method',this.value)"><option value="wsm" ${t.method !== 'topsis' ? 'selected' : ''}>加權總分法（WSM）</option><option value="topsis" ${t.method === 'topsis' ? 'selected' : ''}>TOPSIS 理想解相似度</option></select></label>

  </div></div>
  <div class="card"><h3>排名結果</h3>${O.length && C.length ? `<div class="tbw"><table class="tb"><tr><th class="c">名次</th><th>方案</th><th class="n">${t.method === 'topsis' ? 'TOPSIS 相似度' : '加權總分'}</th><th class="n">與第一名差距</th>${t.method === 'topsis' ? '<th class="n">D⁺（距理想解）</th><th class="n">D⁻（距負理想解）</th><th class="n">WSM 參考分</th>' : ''}<th>狀態</th></tr>
  ${res.rows.map(r => `<tr style="${r.eliminated ? 'opacity:.6' : ''}"><td class="c">${r.eliminated ? '—' : `<span class="rk rk${r.rank}">${r.rank}</span>`}</td><td class="bold"><span style="color:${oc(r.id)}">●</span> ${esc(r.name)}</td>
    <td class="n bold">${r.eliminated ? '—' : fix(r.score * 100, 2)}</td><td class="n">${r.eliminated || !top ? '—' : r === top ? '—' : '-' + fix((top.score - r.score) * 100, 2)}</td>
    ${t.method === 'topsis' ? `<td class="n">${r.eliminated ? '—' : fix(r.dPlus, 4)}</td><td class="n">${r.eliminated ? '—' : fix(r.dMinus, 4)}</td><td class="n">${r.eliminated ? '—' : fix(r.wsm * 100, 2)}</td>` : ''}
    <td>${r.eliminated ? `<span class="badge b-bad">淘汰</span> <span class="small">${esc(r.reasons.join('；'))}</span>` : r.missing.length ? `<span class="badge b-warn">缺漏</span> <span class="small">${esc(r.missing.join('、'))} 未評分（以 0 計）</span>` : '<span class="badge b-ok">有效</span>'}</td></tr>`).join('')}
  </table></div>` : '<div class="empty">請先建立方案與因子並完成評分。</div>'}</div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>總分排名</h3>${barH(act.map(r => ({ label: r.name, value: r.score * 100, color: oc(r.id) })), { max: 100 })}</div>
    <div class="card"><h3>雷達圖比較</h3>${radar(C.map(c => c.name), act.map(r => ({ name: r.name, color: oc(r.id), values: C.map(c => r.norm[c.id]) })), 380)}</div>
  </div>
  <div class="card"><h3>因子貢獻分析（加權總分拆解）</h3><p class="small muted" style="margin-top:-6px">每段長度 = 因子權重 × 正規化分數，可看出各方案的分數來自哪些因子。</p>
    ${stackH(act.map(r => ({ label: r.name, values: r.contrib, total: r.wsm })), C.map((c, i) => ({ id: c.id, name: c.name, color: color(i) })))}</div>
  <div class="card"><h3>計算明細（原始平均值 → 正規化 → 加權）</h3><div class="tbw"><table class="tb"><tr><th>方案</th>${C.map(c => `<th class="c">${esc(c.name)}<div class="small muted" style="font-weight:400">權重 ${pct(res.W[c.id])} · ${c.direction === 'cost' ? '▼' : '▲'}</div></th>`).join('')}<th class="n">WSM 合計</th></tr>
    ${act.map(r => `<tr><td class="bold">${esc(r.name)}</td>${C.map(c => `<td class="c small">${fmt(agg[r.id]?.[c.id]?.mean, 2)} → <b>${fix(r.norm[c.id], 3)}</b> → ${fix(r.contrib[c.id] * 100, 2)}</td>`).join('')}<td class="n bold">${fix(r.wsm * 100, 2)}</td></tr>`).join('')}
  </table></div></div>
  <div class="card"><h3>📐 演算法說明</h3><div class="small">
    <p><b>正規化（Min-Max）</b>：效益型 r = (x − min) / (max − min)；成本型 r = (max − x) / (max − min)。所有方案數值相同時 r = 1。只計入未被淘汰的方案。</p>
    <p><b>加權總分法（WSM）</b>：總分 = Σ（權重 × r）× 100。權重會自動換算成合計 100%。</p>
    <p><b>TOPSIS</b>：向量正規化後乘上權重，計算各方案與「理想解」距離 D⁺、與「負理想解」距離 D⁻，相似度 = D⁻ / (D⁺ + D⁻)。越接近 100 越好。</p>
    <p><b>淘汰門檻</b>：成本型平均值大於門檻、效益型平均值小於門檻時直接淘汰，不參與排名與正規化。</p></div></div>`;
}

    const name = `${cat}優先`; if (SC.some(s => s.name === name)) continue;
    const inC = C.filter(c => c.category === cat), outC = C.filter(c => c.category !== cat);
    const sIn = inC.reduce((s, c) => s + (base[c.id] || 0), 0), sOut = outC.reduce((s, c) => s + (base[c.id] || 0), 0);
    const w = {};
    inC.forEach(c => w[c.id] = Math.round((sIn ? (base[c.id] || 0) / sIn : 1 / inC.length) * 50 * 100) / 100);
    outC.forEach(c => w[c.id] = Math.round((sOut ? (base[c.id] || 0) / sOut : 1 / outC.length) * (outC.length ? 50 : 0) * 100) / 100);
    if (!outC.length) inC.forEach(c => w[c.id] = Math.round((base[c.id] || 0) / tot * 10000) / 100);
    await put('scenarios', { id: uid(), topicId: cur.topicId, name, desc: `「${cat}」類因子合計 50%，其餘因子依原比例分配 50%`, weights: w, createdAt: Date.now(), order: SCENS().length }); n++;
  }
  render(); toast(n ? `已產生 ${n} 個情境` : '情境已存在，未新增', n ? '' : 'warn');
}

function makeSnapshot(){
  const O = OPTS(), C = CRITS(), R = REVS(), agg = aggregate(), res = compute(ctx()), w = baseWeights(), t = sumW(w) || 1, mc = UI.mc[cur.topicId];
  return { method: T().method || 'wsm', applyThreshold: T().applyThreshold !== false,
    criteria: C.map(c => ({ id: c.id, name: c.name, category: c.category, direction: c.direction, weight: c.weight, pct: (Number(c.weight) || 0) / t, threshold: c.threshold })),
    options: O.map(o => ({ id: o.id, name: o.name })), reviewers: R.map(r => r.name),
    matrix: O.map(o => ({ id: o.id, name: o.name, vals: C.map(c => agg[o.id]?.[c.id]?.mean ?? null) })),
    ranking: res.rows.map(r => ({ id: r.id, name: r.name, score: r.score, rank: r.rank, eliminated: r.eliminated, reasons: r.reasons })),
    mc: mc ? { iter: mc.iter, wPert: mc.wPert, rows: mc.rows.map(x => ({ name: x.name, winP: x.winP })) } : null };
}

const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function exportJSON(all){
  if (!all && !T()) return toast('請先選擇議題', 'err');
  const data = {}; const tid = cur.topicId;
  STORES.forEach(s => data[s] = all ? S[s] : s === 'topics' ? S.topics.filter(t => t.id === tid) : S[s].filter(x => x.topicId === tid));
  const out = JSON.parse(JSON.stringify(data, (k, v) => v instanceof Blob ? undefined : v));
  for (const a of out.attachments) { const src = S.attachments.find(x => x.id === a.id); if (src?.blob) a.dataURL = await blobToDataURL(src.blob); }
  download(`${all ? '決策沙盤_全部備份' : '決策沙盤_' + safeName(T().name)}_${today()}.json`, JSON.stringify({ app: 'DecisionLab', version: 3, exportedAt: new Date().toISOString(), scope: all ? 'all' : 'topic', data: out }, null, 2), 'application/json');
  toast('已匯出 JSON');
}

async function handleImport(input){
  const f = input.files[0]; if (!f) return;
  let j; try { j = JSON.parse(await f.text()); } catch { return toast('檔案不是有效的 JSON', 'err'); }
  const d = j.data || j; if (!Array.isArray(d.topics)) return toast('檔案格式不符（缺少 topics）', 'err');
  STORES.forEach(s => d[s] = Array.isArray(d[s]) ? d[s] : []);
  for (const a of d.attachments) { if (a.dataURL) { a.blob = await (await fetch(a.dataURL)).blob(); delete a.dataURL; } }
  if (importMode === 'replace') {
    if (!await confirmBox(`將清空目前所有資料，並匯入 ${d.topics.length} 個議題。確定還原？`)) return;
    for (const s of STORES) await clearStore(s);
  } else {
    const dup = d.topics.filter(t => S.topics.some(x => x.id === t.id));
    if (dup.length) {
      const c = await choice('議題已存在', `下列議題已存在：\n${dup.map(t => '・' + t.name).join('\n')}\n\n要如何處理？`, [{ text: '取消', value: null }, { text: '以複本匯入', cls: 'pri', value: 'copy' }, { text: '覆蓋', cls: 'danger', value: 'over' }]);
      if (!c) return;
      if (c === 'copy') remap(d, '（匯入）');
      else for (const t of dup) for (const s of STORES.slice(1)) await bulk(s, S[s].filter(x => x.topicId === t.id).map(x => x.id), 'delete');
    }
  }
  for (const s of STORES) await bulk(s, d[s]);
  UI.mc = {}; UI.sensW = null; selectTopic(d.topics[0]?.id || S.topics[0]?.id); toast(`已匯入 ${d.topics.length} 個議題`);
}

function vHelp(){

  <h3>評分方式</h3><ul><li>可填 1–10 分，也可直接填實際數值（成本萬元、時程月數）；系統會依因子做 Min-Max 正規化。</li><li>勾選「顯示區間」可填最小值與最大值，供蒙地卡羅模擬使用。</li><li>多位評審的分數取平均；變異係數 ≥ 25% 時標示「分歧」。</li><li>可用「從其他評審複製分數」快速建立初稿。</li></ul>
  <h3>演算法</h3><ul><li><b>加權總分法（WSM）</b>：正規化分數 × 權重後加總，最直觀。</li><li><b>TOPSIS</b>：依方案與理想解、負理想解的距離排名，適合因子多、彼此取捨明顯時。</li><li><b>淘汰門檻</b>：先淘汰不合格方案，再排名其餘方案。</li></ul>
  <h3>沙盤推演</h3><ul><li><b>情境比較</b>：建立多組權重（例如成本優先、品質優先），並排比較排名。「依分類快速產生」會讓每個分類各自占 50%。</li><li><b>權重敏感度</b>：拖動滑桿即時看排名變化；翻盤點表會列出每個因子權重調到多少時第一名會易主。</li><li><b>蒙地卡羅</b>：依評分區間（三角分布）與權重擾動隨機模擬，統計各方案勝出機率與分數分布。</li></ul>
  <h3>資料與備份</h3><ul><li>資料只存在本機瀏覽器（IndexedDB），不會上傳。</li><li>可匯出單一議題或全部資料 JSON（含附件），以及 CSV、Excel、列印報告（可另存 PDF）。</li><li>刪除方案或因子時，只會刪除相關評分，不影響議題其他資料。</li></ul>
  <h3>小技巧</h3><ul><li>總覽儀表板的提醒事項可點擊，直接跳到對應頁面。</li><li>若決議方案不是第一名，請在決議理由中說明，報告會完整呈現。</li><li>按 <code>Esc</code> 可關閉對話框。</li></ul></div>`;
}

async function loadDemo(){
  const tid = uid(), now = Date.now();
  const topic = { id: tid, name: '核心系統報表平台選型', desc: '現行報表系統老舊、維護成本高，需在年底前決定新報表平台的建置方式。', owner: '資訊處 林副理', dueDate: addDays(45), status: '評估中', method: 'wsm', applyThreshold: true, createdAt: now };
  const opts = [['A 自建', '內部團隊以開源報表框架自行開發，彈性最高', 420, 12], ['B 套裝軟體', '採購商用 BI 套裝軟體並客製', 450, 6], ['C 雲端 SaaS', '訂閱雲端報表服務，快速上線', 200, 3]]
    .map((x, i) => ({ id: uid(), topicId: tid, name: x[0], desc: x[1], cost: x[2], duration: x[3], link: '', order: i, createdAt: now + i }));
  const crits = [['建置成本', '成本', 30, 'cost', 500, '萬元', '5 年總持有成本估算'], ['功能符合度', '效益', 25, 'benefit', 5, '分(1-10)', '對照需求清單的符合程度'], ['資安風險', '風險', 20, 'cost', 8, '分(1-10)', '分數越高代表風險越大'], ['導入時程', '時程', 15, 'cost', null, '月', '從簽約到正式上線'], ['維運人力', '人力', 10, 'cost', null, '人', '上線後每年所需維運人力']]
    .map((x, i) => ({ id: uid(), topicId: tid, name: x[0], category: x[1], weight: x[2], direction: x[3], threshold: x[4], unit: x[5], note: x[6], order: i, createdAt: now + i }));
  const revs = [['王經理', 'PM'], ['李架構師', 'SA'], ['陳資安', '資安']].map((x, i) => ({ id: uid(), topicId: tid, name: x[0], role: x[1], order: i, createdAt: now + i }));
  const base = [[420, 9, 3, 12, 4], [450, 7, 4, 6, 2], [200, 6, 6, 3, 1]];
  const delta = [[[0, 0, 0, 0, 0], [20, -1, 1, 2, 0], [-10, 0, 0, 1, 1]], [[0, 0, 0, 0, 0], [-20, 1, 0, -1, 0], [30, 0, 1, 0, 0]], [[0, 0, 0, 0, 0], [10, 1, -2, 1, 0], [-10, -1, 2, 0, 0]]];
  const rngPct = [.15, .15, .25, .3, .25];
  const scores = [];
  opts.forEach((o, oi) => crits.forEach((c, ci) => revs.forEach((r, ri) => {
    const v = base[oi][ci] + delta[oi][ri][ci]; const sp = Math.max(1, Math.round(Math.abs(v) * rngPct[ci]));
    scores.push({ id: scoreKey(o.id, c.id, r.id), topicId: tid, optionId: o.id, criteriaId: c.id, reviewerId: r.id, value: v, min: Math.max(0, v - sp), max: v + sp + (oi === 0 && ci === 3 ? 4 : 0) });
  })));
  const W = a => Object.fromEntries(crits.map((c, i) => [c.id, a[i]]));
  const scen = [['成本優先', '預算吃緊時的考量', [50, 15, 15, 10, 10]], ['品質優先', '重視功能與資安', [15, 45, 25, 10, 5]], ['時程優先', '需在半年內上線', [20, 20, 15, 35, 10]]]
    .map((x, i) => ({ id: uid(), topicId: tid, name: x[0], desc: x[1], weights: W(x[2]), order: i, createdAt: now + i }));
  await put('topics', topic);
  await bulk('options', opts); await bulk('criteria', crits); await bulk('reviewers', revs); await bulk('scores', scores); await bulk('scenarios', scen);
  cur.view = 'overview'; selectTopic(tid); toast('已載入範例議題');
}

  try { db = await openDB(); await loadAll(); }
  catch (e) { $('#main').innerHTML = `<div class="card alert a-bad">無法開啟 IndexedDB：${esc(e?.message || e)}。請確認瀏覽器未封鎖本機儲存（例如無痕模式）。</div>`; return; }
  const saved = localStorage.getItem('dl_topic');
  cur.topicId = S.topics.some(t => t.id === saved) ? saved : (S.topics.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0]?.id || null);
  cur.view = localStorage.getItem('dl_view') || 'overview';
  render();
})();
