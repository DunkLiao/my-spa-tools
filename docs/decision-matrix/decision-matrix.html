<html lang="zh-Hant">
<head>

  <title>衡 — 情境決策矩陣</title>
  <style>
    :root{color-scheme:light;--ink:#21313a;--muted:#72818a;--line:#e4e9eb;--paper:#fff;--canvas:#f4f6f7;--blue:#39718a;--blue-soft:#eaf3f6;--sand:#f6f0e8;--gold:#b98745;--green:#35735f;--red:#bb655a;--shadow:0 10px 35px #2438420a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-size:14px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7bb3ca66;outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr)}
    aside{background:#fbfcfc;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:25px}.brand-name{font-weight:700;font-size:16px;letter-spacing:.05em}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.side-label{font-size:10px;letter-spacing:.13em;color:#87949a;font-weight:700;padding:0 10px;text-transform:uppercase}.decision-list{display:grid;gap:4px}.decision-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;color:#4c5b62}.decision-item:hover{background:#f1f4f5}.decision-item.active{background:var(--blue-soft);color:#28596d;font-weight:650}.decision-dot{width:7px;height:7px;border-radius:50%;background:#9aabb1;flex:none}.decision-item.active .decision-dot{background:var(--blue)}.decision-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.add-decision{background:transparent;border:1px dashed #cbd4d8;border-radius:9px;padding:10px;color:#65757d;text-align:left}.add-decision:hover{border-color:var(--blue);color:var(--blue)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px}.subtle-note{font-size:11px;line-height:1.65;color:#8a979d;padding:5px 8px}
    main{min-width:0;padding:36px clamp(22px,5vw,76px) 64px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--blue);font-weight:700;text-transform:uppercase}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn,.btn{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;color:#52626a}.icon-btn:hover,.btn:hover{border-color:#b6c5cb;background:#fbfcfc}.btn-primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:600}.btn-primary:hover{background:#2f637a;color:white}.btn-sm{padding:6px 9px;font-size:12px}.btn-quiet{border-color:transparent;background:transparent}.btn-danger{color:var(--red)}h1{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;margin:10px 0 7px;font-weight:650}.lede{color:var(--muted);margin:0;line-height:1.65}.heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}.title-input{border:0;background:transparent;padding:0;min-width:180px;width:min(56vw,650px);font-size:inherit;font-weight:inherit;letter-spacing:inherit}.title-input:focus{outline:none;border-bottom:1px solid #8aadb9}.title-input:focus-visible{outline:none;border-bottom:2px solid var(--blue)}.mode-switch{display:flex;align-items:center;gap:5px;padding:4px;background:#e9eef0;border-radius:10px;margin-top:8px}.mode-switch button{border:0;background:transparent;color:#718087;padding:8px 13px;border-radius:7px;font-size:12px}.mode-switch button.active{background:white;color:#2d596b;box-shadow:0 1px 4px #20343c16;font-weight:650}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.select-wrap{font-size:12px;color:var(--muted)}.select-wrap select{margin-left:6px;border:1px solid var(--line);background:white;border-radius:7px;padding:7px 27px 7px 9px}.matrix-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:790px}th,td{border-bottom:1px solid #edf0f1;padding:14px 13px;text-align:center;vertical-align:middle}thead th{background:#fafbfb;color:#728087;font-size:11px;font-weight:650;line-height:1.4}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:white;z-index:1}thead th:first-child{background:#fafbfb;z-index:2}.criterion-head{min-width:205px}.option-head{min-width:145px}.option-name{font-weight:650;color:#35464e;font-size:13px}.option-total{font-size:11px;color:var(--blue);margin-top:4px}.criterion-name{font-weight:600;color:#35464e}.criterion-detail{font-size:11px;color:#829097;margin-top:5px}.weight{color:#5e7078;font-variant-numeric:tabular-nums}.cell-select{border:1px solid transparent;background:#f7f9f9;border-radius:7px;padding:7px 8px;min-width:62px;text-align:center}.cell-select:hover{border-color:#d5e0e4}.cell-select.pugh-plus{color:var(--green);background:#eef7f2}.cell-select.pugh-zero{color:#738087}.cell-select.pugh-minus{color:var(--red);background:#fcf1ef}.baseline-tag{display:inline-block;color:#78868c;background:#f0f3f4;border-radius:5px;padding:5px 8px;font-size:11px}.row-actions{display:flex;gap:3px;justify-content:flex-end}.mini-btn{border:0;background:transparent;color:#829097;border-radius:5px;padding:5px 6px;font-size:11px}.mini-btn:hover{background:#f1f4f5;color:var(--ink)}.table-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#77858b;font-size:11px}.add-criterion{border:0;background:transparent;color:var(--blue);font-weight:600;padding:7px}.results{margin-top:27px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section-head h2{font-size:15px;margin:0;font-weight:650}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.result-card{background:white;border:1px solid var(--line);border-radius:11px;padding:15px 16px;position:relative;overflow:hidden}.result-card.winner{border-color:#b8d1da;background:linear-gradient(145deg,#fff,#f6fafb)}.rank{font-size:10px;color:#829097;letter-spacing:.08em;text-transform:uppercase}.result-name{font-size:14px;font-weight:650;margin:7px 0 12px}.result-score{font-size:25px;color:var(--blue);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.result-unit{font-size:11px;color:#829097;margin-left:4px;font-weight:400}.result-bar{height:4px;background:#edf1f2;border-radius:5px;margin-top:13px;overflow:hidden}.result-bar span{display:block;height:100%;background:#8aafbd;border-radius:5px}.result-card.winner .result-bar span{background:var(--blue)}.empty-results{border:1px dashed #ccd6da;border-radius:10px;padding:26px;text-align:center;color:#7b898f;line-height:1.7;background:#fafcfc}.empty-app{max-width:580px;text-align:center;margin:12vh auto}.empty-app .brand-mark{margin:auto;width:52px;height:52px;font-size:34px}.empty-app p{color:var(--muted);line-height:1.7}.notice{position:fixed;right:22px;bottom:22px;max-width:min(440px,calc(100vw - 44px));padding:12px 16px;border-radius:9px;background:#263940;color:white;box-shadow:0 8px 25px #1d313633;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:10}.notice.show{opacity:1;transform:translateY(0)}.notice.error{background:#914b44}.dialog{border:1px solid var(--line);border-radius:13px;padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 65px #20343c30}.dialog::backdrop{background:#20343c66;backdrop-filter:blur(2px)}.dialog form{padding:23px}.dialog h2{font-size:18px;margin:0 0 18px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#596970;font-weight:600}.field input,.field select{width:100%;border:1px solid #dce3e5;border-radius:8px;padding:10px 11px;background:white}.field-hint{font-size:11px;color:#819096}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:21px}.toast-live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:860px){.shell{grid-template-columns:210px minmax(0,1fr)}aside{padding:22px 12px}main{padding:29px 22px 50px}.heading-row{display:block}.mode-switch{width:max-content}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-right{align-self:flex-end}}
    @media(max-width:600px){.shell{display:block}aside{position:static;border-right:0;border-bottom:1px solid var(--line);padding:13px 15px;display:grid;grid-template-columns:1fr auto;gap:12px}.brand{padding:0}.brand-mark{width:31px;height:31px}.brand-name{font-size:14px}.brand-sub{display:none}.side-label,.side-bottom,.add-decision{display:none}.decision-list{display:flex;overflow:auto;grid-column:1/-1;grid-row:2;gap:5px;padding-bottom:2px}.decision-item{width:auto;max-width:185px;flex:none;padding:7px 9px;font-size:12px}.shell>aside>.btn-primary{grid-column:2;grid-row:1;padding:7px 10px;font-size:12px}.shell>aside>.btn-primary::after{content:'新增決策'}.shell>aside>.btn-primary{font-size:0}.shell>aside>.btn-primary::after{font-size:12px}main{padding:23px 15px 40px}.topbar{margin-bottom:23px}.top-actions .btn{padding:8px 9px;font-size:11px}.top-actions{gap:5px}h1{font-size:27px}.mode-switch button{padding:8px 10px}.toolbar-right{align-self:stretch;justify-content:flex-end}.result-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.table-footer{padding:10px 12px}.result-score{font-size:22px}}
  </style>
</head>
<body>
  <div class="shell" id="app"></div>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <div class="toast-live" id="live" aria-live="polite"></div>
  <dialog class="dialog" id="editor"><form method="dialog" id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields"></div><div class="dialog-actions"><button class="btn" value="cancel" type="button" id="editor-cancel">取消</button><button class="btn btn-primary" type="submit" value="save">儲存</button></div></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script>
  (()=>{'use strict';
    const DB_NAME='heng-decision-matrix',DB_VERSION=1,STORE='decisions';
    const app=document.getElementById('app'),dialog=document.getElementById('editor'),notice=document.getElementById('notice');
    let db,decisions=[],activeId=null,noticeTimer;
    const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const active=()=>decisions.find(d=>d.id===activeId)||null;
    function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('此瀏覽器無法使用 IndexedDB。請改用較新的瀏覽器開啟工具。'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const database=req.result;if(!database.objectStoreNames.contains(STORE))database.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};req.onerror=()=>reject(req.error||new Error('無法開啟本機資料庫'))})}
    function transaction(mode,action){return new Promise((resolve,reject)=>{try{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let result;action(store,value=>{result=value});tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||new Error('資料庫交易失敗'));tx.onabort=()=>reject(tx.error||new Error('資料庫交易已中止'))}catch(error){reject(error)}})}
    const loadAll=()=>transaction('readonly',(s,set)=>{const r=s.getAll();r.onsuccess=()=>set(r.result)});
    const save=d=>transaction('readwrite',s=>s.put(d));
    const deleteById=id=>transaction('readwrite',s=>s.delete(id));
    function notify(message,error=false){notice.textContent=message;notice.classList.toggle('error',error);notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),3400)}
    function fail(error){notify(`資料保存失敗：${error.message||'請稍後再試。'}`,true)}
    async function persist(d){try{await save(d);decisions=decisions.map(x=>x.id===d.id?d:x);if(!decisions.some(x=>x.id===d.id))decisions.unshift(d);activeId=d.id;render();return true}catch(error){fail(error);render();return false}}
    function normalizedWeights(criteria){const total=criteria.reduce((sum,c)=>sum+Math.max(0,Number(c.weight)||0),0);return total?criteria.map(c=>Math.max(0,Number(c.weight)||0)/total):criteria.map(()=>0)}
    function assignRanks(rows){let rank=0,lastScore=null;for(const row of rows){if(row.total===null){row.rank=null;continue}if(lastScore===null||Math.abs(row.total-lastScore)>1e-8)rank++;row.rank=rank;lastScore=row.total}return rows}
    function weightedTotals(d){const criteria=d.criteria.filter(c=>Number(c.weight)>0),totalWeight=criteria.reduce((sum,c)=>sum+Number(c.weight),0);const rows=d.options.map(o=>{const complete=criteria.length>0&&criteria.every(c=>Number.isInteger(c.scores[o.id])&&c.scores[o.id]>=1&&c.scores[o.id]<=5);const total=complete?criteria.reduce((sum,c)=>{const score=Number(c.scores[o.id]);return sum+(c.direction==='lower'?6-score:score)*Number(c.weight)},0)/totalWeight:null;return{id:o.id,name:o.name,total}}).sort((a,b)=>(a.total===null)-(b.total===null)||(b.total??0)-(a.total??0));return assignRanks(rows)}
    function pughTotals(d){const base=d.options.find(o=>o.id===d.baselineId),criteria=d.criteria.filter(c=>Number(c.weight)>0),totalWeight=criteria.reduce((sum,c)=>sum+Number(c.weight),0);const rows=d.options.map(o=>{const isBaseline=o.id===d.baselineId,complete=criteria.length>0&&criteria.every(c=>['+','0','-'].includes(c.comparisons[o.id]));const total=isBaseline||!complete?null:criteria.reduce((sum,c)=>sum+(c.comparisons[o.id]==='+'?1:c.comparisons[o.id]==='-'?-1:0)*Number(c.weight),0)/totalWeight*100;return{id:o.id,name:o.name,total,isBaseline,baseName:base?.name||'—'}});const baseline=rows.filter(r=>r.isBaseline),candidates=assignRanks(rows.filter(r=>!r.isBaseline).sort((a,b)=>(a.total===null)-(b.total===null)||(b.total??0)-(a.total??0)));return[...baseline,...candidates]}
    function setBaseline(d,baselineId){if(d.baselineId===baselineId)return false;d.baselineId=baselineId;d.criteria.forEach(c=>c.comparisons={});return true}
    function removeOption(d,id){const removesBaseline=d.baselineId===id;d.options=d.options.filter(o=>o.id!==id);d.criteria.forEach(c=>{delete c.scores[id];delete c.comparisons[id];if(removesBaseline)c.comparisons={}});if(removesBaseline)d.baselineId=d.options[0]?.id||null}
    function render(){const d=active();if(!d){app.innerHTML=`<aside><div class="brand"><div class="brand-mark">衡</div><div><div class="brand-name">衡</div><div class="brand-sub">情境決策矩陣</div></div></div><div class="side-bottom"><div class="subtle-note">資料儲存在此瀏覽器。可隨時匯出 JSON 備份。</div></div><button class="btn btn-primary" data-action="new-decision">＋ 新增決策</button></aside><main><div class="empty-app"><div class="brand-mark">衡</div><h1>把複雜選擇，整理成清晰比較。</h1><p>建立決策情境，列出方案與評估準則，再用加權評分或 Pugh 基準比較，讓每個取捨都有跡可循。</p><button class="btn btn-primary" data-action="new-decision">建立第一個決策</button></div></main>`;return}
      app.innerHTML=`<aside><div class="brand"><div class="brand-mark">衡</div><div><div class="brand-name">衡</div><div class="brand-sub">情境決策矩陣</div></div></div><div><div class="side-label">我的決策</div><nav class="decision-list" aria-label="決策清單">${decisions.map(x=>`<button class="decision-item ${x.id===d.id?'active':''}" data-action="select-decision" data-id="${escapeHtml(x.id)}"><span class="decision-dot"></span><span class="decision-text">${escapeHtml(x.title||'未命名決策')}</span></button>`).join('')}</nav><button class="add-decision" data-action="new-decision">＋ 新增決策</button></div><div class="side-bottom"><button class="btn btn-sm" data-action="export">⇩　匯出備份</button><button class="btn btn-sm" data-action="import">⇧　匯入備份</button><div class="subtle-note">決策資料只保存在此瀏覽器。定期匯出 JSON，以免清除瀏覽器資料時遺失。</div></div><button class="btn btn-primary" data-action="new-decision">＋ 新增決策</button></aside>
      <main><div class="topbar"><div class="eyebrow">Decision workspace</div><div class="top-actions"><button class="btn btn-sm" data-action="export">匯出 JSON</button><button class="btn btn-sm" data-action="import">匯入</button><button class="btn btn-sm btn-quiet btn-danger" data-action="delete-decision" title="刪除此決策">刪除決策</button></div></div>
      <div class="heading-row"><div><h1><input class="title-input" aria-label="決策名稱" value="${escapeHtml(d.title)}" data-field="title"></h1><p class="lede">${escapeHtml(d.description||'整理方案與評估準則，讓選擇過程清楚可比較。')}</p></div><div class="mode-switch" role="tablist" aria-label="評估方式"><button role="tab" aria-selected="${d.mode==='weighted'}" class="${d.mode==='weighted'?'active':''}" data-action="mode" data-mode="weighted">加權評分</button><button role="tab" aria-selected="${d.mode==='pugh'}" class="${d.mode==='pugh'?'active':''}" data-action="mode" data-mode="pugh">Pugh 比較</button></div></div>
      <div class="toolbar"><div class="toolbar-left"><span class="select-wrap">${d.mode==='pugh'?`基準方案 <select data-field="baseline">${d.options.map(o=>`<option value="${escapeHtml(o.id)}" ${o.id===d.baselineId?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}</select>`:'原始評分 1–5　·　依準則方向換算　·　權重自動正規化'}</span></div><div class="toolbar-right"><button class="btn btn-sm" data-action="add-option">＋ 新增方案</button><button class="btn btn-sm" data-action="add-criterion">＋ 新增準則</button></div></div>
      <section class="matrix-card" aria-label="決策矩陣"><div class="table-scroll"><table><thead><tr><th class="criterion-head"><div>評估準則</div><div style="font-weight:400;margin-top:4px">權重・偏好方向</div></th>${d.options.map(o=>`<th class="option-head"><div class="option-name">${escapeHtml(o.name)}</div><div class="option-total">${d.mode==='pugh'&&o.id===d.baselineId?'基準方案':d.mode==='pugh'?formatScore(pughTotals(d).find(x=>x.id===o.id)?.total,' 分'):formatScore(weightedTotals(d).find(x=>x.id===o.id)?.total,' / 5')}</div><div class="row-actions" style="justify-content:center;margin-top:5px"><button class="mini-btn" data-action="edit-option" data-id="${escapeHtml(o.id)}">編輯</button><button class="mini-btn" data-action="delete-option" data-id="${escapeHtml(o.id)}">刪除</button></div></th>`).join('')}</tr></thead><tbody>${d.criteria.length?d.criteria.map(c=>`<tr><td><div class="criterion-name">${escapeHtml(c.name)}</div><div class="criterion-detail">${Number(c.weight)||0}%　·　${c.direction==='lower'?'越低越好':'越高越好'} <button class="mini-btn" data-action="edit-criterion" data-id="${escapeHtml(c.id)}">編輯</button><button class="mini-btn" data-action="delete-criterion" data-id="${escapeHtml(c.id)}">刪除</button></div></td>${d.options.map(o=>`<td>${d.mode==='pugh'&&o.id===d.baselineId?'<span class="baseline-tag">基準</span>':d.mode==='weighted'?`<select class="cell-select" aria-label="${escapeHtml(o.name)}・${escapeHtml(c.name)} 評分" data-score="${escapeHtml(c.id)}" data-option="${escapeHtml(o.id)}"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(c.scores[o.id])===n?'selected':''}>${n}</option>`).join('')}</select>`:`<select class="cell-select ${c.comparisons[o.id]==='+'?'pugh-plus':c.comparisons[o.id]==='-'?'pugh-minus':'pugh-zero'}" aria-label="${escapeHtml(o.name)}・${escapeHtml(c.name)} 比較" data-comparison="${escapeHtml(c.id)}" data-option="${escapeHtml(o.id)}"><option value="">—</option><option value="+" ${c.comparisons[o.id]==='+'?'selected':''}>＋ 優於</option><option value="0" ${c.comparisons[o.id]==='0'?'selected':''}>＝ 相同</option><option value="-" ${c.comparisons[o.id]==='-'?'selected':''}>− 劣於</option></select>`}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${Math.max(d.options.length+1,2)}"><div class="empty-results">先新增評估準則，再為每個方案評分。</div></td></tr>`}</tbody></table></div><div class="table-footer"><span>權重可用任意比例填寫，系統會自動正規化。</span><button class="add-criterion" data-action="add-criterion">＋ 新增評估準則</button></div></section>
      <section class="results"><div class="section-head"><div><h2>${d.mode==='pugh'?'Pugh 淨分排序':'加權結果'}</h2><p>${d.mode==='pugh'?'相對基準方案的加權淨優勢；正分代表整體較佳':'加權平均分數；依分數由高至低排列'}</p></div></div><div class="result-grid">${renderResults(d)}</div></section></main>`;
    }
    function formatScore(n,suffix){return n===null||n===undefined?'待評分':`${Number(n).toFixed(2)}${suffix}`}
    function renderResults(d){if(d.options.length<2)return '<div class="empty-results">至少新增兩個方案，才能比較評估結果。</div>';const rows=d.mode==='pugh'?pughTotals(d):weightedTotals(d);if(!d.criteria.length||!normalizedWeights(d.criteria).some(Boolean))return '<div class="empty-results">新增準則並設定大於 0 的權重後，結果會顯示在這裡。</div>';const scored=rows.filter(r=>r.total!==null);const max=Math.max(1,...scored.map(r=>d.mode==='weighted'?r.total:Math.abs(r.total)));return rows.map(r=>`<article class="result-card ${r.rank===1?'winner':''}"><div class="rank">${r.isBaseline?'比較基準':r.rank===null?'待完成評分':rows.filter(x=>!x.isBaseline&&x.rank===r.rank).length>1?`並列第 ${r.rank} 名`:`第 ${r.rank} 名`}</div><div class="result-name">${escapeHtml(r.name)}</div><div class="result-score">${r.total===null?'—':formatScore(r.total,d.mode==='weighted'?' / 5':' 分')}<span class="result-unit">${r.isBaseline?'':d.mode==='pugh'&&r.total>0?'淨優勢':d.mode==='pugh'&&r.total<0?'淨劣勢':''}</span></div><div class="result-bar"><span style="width:${r.total===null?0:d.mode==='weighted'?Math.max(0,Math.min(100,r.total/5*100)):Math.max(2,Math.min(100,Math.abs(r.total)/max*100))}%;${d.mode==='pugh'&&r.total<0?'background:#cf8a80':''}"></span></div></article>`).join('')}
    function openEditor(title,fields,initial,onSave){document.getElementById('editor-title').textContent=title;const box=document.getElementById('editor-fields'),form=document.getElementById('editor-form');box.innerHTML=fields.map(f=>`<div class="field"><label for="f-${f.name}">${escapeHtml(f.label)}</label>${f.type==='select'?`<select id="f-${f.name}" name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}</select>`:`<input id="f-${f.name}" name="${f.name}" type="${f.type||'text'}" ${f.type==='number'?`min="${f.min??0}" max="${f.max??100}" step="${f.step??1}"`:''} ${f.required?'required':''} placeholder="${escapeHtml(f.placeholder||'')}">`}${f.hint?`<span class="field-hint">${escapeHtml(f.hint)}</span>`:''}</div>`).join('');for(const[k,v]of Object.entries(initial||{})){const el=form.elements.namedItem(k);if(el)el.value=v}dialog.showModal();const submit=async e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));dialog.close();form.removeEventListener('submit',submit);await onSave(data)};form.addEventListener('submit',submit);document.getElementById('editor-cancel').onclick=()=>{dialog.close();form.removeEventListener('submit',submit)}}
    const nameField=(name,label='名稱')=>({name,label,required:true,placeholder:`輸入${label}`});
    function clone(d){return structuredClone(d)}
    async function mutate(fn){const d=active();if(!d)return;const next=clone(d);fn(next);await persist(next)}
    async function action(name,id,el){const d=active();switch(name){case'new-decision':openEditor('新增決策',[nameField('title','決策名稱'),{name:'description',label:'簡短說明',placeholder:'例如：比較三種合作方案'}],{title:'',description:''},async data=>{const item={id:uid(),title:data.title.trim(),description:data.description.trim(),mode:'weighted',baselineId:null,options:[],criteria:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};try{await save(item);decisions.unshift(item);activeId=item.id;render()}catch(e){fail(e)}});break;
      case'select-decision':activeId=id;render();break;
      case'mode':await mutate(x=>x.mode=el.dataset.mode);break;
      case'add-option':openEditor('新增方案',[nameField('name','方案名稱')],{name:''},data=>mutate(x=>{const option={id:uid(),name:data.name.trim()};x.options.push(option);if(!x.baselineId)x.baselineId=option.id}));break;
      case'edit-option':{const o=d.options.find(x=>x.id===id);if(!o)return;openEditor('編輯方案',[nameField('name','方案名稱')],{name:o.name},data=>mutate(x=>{x.options.find(y=>y.id===id).name=data.name.trim()}));break}
      case'delete-option':if(d.options.length<2){notify('至少保留一個方案。',true);return}if(confirm(`確定刪除「${d.options.find(x=>x.id===id)?.name}」？${d.baselineId===id?'此方案是 Pugh 基準，刪除後會重設所有 Pugh 比較。':'相關評分也會移除。'}`))await mutate(x=>removeOption(x,id));break;
      case'add-criterion':openEditor('新增評估準則',[nameField('name','準則名稱'),{name:'weight',label:'權重（任意比例）',type:'number',min:0,max:100000,step:'any',hint:'計算時會自動依總權重正規化。'},{name:'direction',label:'偏好方向',type:'select',options:[{value:'higher',label:'越高越好'},{value:'lower',label:'越低越好'}]}],{name:'',weight:25,direction:'higher'},data=>mutate(x=>x.criteria.push({id:uid(),name:data.name.trim(),weight:Number(data.weight),direction:data.direction,scores:{},comparisons:{}})));break;
      case'edit-criterion':{const c=d.criteria.find(x=>x.id===id);if(!c)return;openEditor('編輯評估準則',[nameField('name','準則名稱'),{name:'weight',label:'權重（任意比例）',type:'number',min:0,max:100000,step:'any'},{name:'direction',label:'偏好方向',type:'select',options:[{value:'higher',label:'越高越好'},{value:'lower',label:'越低越好'}]}],{name:c.name,weight:c.weight,direction:c.direction},data=>mutate(x=>Object.assign(x.criteria.find(y=>y.id===id),{name:data.name.trim(),weight:Number(data.weight),direction:data.direction})));break}
      case'delete-criterion':if(confirm(`確定刪除準則「${d.criteria.find(x=>x.id===id)?.name}」？`))await mutate(x=>x.criteria=x.criteria.filter(c=>c.id!==id));break;
      case'delete-decision':if(confirm(`確定永久刪除「${d.title}」？此操作無法復原。`)){try{await deleteById(d.id);decisions=decisions.filter(x=>x.id!==d.id);activeId=decisions[0]?.id||null;render();notify('決策已刪除。')}catch(e){fail(e)}}break;
      case'export':await exportBackup();break;case'import':document.getElementById('import-file').click();break;
    }}
    app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el.dataset.id,el)});
    app.addEventListener('change',async e=>{const el=e.target,d=active();if(!d)return;if(el.dataset.score){await mutate(x=>{const c=x.criteria.find(y=>y.id===el.dataset.score);if(el.value)c.scores[el.dataset.option]=Number(el.value);else delete c.scores[el.dataset.option]})}else if(el.dataset.comparison){await mutate(x=>{const c=x.criteria.find(y=>y.id===el.dataset.comparison);if(el.value)c.comparisons[el.dataset.option]=el.value;else delete c.comparisons[el.dataset.option]})}else if(el.dataset.field==='baseline'){if(el.value===d.baselineId)return;const hasComparisons=d.criteria.some(c=>Object.keys(c.comparisons).length);if(hasComparisons&&!confirm('更換基準後，現有 Pugh 比較將清除，因為比較值是相對目前基準記錄的。要更換基準並重新評估嗎？')){el.value=d.baselineId;return}await mutate(x=>setBaseline(x,el.value));if(hasComparisons)notify('已更換基準；請重新填寫 Pugh 比較。')}else if(el.dataset.field==='title'){const val=el.value.trim();if(!val){el.value=d.title;notify('決策名稱不能空白。',true);return}await mutate(x=>x.title=val)}});
    async function exportBackup(){try{const data=await loadAll(),blob=new Blob([JSON.stringify({format:'heng-decision-matrix',version:1,exportedAt:new Date().toISOString(),decisions:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`heng-decisions-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('JSON 備份已匯出。')}catch(e){fail(e)}}
    function validBackup(data){const record=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);if(!data||data.format!=='heng-decision-matrix'||data.version!==1||!Array.isArray(data.decisions))return false;const ids=new Set();for(const d of data.decisions){if(!record(d)||typeof d.id!=='string'||!d.id||ids.has(d.id)||typeof d.title!=='string'||!['weighted','pugh'].includes(d.mode)||!Array.isArray(d.options)||!Array.isArray(d.criteria))return false;ids.add(d.id);const optionIds=new Set();for(const o of d.options){if(!record(o)||typeof o.id!=='string'||!o.id||optionIds.has(o.id)||typeof o.name!=='string'||!o.name.trim())return false;optionIds.add(o.id)}if(d.options.length?typeof d.baselineId!=='string'||!optionIds.has(d.baselineId):d.baselineId!==null)return false;const criterionIds=new Set();for(const c of d.criteria){if(!record(c)||typeof c.id!=='string'||!c.id||criterionIds.has(c.id)||typeof c.name!=='string'||!c.name.trim()||!Number.isFinite(Number(c.weight))||Number(c.weight)<0||!['higher','lower'].includes(c.direction)||!record(c.scores)||!record(c.comparisons))return false;criterionIds.add(c.id);for(const[k,v]of Object.entries(c.scores))if(!optionIds.has(k)||!Number.isInteger(v)||v<1||v>5)return false;for(const[k,v]of Object.entries(c.comparisons))if(!optionIds.has(k)||!['+','0','-'].includes(v))return false}if(typeof d.description!=='string')return false}return true}
    document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(!validBackup(data)){notify('備份檔格式或資料內容無效，沒有匯入任何資料。',true);return}const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);for(const d of data.decisions)store.put(d);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('匯入交易失敗'));tx.onabort=()=>reject(tx.error||new Error('匯入交易已中止'))});decisions=await loadAll();activeId=data.decisions[0]?.id||decisions[0]?.id||null;render();notify(`已匯入 ${data.decisions.length} 份決策。`)}catch(error){fail(error)}});
    window.addEventListener('unhandledrejection',e=>{e.preventDefault();fail(e.reason||new Error('未知錯誤'))});
    (async()=>{try{await openDb();decisions=await loadAll();activeId=decisions[0]?.id||null;render()}catch(error){app.innerHTML=`<main><div class="empty-app"><div class="brand-mark">衡</div><h1>無法開啟本機資料庫</h1><p>${escapeHtml(error.message)}<br>請確認瀏覽器允許此頁面使用網站資料，再重新載入。</p></div></main>`}})();
  })();
  </script>
