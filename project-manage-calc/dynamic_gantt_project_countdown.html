            <!-- 品牌標題區 + 手機版快速新增按鈕 -->

                <div class="flex items-center space-x-2.5">
                    <div class="bg-zinc-900 text-zinc-100 p-1.5 sm:p-2 rounded-xl shadow-xs ring-1 ring-zinc-800/10 shrink-0">
                        <i data-lucide="calendar-range" class="w-4 h-4 sm:w-5 sm:h-5 text-teal-400"></i>

                    <i data-lucide="plus" class="w-3.5 h-3.5 text-teal-300"></i>

            <!-- 控制群組：專案切換 + 資料管理操作 -->

                <!-- 專案切換與管理控制區 -->

                        <span class="text-[11px] sm:text-xs font-semibold hidden sm:inline text-zinc-700">專案：</span>

                    <select id="projectSelect" class="text-xs font-semibold bg-white border border-zinc-200 text-zinc-800 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-zinc-800 flex-1 sm:flex-none sm:max-w-[170px] truncate shadow-2xs">
                        <!-- 動態載入專案選單 -->

                    <button id="openNewProjectBtn" title="新增專案" class="p-1.5 bg-white hover:bg-zinc-200 text-zinc-700 rounded-lg transition-colors border border-zinc-200 shadow-2xs shrink-0">
                        <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button id="openProjectSettingsBtn" title="專案設定" class="p-1.5 bg-white hover:bg-zinc-200 text-zinc-700 rounded-lg transition-colors border border-zinc-200 shadow-2xs shrink-0">
                        <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <!-- 備份、匯入與桌面版新增按鈕 -->
                <div class="flex items-center space-x-1.5 sm:space-x-2">
                    <button id="exportBtn" title="匯出備份" class="flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 sm:py-2 text-xs font-medium text-zinc-700 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors border border-zinc-200/60">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-zinc-500"></i>
                        <span class="hidden lg:inline">匯出備份</span>
                    </button>
                    <label for="importFile" title="匯入資料" class="cursor-pointer flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 sm:py-2 text-xs font-medium text-zinc-700 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors border border-zinc-200/60">

                        <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-500"></i>
                        <span class="hidden lg:inline">全部重設</span>

                    <!-- 桌面版新增任務按鈕 -->
                    <button id="openNewTaskModal" class="hidden md:flex items-center space-x-1.5 px-3.5 py-2 text-xs sm:text-sm font-medium text-white bg-zinc-900 hover:bg-zinc-800 active:scale-95 rounded-lg shadow-xs transition-all shrink-0">
                        <i data-lucide="plus" class="w-4 h-4 text-teal-300"></i>

                    <h2 class="text-sm sm:text-base font-bold text-zinc-900 tracking-tight">重要里程碑倒數 (D-Day)</h2>
                </div>

    <!-- 專案新增 / 編輯彈窗 -->

        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-zinc-200 transform transition-all">

                </div>

    <!-- 自訂刪除確認對話框 -->

        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-zinc-200 space-y-4">

    <script>
        const DB_NAME = 'GanttProjectDB';
        const DB_VERSION = 2; // 升級為支援多專案與任務關聯
        const STORE_PROJECTS = 'projects';
        const STORE_TASKS = 'tasks';

        // 初始化與升級 IndexedDB
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    // 建立專案 Store
                    if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
                        db.createObjectStore(STORE_PROJECTS, { keyPath: 'id' });
                    }
                    // 建立任務 Store，並建立 projectId 索引以利快速檢索
                    let taskStore;
                    if (!db.objectStoreNames.contains(STORE_TASKS)) {
                        taskStore = db.createObjectStore(STORE_TASKS, { keyPath: 'id' });
                    } else {
                        taskStore = req.transaction.objectStore(STORE_TASKS);
                    }
                    if (!taskStore.indexNames.contains('projectId')) {
                        taskStore.createIndex('projectId', 'projectId', { unique: false });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // 專案庫操作
        async function dbGetAllProjects() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PROJECTS, 'readonly');
                const store = tx.objectStore(STORE_PROJECTS);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);

            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_PROJECTS, 'readwrite');
                const store = tx.objectStore(STORE_PROJECTS);
                store.put(project);
                tx.oncomplete = () => resolve(project);
                tx.onerror = () => reject(tx.error);
            });
        }

        async function dbDeleteProjectAndTasks(projectId) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction([STORE_PROJECTS, STORE_TASKS], 'readwrite');
                const projStore = tx.objectStore(STORE_PROJECTS);
                const taskStore = tx.objectStore(STORE_TASKS);

                projStore.delete(projectId);

                // 批次刪除該專案名下的所有任務
                const req = taskStore.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.projectId === projectId) {
                            cursor.delete();
                        }
                        cursor.continue();
                    }
                };

                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

                const req = store.getAll();

        function getGanttTimelineRange() {
            const currentTasks = getCurrentProjectTasks();
            if (currentTasks.length === 0) {
                const start = addDays(todayObj, -7);
                const end = addDays(todayObj, 21);
                return { start, end, totalDays: 29 };
            }

            let minDate = new Date(currentTasks[0].startDate);
            let maxDate = new Date(currentTasks[0].endDate);

            currentTasks.forEach(t => {
                const s = new Date(t.startDate);
                const e = new Date(t.endDate);
                if (s < minDate) minDate = s;
                if (e > maxDate) maxDate = e;
            });

            const start = addDays(minDate, -4);
            const end = addDays(maxDate, 7);
            const totalDays = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24))) + 1;

            return { start, end, totalDays };
        }

            } else if (taskStatusSelect.value === 'COMPLETED' && val < 100) {
                taskStatusSelect.value = val === 0 ? 'PENDING' : 'IN_PROGRESS';
            }
        });

        // 狀態變更事件：切換為已完成時自動將進度設為 100%
        taskStatusSelect.addEventListener('change', (e) => {
            const status = e.target.value;
            if (status === 'COMPLETED') {
                progressInput.value = 100;
                progressDisplay.textContent = '100%';
            } else if (status === 'PENDING') {
                progressInput.value = 0;
                progressDisplay.textContent = '0%';
            } else if (status === 'IN_PROGRESS' && parseInt(progressInput.value, 10) === 100) {
                // 若原本為 100% 卻切回進行中，預設調整回 50%
                progressInput.value = 50;
                progressDisplay.textContent = '50%';
            }
        });

        function openCreateModal() {
            if (!currentProjectId) {
                showToast('請先建立或選擇專案！', 'warning');
                return;
            }
            taskForm.reset();
            document.getElementById('taskId').value = '';
            document.getElementById('taskStartDate').value = formatDateISO(todayObj);
            document.getElementById('taskEndDate').value = formatDateISO(addDays(todayObj, 5));
            document.getElementById('taskProgress').value = 0;
            progressDisplay.textContent = '0%';
            modalTitle.textContent = '新增專案任務';
            deleteTaskBtn.classList.add('hidden');
            taskModal.classList.remove('hidden');
        }

        function openEditModal(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;

            document.getElementById('taskId').value = task.id;
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskStartDate').value = task.startDate;
            document.getElementById('taskEndDate').value = task.endDate;
            document.getElementById('taskOwner').value = task.owner || '';
            document.getElementById('taskStatus').value = task.status;
            
            // 若為已完成狀態，確保進度為 100%
            let initialProgress = task.progress;
            if (task.status === 'COMPLETED') {
                initialProgress = 100;
            }
            document.getElementById('taskProgress').value = initialProgress;
            document.getElementById('taskIsMilestone').checked = !!task.isMilestone;
            progressDisplay.textContent = `${initialProgress}%`;

            modalTitle.textContent = '編輯任務排程';
            deleteTaskBtn.classList.remove('hidden');
            taskModal.classList.remove('hidden');
        }

        function closeModal() {
            taskModal.classList.add('hidden');
        }

        // 儲存任務 (寫入當前 projectId)
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const name = document.getElementById('taskName').value.trim();
            const startDate = document.getElementById('taskStartDate').value;
            const endDate = document.getElementById('taskEndDate').value;
            const owner = document.getElementById('taskOwner').value.trim();
            const status = document.getElementById('taskStatus').value;
            let progress = parseInt(document.getElementById('taskProgress').value, 10);
            const isMilestone = document.getElementById('taskIsMilestone').checked;

            // 確保已完成狀態時儲存的進度必為 100%
            if (status === 'COMPLETED') {
                progress = 100;
            }

            if (new Date(startDate) > new Date(endDate)) {
                showToast('開始日期不得晚於截止日期！', 'warning');
                return;
            }

            try {
                if (id) {
                    const taskIndex = allTasks.findIndex(t => t.id === id);
                    const originalProjectId = taskIndex !== -1 ? allTasks[taskIndex].projectId : currentProjectId;
                    const updatedTask = { id, projectId: originalProjectId, name, startDate, endDate, owner, status, progress, isMilestone };
                    await dbPutTask(updatedTask);
                    if (taskIndex !== -1) {
                        allTasks[taskIndex] = updatedTask;
                    }
                    showToast('任務已更新至 IndexedDB', 'success');
                } else {
                    const newTask = {
                        id: 'task-' + Date.now(),
                        projectId: currentProjectId,
                        name,
                        startDate,
                        endDate,
                        owner,
                        status,
                        progress,
                        isMilestone
                    };
                    await dbPutTask(newTask);
                    allTasks.push(newTask);
                    showToast('已新增任務並儲存', 'success');
                }

                closeModal();
                refreshAll();
            } catch (err) {
                console.error(err);
                showToast('資料寫入失敗', 'error');
            }
        });

        // 刪除任務
        deleteTaskBtn.addEventListener('click', async () => {
            const id = document.getElementById('taskId').value;
            if (id) {
                try {
                    await dbDeleteTask(id);
                    allTasks = allTasks.filter(t => t.id !== id);
                    showToast('任務已移除', 'info');
                    closeModal();
                    refreshAll();
                } catch (err) {
                    console.error(err);
                    showToast('刪除失敗', 'error');
                }
            }
        });

        // 匯出完整工作區 (所有專案及對應任務)
        document.getElementById('exportBtn').addEventListener('click', () => {
            const exportPayload = {
                version: 2,
                exportedAt: new Date().toISOString(),
                projects,
                tasks: allTasks
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `projects_workspace_${formatDateISO(new Date())}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('所有專案工作區 JSON 已匯出', 'success');
        });

        // 全部重設 (清除所有專案與甘特圖排程)
        document.getElementById('resetAllBtn').addEventListener('click', () => {
            openConfirmDialog(
                '確定要重設整個工作區？這將永久清空所有專案、里程碑倒數與甘特圖排程，且無法復原。建議重設前先「匯出備份」。',
                async () => {
                    try {
                        await dbClearAll();

                        // 建立一個乾淨的新專案供立即使用
                        const initialProj = {
                            id: 'proj-' + Date.now(),
                            name: '預設新專案',
                            desc: '工作區已全面重設，開始規劃您的新排程',
                            createdAt: new Date().toISOString()
                        };
                        await dbPutProject(initialProj);

                        projects = [initialProj];
                        allTasks = [];
                        currentProjectId = initialProj.id;

                        renderProjectSelect();
                        refreshAll();
                        showToast('已清空所有專案與排程資料！', 'info');
                    } catch (err) {
                        console.error(err);
                        showToast('重設失敗，請重試', 'error');
                    }
                }
            );
        });

        // 匯入 JSON (相容 v1 舊版陣列與 v2 多專案工作區格式)
        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    const db = await openDB();

                    if (imported.projects && Array.isArray(imported.projects) && Array.isArray(imported.tasks)) {
                        // v2 多專案完整工作區格式
                        const tx = db.transaction([STORE_PROJECTS, STORE_TASKS], 'readwrite');
                        const projStore = tx.objectStore(STORE_PROJECTS);
                        const taskStore = tx.objectStore(STORE_TASKS);
                        projStore.clear();
                        taskStore.clear();
                        imported.projects.forEach(p => projStore.put(p));
                        imported.tasks.forEach(t => taskStore.put(t));

                        await new Promise((res, rej) => {
                            tx.oncomplete = res;
                            tx.onerror = rej;
                        });

                        projects = imported.projects;
                        allTasks = imported.tasks;
                        currentProjectId = projects[0]?.id || null;
                        renderProjectSelect();
                        refreshAll();
                        showToast('已成功復原多專案工作區備份！', 'success');
                    } else if (Array.isArray(imported)) {
                        // 相容舊版單專案任務陣列
                        const defaultProj = {
                            id: 'proj-imported-' + Date.now(),
                            name: '匯入的專案',
                            desc: '從舊版格式匯入',
                            createdAt: new Date().toISOString()
                        };
                        const mappedTasks = imported.map(t => ({
                            ...t,
                            projectId: t.projectId || defaultProj.id
                        }));

                        await dbPutProject(defaultProj);
                        for (const t of mappedTasks) {
                            await dbPutTask(t);
                        }

                        projects.push(defaultProj);
                        allTasks.push(...mappedTasks);
                        currentProjectId = defaultProj.id;
                        renderProjectSelect();
                        refreshAll();
                        showToast('已成功匯入舊版資料並轉為新專案！', 'success');
                    } else {
                        showToast('匯入格式不相符', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('匯入失敗，請確認檔案格式', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.getElementById('openNewTaskModal').addEventListener('click', openCreateModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        document.getElementById('statusFilter').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderGantt();
        });

        const viewDayBtn = document.getElementById('viewDayBtn');
        const viewWeekBtn = document.getElementById('viewWeekBtn');

        viewDayBtn.addEventListener('click', () => {
            currentScale = 'DAY';
            viewDayBtn.className = "px-3 py-1 rounded-md bg-white text-zinc-900 shadow-2xs font-semibold transition";
            viewWeekBtn.className = "px-3 py-1 rounded-md text-zinc-600 hover:text-zinc-900 transition";
            renderGantt();
        });

        viewWeekBtn.addEventListener('click', () => {
            currentScale = 'WEEK';
            viewWeekBtn.className = "px-3 py-1 rounded-md bg-white text-zinc-900 shadow-2xs font-semibold transition";
            viewDayBtn.className = "px-3 py-1 rounded-md text-zinc-600 hover:text-zinc-900 transition";
            renderGantt();
        });

        viewWeekBtn.addEventListener('click', () => {
            currentScale = 'WEEK';
            viewWeekBtn.className = "px-2.5 sm:px-3 py-1 rounded-md bg-white text-zinc-900 shadow-2xs font-semibold transition";
            viewDayBtn.className = "px-2.5 sm:px-3 py-1 rounded-md text-zinc-600 hover:text-zinc-900 transition";
            renderGantt();
        });

        document.getElementById('scrollToTodayBtn').addEventListener('click', () => {
            const { start } = getGanttTimelineRange();
            const daysFromStart = Math.round((todayObj - start) / (1000 * 60 * 60 * 24));
            const cellWidth = currentScale === 'DAY' ? CELL_WIDTH_DAY : CELL_WIDTH_WEEK;
            const container = document.getElementById('ganttScrollContainer');
            const isMobile = window.innerWidth < 640;
            const leftColWidthPx = isMobile ? 144 : 224;
            const targetX = Math.max(0, (daysFromStart * cellWidth) - (container.clientWidth / 2) + leftColWidthPx / 2);
            container.scrollTo({ left: targetX, behavior: 'smooth' });
        });

        function refreshAll() {
            renderCountdownCards();
            renderGantt();
        }

        // 綁定手機版快速新增任務按鈕
        const mobileAddBtn = document.getElementById('openNewTaskModalMobile');
        if (mobileAddBtn) {
            mobileAddBtn.addEventListener('click', openCreateModal);
        }

        // 監聽螢幕旋轉與縮放，即時重新計算甘特圖比例
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderGantt();
            }, 150);
        });

        // 初始化 IndexedDB 與資料載入
        async function initData() {
            try {
                let storedProjects = await dbGetAllProjects();
                let storedTasks = await dbGetAllTasks();

                if (!storedProjects || storedProjects.length === 0) {
                    // 若無專案資料，寫入示範多專案與任務
                    for (const p of defaultProjects) await dbPutProject(p);
                    for (const t of defaultTasks) await dbPutTask(t);
                    projects = [...defaultProjects];
                    allTasks = [...defaultTasks];
                } else {
                    projects = storedProjects;
                    allTasks = storedTasks;
                    
                    // 升級相容檢查：若有任務未帶有 projectId，自動掛載至第一個專案
                    for (const t of allTasks) {
                        if (!t.projectId) {
                            t.projectId = projects[0].id;
                            await dbPutTask(t);
                        }
                    }
                }
                currentProjectId = projects[0]?.id || null;
                renderProjectSelect();
            } catch (err) {
                console.error('IndexedDB 初始化失敗', err);
                projects = [...defaultProjects];
                allTasks = [...defaultTasks];
                currentProjectId = projects[0]?.id || null;
                renderProjectSelect();
                showToast('IndexedDB 初始化異常，啟用臨時記憶體模式', 'warning');
            }
            refreshAll();
        }

        window.onload = function() {
            lucide.createIcons();
            initData();
        };
    </script>
</body>
</html>
