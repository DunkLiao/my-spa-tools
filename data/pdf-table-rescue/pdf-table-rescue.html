<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 表格救援站</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#dde2ea;--text:#1f2937;--muted:#6b7280;--pri:#2563eb;--green:#16a34a;--blue:#2563eb;--orange:#ea580c;--red:#dc2626;--gridH:38vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:#1d4ed8}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.btn:disabled{opacity:.45;cursor:not-allowed}
header.top{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0f172a;color:#fff;flex:none}
.brand{font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}
.brand small{font-weight:400;color:#94a3b8;font-size:11px;margin-left:6px}
header.top .btn{background:#1e293b;color:#e2e8f0;border-color:#334155}
header.top .btn:hover{background:#334155}
header.top .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.spacer{flex:1}
.proj-name{color:#94a3b8;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock{color:#86efac;font-size:12px;white-space:nowrap}
.menu{position:relative}
.menu-pop{display:none;position:absolute;top:calc(100% + 4px);right:0;min-width:230px;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:50}
.menu.left .menu-pop{left:0;right:auto}
.menu.open .menu-pop{display:block}
.menu-pop .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu-pop .mi:hover{background:#eff6ff}
.menu-pop .sep{height:1px;background:var(--line);margin:5px 2px}
.menu-pop .cap{font-size:11px;color:var(--muted);padding:4px 10px 2px}
main{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) 6px var(--gridH);min-height:0}
#thumbs{grid-row:1;grid-column:1;overflow:auto;background:#eef1f5;border-right:1px solid var(--line);padding:8px}
.thumb{position:relative;margin:0 auto 10px;cursor:pointer;width:118px;text-align:center}
.thumb canvas,.thumb .ph{display:block;width:118px;background:#fff;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.thumb .ph{height:150px}
.thumb.cur canvas,.thumb.cur .ph{border-color:var(--pri)}
.thumb .pn{font-size:11px;color:var(--muted);margin-top:2px}
.thumb .badge{position:absolute;top:4px;right:4px;font-size:10px;padding:1px 5px;border-radius:8px;color:#fff}
.badge.ok{background:var(--green)}
.badge.scan{background:#a16207;top:22px!important}
#viewerWrap{grid-row:1;grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0}
.vtool{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtool .grp{display:flex;gap:4px;align-items:center}
.vtool .div{width:1px;height:22px;background:var(--line);margin:0 4px}
.zoomv{min-width:46px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin-left:auto}
#banner{display:none;align-items:center;gap:8px;padding:7px 12px;background:#ecfdf5;border-bottom:1px solid #a7f3d0;color:#065f46}
#banner.show{display:flex}
#viewer{flex:1;overflow:auto;position:relative;background:#e5e7eb;min-height:0}
#pageBox{position:relative;margin:16px auto;box-shadow:0 2px 12px rgba(0,0,0,.2);background:#fff}
#pageCanvas{display:block}
#overlay{position:absolute;left:0;top:0;user-select:none;touch-action:none}
#overlay.m-box{cursor:crosshair}
#overlay.m-col{cursor:col-resize}
#overlay.m-row{cursor:row-resize}
.seg-box{position:absolute;border:2px solid var(--green);background:rgba(22,163,74,.04);pointer-events:none}
.seg-box.inactive{border-style:dashed;opacity:.6}
.seg-box .lbl{position:absolute;top:-19px;left:-2px;background:var(--green);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.vline,.hline{position:absolute;pointer-events:auto;z-index:3}
.vline{width:11px;margin-left:-5px;cursor:col-resize}
.vline::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--blue)}
.hline{height:11px;margin-top:-5px;cursor:row-resize}
.hline::after{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--orange)}
.vline:hover::after{background:#1e40af;width:3px}
.hline:hover::after{background:#9a3412;height:3px}
.ro{pointer-events:none;opacity:.35}
.hline.auto{pointer-events:none}
.hline.auto::after{height:0;border-top:1px dashed #f59e0b;background:none}
.handle{position:absolute;width:11px;height:11px;margin:-5px 0 0 -5px;background:#fff;border:2px solid var(--green);z-index:4;pointer-events:auto}
.handle.nw,.handle.se{cursor:nwse-resize}.handle.ne,.handle.sw{cursor:nesw-resize}
.wbox{position:absolute;border:1px solid rgba(100,116,139,.5);pointer-events:none}
.wbox.low{background:rgba(250,204,21,.4);border-color:#ca8a04}
.draw-rect{position:absolute;border:2px dashed var(--green);background:rgba(22,163,74,.1);pointer-events:none}
.drop{position:absolute;inset:24px;border:3px dashed #94a3b8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#475569;gap:10px;text-align:center;background:rgba(255,255,255,.6)}
.drop h2{margin:0;font-size:22px}
.drop.hover{border-color:var(--pri);background:#eff6ff}
#side{grid-row:1;grid-column:3;overflow:auto;background:var(--panel);border-left:1px solid var(--line)}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.sec h3 .r{margin-left:auto}
.tlist{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto}
.titem{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.titem:hover{background:#f8fafc}
.titem.act{border-color:var(--green);background:#f0fdf4}
.titem .meta{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.titem .warn{color:var(--red);font-size:11px}
.row{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.row label{color:#374151}
.row .lab{width:78px;color:var(--muted);flex:none}
.row input[type=text],.row input[type=number],.row select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff}
.row input[type=text]{flex:1;min-width:0}
.row input[type=number]{width:60px}
.chk{display:flex;align-items:center;gap:6px;margin:5px 0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.muted{color:var(--muted)}
.small{font-size:11px}
.empty-side{color:var(--muted);padding:6px 0;line-height:1.7}
.vres{font-size:12px;line-height:1.7}
.vres .bad{color:var(--red)}
.vres .ok{color:var(--green)}
.vres a{cursor:pointer;text-decoration:underline}
#splitter{grid-row:2;grid-column:1/4;background:#d6dbe3;cursor:row-resize}
#splitter:hover{background:#93c5fd}
#gridPanel{grid-row:3;grid-column:1/4;display:flex;flex-direction:column;background:#fff;min-height:0}
.gtool{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.gtool .title{font-weight:700}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-left:auto;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid #ccc;vertical-align:-2px;margin-right:3px}
#gridWrap{flex:1;overflow:auto;min-height:0}
#gridWrap .empty{color:var(--muted);padding:24px;text-align:center}
table.grid{border-collapse:collapse;font-size:12px}
.grid td,.grid th{border:1px solid #e2e8f0;padding:3px 6px;white-space:pre-wrap;min-width:64px;max-width:380px;vertical-align:top;word-break:break-word}
.grid thead th{position:sticky;top:0;background:#f1f5f9;z-index:2;font-weight:600;padding:3px 4px}
.grid thead th select{font-size:11px;border:1px solid var(--line);border-radius:4px;margin-top:2px;width:100%;background:#fff}
.grid th.rn{position:sticky;left:0;background:#f8fafc;color:#94a3b8;font-weight:400;min-width:38px;text-align:right;z-index:1}
.grid thead th.rn{z-index:3}
.grid tr.hdr td{background:#eef2ff;font-weight:600}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.bad,.grid td.low{background:#fef3c7}
.grid td.mis{background:#fee2e2;color:#991b1b;box-shadow:inset 0 0 0 1px #f87171}
.grid td.sumok{background:#dcfce7}
.grid td.edited{box-shadow:inset 3px 0 0 #a855f7}
.grid td:focus{outline:2px solid var(--pri);outline-offset:-2px;background:#fff}
.grid td.merged{background-image:linear-gradient(135deg,rgba(37,99,235,.06) 25%,transparent 25%)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#111827;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:420px;animation:fi .2s}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#busy{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:150}
#busy.show{display:flex}
#busy .box{background:#fff;border-radius:12px;padding:20px 24px;width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#busy .msg{margin-bottom:10px}
#busy .bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
#busy .bar div{height:100%;background:var(--pri);width:0;transition:width .15s}
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:14px 16px;overflow:auto;max-height:calc(88vh - 110px)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{color:var(--muted);font-weight:400;font-size:12px}
.preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.preview table{border-collapse:collapse;font-size:11px}
.preview td{border:1px solid #eee;padding:2px 5px;white-space:nowrap}
.log{font-size:12px;color:#374151;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:8px;max-height:140px;overflow:auto;margin-top:8px;white-space:pre-wrap}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:3px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">🛟 PDF 表格救援站<small>v1.0</small></div>
  <button class="btn pri" id="btnOpen" title="開啟 PDF（也可直接拖入）">📂 開啟 PDF</button>
  <div class="menu left" id="mProj">
    <button class="btn" data-menu>🗂 專案 ▾</button>
    <div class="menu-pop" id="projPop"></div>
  </div>
  <div class="menu left" id="mTpl">
    <button class="btn" data-menu>📐 範本 ▾</button>
    <div class="menu-pop">
      <button class="mi" data-cmd="tplSave">💾 將目前表格存成範本</button>
      <button class="mi" data-cmd="tplManage">📋 套用／管理範本…</button>
    </div>
  </div>
  <button class="btn" id="btnBatch" title="以範本一次處理多份 PDF">📚 批次處理</button>
  <span class="proj-name" id="projName"></span>
  <div class="spacer"></div>
  <span class="lock" title="所有解析都在瀏覽器內完成">🔒 檔案不上傳，只在本機處理</span>
  <div class="menu" id="mExport">
    <button class="btn pri" data-menu>⬇ 匯出 ▾</button>
    <div class="menu-pop">
      <div class="cap">目前表格</div>
      <button class="mi" data-cmd="exXlsx">Excel（.xlsx）</button>
      <button class="mi" data-cmd="exCsv">CSV（UTF-8，Excel 可直接開）</button>
      <button class="mi" data-cmd="exJson">JSON</button>
      <button class="mi" data-cmd="exMd">Markdown</button>
      <button class="mi" data-cmd="exClip">📋 複製到剪貼簿（貼進 Excel 自動分欄）</button>
      <div class="sep"></div>
      <div class="cap">全部表格</div>
      <button class="mi" data-cmd="exXlsxAll">Excel（每個表格一個工作表）</button>
      <button class="mi" data-cmd="exJsonAll">JSON（全部表格）</button>
    </div>
  </div>
</header>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

<main>
  <aside id="thumbs"></aside>

  <section id="viewerWrap">
    <div class="vtool">
      <div class="grp">
        <button class="btn sm on" data-mode="select" title="選取表格、拖動欄線列線（V）">👆 選取</button>
        <button class="btn sm" data-mode="box" title="拖曳框出新表格（B）">▭ 框選表格</button>
        <button class="btn sm" data-mode="col" title="在表格內點一下新增欄線（C）">┃ 欄線</button>
        <button class="btn sm" data-mode="row" title="在表格內點一下新增列線（R）">━ 列線</button>
      </div>
      <div class="div"></div>
      <div class="grp">
        <button class="btn sm" id="zOut" title="縮小（-）">－</button>
        <span class="zoomv" id="zoomVal">100%</span>
        <button class="btn sm" id="zIn" title="放大（+）">＋</button>
        <button class="btn sm" id="zFit">適合寬度</button>
      </div>
      <div class="div"></div>
      <div class="grp">
        <button class="btn sm" id="pPrev" title="上一頁（PageUp）">◀</button>
        <span id="pageVal" class="muted">–</span>
        <button class="btn sm" id="pNext" title="下一頁（PageDown）">▶</button>
      </div>
      <div class="div"></div>
      <div class="grp">
        <label class="chk small"><input type="checkbox" id="showWords">顯示文字框</label>
        <button class="btn sm" id="btnDetectPage">🔍 偵測本頁</button>
        <button class="btn sm" id="btnDetectAll">🔍 偵測全部頁</button>
      </div>
      <span class="hint" id="modeHint">雙擊或右鍵線條可刪除</span>
    </div>
    <div id="banner"></div>
    <div id="viewer">
      <div class="drop" id="drop">
        <div style="font-size:48px">🛟</div>
        <h2>把 PDF 拖進來</h2>
        <div>或點左上角「開啟 PDF」。檔案只在瀏覽器裡處理，不會上傳。</div>
        <div class="muted small" id="libStatus"></div>
      </div>
      <div id="pageBox" style="display:none">
        <canvas id="pageCanvas"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
  </section>

  <aside id="side"></aside>
  <div id="splitter" title="拖曳調整高度"></div>

  <section id="gridPanel">
    <div class="gtool">
      <span class="title" id="gridTitle">表格預覽</span>
      <span class="muted" id="gridStat"></span>
      <button class="btn sm" data-cmd="exClip">📋 複製</button>
      <button class="btn sm" data-cmd="exXlsx">⬇ xlsx</button>
      <button class="btn sm" data-cmd="exCsv">⬇ csv</button>
      <div class="legend">
        <span><i style="background:#eef2ff"></i>表頭</span>
        <span><i style="background:#fef3c7"></i>異常值／OCR 可信度低</span>
        <span><i style="background:#fee2e2"></i>加總不符</span>
        <span><i style="background:#dcfce7"></i>加總相符</span>
        <span><i style="box-shadow:inset 3px 0 0 #a855f7"></i>手動修改</span>
      </div>
    </div>
    <div id="gridWrap"><div class="empty">尚未選取表格</div></div>
  </section>
</main>

<div id="busy"><div class="box"><div class="msg" id="busyMsg">處理中…</div><div class="bar"><div id="busyBar"></div></div></div></div>
<div id="toasts"></div>

<dialog id="dlgTpl">
  <div class="dlg-h">📐 範本<button class="btn sm x" data-close>✕</button></div>
  <div class="dlg-b" id="tplBody"></div>
  <div class="dlg-f"><button class="btn" data-close>關閉</button></div>
</dialog>

<dialog id="dlgBatch">
  <div class="dlg-h">📚 批次處理（同格式 PDF 合併成一張表）<button class="btn sm x" data-close>✕</button></div>
  <div class="dlg-b">
    <div class="row"><span class="lab">使用範本</span><select id="bTpl" style="flex:1"></select></div>
    <div class="row"><span class="lab">PDF 檔案</span><input type="file" id="bFiles" accept="application/pdf,.pdf" multiple></div>
    <div class="row"><span class="lab">處理頁面</span>
      <label class="chk"><input type="radio" name="bPages" value="first" checked>只處理第 1 頁</label>
      <label class="chk"><input type="radio" name="bPages" value="match">表頭相符的頁</label>
      <label class="chk"><input type="radio" name="bPages" value="all">全部頁</label>
    </div>
    <div class="row"><span class="lab">附加欄位</span><label class="chk"><input type="checkbox" id="bSrc" checked>加入「來源檔案」「頁碼」欄</label></div>
    <div class="log" id="bLog" style="display:none"></div>
    <div id="bResult"></div>
  </div>
  <div class="dlg-f">
    <button class="btn" id="bXlsx" disabled>⬇ xlsx</button>
    <button class="btn" id="bCsv" disabled>⬇ csv</button>
    <button class="btn pri" id="bRun">開始處理</button>
  </div>
</dialog>
<script>
'use strict';
/* ===== CORE START：解析演算法（不依賴畫面） ===== */
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const ov = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
const isCJK = ch => !!ch && /[\u3000-\u303f\u3400-\u9fff\uf900-\ufaff\uff00-\uffef]/.test(ch);
const pad2 = n => String(n).padStart(2, '0');
const round6 = n => Math.round(n * 1e6) / 1e6;
const inBox = (w, b) => { const cx = (w.x0 + w.x1) / 2, cy = (w.y0 + w.y1) / 2; return cx >= b.x0 && cx <= b.x1 && cy >= b.y0 && cy <= b.y1; };
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
function normText(s) { return (s || '').replace(/\s+/g, '').toLowerCase(); }
function sim(a, b) {
  a = normText(a); b = normText(b);
  if (!a || !b) return 0; if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return 0;
  const bg = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };

    try { await DB.put('tables', rec); if (S.project) { S.project.updatedAt = Date.now(); await DB.put('projects', S.project); } } catch (e) { console.error(e); toast('儲存失敗：' + e.message, 'err'); }
  }, 400));
}
async function refreshTable(t, opt = {}) {

function clearEdits(t) { if (Object.keys(t.edits || {}).length) { t.edits = {}; toast('表格結構已變更，先前的手動修改已清除'); } }

}

/* ---------- 開啟／載入專案 ---------- */
async function openPdfFile(file) {
  if (!window.pdfjsLib) return toast('PDF 元件未載入，請確認網路可連到 cdn.jsdelivr.net', 'err', 5000);
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') return toast('請選擇 PDF 檔', 'err');
  progress('載入 PDF…', 0.05);
  let ctx, buf;
  try { buf = await file.arrayBuffer(); ctx = await PdfCtx.open(buf); }
  catch (e) { hideProgress(); return toast(e && e.name === 'PasswordException' ? '此 PDF 有密碼保護，請先解除密碼' : 'PDF 開啟失敗：' + (e.message || e), 'err', 5000); }
  const proj = { id: uid(), name: file.name, fileBlob: new Blob([buf], { type: 'application/pdf' }), pageCount: ctx.n, createdAt: Date.now(), updatedAt: Date.now() };
  await DB.put('projects', proj);
  await loadProject(proj, ctx, []);
  const pages = Array.from({ length: ctx.n }, (_, i) => i + 1);
  await detectPages(pages);
  await recommendTemplates();
}
async function openProjectById(id) {
  const proj = await DB.get('projects', id); if (!proj) return toast('找不到專案', 'err');
  progress('開啟專案…', 0.1);
  try {
    const buf = await proj.fileBlob.arrayBuffer(); const ctx = await PdfCtx.open(buf);
    const tables = await DB.byProject(id); tables.sort((a, b) => a.createdAt - b.createdAt);
    tables.forEach(t => { delete t.cells; delete t.merges; delete t.validation; delete t.columnTypesResolved; delete t.updatedAt; });
    await loadProject(proj, ctx, tables);
  } catch (e) { console.error(e); toast('開啟失敗：' + e.message, 'err'); }
  hideProgress();
}
async function loadProject(proj, ctx, tables) {
  if (S.ctx && S.ctx !== ctx) S.ctx.destroy();
  S.project = proj; S.ctx = ctx; S.tables = tables; S.models = new Map(); S.activeId = tables[0] ? tables[0].id : null; S.page = 1; S.recommend = null;
  await DB.setting('lastProject', proj.id);

  $('#drop').style.display = 'none'; $('#pageBox').style.display = 'block';
  renderBanner();
  buildThumbs(); fitZoom(); await gotoPage(1);
  for (let i = 0; i < tables.length; i++) { progress(`還原表格 ${i + 1}/${tables.length}`, i / tables.length); await refreshTable(tables[i], { save: false }); }
  hideProgress();
  renderTableList(); renderSide(); renderGrid();
}
function closeProject() {
  if (S.ctx) S.ctx.destroy();
  Object.assign(S, { project: null, ctx: null, tables: [], models: new Map(), activeId: null, page: 1, recommend: null });
  $('#projName').textContent = ''; $('#thumbs').innerHTML = ''; $('#pageBox').style.display = 'none'; $('#drop').style.display = 'flex';

/* ---------- 偵測 ---------- */
async function detectPages(pages) {
  const created = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i]; progress(`偵測表格…第 ${p} / ${S.ctx.n} 頁`, i / pages.length);
      const pd = await S.ctx.full(p);
      for (const r of combineRegions(pd)) created.push(newTable([newSegment(pd, p, r)]));
      if (i % 5 === 4) await sleep(0);
    }
  } catch (e) { console.error(e); toast('偵測時發生錯誤：' + e.message, 'err'); }
  // 跨頁接續：上一頁表格到底、下一頁表格在頂端、欄數相同 → 合併
  created.sort((a, b) => a.segments[0].page - b.segments[0].page || a.segments[0].bbox.y0 - b.segments[0].bbox.y0);
  for (let i = 0; i < created.length; i++) {
    const t = created[i]; if (!t) continue;
    while (true) {
      const last = t.segments[t.segments.length - 1]; const pl = S.ctx.cache.get(last.page);
      const j = created.findIndex(u => u && u !== t && u.segments[0].page === last.page + 1);
      if (j < 0) break; const u = created[j], f = u.segments[0], pn = S.ctx.cache.get(f.page);
      const wr = (f.bbox.x1 - f.bbox.x0) / (last.bbox.x1 - last.bbox.x0);
      if (last.bbox.y1 > 0.75 * pl.h && f.bbox.y0 < 0.3 * pn.h && f.colLines.length === last.colLines.length && Math.abs(wr - 1) < 0.1) { t.segments.push(...u.segments); created[j] = null; }
      else break;
    }
  }
  const list = created.filter(Boolean); let n = 0; for (const t of S.tables) { const m = /^表(\d+)$/.exec(t.name); if (m) n = Math.max(n, +m[1]); }
  for (const t of list) { t.name = '表' + (++n); S.tables.push(t); }
  for (let i = 0; i < list.length; i++) { progress(`解析表格 ${i + 1}/${list.length}`, i / Math.max(1, list.length)); await refreshTable(list[i]); }
  hideProgress();
  if (list.length && !S.activeId) S.activeId = list[0].id;
  const scans = pages.filter(p => S.ctx.cache.get(p) && S.ctx.cache.get(p).scan).length;
  toast(`找到 ${list.length} 個表格` + (scans ? `；${scans} 頁看起來是掃描檔或亂碼，需要 OCR` : ''), list.length ? 'ok' : 'info', 4000);
  renderAll();
  return list;
}
async function detectCurrentPage() {
  if (!S.ctx) return;
  const onlyHere = S.tables.filter(t => t.segments.every(s => s.page === S.page));
  if (onlyHere.length && !confirm(`本頁已有 ${onlyHere.length} 個表格，重新偵測會取代它們。繼續？`)) return;
  for (const t of onlyHere) await removeTable(t);
  const list = await detectPages([S.page]); if (list[0]) selectTable(list[0].id, false);
}

/* ---------- 範本 ---------- */
function segFromTemplate(tpl, p, pd) {
  return { page: p, bbox: { ...tpl.seg.bbox }, colLines: [...tpl.seg.colLines], rowLines: [...tpl.seg.rowLines], framed: tpl.seg.framed, source: (tpl.seg.source === 'ocr' || pd.scan) ? 'ocr' : 'text', ocrWords: null };
}
function tableFromTemplate(tpl, segs) { const t = newTable(segs, tpl.name); t.opts = clone(tpl.opts); t.columnTypes = [...(tpl.columnTypes || [])]; t.templateId = tpl.id; return t; }
async function saveTemplate() {
  const t = activeTable(); if (!t) return toast('請先選取一個表格', 'err');
  const m = S.models.get(t.id), seg = t.segments[0], pc = await S.ctx.page(seg.page);
  const name = prompt('範本名稱（例如：月報-授信餘額表）', t.name + ' 範本'); if (!name) return;
  const headerText = m ? m.raw.slice(0, t.opts.headerRows).map(r => r.join('|')).join('||') : '';
  const tpl = { id: uid(), name, pageW: pc.w, pageH: pc.h, headerText, fingerprint: fingerprint(pc.w, pc.h, headerText), seg: { bbox: { ...seg.bbox }, colLines: [...seg.colLines], rowLines: [...seg.rowLines], framed: seg.framed, source: seg.source }, opts: clone(t.opts), columnTypes: [...t.columnTypes], createdAt: Date.now() };
  await DB.put('templates', tpl); S.templates.push(tpl);
  toast(`已儲存範本「${name}」`, 'ok');
}
async function templateScore(tpl, ctx, p) {
  const pd = await ctx.full(p);
  if (Math.abs(pd.w - tpl.pageW) > 2 || Math.abs(pd.h - tpl.pageH) > 2) return 0;
  if (pd.scan) return tpl.seg.source === 'ocr' ? 0.5 : 0;
  const t = tableFromTemplate(tpl, [segFromTemplate(tpl, p, pd)]);
  const m = assembleTable(t, q => ctx.cache.get(q));
  const hdr = m.raw.slice(0, tpl.opts.headerRows).map(r => r.join('|')).join('||');
  if (fingerprint(pd.w, pd.h, hdr) === tpl.fingerprint) return 1;
  return sim(hdr, tpl.headerText);
}
async function recommendTemplates() {
  S.recommend = null; if (!S.ctx || !S.templates.length) return renderBanner();
  let best = null;
  for (const tpl of S.templates) for (let p = 1; p <= Math.min(S.ctx.n, 3); p++) {
    const sc = await templateScore(tpl, S.ctx, p);
    if (sc >= 0.6 && (!best || sc > best.score)) best = { tpl, page: p, score: sc };
  }
  S.recommend = best; renderBanner();
}
function renderBanner() {
  const b = $('#banner'); const r = S.recommend;
  if (!r) { b.classList.remove('show'); b.innerHTML = ''; return; }
  b.innerHTML = `💡 這份 PDF 符合範本「<b>${esc(r.tpl.name)}</b>」（第 ${r.page} 頁，相似度 ${Math.round(r.score * 100)}%）
    <button class="btn sm pri" data-rec="page">套用到第 ${r.page} 頁</button><button class="btn sm" data-rec="all">套用到所有頁（合併成一張表）</button><button class="btn sm" data-rec="x">✕</button>`;
  b.classList.add('show');
}
async function applyTemplate(tpl, mode, page) {
  if (!S.ctx) return toast('請先開啟 PDF', 'err');
  const pages = mode === 'all' ? Array.from({ length: S.ctx.n }, (_, i) => i + 1) : [page || S.page];
  const segs = [];
  for (const p of pages) { const pd = await S.ctx.full(p); if (mode === 'all' && (Math.abs(pd.w - tpl.pageW) > 2 || Math.abs(pd.h - tpl.pageH) > 2)) continue; segs.push(segFromTemplate(tpl, p, pd)); }
  if (!segs.length) return toast('沒有尺寸相符的頁面', 'err');
  const t = tableFromTemplate(tpl, segs); t.name = tpl.name; S.tables.push(t);
  S.activeId = t.id; await refreshTable(t); await gotoPage(segs[0].page);
  toast(`已套用範本「${tpl.name}」`, 'ok');
  if (segs.some(s => s.source === 'ocr') && confirm('此範本的頁面需要 OCR，要立即執行嗎？')) await runOcr(t, t.segments.filter(s => s.source === 'ocr'));
  renderAll();
}
async function openTemplateDialog() {
  const body = $('#tplBody');
  if (!S.templates.length) body.innerHTML = '<div class="empty-side">目前沒有範本。<br>先把一個表格的範圍、欄線、清洗規則調好，再按「範本 ▸ 將目前表格存成範本」。之後同格式的 PDF 就能一鍵套用，也能用在批次處理。</div>';
  else body.innerHTML = `<table class="list"><tr><th>名稱</th><th>頁面尺寸</th><th>來源</th><th>表頭</th><th></th></tr>${S.templates.map(t => `<tr>
    <td><b>${esc(t.name)}</b></td><td class="muted">${Math.round(t.pageW)}×${Math.round(t.pageH)}</td><td>${t.seg.source === 'ocr' ? 'OCR' : 'PDF 文字'}${t.seg.framed ? '・框線' : ''}</td>
    <td class="muted small" style="max-width:220px">${esc((t.headerText || '').slice(0, 60))}</td>
    <td style="white-space:nowrap"><button class="btn sm pri" data-tpl-apply="${t.id}" data-m="page">套用本頁</button> <button class="btn sm" data-tpl-apply="${t.id}" data-m="all">所有頁</button> <button class="btn sm danger" data-tpl-del="${t.id}">刪除</button></td></tr>`).join('')}</table>`;
  $('#dlgTpl').showModal();
}

/* ---------- OCR 執行 ---------- */
async function runOcr(t, segs) {
  try {
    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      await ocrSegment(S.ctx, seg, f => progress(`OCR 辨識中…第 ${seg.page} 頁（${i + 1}/${segs.length}）`, (i + f) / segs.length));
    }
    clearEdits(t); await refreshTable(t);
    toast('OCR 完成，黃色儲存格代表可信度較低，請再確認', 'ok', 4000);
  } catch (e) { console.error(e); toast('OCR 失敗：' + (e.message || e) + '（需可連線下載 OCR 引擎與語言檔）', 'err', 6000); }
  hideProgress();
}

/* ---------- 縮圖 ---------- */
function buildThumbs() {
  const box = $('#thumbs'); box.innerHTML = '';
  if (S.thumbObs) S.thumbObs.disconnect();
  S.thumbObs = new IntersectionObserver(ents => {
    for (const e of ents) if (e.isIntersecting) { const el = e.target; S.thumbObs.unobserve(el); renderThumb(el, +el.dataset.p); }
  }, { root: box, rootMargin: '200px' });
  for (let p = 1; p <= S.ctx.n; p++) {
    const d = document.createElement('div'); d.className = 'thumb'; d.dataset.p = p;
    d.innerHTML = `<div class="ph"></div><div class="pn">${p}</div>`;
    d.onclick = () => gotoPage(p); box.appendChild(d); S.thumbObs.observe(d);
  }
  renderThumbBadges();
}
async function renderThumb(el, p) {
  try {
    const ctx = S.ctx; const c = await ctx.page(p); const sc = 118 / c.w;
    const cv = await ctx.render(p, sc * (window.devicePixelRatio || 1)); if (ctx !== S.ctx) return;
    cv.style.width = '118px'; el.querySelector('.ph') && el.querySelector('.ph').replaceWith(cv);
  } catch (e) { }
}
function renderThumbBadges() {
  $$('#thumbs .thumb').forEach(el => {
    const p = +el.dataset.p; el.classList.toggle('cur', p === S.page);
    el.querySelectorAll('.badge').forEach(b => b.remove());
    const n = S.tables.filter(t => t.segments.some(s => s.page === p)).length;
    if (n) el.insertAdjacentHTML('beforeend', `<span class="badge ok">✓${n > 1 ? n : ''}</span>`);
    const c = S.ctx && S.ctx.cache.get(p); if (c && c.scan) el.insertAdjacentHTML('beforeend', `<span class="badge scan" title="${c.garbled ? '文字亂碼（CID 字型）' : '沒有文字層'}">掃描</span>`);
  });
}

/* ---------- 主頁面 ---------- */
async function fitZoom() {
  if (!S.ctx) return; const c = await S.ctx.page(S.page || 1);
  const w = $('#viewer').clientWidth - 48; S.zoom = Math.max(0.3, Math.min(3, w / c.w));
}
async function gotoPage(p) {
  if (!S.ctx) return; p = Math.max(1, Math.min(S.ctx.n, p)); S.page = p;
  $('#pageVal').textContent = `${p} / ${S.ctx.n}`;
  renderThumbBadges();
  const el = $(`#thumbs .thumb[data-p="${p}"]`); if (el) el.scrollIntoView({ block: 'nearest' });
  await S.ctx.full(p); await renderPage(); renderSide();
}
async function renderPage() {
  if (!S.ctx) return; const c = await S.ctx.page(S.page); const z = S.zoom, dpr = window.devicePixelRatio || 1;
  $('#zoomVal').textContent = Math.round(z * 100) + '%';
  const cv = $('#pageCanvas'); const vp = c.pg.getViewport({ scale: z * dpr });
  if (S.renderTask) { try { S.renderTask.cancel(); } catch (e) { } }
  cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
  const W = c.w * z, H = c.h * z;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  $('#pageBox').style.width = W + 'px'; $('#pageBox').style.height = H + 'px';
  const ovl = $('#overlay'); ovl.style.width = W + 'px'; ovl.style.height = H + 'px';
  renderOverlay();
  const task = c.pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }); S.renderTask = task;
  try { await task.promise; } catch (e) { if (!e || e.name !== 'RenderingCancelledException') console.warn(e); }
}
function renderOverlay() {
  const ovl = $('#overlay'); if (!S.ctx) { ovl.innerHTML = ''; return; }
  ovl.className = 'm-' + S.mode;
  const z = S.zoom, p = S.page, pd = S.ctx.cache.get(p); let html = '';
  const at = activeTable(), aseg = segOn(at, p);
  if (S.showWords && pd) {
    const ws = aseg && aseg.source === 'ocr' ? (aseg.ocrWords || []) : (pd.words || []);

  }

    const L = `left:${b.x0 * z}px;top:${b.y0 * z}px;width:${(b.x1 - b.x0) * z}px;height:${(b.y1 - b.y0) * z}px`;
    html += `<div class="seg-box${act ? '' : ' inactive'}" style="${L}"><span class="lbl">${esc(t.name)}${t.segments.length > 1 ? ` (${si + 1}/${t.segments.length})` : ''}${seg.source === 'ocr' ? ' · OCR' : ''}${seg.framed ? ' · 框線' : ''}</span></div>`;
    seg.colLines.forEach((x, i) => { html += `<div class="vline${ro}" data-t="${t.id}" data-s="${si}" data-i="${i}" style="left:${x * z}px;top:${b.y0 * z}px;height:${(b.y1 - b.y0) * z}px" title="拖曳移動；雙擊或右鍵刪除"></div>`; });
    seg.rowLines.forEach((y, i) => { html += `<div class="hline${ro}" data-t="${t.id}" data-s="${si}" data-i="${i}" style="top:${y * z}px;left:${b.x0 * z}px;width:${(b.x1 - b.x0) * z}px" title="拖曳移動；雙擊或右鍵刪除"></div>`; });
    if (act && !seg.rowLines.length && pd) {
      for (const y of autoRowLines(segWords(seg, pd), b)) html += `<div class="hline auto" style="top:${y * z}px;left:${b.x0 * z}px;width:${(b.x1 - b.x0) * z}px"></div>`;
    }
    if (act) for (const [k, x, y] of [['nw', b.x0, b.y0], ['ne', b.x1, b.y0], ['sw', b.x0, b.y1], ['se', b.x1, b.y1]])

  });

}
function setMode(m) {
  S.mode = m; $$('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#modeHint').textContent = { select: '點表格可選取；拖曳藍線／橘線調整，雙擊或右鍵刪除', box: '在頁面上拖曳，框出表格範圍', col: '在選取的表格內點一下，新增一條欄線', row: '在選取的表格內點一下，新增一條列線' }[m];

function selectTable(id, jump = true) {
  S.activeId = id; const t = activeTable();
  if (jump && t && !segOn(t, S.page)) gotoPage(t.segments[0].page);
  renderTableList(); renderSide(); renderGrid(); renderOverlay();
}

/* ---------- 頁面互動：框選／欄線／列線／調整範圍 ---------- */
function toPt(e) { const r = $('#overlay').getBoundingClientRect(); return { x: (e.clientX - r.left) / S.zoom, y: (e.clientY - r.top) / S.zoom }; }
const insideBox = (pt, b) => pt.x >= b.x0 && pt.x <= b.x1 && pt.y >= b.y0 && pt.y <= b.y1;
function bindOverlay() {
  const ovl = $('#overlay');
  ovl.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !S.ctx) return;
    const pt = toPt(e), el = e.target;
    if ((el.classList.contains('vline') || el.classList.contains('hline')) && el.dataset.t) {
      S.drag = { type: el.classList.contains('vline') ? 'v' : 'h', t: tableById(el.dataset.t), si: +el.dataset.s, i: +el.dataset.i, moved: false };
    } else if (el.classList.contains('handle')) {
      S.drag = { type: 'resize', t: tableById(el.dataset.t), si: +el.dataset.s, h: el.dataset.h, moved: false };
    } else if (S.mode === 'box') {
      S.drag = { type: 'draw', x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
    } else {
      const t = activeTable(), seg = segOn(t, S.page);
      if ((S.mode === 'col' || S.mode === 'row') && seg && insideBox(pt, seg.bbox)) { addLine(t, seg, S.mode, pt); return; }
      const hit = S.tables.filter(x => x.segments.some(s => s.page === S.page && insideBox(pt, s.bbox)));
      if (hit.length) { const cur = hit.findIndex(x => x.id === S.activeId); selectTable(hit[(cur + 1) % hit.length].id, false); }
      return;
    }
    ovl.setPointerCapture(e.pointerId); e.preventDefault();
  });
  ovl.addEventListener('pointermove', e => {
    const d = S.drag; if (!d) return; const pt = toPt(e);
    if (d.type === 'draw') { d.x1 = pt.x; d.y1 = pt.y; renderOverlay(); return; }
    const seg = d.t.segments[d.si]; const b = seg.bbox; d.moved = true;
    if (d.type === 'v') seg.colLines[d.i] = Math.max(b.x0 + 1, Math.min(b.x1 - 1, pt.x));

      if (d.h.includes('n')) b.y0 = Math.min(pt.y, b.y1 - 10); if (d.h.includes('s')) b.y1 = Math.max(pt.y, b.y0 + 10);

    const d = S.drag; if (!d) return; S.drag = null;

      const b = { x0: Math.min(d.x0, d.x1), y0: Math.min(d.y0, d.y1), x1: Math.max(d.x0, d.x1), y1: Math.max(d.y0, d.y1) };

}

function bindSide() {

/* ---------- 匯出 ---------- */
function sheetFromModel(name, m) { return { name, rows: m.cells, merges: m.merges, types: m.types }; }
function sheetToWs(sd) {
  const ws = XLSX.utils.aoa_to_sheet(sd.rows.map(r => r.map(c => c.s)));
  sd.rows.forEach((row, r) => row.forEach((c, ci) => {
    const a = XLSX.utils.encode_cell({ r, c: ci });
    if (c.n != null) { ws[a] = { t: 'n', v: c.n }; if (c.pct) ws[a].z = '0.00%'; else if (Number.isInteger(c.n) && Math.abs(c.n) >= 1000) ws[a].z = '#,##0'; }
    else if (c.d) { const [y, mo, d] = c.d.split('-').map(Number); ws[a] = { t: 'n', v: (Date.UTC(y, mo - 1, d) - Date.UTC(1899, 11, 30)) / 864e5, z: 'yyyy-mm-dd' }; }
  }));
  if (sd.merges && sd.merges.length) ws['!merges'] = sd.merges.map(m => ({ s: { r: m.r, c: m.c }, e: { r: m.r + m.rs - 1, c: m.c + m.cs - 1 } }));
  const nC = Math.max(0, ...sd.rows.map(r => r.length)); const cols = [];
  for (let c = 0; c < nC; c++) { let w = 6; for (const r of sd.rows) { const s = (r[c] && r[c].s) || ''; let l = 0; for (const ch of s) l += isCJK(ch) ? 2 : 1; w = Math.max(w, Math.min(50, l + 2)); } cols.push({ wch: w }); }
  ws['!cols'] = cols; return ws;
}
function writeXlsx(sheets, fname) {
  const wb = XLSX.utils.book_new(); const used = new Set();
  for (const sd of sheets) {
    let n = (sd.name || 'Sheet').replace(/[\\\/\?\*\[\]:]/g, '_').slice(0, 31) || 'Sheet', k = 2;
    while (used.has(n)) n = (sd.name.slice(0, 28) + '_' + k++); used.add(n);
    XLSX.utils.book_append_sheet(wb, sheetToWs(sd), n);
  }
  XLSX.writeFile(wb, fname);
}
function needModel() { const t = activeTable(); const m = t && S.models.get(t.id); if (!m || !m.nR) { toast('請先選取有內容的表格', 'err'); return null; } return { t, m }; }
async function doExport(cmd) {
  if (cmd.endsWith('All')) {
    const list = S.tables.map(t => ({ t, m: S.models.get(t.id) })).filter(x => x.m && x.m.nR);
    if (!list.length) return toast('沒有可匯出的表格', 'err');
    if (cmd === 'exXlsxAll') { if (!window.XLSX) return toast('Excel 元件未載入', 'err'); writeXlsx(list.map(x => sheetFromModel(x.t.name, x.m)), safeFile(baseName()) + '_全部表格.xlsx'); }
    if (cmd === 'exJsonAll') download(safeFile(baseName()) + '_全部表格.json', JSON.stringify(Object.fromEntries(list.map(x => [x.t.name, toJSONRows(x.m)])), null, 2), 'application/json');
    return toast(`已匯出 ${list.length} 個表格`, 'ok');
  }
  const x = needModel(); if (!x) return; const fn = safeFile(baseName() + '_' + x.t.name);
  if (cmd === 'exXlsx') { if (!window.XLSX) return toast('Excel 元件未載入', 'err'); writeXlsx([sheetFromModel(x.t.name, x.m)], fn + '.xlsx'); }
  if (cmd === 'exCsv') download(fn + '.csv', toCSV(x.m.cells), 'text/csv;charset=utf-8');
  if (cmd === 'exJson') download(fn + '.json', JSON.stringify(toJSONRows(x.m), null, 2), 'application/json');
  if (cmd === 'exMd') download(fn + '.md', toMarkdown(x.m), 'text/markdown;charset=utf-8');

    catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已複製，可直接貼到 Excel', 'ok'); }
  }
}

const BATCH = { result: null };
function openBatch() {
  if (!S.templates.length) return toast('批次處理需要範本：請先把一個表格存成範本', 'err', 4000);
  $('#bTpl').innerHTML = S.templates.map(t => `<option value="${t.id}">${esc(t.name)}（${Math.round(t.pageW)}×${Math.round(t.pageH)}${t.seg.source === 'ocr' ? '・OCR' : ''}）</option>`).join('');
  $('#bLog').style.display = 'none'; $('#bLog').textContent = ''; $('#bResult').innerHTML = ''; $('#bXlsx').disabled = $('#bCsv').disabled = true; BATCH.result = null;
  $('#dlgBatch').showModal();
}
async function runBatch() {
  const tpl = S.templates.find(t => t.id === $('#bTpl').value); const files = [...$('#bFiles').files];
  const pageMode = $('input[name=bPages]:checked').value, addSrc = $('#bSrc').checked;
  if (!tpl) return toast('請選擇範本', 'err'); if (!files.length) return toast('請選擇 PDF 檔', 'err');
  const log = $('#bLog'); log.style.display = 'block'; log.textContent = '';
  const say = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  let header = null; const body = []; let mism = 0, okFiles = 0;
  $('#bRun').disabled = true;
  try {
    for (let fi = 0; fi < files.length; fi++) {
      const f = files[fi]; progress(`批次處理 ${fi + 1}/${files.length}：${f.name}`, fi / files.length);
      let ctx;
      try { ctx = await PdfCtx.open(await f.arrayBuffer()); } catch (e) { say(`✘ ${f.name}：無法開啟（${e.message}）`); continue; }
      try {
        const pages = pageMode === 'first' ? [1] : Array.from({ length: ctx.n }, (_, i) => i + 1); const segs = [];
        for (const p of pages) {
          const pd = await ctx.full(p);
          if (Math.abs(pd.w - tpl.pageW) > 2 || Math.abs(pd.h - tpl.pageH) > 2) { if (pageMode !== 'all') say(`  · ${f.name} p${p}：頁面尺寸不同，略過`); continue; }
          if (pageMode === 'match' && await templateScore(tpl, ctx, p) < 0.6) continue;
          const seg = segFromTemplate(tpl, p, pd);
          if (seg.source === 'ocr') await ocrSegment(ctx, seg, fr => progress(`批次 OCR ${fi + 1}/${files.length}：${f.name} p${p}`, (fi + fr) / files.length));
          segs.push(seg);
        }
        if (!segs.length) { say(`– ${f.name}：沒有符合的頁面`); continue; }
        const t = tableFromTemplate(tpl, segs); const m = await computeTable(t, ctx);
        const hr = m.hr; const bad = m.validation.filter(v => !v.ok).length; mism += bad;
        if (!header) header = m.cells.slice(0, hr).map((row, i) => addSrc ? [{ s: i === 0 ? '來源檔案' : '' }, { s: i === 0 ? '頁碼' : '' }, ...row] : row);
        m.cells.slice(hr).forEach((row, i) => body.push(addSrc ? [{ s: f.name }, { s: String(m.rowPage[hr + i] || ''), n: m.rowPage[hr + i] || null }, ...row] : row));
        okFiles++; say(`✔ ${f.name}：${segs.length} 頁、${m.nR - hr} 列` + (bad ? `，⚠ 加總不符 ${bad} 項` : ''));
      } catch (e) { console.error(e); say(`✘ ${f.name}：${e.message}`); }
      finally { ctx.destroy(); }
    }
  } finally { hideProgress(); $('#bRun').disabled = false; }
  const rows = [...(header || []), ...body];
  const nC = Math.max(0, ...rows.map(r => r.length)); rows.forEach(r => { while (r.length < nC) r.push({ s: '' }); });
  BATCH.result = { name: tpl.name, rows, merges: [] };
  say(`\n完成：${okFiles}/${files.length} 個檔案，共 ${body.length} 列資料` + (mism ? `；加總不符 ${mism} 項，請檢查` : ''));
  $('#bResult').innerHTML = rows.length ? `<div class="preview"><table>${rows.slice(0, 30).map(r => '<tr>' + r.map(c => `<td>${esc(c.s)}</td>`).join('') + '</tr>').join('')}</table></div><div class="small muted">預覽前 30 列</div>` : '';
  $('#bXlsx').disabled = $('#bCsv').disabled = !body.length;
}

/* ---------- 專案選單 ---------- */
async function renderProjMenu() {
  const list = (await DB.all('projects')).sort((a, b) => b.updatedAt - a.updatedAt);
  const pop = $('#projPop');
  pop.innerHTML = `<div class="cap">最近的專案（存在本機 IndexedDB）</div>` + (list.length ? list.slice(0, 15).map(p => `<div style="display:flex;align-items:center"><button class="mi" data-open-proj="${p.id}" style="flex:1">${p.id === (S.project && S.project.id) ? '▶ ' : ''}${esc(p.name)} <span class="muted small">· ${p.pageCount} 頁 · ${new Date(p.updatedAt).toLocaleString('zh-TW', { hour12: false })}</span></button><button class="btn sm danger" data-del-proj="${p.id}" title="刪除專案">✕</button></div>`).join('') : '<div class="mi muted">尚無專案</div>') +
    `<div class="sep"></div><button class="mi" data-cmd="closeProj">關閉目前專案</button>`;
}
async function deleteProject(id) {
  const p = await DB.get('projects', id); if (!p || !confirm(`刪除專案「${p.name}」及其所有表格？`)) return;
  for (const t of await DB.byProject(id)) await DB.del('tables', t.id);
  await DB.del('projects', id); if (S.project && S.project.id === id) closeProject();
  toast('已刪除專案', 'ok');
}

/* ---------- 綁定 ---------- */
function renderAll() { renderTableList(); renderSide(); renderGrid(); renderOverlay(); renderThumbBadges(); }
async function handleCmd(cmd) {
  $$('.menu').forEach(m => m.classList.remove('open'));
  if (cmd === 'tplSave') return saveTemplate();
  if (cmd === 'tplManage') return openTemplateDialog();
  if (cmd === 'closeProj') return closeProject();
  if (cmd.startsWith('ex')) return doExport(cmd);
}
function bindUI() {
  $('#btnOpen').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { const f = e.target.files[0]; if (f) openPdfFile(f); e.target.value = ''; };
  document.addEventListener('click', async e => {
    const mb = e.target.closest('[data-menu]');
    if (mb) { const menu = mb.parentElement; const was = menu.classList.contains('open'); $$('.menu').forEach(m => m.classList.remove('open')); if (!was) { if (menu.id === 'mProj') await renderProjMenu(); menu.classList.add('open'); } return; }
    const op = e.target.closest('[data-open-proj]'); if (op) { $$('.menu').forEach(m => m.classList.remove('open')); return openProjectById(op.dataset.openProj); }
    const dp = e.target.closest('[data-del-proj]'); if (dp) { await deleteProject(dp.dataset.delProj); return renderProjMenu(); }
    const c = e.target.closest('[data-cmd]'); if (c) return handleCmd(c.dataset.cmd);
    if (!e.target.closest('.menu')) $$('.menu').forEach(m => m.classList.remove('open'));
    const cl = e.target.closest('[data-close]'); if (cl) cl.closest('dialog').close();
    const ta = e.target.closest('[data-tpl-apply]'); if (ta) { $('#dlgTpl').close(); return applyTemplate(S.templates.find(t => t.id === ta.dataset.tplApply), ta.dataset.m); }
    const td = e.target.closest('[data-tpl-del]'); if (td) { const tp = S.templates.find(t => t.id === td.dataset.tplDel); if (confirm(`刪除範本「${tp.name}」？`)) { await DB.del('templates', tp.id); S.templates = S.templates.filter(t => t !== tp); openTemplateDialog(); } return; }
    const rc = e.target.closest('[data-rec]'); if (rc) { const r = S.recommend; S.recommend = null; renderBanner(); if (rc.dataset.rec !== 'x' && r) applyTemplate(r.tpl, rc.dataset.rec, r.page); }
  });
  $$('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#zIn').onclick = () => { S.zoom = Math.min(4, S.zoom * 1.2); renderPage(); };
  $('#zOut').onclick = () => { S.zoom = Math.max(0.25, S.zoom / 1.2); renderPage(); };
  $('#zFit').onclick = async () => { await fitZoom(); renderPage(); };
  $('#pPrev').onclick = () => gotoPage(S.page - 1);
  $('#pNext').onclick = () => gotoPage(S.page + 1);
  $('#showWords').onchange = e => { S.showWords = e.target.checked; renderOverlay(); };
  $('#btnDetectPage').onclick = () => detectCurrentPage();
  $('#btnDetectAll').onclick = async () => {
    if (!S.ctx) return; if (S.tables.length && !confirm('重新偵測全部頁面會刪除目前所有表格（含手動調整），繼續？')) return;
    for (const t of [...S.tables]) await removeTable(t);
    await detectPages(Array.from({ length: S.ctx.n }, (_, i) => i + 1));
  };
  $('#btnBatch').onclick = openBatch;
  $('#bRun').onclick = runBatch;
  $('#bXlsx').onclick = () => BATCH.result && writeXlsx([BATCH.result], safeFile('批次_' + BATCH.result.name) + '.xlsx');
  $('#bCsv').onclick = () => BATCH.result && download(safeFile('批次_' + BATCH.result.name) + '.csv', toCSV(BATCH.result.rows), 'text/csv;charset=utf-8');
  // 拖放
  const viewer = $('#viewer'), drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  document.addEventListener('drop', e => { const f = [...(e.dataTransfer.files || [])].find(x => /\.pdf$/i.test(x.name) || x.type === 'application/pdf'); if (f) openPdfFile(f); });
  // 鍵盤
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,select,textarea,[contenteditable="true"]') || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    const k = e.key.toLowerCase();
    if (k === 'v') setMode('select'); else if (k === 'b') setMode('box'); else if (k === 'c') setMode('col'); else if (k === 'r') setMode('row');
    else if (k === '+' || k === '=') $('#zIn').click(); else if (k === '-') $('#zOut').click();
    else if (e.key === 'PageDown') { e.preventDefault(); gotoPage(S.page + 1); } else if (e.key === 'PageUp') { e.preventDefault(); gotoPage(S.page - 1); }
    else if (e.key === 'Escape') { S.drag = null; setMode('select'); }
  });
  // 分隔線
  const sp = $('#splitter');
  sp.addEventListener('pointerdown', e => {
    sp.setPointerCapture(e.pointerId);
    const mv = ev => { const h = Math.max(120, Math.min(window.innerHeight - 220, window.innerHeight - ev.clientY)); document.documentElement.style.setProperty('--gridH', h + 'px'); };
    const up = () => { sp.removeEventListener('pointermove', mv); sp.removeEventListener('pointerup', up); DB.setting('gridH', getComputedStyle(document.documentElement).getPropertyValue('--gridH')); };
    sp.addEventListener('pointermove', mv); sp.addEventListener('pointerup', up);
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => S.ctx && renderOverlay(), 200); });
  bindOverlay(); bindSide(); bindGrid();
}

/* ---------- 啟動 ---------- */
(async function init() {
  bindUI(); renderSide();
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.js';
  else $('#libStatus').innerHTML = '<span style="color:var(--red)">⚠ 無法載入 PDF 元件（pdf.js）。請確認可連線到 cdn.jsdelivr.net，或請 IT 開放。</span>';
  if (!window.XLSX) $('#libStatus').insertAdjacentHTML('beforeend', '<br><span style="color:var(--red)">⚠ 無法載入 Excel 匯出元件（SheetJS），xlsx 匯出將無法使用。</span>');
  try {
    await DB.open();
    S.templates = (await DB.all('templates')).sort((a, b) => a.createdAt - b.createdAt);
    const gh = await DB.setting('gridH'); if (gh) document.documentElement.style.setProperty('--gridH', gh);
    const last = await DB.setting('lastProject');
    if (last && window.pdfjsLib && await DB.get('projects', last)) await openProjectById(last);
  } catch (e) { console.error(e); toast('本機資料庫（IndexedDB）無法使用：' + e.message + '。無痕模式可能不支援。', 'err', 6000); }
})();
</script>
