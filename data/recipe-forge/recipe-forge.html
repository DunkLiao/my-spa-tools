<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>資料轉換配方器 RecipeForge</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#fff;--panel2:#f8fafc;--text:#1e293b;--muted:#64748b;--border:#dbe2ec;
  --primary:#2563eb;--primary-d:#1d4ed8;--primary-bg:#e8f0fe;--ok:#16a34a;--ok-bg:#e7f6ec;
  --warn:#b45309;--warn-bg:#fef3c7;--err:#dc2626;--err-bg:#fee2e2;--chg:#fff3bf;--new:#dbeafe;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.06);--radius:10px;
  --font:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#172033;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;
  --primary:#60a5fa;--primary-d:#93c5fd;--primary-bg:#1e3a5f;--ok:#4ade80;--ok-bg:#14391f;
  --warn:#fbbf24;--warn-bg:#3b2f0b;--err:#f87171;--err-bg:#451a1a;--chg:#4a3f0c;--new:#1e3a5f;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
#app{display:flex;flex-direction:column;height:100vh}
header.top{height:54px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:5}
header.top .brand{font-weight:700;font-size:16px;margin-right:14px;text-decoration:none;color:var(--text);white-space:nowrap}
header.top nav{display:flex;gap:2px;flex:1;overflow:auto}
header.top nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);white-space:nowrap}
header.top nav a:hover{background:var(--panel2);color:var(--text)}
header.top nav a.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
main#main{flex:1;min-height:0;overflow:auto}
.page{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}
.btn{border:1px solid var(--border);background:var(--panel);padding:6px 14px;border-radius:8px;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--err)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:5px 9px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,.step:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:13px}
.drop{border:2px dashed var(--border);border-radius:14px;padding:38px 20px;text-align:center;background:var(--panel);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-bg)}
.drop .big{font-size:36px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--panel)}
.item .t{font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--primary-bg);color:var(--primary);margin-right:4px}
table.list{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.list th{background:var(--panel2);font-weight:600;color:var(--muted);font-size:12px}
.ok{color:var(--ok)}.err{color:var(--err)}.warnc{color:var(--warn)}
/* editor */
#editor{display:grid;grid-template-columns:230px 350px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.edbar{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.edbar .name{font-weight:700;font-size:15px;border:1px solid transparent;background:transparent;padding:3px 8px;width:260px}
.edbar .name:hover,.edbar .name:focus{border-color:var(--border);background:var(--panel)}
.dirty{color:var(--warn);font-size:12px}
.pane{overflow:auto;min-height:0}
#lib{background:var(--panel);border-right:1px solid var(--border);padding:10px}
#lib input[type=text]{width:100%;margin-bottom:8px}
#lib details{margin-bottom:4px}
#lib summary{cursor:pointer;font-weight:600;padding:5px 4px;color:var(--muted);user-select:none}
#lib .lbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 10px;border-radius:6px}
#lib .lbtn:hover{background:var(--primary-bg);color:var(--primary)}
#lib .lbtn small{display:block;color:var(--muted);font-size:11px}
#flow{padding:10px;border-right:1px solid var(--border)}
.step{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;margin-bottom:6px;border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:8px;background:var(--panel);cursor:pointer}
.step.sel{outline:2px solid var(--primary);background:var(--primary-bg)}
.step.warn{border-left-color:#f59e0b}.step.error{border-left-color:var(--err)}
.step.disabled{opacity:.55;border-left-color:var(--muted)}.step.skipped{opacity:.5;border-left-color:var(--border)}
.step.dragover{box-shadow:0 -3px 0 var(--primary)}
.step .no{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step .body{flex:1;min-width:0}
.step .ttl{font-weight:600}.step .sm2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .em{font-size:12px;color:var(--err)}
.step .acts{display:flex;gap:1px;flex:none}
.step .acts button{border:0;background:transparent;padding:1px 4px;border-radius:4px;color:var(--muted)}
.step .acts button:hover{background:var(--panel2);color:var(--text)}
.chip{font-size:11px;padding:0 6px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);margin-left:4px;white-space:nowrap}
.srcbox{border:1px dashed var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel);cursor:pointer;font-size:13px}
.srcbox.sel{outline:2px solid var(--primary);background:var(--primary-bg)}
#prev{display:flex;flex-direction:column;min-width:0}
#prev .phead{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:13px}
#prev .pbody{flex:1;overflow:auto;min-height:0}
#warns{max-height:140px;overflow:auto;border-top:1px solid var(--border);background:var(--warn-bg);padding:6px 12px;font-size:12px}
#params{grid-column:2/4;border-top:1px solid var(--border);background:var(--panel);padding:10px 14px;max-height:270px;overflow:auto}
#params .pform{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start}
.fld{display:flex;flex-direction:column;gap:3px;min-width:150px}
.fld.wide{flex-basis:100%}
.fld>label{font-size:12px;color:var(--muted)}
.fld .hint{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-width:760px}
.chips label{display:inline-flex;gap:4px;align-items:center;padding:2px 9px;border:1px solid var(--border);border-radius:99px;cursor:pointer;background:var(--panel2);font-size:13px}
.chips label.on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chips label:focus-within{outline:2px solid var(--primary);outline-offset:1px}
.chips .ord{font-size:10px;background:var(--primary);color:#fff;border-radius:99px;padding:0 5px}
.lrow{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
table.data{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.data th,table.data td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 8px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
table.data th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:left;font-weight:600}
table.data td.rn,table.data th.rn{position:sticky;left:0;background:var(--panel2);color:var(--muted);text-align:right;z-index:1;font-size:11px}
table.data th.rn{z-index:3}
table.data td.chg{background:var(--chg)}table.data td.newc{background:var(--new)}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
.ti{font-size:10px;color:var(--muted);margin-right:4px;font-weight:400}
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:min(900px,94vw);width:520px}
dialog.wide{width:820px}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog .dh{padding:14px 18px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border)}
dialog .db{padding:16px 18px;max-height:68vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#0f172a;color:#fff;padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);max-width:380px;animation:fi .2s}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#busy{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:98}
#busy.on{display:flex}
#busy .box{background:var(--panel);padding:22px 28px;border-radius:14px;min-width:300px;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.stat b{display:block;font-size:20px}
@media (max-width:1000px){
  #editor{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .edbar,#params{grid-column:1}
  #lib,#flow{border-right:0;max-height:300px}
  #prev{min-height:360px}
}
@media print{header.top{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#/">🍳 資料轉換配方器</a>
    <nav id="nav"></nav>
    <span class="badge" title="所有資料只在這個瀏覽器內處理，不會上傳">🔒 完全離線</span>
    <span class="badge warn" id="memBadge" style="display:none" title="瀏覽器不允許 IndexedDB，資料不會被保留">僅記憶體模式</span>
  </header>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<div id="busy"><div class="box"><div id="busyMsg">處理中…</div><div class="bar"><i id="busyBar"></i></div><button class="btn" id="busyCancel" style="display:none">取消</button></div></div>
<input type="file" id="fileInput" style="display:none" accept=".xlsx,.xlsm,.csv,.tsv,.txt,.json">
<input type="file" id="jsonInput" style="display:none" accept=".json">
<script>
'use strict';
/* =====================================================================
 * 資料轉換配方器 RecipeForge —— 單檔離線 SPA
 * Vanilla JS + IndexedDB；無外部依賴、無網路請求、無 API Key
 * ===================================================================== */
const APP_VERSION = '1.1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* 安全地重設容器內容：接受 null / false / 陣列 / 字串 */
function setKids(el, ...kids) {

}
const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmtN = (n) => Number(n).toLocaleString('en-US');
const str = (v) => (v == null ? '' : String(v));
const pad2 = (n) => String(n).padStart(2, '0');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep0 = () => new Promise((r) => setTimeout(r, 0));
const isBlank = (v) => v == null || (typeof v === 'string' && v.trim() === '');

/* ---------- 文字正規化 ---------- */
function toHalf(s) {
  return String(s).replace(/[\uFF01-\uFF5E]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
}

  return String(s).replace(/[!-~]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(/ /g, '\u3000');
}

const TAI_COMMON = ['台北', '台中', '台南', '台東', '台灣', '台大', '台師大', '台科大']; // 不含台電、台積電、台塑等官方名稱本身用「台」的專有名詞
function levenshtein(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;

    const cur = [i];

/* ---------- 日期 ---------- */
function daysInMonth(y, m) { return [31, ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; }

/** mode: auto（3 位數年視為民國）| roc（1~3 位數年皆視為民國）| ad（僅接受 4 位數西元年） */

function serialToParts(n, d1904) {

  return fmt.replace(/YYYY|YY|RRR|R|MM|DD|HH|mm|ss|M|D/g, (t) => {

/** 取得日期 parts；支援字串、Excel 序號（opts.serial） */

  run: (t) => { const keep = t.columns.map((_, i) => i).filter((i) => t.rows.some((r) => !isBlank(r[i]))); return keep.length === t.columns.length ? t : project(t, keep); } });
def({ type: 'transpose', cat: 'structure', label: '轉置（含標題列）', desc: '欄列互換；欄名會變成第一列', defaults: {}, fields: [],
  run: (t) => {
    const all = [t.columns, ...t.rows];

def({ type: 'fillDown', cat: 'structure', label: '向下填滿', desc: '合併儲存格展開後常用', defaults: { columns: [] }, fields: [COLS_ALL()],

def({ type: 'keepColumns', cat: 'column', label: '保留欄位', desc: '只留下需要的欄（依原順序）', defaults: { columns: [] }, fields: [F.cols('columns', '要保留的欄位', { noOrder: true })],
  sum: (p) => (p.columns || []).join('、'),
  run: (t, p, ctx) => { const idx = needCols(t, p.columns, ctx).sort((a, b) => a - b); return project(t, idx); } });
def({ type: 'removeColumns', cat: 'column', label: '刪除欄位', desc: '', defaults: { columns: [] }, fields: [F.cols('columns', '要刪除的欄位', { noOrder: true })],
  sum: (p) => (p.columns || []).join('、'),
  run: (t, p, ctx) => { const drop = new Set(needCols(t, p.columns, ctx)); const keep = t.columns.map((_, i) => i).filter((i) => !drop.has(i)); return project(t, keep); } });
def({ type: 'renameColumns', cat: 'column', label: '重新命名欄位', desc: '', defaults: { pairs: [{ from: '', to: '' }] },
  fields: [F.list('pairs', '欄位改名', [{ k: 'from', type: 'column', label: '原欄名' }, { k: 'to', type: 'text', label: '新欄名' }], { blank: { from: '', to: '' } })],
  sum: (p) => (p.pairs || []).filter((x) => x.from).map((x) => `${x.from}→${x.to}`).join('、'),
  run: (t, p, ctx) => {
    const cols = t.columns.slice();
    for (const { from, to } of (p.pairs || [])) { if (!from) continue; const i = need(t, from, ctx); if (!trimAll(str(to))) throw new StepError(`「${from}」的新欄名不可空白`); cols[i] = uniqueName(cols, trimAll(to), i); }
    return { columns: cols, rows: t.rows };

def({ type: 'reorderColumns', cat: 'column', label: '調整欄位順序', desc: '依點選順序排在最前面，其餘維持原序', defaults: { columns: [] }, fields: [F.cols('columns', '依序點選要排前面的欄位')],
  sum: (p) => (p.columns || []).join('→'),
  run: (t, p, ctx) => { const first = needCols(t, p.columns, ctx); const rest = t.columns.map((_, i) => i).filter((i) => !first.includes(i)); return project(t, [...first, ...rest]); } });
def({ type: 'splitColumn', cat: 'column', label: '拆分欄位', desc: '依分隔符拆成多欄', defaults: { column: '', delimiter: ',', custom: '', maxParts: 0, keepOriginal: false },
  fields: [F.col('column', '欄位'), F.sel('delimiter', '分隔符', [[',', '逗號 ,'], [';', '分號 ;'], ['|', '直線 |'], [' ', '空白'], ['\t', 'Tab'], ['-', '連字號 -'], ['/', '斜線 /'], ['custom', '自訂…']], { rerender: true }),
    F.text('custom', '自訂分隔符', { visibleIf: (p) => p.delimiter === 'custom' }), F.num('maxParts', '最多幾欄（0 = 自動）', { min: 0 }), F.chk('keepOriginal', '保留原欄位')],
  sum: (p) => p.column,
  run: (t, p, ctx) => {
    const i = need(t, p.column, ctx); const d = p.delimiter === 'custom' ? p.custom : p.delimiter;
    if (d === '' || d == null) throw new StepError('請輸入分隔符');
    const parts = t.rows.map((r) => str(r[i]).split(d)); let n = 1; for (const x of parts) if (x.length > n) n = x.length; // 不可用 Math.max(...) 展開：十萬列以上會爆堆疊
    if (+p.maxParts > 0) n = Math.min(n, +p.maxParts);
    const base = t.columns[i]; let cols = t.columns.slice(); const at = i + 1;
    const newNames = []; for (let k = 0; k < n; k++) newNames.push(uniqueName([...cols, ...newNames], `${base}_${k + 1}`));
    const rows = t.rows.map((r, k) => {
      let pp = parts[k]; if (n < pp.length) pp = [...pp.slice(0, n - 1), pp.slice(n - 1).join(d)];
      const x = r.slice(); x.splice(at, 0, ...Array.from({ length: n }, (_, j) => pp[j] == null ? '' : trimAll(pp[j]))); return x;
    });
    cols.splice(at, 0, ...newNames);
    let out = { columns: cols, rows };
    if (!p.keepOriginal) { const keep = cols.map((_, j) => j).filter((j) => j !== i); out = project(out, keep); }
    return out;
  } });
def({ type: 'mergeColumns', cat: 'column', label: '合併欄位', desc: '多欄串成一欄', defaults: { columns: [], separator: ' ', newName: '合併欄位', keepOriginal: false, skipEmpty: true },
  fields: [F.cols('columns', '要合併的欄位（依點選順序）'), F.text('separator', '分隔字串'), F.text('newName', '新欄名'), F.chk('skipEmpty', '略過空白值'), F.chk('keepOriginal', '保留原欄位')],
  sum: (p) => `${(p.columns || []).join('＋')} → ${p.newName}`,
  run: (t, p, ctx) => {
    const idx = needCols(t, p.columns, ctx); if (!p.newName) throw new StepError('請輸入新欄名');
    const sep = p.separator == null ? '' : p.separator;
    const vals = t.rows.map((r) => idx.map((i) => str(r[i])).filter((s) => !(p.skipEmpty && trimAll(s) === '')).join(sep));
    const at = Math.min(...idx);
    let out = insertCol(t, at, p.newName, vals);
    if (!p.keepOriginal) { const drop = new Set(idx.map((i) => (i >= at ? i + 1 : i))); out = project(out, out.columns.map((_, j) => j).filter((j) => !drop.has(j))); }
    return out;
  } });
def({ type: 'duplicateColumn', cat: 'column', label: '複製欄位', desc: '', defaults: { column: '', newName: '' }, fields: [F.col('column', '欄位'), F.text('newName', '新欄名（可留白自動命名）')],
  sum: (p) => p.column, run: (t, p, ctx) => { const i = need(t, p.column, ctx); return insertCol(t, i + 1, p.newName || `${t.columns[i]}_複本`, t.rows.map((r) => r[i])); } });
def({ type: 'addConstant', cat: 'column', label: '新增固定值欄位', desc: '例如「資料來源 = 教育部」', defaults: { name: '新欄位', value: '' }, fields: [F.text('name', '欄名'), F.text('value', '固定值')],
  sum: (p) => `${p.name} = ${p.value}`, run: (t, p) => { if (!p.name) throw new StepError('請輸入欄名'); return insertCol(t, t.columns.length, p.name, t.rows.map(() => p.value)); } });
def({ type: 'addIndex', cat: 'column', label: '新增序號欄', desc: '', defaults: { name: '序號', start: 1, step: 1 }, fields: [F.text('name', '欄名'), F.num('start', '起始值'), F.num('step', '間隔')],
  run: (t, p) => { if (!p.name) throw new StepError('請輸入欄名'); const s = +p.start || 0, d = +p.step || 1; return insertCol(t, 0, p.name, t.rows.map((_, k) => s + k * d)); } });

def({ type: 'trim', cat: 'text', label: '去除前後空白', desc: '含全形空白、不換行空白、零寬字元', defaults: { columns: ['*'] }, fields: [COLS_ALL()],
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), strMap(trimAll)) });
def({ type: 'collapseSpaces', cat: 'text', label: '合併多重空白', desc: '連續空白縮成一個', defaults: { columns: ['*'] }, fields: [COLS_ALL()],
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), strMap((s) => s.replace(/[ \t\u3000\u00a0]{2,}/g, ' '))) });
def({ type: 'toHalfWidth', cat: 'text', label: '全形轉半形', desc: 'ＡＢＣ１２３ → ABC123', defaults: { columns: ['*'] }, fields: [COLS_ALL()],
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), strMap(toHalf)) });
def({ type: 'toFullWidth', cat: 'text', label: '半形轉全形', desc: '', defaults: { columns: [] }, fields: [COLS_ALL()],
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), strMap(toFull)) });
def({ type: 'changeCase', cat: 'text', label: '英文大小寫', desc: '', defaults: { columns: [], mode: 'upper' },
  fields: [COLS_ALL(), F.sel('mode', '模式', [['upper', '全大寫'], ['lower', '全小寫'], ['title', '每字首大寫']])], sum: (p) => p.mode,
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), strMap((s) => p.mode === 'upper' ? s.toUpperCase() : p.mode === 'lower' ? s.toLowerCase() : s.toLowerCase().replace(/(^|[\s\-_/])([a-z])/g, (m, a, b) => a + b.toUpperCase()))) });
def({ type: 'replaceText', cat: 'text', label: '取代文字', desc: '支援整格比對與 Regex', defaults: { columns: [], find: '', replace: '', matchCase: false, wholeCell: false, useRegex: false },
  fields: [COLS_ALL(), F.text('find', '尋找'), F.text('replace', '取代為'), F.chk('matchCase', '區分大小寫'), F.chk('wholeCell', '整格相符'), F.chk('useRegex', '使用 Regex')],
  sum: (p) => `「${p.find}」→「${p.replace}」`,
  run: (t, p, ctx) => {
    const idx = needCols(t, p.columns, ctx); const find = str(p.find), rep = str(p.replace);
    if (find === '') throw new StepError('請輸入要尋找的文字');
    const flags = 'g' + (p.matchCase ? '' : 'i'); let re;
    try { re = new RegExp(p.useRegex ? (p.wholeCell ? `^(?:${find})$` : find) : find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags); } catch (e) { throw new StepError('Regex 格式錯誤：' + e.message); }
    return mapCells(t, idx, strMap((s) => {
      if (p.wholeCell && !p.useRegex) return (p.matchCase ? s === find : s.toLowerCase() === find.toLowerCase()) ? rep : s;
      return s.replace(re, p.useRegex ? rep : () => rep);
    }));
  } });
def({ type: 'removeChars', cat: 'text', label: '移除字元', desc: '移除數字、英文、符號、換行或自訂字元', defaults: { columns: [], preset: 'custom', chars: '' },
  fields: [COLS_ALL(), F.sel('preset', '移除類型', [['custom', '自訂字元'], ['digits', '所有數字'], ['letters', '所有英文字母'], ['symbols', '標點符號'], ['newline', '換行與 Tab'], ['spaces', '所有空白']], { rerender: true }),
    F.text('chars', '要移除的字元', { visibleIf: (p) => p.preset === 'custom' })],
  run: (t, p, ctx) => {
    const idx = needCols(t, p.columns, ctx); let re;
    if (p.preset === 'custom') { if (!p.chars) throw new StepError('請輸入要移除的字元'); re = new RegExp('[' + p.chars.replace(/[\]\\^-]/g, '\\$&') + ']', 'g'); }
    else re = { digits: /\d/g, letters: /[A-Za-z]/g, symbols: /[!-\/:-@\[-`{-~！-／：-＠［-｀｛-～，。、；：？！「」『』（）《》〈〉【】…—～·]/g, newline: /[\r\n\t]+/g, spaces: /[\s\u3000]/g }[p.preset];
    return mapCells(t, idx, strMap((s) => s.replace(re, '')));
  } });
def({ type: 'padText', cat: 'text', label: '補滿字元（如統編補 0）', desc: '統一編號補滿 8 碼、郵遞區號補 0', defaults: { column: '', length: 8, char: '0', side: 'left' },
  fields: [F.col('column', '欄位'), F.num('length', '總長度', { min: 1 }), F.text('char', '補的字元'), F.sel('side', '補在', [['left', '前面'], ['right', '後面']])],
  sum: (p) => `${p.column} → ${p.length} 碼`,
  run: (t, p, ctx) => { const i = need(t, p.column, ctx); const c = str(p.char)[0] || '0'; const L = Math.max(1, +p.length || 1);
    return mapCells(t, [i], (v) => { if (isBlank(v)) return v; const s = trimAll(str(v)); const r = p.side === 'right' ? s.padEnd(L, c) : s.padStart(L, c); return r === v ? v : r; }); } });
def({ type: 'extractText', cat: 'text', label: '擷取文字', desc: '左 / 右 / 中間 / Regex / 某字串之前或之後', defaults: { column: '', mode: 'left', n: 3, start: 1, text: '', pattern: '', group: 0, newName: '' },
  fields: [F.col('column', '欄位'), F.sel('mode', '方式', [['left', '左邊 N 字'], ['right', '右邊 N 字'], ['mid', '從第 N 字取 M 字'], ['before', '某字串之前'], ['after', '某字串之後'], ['regex', 'Regex 擷取']], { rerender: true }),
    F.num('n', '字數 N', { min: 0, visibleIf: (p) => ['left', 'right', 'mid'].includes(p.mode) }), F.num('start', '起始位置（1 起算）', { min: 1, visibleIf: (p) => p.mode === 'mid' }),
    F.text('text', '字串', { visibleIf: (p) => ['before', 'after'].includes(p.mode) }), F.text('pattern', 'Regex', { visibleIf: (p) => p.mode === 'regex' }), F.num('group', '群組編號（0 = 全部）', { min: 0, visibleIf: (p) => p.mode === 'regex' }),
    F.text('newName', '新欄名（留白 = 覆蓋原欄）')],
  sum: (p) => `${p.column}（${p.mode}）`,
  run: (t, p, ctx, W) => {
    const i = need(t, p.column, ctx); let re = null;
    if (p.mode === 'regex') { try { re = new RegExp(p.pattern); } catch (e) { throw new StepError('Regex 格式錯誤：' + e.message); } }
    const f = (v) => { const s = str(v); switch (p.mode) {
      case 'left': return s.slice(0, +p.n || 0); case 'right': return (+p.n || 0) > 0 ? s.slice(-(+p.n)) : '';
      case 'mid': return s.substr(Math.max(0, (+p.start || 1) - 1), +p.n || 0);
      case 'before': { const k = s.indexOf(p.text); return k < 0 ? '' : s.slice(0, k); }
      case 'after': { const k = s.indexOf(p.text); return k < 0 ? '' : s.slice(k + p.text.length); }
      case 'regex': { const m = re.exec(s); return m ? (m[+p.group || 0] == null ? '' : m[+p.group || 0]) : ''; } } return ''; };
    if (p.newName) return insertCol(t, i + 1, p.newName, t.rows.map((r) => f(r[i])));
    return mapCells(t, [i], (v) => { const o = f(v); return o === v ? v : o; });
  } });
def({ type: 'prefixSuffix', cat: 'text', label: '加前綴 / 後綴', desc: '', defaults: { columns: [], prefix: '', suffix: '', skipEmpty: true }, fields: [COLS_ALL(), F.text('prefix', '前綴'), F.text('suffix', '後綴'), F.chk('skipEmpty', '空白不加')],
  run: (t, p, ctx) => mapCells(t, needCols(t, p.columns, ctx), (v) => (p.skipEmpty && isBlank(v)) ? v : `${p.prefix || ''}${str(v)}${p.suffix || ''}`) });

const DATE_FORMATS = [['YYYY/MM/DD', '2024/05/01'], ['YYYY-MM-DD', '2024-05-01'], ['YYYYMMDD', '20240501'], ['YYYY/M/D', '2024/5/1'], ['YYYY年M月D日', '2024年5月1日'], ['YYYY/MM/DD HH:mm:ss', '2024/05/01 08:30:00'], ['RRR/MM/DD', '民國 113/05/01'], ['RRRMMDD', '民國 1130501'], ['民國R年M月D日', '民國113年5月1日']];
function dateStep(type, label, desc, mode, o = {}) {
  def({ type, cat: o.cat || 'date', label, desc, defaults: { column: '', outputFormat: o.fmt || 'YYYY/MM/DD', serial: !!o.serial, ...(o.defaults || {}) },
    fields: [F.col('column', '日期欄位'), F.sel('outputFormat', '輸出格式', DATE_FORMATS), ...(o.noSerialOpt ? [] : [F.chk('serial', '數字視為 Excel 序號')])], sum: (p) => `${p.column} → ${p.outputFormat}`,
    run: (t, p, ctx, W) => { const i = need(t, p.column, ctx);
      return mapCells(t, [i], (v, r) => { if (isBlank(v)) return v; const parts = anyToParts(v, mode, p.serial); if (!parts) { W.add(r, t.columns[i], v, '無法解析為日期'); return v; } return fmtDate(parts, p.outputFormat); }); } });
}

def({ type: 'parseNumber', cat: 'date', label: '文字轉數字', desc: '去千分位、貨幣符號、括號負數、%', defaults: { columns: [], keepLeadingZero: true },
  fields: [COLS_ALL(), F.chk('keepLeadingZero', '保留開頭為 0 的文字（統編、電話、郵遞區號不被轉成數字）')],
  run: (t, p, ctx, W) => mapCells(t, needCols(t, p.columns, ctx), (v, r, i) => {
    if (typeof v === 'number' || isBlank(v)) return v;
    if (p.keepLeadingZero !== false && /^0\d+$/.test(trimAll(str(v)))) return v;
    const n = toNum(v); if (Number.isNaN(n)) { W.add(r, t.columns[i], v, '無法轉成數字'); return v; } return n; }) });
def({ type: 'roundNumber', cat: 'date', label: '四捨五入 / 進位 / 捨去', desc: '半值遠離 0（與 Excel 一致）', defaults: { columns: [], digits: 0, mode: 'round' }, fields: [COLS_ALL(), F.num('digits', '小數位數'), F.sel('mode', '方式', [['round', '四捨五入'], ['ceil', '無條件進位'], ['floor', '無條件捨去']])],
  run: (t, p, ctx, W) => mapCells(t, needCols(t, p.columns, ctx), (v, r, i) => { if (isBlank(v)) return v; const n = toNum(v); if (Number.isNaN(n)) { W.add(r, t.columns[i], v, '不是數字'); return v; } return roundTo(n, +p.digits || 0, p.mode); }) });
def({ type: 'formatNumber', cat: 'date', label: '數字格式（千分位）', desc: '輸出為文字', defaults: { columns: [], thousands: true, decimals: 0 }, fields: [COLS_ALL(), F.chk('thousands', '千分位'), F.num('decimals', '固定小數位數', { min: 0 })],
  run: (t, p, ctx, W) => mapCells(t, needCols(t, p.columns, ctx), (v, r, i) => { if (isBlank(v)) return v; const n = toNum(v); if (Number.isNaN(n)) { W.add(r, t.columns[i], v, '不是數字'); return v; }
    return n.toLocaleString('en-US', { useGrouping: !!p.thousands, minimumFractionDigits: +p.decimals || 0, maximumFractionDigits: +p.decimals || 0 }); }) });

        h('button', { class: 'btn sm danger', onclick: async () => { const used = S.recipes.filter((r) => r.steps.some((s) => s.type === 'mapValues' && s.params.dictId === d.id)); if (await confirmBox(used.length ? `「${d.name}」被 ${used.length} 份配方使用，刪除後那些步驟會出錯。確定刪除？` : `確定刪除字典「${d.name}」？`, '刪除', true)) { await DB.del('dictionaries', d.id); S.dicts = S.dicts.filter((x) => x.id !== d.id); draw(); } } }, '刪除'))))))
    : h('div', { class: 'card empty' }, '還沒有字典。字典用來統一名稱，例如「台大 → 國立臺灣大學」。'));

/* ---------- 執行紀錄 ---------- */
async function viewHistory() {
  const runs = (await DB.all('runs')).sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1));

    h('p', { class: 'sub' }, '只保存統計與當時的配方快照，不保存任何資料內容。'),
    h('div', { class: 'statgrid' }, h('div', { class: 'stat' }, h('span', { class: 'small muted' }, '總執行次數'), h('b', null, fmtN(runs.length))), h('div', { class: 'stat' }, h('span', { class: 'small muted' }, '成功'), h('b', { class: 'ok' }, fmtN(ok.length))), h('div', { class: 'stat' }, h('span', { class: 'small muted' }, '累計輸出列數'), h('b', null, fmtN(totalRows)))),
    runs.length ? h('table', { class: 'list' }, h('thead', null, h('tr', null, ['時間', '配方', '來源檔', '列數', '耗時', '狀態'].map((x) => h('th', null, x)))),
      h('tbody', null, runs.map((r) => h('tr', { style: { cursor: 'pointer' }, onclick: () => modal({ title: `${r.recipeName}　${fmtTime(r.startedAt)}`, wide: true, body: runDetail(r) }) },
        h('td', null, fmtTime(r.startedAt)), h('td', null, r.recipeName), h('td', null, r.sourceFileName), h('td', null, r.status === 'success' ? `${fmtN(r.rowsIn)} → ${fmtN(r.rowsOut)}` : '—'), h('td', null, (r.durationMs / 1000).toFixed(2) + ' 秒'), h('td', { class: r.status === 'success' ? 'ok' : 'err' }, r.status === 'success' ? '✓ 成功' : '✖ ' + (r.error || '失敗'))))))

function runDetail(r) {
  return h('div', null, h('div', { class: 'kv small', style: { marginBottom: '10px' } }, h('b', null, '來源檔'), r.sourceFileName, h('b', null, '輸出檔'), r.outputFileName || '—', h('b', null, '狀態'), r.status === 'success' ? '成功' : r.error),
    r.stepStats && r.stepStats.length ? h('table', { class: 'list' }, h('thead', null, h('tr', null, ['#', '步驟', '列數', '警告'].map((x) => h('th', null, x)))), h('tbody', null, r.stepStats.map((s, i) => h('tr', null, h('td', null, i + 1), h('td', null, stepLabel(s.type), s.skipped ? ' （略過）' : ''), h('td', null, `${fmtN(s.rowsBefore)} → ${fmtN(s.rowsAfter)}`), h('td', null, s.warnings || '—'))))) : null);
}

/* ---------- 設定 ---------- */
async function viewSettings() {
  const row = (label, ctl, hint) => h('div', { style: { margin: '12px 0' } }, h('div', { style: { fontWeight: 600 } }, label), ctl, hint ? h('div', { class: 'small muted' }, hint) : null);
  const chk = (key, label) => h('label', { style: { display: 'flex', gap: '8px', alignItems: 'center' } }, h('input', { type: 'checkbox', checked: !!S.settings[key], onchange: (e) => saveSetting(key, e.target.checked) }), label);
  setKids($('#main'), page(h('h1', null, '設定'), h('p', { class: 'sub' }, `版本 ${APP_VERSION}　·　儲存位置：${DB.mem ? '僅記憶體（關閉頁面即消失）' : '瀏覽器 IndexedDB（本機）'}`),
    h('p', { class: 'small muted', style: { marginTop: '-10px' } }, '資料綁定「這個瀏覽器 + 這個檔案位置」。搬移 HTML 檔、換瀏覽器或清除網站資料後看不到配方是正常的，請定期使用下方「備份全部」。'),

      row('來源檔', chk('keepSourceBlob', '儲存配方時，同時在本機保留最近一次的來源檔（可於編輯器一鍵重新載入）')),

      h('button', { class: 'btn', onclick: () => importJsonFile(async () => { viewSettings(); }) }, '⬆ 還原 / 匯入'), h('span', { class: 'muted small' }, '備份含配方、字典、設定與執行紀錄。')),

/* ---------- 路由 ---------- */
let lastHash = '#/'; let suppressRoute = false;
async function routeImpl() {
  if (suppressRoute) { suppressRoute = false; return; }
  const hash = location.hash || '#/'; const m = /^#\/([^/]*)\/?(.*)$/.exec(hash) || [];
  const r = m[1] || '', arg = m[2] || '';
  if (S.route === 'editor' && E && E.dirty && !(r === 'editor' && E.recipe.id === arg)) {
    if (!(await confirmBox('目前的配方還有未儲存的變更，離開後將會遺失。確定離開？', '離開不儲存', true))) { suppressRoute = true; location.hash = lastHash; return; }
    E.dirty = false;
  }
  if (r === 'editor' && E && arg && E.recipe.id === arg && S.route === 'editor') { lastHash = hash; return; }
  lastHash = hash; S.route = r || 'home';
  $$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (r === 'editor' || r === 'run' ? 'recipes' : r)));
  if (r !== 'editor') E = null;
  switch (r) {
    case '': return viewHome();
    case 'editor': return viewEditor(arg || null);
    case 'run': return viewRun(arg);
    case 'recipes': return viewRecipes();
    case 'dictionaries': return viewDictionaries();
    case 'history': return viewHistory();
    case 'settings': return viewSettings();
    default: location.hash = '#/';
  }
}
function route() { return routeImpl().catch((err) => { console.error(err); toast('頁面載入失敗：' + (err && err.message ? err.message : err), 'err'); }); }
/* ---------- 全域錯誤保險：任何未預期的錯誤都以提示呈現，而不是靜默失敗 ---------- */
let lastErrAt = 0;
const reportErr = (msg) => { const n = Date.now(); if (n - lastErrAt < 1500) return; lastErrAt = n; toast('發生未預期的錯誤：' + msg, 'err'); };
window.addEventListener('unhandledrejection', (e) => reportErr((e.reason && e.reason.message) || String(e.reason)));
window.addEventListener('error', (e) => reportErr(e.message));
/* ---------- 全域拖放 ---------- */
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', async (e) => {
  e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  if ($('dialog[open]')) return;
  if (S.route === 'editor' && E) await loadEditorFile(f); else if (S.route === 'run' && R) await runFile(f); else await ingestFile(f);
});

/* ---------- 啟動 ---------- */
async function boot() {
  $('#nav').append(...NAV.map(([k, l]) => h('a', { href: '#/' + k, 'data-r': k }, l)));
  await DB.open(); if (DB.mem) $('#memBadge').style.display = '';
  try {
    S.recipes = (await DB.all('recipes')).map(migrateRecipe); S.dicts = await DB.all('dictionaries');
    for (const s of await DB.all('settings')) if (s.key in DEFAULT_SETTINGS) S.settings[s.key] = s.value;
  } catch (e) { toast('讀取本機資料失敗：' + e.message, 'err'); }
  applyTheme(); if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  window.addEventListener('hashchange', route); await route();
}
boot();
