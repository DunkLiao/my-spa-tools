function lcsDiff(a, b) {
  const n = a.length, m = b.length; const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push('- ' + a[i++]); else out.push('+ ' + b[j++]); }
  while (i < n) out.push('- ' + a[i++]); while (j < m) out.push('+ ' + b[j++]); return out;
}
function showProfileDiff(v) {

  const f = o => JSON.stringify(o, null, 1).split('\n'); const d = lcsDiff(f(ver.snapshot), f(snap(P)));
  $('#pfDiff').innerHTML = `<h3>v${v} → 目前（v${P.version}）</h3><pre class="diff">${d.length ? d.map(l => `<div class="${l[0] === '+' ? 'add' : 'del'}">${esc(l)}</div>`).join('') : '沒有差異'}</pre>`;
}

    if (ev.bfind.length) h += `<h2>批次層級發現</h2><table><tr><th>規則</th><th>嚴重度</th><th>說明</th></tr>${ev.bfind.map(x => `<tr><td>${x.code}</td><td>${bd(x.sev)}</td><td>${esc(x.msg)}</td></tr>`).join('')}</table>`;
    h += `<h2>檔案</h2><table><tr><th>判定</th><th>檔名</th><th>大小</th><th>編碼</th><th>換行</th><th>分隔</th><th>欄數</th><th>筆數</th><th>F/W/I</th><th>SHA-256</th></tr>${S.files.map(f => { const d = f.det || {}, c = fileCounts(f); return `<tr><td>${bd(fileVerdict(f))}</td><td>${esc(f.path)}</td><td class="n">${fmtB(f.size)}</td><td>${esc(d.usedEncoding || '')}</td><td>${esc(d.eol || '')}</td><td>${d.delimiter === undefined ? '' : esc(dlmName(d.delimiter))}</td><td class="n">${d.columnCount || ''}</td><td class="n">${f.rows === undefined ? '' : fmtN(f.rows)}</td><td>${c.FAIL}/${c.WARN}/${c.INFO}</td><td class="m">${esc(f.sha256 || '')}</td></tr>`; }).join('')}</table>`;
    const bad = S.files.filter(f => ['FAIL', 'WARN'].includes(fileVerdict(f)));
    if (bad.length) { h += `<h2>問題明細（每檔最多列 100 筆）</h2>`; bad.forEach(f => { const rows = fnd.filter(x => x.fileId === f.id && !x.waived && x.effSev !== 'INFO'); h += `<h3>${esc(f.name)} ${bd(fileVerdict(f))}</h3><table><tr><th>嚴重度</th><th>規則</th><th>列</th><th>欄位</th><th>說明</th></tr>${rows.slice(0, 100).map(x => `<tr><td>${bd(x.effSev)}</td><td>${x.ruleCode}</td><td class="n">${x.line || ''}</td><td>${esc(x.col)}</td><td>${esc(x.msg)}${x.snip ? `<div class="m">${esc(x.snip)}</div>` : ''}</td></tr>`).join('')}</table>${rows.length > 100 ? `<p>…另有 ${rows.length - 100} 筆未列出</p>` : ''}`; }); }
    const dr = S.drift ? S.drift.rows.filter(r => r.cur && r.prev) : [];
    if (dr.length) { h += `<h2>漂移比較</h2>`; dr.forEach(({ f, cur, prev }) => { const it = driftCmp(cur, prev, S.settings.rowTolPct).filter(x => x.lv !== 'ok'); h += `<h3>${esc(f.name)}　${esc(prev.period)} → ${esc(cur.period)}</h3>` + (it.length ? `<table><tr><th>項目</th><th>上期</th><th>本期</th><th>說明</th></tr>${it.map(x => `<tr><td>${x.lv === 'bad' ? '🔴' : '🟡'} ${esc(x.k)}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table>` : '<p>🟢 與上期格式一致</p>'); }); }
    h += `</body></html>`; download(`${fnameBase()}_report_${ts}.html`, h, 'text/html;charset=utf-8');
  }
}

/* ---------- Backup ---------- */
function vBackup() {
  const brows = S.batches.map(b => `<tr><td>${esc(b.name)}</td><td>${esc(b.period || '')}</td><td>${fmtT(b.createdAt)}</td><td><a data-act="purge" data-id="${esc(b.id)}">清除明細</a> · <a data-act="delBatch" data-id="${esc(b.id)}">刪除批次</a></td></tr>`).join('');
  return `<h2>備份還原</h2><div class="grid2"><div class="card"><h3>匯出全庫</h3><p class="sm">包含規格範本、批次範本、批次、檔案結果、指紋、豁免與設定。</p><label><input type="checkbox" id="bkFind"> 一併匯出問題明細（檔案可能很大）</label><div class="row"><button class="btn pri" data-act="bkExport">匯出 JSON</button></div></div>
  <div class="card"><h3>匯入還原</h3><p class="sm">匯入會<b>取代</b>目前資料庫的所有內容。</p><div class="row"><button class="btn" data-act="bkImport">選擇備份檔…</button><button class="btn danger" data-act="bkClear">清空資料庫</button></div></div></div>
  <h3>批次管理 <small>可依期別清除舊的問題明細，但保留指紋讓漂移比較能長期追溯</small></h3><table class="t"><tr><th>批次</th><th>期別</th><th>建立時間</th><th></th></tr>${brows || '<tr><td colspan="4" class="mut">沒有批次</td></tr>'}</table>`;
}
const STORES = ['profiles', 'batchTemplates', 'batches', 'files', 'findings', 'fingerprints', 'waivers', 'settings'];
async function backupExport() {
  const inc = $('#bkFind') && $('#bkFind').checked; const o = { tool: 'File Intake Inspector', version: APP_VER, exportedAt: new Date().toISOString(), stores: {} };
  for (const s of STORES) { if (s === 'findings' && !inc) { o.stores[s] = []; continue; } o.stores[s] = await dbAll(s); }
  download(`fii_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(o), 'application/json'); toast('已匯出備份', 'ok');
}
async function backupImport(file) {
  let o; try { o = JSON.parse(await file.text()); } catch (e) { toast('不是有效的 JSON', 'err'); return; }
  if (!o || !o.stores || o.tool !== 'File Intake Inspector') { toast('不是本工具的備份檔', 'err'); return; }
  if (!confirm('匯入會取代目前所有資料，確定？')) return;
  for (const s of STORES) { await dbClear(s); await dbPutMany(s, o.stores[s] || []); }
  await loadAll(); toast('已還原', 'ok');
}
async function loadAll() {
  S.profiles = (await dbAll('profiles')).sort((a, b) => a.name.localeCompare(b.name, 'zh-TW')); S.templates = await dbAll('batchTemplates'); S.waivers = await dbAll('waivers');
  const st = await dbAll('settings'); const sm = {}; st.forEach(x => sm[x.key] = x.value);
  if (sm.config) Object.assign(S.settings, sm.config); S.settings.rules = S.settings.rules || {};
  S.batches = (await dbAll('batches')).sort((a, b) => b.createdAt - a.createdAt); S.editProfile = null; S.editTemplate = null; S.live.clear();
  await selectBatch(S.batches.find(b => b.id === sm.lastBatch) ? sm.lastBatch : (S.batches[0] ? S.batches[0].id : null));
}
const saveSettings = () => dbPut('settings', { key: 'config', value: S.settings });

/* ---------- Event handlers ---------- */
const ACT = {
  nav: d => goto(d.v), pickFiles: () => $('#fileInput').click(), pickDir: () => pickDirectory(),
  newBatch: async () => { const name = prompt('批次名稱：', ''); if (name === null) return; const period = prompt('期別（例 202610，可留空）：', '') || ''; const b = { id: uid(), name: name.trim() || (period ? period + ' 進件批次' : '批次 ' + fmtT(Date.now())), period: period.trim(), templateId: S.templates[0] ? S.templates[0].id : '', createdAt: Date.now() }; S.batches.unshift(b); await dbPut('batches', b); await selectBatch(b.id); },
  editBatch: async () => { const b = S.batch; if (!b) return; const n = prompt('批次名稱：', b.name); if (n === null) return; const p = prompt('期別（YYYYMM 或 YYYYMMDD）：', b.period || ''); if (p === null) return; b.name = n.trim() || b.name; b.period = p.trim(); await dbPut('batches', b); toast('已更新；期別變更請按「全部重跑」以重算指紋'); render(); },
  delBatch: d => deleteBatch(d.id), purge: d => purgeFindings(d.id),
  openFile: d => openFile(d.id, +d.line || 1), jump: d => { S.pvState.line = +d.line; const el = $('#pvLine'); if (el) el.value = d.line; loadPreview(); $('#pvbody').scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  rerun: d => { const f = S.files.find(x => x.id === d.id); if (!f) return; if (!S.handles.has(f.id)) { toast('原始檔已不在記憶體，請重新匯入該檔案', 'warn'); return; } f.status = 'queued'; f.progress = 0; S.detail = null; enqueue(f.id); render(); },
  rerunAll: () => { let n = 0; for (const f of S.files) { if (!S.handles.has(f.id)) continue; const m = matchProfile(f.name); f.profileId = m.profile ? m.profile.id : ''; f.pkey = pkeyOf(f.name, m.profile); f.period = m.period || periodFromName(f.name) || (S.batch && S.batch.period) || ''; f.status = 'queued'; f.progress = 0; Pool.queue.push(f.id); n++; } S.findingsLoaded = false; S.detail = null; S.drift = null; toast(n ? `重新對應規格並重跑 ${n} 個檔案` : '沒有可重跑的檔案（原始檔需在本次工作階段內匯入）', n ? '' : 'warn'); pump(); render(); },
  cancel: d => cancelFile(d.id), fv: d => { S.fv = d.v; renderMain(); },
  learn: d => { const f = S.files.find(x => x.id === d.id); if (!f || f.status !== 'done') return; S.editProfile = learnProfile(f); S.view = 'profiles'; render(); toast('已用此檔案產生規格草稿，請微調後儲存', 'ok'); },
  waive: d => { const f = S.files.find(x => x.id === S.detailId); if (f) addWaiver(f, d.code); }, waiveF: d => { const f = S.files.find(x => x.id === d.fid); if (f) addWaiver(f, d.code); },
  unwaive: async d => { await dbDel('waivers', d.id); S.waivers = S.waivers.filter(w => w.id !== d.id); render(); },
  pvGo: () => { S.pvState.line = Math.max(1, +$('#pvLine').value || 1); loadPreview(); }, pvPrev: () => { S.pvState.line = Math.max(1, S.pvState.line - 100); $('#pvLine').value = S.pvState.line; loadPreview(); }, pvNext: () => { S.pvState.line += 100; $('#pvLine').value = S.pvState.line; loadPreview(); },
  flPrev: () => { S.fl.page = Math.max(0, S.fl.page - 1); renderMain(); }, flNext: () => { S.fl.page++; renderMain(); },
  pfNew: () => { S.editProfile = blankProfile(); render(); }, pfExample: () => { S.editProfile = exampleProfile(); render(); },
  pfSel: d => { S.editProfile = JSON.parse(JSON.stringify(S.profiles.find(p => p.id === d.id))); render(); }, pfSave: () => saveProfile(),
  pfDup: async () => { const p = JSON.parse(JSON.stringify(S.profiles.find(x => x.id === S.editProfile.id))); p.id = uid(); p.name += '（複本）'; p.version = 1; p.versions = []; await dbPut('profiles', p); S.profiles.push(p); S.editProfile = p; render(); },
  pfDel: async () => { const p = S.editProfile; if (!confirm(`刪除規格「${p.name}」？（已檢查的檔案結果不受影響）`)) return; await dbDel('profiles', p.id); S.profiles = S.profiles.filter(x => x.id !== p.id); for (const t of S.templates) { t.items = t.items.filter(i => i.profileId !== p.id); await dbPut('batchTemplates', t); } S.editProfile = null; render(); },
  pfExport: () => { const p = S.profiles.find(x => x.id === S.editProfile.id); download(`profile_${p.name.replace(/[\\/:*?"<>|\s]+/g, '_')}.json`, JSON.stringify(snap(p), null, 2), 'application/json'); },
  pfImport: () => { S.importKind = 'profile'; $('#jsonInput').click(); }, pfDiff: d => showProfileDiff(d.v),
  tplNew: async () => { const n = prompt('批次範本名稱：', '月結進件'); if (!n) return; const t = { id: uid(), name: n.trim(), items: [] }; await dbPut('batchTemplates', t); S.templates.push(t); S.editTemplate = t.id; render(); },
  tplRename: async () => { const t = S.templates.find(x => x.id === S.editTemplate); const n = prompt('新名稱：', t.name); if (!n) return; t.name = n.trim(); await dbPut('batchTemplates', t); render(); },
  tplDel: async () => { const t = S.templates.find(x => x.id === S.editTemplate); if (!confirm(`刪除批次範本「${t.name}」？`)) return; await dbDel('batchTemplates', t.id); S.templates = S.templates.filter(x => x.id !== t.id); for (const b of S.batches) if (b.templateId === t.id) { b.templateId = ''; await dbPut('batches', b); } S.editTemplate = null; render(); },
  rpHtml: () => exportReport('html'), rpMd: () => exportReport('md'), rpCsv: () => exportReport('csv'), rpJson: () => exportReport('json'), rpManifest: () => exportReport('manifest'),
  bkExport: () => backupExport(), bkImport: () => { S.importKind = 'backup'; $('#jsonInput').click(); },
  bkClear: async () => { if (!confirm('清空整個資料庫（所有規格、批次、指紋、豁免）？此動作無法復原。')) return; for (const s of STORES) await dbClear(s); S.handles.clear(); Pool.queue.length = 0; await loadAll(); toast('已清空'); }
};
const CHG = {
  batch: async el => { await selectBatch(el.value); },
  batchTpl: async el => { S.batch.templateId = el.value; await dbPut('batches', S.batch); render(); },
  filesFilter: el => { S.filesFilter = el.value; renderMain(); }, flSev: el => { S.fl.sev = el.value; S.fl.page = 0; renderMain(); }, flRule: el => { S.fl.rule = el.value; S.fl.page = 0; renderMain(); }, flFile: el => { S.fl.file = el.value; S.fl.page = 0; renderMain(); }, flQ: el => { S.fl.q = el.value; S.fl.page = 0; renderMain(); },
  pvEnc: el => { S.pvState.enc = el.value; loadPreview(); }, pvInvis: el => { S.pvState.invis = el.checked; loadPreview(); },
  driftBase: async el => { S.driftBase = el.value; S.drift = null; render(); await buildDrift(); render(); },
  tplSel: el => { S.editTemplate = el.value || null; render(); },
  tplInc: async el => { const t = S.templates.find(x => x.id === S.editTemplate); const pid = el.dataset.pid; if (el.checked) { if (!t.items.some(i => i.profileId === pid)) t.items.push({ profileId: pid, required: true }); } else t.items = t.items.filter(i => i.profileId !== pid); await dbPut('batchTemplates', t); render(); },
  tplReq: async el => { const t = S.templates.find(x => x.id === S.editTemplate); const it = t.items.find(i => i.profileId === el.dataset.pid); if (it) it.required = el.checked; await dbPut('batchTemplates', t); },
  ruleSev: async el => { if (el.value) S.settings.rules[el.dataset.code] = el.value; else delete S.settings.rules[el.dataset.code]; await saveSettings(); toast('已更新（即時生效）'); },
  setWorkers: async el => { S.settings.workers = Math.max(0, Math.min(16, +el.value || 0)); await saveSettings(); }, setChunk: async el => { S.settings.chunkMB = Math.max(1, Math.min(64, +el.value || 4)); await saveSettings(); },
  setTol: async el => { S.settings.rowTolPct = Math.max(1, +el.value || 30); await saveSettings(); }, setHash: async el => { S.settings.hash = el.checked; await saveSettings(); }
};
function bindEvents() {
  document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(t.dataset, e)).catch(err => { console.error(err); toast('操作失敗：' + err.message, 'err'); }); } });
  document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (!t) return; const fn = CHG[t.dataset.chg]; if (fn) Promise.resolve(fn(t)).catch(err => { console.error(err); toast('操作失敗：' + err.message, 'err'); }); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pvLine') ACT.pvGo(); });
  ['dragenter', 'dragover'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
  document.addEventListener('dragleave', e => { const d = $('#drop'); if (d && !e.relatedTarget) d.classList.remove('over'); });
  document.addEventListener('drop', e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); handleDrop(e); });
  $('#fileInput').addEventListener('change', e => { importFiles(Array.from(e.target.files).map(f => ({ file: f, path: f.name }))); e.target.value = ''; });
  $('#dirInput').addEventListener('change', e => { importFiles(Array.from(e.target.files).map(f => ({ file: f, path: f.webkitRelativePath || f.name }))); e.target.value = ''; });
  $('#jsonInput').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (S.importKind === 'backup') return backupImport(f);
    try { const p = JSON.parse(await f.text()); p.id = uid(); p.version = 1; p.versions = []; p.isNew = true; S.editProfile = p; S.view = 'profiles'; render(); toast('已載入規格，請確認後儲存'); } catch (err) { toast('規格 JSON 無效', 'err'); }
  });
  window.addEventListener('beforeunload', e => { if (Pool.running || Pool.queue.length) { e.preventDefault(); e.returnValue = ''; } });
}

/* ---------- Init ---------- */
async function init() {
  try {
    if (!window.indexedDB) throw new Error('此瀏覽器不支援 IndexedDB');
    await openDB(); poolInit(); bindEvents(); await loadAll(); render();
  } catch (e) { document.body.innerHTML = `<div style="padding:30px;font:15px sans-serif"><h2>無法啟動</h2><p>${esc(e.message)}</p><p>請使用 Chrome / Edge 開啟。若在無痕視窗，IndexedDB 可能被停用。</p></div>`; console.error(e); }
}
document.addEventListener('DOMContentLoaded', init);

</script>
