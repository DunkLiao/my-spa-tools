<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Outlier Hunter｜異常值獵人</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--line:#d9dde3;--text:#1f2933;--dim:#6b7785;--accent:#2563eb;--accent2:#dbe7ff;
  --sev3:#d13438;--sev2:#f7630c;--sev1:#c19c00;--ok:#107c10;--shadow:0 4px 18px rgba(0,0,0,.12);
  --sev3bg:rgba(209,52,56,.16);--sev2bg:rgba(247,99,12,.16);--sev1bg:rgba(193,156,0,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12151a;--panel:#1b1f26;--panel2:#242a33;--line:#343b46;--text:#e6e9ee;--dim:#98a2b0;--accent:#6ea0ff;--accent2:#1f2f52;
  --sev3:#ff6b6e;--sev2:#ff9a52;--sev1:#e3c13a;--ok:#5fd35f;--shadow:0 4px 18px rgba(0,0,0,.5);
  --sev3bg:rgba(255,107,110,.18);--sev2bg:rgba(255,154,82,.18);--sev1bg:rgba(227,193,58,.18);}}
:root[data-theme=dark]{
  --bg:#12151a;--panel:#1b1f26;--panel2:#242a33;--line:#343b46;--text:#e6e9ee;--dim:#98a2b0;--accent:#6ea0ff;--accent2:#1f2f52;
  --sev3:#ff6b6e;--sev2:#ff9a52;--sev1:#e3c13a;--ok:#5fd35f;--shadow:0 4px 18px rgba(0,0,0,.5);
  --sev3bg:rgba(255,107,110,.18);--sev2bg:rgba(255,154,82,.18);--sev1bg:rgba(227,193,58,.18);}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px}
button:hover{background:var(--panel2)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.1)}
button.danger{color:var(--sev3);border-color:var(--sev3)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:48px 1fr;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
#top .sp{flex:1}
#side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
#side h3{margin:10px 0 2px;font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel2)}
.item.on{background:var(--accent2);border-color:var(--accent)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--dim)}
.item button{padding:0 6px;border:none;background:transparent;color:var(--dim)}
.item button:hover{color:var(--sev3)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 12px}
#tabs button.on{border-bottom-color:var(--accent);font-weight:600}
#view{flex:1;overflow:auto;padding:14px;min-height:0}
#view.noscroll{overflow:hidden;display:flex;flex-direction:column}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h4{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--dim);font-size:12px}
.dim{color:var(--dim)}.small{font-size:12px}
.sev3{color:var(--sev3)}.sev2{color:var(--sev2)}.sev1{color:var(--sev1)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}
.tag.s3{background:var(--sev3bg);border-color:var(--sev3);color:var(--sev3)}
.tag.s2{background:var(--sev2bg);border-color:var(--sev2);color:var(--sev2)}
.tag.s1{background:var(--sev1bg);border-color:var(--sev1);color:var(--sev1)}
.tag.err{background:var(--sev3bg);color:var(--sev3);border-color:var(--sev3)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2);position:sticky;top:0;font-weight:600;white-space:nowrap}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;cursor:pointer;background:var(--panel);user-select:none;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rule{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;margin-bottom:10px;background:var(--panel)}
.rule.off{opacity:.55}
.rule .hd{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
.rule .hd .ti{flex:1;font-weight:600}
.rule .bd{padding:4px 12px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fld label{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.fld.wide{grid-column:1/-1}
.fld input[type=text],.fld input[type=number],.fld select{width:100%}
.addbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
/* table */
.tbwrap{display:grid;grid-template-columns:1fr 380px;gap:12px;flex:1;min-height:0}
.tbleft{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.vt{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);position:relative;min-height:200px}
.vt .head{position:sticky;top:0;z-index:3;display:flex;background:var(--panel2);border-bottom:1px solid var(--line)}
.vt .spacer{position:relative}
.vt .r{position:absolute;left:0;display:flex;height:30px;border-bottom:1px solid var(--line);cursor:pointer}
.vt .r:hover{background:var(--panel2)}
.vt .r.cur{background:var(--accent2)}
.vt .c{flex:none;padding:5px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.vt .head .c{font-weight:600;cursor:default}
.vt .c.num{text-align:right;font-variant-numeric:tabular-nums}
.vt .c.hl3{background:var(--sev3bg);color:var(--sev3);font-weight:600}
.vt .c.hl2{background:var(--sev2bg);color:var(--sev2);font-weight:600}
.vt .c.hl1{background:var(--sev1bg);color:var(--sev1)}
.why{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;min-height:0}
.why h4{margin:0 0 6px}
.hit{border-left:4px solid var(--line);padding:4px 8px;margin:6px 0;background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px;word-break:break-word}
.hit.s3{border-color:var(--sev3)}.hit.s2{border-color:var(--sev2)}.hit.s1{border-color:var(--sev1)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:8px 0}
.kv .k{color:var(--dim)}.kv .hlv{color:var(--sev3);font-weight:600}
.stbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stbtns button.on{outline:2px solid var(--accent)}
/* modal */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:20px}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);max-width:min(1000px,96vw);width:100%;max-height:92vh;display:flex;flex-direction:column}
.modal.sm{max-width:480px}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal .body{padding:14px 16px;overflow:auto}
.modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--dim)}
.drop.over{border-color:var(--accent);background:var(--accent2)}
.bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .15s}
.hbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.hbar .lb{width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
.hbar .tr{flex:1;height:14px;background:var(--panel2);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent)}
.hbar.bad .tr i{background:var(--sev2)}
.heat td{text-align:center;min-width:54px;font-size:12px;border:1px solid var(--bg)}
.heat td.fl{outline:2px solid var(--sev3);outline-offset:-2px}
.heat th.rh{text-align:left;position:sticky;left:0;z-index:2}
canvas{width:100%;display:block}
pre.code{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:420px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:420px}
#toast div.err{background:var(--sev3);color:#fff}
.empty{text-align:center;color:var(--dim);padding:60px 20px}
.empty h2{color:var(--text)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--panel2)}
@media (max-width:1000px){#app{grid-template-columns:1fr}#side{display:none}.tbwrap{grid-template-columns:1fr}}

.fillbox{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
.toolbar select{max-width:230px}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>🎯 Outlier Hunter</h1>
    <span id="dsname" class="dim small"></span>
    <span class="sp"></span>
    <button id="btn-import" class="pri">＋ 匯入資料</button>
    <button id="btn-theme" title="切換外觀" aria-label="切換外觀">🌗</button>
    <button id="btn-set" title="設定" aria-label="設定">⚙</button>
    <button id="btn-help" title="說明" aria-label="說明">❓</button>
  </header>
  <aside id="side" aria-label="資料集與 Hunt"></aside>
  <main id="main">
    <nav id="tabs" role="tablist"></nav>
    <section id="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<script id="worker-src" type="text/worker">
'use strict';
/* =====================================================================
   Outlier Hunter — Engine (runs inside a Web Worker)
   parser / type inference / dataset store / detectors / scorer
   ===================================================================== */
const CHUNK = 10000, SAMPLE = 10000, PREVIEW_BYTES = 1 << 20, MAXHIT = 300000, MAXRES = 300000;
const MISS = new Set(['', 'NULL', 'null', 'Null', 'N/A', 'n/a', '#N/A', 'NaN', 'nan']);
function isMiss(s) {
  if (s === undefined || s === null) return true;
  const n = s.length; if (n === 0) return true;
  if (n > 4 && s.charCodeAt(0) > 32 && s.charCodeAt(n - 1) > 32) return false;   // longer than any token and not padded
  return MISS.has(s) || MISS.has(s.trim());
}
const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
const isNumT = t => t === 'number' || t === 'integer';
const tick = () => new Promise(r => setTimeout(r, 0));
let ds = null, abortFlag = false, lastRun = null;

function post(m, tr) { self.postMessage(m, tr || []); }
function checkAbort() { if (abortFlag) { abortFlag = false; throw new Error('已取消'); } }

/* ---------- number / date helpers ---------- */
const POW10 = [1, 1e1, 1e2, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9, 1e10, 1e11, 1e12, 1e13, 1e14, 1e15];
function fastNum(v) {                          // plain [+-]digits[.digits]; exact (<=15 digits) => identical to parseFloat
  const n = v.length; let i = 0, c = v.charCodeAt(0), neg = false;
  if (c === 45) { neg = true; i = 1; } else if (c === 43) i = 1;
  let x = 0, digits = 0, frac = 0, dot = false;
  for (; i < n; i++) {
    c = v.charCodeAt(i);
    if (c >= 48 && c <= 57) { x = x * 10 + (c - 48); digits++; if (dot) frac++; }
    else if (c === 46 && !dot) dot = true;
    else return undefined;
  }
  if (digits === 0 || digits > 15) return undefined;
  if (frac) x /= POW10[frac];
  return neg ? -x : x;
}
// returns number (valid) | NaN (missing) | null (unparsable)
function parseNumStr(v, paren) {
  if (v.length > 0 && v.length < 24) { const f = fastNum(v); if (f !== undefined) return f; }
  const s0 = v.trim();
  if (s0 === '' || MISS.has(s0)) return NaN;
  let s = s0, neg = false;
  if (paren && s.charCodeAt(0) === 40 && s.charCodeAt(s.length - 1) === 41) { neg = true; s = s.slice(1, -1).trim(); }
  if (s.indexOf(',') >= 0) s = s.replace(/,/g, '');
  if (NUM_RE.test(s)) { const x = +s; if (!isFinite(x)) return null; return neg ? -x : x; }
  return null;
}
const DATE_RE = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T]\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?)?$/;
function isDateStr(s) {
  let m = DATE_RE.exec(s), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if (/^\d{8}$/.test(s)) { y = +s.slice(0, 4); mo = +s.slice(4, 6); d = +s.slice(6, 8); }
  else return false;
  return y >= 1900 && y <= 2200 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31;
}
const BOOL_SET = new Set(['true', 'false', 'yes', 'no', 'y', 'n', 't', 'f']);

/* ---------- encoding / delimiter ---------- */
function trimTail(u8) {
  const n = u8.length;
  for (let k = 1; k <= 3 && k <= n; k++) {
    const b = u8[n - k];
    if ((b & 0xC0) === 0x80) continue;
    const need = b >= 0xF0 ? 4 : b >= 0xE0 ? 3 : b >= 0xC0 ? 2 : 1;
    if (need > k) return u8.subarray(0, n - k);
    break;
  }
  return u8;
}
function detectEncoding(u8) {
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return 'utf-8';
  if (u8[0] === 0xFF && u8[1] === 0xFE) return 'utf-16le';
  if (u8[0] === 0xFE && u8[1] === 0xFF) return 'utf-16be';
  const probe = u8.subarray(0, Math.min(u8.length, 2000));
  let zeros = 0, zEven = 0;
  for (let i = 0; i < probe.length; i++) if (probe[i] === 0) { zeros++; if (i % 2 === 0) zEven++; }
  if (probe.length > 20 && zeros / probe.length > 0.3) return zEven > zeros / 2 ? 'utf-16be' : 'utf-16le';
  try { new TextDecoder('utf-8', { fatal: true }).decode(trimTail(u8)); return 'utf-8'; } catch (e) { /* not utf-8 */ }
  return 'big5';
}
async function utf8Valid(file) {                 // validates the WHOLE file, not only the first block
  const dec = new TextDecoder('utf-8', { fatal: true }), B = 8 * 1048576;
  try {
    for (let pos = 0; pos < file.size; pos += B) dec.decode(new Uint8Array(await file.slice(pos, pos + B).arrayBuffer()), { stream: pos + B < file.size });
    dec.decode(); return true;
  } catch (e) { return false; }
}
async function detectFileEnc(file, head) {
  let enc = detectEncoding(head);
  const bom = head[0] === 0xEF && head[1] === 0xBB && head[2] === 0xBF;
  if (enc === 'utf-8' && !bom && file.size > head.length && !(await utf8Valid(file))) enc = 'big5';
  return enc;
}
function detectDelim(text) {
  const cands = [',', '\t', ';', '|'];
  const per = []; let counts = {}; cands.forEach(c => counts[c] = 0);
  let inQ = false;
  for (let i = 0; i < text.length && per.length < 30; i++) {
    const ch = text[i];
    if (ch === '"') inQ = !inQ;
    else if (!inQ) {
      if (ch === '\n') { per.push(counts); counts = {}; cands.forEach(c => counts[c] = 0); }
      else if (counts[ch] !== undefined) counts[ch]++;
    }
  }
  if (!per.length) per.push(counts);
  let best = ',', bs = 0;
  for (const c of cands) {
    const freq = new Map();
    for (const p of per) freq.set(p[c], (freq.get(p[c]) || 0) + 1);
    let mode = 0, mf = 0;
    for (const [v, f] of freq) if (v > 0 && f > mf) { mode = v; mf = f; }
    if (!mode) continue;
    const sc = (mf / per.length) * (1 + Math.log(mode));
    if (sc > bs) { bs = sc; best = c; }
  }
  return best;
}

/* ---------- streaming CSV parser (quotes, embedded newlines, "" escapes) ---------- */
class CsvParser {
  constructor(delim, onRow) {
    this.d = delim.charCodeAt(0); this.onRow = onRow;
    this.st = 0; this.buf = ''; this.row = []; this.fs = true; this.skipLF = false; this.stop = false;
  }
  _endField() { this.row.push(this.buf); this.buf = ''; this.fs = true; this.st = 0; }
  _endRow() {
    this._endField();
    const r = this.row; this.row = [];
    if (r.length === 1 && r[0] === '') return;          // blank line
    this.onRow(r);
  }
  feed(s) {
    const d = this.d, n = s.length; let i = 0;
    while (i < n) {
      if (this.stop) return;
      let st = this.st;
      if (st === 1) {                                     // inside quotes
        const q = s.indexOf('"', i);
        if (q < 0) { this.buf += s.slice(i); return; }
        this.buf += s.slice(i, q); i = q + 1; this.st = 2; continue;
      }
      if (st === 2) {                                     // quote seen inside quoted field
        if (s.charCodeAt(i) === 34) { this.buf += '"'; i++; this.st = 1; continue; }
        this.st = 3; continue;
      }
      const c = s.charCodeAt(i);
      if (this.skipLF) { this.skipLF = false; if (c === 10) { i++; continue; } }
      if (st === 0 && this.fs && c === 34) { this.st = 1; this.fs = false; i++; continue; }
      let j = i;
      while (j < n) { const cc = s.charCodeAt(j); if (cc === d || cc === 10 || cc === 13) break; j++; }
      if (j > i) { this.buf += s.slice(i, j); this.fs = false; }
      i = j;
      if (j < n) {
        const cc = s.charCodeAt(j); i = j + 1;
        if (cc === d) this._endField();
        else { if (cc === 13) { if (s.charCodeAt(i) === 10) i++; else if (i >= n) this.skipLF = true; } this._endRow(); }
      }
    }
  }
  finish() {
    if (this.stop) return;
    if (this.buf !== '' || this.row.length > 0 || this.st !== 0) this._endRow();
  }
}

/* ---------- type inference ---------- */
const AMT_NAME_RE = /(AMT|AMOUNT|BAL|BALANCE|PRINCIPAL|EXPOSURE|VALUE|COST|PRICE|FEE|金額|餘額|本金|曝險|價值)/i;
const ID_NAME_RE = /(^|_)(ID|NO|CODE|SEQ|NUM)$|統編|統一編號|代號|編號|帳號|身分證/i;
function inferTypes(rows, ncols, headers, overrides, paren) {
  const types = [];
  for (let c = 0; c < ncols; c++) {
    if (overrides && overrides[c] && overrides[c] !== 'auto') { types.push(overrides[c]); continue; }
    let nn = 0, numOK = 0, intOK = 0, dateOK = 0, boolOK = 0, lead0 = 0;
    const lens = new Set(), dist = new Set();
    for (let r = 0; r < rows.length; r++) {

function jsonToCsvBlob(text) {
  let data = JSON.parse(text);
  if (!Array.isArray(data)) { const k = Object.keys(data).find(x => Array.isArray(data[x])); if (!k) throw new Error('JSON 需為物件陣列（Array of Objects）'); data = data[k]; }

  for (const o of data) if (o && typeof o === 'object') for (const k of Object.keys(o)) if (!seen.has(k)) { seen.add(k); keys.push(k); }
  if (!keys.length) throw new Error('JSON 內沒有可用的欄位');

  const lines = [keys.map(q).join(',')];
  for (const o of data) lines.push(keys.map(k => q(o ? o[k] : '')).join(','));
  return new Blob([lines.join('\r\n')], { type: 'text/csv' });
}

  } finally {

async function restoreBackup(file) {

    const ok = new Set((await dbAll('datasets')).map(d => d.datasetId));
    for (const d of j.datasets) {
      if (d.csv) {
        b.update('匯入資料集：' + d.meta.name);
        await dbDelByIdx('chunks', 'datasetId', d.meta.datasetId).catch(() => { });
        const m = await importFile(new Blob([d.csv], { type: 'text/csv' }), { enc: 'utf-8', delim: ',', header: true, parenNeg: false, types: d.meta.opts && d.meta.opts.types || [], name: d.meta.name }, d.meta.datasetId);
        await dbPut('datasets', Object.assign(m, { name: d.meta.name, fileName: d.meta.fileName, createdAt: d.meta.createdAt })); ok.add(d.meta.datasetId);

  } catch (e) { b.close(); toast('還原失敗：' + e.message, 'err'); }
}

      el('label', null, el('input', { type: 'checkbox', checked: E.ssSeq, onchange: e => { E.ssSeq = e.target.checked; gen(); } }), ' 加入批次條件 t.SS_SEQ = :SS_SEQ'),

  v.append(el('div', { class: 'card' }, el('h4', null, 'Hunt 設定'), el('div', { class: 'row' }, el('button', { onclick: () => download('hunt_' + S.hunt.name.replace(/[^\w\u4e00-\u9fff-]+/g, '_') + '.json', JSON.stringify(huntToJson(S.hunt), null, 2), 'application/json') }, '⤓ 匯出目前 Hunt（JSON）'), el('button', { onclick: () => hin.click() }, '⤒ 匯入 Hunt JSON'), hin)));
