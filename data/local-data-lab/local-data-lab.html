<style>

</style>

<body>
<header>
  <span class="logo">🧪 Local Data Lab</span>
  <span class="muted" style="color:#94a3b8">專案</span>
  <select id="projSel" title="目前專案"></select>

<script>
'use strict';
/* =====================================================================
   Local Data Lab  v1.1   Vanilla JS 單檔 SPA ／ IndexedDB ／ 完全離線
   ===================================================================== */

/* ------------------------------ Util ------------------------------ */
const Util = {
  VERSION: '1.1',
  collator: new Intl.Collator('zh-Hant'),
  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  now: () => new Date().toISOString(),
  pad: (n, l = 2) => String(n).padStart(l, '0'),
  fmtDT(s) { const d = new Date(s), p = Util.pad; return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  toHalf: s => s.replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' '),
  toFull: s => s.replace(/[!-~]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(/ /g, '\u3000'),
  trim: s => s.replace(/^[\s\u3000]+|[\s\u3000]+$/g, ''),
  esc: s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),
  num(v) {
    if (v == null) return NaN;
    let s = Util.toHalf(String(v)).trim(), neg = false;
    if (!s) return NaN;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[,\s]/g, '');
    if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return NaN;
    const n = Number(s); return neg ? -n : n;
  },
  parseDate(v) {
    if (v == null) return null;
    let s = Util.toHalf(String(v)).trim().replace(/^民國/, 'R').replace(/\s+/g, ' ');
    s = s.replace(/\s*\d{1,2}:\d{2}(:\d{2})?.*$/, '').trim();
    let m, y, mo, d;
    if ((m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^R?(\d{2,3})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/))) { y = +m[1] + 1911; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^(\d{3})(\d{2})(\d{2})$/))) { y = +m[1] + 1911; mo = +m[2]; d = +m[3]; }
    else return null;
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return { y, m: mo, d, t: dt.getTime() };
  },
  fmtDate(o, f) {
    const p = Util.pad;
    return f.replace(/yyyy/g, o.y).replace(/yyy/g, p(o.y - 1911, 3)).replace(/MM/g, p(o.m)).replace(/dd/g, p(o.d))
      .replace(/(?<![a-zA-Z])M(?![a-zA-Z])/g, o.m).replace(/(?<![a-zA-Z])d(?![a-zA-Z])/g, o.d);
  },
  seedNum(s) {
    s = String(s).trim(); if (/^-?\d+$/.test(s)) return parseInt(s, 10) | 0;
    let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h | 0;
  },
  mulberry32(a) {
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  },
  sha256(msg) {
    const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
    const fr = x => Math.floor((x - Math.floor(x)) * 4294967296);
    const K = primes.map(p => fr(Math.cbrt(p))); let H = primes.slice(0, 8).map(p => fr(Math.sqrt(p)));
    const b = new TextEncoder().encode(msg), l = b.length, nb = ((l + 9 + 63) >> 6) << 6, buf = new Uint8Array(nb);
    buf.set(b); buf[l] = 0x80; const dv = new DataView(buf.buffer);
    dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(nb - 4, (l * 8) >>> 0);
    const w = new Uint32Array(64), rr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < nb; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) { const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
      let [a, b2, c, d, e, f, g, hh] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b2) ^ (a & c) ^ (b2 & c), t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
      }
      H = [H[0] + a | 0, H[1] + b2 | 0, H[2] + c | 0, H[3] + d | 0, H[4] + e | 0, H[5] + f | 0, H[6] + g | 0, H[7] + hh | 0];
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  },
  /* 營利事業統一編號檢查：財政部自 112/4/1 起，檢查邏輯由「可被 10 整除」改為「可被 5 整除」（新舊號碼皆適用） */
  taxId(s) {
    if (!/^\d{8}$/.test(s)) return false;
    const w = [1, 2, 1, 2, 1, 2, 4, 1]; let sum = 0;
    for (let i = 0; i < 8; i++) { const p = +s[i] * w[i]; sum += Math.floor(p / 10) + p % 10; }
    return sum % 5 === 0 || (s[6] === '7' && (sum + 1) % 5 === 0);
  },
  /* 比較：數字在前（依數值），其餘依中文排序；為全序，不會因混合型別而排序錯亂 */
  cmpKeys(an, as, bn, bs) {
    const x = !isNaN(an), y = !isNaN(bn);
    if (x && y) return an - bn;
    if (x) return -1; if (y) return 1;
    return Util.collator.compare(as, bs);
  },
  cmpVals(a, b) { return Util.cmpKeys(Util.num(a), String(a), Util.num(b), String(b)); }
};

/* ------------------------------ CSV ------------------------------ */
const CSV = {
  detect(text) {
    const lines = text.split(/\r?\n/).slice(0, 12).filter(x => x.trim()); let best = ',', score = 0;
    if (!lines.length) return best;
    for (const c of ['\t', ',', ';', '|']) {
      const cnt = lines.map(l => l.split(c).length - 1), min = Math.min(...cnt);
      const sc = cnt.every(x => x === cnt[0]) ? cnt[0] * 2 : min;
      if (sc > score) { score = sc; best = c; }
    }
    return best;
  },
  parse(text, delim = ',') {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [], n = text.length, dl = delim.length; let row = [], f = '', q = false, i = 0;
    while (i < n) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } q = false; i++; continue; }
        f += c; i++; continue;
      }
      if (c === '"' && f === '') { q = true; i++; continue; }
      if (c === delim[0] && (dl === 1 || text.startsWith(delim, i))) { row.push(f); f = ''; i += dl; continue; }
      if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; i++; continue; }
      f += c; i++;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  },
  cell(v, d, protect) {
    v = v == null ? '' : String(v);
    if (protect && (/^0\d+$/.test(v) || /^\d{12,}$/.test(v))) return `="${v}"`;
    return (v.includes(d) || /["\r\n]/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v;
  },
  stringify(columns, rows, d = ',', protect = false) {
    const out = [columns.map(c => CSV.cell(c, d, false)).join(d)];
    for (const r of rows) out.push(r.map(v => CSV.cell(v, d, protect)).join(d));
    return out.join('\r\n');
  },
  unprotect: v => { const m = /^="(.*)"$/.exec(v); return m ? m[1] : v; }
};

/* ------------------------------ IndexedDB ------------------------------ */
const CH = 1000;
const DB = {
  db: null,
  open() {
    return new Promise((ok, no) => {
      if (typeof indexedDB === 'undefined') return no(new Error('此瀏覽器不支援 IndexedDB'));
      const r = indexedDB.open('LocalDataLab', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('projects', { keyPath: 'id' }).createIndex('updatedAt', 'updatedAt');
        d.createObjectStore('datasets', { keyPath: 'id' }).createIndex('projectId', 'projectId');
        d.createObjectStore('rows', { keyPath: ['datasetId', 'chunkNo'] }).createIndex('datasetId', 'datasetId');
        d.createObjectStore('templates', { keyPath: 'id' }).createIndex('type', 'type');
        d.createObjectStore('rules', { keyPath: 'id' });
        d.createObjectStore('results', { keyPath: 'id' }).createIndex('projectId', 'projectId');
        d.createObjectStore('history', { keyPath: 'id', autoIncrement: true }).createIndex('datasetId', 'datasetId');
        d.createObjectStore('settings', { keyPath: 'key' });
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); ok(); };
      r.onerror = () => no(r.error);
      r.onblocked = () => no(new Error('資料庫被其他分頁佔用，請關閉其他分頁後重試'));
    });
  },
  _p: req => new Promise((ok, no) => { req.onsuccess = () => ok(req.result); req.onerror = () => no(req.error); }),
  os(s, m = 'readonly') { return this.db.transaction(s, m).objectStore(s); },
  get(s, k) { return this._p(this.os(s).get(k)); },
  all(s) { return this._p(this.os(s).getAll()); },
  put(s, v) { return this._p(this.os(s, 'readwrite').put(v)); },
  del(s, k) { return this._p(this.os(s, 'readwrite').delete(k)); },
  byIndex(s, i, v) { return this._p(this.os(s).index(i).getAll(v)); },
  delByIndex(s, i, v) {
    return new Promise((ok, no) => {
      const tx = this.db.transaction(s, 'readwrite'), cur = tx.objectStore(s).index(i).openCursor(IDBKeyRange.only(v));
      cur.onsuccess = () => { const c = cur.result; if (c) { c.delete(); c.continue(); } };
      tx.oncomplete = ok; tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error);
    });
  },
  saveRows(id, rows) {
    return new Promise((ok, no) => {
      const tx = this.db.transaction('rows', 'readwrite'), os = tx.objectStore('rows'), cur = os.index('datasetId').openCursor(IDBKeyRange.only(id));
      cur.onsuccess = () => {
        const c = cur.result;
        if (c) { c.delete(); c.continue(); return; }
        for (let i = 0, n = 0; i < rows.length; i += CH, n++) os.put({ datasetId: id, chunkNo: n, data: rows.slice(i, i + CH) });
      };
      tx.oncomplete = ok; tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error || new Error('寫入中止（可能儲存空間不足）'));
    });
  },
  async loadRows(id) {
    const ch = await this.byIndex('rows', 'datasetId', id);
    ch.sort((a, b) => a.chunkNo - b.chunkNo);
    const out = []; for (const c of ch) for (const r of c.data) out.push(r);
    return out;
  }
};
const Cfg = {
  async get(k, d) { const r = await DB.get('settings', k); return r ? r.value : d; },
  set(k, v) { return DB.put('settings', { key: k, value: v }); }
};

/* ------------------------------ Data layer ------------------------------ */
const Data = {
  cache: {},
  list: async pid => (await DB.byIndex('datasets', 'projectId', pid)).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)),
  async create(pid, name, columns, rows, extra = {}) {

/* ------------------------------ Compare engine ------------------------------ */
const Compare = {
  diff(A, B, o) {

    const cmp = common.filter(c => !ign.has(c) && !o.keys.includes(c));
    const ka = o.keys.map(k => A.columns.indexOf(k)), kb = o.keys.map(k => B.columns.indexOf(k));
    const ca = cmp.map(c => A.columns.indexOf(c)), cb = cmp.map(c => B.columns.indexOf(c));
    const norm = v => { v = v == null ? '' : String(v); if (o.trim) v = v.trim(); if (o.ci) v = v.toLowerCase(); return v; };

    A.rows.forEach((r, i) => { const k = keyOf(r, ka); if (mapA.has(k)) dupA.push(i + 1); else mapA.set(k, { r, i }); });

      const a = mapA.get(k);

      if (ch.length) { sum.mod++; items.push({ status: 'mod', key: kb.map(i => rb[i] ?? ''), changes: ch, ra: a.r, rb, ia: a.i + 1, ib: ib + 1 }); }
      else { sum.same++; items.push({ status: 'same', key: kb.map(i => rb[i] ?? ''), changes: [], ra: a.r, rb, ia: a.i + 1, ib: ib + 1 }); }

        h('li', null, '統一編號檢查碼改為財政部新規則（可被 5 整除），不再誤判新核發的統編'),
        h('li', null, '清洗「執行並覆蓋」後畫面與資料同步，不再出現舊欄位清單'),
        h('li', null, '還原「不含資料列」的備份時，資料集筆數不再與實際內容不符'),
        h('li', null, '編輯儲存格立即儲存且只寫回該區塊；快速切換頁面不再錯亂'),
        h('li', null, '10 萬列排序加速、檢核「只看有問題的列」加速、欄名重複防呆、拖曳檔案誤開啟防護'))));
};

/* ------------------------------ App ------------------------------ */
const App = {
  theme(v) { const dark = v === 'dark' || (v === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; },
  async projSel() {
    const ps = (await DB.all('projects')).sort((a, b) => a.createdAt.localeCompare(b.createdAt)), s = $('#projSel');
    s.replaceChildren(...ps.map(p => h('option', { value: p.id }, p.name))); s.value = S.pid;
  },
  async status() {
    const ps = await DB.all('projects'), p = ps.find(x => x.id === S.pid), ds = await Data.list(S.pid);
    $('#stProj').textContent = '專案：' + (p ? p.name : '－'); const cur = ds.find(d => d.id === S.dsId);
    $('#stDs').textContent = '資料集：' + (cur ? `${cur.name}（${fmtN(cur.rowCount)} 列）` : `${ds.length} 個`);
  },
  async init() {
    try { await DB.open(); } catch (e) { $('#main').append(h('div', { class: 'card err' }, '無法開啟 IndexedDB：' + e.message + '（若使用無痕模式或瀏覽器禁止儲存，請改用一般視窗）')); return; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    this.theme(await Cfg.get('theme', 'auto')); await Proj.ensure();
    $('#nav').append(...NAV.map(([r, t]) => h('a', { 'data-r': r, onclick: () => location.hash = '#/' + r }, t)));
    await this.projSel();
    $('#projSel').addEventListener('change', async e => { await Proj.setCur(e.target.value); Router.refresh(); });
    $('#btnTheme').addEventListener('click', async () => { const o = ['auto', 'light', 'dark'], cur = await Cfg.get('theme', 'auto'), nx = o[(o.indexOf(cur) + 1) % 3]; await Cfg.set('theme', nx); this.theme(nx); UI.toast('主題：' + { auto: '跟隨系統', light: '淺色', dark: '深色' }[nx]); });
    $('#btnBackup').addEventListener('click', async () => { const j = await UI.busy('備份中…', () => Proj.backup('all', true)); dl(`LocalDataLab_備份_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(j), 'application/json'); UI.toast('完整備份已下載', 'ok'); });
    addEventListener('hashchange', () => Router.go());
    /* 避免檔案被拖到匯入區以外時，瀏覽器直接開啟檔案而離開本工具（會失去未儲存內容） */
    ['dragover', 'drop'].forEach(ev => addEventListener(ev, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); }));
    addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !S.dsId || !['grid', 'clean'].includes(Router.cur)) return;
      if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); Hist.undo(S.dsId); } else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); Hist.redo(S.dsId); }
    });
    addEventListener('error', e => UI.toast('錯誤：' + e.message, 'err'));
    addEventListener('unhandledrejection', e => UI.toast('錯誤：' + (e.reason && e.reason.message || e.reason), 'err', 5000));
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => this.theme(await Cfg.get('theme', 'auto')));
    await Router.go();
  }
};
if (typeof document !== 'undefined' && document.getElementById('main')) App.init();
</script>
