<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schema Detective 資料表結構偵探</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--bd:#d9dde3;--tx:#1d2330;--tx2:#5b6475;--ac:#2563eb;--ac2:#dbe7ff;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--add:#dcfce7;--del:#fee2e2;--chg:#fef3c7;--cm:#dbeafe;--ix:#ede9fe;--mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;--rh:28px}
[data-theme=dark]{--bg:#0f131a;--panel:#171c26;--panel2:#1e2430;--bd:#2c3445;--tx:#e6e9ef;--tx2:#9aa5b8;--ac:#5b92ff;--ac2:#22324f;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--add:#12301d;--del:#3a1717;--chg:#3a2f10;--cm:#16294a;--ix:#2a2347}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12.5px}
button{background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.dng{color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--ac)}
code,.mono{font-family:var(--mono);font-size:12.5px}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#top h1{font-size:15px;margin:0;white-space:nowrap}
#search{flex:1;min-width:200px;max-width:520px}
#tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;white-space:nowrap}
#tabs button.on{border-bottom-color:var(--ac);color:var(--ac);font-weight:600}
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.on{display:flex}
.scroll{overflow:auto;padding:14px 18px;width:100%}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--bd)}
.pane-h{padding:8px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pane-h input[type=text],.pane-h input:not([type]){flex:1}
.grow{flex:1;min-height:0;position:relative}
#v-explorer .tree{width:300px;flex:none}
#v-explorer .mid{flex:1}
#v-explorer .right{width:360px;flex:none;overflow:auto;border-right:0;padding:12px}
.vl{overflow:auto;position:relative;--rh:28px}
.vl-sp{width:1px;position:absolute;left:0;top:0}
.vl-in{position:absolute;left:0;right:0;top:0}
.vl .r{height:var(--rh);display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid transparent;white-space:nowrap;overflow:hidden;cursor:pointer}
.vl .r:hover{background:var(--panel2)}
.vl .r.sel{background:var(--ac2)}
.vl .r .t{overflow:hidden;text-overflow:ellipsis}
.vl .r.sh{font-weight:600;background:var(--panel2);cursor:pointer}
.vl .r.gh{padding-left:22px;color:var(--tx2);font-weight:600}
.vl .r.tt{padding-left:34px}
.vl .r.tt.nog{padding-left:22px}
.vl .r.h{color:var(--tx2);font-size:12px;text-transform:uppercase;cursor:default}
.cg{display:grid;grid-template-columns:46px minmax(130px,1.2fr) minmax(130px,1fr) 30px 34px 34px minmax(140px,2fr);gap:6px;align-items:center}
.vl .r.cg{display:grid}
.cg>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr{background:var(--panel2);font-weight:600;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--bd)}
.hdr span{cursor:pointer}
.badge{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;line-height:18px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.err{color:var(--err);border-color:var(--err)}.badge.ac{color:var(--ac);border-color:var(--ac)}
.muted{color:var(--tx2)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label{display:flex;gap:4px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv>div:nth-child(odd){color:var(--tx2)}
.dz{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--tx2)}
.dz.over{border-color:var(--ac);background:var(--ac2)}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
.bar>i{display:block;height:100%;background:var(--ac);width:0;transition:width .15s}
table.tb{border-collapse:collapse;width:100%;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}
table.tb th{background:var(--panel2);position:sticky;top:0}
.dl{padding:2px 10px;font-family:var(--mono);font-size:12.5px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}.dl.chg{background:var(--chg)}.dl.cm{background:var(--cm)}.dl.ix{background:var(--ix)}.dl.hd{background:var(--panel2);font-weight:600}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:4px;padding:0 6px;margin:0 3px 3px 0;font-size:12px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.on{display:flex}
#modal{background:var(--panel);border:1px solid var(--bd);border-radius:12px;max-width:min(1100px,94vw);max-height:90vh;overflow:auto;padding:18px 20px;min-width:360px}
#modal h3{margin-top:0}
#palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);z-index:60;display:none;padding:10px}
#palette.on{display:block}
#palette input{width:100%;margin-bottom:6px}
#palette .it{padding:6px 10px;border-radius:6px;cursor:pointer}
#palette .it.on,#palette .it:hover{background:var(--ac2)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:70}
.toast{background:var(--panel);border:1px solid var(--bd);border-left:4px solid var(--ac);padding:8px 12px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:380px}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:80;color:#fff;font-size:16px}
#busy.on{display:flex}
pre.sql{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow:auto;max-height:420px;font-family:var(--mono);font-size:12.5px;white-space:pre}
.cols2{display:flex;gap:12px;min-height:0;height:100%;width:100%}
.cols2>.pane{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.sticky-note{font-size:12px;color:var(--tx2)}
#lkWrap{display:flex;flex-direction:column;width:100%;height:100%;padding:12px 16px;gap:10px;min-height:0}
#lkIn{font-family:var(--mono);font-size:14px;min-height:56px}
#lkSugBox{display:none;position:absolute;left:0;top:100%;z-index:30;min-width:260px;max-width:100%;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
#lkSugBox .it{padding:4px 10px;border-radius:6px;cursor:pointer}
#lkSugBox .it.on,#lkSugBox .it:hover{background:var(--ac2)}
.lg{display:grid;grid-template-columns:minmax(190px,1.4fr) minmax(130px,1fr) minmax(130px,1fr) 30px 34px minmax(140px,2fr);gap:6px;align-items:center}
.lg>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl .r.lg{display:grid}
.vl .r.gh2{background:var(--panel2);font-weight:600;gap:8px;position:relative}
@media(max-width:1100px){#v-explorer .right{display:none}#v-explorer .tree{width:240px}}
</style>
</head>
<body>
<div id="top">
  <h1>🔍 Schema Detective</h1>
  <select id="snapSel" title="目前 Snapshot"></select>
  <input id="search" type="search" placeholder="搜尋  CUST_ID · =CUST_ID · type:NUMBER · table:CAL_* · tag:xx   ( / )">
  <span class="muted" id="statLine"></span>
  <span style="flex:1"></span>
  <button id="btnPal" title="命令面板 Ctrl+K">⌘ 命令</button>
  <button id="btnTheme" title="切換主題">🌓</button>
</div>
<div id="tabs"></div>
<div id="main">
  <section class="view" id="v-explorer">
    <div class="pane tree">
      <div class="pane-h"><input id="treeFilter" type="search" placeholder="篩選資料表…"><label class="muted"><input type="checkbox" id="grpPrefix">前綴分組</label></div>
      <div class="grow" id="treeList"></div>
    </div>
    <div class="pane mid">
      <div id="tblHead" class="pane-h" style="display:block"></div>
      <div class="pane-h" id="colFilters">
        <input id="colFilter" placeholder="篩選欄位…">
        <label><input type="checkbox" id="fPk">只看 PK</label>
        <label><input type="checkbox" id="fCm">有註解</label>
        <label><input type="checkbox" id="fNn">NOT NULL</label>
        <label><input type="checkbox" id="fNote">有筆記</label>
      </div>
      <div class="hdr cg" id="colHead"><span data-s="pos">#</span><span data-s="name">欄位</span><span data-s="type">型態</span><span data-s="nn">N</span><span data-s="pk">PK</span><span data-s="idx">IDX</span><span data-s="cm">註解</span></div>
      <div class="grow" id="colList"></div>
    </div>
    <div class="pane right" id="detail"></div>
  </section>
  <section class="view" id="v-lookup"><div id="lkWrap">
    <div class="card" style="margin:0">
      <div style="position:relative">
        <textarea id="lkIn" rows="2" spellcheck="false" autocomplete="off" placeholder="輸入欄位名稱，查詢哪些資料表使用它　例：CUST_ID　或多個：CUST_ID, ISSUER_ID（逗號／空白／換行分隔）　支援 CUST* 萬用字元　Enter 查詢"></textarea>
        <div id="lkSugBox"></div>
      </div>
      <div class="row">
        <label>比對 <select id="lkMode"><option value="exact">完全相符</option><option value="contains">包含</option><option value="prefix">開頭為</option><option value="suffix">結尾為</option></select></label>
        <label>多個欄位 <select id="lkLogic"><option value="any">任一欄位（聯集）</option><option value="all">全部欄位（同一張表需同時包含）</option></select></label>
        <label><select id="lkSch"></select></label>
        <label><input type="checkbox" id="lkCmt">同時比對欄位註解／業務筆記</label>
        <span style="flex:1"></span>
        <button class="pri" id="lkRun">查詢</button><button id="lkClear">清除</button><button id="lkCopy" disabled>複製資料表清單</button><button id="lkCsv" disabled>匯出 CSV</button>
      </div>
    </div>
    <div class="card" id="lkSum" style="margin:0"></div>
    <div class="pane" style="flex:1;min-height:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden">
      <div class="hdr lg" id="lkHead"></div><div class="grow" id="lkList"></div>
    </div>
  </div></section>
  <section class="view" id="v-search"><div class="cols2" style="padding:10px"><div class="pane" style="flex:1"><div id="searchSum" class="pane-h" style="display:block"></div><div class="grow" id="searchList"></div></div></div></section>
  <section class="view" id="v-import"><div class="scroll" id="importBox"></div></section>
  <section class="view" id="v-diff"><div class="scroll" id="diffBox"></div></section>
  <section class="view" id="v-relations"><div class="scroll" id="relBox"></div></section>
  <section class="view" id="v-sql"><div class="scroll" id="sqlBox"></div></section>
  <section class="view" id="v-settings"><div class="scroll" id="setBox"></div></section>
</div>
<div id="overlay"><div id="modal"></div></div>
<div id="palette"><input id="palIn" placeholder="輸入指令…"><div id="palList"></div></div>
<div id="toasts"></div>
<div id="busy"><div id="busyMsg">處理中…</div></div>

<script>
'use strict';
function __sdFactory(){
'use strict';

/* ======================= Statement Splitter (streaming) ======================= */
/* 狀態：0 normal, 1 'str', 2 "qid", 3 --comment, 4 block comment, 5 q'[ ]' */
class Splitter{
  constructor(){
    this.carry=''; this.cur=''; this.st=0; this.qend=''; this.line=1; this.sl=-1;
    this.lineBlank=true; this.prev=''; this.prev2='';
  }
  feed(text, final){
    const s=this.carry+text; this.carry=''; const n=s.length; const out=[];
    const lim=final?n:Math.max(0,n-3);
    let i=0, seg=0, st=this.st;
    const emit=(endIdx)=>{
      const t=this.cur+s.slice(seg,endIdx); this.cur='';
      if(t.trim()!==''){ out.push({text:t,line:this.sl<0?this.line:this.sl,endLine:this.line}); }
      this.sl=-1;
    };
    while(i<lim){
      const c=s.charCodeAt(i);
      if(c===10){ this.line++; this.lineBlank=true; if(st===3) st=0; this.prev2=this.prev; this.prev='\n'; i++; continue; }
      if(st===0){
        if(c===32||c===9||c===13){ this.prev2=this.prev; this.prev=' '; i++; continue; }
        if(this.sl<0) this.sl=this.line;
        const ch=s[i];
        if(ch===';'){ emit(i); seg=i+1; this.lineBlank=false; this.prev2=this.prev; this.prev=ch; i++; continue; }
        if(ch==="'"){
          const p=this.prev, pp=this.prev2;
          if((p==='q'||p==='Q') && !/[A-Za-z0-9_$#"]/.test(pp||' ')){
            const d=s[i+1]; const close={'[':']','{':'}','(':')','<':'>'}[d]||d;
            st=5; this.qend=close+"'"; i+=2; this.lineBlank=false; this.prev2=this.prev; this.prev="'"; continue;
          }
          st=1; this.lineBlank=false; this.prev2=this.prev; this.prev=ch; i++; continue;
        }
        if(ch==='"'){ st=2; this.lineBlank=false; this.prev2=this.prev; this.prev=ch; i++; continue; }
        if(ch==='-'&&s[i+1]==='-'){ st=3; this.lineBlank=false; i+=2; this.prev2=this.prev; this.prev='-'; continue; }
        if(ch==='/'){
          if(s[i+1]==='*'){ st=4; this.lineBlank=false; i+=2; this.prev2=this.prev; this.prev='/'; continue; }
          if(this.lineBlank){
            let j=i+1; while(j<n && (s[j]===' '||s[j]==='\t'||s[j]==='\r')) j++;
            if(j>=n && !final){ break; }
            if(j>=n || s[j]==='\n'){ emit(i); seg=i+1; i=j; this.prev2=this.prev; this.prev='/'; continue; }
          }
        }
        this.lineBlank=false; this.prev2=this.prev; this.prev=s[i]; i++; continue;
      }
      if(st===1){ if(c===39){ if(s.charCodeAt(i+1)===39){ i+=2; continue; } st=0; } this.prev2=this.prev; this.prev="'"; i++; continue; }
      if(st===2){ if(c===34){ if(s.charCodeAt(i+1)===34){ i+=2; continue; } st=0; } this.prev2=this.prev; this.prev='"'; i++; continue; }
      if(st===3){ i++; continue; }
      if(st===4){ if(c===42&&s.charCodeAt(i+1)===47){ st=0; i+=2; this.prev='/'; continue; } i++; continue; }
      if(st===5){ if(s.startsWith(this.qend,i)){ st=0; i+=this.qend.length; this.prev="'"; continue; } i++; continue; }
    }
    this.st=st;
    this.cur+=s.slice(seg,i);
    if(final){ this.carry=''; emit(i); }
    else this.carry=s.slice(i);
    return out;
  }
}

/* ======================= Tokenizer ======================= */
function tokenize(sql){
  const toks=[]; const n=sql.length; let i=0, line=0;
  const isId=(c)=>(c>=48&&c<=57)||(c>=65&&c<=90)||(c>=97&&c<=122)||c===95||c===36||c===35||c>127;
  while(i<n){
    const c=sql.charCodeAt(i);
    if(c<=32){ if(c===10) line++; i++; continue; }
    const ch=sql[i];
    if(ch==='-'&&sql[i+1]==='-'){ while(i<n&&sql.charCodeAt(i)!==10) i++; continue; }
    if(ch==='/'&&sql[i+1]==='*'){ const e=sql.indexOf('*/',i+2); const end=e<0?n:e+2; for(let k=i;k<end;k++) if(sql.charCodeAt(k)===10) line++; i=end; continue; }
    if(ch==='"'){
      let j=i+1, v='';
      while(j<n){ if(sql[j]==='"'){ if(sql[j+1]==='"'){ v+='"'; j+=2; continue; } break; } v+=sql[j++]; }
      toks.push({t:'q',v,u:null,s:i,e:j+1,l:line}); i=j+1; continue;
    }
    if(ch==="'"){
      let j=i+1, v='';
      while(j<n){ if(sql[j]==="'"){ if(sql[j+1]==="'"){ v+="'"; j+=2; continue; } break; } if(sql.charCodeAt(j)===10) line++; v+=sql[j++]; }
      toks.push({t:'s',v,u:null,s:i,e:j+1,l:line}); i=j+1; continue;
    }
    if((ch==='q'||ch==='Q')&&sql[i+1]==="'"&&i+2<n){
      const d=sql[i+2]; const close=({'[':']','{':'}','(':')','<':'>'}[d]||d)+"'";
      const e=sql.indexOf(close,i+3);
      if(e>=0){ toks.push({t:'s',v:sql.slice(i+3,e),u:null,s:i,e:e+2,l:line}); for(let k=i;k<e;k++) if(sql.charCodeAt(k)===10) line++; i=e+2; continue; }
    }
    if((c>=48&&c<=57)||(ch==='.'&&sql.charCodeAt(i+1)>=48&&sql.charCodeAt(i+1)<=57)){
      let j=i+1; while(j<n){ const d=sql.charCodeAt(j); if((d>=48&&d<=57)||d===46||d===69||d===101) j++; else break; }
      toks.push({t:'n',v:sql.slice(i,j),u:null,s:i,e:j,l:line}); i=j; continue;
    }
    if(isId(c)&&!(c>=48&&c<=57)){
      let j=i+1; while(j<n&&isId(sql.charCodeAt(j))) j++;
      const v=sql.slice(i,j); toks.push({t:'i',v,u:v.toUpperCase(),s:i,e:j,l:line}); i=j; continue;
    }
    toks.push({t:'p',v:ch,u:null,s:i,e:i+1,l:line}); i++;
  }
  return toks;
}
const nm=(t)=>t.t==='i'?t.u:t.v;                 // 識別字名稱（未加引號者轉大寫）
const isName=(t)=>t&&(t.t==='i'||t.t==='q');
const isKw=(t,k)=>t&&t.t==='i'&&t.u===k;
const isP=(t,v)=>t&&t.t==='p'&&t.v===v;

function skipGroup(toks,p,b){ // toks[p] 為 '('，回傳對應 ')' 之後的位置
  let d=0; for(;p<b;p++){ const t=toks[p]; if(t.t==='p'){ if(t.v==='(') d++; else if(t.v===')'){ d--; if(d===0) return p+1; } } }
  return b;
}
function splitTop(toks,a,b){ // 在 [a,b) 以 depth-0 逗號切段
  const items=[]; let d=0, st=a;
  for(let p=a;p<b;p++){ const t=toks[p]; if(t.t!=='p') continue;
    if(t.v==='(') d++; else if(t.v===')') d--; else if(t.v===','&&d===0){ items.push([st,p]); st=p+1; } }
  if(st<b) items.push([st,b]); return items;
}
function parseNameParts(toks,p,b){
  const parts=[]; 
  while(p<b&&isName(toks[p])){ parts.push(nm(toks[p])); p++; if(p<b&&isP(toks[p],'.')) p++; else break; }
  return {parts,next:p};
}
function colList(toks,p,b){ // toks[p]=='('
  const cols=[]; if(!isP(toks[p],'(')) return {cols,next:p};
  const e=skipGroup(toks,p,b); const items=splitTop(toks,p+1,e-1);
  for(const [x,y] of items){ if(isName(toks[x])) cols.push(nm(toks[x])); }
  return {cols,next:e};
}

/* ======================= Column / table parsing ======================= */
const DEF_STOP=new Set(['NOT','NULL','CONSTRAINT','PRIMARY','UNIQUE','REFERENCES','CHECK','ENABLE','DISABLE','VISIBLE','INVISIBLE','ENCRYPT','GENERATED','COLLATE','USING','VALIDATE','NOVALIDATE']);
const CHARLIKE=new Set(['VARCHAR2','NVARCHAR2','CHAR','NCHAR','VARCHAR','RAW','NVARCHAR','CHARACTER','UROWID']);
const NUMLIKE=new Set(['NUMBER','FLOAT','DECIMAL','NUMERIC','DEC','INTEGER','INT','SMALLINT','BINARY_FLOAT','BINARY_DOUBLE','REAL']);

function parseType(toks,p,b,src){
  const r={dtype:'',length:null,precision:null,scale:null,unit:null,disp:''};
  if(p>=b) return {r,next:p};
  let t=toks[p];
  if(t.t==='q'){ // 使用者自訂型別 "S"."T"
    const np=parseNameParts(toks,p,b); r.dtype=np.parts.join('.'); p=np.next;
  } else if(t.t==='i'){
    let base=t.u; p++;
    if(base==='DOUBLE'&&isKw(toks[p],'PRECISION')){ base='DOUBLE PRECISION'; p++; }
    else if(base==='LONG'&&isKw(toks[p],'RAW')){ base='LONG RAW'; p++; }
    else if(base==='CHARACTER'&&isKw(toks[p],'VARYING')){ base='VARCHAR'; p++; }
    else if(base==='NATIONAL'&&p<b&&toks[p].t==='i'){ base='N'+toks[p].u; p++; if(isKw(toks[p],'VARYING')){ base='NVARCHAR'; p++; } }
    while(isP(toks[p],'.')&&p+1<b&&(toks[p+1].t==='i'||toks[p+1].t==='q')){ base+='.'+nm(toks[p+1]); p+=2; }
    r.dtype=base;
    if(base==='INTERVAL'){
      let s=base; while(p<b){ const x=toks[p]; if(x.t==='i'&&['YEAR','DAY','MONTH','SECOND','HOUR','MINUTE','TO'].includes(x.u)){ s+=' '+x.u; p++; if(isP(toks[p],'(')){ const e=skipGroup(toks,p,b); s+=src.slice(toks[p].s,toks[e-1].e); p=e; } } else break; }
      r.dtype=s; r.disp=s; return {r,next:p};
    }
    if(isP(toks[p],'(')){
      const e=skipGroup(toks,p,b); const args=[];
      for(const [x,y] of splitTop(toks,p+1,e-1)){
        let raw=[]; for(let k=x;k<y;k++){ const tk=toks[k]; if(tk.t==='i'&&(tk.u==='BYTE'||tk.u==='CHAR')) r.unit=tk.u; else raw.push(tk.v); }
        if(raw.length) args.push(raw.join(''));
      }
      p=e;
      const num=(v)=>{ if(v==null) return null; const x=Number(v); return isNaN(x)?v:x; };
      if(CHARLIKE.has(base)) r.length=num(args[0]);
      else if(NUMLIKE.has(base)){ r.precision=num(args[0]); r.scale=args.length>1?num(args[1]):(args.length?0:null); }
      else if(base==='TIMESTAMP'){ r.precision=num(args[0]); }
      else if(args.length){ r.length=num(args[0]); }
    }
    if(base==='TIMESTAMP'&&isKw(toks[p],'WITH')){
      let s=' WITH'; p++; if(isKw(toks[p],'LOCAL')){ s+=' LOCAL'; p++; }
      if(isKw(toks[p],'TIME')&&isKw(toks[p+1],'ZONE')){ s+=' TIME ZONE'; p+=2; }
      r.dtype=base+s;
    }
  }
  r.disp=typeDisp(r); return {r,next:p};
}
function typeDisp(r){
  let s=r.dtype||'';
  if(r.length!=null) s+='('+r.length+(r.unit?' '+r.unit:'')+')';
  else if(r.precision!=null){
    if(/^TIMESTAMP/.test(s)) return s.replace('TIMESTAMP','TIMESTAMP('+r.precision+')');
    s+='('+r.precision+((r.scale||r.precision==='*')&&r.scale!=null?','+r.scale:'')+')';
  }
  return s;
}

function parseColumnDef(toks,a,b,src){
  let p=a; if(!isName(toks[p])) return null;
  const col={name:nm(toks[p]),dtype:'',length:null,precision:null,scale:null,unit:null,type:'',nullable:true,def:null,pk:false,uk:false,fk:null,comment:''};
  p++;
  const pt=parseType(toks,p,b,src); p=pt.next; Object.assign(col,{dtype:pt.r.dtype,length:pt.r.length,precision:pt.r.precision,scale:pt.r.scale,unit:pt.r.unit,type:pt.r.disp});
  while(p<b){
    const t=toks[p]; const u=t.t==='i'?t.u:null;
    if(u==='DEFAULT'){
      p++; if(isKw(toks[p],'ON')&&isKw(toks[p+1],'NULL')) p+=2;
      const st=p; let d=0; if(p<b){ if(isP(toks[p],'(')) d=1; p++; }
      while(p<b){ const tt=toks[p]; if(tt.t==='p'&&tt.v==='(') d++; else if(tt.t==='p'&&tt.v===')') d--; else if(d===0&&tt.t==='i'&&DEF_STOP.has(tt.u)) break; p++; }
      if(p>st) col.def=src.slice(toks[st].s,toks[p-1].e).trim();
    }
    else if(u==='NOT'&&isKw(toks[p+1],'NULL')){ col.nullable=false; p+=2; }
    else if(u==='NULL'){ p++; }
    else if(u==='CONSTRAINT'){ p+=2; }
    else if(u==='PRIMARY'&&isKw(toks[p+1],'KEY')){ col.pk=true; col.nullable=false; p+=2; }
    else if(u==='UNIQUE'){ col.uk=true; p++; }
    else if(u==='REFERENCES'){ p++; const np=parseNameParts(toks,p,b); p=np.next; let rc=[]; if(isP(toks[p],'(')){ const cl=colList(toks,p,b); rc=cl.cols; p=cl.next; }
      col.fk={refSchema:np.parts.length>1?np.parts[0]:null,refTable:np.parts[np.parts.length-1],refCols:rc}; }
    else if(u==='CHECK'&&isP(toks[p+1],'(')){ p=skipGroup(toks,p+1,b); }
    else if(u==='GENERATED'||u==='AS'){ p++; if(p<b&&isP(toks[p],'(')) p=skipGroup(toks,p,b); }
    else if(t.t==='p'&&t.v==='('){ p=skipGroup(toks,p,b); }
    else p++;
  }
  return col;
}

function parseCreateTable(toks,p,stm,src,out){
  const n=toks.length;
  if(isKw(toks[p],'IF')&&isKw(toks[p+1],'NOT')&&isKw(toks[p+2],'EXISTS')) p+=3;
  const np=parseNameParts(toks,p,n); if(!np.parts.length) throw new Error('無法解析資料表名稱');
  p=np.next;
  const tbl={schema:np.parts.length>1?np.parts[np.parts.length-2]:null,name:np.parts[np.parts.length-1],columns:[],pk:[],pkName:null,uks:[],fks:[],checks:[],partition:null,comment:'',lineStart:stm.line,lineEnd:stm.endLine};
  if(!isP(toks[p],'(')){ out.warnings.push({line:stm.line,msg:'CREATE TABLE 沒有欄位定義（可能是 AS SELECT / OF 型別），已略過欄位',snippet:src.slice(0,120)}); out.tables.push(tbl); return; }
  const e=skipGroup(toks,p,n); const items=splitTop(toks,p+1,e-1);
  const inlinePk=[];
  for(const [a,b] of items){
    const first=toks[a]; if(!first) continue;
    const u=first.t==='i'?first.u:null;
    let q=a, cname=null;
    if(u==='CONSTRAINT'){ cname=toks[a+1]?nm(toks[a+1]):null; q=a+2; }
    const k=toks[q]&&toks[q].t==='i'?toks[q].u:null;
    if(k==='PRIMARY'&&isKw(toks[q+1],'KEY')){ const cl=colList(toks,q+2,b); tbl.pk=cl.cols; tbl.pkName=cname; }
    else if(k==='UNIQUE'&&isP(toks[q+1],'(')){ const cl=colList(toks,q+1,b); tbl.uks.push({name:cname,cols:cl.cols}); }
    else if(k==='FOREIGN'&&isKw(toks[q+1],'KEY')){
      const cl=colList(toks,q+2,b); let r=cl.next; let ref={refSchema:null,refTable:null,refCols:[]};
      if(isKw(toks[r],'REFERENCES')){ const rp=parseNameParts(toks,r+1,b); ref.refSchema=rp.parts.length>1?rp.parts[0]:null; ref.refTable=rp.parts[rp.parts.length-1]; if(isP(toks[rp.next],'(')) ref.refCols=colList(toks,rp.next,b).cols; }
      tbl.fks.push(Object.assign({name:cname,cols:cl.cols},ref));
    }
    else if(k==='CHECK'&&isP(toks[q+1],'(')){
      const ee=skipGroup(toks,q+1,b); const expr=src.slice(toks[q+1].e,toks[ee-1].s).trim();
      const m=/^"?([^"\s]+)"?\s+IS\s+NOT\s+NULL$/i.exec(expr);
      tbl.checks.push({name:cname,expr,notnull:m?m[1]:null});
    }
    else if((k==='SUPPLEMENTAL'&&isKw(toks[q+1],'LOG'))||(k==='PERIOD'&&isKw(toks[q+1],'FOR'))||(k==='SCOPE'&&isKw(toks[q+1],'FOR'))){ /* 子句，非欄位 */ }
    else { const c=parseColumnDef(toks,a,b,src); if(c){ tbl.columns.push(c); if(c.pk) inlinePk.push(c.name); } }
  }
  if(!tbl.pk.length&&inlinePk.length) tbl.pk=inlinePk;
  for(const c of tbl.columns){
    if(c.fk) tbl.fks.push({name:null,cols:[c.name],refSchema:c.fk.refSchema,refTable:c.fk.refTable,refCols:c.fk.refCols});
    if(c.uk) tbl.uks.push({name:null,cols:[c.name]});
  }
  for(const c of tbl.checks){ if(c.notnull){ const col=tbl.columns.find(x=>x.name===c.notnull||x.name.toUpperCase()===c.notnull.toUpperCase()); if(col) col.nullable=false; } }
  // 分割：PARTITION BY RANGE|LIST|HASH (cols)
  for(let k=e;k<n;k++){ if(isKw(toks[k],'PARTITION')&&isKw(toks[k+1],'BY')&&toks[k+2]&&toks[k+2].t==='i'){ const type=toks[k+2].u; if(isP(toks[k+3],'(')){ tbl.partition={type,cols:colList(toks,k+3,n).cols}; } break; } }
  out.tables.push(tbl);
}

function parseCreateIndex(toks,p,stm,src,out,unique){
  const n=toks.length;
  const ip=parseNameParts(toks,p,n); p=ip.next;
  if(!isKw(toks[p],'ON')) { out.stats.ignored++; return; }
  const tp=parseNameParts(toks,p+1,n); p=tp.next;
  if(!isP(toks[p],'(')){ out.stats.ignored++; return; }
  const e=skipGroup(toks,p,n); const cols=[];
  for(const [a,b] of splitTop(toks,p+1,e-1)){
    if(isName(toks[a])&&(b-a===1||(b-a===2&&toks[a+1].t==='i'&&(toks[a+1].u==='ASC'||toks[a+1].u==='DESC')))) cols.push(nm(toks[a]));
    else cols.push('{'+src.slice(toks[a].s,toks[b-1].e).replace(/\s+/g,' ')+'}');
  }
  out.indexes.push({name:ip.parts[ip.parts.length-1],schema:tp.parts.length>1?tp.parts[tp.parts.length-2]:null,table:tp.parts[tp.parts.length-1],cols,unique:!!unique,line:stm.line});
}

function parseComment(toks,p,stm,out){
  const n=toks.length; const kind=toks[p]&&toks[p].t==='i'?toks[p].u:null; p++;
  const np=parseNameParts(toks,p,n); p=np.next;
  if(!isKw(toks[p],'IS')){ out.stats.ignored++; return; }
  let v=''; if(toks[p+1]&&toks[p+1].t==='s') v=toks[p+1].v; else if(isKw(toks[p+1],'NULL')) v='';
  v=v.normalize('NFC');
  const parts=np.parts;
  if(kind==='TABLE'){ out.tcomments.push({schema:parts.length>1?parts[parts.length-2]:null,table:parts[parts.length-1],text:v}); }
  else if(kind==='COLUMN'){
    if(parts.length<2){ out.stats.ignored++; return; }
    out.ccomments.push({schema:parts.length>2?parts[parts.length-3]:null,table:parts[parts.length-2],column:parts[parts.length-1],text:v});
  } else out.stats.ignored++;
}

function parseAlter(toks,p,stm,src,out){
  const n=toks.length;
  if(!isKw(toks[p],'TABLE')){ out.stats.ignored++; return; }
  const np=parseNameParts(toks,p+1,n); p=np.next;
  const schema=np.parts.length>1?np.parts[np.parts.length-2]:null, table=np.parts[np.parts.length-1];
  const k=toks[p]&&toks[p].t==='i'?toks[p].u:null;
  if(k==='ADD'||k==='MODIFY'){
    p++;
    if(k==='ADD'&&isKw(toks[p],'COLUMN')) p++;
    // ADD CONSTRAINT / ADD PRIMARY KEY ...
    let q=p, cname=null;
    if(isKw(toks[q],'CONSTRAINT')){ cname=toks[q+1]?nm(toks[q+1]):null; q+=2; }
    const kk=toks[q]&&toks[q].t==='i'?toks[q].u:null;
    if(k==='ADD'&&kk==='PRIMARY'&&isKw(toks[q+1],'KEY')){ out.alters.push({schema,table,kind:'pk',name:cname,cols:colList(toks,q+2,n).cols}); return; }
    if(k==='ADD'&&kk==='UNIQUE'&&isP(toks[q+1],'(')){ out.alters.push({schema,table,kind:'uk',name:cname,cols:colList(toks,q+1,n).cols}); return; }
    if(k==='ADD'&&kk==='FOREIGN'&&isKw(toks[q+1],'KEY')){
      const cl=colList(toks,q+2,n); let r=cl.next; const f={schema,table,kind:'fk',name:cname,cols:cl.cols,refSchema:null,refTable:null,refCols:[]};
      if(isKw(toks[r],'REFERENCES')){ const rp=parseNameParts(toks,r+1,n); f.refSchema=rp.parts.length>1?rp.parts[0]:null; f.refTable=rp.parts[rp.parts.length-1]; if(isP(toks[rp.next],'(')) f.refCols=colList(toks,rp.next,n).cols; }
      out.alters.push(f); return;
    }
    if(k==='ADD'&&kk==='CHECK'&&isP(toks[q+1],'(')){
      const ee=skipGroup(toks,q+1,n); const expr=src.slice(toks[q+1].e,toks[ee-1].s).trim();
      const m=/^"?([^"\s]+)"?\s+IS\s+NOT\s+NULL$/i.exec(expr);
      out.alters.push({schema,table,kind:'check',name:cname,expr,notnull:m?m[1]:null}); return;
    }
    // ADD ( coldefs ) / MODIFY ( col ... )
    if(isP(toks[p],'(')){
      const e=skipGroup(toks,p,n);
      for(const [a,b] of splitTop(toks,p+1,e-1)){
        if(k==='ADD'){ const c=parseColumnDef(toks,a,b,src); if(c) out.alters.push({schema,table,kind:'addcol',col:c}); }
        else modifyItem(toks,a,b,schema,table,out);
      }
      return;
    }
    if(k==='MODIFY'&&isName(toks[p])){ modifyItem(toks,p,n,schema,table,out); return; }
    if(k==='ADD'&&isName(toks[p])&&toks[p+1]){ const c=parseColumnDef(toks,p,n,src); if(c){ out.alters.push({schema,table,kind:'addcol',col:c}); return; } }
  }
  out.stats.ignored++;
}
function modifyItem(toks,a,b,schema,table,out){
  if(!isName(toks[a])) return; const col=nm(toks[a]);
  for(let k=a+1;k<b;k++){
    if(isKw(toks[k],'NOT')&&isKw(toks[k+1],'NULL')){ out.alters.push({schema,table,kind:'nullable',column:col,nullable:false}); return; }
    if(isKw(toks[k],'NULL')){ out.alters.push({schema,table,kind:'nullable',column:col,nullable:true}); return; }
  }
}

/* ======================= Statement dispatcher ======================= */
const SQLPLUS=/^\s*(REM|REMARK|PROMPT|SET|SPOOL|WHENEVER|DEFINE|CONNECT|EXIT|COMMIT|SHOW|CLEAR|COLUMN|TTITLE|BTITLE|STORE)\b/i;
function stripLead(t){
  let pos=0;
  for(;;){
    let e=t.indexOf('\n',pos); const line=e<0?t.slice(pos):t.slice(pos,e);
    const ln=line.trim();
    if(ln===''||ln.startsWith('--')||SQLPLUS.test(line)){ if(e<0) return ''; pos=e+1; continue; }
    return pos?t.slice(pos):t;
  }
}
const CREATE_MODS=new Set(['OR','REPLACE','GLOBAL','TEMPORARY','PRIVATE','UNIQUE','BITMAP','MULTIVALUE','EDITIONABLE','NONEDITIONABLE','FORCE','NOFORCE','IMMUTABLE','BLOCKCHAIN','SHARDED','DUPLICATED','MATERIALIZED_NOT']);

function parseStatement(stm,out){
  const src=stripLead(stm.text);
  if(!src.trim()){ return; }
  out.stats.stmts++;
  const toks=tokenize(src);
  if(!toks.length) return;
  const k0=toks[0].t==='i'?toks[0].u:'';
  if(k0==='CREATE'){
    let p=1, unique=false;
    while(p<toks.length&&toks[p].t==='i'&&CREATE_MODS.has(toks[p].u)){ if(toks[p].u==='UNIQUE') unique=true; p++; }
    const kind=toks[p]&&toks[p].t==='i'?toks[p].u:'';
    if(kind==='TABLE') return parseCreateTable(toks,p+1,stm,src,out);
    if(kind==='INDEX') return parseCreateIndex(toks,p+1,stm,src,out,unique);
    out.stats.ignored++; return;
  }
  if(k0==='COMMENT'&&isKw(toks[1],'ON')) return parseComment(toks,2,stm,out);
  if(k0==='ALTER') return parseAlter(toks,1,stm,src,out);
  out.stats.ignored++;
}
function newOut(){ return {tables:[],indexes:[],tcomments:[],ccomments:[],alters:[],warnings:[],stats:{stmts:0,ignored:0}}; }
function parseStatements(stmts,out){
  out=out||newOut();
  for(const s of stmts){
    try{ parseStatement(s,out); }
    catch(err){ if(out.warnings.length<500) out.warnings.push({line:s.line,msg:'解析失敗：'+(err&&err.message||err),snippet:s.text.trim().slice(0,120)}); }
  }
  return out;
}
function parseText(text){
  const sp=new Splitter(); const stmts=sp.feed(text,true); return parseStatements(stmts);
}

return {Splitter,tokenize,parseStatements,parseText,newOut,typeDisp};
}

function download(name,data,mime){

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=String(name).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_'); document.body.appendChild(a); a.click();

function hash53(str,seed=0){ // cyrb53
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function globToRe(g){
  const s=g.trim().replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*\*/g,'\u0001').replace(/\*/g,'[^/]*').replace(/\u0001/g,'.*').replace(/\?/g,'.');
  return new RegExp('^'+s+'$','i');
}
function wildRe(g){ return new RegExp('^'+g.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$','i'); }
const ORA_RESERVED=new Set('ACCESS ADD ALL ALTER AND ANY AS ASC AUDIT BETWEEN BY CHAR CHECK CLUSTER COLUMN COLUMN_VALUE COMMENT COMPRESS CONNECT CREATE CURRENT DATE DECIMAL DEFAULT DELETE DESC DISTINCT DROP ELSE EXCLUSIVE EXISTS FILE FLOAT FOR FROM GRANT GROUP HAVING IDENTIFIED IMMEDIATE IN INCREMENT INDEX INITIAL INSERT INTEGER INTERSECT INTO IS LEVEL LIKE LOCK LONG MAXEXTENTS MINUS MLSLABEL MODE MODIFY NESTED_TABLE_ID NOAUDIT NOCOMPRESS NOT NOWAIT NULL NUMBER OF OFFLINE ON ONLINE OPTION OR ORDER PCTFREE PRIOR PUBLIC RAW RENAME RESOURCE REVOKE ROW ROWID ROWNUM ROWS SELECT SESSION SET SHARE SIZE SMALLINT START SUCCESSFUL SYNONYM SYSDATE TABLE THEN TO TRIGGER UID UNION UNIQUE UPDATE USER VALIDATE VALUES VARCHAR VARCHAR2 VIEW WHENEVER WHERE WITH'.split(' '));

const tref=t=>(t.schema&&t.schema!=='(default)'?qid(t.schema)+'.':'')+qid(t.name);

const DB_NAME='schema_detective', DB_VER=3;
let db=null;
const STORES=['snapshots','tables','columns','indexes','relations','annotations','settings','sources','files','fileContents','importJobs','parseCache'];
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      const mk=(n,kp,idx)=>{
        const st=d.objectStoreNames.contains(n)?r.transaction.objectStore(n):d.createObjectStore(n,{keyPath:kp});
        (idx||[]).forEach(([nm,kpath,opt])=>{ if(!st.indexNames.contains(nm)) st.createIndex(nm,kpath,opt||{}); });
      };
      mk('snapshots','id',[['createdAt','createdAt']]);
      mk('tables','id',[['snapshotId','snapshotId'],['tableName','nameU']]);
      mk('columns','id',[]);            // 以 key 前綴（snapshotId|）範圍讀寫，免建次要索引以加速大量寫入
      mk('indexes','id',[['tableId','tableId']]);
      mk('relations','id',[['fromTable','fromTable'],['toTable','toTable']]);
      mk('annotations','key',[['tags','tags',{multiEntry:true}],['status','status']]);
      mk('settings','key');
      mk('sources','id',[['name','name']]);
      mk('files','id',[['sourceId','sourceId'],['sha256','sha256'],['snapshotId','snapshotId']]);
      mk('fileContents','fileId');
      mk('importJobs','id',[['startedAt','startedAt']]);
      mk('parseCache','id');
    };
    r.onsuccess=()=>{ db=r.result; db.onversionchange=()=>{ db.close(); toast('資料庫已在其他分頁升級，請重新整理','err'); }; res(db); };
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>toast('資料庫被其他分頁佔用，請關閉其他 Schema Detective 分頁','err');
  });
}
const reqP=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const txDone=tx=>new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('transaction aborted')); });
const prefixRange=p=>IDBKeyRange.bound(p,p+'\uffff');
const dbGet=(s,k)=>reqP(db.transaction(s).objectStore(s).get(k));
const dbAll=(s,range)=>reqP(db.transaction(s).objectStore(s).getAll(range));
const dbAllIdx=(s,idx,key)=>reqP(db.transaction(s).objectStore(s).index(idx).getAll(key));
async function dbPut(s,v){ const tx=db.transaction(s,'readwrite'); tx.objectStore(s).put(v); return txDone(tx); }
async function dbDel(s,k){ const tx=db.transaction(s,'readwrite'); tx.objectStore(s).delete(k); return txDone(tx); }
async function dbPutMany(s,arr){ const tx=db.transaction(s,'readwrite'); const st=tx.objectStore(s); for(const v of arr) st.put(v); return txDone(tx); }
async function dbDelPrefix(stores,p){ const tx=db.transaction(stores,'readwrite'); for(const s of stores) tx.objectStore(s).delete(prefixRange(p)); return txDone(tx); }
async function dbClearAll(){ const tx=db.transaction(STORES,'readwrite'); for(const s of STORES) tx.objectStore(s).clear(); return txDone(tx); }

class VList{
  constructor(el,opt){
    this.el=el; this.rowH=opt.rowH||28; this.render=opt.render; this.n=0; this.os=8; this.raf=0;
    el.classList.add('vl'); el.style.setProperty('--rh',this.rowH+'px');
    el.innerHTML='<div class="vl-sp"></div><div class="vl-in"></div>'; this.sp=el.firstChild; this.inn=el.lastChild;
    el.addEventListener('scroll',()=>this.sched());
    if(window.ResizeObserver) new ResizeObserver(()=>this.sched()).observe(el);
    if(opt.onClick) el.addEventListener('click',e=>{ const r=e.target.closest('[data-i]'); if(r&&el.contains(r)) opt.onClick(+r.dataset.i,e,r); });
    if(opt.onChange) el.addEventListener('change',e=>{ const r=e.target.closest('[data-i]'); if(r) opt.onChange(+r.dataset.i,e,r); });
  }
  setCount(n,keep){ this.n=n; this.sp.style.height=(n*this.rowH)+'px'; if(!keep) this.el.scrollTop=0; this.paint(); }
  sched(){ if(this.raf) return; this.raf=requestAnimationFrame(()=>{ this.raf=0; this.paint(); }); }
  paint(){
    if(!this.el.isConnected) return;
    const h=this.el.clientHeight||600, st=this.el.scrollTop;
    const a=Math.max(0,Math.floor(st/this.rowH)-this.os), b=Math.min(this.n,Math.ceil((st+h)/this.rowH)+this.os);
    let html=''; for(let i=a;i<b;i++) html+=this.render(i);
    this.inn.style.transform='translateY('+(a*this.rowH)+'px)'; this.inn.innerHTML=html;
  }
  scrollTo(i){ const top=i*this.rowH, h=this.el.clientHeight; if(top<this.el.scrollTop||top+this.rowH>this.el.scrollTop+h) this.el.scrollTop=Math.max(0,top-h/3); this.paint(); }
}

let SD=null, poolInst=null;
function getSD(){ if(!SD) SD=__sdFactory(); return SD; }
class Pool{
  constructor(n){
    this.size=n; this.ws=[]; this.q=[]; this.main=false; this.everOk=false;
    try{
      const code=__sdFactory.toString()+`\n;const SD=__sdFactory();
self.onmessage=function(e){const m=e.data;try{let r;
 if(m.type==='parseText'){r=SD.parseText(m.text);}
 else if(m.type==='parseStmts'){r=SD.parseStatements(m.stmts);}
 self.postMessage({id:m.id,ok:true,res:r});}catch(err){self.postMessage({id:m.id,ok:false,err:String(err&&err.message||err)});}};`;
      this.url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      for(let i=0;i<n;i++){ const w=new Worker(this.url); w.busy=false; w.onmessage=e=>this.done(w,e.data); w.onerror=e=>this.fail(w,e); this.ws.push(w); }
    }catch(err){ console.warn('Worker 無法建立，改用主執行緒',err); this.main=true; this.size=1; this.ws.forEach(w=>w.terminate()); this.ws=[]; }
    this.seq=1; this.pending=new Map();
  }
  run(msg){ return new Promise((res,rej)=>{ this.q.push({msg,res,rej}); this.pump(); }); }
  async pump(){
    if(this.main){
      while(this.q.length){ const j=this.q.shift(); await tick(); try{ const m=j.msg; const sd=getSD(); j.res(m.type==='parseText'?sd.parseText(m.text):sd.parseStatements(m.stmts)); }catch(e){ j.rej(e); } }
      return;
    }
    for(const w of this.ws){
      if(w.busy||!this.q.length) continue;
      const j=this.q.shift(); const id=this.seq++; w.busy=true; w.job=j; this.pending.set(id,w);
      w.postMessage(Object.assign({id},j.msg));
    }
  }
  done(w,d){ this.everOk=true; const j=w.job; w.busy=false; w.job=null; this.pending.delete(d.id); if(d.ok) j.res(d.res); else j.rej(new Error(d.err)); this.pump(); }
  fail(w,e){
    if(!this.everOk&&!this.main){ // Worker 被環境阻擋（例如 CSP）：改用主執行緒，並重排所有未完成工作
      console.warn('Worker 啟動失敗，改用主執行緒',e&&e.message); const jobs=this.ws.filter(x=>x.busy&&x.job).map(x=>x.job); this.main=true; this.size=1; this.ws.forEach(x=>x.terminate()); this.ws=[]; this.q=jobs.concat(this.q); this.pump(); return;
    }
    const j=w.job; w.busy=false; w.job=null; if(j) j.rej(new Error(e.message||'worker error')); this.pump();
  }
  destroy(){ this.ws.forEach(w=>w.terminate()); if(this.url) URL.revokeObjectURL(this.url); }
}
function getPool(){
  if(!poolInst){ const hc=navigator.hardwareConcurrency||4; poolInst=new Pool(Math.max(2,Math.min(8,hc-1))); }
  return poolInst;
}

function scoreDecoded(txt){
  let fffd=0,tr=0,sp=0,cjk=0;
  for(let i=0;i<txt.length;i++){

  }
  return {fffd,tr,sp,cjk};
}
function detectEncoding(u8){
  const n=u8.length;
  if(n>=3&&u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF) return {enc:'utf-8',conf:'high',note:'UTF-8 BOM'};
  if(n>=2&&u8[0]===0xFF&&u8[1]===0xFE) return {enc:'utf-16le',conf:'high',note:'UTF-16LE BOM'};
  if(n>=2&&u8[0]===0xFE&&u8[1]===0xFF) return {enc:'utf-16be',conf:'high',note:'UTF-16BE BOM'};
  const m=Math.min(n,4096); let z0=0,z1=0; for(let i=0;i<m;i++) if(u8[i]===0){ if(i&1) z1++; else z0++; }
  const half=m/2;
  if(half>8&&z1/half>0.3&&z0/half<0.05) return {enc:'utf-16le',conf:'mid',note:'無 BOM 的 UTF-16LE'};
  if(half>8&&z0/half>0.3&&z1/half<0.05) return {enc:'utf-16be',conf:'mid',note:'無 BOM 的 UTF-16BE'};
  let ascii=true; for(let i=0;i<n;i++) if(u8[i]>=0x80){ ascii=false; break; }
  if(ascii) return {enc:'utf-8',conf:'high',note:'純 ASCII'};
  try{ new TextDecoder('utf-8',{fatal:true}).decode(u8,{stream:true}); return {enc:'utf-8',conf:'high',note:'嚴格 UTF-8 驗證通過'}; }catch(e){}
  const dB=new TextDecoder('big5').decode(u8), dG=new TextDecoder('gb18030').decode(u8);
  const a=scoreDecoded(dB), b=scoreDecoded(dG);
  const sB=a.tr+0.3*a.sp-10*a.fffd, sG=b.sp+0.3*b.tr-10*b.fffd;
  let na=0; for(let i=0;i<n;i++) if(u8[i]>=0x80) na++;
  if(a.fffd/na>0.02&&b.fffd/na>0.02) return {enc:'windows-1252',conf:'low',note:'Big5/GB18030 皆有大量無法解碼字元'};
  const bigWin=sB>=sG; const best=bigWin?a:b; const diff=Math.abs(sB-sG);
  let conf='mid';
  if(best.fffd===0&&(diff>=5||(Math.max(sB,sG)>=3&&Math.min(sB,sG)<Math.max(sB,sG)/2))) conf='high';
  else if(best.fffd>0) conf='low';
  return {enc:bigWin?'big5':'gb18030',conf,note:`Big5 ${sB.toFixed(1)} / GB18030 ${sG.toFixed(1)}${best.fffd?`，U+FFFD×${best.fffd}`:''}`};
}

/* ======================= Model: accumulate parse results ======================= */
const keyOf=(schema,name)=>String(schema).toUpperCase()+'|'+String(name).toUpperCase();
class Acc{
  constructor(policy,defSchema){
    this.policy=policy; this.defSchema=defSchema; this.tables=new Map(); this.p={indexes:[],tc:[],cc:[],alters:[]};
    this.warnings=[]; this.stats={stmts:0,ignored:0}; this.dupes=0; this.unresolved=0;
  }
  warn(w){ if(this.warnings.length<2000) this.warnings.push(w); }
  addFile(f,res){
    this.stats.stmts+=res.stats.stmts; this.stats.ignored+=res.stats.ignored;
    for(const w of res.warnings) this.warn(Object.assign({file:f.path},w));
    for(const t of res.tables){
      t.schema=t.schema||this.defSchema; t.fileId=f.id; t.fileSha=f.sha||null; t.filePath=f.path; t.fileMod=f.lastModified||0; t.order=f.order||0;
      const k=keyOf(t.schema,t.name); const ex=this.tables.get(k);
      if(!ex){ this.tables.set(k,t); continue; }
      this.dupes++;
      let useNew;
      if(this.policy==='latest') useNew=t.fileMod>=ex.fileMod;
      else if(this.policy==='path') useNew=t.order<ex.order||(t.order===ex.order);
      else useNew=false;
      const dl=(ex.dupes||[]).concat([{path:t.filePath,line:t.lineStart,mod:t.fileMod}]);
      this.warn({file:f.path,line:t.lineStart,msg:`重複定義 ${t.schema}.${t.name}（${ex.filePath}:${ex.lineStart} 與 ${t.filePath}:${t.lineStart}），採用${useNew?t.filePath:ex.filePath}`,snippet:''});
      if(useNew){ t.dupes=dl.concat([{path:ex.filePath,line:ex.lineStart,mod:ex.fileMod}]); this.tables.set(k,t); }
      else ex.dupes=dl;
    }
    for(const x of res.indexes) this.p.indexes.push(Object.assign(x,{file:f.path}));
    for(const x of res.tcomments) this.p.tc.push(x);
    for(const x of res.ccomments) this.p.cc.push(x);
    for(const x of res.alters) this.p.alters.push(x);
  }
  finalize(){
    const byName=new Map();
    for(const [k,t] of this.tables){ const u=t.name.toUpperCase(); if(!byName.has(u)) byName.set(u,[]); byName.get(u).push(t); }
    const resolve=(schema,name)=>{
      if(schema){ const x=this.tables.get(keyOf(schema,name)); if(x) return x; const l=byName.get(String(name).toUpperCase()); return l&&l.length===1&&(l[0].schema===this.defSchema)?l[0]:null; }
      const l=byName.get(String(name).toUpperCase()); if(!l) return null; return l[0];
    };
    const miss=(kind,x)=>{ this.unresolved++; this.warn({file:x.file||'',line:x.line||0,msg:`${kind} 找不到對應資料表 ${x.schema?x.schema+'.':''}${x.table}`,snippet:''}); };
    const colMap=t=>{ if(!t._cm){ t._cm=new Map(); for(const c of t.columns) t._cm.set(c.name.toUpperCase(),c); } return t._cm; };
    const colOf=(t,name)=>colMap(t).get(String(name).toUpperCase());
    for(const a of this.p.alters){
      const t=resolve(a.schema,a.table); if(!t){ miss('ALTER TABLE',a); continue; }
      if(a.kind==='pk'){ t.pk=a.cols; t.pkName=a.name; }
      else if(a.kind==='uk') t.uks.push({name:a.name,cols:a.cols});
      else if(a.kind==='fk') t.fks.push({name:a.name,cols:a.cols,refSchema:a.refSchema,refTable:a.refTable,refCols:a.refCols});
      else if(a.kind==='check'){ t.checks.push({name:a.name,expr:a.expr,notnull:a.notnull}); if(a.notnull){ const c=colOf(t,a.notnull); if(c) c.nullable=false; } }
      else if(a.kind==='nullable'){ const c=colOf(t,a.column); if(c) c.nullable=a.nullable; }
      else if(a.kind==='addcol'){ if(!colOf(t,a.col.name)){ t.columns.push(a.col); colMap(t).set(a.col.name.toUpperCase(),a.col); } }
    }
    for(const c of this.p.tc){ const t=resolve(c.schema,c.table); if(t) t.comment=c.text; else miss('COMMENT ON TABLE',c); }
    for(const c of this.p.cc){ const t=resolve(c.schema,c.table); if(!t){ miss('COMMENT ON COLUMN',c); continue; } const col=colOf(t,c.column); if(col) col.comment=c.text; else this.warn({file:'',line:0,msg:`COMMENT ON COLUMN 找不到欄位 ${t.name}.${c.column}`,snippet:''}); }
    for(const x of this.p.indexes){ const t=resolve(x.schema,x.table); if(!t){ miss('CREATE INDEX',x); continue; } (t.indexes=t.indexes||[]); if(!t.indexes.some(i=>i.name===x.name)) t.indexes.push({name:x.name,cols:x.cols,unique:x.unique}); }
    const out=[];
    for(const t of this.tables.values()){
      t.indexes=t.indexes||[]; delete t._cm;
      const pkSet=new Set(t.pk.map(x=>x.toUpperCase()));
      const ixSet=new Set(); t.indexes.forEach(i=>i.cols.forEach(c=>ixSet.add(String(c).toUpperCase())));
      t.columns.forEach((c,i)=>{ c.pos=i+1; c.pk=pkSet.has(c.name.toUpperCase()); c.idx=ixSet.has(c.name.toUpperCase())||c.pk; });
      out.push(t);
      if(!t.columns.length) this.warn({file:t.filePath,line:t.lineStart,msg:`資料表 ${t.schema}.${t.name} 沒有解析到任何欄位`,snippet:''});
    }
    out.sort((a,b)=>a.schema.localeCompare(b.schema)||a.name.localeCompare(b.name));
    return out;
  }
}
function structHash(t){
  const parts=t.columns.map(c=>[c.name,c.type,c.nullable?1:0,c.def||'',c.pk?1:0,c.comment||''].join('\u0001'));
  parts.push('PK:'+t.pk.join(','));
  parts.push('IX:'+(t.indexes||[]).map(i=>i.name+':'+i.cols.join(',')+':'+(i.unique?1:0)).sort().join(';'));
  parts.push('TC:'+(t.comment||''));
  return hash53(parts.join('\u0002'));
}

function annText(a){ return a?[a.businessName,a.meaning,(a.tags||[]).join(' '),a.knownIssues,(a.sourceMeaning||[]).map(x=>x.source+' '+x.meaning).join(' ')].filter(Boolean).join(' '):''; }
function colHay(t,c){ const a=S.ann.get(annKey(t,c)); return (t.name+' '+c.name+' '+(t.comment||'')+' '+(c.comment||'')+' '+c.type+' '+annText(a)).toLowerCase(); }
function buildModel(tbs,colSets,ixSets,snapId){

  for(const t of tbs){ t.cols=[]; t.indexes=[]; byId.set(t.id,t); }
  for(const rec of colSets){
    const t=byId.get(rec.id); if(!t) continue;
    t.cols=rec.cols.map(x=>({id:t.id+'|'+x.n,tableId:t.id,columnName:x.n,columnNameUpper:x.n.toUpperCase(),pos:x.p,type:x.ty,dtype:x.dt,length:x.l,precision:x.pr,scale:x.s,unit:x.u,nullable:x.nl,def:x.d,pk:x.pk,idx:x.ix,comment:x.cm||''}));
  }

  tbs.sort((a,b)=>a.schema.localeCompare(b.schema)||a.name.localeCompare(b.name));

const BIG_FILE=4*1024*1024;

  a.tables.push(...b.tables); a.indexes.push(...b.indexes); a.tcomments.push(...b.tcomments); a.ccomments.push(...b.ccomments); a.alters.push(...b.alters);

}
async function parseStream(file,enc,job,pool){
  const sd=getSD(); const sp=new sd.Splitter(); const dec=new TextDecoder(enc,{fatal:false});
  const reader=file.stream().getReader(); const total=sd.newOut(); let batch=[]; const inflight=[]; let bad=0; const parts=[]; let seq=0;
  const flush=()=>{ if(!batch.length) return; const stmts=batch, my=seq++; batch=[]; inflight.push(pool.run({type:'parseStmts',stmts}).then(r=>{ parts[my]=r; })); };
  for(;;){
    const {done,value}=await reader.read();
    if(job.cancel){ try{ reader.cancel(); }catch(e){} break; }
    const text=done?dec.decode():dec.decode(value,{stream:true});
    if(text.indexOf('\uFFFD')>=0) bad+=countBad(text).n;
    const stmts=sp.feed(text,done); for(const s of stmts) batch.push(s);
    if(value) job.bytesDone+=value.length;
    if(batch.length>=50) flush();
    while(inflight.length>=pool.size*2) await inflight.shift();
    if(done) break;
  }
  flush(); await Promise.all(inflight);

class BatchWriter{
  constructor(n){ this.n=n; this.buf=[]; this.cnt=0; this.chain=Promise.resolve(); this.error=null; }
  add(store,val){ this.buf.push([store,val]); if(store==='files') this.cnt++; }
  async maybeFlush(){ if(this.cnt>=this.n) await this.flush(); }
  flush(){
    const items=this.buf; this.buf=[]; this.cnt=0; if(!items.length) return this.chain;
    this.chain=this.chain.then(()=>{ const stores=[...new Set(items.map(x=>x[0]))]; const tx=db.transaction(stores,'readwrite'); for(const [s,v] of items) tx.objectStore(s).put(v); return txDone(tx); }).catch(err=>{ if(!this.error) this.error=err; });

function scanFilter(o){
  const exts=(o.exts||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const ex=(o.exclude||'').split(',').map(s=>s.trim()).filter(Boolean).map(g=>({g,re:globToRe(g),path:g.includes('/')}));
  const nf=(o.nameFilter||'').split(',').map(s=>s.trim()).filter(Boolean).map(g=>g.includes('*')||g.includes('?')?globToRe(g):new RegExp(g.replace(/[.+^${}()|[\]\\]/g,'\\$&'),'i'));
  return {
    dirOk:p=>!ex.some(x=>x.path?x.re.test(p):p.split('/').some(seg=>x.re.test(seg))),
    fileOk:p=>{
      if(ex.some(x=>x.path?x.re.test(p):p.split('/').some(seg=>x.re.test(seg)))) return false;
      const name=p.split('/').pop().toLowerCase(); const dot=name.lastIndexOf('.'); const ext=dot>=0?name.slice(dot):'';
      if(exts.length&&!exts.includes(ext)) return false;
      if(nf.length&&!nf.some(r=>r.test(name))) return false;
      return true;
    }
  };
}
async function walkHandle(dir,base,o,flt,out,prog){
  for await(const [name,h] of dir.entries()){
    const p=base+name;
    if(h.kind==='directory'){ if(o.recursive&&flt.dirOk(p)) await walkHandle(h,p+'/',o,flt,out,prog); }
    else if(flt.fileOk(p)){ out.push({path:p,handle:h}); prog&&prog(out.length); }
  }
}
async function walkEntry(entry,base,o,flt,out){
  if(entry.isFile){ const p=base+entry.name; if(flt.fileOk(p)) out.push({path:p,entry}); }
  else if(entry.isDirectory){
    const p=base+entry.name; if(base&&!flt.dirOk(p)) return;
    if(base&&!o.recursive) return;
    const rd=entry.createReader(); let all=[];
    for(;;){ const part=await new Promise((res,rej)=>rd.readEntries(res,rej)); if(!part.length) break; all=all.concat(part); }
    for(const ch of all) await walkEntry(ch,p+'/',o,flt,out);
  }
}
async function resolveFiles(list,maxBytes,prog){
  const out=[]; let i=0, skipped=0;
  const worker=async()=>{ while(i<list.length){ const it=list[i++]; try{ const f=it.file||(it.handle?await it.handle.getFile():await new Promise((res,rej)=>it.entry.file(res,rej)));
    if(f.size>maxBytes){ skipped++; continue; }
    out.push({path:it.path,file:f,size:f.size,lastModified:f.lastModified,include:true,enc:'auto'}); }catch(e){ skipped++; } if(prog&&i%25===0) prog(i); } };
  await Promise.all(Array.from({length:8},worker)); out.sort((a,b)=>a.path.localeCompare(b.path)); out.skipped=skipped; return out;
}
function trimToLines(u8,isHead,isTail){
  let a=0,b=u8.length;
  if(!isHead){ while(a<b&&u8[a]!==10) a++; a++; }          // 0x0A 在 Big5/GBK/UTF-8 中不會是尾位元組，可安全重新對齊
  if(!isTail){ while(b>a&&u8[b-1]!==10) b--; }
  return a<b?u8.subarray(a,b):new Uint8Array(0);
}
async function detectFile(file){
  const SZ=file.size, C=196608;
  if(SZ<=C*2) return detectEncoding(new Uint8Array(await file.arrayBuffer()));
  const head=new Uint8Array(await file.slice(0,C).arrayBuffer());
  const h=detectEncoding(head); if(/BOM/.test(h.note||'')||h.enc==='utf-16le'||h.enc==='utf-16be') return h;
  const parts=[head]; const spots=[0.35,0.7]; 
  for(const f of spots){ const st=Math.floor(SZ*f); parts.push(trimToLines(new Uint8Array(await file.slice(st,st+65536).arrayBuffer()),false,false)); }
  parts.push(trimToLines(new Uint8Array(await file.slice(SZ-C,SZ).arrayBuffer()),false,true));
  const sep=new Uint8Array([10]); let tot=0; parts.forEach(p=>tot+=p.length+1); const all=new Uint8Array(tot); let o=0; for(const p of parts){ all.set(p,o); o+=p.length; all[o++]=10; }
  const r=detectEncoding(all); r.note=(r.note||'')+'（多段取樣）'; return r;
}
async function detectAll(entries,prog){
  let i=0; const worker=async()=>{ while(i<entries.length){ const e=entries[i++]; try{ e.detected=await detectFile(e.file); }catch(err){ e.detected={enc:'utf-8',conf:'low',note:'讀取失敗'}; } if(prog&&i%25===0) prog(i); } };
  await Promise.all(Array.from({length:8},worker));
}

    S.vl.tree=new VList($('#treeList'),{rowH:28,render:i=>{
      const r=S.treeRows[i];
      if(r.k==='h') return `<div class="r h">${esc(r.text)}</div>`;
      if(r.k==='s') return `<div class="r sh" data-i="${i}">${r.open?'▾':'▸'} ${esc(r.schema)} <span class="badge">${r.count}</span></div>`;
      if(r.k==='g') return `<div class="r gh" data-i="${i}">${r.open?'▾':'▸'} ${esc(r.text)} <span class="badge">${r.count}</span></div>`;
      const t=r.t; const sel=S.curTable===t;
      return `<div class="r tt ${r.nog?'nog':''} ${sel?'sel':''}" data-i="${i}" title="${esc(t.comment||'')}"><span class="t">${esc(t.name)}</span><span class="muted" style="margin-left:auto">${t.columnCount}</span></div>`;
    },onClick:i=>{
      const r=S.treeRows[i]; if(!r) return;
      if(r.k==='s'||r.k==='g'){ S.treeState.set(r.key,!r.open); renderTree(true); }
      else if(r.k==='t') selectTable(r.t);
    }});
  }
  const keep=arguments[0]===true;
  S.treeRows=buildTreeRows(); S.vl.tree.setCount(S.treeRows.length,keep);
}
function selectTable(t,col,fromHash){
  S.curTable=t; S.curCol=col||null;
  const k=keyOf(t.schema,t.name); const rec=[k].concat(getSet('recents').filter(x=>x!==k)).slice(0,12); setSet('recents',rec);
  if(!fromHash) setHash('#/table/'+encodeURIComponent(t.schema)+'/'+encodeURIComponent(t.name)+(col?'?col='+encodeURIComponent(col.name):''));
  if(S.tab!=='explorer') showTab('explorer',true);
  S.vl.tree&&S.vl.tree.paint(); renderTable(); renderDetail();
  if(S.treeRows){ const i=S.treeRows.findIndex(r=>r.k==='t'&&r.t===t); if(i>=0&&S.vl.tree) S.vl.tree.scrollTo(i); }
}

/* ======================= Search ======================= */
function parseQuery(q){
  const o={exact:[],type:[],table:[],schema:[],tag:[],text:[]};
  for(const raw of q.trim().split(/\s+/).filter(Boolean)){
    const lo=raw.toLowerCase();
    if(raw[0]==='='&&raw.length>1) o.exact.push(raw.slice(1).toUpperCase());
    else if(lo.startsWith('type:')&&raw.length>5) o.type.push(raw.slice(5).toUpperCase());
    else if(lo.startsWith('table:')&&raw.length>6) o.table.push(wildRe(raw.slice(6)));
    else if(lo.startsWith('schema:')&&raw.length>7) o.schema.push(wildRe(raw.slice(7)));
    else if(lo.startsWith('tag:')&&raw.length>4) o.tag.push(raw.slice(4).toLowerCase());
    else o.text.push(lo);
  }
  return o;
}
function doSearch(q){
  const M=S.M; const o=parseQuery(q); const res={q,tables:[],cols:[],o,capped:false};
  if(!M) return res;
  const tOk=t=>o.table.every(r=>r.test(t.name))&&o.schema.every(r=>r.test(t.schema));
  const hasCol=o.exact.length||o.type.length||o.tag.length||o.text.length;
  if(!hasCol){ for(const t of M.tables) if(tOk(t)) res.tables.push(t); return res; }
  if(!o.exact.length&&!o.type.length&&!o.tag.length){
    for(const t of M.tables){ if(!tOk(t)) continue; const h=(t.name+' '+(t.comment||'')).toLowerCase(); if(o.text.every(x=>h.includes(x))) res.tables.push(t); }
  }
  const cap=100000;
  for(const {t,c} of M.flat){
    if(!tOk(t)) continue;
    if(o.exact.length&&!o.exact.every(x=>c.columnNameUpper===x)) continue;
    if(o.type.length&&!o.type.every(x=>c.dtype.toUpperCase().includes(x)||c.type.toUpperCase().includes(x))) continue;
    if(o.tag.length){ const a=S.ann.get(annKey(t,c)); if(!a||!o.tag.every(x=>(a.tags||[]).some(g=>g.toLowerCase().includes(x)))) continue; }
    if(o.text.length&&!o.text.every(x=>c.h.includes(x))) continue;
    res.cols.push({t,c}); if(res.cols.length>=cap){ res.capped=true; break; }
  }
  return res;
}
function runSearchUI(){
  const q=$('#search').value; if(!q.trim()) return;
  const t0=performance.now(); const r=doSearch(q); r.ms=performance.now()-t0; S.searchRes=r;
  r.rows=r.tables.map(t=>({k:'t',t})).concat(r.cols.map(x=>({k:'c',t:x.t,c:x.c})));
  let sum=`<b>${r.tables.length.toLocaleString()}</b> 張表、<b>${r.cols.length.toLocaleString()}</b> 個欄位符合 <span class="muted">（${r.ms.toFixed(0)} ms${r.capped?'，已截斷於 100,000 筆':''}）</span>`;
  if(r.o.exact.length&&r.cols.length){
    const m=new Map(); r.cols.forEach(x=>m.set(x.c.type,(m.get(x.c.type)||0)+1)); const vs=[...m.entries()].sort((a,b)=>b[1]-a[1]);
    sum+=`<div style="margin-top:6px">出現於 <b>${new Set(r.cols.map(x=>x.t)).size}</b> 張表；型態分布：${vs.map(([k,n])=>`<span class="badge ${vs.length>1?'warn':'ok'}">${esc(k)} ×${n}</span>`).join(' ')} ${vs.length>1?'<span class="badge err">⚠ 型態／長度不一致</span>':'<span class="badge ok">✔ 一致</span>'}</div>`;
  }
  $('#searchSum').innerHTML=sum;
  if(!S.vl.search){
    S.vl.search=new VList($('#searchList'),{rowH:30,render:i=>{
      const x=S.searchRes.rows[i];
      if(x.k==='t') return `<div class="r" data-i="${i}"><span class="badge ac">表</span><b>${esc(x.t.schema)}.${esc(x.t.name)}</b><span class="muted t">${esc(x.t.comment||'')}</span></div>`;
      return `<div class="r" data-i="${i}"><span class="mono">${esc(x.t.name)}.<b>${esc(x.c.columnName)}</b></span><span class="mono muted">${esc(x.c.type)}</span>${x.c.pk?'<span class="badge">PK</span>':''}<span class="t muted">${esc(x.c.comment)}</span></div>`;
    },onClick:i=>{ const x=S.searchRes.rows[i]; selectTable(x.t,x.c||null); }});
  }
  S.vl.search.setCount(r.rows.length);
}

/* ======================= Diff ======================= */
function diffTable(a,b){
  const ch=[]; const ma=new Map(a.cols.map(c=>[c.columnNameUpper,c])), mb=new Map(b.cols.map(c=>[c.columnNameUpper,c]));
  for(const c of b.cols){
    const x=ma.get(c.columnNameUpper);
    if(!x){ ch.push({k:'c+',c,text:`+ 欄位 ${c.columnName}  ${c.type}${c.nullable?'':' NOT NULL'}${c.def?' DEFAULT '+c.def:''}`}); continue; }
    if(x.type!==c.type) ch.push({k:'c~',c,old:x,what:'type',text:`~ ${c.columnName}  型態 ${x.type} → ${c.type}`});
    if(x.nullable!==c.nullable) ch.push({k:'c~',c,old:x,what:'null',text:`~ ${c.columnName}  Nullable ${x.nullable?'NULL':'NOT NULL'} → ${c.nullable?'NULL':'NOT NULL'}`});
    if((x.def||'')!==(c.def||'')) ch.push({k:'c~',c,old:x,what:'def',text:`~ ${c.columnName}  Default ${x.def||'(無)'} → ${c.def||'(無)'}`});
    if((x.comment||'')!==(c.comment||'')) ch.push({k:'cm',c,old:x,text:`# ${c.columnName}  註解「${x.comment||''}」→「${c.comment||''}」`});
  }
  for(const c of a.cols) if(!mb.has(c.columnNameUpper)) ch.push({k:'c-',c,text:`- 欄位 ${c.columnName}  ${c.type}`});
  if(a.pk.join(',')!==b.pk.join(',')) ch.push({k:'pk',text:`⚿ PK (${a.pk.join(',')||'無'}) → (${b.pk.join(',')||'無'})`});
  const ia=new Map(a.indexes.map(i=>[i.name,i])), ib=new Map(b.indexes.map(i=>[i.name,i]));
  for(const [n,i] of ib){ const x=ia.get(n); if(!x) ch.push({k:'ix',text:`⚿ 新增索引 ${n} (${i.cols.join(',')})`}); else if(x.cols.join(',')!==i.cols.join(',')||x.unique!==i.unique) ch.push({k:'ix',text:`⚿ 索引 ${n} (${x.cols.join(',')}) → (${i.cols.join(',')})`}); }
  for(const [n,i] of ia) if(!ib.has(n)) ch.push({k:'ix',text:`⚿ 移除索引 ${n} (${i.cols.join(',')})`});
  if((a.comment||'')!==(b.comment||'')) ch.push({k:'cm',tbl:true,val:b.comment||'',text:`# 表註解「${a.comment||''}」→「${b.comment||''}」`});
  return ch;
}
function diffModels(A,B){
  const r={added:[],removed:[],changed:[],same:0,skippedByHash:0};
  for(const [k,tb] of B.byKey){
    const ta=A.byKey.get(k);
    if(!ta) r.added.push(tb);
    else if(ta.structHash===tb.structHash){ r.same++; r.skippedByHash++; }
    else{ const ch=diffTable(ta,tb); if(ch.length) r.changed.push({a:ta,b:tb,changes:ch}); else r.same++; }
  }
  for(const [k,ta] of A.byKey) if(!B.byKey.has(k)) r.removed.push(ta);
  return r;
}
const clsOf={'c+':'add','c-':'del','c~':'chg','cm':'cm','pk':'ix','ix':'ix'};
function diffLines(r){
  const L=[];
  r.added.forEach(t=>L.push({cls:'add hd',text:`[+] 新增資料表 ${t.schema}.${t.name}（${t.columnCount} 欄）`}));
  r.removed.forEach(t=>L.push({cls:'del hd',text:`[-] 刪除資料表 ${t.schema}.${t.name}（${t.columnCount} 欄）`}));
  r.changed.forEach(x=>{ L.push({cls:'hd',text:`[~] ${x.b.schema}.${x.b.name}　（${x.changes.length} 項差異）`}); x.changes.forEach(c=>L.push({cls:clsOf[c.k]||'',text:'    '+c.text})); });
  return L;
}
function alterDraft(r){
  const o=['-- ALTER 草稿（僅供參考，請人工審閱後再使用）'];
  r.added.forEach(t=>o.push(`-- [新增表] ${tref(t)}：請使用完整 CREATE TABLE`));
  r.removed.forEach(t=>o.push(`-- [刪除表] DROP TABLE ${tref(t)};  -- 請人工確認`));
  r.changed.forEach(x=>{
    const T=tref(x.b);
    x.changes.forEach(c=>{
      if(c.k==='c+') o.push(`ALTER TABLE ${T} ADD (${qid(c.c.columnName)} ${c.c.type}${c.c.def?' DEFAULT '+c.c.def:''}${c.c.nullable?'':' NOT NULL'});`);
      else if(c.k==='c-') o.push(`ALTER TABLE ${T} DROP COLUMN ${qid(c.c.columnName)};`);
      else if(c.k==='c~'){ if(c.what==='type') o.push(`ALTER TABLE ${T} MODIFY (${qid(c.c.columnName)} ${c.c.type});`); else if(c.what==='null') o.push(`ALTER TABLE ${T} MODIFY (${qid(c.c.columnName)} ${c.c.nullable?'NULL':'NOT NULL'});`); else o.push(`ALTER TABLE ${T} MODIFY (${qid(c.c.columnName)} DEFAULT ${c.c.def||'NULL'});`); }
      else if(c.k==='cm'&&c.tbl) o.push(`COMMENT ON TABLE ${T} IS '${String(c.val).replace(/'/g,"''")}';`);
      else if(c.k==='cm'&&c.c) o.push(`COMMENT ON COLUMN ${T}.${qid(c.c.columnName)} IS '${String(c.c.comment||'').replace(/'/g,"''")}';`);
      else if(c.k==='pk'||c.k==='ix') o.push('-- '+c.text);
    });
  });
  return o.join('\n');
}

async function runDiff(){

function diffMarkdown(){
  const r=S.diff.r, sa=S.snapshots.find(s=>s.id===S.diff.a), sb=S.snapshots.find(s=>s.id===S.diff.b);
  const o=[`# Schema 變更報告`,``,`- 舊版 A：${sa?sa.name:''}`,`- 新版 B：${sb?sb.name:''}`,`- 新增表 ${r.added.length}／刪除表 ${r.removed.length}／變更表 ${r.changed.length}／未變 ${r.same}`,``];
  if(r.added.length){ o.push('## 新增資料表',''); r.added.forEach(t=>o.push(`- ${t.schema}.${t.name}（${t.columnCount} 欄）`)); o.push(''); }
  if(r.removed.length){ o.push('## 刪除資料表',''); r.removed.forEach(t=>o.push(`- ${t.schema}.${t.name}`)); o.push(''); }
  if(r.changed.length){ o.push('## 變更資料表',''); r.changed.forEach(x=>{ o.push(`### ${x.b.schema}.${x.b.name}`,''); x.changes.forEach(c=>o.push('- `'+c.text.replace(/`/g,"'")+'`')); o.push(''); }); }
  return o.join('\n');
}

function bindDrop(){
  const dz=$('#dz'); if(!dz) return;
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop',async e=>{
    e.preventDefault();
    const items=Array.from(e.dataTransfer.items||[]).filter(i=>i.kind==='file');
    const picked=items.map(it=>({entry:it.webkitGetAsEntry?it.webkitGetAsEntry():null,hp:it.getAsFileSystemHandle?it.getAsFileSystemHandle():null}));
    const files=Array.from(e.dataTransfer.files||[]);
    try{
      if(picked.length===1&&picked[0].entry&&picked[0].entry.isDirectory){
        const h=picked[0].hp?await picked[0].hp:null;
        if(h&&h.kind==='directory') return registerAndScan(h);
        return scanEntryDir(picked[0].entry);
      }
      const list=[]; for(const p of picked){ if(p.entry&&p.entry.isDirectory){ await walkEntry(p.entry,'',Object.assign({},scanOpts(),{recursive:true}),scanFilter(scanOpts()),list); } else if(p.entry) list.push({path:p.entry.name,entry:p.entry}); }
      if(!list.length) files.forEach(f=>list.push({path:f.name,file:f}));
      await startPreview({id:'files',name:'手動選擇的檔案',persist:false},list);
    }catch(err){ toast('讀取拖放內容失敗：'+err.message,'err'); }
  });
}

    else if(t.id==='inDir'){
      const fl=Array.from(t.files); if(!fl.length) return; const root=fl[0].webkitRelativePath.split('/')[0]; const o=scanOpts(); const flt=scanFilter(o);
      const list=[]; for(const f of fl){ const p=f.webkitRelativePath.split('/').slice(1).join('/'); if(!o.recursive&&p.includes('/')) continue; if(flt.fileOk(p)) list.push({path:p,file:f}); }
      t.value=''; await startPreview({id:'dir:'+root,name:root,handle:null,persist:true,defaultEnc:'auto'},list);
    }
    else if(t.id==='inFiles'){ const fl=Array.from(t.files); t.value=''; await startPreview({id:'files',name:'手動選擇的檔案',persist:false},fl.map(f=>({path:f.name,file:f}))); }
  });
  box.addEventListener('input',e=>{
    if(e.target.id==='pvFilter'){ S.preview.filter=e.target.value; clearTimeout(S._pvT); S._pvT=setTimeout(()=>{ previewView(); S.vl.prev.setCount(S.preview.view.length); },150); }

    else if(e.target.dataset&&e.target.dataset.opt==='name') S.impOpts.name=e.target.value;
  });

async function loadRelations(){ S.rel=new Map((await dbAll('relations')).map(r=>[r.id,r])); }
const relId=(a,b)=>{ const x=keyOf(a.schema,a.name),y=keyOf(b.schema,b.name); return x<y?x+'>'+y:y+'>'+x; };
function excludeSet(){ return new Set(getSet('excludeCols').map(x=>x.toUpperCase())); }
function getClusters(){
  const M=S.M; if(!M) return []; const ex=excludeSet(); const key=[...ex].join(',');
  if(M._cl&&M._clKey===key) return M._cl;
  const rows=[]; for(const [name,list] of M.colIndex){ if(ex.has(name)||list.length<2) continue; const v=new Map(); list.forEach(x=>v.set(x.c.type,(v.get(x.c.type)||0)+1)); rows.push({name,count:list.length,variants:[...v.entries()].sort((a,b)=>b[1]-a[1]),bad:v.size>1}); }
  rows.sort((a,b)=>(b.bad-a.bad)||(b.count-a.count)||a.name.localeCompare(b.name)); M._cl=rows; M._clKey=key; return rows;
}
function relatedTo(t){
  const M=S.M, ex=excludeSet(); const map=new Map();
  const add=(o,col,oc,conf)=>{ const k=keyOf(o.schema,o.name); let e=map.get(k); if(!e){ e={t:o,pairs:[],conf:conf,pkHit:false}; map.set(k,e); } e.pairs.push([col,oc]); const rank={High:3,Medium:2,Low:1}; if(rank[conf]>rank[e.conf]) e.conf=conf; };
  for(const f of t.fks||[]){ const o=M.byKey.get(keyOf(f.refSchema||t.schema,f.refTable)); if(o) f.cols.forEach((cn,i)=>{ add(o,{columnName:cn,type:''},{columnName:f.refCols[i]||cn,type:''},'High'); }); }
  for(const o of M.tables) for(const f of o.fks||[]) if(o!==t&&(f.refTable||'').toUpperCase()===t.nameU) f.cols.forEach((cn,i)=>add(o,{columnName:f.refCols[i]||cn,type:''},{columnName:cn,type:''},'High'));
  for(const c of t.cols){
    if(ex.has(c.columnNameUpper)) continue;
    const l=M.colIndex.get(c.columnNameUpper)||[]; if(l.length>400&&!c.pk) continue;
    for(const {t:o,c:oc} of l){ if(o===t) continue; const same=oc.type===c.type; const suf=/_(ID|NO|CODE)$/.test(c.columnNameUpper);
      if(same){ add(o,c,oc,'Medium'); if(c.pk||oc.pk){ const e=map.get(keyOf(o.schema,o.name)); e.pkHit=true; } } else if(suf&&oc.dtype===c.dtype) add(o,c,oc,'Low'); }
  }
  const rank={High:3,Medium:2,Low:1}; const arr=[...map.values()];
  arr.forEach(e=>{ const st=S.rel.get(relId(t,e.t)); e.status=st?st.status:''; });
  arr.sort((a,b)=>((b.status==='confirmed')-(a.status==='confirmed'))||((a.status==='rejected')-(b.status==='rejected'))||(rank[b.conf]-rank[a.conf])||(b.pkHit-a.pkHit)||(b.pairs.length-a.pairs.length)||a.t.name.localeCompare(b.t.name));
  return arr;
}

   <td><button data-rel="confirmed" data-o="${esc(keyOf(e.t.schema,e.t.name))}">✔ 確認</button> <button data-rel="rejected" data-o="${esc(keyOf(e.t.schema,e.t.name))}">✖ 否決</button></td></tr>`).join('')}</table></div>`;

async function setRel(oKey,status){
  const t=S.curTable, o=S.M.byKey.get(oKey); if(!t||!o) return; const id=relId(t,o);
  const pairs=(relatedTo(t).find(e=>e.t===o)||{pairs:[]}).pairs.map(p=>p[0].columnName);
  const r={id,fromTable:id.split('>')[0],toTable:id.split('>')[1],status,cols:pairs,at:Date.now()}; await dbPut('relations',r); S.rel.set(id,r); renderTableRel(t); renderConfirmed();

/* ======================= SQL helper ======================= */
S.sql={t:null,sel:new Set(),tpl:'select',join:null};
function sqlParamsCond(t,alias){
  const names=new Set(t.cols.map(c=>c.columnNameUpper)); const w=[];
  if(getSet('sqlSsSeq')&&names.has('SS_SEQ')) w.push(`${alias}.SS_SEQ = :SS_SEQ`);
  if(getSet('sqlDatadate')&&names.has('DATADATE')) w.push(`${alias}.DATADATE = :DATADATE`);
  return w;
}
function genSQL(){
  const t=S.sql.t; if(!t) return '-- 請先選擇資料表'; const T=tref(t); const sel=t.cols.filter(c=>S.sql.sel.has(c.columnName)); const cols=sel.length?sel:t.cols;
  const w=sqlParamsCond(t,'t'); const where=w.length?'\nWHERE '+w.join('\n  AND '):''; const and=w.length?'\n  AND ':'\nWHERE ';
  const lob=c=>/LOB|LONG|RAW|XML/.test(c.dtype);
  switch(S.sql.tpl){
    case 'select': return `SELECT\n${cols.map(c=>'  t.'+qid(c.columnName)).join(',\n')}\nFROM ${T} t${where};`;
    case 'profile': { const cs=cols.filter(c=>!lob(c)); if(!cs.length) return '-- 沒有可分析的欄位'; return cs.map(c=>`SELECT '${c.columnName.replace(/'/g,"''")}' AS COLUMN_NAME,\n       COUNT(*) AS TOTAL_CNT,\n       COUNT(t.${qid(c.columnName)}) AS NOT_NULL_CNT,\n       COUNT(*) - COUNT(t.${qid(c.columnName)}) AS NULL_CNT,\n       COUNT(DISTINCT t.${qid(c.columnName)}) AS DISTINCT_CNT,\n       TO_CHAR(MIN(t.${qid(c.columnName)})) AS MIN_VAL,\n       TO_CHAR(MAX(t.${qid(c.columnName)})) AS MAX_VAL\nFROM ${T} t${where}`).join('\nUNION ALL\n')+';'; }
    case 'top': return cols.filter(c=>!lob(c)).map(c=>`-- ${c.columnName} 值分布 Top 20\nSELECT t.${qid(c.columnName)} AS VAL, COUNT(*) AS CNT\nFROM ${T} t${where}\nGROUP BY t.${qid(c.columnName)}\nORDER BY CNT DESC\nFETCH FIRST 20 ROWS ONLY;`).join('\n\n');
    case 'pkdup': { if(!t.pk.length) return '-- 此資料表沒有 PK，請自行選擇欄位（改用「SELECT」範本並加入 GROUP BY）'; const p=t.pk.map(x=>'t.'+qid(x)); return `SELECT ${p.join(', ')}, COUNT(*) AS DUP_CNT\nFROM ${T} t${where}\nGROUP BY ${p.join(', ')}\nHAVING COUNT(*) > 1\nORDER BY DUP_CNT DESC;`; }
    case 'len': { const cs=cols.filter(c=>/CHAR|CLOB/.test(c.dtype)); if(!cs.length) return '-- 選取的欄位中沒有字元型態欄位'; return cs.map(c=>`-- ${c.columnName} 長度分布（例如統編是否為 8 碼）\nSELECT LENGTH(TRIM(t.${qid(c.columnName)})) AS LEN, COUNT(*) AS CNT\nFROM ${T} t${where}\nGROUP BY LENGTH(TRIM(t.${qid(c.columnName)}))\nORDER BY LEN;`).join('\n\n'); }
    case 'join': {
      const o=S.sql.join; if(!o) return '-- 請於右側選擇要 JOIN 的資料表'; const ex=excludeSet(); const rel=S.rel.get(relId(t,o)); let pairs=[];
      if(rel&&rel.cols&&rel.cols.length) pairs=rel.cols.filter(n=>t.cols.some(c=>c.columnName===n)&&o.cols.some(c=>c.columnName===n));
      if(!pairs.length) pairs=t.cols.filter(c=>!ex.has(c.columnNameUpper)&&o.cols.some(x=>x.columnNameUpper===c.columnNameUpper)).map(c=>c.columnName);
      if(!pairs.length) return `-- ${t.name} 與 ${o.name} 沒有同名欄位可作為 JOIN 條件，請自行指定`;
      const ow=sqlParamsCond(o,'b');
      return `SELECT a.*, b.*\nFROM ${T} a\nJOIN ${tref(o)} b\n  ON ${pairs.map(n=>`a.${qid(n)} = b.${qid(n)}`).join('\n AND ')}\nWHERE 1 = 1${sqlParamsCond(t,'a').map(x=>'\n  AND '+x).join('')}${ow.map(x=>'\n  AND '+x).join('')};\n-- JOIN 條件依${rel&&rel.status==='confirmed'?'已確認關聯':'同名欄位推測'}產生，請人工確認`;
    }
  }
  return '';
}

  if(!S.sql.t||!S.M.tables.includes(S.sql.t)) S.sql.t=S.curTable&&S.M.tables.includes(S.curTable)?S.curTable:null;

function bindSqlEvents(){
  const box=$('#sqlBox');
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='sqT'){ const v=t.value.trim().toUpperCase(); const f=S.M.tables.find(x=>(x.schema+'.'+x.name).toUpperCase()===v)||S.M.tables.find(x=>x.nameU===v); if(f){ S.sql.t=f; S.sql.sel=new Set(); renderSQL(); } else toast('找不到資料表','err'); }
    else if(t.id==='sqJ'){ const v=t.value.trim().toUpperCase(); S.sql.join=S.M.tables.find(x=>(x.schema+'.'+x.name).toUpperCase()===v)||S.M.tables.find(x=>x.nameU===v)||null; renderSQL(); }
    else if(t.id==='sqTpl'){ S.sql.tpl=t.value; renderSQL(); }
    else if(t.id==='sqP1'){ setSet('sqlSsSeq',t.checked); renderSQL(); }
    else if(t.id==='sqP2'){ setSet('sqlDatadate',t.checked); renderSQL(); }
    else if(t.dataset.c){ if(t.checked) S.sql.sel.add(t.dataset.c); else S.sql.sel.delete(t.dataset.c); $('#sqOut').textContent=genSQL(); }
  });
  box.addEventListener('click',e=>{
    const id=e.target.id;
    if(id==='sqCopy'){ navigator.clipboard.writeText($('#sqOut').textContent); toast('已複製 SQL','ok'); }
    else if(id==='sqAll'){ S.sql.t.cols.forEach(c=>S.sql.sel.add(c.columnName)); renderSQL(); }

    else if(id==='sqPk'){ S.sql.sel=new Set(S.sql.t.cols.filter(c=>c.pk).map(c=>c.columnName)); renderSQL(); }
  });
}

  o.push(`- 欄位數：${t.columnCount}`,`- PK：${t.pk.join(', ')||'無'}`); if(t.filePath) o.push(`- 來源：\`${t.filePath}:${t.lineStart}\``); o.push('');

/* ======================= Stress test generator ======================= */
const B5MAP={'資':'b8ea','料':'aec6','金':'aaf7','額':'c342','號':'b8b9','銀':'bbc8','行':'a6e6','帳':'b162','戶':'a4e1','統':'b2ce','編':'bd73','類':'c3fe','型':'abac','態':'ba41','風':'adb7','險':'c049','權':'c576','數':'bcc6','暴':'bcc9','債':'b6c5','券':'a8e9','證':'c3d2','發':'b56f','應':'c0b3','收':'a6ac','存':'a673','放':'a9f1','同':'a650','業':'b77e','主':'a544','國':'b0ea','家':'ae61','州':'a67b','政':'ac46','府':'a9b2','保':'ab4f','代':'a54e','理':'b27a','部':'b3a1','欄':'c4e6','位':'a6ec','表':'aaed','格':'aee6','備':'b3c6','註':'b5f9','說':'bba1','明':'a9fa','客':'abc8','名':'a657','稱':'bad9','日':'a4e9','期':'b4c1','碼':'bd58','批':'a7e5','次':'a6b8','餘':'be6c','利':'a751','率':'b276','擔':'bee1','品':'ab7e','間':'b6a1','產':'b2a3','別':'a74f','集':'b6b0','團':'b9ce','中':'a4a4','度':'abd7'};
const B5CHARS=Object.keys(B5MAP);
function encodeText(s,enc){
  if(enc==='big5'){ const out=[]; for(const ch of s){ const cp=ch.codePointAt(0); if(cp<128) out.push(cp); else if(B5MAP[ch]){ const h=B5MAP[ch]; out.push(parseInt(h.slice(0,2),16),parseInt(h.slice(2),16)); } else out.push(63); } return new Uint8Array(out); }
  if(enc==='utf-16le'){ const u=new Uint16Array(s.length+1); u[0]=0xFEFF; for(let i=0;i<s.length;i++) u[i+1]=s.charCodeAt(i); return new Uint8Array(u.buffer); }
  if(enc==='utf-8-bom'){ const b=new TextEncoder().encode(s); const o=new Uint8Array(b.length+3); o.set([0xEF,0xBB,0xBF]); o.set(b,3); return o; }
  return new TextEncoder().encode(s);
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genStress(o){
  const rng=mulberry(o.seed||12345); const ri=(a,b)=>a+Math.floor(rng()*(b-a+1)); const pick=a=>a[ri(0,a.length-1)];
  const shared=['ISSUER_ID','SOURCE','EXPOSURE_TYPE','RISK_WEIGHT','SS_SEQ','INDUSTRY_TYPE','AMT','GROUP_ID','CURRENCY'];
  const types=['VARCHAR2(20 BYTE)','VARCHAR2(50 BYTE)','NUMBER(18,3)','NUMBER(10)','DATE','CHAR(1 BYTE)','NUMBER','VARCHAR2(100 BYTE)','TIMESTAMP(6)'];
  const word=()=>Array.from({length:ri(3,6)},()=>pick(B5CHARS)).join('');
  const tables=[];
  for(let i=0;i<o.tables;i++){
    const name='TBL_'+String(i+1).padStart(5,'0'); const n=ri(o.min,o.max);
    const cols=[{n:'DATADATE',t:'DATE'},{n:'CUST_ID',t:rng()<0.03?'VARCHAR2(8 BYTE)':'VARCHAR2(10 BYTE)',nn:true}];
    const used=new Set(['DATADATE','CUST_ID']);
    for(const s of shared) if(rng()<0.25){ used.add(s); cols.push({n:s,t:s==='RISK_WEIGHT'?'NUMBER(8,3)':s==='AMT'?'NUMBER(18,3)':'VARCHAR2(20 BYTE)'}); }
    for(let k=1;cols.length<n;k++){ const cn='COL_'+k; cols.push({n:cn,t:pick(types)}); }
    const lines=cols.map(c=>`\t"${c.n}" ${c.t}${c.nn?' NOT NULL ENABLE':''}`);
    lines.push(`\t CONSTRAINT "PK_${name}" PRIMARY KEY ("DATADATE", "CUST_ID")\n  USING INDEX PCTFREE 10 INITRANS 2 MAXTRANS 255 COMPUTE STATISTICS \n  STORAGE(INITIAL 65536 NEXT 1048576 MINEXTENTS 1 MAXEXTENTS 2147483645\n  PCTINCREASE 0 FREELISTS 1 FREELIST GROUPS 1 BUFFER_POOL DEFAULT FLASH_CACHE DEFAULT CELL_FLASH_CACHE DEFAULT)\n  TABLESPACE "USERS"  ENABLE`);
    const ddl=`--------------------------------------------------------\n--  DDL for Table ${name}\n--------------------------------------------------------\n\n  CREATE TABLE "BIS"."${name}" \n   (${lines.join(', \n')}\n   ) SEGMENT CREATION IMMEDIATE \n  PCTFREE 10 PCTUSED 40 INITRANS 1 MAXTRANS 255 NOCOMPRESS LOGGING\n  TABLESPACE "USERS" ;\n`;
    let cm=`COMMENT ON TABLE "BIS"."${name}" IS '${word()}';\n`; for(const c of cols) cm+=`COMMENT ON COLUMN "BIS"."${name}"."${c.n}" IS '${word()}';\n`;
    const ix=`CREATE INDEX "BIS"."IX_${name}_1" ON "BIS"."${name}" ("CUST_ID") PCTFREE 10 INITRANS 2 MAXTRANS 255 COMPUTE STATISTICS TABLESPACE "USERS" ;\n`;
    tables.push({name,ddl,cm,ix});
  }
  return tables;
}
async function runStress(o,downloadOnly){
  busy('產生測試 DDL…'); await tick();
  try{
    const tbs=genStress(o); const encs=o.enc==='mixed'?['utf-8','big5','utf-8-bom','utf-16le']:[o.enc];
    const files=[]; const now=Date.now();
    if(o.layout==='single'){
      const enc=o.enc==='mixed'?'utf-8':o.enc;
      const text=tbs.map(t=>t.ddl).join('\n')+'\n'+tbs.map(t=>t.cm).join('')+tbs.map(t=>t.ix).join('');
      files.push({name:'stress_all.sql',bytes:encodeText(text,enc)});
    } else tbs.forEach((t,i)=>files.push({name:'stress/'+t.name+'.sql',bytes:encodeText(t.ddl+'\n'+t.cm+t.ix,encs[i%encs.length])}));
    if(downloadOnly){ files.forEach((f,i)=>{ if(i<1) download(f.name.split('/').pop(),new Blob([f.bytes])); }); busy(); toast(o.layout==='single'?'已下載單一大檔':'僅下載第一個檔案（多檔模式請直接匯入）'); return; }
    const entries=files.map(f=>{ const file=new File([f.bytes],f.name.split('/').pop(),{lastModified:now}); return {path:f.name,file,size:file.size,lastModified:now,include:true,enc:'auto'}; });
    $('#busyMsg').textContent='偵測編碼…'; await detectAll(entries); busy(); showTab('import');
    runImport({id:'stress:'+uid(),name:'壓力測試',persist:false},entries,{name:`壓力測試 ${o.tables} 表 ${o.layout==='single'?'單檔':'多檔'} ${o.enc}`,mode:'new',policy:'latest',incremental:false}).catch(err=>{ console.error(err); S.job=null; renderImportProgress(); toast('壓力測試失敗：'+err.message,'err'); });
  }catch(e){ busy(); toast('產生失敗：'+e.message,'err'); }
}
