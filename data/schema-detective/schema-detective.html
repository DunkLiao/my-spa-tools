/* ======================= 欄位反查（Column Lookup） ======================= */
S.lk={text:'',mode:'exact',logic:'any',cmt:false,schema:'',rows:[],res:null,sugIdx:-1,sug:[]};
const LK_SEP=/[\s,，、;；|]+/;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/** 把輸入文字切成查詢項：支援逗號／空白／換行分隔、引號、TABLE.COLUMN（取最後一段）、* ? 萬用字元 */
function lkTokens(text){
  const out=[], seen=new Set();
  for(let raw of String(text||'').split(LK_SEP)){
    raw=raw.replace(/^["'`\[\(]+|["'`\]\)]+$/g,'');
    if(!raw) continue;
    if(raw.includes('.')&&!/[*?]/.test(raw)){ const p=raw.split('.').filter(Boolean); raw=(p[p.length-1]||'').replace(/^["'`]+|["'`]+$/g,''); }
    if(!raw) continue;
    const u=raw.toUpperCase(); if(seen.has(u)) continue; seen.add(u);
    out.push({raw,u,l:raw.toLowerCase(),wild:/[*?]/.test(raw)});
  }
  return out;
}
function lkNames(M,tok,mode){
  if(tok.wild){ const re=wildRe(tok.u); const r=[]; for(const n of M.colIndex.keys()) if(re.test(n)) r.push(n); return r; }
  if(mode==='exact') return M.colIndex.has(tok.u)?[tok.u]:[];
  const r=[];
  for(const n of M.colIndex.keys()){ if(mode==='contains'?n.includes(tok.u):mode==='prefix'?n.startsWith(tok.u):n.endsWith(tok.u)) r.push(n); }
  return r;
}
function lkAnnCols(M){ // 業務筆記 → 實際欄位物件（建立一次）
  if(M._annCols&&M._annSize===S.ann.size&&M._annTs===S.annTs) return M._annCols;
  const out=[]; for(const a of S.ann.values()){ const t=M.byKey.get(keyOf(a.schema,a.table)); if(!t) continue; const c=t.cols.find(x=>x.columnNameUpper===String(a.column).toUpperCase()); if(c) out.push({t,c,text:annText(a).toLowerCase()}); }
  M._annCols=out; M._annSize=S.ann.size; M._annTs=S.annTs; return out;
}
function lkHits(M,tok,L){
  const out=[], seen=new Set(); const sch=L.schema;
  for(const n of lkNames(M,tok,L.mode)) for(const x of M.colIndex.get(n)){ if(sch&&x.t.schema!==sch) continue; seen.add(x.c); out.push({t:x.t,c:x.c,by:'name'}); }
  if(L.cmt&&!tok.wild){
    for(const x of M.flat){
      if(sch&&x.t.schema!==sch) continue; const c=x.c; if(seen.has(c)) continue;
      const cl=c._cl||(c._cl=(c.comment||'').toLowerCase());
      if(cl&&cl.includes(tok.l)){ seen.add(c); out.push({t:x.t,c,by:'comment'}); }
    }
    for(const a of lkAnnCols(M)){ if(sch&&a.t.schema!==sch) continue; if(seen.has(a.c)) continue; if(a.text.includes(tok.l)){ seen.add(a.c); out.push({t:a.t,c:a.c,by:'note'}); } }
  }
  return out;
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){ const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); cur[j]=v; if(v<rowMin) rowMin=v; }
    if(rowMin>max) return max+1; prev=cur;
  }
  return prev[b.length];
}
function lkNameList(M){ if(!M._names) M._names=[...M.colIndex.entries()].map(([n,l])=>[n,l.length]).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1)); return M._names; }
/** 找不到時的相近名稱：包含關係（忽略底線）優先，其次編輯距離 ≤ 2 */
function lkSuggest(M,tok){
  const u=tok.u.replace(/[*?]/g,''); if(!u) return [];
  const un=u.replace(/_/g,''); const res=[];
  for(const [n,cnt] of lkNameList(M)){ const nn=n.replace(/_/g,''); if(nn.includes(un)||(nn.length>=3&&un.includes(nn))){ res.push([n,cnt]); if(res.length>=6) break; } }
  if(res.length<6){ for(const [n,cnt] of lkNameList(M)){ if(res.some(r=>r[0]===n)) continue; if(lev(n,u,2)<=2){ res.push([n,cnt]); if(res.length>=6) break; } } }
  return res;
}
/** 輸入中的自動建議：前綴相符優先，其次包含 */
function lkAuto(M,frag){
  const u=frag.toUpperCase(); if(!u||/[*?]/.test(u)) return [];
  const out=[]; const names=lkNameList(M);
  for(const [n,c] of names){ if(n.startsWith(u)&&n!==u){ out.push([n,c]); if(out.length>=8) return out; } }
  for(const [n,c] of names){ if(!n.startsWith(u)&&n.includes(u)){ out.push([n,c]); if(out.length>=8) break; } }
  return out;
}

function runLookup(){
  const M=S.M, L=S.lk; const toks=lkTokens(L.text);
  L.res=null; L.rows=[];
  if(!M||!toks.length){ renderLkOut(); return; }
  const t0=performance.now(); const CAP=300000;
  const per=toks.map(tok=>({tok,hits:lkHits(M,tok,L)}));
  const useAll=toks.length>=2&&L.logic==='all';
  const res={mode:useAll?'all':'any',toks,per,missing:per.filter(p=>!p.hits.length).map(p=>p.tok),capped:false,tables:new Set(),nCols:0};
  const tcmp=(a,b)=>a.t.schema.localeCompare(b.t.schema)||a.t.name.localeCompare(b.t.name);
  if(!useAll){
    const groups=new Map(), seen=new Set();
    for(const p of per) for(const h of p.hits){
      if(seen.has(h.c)) continue; seen.add(h.c);
      let g=groups.get(h.c.columnNameUpper); if(!g){ g={name:h.c.columnName,hits:[]}; groups.set(h.c.columnNameUpper,g); } g.hits.push(h);
    }
    const arr=[...groups.values()].sort((a,b)=>b.hits.length-a.hits.length||(a.name<b.name?-1:1));
    for(const g of arr){
      g.hits.sort(tcmp); const v=new Map(); g.hits.forEach(h=>v.set(h.c.type,(v.get(h.c.type)||0)+1));
      g.variants=[...v.entries()].sort((a,b)=>b[1]-a[1]); g.bad=v.size>1;
      if(L.rows.length<CAP){ L.rows.push({k:'g',name:g.name,count:new Set(g.hits.map(h=>h.t)).size,variants:g.variants,bad:g.bad}); for(const h of g.hits){ if(L.rows.length>=CAP){ res.capped=true; break; } L.rows.push({k:'r',t:h.t,c:h.c,by:h.by}); } }
      g.hits.forEach(h=>res.tables.add(h.t)); res.nCols+=g.hits.length;
    }
    res.groups=arr;
  } else {
    const maps=per.map(p=>{ const m=new Map(); for(const h of p.hits){ if(!m.has(h.t)) m.set(h.t,[]); m.get(h.t).push(h.c); } return m; });
    let common=[...maps[0].keys()].filter(t=>maps.every(m=>m.has(t)));
    common.sort((a,b)=>a.schema.localeCompare(b.schema)||a.name.localeCompare(b.name));
    res.allTables=common;
    // 無交集時，提供「命中最多個欄位」的資料表
    if(!common.length){
      const cnt=new Map(); maps.forEach((m,i)=>m.forEach((_,t)=>{ cnt.set(t,(cnt.get(t)||0)+1); }));
      res.partial=[...cnt.entries()].sort((a,b)=>b[1]-a[1]||a[0].name.localeCompare(b[0].name)).slice(0,15).map(([t,n])=>({t,n,cols:maps.map((m,i)=>m.has(t)?toks[i].raw:null).filter(Boolean)}));
    }
    L.rows.push({k:'h',text:`同時包含 ${toks.map(t=>t.raw).join('、')} 的資料表：${common.length.toLocaleString()} 張`});
    for(const t of common){ if(L.rows.length>=CAP){ res.capped=true; break; } L.rows.push({k:'a',t,cs:maps.map(m=>m.get(t))}); res.tables.add(t); }
    res.nCols=common.reduce((a,t)=>a+maps.reduce((s,m)=>s+m.get(t).length,0),0);
  }
  res.ms=performance.now()-t0; L.res=res; renderLkOut();
}
function renderLkOut(){
  const L=S.lk, r=L.res, el=$('#lkSum');
  if(!S.M){ el.innerHTML='<span class="muted">請先到「匯入」載入 DDL。</span>'; setLkRows(); return; }
  if(!r){ el.innerHTML=`<span class="muted">輸入欄位名稱即可查出哪些資料表使用它（共 ${S.M.colIndex.size.toLocaleString()} 種欄位名稱、${S.M.tables.length.toLocaleString()} 張表）。可一次輸入多個，例如 <code>CUST_ID, ISSUER_ID</code>；也可用 <code>CUST*</code> 萬用字元。</span>`; setLkRows(); return; }
  let h='';
  if(r.mode==='any'){
    const bad=r.groups.filter(g=>g.bad).length;
    h+=`找到 <b>${r.groups.length.toLocaleString()}</b> 個欄位名稱，出現於 <b>${r.tables.size.toLocaleString()}</b> 張資料表（共 ${r.nCols.toLocaleString()} 個欄位）<span class="muted">　${r.ms.toFixed(0)} ms${r.capped?'；結果過多，僅顯示前 300,000 列':''}</span>`;
    if(bad) h+=`　<span class="badge err">⚠ ${bad} 個欄位名稱的型態／長度不一致</span>`; else if(r.groups.length) h+=`　<span class="badge ok">✔ 型態一致</span>`;
  } else {
    h+=`同時包含全部 ${r.toks.length} 個欄位的資料表：<b>${r.allTables.length.toLocaleString()}</b> 張<span class="muted">　${r.ms.toFixed(0)} ms</span>`;
  }
  h+='<div class="row" style="margin-top:6px">'+r.per.map(p=>{
    const nt=new Set(p.hits.map(x=>x.t)).size;
    return p.hits.length?`<span class="badge ok">${esc(p.tok.raw)} → ${nt.toLocaleString()} 表</span>`:`<span class="badge err">${esc(p.tok.raw)} → 找不到</span>`;
  }).join('')+'</div>';
  for(const tok of r.missing){
    const s=lkSuggest(S.M,tok);
    h+=`<div class="row" style="margin:4px 0"><span class="muted">「${esc(tok.raw)}」沒有符合的欄位${L.cmt?'（含註解）':''}。</span>${s.length?'<span class="muted">是不是要找：</span>'+s.map(([n,c])=>`<button data-sug="${esc(tok.raw)}\u0001${esc(n)}" title="出現於 ${c} 張表">${esc(n)} <span class="muted">(${c})</span></button>`).join(''):''}</div>`;
  }
  if(r.mode==='all'&&!r.allTables.length&&r.partial&&r.partial.length){
    h+=`<div class="muted" style="margin-top:6px">沒有任何資料表同時包含全部欄位。命中最多的資料表：${r.partial.slice(0,8).map(x=>`<a href="#/table/${encodeURIComponent(x.t.schema)}/${encodeURIComponent(x.t.name)}">${esc(x.t.name)}</a>（${esc(x.cols.join('、'))}）`).join('；')}</div>`;
  }
  el.innerHTML=h; setLkRows();
}
function setLkRows(){
  if(!S.vl.lk){
    S.vl.lk=new VList($('#lkList'),{rowH:30,render:i=>{
      const r=S.lk.rows[i]; if(!r) return '';
      if(r.k==='g') return `<div class="r gh2" data-i="${i}" style="cursor:default"><b class="mono">${esc(r.name)}</b><span class="badge">${r.count.toLocaleString()} 表</span>${r.bad?'<span class="badge err">⚠ 型態／長度不一致</span>':'<span class="badge ok">型態一致</span>'}<span class="muted t">${esc(r.variants.map(v=>v[0]+' ×'+v[1]).join('　'))}</span></div>`;
      if(r.k==='h') return `<div class="r gh2" data-i="${i}" style="cursor:default"><b>${esc(r.text)}</b></div>`;
      if(r.k==='r'){
        const c=r.c,t=r.t,a=S.ann.get(annKey(t,c));
        return `<div class="r lg" data-i="${i}"><span class="t" title="${esc(t.schema+'.'+t.name)}">${esc(t.schema)}.<b>${esc(t.name)}</b></span><span class="mono t">${esc(c.columnName)}</span><span class="mono t" title="${esc(c.type)}">${esc(c.type)}</span><span>${c.nullable?'':'✓'}</span><span>${c.pk?'●':''}</span><span class="t" title="${esc(c.comment)}">${r.by!=='name'?`<span class="badge warn">${r.by==='note'?'筆記':'註解'}命中</span> `:''}${a&&a.businessName?`<span class="badge ac">${esc(a.businessName)}</span> `:''}${esc(c.comment)}</span></div>`;
      }
      const t=r.t, cs=r.cs.map(x=>x[0]);
      return `<div class="r lg" data-i="${i}"><span class="t" title="${esc(t.schema+'.'+t.name)}">${esc(t.schema)}.<b>${esc(t.name)}</b></span><span class="mono t">${esc(cs.map(c=>c.columnName).join(', '))}</span><span class="mono t" title="${esc(cs.map(c=>c.type).join(', '))}">${esc(cs.map(c=>c.type).join(', '))}</span><span></span><span>${cs.some(c=>c.pk)?'●':''}</span><span class="t muted">${esc(t.comment||'')}</span></div>`;
    },onClick:i=>{ const r=S.lk.rows[i]; if(!r) return; if(r.k==='r') selectTable(r.t,r.c); else if(r.k==='a') selectTable(r.t,r.cs[0][0]); }});
  }
  S.vl.lk.setCount(S.lk.rows.length);
  $('#lkHead').innerHTML=S.lk.res&&S.lk.res.mode==='all'?'<span>資料表</span><span>符合欄位</span><span>型態</span><span></span><span>PK</span><span>資料表註解</span>':'<span>資料表</span><span>欄位</span><span>型態</span><span>N</span><span>PK</span><span>註解／筆記</span>';
  const has=!!(S.lk.res&&S.lk.rows.length);
  $('#lkCopy').disabled=!has; $('#lkCsv').disabled=!has;
}
function lkTableList(){
  const set=new Set(); S.lk.rows.forEach(r=>{ if(r.t) set.add(r.t); });
  return [...set].sort((a,b)=>a.schema.localeCompare(b.schema)||a.name.localeCompare(b.name));
}
function lkCsv(){
  const L=S.lk, r=L.res; if(!r) return; const rows=[];
  if(r.mode==='all'){ rows.push(['schema','table','matched_columns','types','table_comment']); for(const x of L.rows) if(x.k==='a') rows.push([x.t.schema,x.t.name,x.cs.map(c=>c[0].columnName).join(';'),x.cs.map(c=>c[0].type).join(';'),x.t.comment]); }
  else { rows.push(['column','schema','table','type','nullable','pk','comment','business_name','matched_by']); for(const x of L.rows) if(x.k==='r'){ const a=S.ann.get(annKey(x.t,x.c))||{}; rows.push([x.c.columnName,x.t.schema,x.t.name,x.c.type,x.c.nullable?'Y':'N',x.c.pk?'Y':'',x.c.comment,a.businessName,x.by]); } }
  download('column-lookup-'+todayStr()+'.csv','\ufeff'+rows.map(x=>x.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}
function lkSetText(t,run){ S.lk.text=t; const el=$('#lkIn'); if(el) el.value=t; if(run!==false) runLookup(); }
function openLookup(text,opts){
  Object.assign(S.lk,{mode:'exact',logic:'any'},opts||{}); S.lk.text=text; showTab('lookup'); // renderLookup 會同步控制項並查詢
}
function renderLookup(){
  const L=S.lk; $('#lkIn').value=L.text; $('#lkMode').value=L.mode; $('#lkLogic').value=L.logic; $('#lkCmt').checked=L.cmt;
  const sel=$('#lkSch'); const schemas=S.M?[...new Set(S.M.tables.map(t=>t.schema))].sort():[];
  if(L.schema&&!schemas.includes(L.schema)) L.schema='';
  sel.innerHTML='<option value="">全部 Schema</option>'+schemas.map(s=>`<option ${s===L.schema?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('');
  runLookup(); setTimeout(()=>{ if(S.tab==='lookup') $('#lkIn').focus(); },0);
}
/* 輸入建議：針對游標所在的詞 */
function lkTokenAtCaret(el){
  const v=el.value, pos=el.selectionStart==null?v.length:el.selectionStart; let a=pos,b=pos;
  while(a>0&&!LK_SEP.test(v[a-1])) a--; while(b<v.length&&!LK_SEP.test(v[b])) b++;
  return {a,b,frag:v.slice(a,b).replace(/^["'`]+/,'')};
}
function showSug(){
  const box=$('#lkSugBox'), el=$('#lkIn'); if(!S.M||document.activeElement!==el){ box.style.display='none'; return; }
  const {frag}=lkTokenAtCaret(el); const list=frag.length>=1?lkAuto(S.M,frag):[];
  S.lk.sug=list; S.lk.sugIdx=-1;
  if(!list.length){ box.style.display='none'; return; }
  box.innerHTML=list.map(([n,c],i)=>`<div class="it" data-sug-i="${i}"><span class="mono">${esc(n)}</span> <span class="muted">${c.toLocaleString()} 表</span></div>`).join(''); box.style.display='block';
}
function pickSug(i){
  const el=$('#lkIn'), pick=S.lk.sug[i]; if(!pick) return; const {a,b}=lkTokenAtCaret(el);
  const v=el.value.slice(0,a)+pick[0]+el.value.slice(b); el.value=v; const np=a+pick[0].length; el.setSelectionRange(np,np);
  S.lk.text=v; $('#lkSugBox').style.display='none'; S.lk.sugIdx=-1; runLookup();
}
function bindLookup(){
  const L=S.lk, deb=debounce(()=>{ L.text=$('#lkIn').value; runLookup(); },200);
  $('#lkIn').addEventListener('input',()=>{ deb(); showSug(); });
  $('#lkIn').addEventListener('focus',showSug);
  $('#lkIn').addEventListener('blur',()=>setTimeout(()=>{ $('#lkSugBox').style.display='none'; },150));
  $('#lkIn').addEventListener('click',showSug);
  $('#lkIn').addEventListener('keydown',e=>{
    const box=$('#lkSugBox'), open=box.style.display==='block';
    if(open&&e.key==='ArrowDown'){ e.preventDefault(); L.sugIdx=Math.min(L.sug.length-1,L.sugIdx+1); }
    else if(open&&e.key==='ArrowUp'){ e.preventDefault(); L.sugIdx=Math.max(-1,L.sugIdx-1); }
    else if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(open&&L.sugIdx>=0) pickSug(L.sugIdx); else { L.text=$('#lkIn').value; runLookup(); box.style.display='none'; } return; }
    else if(e.key==='Escape'&&open){ e.stopPropagation(); box.style.display='none'; return; }
    else return;
    $$('#lkSugBox .it').forEach((x,i)=>x.classList.toggle('on',i===L.sugIdx));
  });
  $('#lkSugBox').addEventListener('mousedown',e=>{ const it=e.target.closest('[data-sug-i]'); if(it){ e.preventDefault(); pickSug(+it.dataset.sugI); } });
  const chg=()=>{ L.mode=$('#lkMode').value; L.logic=$('#lkLogic').value; L.cmt=$('#lkCmt').checked; L.schema=$('#lkSch').value; L.text=$('#lkIn').value; runLookup(); };
  ['lkMode','lkLogic','lkCmt','lkSch'].forEach(id=>$('#'+id).addEventListener('change',chg));
  $('#lkRun').onclick=()=>{ L.text=$('#lkIn').value; runLookup(); };
  $('#lkClear').onclick=()=>{ lkSetText(''); $('#lkIn').focus(); };
  $('#lkCopy').onclick=()=>{ const l=lkTableList(); navigator.clipboard.writeText(l.map(t=>t.schema+'.'+t.name).join('\n')).then(()=>toast(`已複製 ${l.length} 張資料表名稱`,'ok')); };
  $('#lkCsv').onclick=lkCsv;
  $('#lkSum').addEventListener('click',e=>{
    const b=e.target.closest('[data-sug]'); if(!b) return; const [oldT,newT]=b.dataset.sug.split('\u0001');
    const re=new RegExp('(^|[\\s,，、;；|"\'`.])'+escRe(oldT)+'(?=$|[\\s,，、;；|"\'`])','i');
    lkSetText($('#lkIn').value.replace(re,(m,p1)=>p1+newT));
  });
}

</script>
