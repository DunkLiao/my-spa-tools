<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:;">
<title>VBA Snippet Manager</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--panel2:#f0f2f5;--fg:#1f2328;--muted:#656d76;--bd:#d8dee4;
  --accent:#0f6cbd;--accent-fg:#fff;--danger:#c4314b;--mark:#ffe58f;--code-bg:#fbfbfc;
  --tok-k:#0000ff;--tok-s:#a31515;--tok-c:#008000;--tok-n:#098658;--tok-o:#795e26;
  --add:#d6f5dc;--del:#fbd9de;--shadow:0 8px 28px rgba(0,0,0,.25);--code-fs:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181b;--panel:#202328;--panel2:#2a2e35;--fg:#e6e8eb;--muted:#9aa4af;--bd:#3a3f47;
    --accent:#4da3ff;--accent-fg:#0b1a2b;--danger:#ff6b81;--mark:#6b5a00;--code-bg:#1b1d21;
    --tok-k:#569cd6;--tok-s:#ce9178;--tok-c:#6a9955;--tok-n:#b5cea8;--tok-o:#dcdcaa;--add:#1f4d2b;--del:#5a2430;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b;--panel:#202328;--panel2:#2a2e35;--fg:#e6e8eb;--muted:#9aa4af;--bd:#3a3f47;
  --accent:#4da3ff;--accent-fg:#0b1a2b;--danger:#ff6b81;--mark:#6b5a00;--code-bg:#1b1d21;
  --tok-k:#569cd6;--tok-s:#ce9178;--tok-c:#6a9955;--tok-n:#b5cea8;--tok-o:#dcdcaa;--add:#1f4d2b;--del:#5a2430;
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible,.nav:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
input,select,textarea{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input.err,textarea.err{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
mark{background:var(--mark);color:inherit;border-radius:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--bd);flex:none}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top #q{flex:1;max-width:460px;min-width:80px}
.top .actions{display:flex;gap:6px;margin-left:auto}
#banner{background:#fff4ce;color:#4d3b00;padding:6px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #e6d27a;flex:none}
#banner[hidden]{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #banner{background:#4a3d0a;color:#ffe9a3;border-color:#7a6513}}
:root[data-theme="dark"] #banner{background:#4a3d0a;color:#ffe9a3;border-color:#7a6513}

/* layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:230px 330px 1fr}
body.sidebar-collapsed .app{grid-template-columns:330px 1fr}
body.sidebar-collapsed #side{display:none}
#side{background:var(--panel);border-right:1px solid var(--bd);overflow:auto;padding:8px}
#list{background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#detail{overflow:auto;padding:16px 20px;background:var(--panel);min-width:0}
.list-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--panel);flex-wrap:wrap}
.list-head #count{color:var(--muted);margin-left:auto;font-size:12px}
#items{overflow:auto;padding:8px;flex:1}

/* sidebar */
.sec{font-size:12px;color:var(--muted);margin:12px 6px 4px;display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;user-select:none}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent);color:var(--accent-fg)}
.nav .n{margin-left:auto;font-size:12px;opacity:.75}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.nav .tools{display:none;gap:2px}
.nav:hover .tools,.nav:focus-within .tools{display:flex}
.nav .tools button{padding:0 4px;font-size:11px;border:none;background:transparent;color:inherit}
.nav.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.nav.dragover-after{box-shadow:inset 0 -2px 0 var(--accent)}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:2px 4px}
.tg{border:1px solid var(--bd);border-radius:999px;padding:0 8px;font-size:12px;cursor:pointer;background:var(--panel2);user-select:none}
.tg.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tg small{opacity:.7}

/* cards */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .t{font-weight:600;padding-right:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--muted);margin-top:2px}
.card .d{font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .hit{font:12px/1.4 Consolas,"Courier New",monospace;background:var(--code-bg);border:1px solid var(--bd);border-radius:4px;margin-top:4px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.card .ca{position:absolute;right:6px;top:6px;display:flex;gap:2px}
.card .ca button{padding:0 6px;font-size:12px}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--panel2);border-radius:999px;padding:0 8px;font-size:12px;margin-right:4px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
.empty .big{font-size:36px}
.empty button{margin:6px 3px}

/* detail */
.dh{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:20px;flex:1;word-break:break-word}
.dh .back{display:none}
.meta{color:var(--muted);margin:6px 0}
.desc{white-space:pre-wrap;margin:8px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.codebox,.editor-wrap{display:flex;border:1px solid var(--bd);border-radius:8px;background:var(--code-bg);overflow:hidden}
.codebox{max-height:calc(100vh - 330px);min-height:120px;overflow:auto}
.codebox .gutter{position:sticky;left:0;z-index:1}
.editor-wrap .gutter{padding-bottom:40px}
.gutter{flex:none;text-align:right;white-space:pre;color:var(--muted);padding:8px 8px 20px 10px;border-right:1px solid var(--bd);user-select:none;font:var(--code-fs)/1.5 Consolas,"Courier New","Microsoft JhengHei",monospace;overflow:hidden;background:var(--panel2)}
pre.code{margin:0;padding:8px 12px 20px;flex:1;min-width:0;overflow:visible;font:var(--code-fs)/1.5 Consolas,"Courier New","Microsoft JhengHei",monospace;tab-size:4}
.codebox pre.code{overflow:visible;width:max-content;min-width:100%}
.tok-k{color:var(--tok-k);font-weight:600}.tok-s{color:var(--tok-s)}.tok-c{color:var(--tok-c);font-style:italic}.tok-n{color:var(--tok-n)}.tok-o{color:var(--tok-o)}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
.ed label{display:block;margin:8px 0 2px;font-size:12px;color:var(--muted)}
.ed input.full,.ed textarea.full,.ed select{width:100%}
.ed .row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--bd);border-radius:6px;padding:3px 6px;background:var(--panel);min-height:32px;align-items:center}
.chips input{border:none;flex:1;min-width:80px;padding:2px;background:transparent}
.chips .chip button{border:none;background:transparent;padding:0 0 0 4px;font-size:11px}
.editor-wrap{height:46vh;min-height:240px}
.editor-wrap textarea{flex:1;border:none;border-radius:0;resize:none;white-space:pre;overflow:auto;background:transparent;padding:8px 12px 20px;font:var(--code-fs)/1.5 Consolas,"Courier New","Microsoft JhengHei",monospace;tab-size:4;outline:none}
.status{color:var(--muted);font-size:12px;margin-top:4px}

/* dialog */
dialog.dlg{border:1px solid var(--bd);border-radius:10px;padding:0;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);width:min(520px,94vw);max-height:90vh}
dialog.dlg.wide{width:min(960px,96vw)}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
dialog .dh2{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
dialog .dh2 .x{border:none;background:transparent}
dialog .db{padding:12px 14px;overflow:auto;max-height:calc(90vh - 120px)}
dialog .db p{white-space:pre-wrap;margin:0}
dialog .db label{display:block;margin:8px 0 2px}
dialog .db input.full,dialog .db select.full,dialog .db textarea.full{width:100%}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
.hgrid{display:grid;grid-template-columns:230px 1fr;gap:10px;min-height:300px}
.hlist{border:1px solid var(--bd);border-radius:6px;overflow:auto;max-height:55vh}
.hlist div{padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--bd)}
.hlist div.on{background:var(--accent);color:var(--accent-fg)}
.hview{border:1px solid var(--bd);border-radius:6px;background:var(--code-bg);overflow:auto;max-height:55vh}
.diff div{white-space:pre;font:var(--code-fs)/1.5 Consolas,"Courier New","Microsoft JhengHei",monospace;padding:0 8px}
.diff .a{background:var(--add)}.diff .r{background:var(--del)}
.sect{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.sect h4{margin:0 0 6px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
table.kv{border-collapse:collapse;width:100%}
table.kv td{border-bottom:1px solid var(--bd);padding:3px 6px}
.imp-row{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px}
.warn{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;max-width:90vw}
#toast.show{opacity:.95}
#fatal{padding:40px;max-width:640px;margin:auto}

/* responsive */
@media (max-width:1023px){
  .app,body.sidebar-collapsed .app{grid-template-columns:330px 1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:none;display:block !important}
  body.sidebar-open #side{transform:none;box-shadow:var(--shadow)}
  .top h1{display:none}
}
@media (max-width:719px){
  .app,body.sidebar-collapsed .app{grid-template-columns:1fr}
  #detail{display:none}
  body.show-detail #detail{display:block}
  body.show-detail #list{display:none}
  .dh .back{display:inline-block}
  .top .actions button .lbl{display:none}
  .ed .row{grid-template-columns:1fr}
  .hgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <button id="btnMenu" class="ghost" aria-label="切換側邊欄">☰</button>
  <h1>🧰 VBA Snippet Manager</h1>
  <input id="q" type="search" placeholder="搜尋…（Ctrl+K）支援 tag: cat: code: is:fav" aria-label="搜尋">
  <div class="actions">
    <button id="btnNew" class="primary" aria-label="新增 Snippet">＋<span class="lbl"> 新增</span></button>
    <button id="btnImpBas" aria-label="匯入 .bas">📥<span class="lbl"> 匯入 .bas</span></button>
    <button id="btnBackup" aria-label="備份 JSON">💾<span class="lbl"> 備份</span></button>
    <button id="btnSettings" aria-label="設定">⚙<span class="lbl"> 設定</span></button>
    <button id="btnTheme" aria-label="切換主題" title="切換主題">🌓</button>
  </div>
</header>
<div id="banner" hidden></div>
<div class="app">
  <aside id="side" aria-label="分類與標籤"></aside>
  <section id="list" aria-label="Snippet 列表">
    <div class="list-head">
      <label for="sortSel" style="font-size:12px;color:var(--muted)">排序</label>
      <select id="sortSel" aria-label="排序方式">
        <option value="updatedAt">最後修改</option>
        <option value="title">名稱</option>
        <option value="useCount">使用次數</option>
        <option value="lastUsedAt">最近使用</option>
        <option value="createdAt">建立時間</option>
      </select>
      <button id="btnEmptyTrash" hidden class="danger">清空垃圾桶</button>
      <span id="count"></span>
    </div>
    <div id="items"></div>
  </section>
  <main id="detail"></main>
</div>
<div id="toast" role="status"></div>
<input type="file" id="fileBas" multiple accept=".bas,.txt,.cls" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============================================================
 * VBA Snippet Manager — 單檔 SPA（Vanilla JS + IndexedDB）
 * 無外部依賴、無網路請求、無 API Key
 * ============================================================ */

/* ---------- Utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const SCHEMA = 1, APP = 'VbaSnippetManager';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10));
const nowISO = () => new Date().toISOString();
const norm = s => String(s ?? '').normalize('NFKC').toLowerCase();
const pad = n => String(n).padStart(2, '0');
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function download(name, blob) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
let toastTimer;
function toast(msg, ms = 1500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const toCRLF = s => s.replace(/\r\n|\r|\n/g, '\r\n');
const toLF = s => s.replace(/\r\n|\r/g, '\n');
function normTags(arr) {
  const seen = new Set(), out = [];
  for (let t of arr || []) {
    t = String(t).trim().slice(0, 30); if (!t) continue;
    const k = norm(t); if (seen.has(k)) continue; seen.add(k); out.push(t);
    if (out.length >= 20) break;
  }
  return out;
}

/* ---------- DB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('此瀏覽器不支援 IndexedDB'));
      const r = indexedDB.open('VbaSnippetDB', 1);
      r.onupgradeneeded = e => {
        const db = r.result, old = e.oldVersion;
        if (old < 1) {
          const s = db.createObjectStore('snippets', { keyPath: 'id' });
          s.createIndex('by_category', 'categoryId');
          s.createIndex('by_tag', 'tags', { multiEntry: true });
          s.createIndex('by_updated', 'updatedAt');
          s.createIndex('by_favorite', 'favorite');
          db.createObjectStore('categories', { keyPath: 'id' });
          const h = db.createObjectStore('history', { keyPath: 'id' });
          h.createIndex('by_snippet', 'snippetId');
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('資料庫被其他分頁佔用，請關閉其他本工具分頁後重試'));
    });
  },
  run(stores, mode, fn) {
    return new Promise((res, rej) => {
      let t, out;
      try { t = this.db.transaction(stores, mode); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('交易中止'));
      try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) {} rej(e); }
    });
  },
  async getAll(store) {
    const o = {};
    await this.run([store], 'readonly', t => { const r = t.objectStore(store).getAll(); r.onsuccess = () => { o.v = r.result; }; });
    return o.v || [];
  },
  put(store, obj) { return this.run([store], 'readwrite', t => { t.objectStore(store).put(obj); }); },
  putMany(store, arr) { return this.run([store], 'readwrite', t => { const s = t.objectStore(store); arr.forEach(x => s.put(x)); }); },
  del(store, key) { return this.run([store], 'readwrite', t => { t.objectStore(store).delete(key); }); },
  clearAll() { const n = ['snippets', 'categories', 'history', 'settings']; return this.run(n, 'readwrite', t => n.forEach(s => t.objectStore(s).clear())); },
  delSnippets(ids) {
    return this.run(['snippets', 'history'], 'readwrite', t => {
      const hs = t.objectStore('history').index('by_snippet');
      for (const id of ids) {
        t.objectStore('snippets').delete(id);
        const rq = hs.openCursor(IDBKeyRange.only(id));
        rq.onsuccess = () => { const c = rq.result; if (c) { c.delete(); c.continue(); } };
      }
    });
  },
  async addHistory(snip) {
    const rec = { id: uuid(), snippetId: snip.id, title: snip.title, code: snip.code, savedAt: nowISO() };
    await this.run(['history'], 'readwrite', t => {
      const st = t.objectStore('history'); st.put(rec);
      const r = st.index('by_snippet').getAll(IDBKeyRange.only(snip.id));
      r.onsuccess = () => {
        const all = r.result.sort((a, b) => a.savedAt < b.savedAt ? -1 : a.savedAt > b.savedAt ? 1 : 0);
        while (all.length > 20) st.delete(all.shift().id);
      };
    });
  },
  async getHistory(snippetId) {
    const o = {};
    await this.run(['history'], 'readonly', t => {
      const r = t.objectStore('history').index('by_snippet').getAll(IDBKeyRange.only(snippetId));
      r.onsuccess = () => { o.v = r.result; };
    });
    return (o.v || []).sort((a, b) => a.savedAt < b.savedAt ? 1 : -1);
  }
};

/* ---------- State ---------- */
const S = {
  snippets: [], categories: [], settings: {},
  filter: { view: 'all', categoryId: null, tags: [], query: '' },
  selectedId: null, editing: null, dirty: false, bannerDismissed: false, _vis: []
};
const st = (k, d) => (S.settings[k] === undefined ? d : S.settings[k]);
async function setSetting(k, v) { S.settings[k] = v; await DB.put('settings', { key: k, value: v }); }
async function loadAll() {
  ncache.clear();
  S.snippets = await DB.getAll('snippets');
  S.categories = (await DB.getAll('categories')).sort((a, b) => a.order - b.order);
  S.settings = {}; (await DB.getAll('settings')).forEach(x => { S.settings[x.key] = x.value; });
}
const cur = () => S.snippets.find(s => s.id === S.selectedId) || null;
const catName = id => (S.categories.find(c => c.id === id) || { name: '未分類' }).name;
function newSnippet(o) {
  const t = nowISO();
  return { id: uuid(), title: '', description: '', code: '', categoryId: 'cat-uncategorized', tags: [], favorite: false, useCount: 0, lastUsedAt: null, createdAt: t, updatedAt: t, deletedAt: null, isSample: false, ...o };
}

/* ---------- VBA Highlighter ---------- */
const KW = new Set(('sub function end dim as set let const private public static option explicit if then else elseif select case for each next to step do loop while wend until exit with new nothing true false and or not xor is like mod on error resume goto byval byref optional paramarray call property get string integer long double single boolean variant object date byte currency redim preserve erase open close input output append line print write binary random type enum debug me in input access lock shared').split(' '));
const OBJ = new Set('application activeworkbook thisworkbook worksheets worksheet workbooks workbook range cells activesheet activecell selection sheets err rows columns msgbox inputbox'.split(' '));
const sp = (c, t) => `<span class="tok-${c}">${esc(t)}</span>`;
function hlLine(line) {

/* ---------- Dialog helpers ---------- */
function modal({ title, body, buttons = [], wide = false }) {
  const d = document.createElement('dialog'); d.className = 'dlg' + (wide ? ' wide' : '');
  const h = document.createElement('div'); h.className = 'dh2'; h.innerHTML = `<strong>${esc(title)}</strong><button class="x" aria-label="關閉">✕</button>`;
  const b = document.createElement('div'); b.className = 'db'; if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
  const f = document.createElement('div'); f.className = 'df';
  buttons.forEach(bt => {
    const x = document.createElement('button'); x.textContent = bt.text; x.className = bt.cls || '';
    x.addEventListener('click', async () => {
      if (x.disabled) return; x.disabled = true; let r;
      try { r = bt.onClick ? await bt.onClick(d) : undefined; } catch (err) { handleErr(err); r = false; }
      x.disabled = false; if (r !== false) d.close();

  d.append(h, b, f); document.body.appendChild(d);

}

    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (_) { return false; }
}

  S.editing = null; S.dirty = false; if (!cur()) document.body.classList.remove('show-detail'); renderDetail();
}
async function toggleFav(id) {
  const s = S.snippets.find(x => x.id === id); if (!s) return;
  s.favorite = !s.favorite;
  try { await DB.put('snippets', s); } catch (e) { return handleErr(e); }
  renderSide(); renderList(); if (S.selectedId === id && !S.editing) renderDetail();
}
async function dupSnippet(id) {
  const s = S.snippets.find(x => x.id === id); if (!s) return;
  const c = newSnippet({ title: (s.title + ' (複本)').slice(0, 100), description: s.description, code: s.code, categoryId: s.categoryId, tags: [...s.tags] });
  S.snippets.push(c); try { await DB.put('snippets', c); } catch (e) { return handleErr(e); }
  S.selectedId = c.id; renderAll(); toast('已建立副本');
}
async function trashSnippet(id) {
  const s = S.snippets.find(x => x.id === id); if (!s) return;
  if (!(await confirmDlg(`確定要刪除「${s.title}」嗎？\n（會先移到垃圾桶，30 天內可還原）`, '刪除', true))) return;
  s.deletedAt = nowISO(); try { await DB.put('snippets', s); } catch (e) { return handleErr(e); }
  S.selectedId = null; document.body.classList.remove('show-detail'); renderAll(); toast('已移到垃圾桶');
}
async function restoreSnippet(id) {
  const s = S.snippets.find(x => x.id === id); if (!s) return;
  s.deletedAt = null; try { await DB.put('snippets', s); } catch (e) { return handleErr(e); }
  S.selectedId = null; renderAll(); toast('已還原');
}
async function purgeSnippets(ids, msg) {
  if (!(await confirmDlg(msg, '永久刪除', true))) return;
  try { await DB.delSnippets(ids); } catch (e) { return handleErr(e); }
  S.snippets = S.snippets.filter(s => !ids.includes(s.id)); if (ids.includes(S.selectedId)) S.selectedId = null;
  renderAll(); toast('已永久刪除');
}

/* categories */
async function addCat() {
  const name = await promptDlg('新增分類', '分類名稱'); if (!name) return;
  if (S.categories.some(c => norm(c.name) === norm(name))) return toast('分類名稱重複');
  const c = { id: uuid(), name, order: S.categories.length, isDefault: false, createdAt: nowISO() };
  S.categories.push(c); try { await DB.put('categories', c); } catch (e) { return handleErr(e); } renderSide();
}
async function renCat(id) {
  const c = S.categories.find(x => x.id === id); if (!c) return;
  const name = await promptDlg('分類改名', '分類名稱', c.name); if (!name || name === c.name) return;
  if (S.categories.some(x => x.id !== id && norm(x.name) === norm(name))) return toast('分類名稱重複');
  c.name = name; try { await DB.put('categories', c); } catch (e) { return handleErr(e); } renderSide(); renderList();
}
async function delCat(id) {
  if (id === 'cat-uncategorized') return;
  const c = S.categories.find(x => x.id === id); if (!c) return;
  const affected = S.snippets.filter(s => s.categoryId === id);
  if (!(await confirmDlg(`確定刪除分類「${c.name}」？\n其下 ${affected.length} 筆 Snippet 會移到「未分類」。`, '刪除', true))) return;
  affected.forEach(s => { s.categoryId = 'cat-uncategorized'; });
  S.categories = S.categories.filter(x => x.id !== id); S.categories.forEach((x, i) => { x.order = i; });
  try { await DB.run(['snippets', 'categories'], 'readwrite', t => { affected.forEach(s => t.objectStore('snippets').put(s)); t.objectStore('categories').delete(id); S.categories.forEach(x => t.objectStore('categories').put(x)); }); } catch (e) { return handleErr(e); }
  if (S.filter.categoryId === id) S.filter.categoryId = null; renderAll();
}
async function reorderCat(dragId, targetId, after) {
  if (dragId === targetId) return;
  const arr = S.categories.filter(c => c.id !== dragId), i = arr.findIndex(c => c.id === targetId);
  arr.splice(after ? i + 1 : i, 0, S.categories.find(c => c.id === dragId)); arr.forEach((c, k) => { c.order = k; }); S.categories = arr;
  try { await DB.putMany('categories', arr); } catch (e) { handleErr(e); } renderSide();
}

/* tags management */
function mgTagsDlg() {
  const body = document.createElement('div');
  const draw = () => {
    const m = new Map(); S.snippets.forEach(s => (s.tags || []).forEach(t => { const k = norm(t), o = m.get(k); if (o) o.n++; else m.set(k, { name: t, n: 1 }); }));
    const rows = [...m.values()].sort((a, b) => b.n - a.n);
    body.innerHTML = rows.length ? `<p style="color:var(--muted);margin-bottom:8px">改名成已存在的標籤＝合併（全域套用，含垃圾桶內的項目）。</p><table class="kv">${rows.map((r, i) => `<tr><td>#${esc(r.name)}</td><td>${r.n} 筆</td><td style="text-align:right"><button data-r="${i}">改名／合併</button> <button class="danger" data-d="${i}">刪除</button></td></tr>`).join('')}</table>` : '<p>目前沒有任何標籤。</p>';
    body._rows = rows;
  };
  draw();
  body.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const apply = async fn => { const ch = []; S.snippets.forEach(s => { const nt = fn(s.tags || []); if (nt.join('\u0001') !== (s.tags || []).join('\u0001')) { s.tags = nt; s.updatedAt = nowISO(); ch.push(s); } }); try { await DB.putMany('snippets', ch); } catch (er) { handleErr(er); } draw(); renderSide(); renderList(); renderDetail(); };
    if (b.dataset.r !== undefined) {
      const r = body._rows[+b.dataset.r], nn = await promptDlg('標籤改名／合併', '新名稱', r.name); if (!nn) return;
      const ok = norm(r.name);
      await apply(tags => normTags(tags.map(t => norm(t) === ok ? nn : t)));
    } else if (b.dataset.d !== undefined) {
      const r = body._rows[+b.dataset.d]; if (!(await confirmDlg(`從所有 Snippet 移除標籤「${r.name}」？`, '移除', true))) return;
      const ok = norm(r.name); await apply(tags => tags.filter(t => norm(t) !== ok));
    }
  });
  modal({ title: '管理標籤', body, buttons: [{ text: '關閉', cls: 'primary' }] });
}

/* .bas export */
function exportBasDlg(id) {
  const s = S.snippets.find(x => x.id === id); if (!s) return;
  const b5 = big5Supported(), body = document.createElement('div');
  body.innerHTML = `<label>編碼<select class="full" id="encSel">${b5 ? '<option value="big5">Big5（ANSI）— 繁體中文版 Excel VBE 建議使用</option>' : ''}<option value="utf8bom">UTF-8 含 BOM</option><option value="utf8">UTF-8 不含 BOM</option></select></label>
  <p style="color:var(--muted);margin-top:8px;font-size:12px">VBE 匯入檔案時以系統 ANSI 解讀；繁中 Windows 請選 Big5，中文註解才不會亂碼。無法以 Big5 表示的字元會以「?」取代。模組名稱：${esc(modName(s.title))}</p>`;
  modal({
    title: '匯出 .bas', body, buttons: [{ text: '取消' }, {
      text: '下載', cls: 'primary', onClick: () => {
        const enc = $('#encSel').value, text = buildBas(s); let blob;

/* .bas import */
async function importBasFiles(files) {
  if (!files.length) return;
  const items = []; for (const f of files) items.push({ name: f.name, buf: await f.arrayBuffer(), on: true });
  let enc = 'auto', catId = S.filter.categoryId || 'cat-uncategorized';
  const body = document.createElement('div');
  const parse = () => items.forEach(it => { const p = parseBas(decodeBuf(it.buf, enc), it.name); if (it.edited) p.title = it.title; Object.assign(it, p); });
  const draw = () => {
    body.innerHTML = `<div class="row2"><label style="margin:0">編碼 <select id="impEnc"><option value="auto">自動偵測</option><option value="utf8">UTF-8</option><option value="big5">Big5</option></select></label>
    <label style="margin:0">匯入到 <select id="impCat">${S.categories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label></div>
    <div style="margin-top:8px">${items.map((it, i) => `<div class="imp-row"><input type="checkbox" data-c="${i}" ${it.on ? 'checked' : ''} aria-label="匯入此檔"><input data-t="${i}" value="${esc(it.title)}" maxlength="100" aria-label="名稱"><span style="color:var(--muted);font-size:12px">${esc(it.name)} · ${it.code.split('\n').length} 行</span></div>`).join('')}</div>`;
    $('#impEnc', body).value = enc; $('#impCat', body).value = catId;
  };
  parse(); draw();
  body.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'impEnc') { enc = t.value; parse(); draw(); }
    else if (t.id === 'impCat') catId = t.value;
    else if (t.dataset.c !== undefined) items[+t.dataset.c].on = t.checked;
  });
  body.addEventListener('input', e => { const t = e.target; if (t.dataset.t !== undefined) { const it = items[+t.dataset.t]; it.title = t.value; it.edited = true; } });
  modal({
    title: `匯入 .bas（${items.length} 個檔案）`, body, wide: true, buttons: [{ text: '取消' }, {
      text: '匯入', cls: 'primary', onClick: async () => {
        const sel = items.filter(i => i.on && i.code.trim()), pick = sel.filter(i => i.code.length <= 200000);
        if (sel.length > pick.length) toast(`有 ${sel.length - pick.length} 個檔案超過 200,000 字元，已略過`, 3500);
        if (!pick.length) { toast('沒有可匯入的檔案'); return false; }
        const arr = pick.map(i => newSnippet({ title: (i.title || i.name).trim().slice(0, 100), description: i.description, code: i.code, tags: i.tags, categoryId: catId }));
        try { await DB.putMany('snippets', arr); } catch (e) { handleErr(e); return; }
        S.snippets.push(...arr); S.selectedId = arr[0].id; renderAll(); toast(`已匯入 ${arr.length} 筆`);
      }
    }]
  });
}
/* JSON import flow */
async function importJsonFile(file) {
  let d; try { d = validateBackup(await file.text()); } catch (e) { modal({ title: '無法匯入', body: `<p class="warn">${esc(e.message)}</p>`, buttons: [{ text: '關閉', cls: 'primary' }] }); return; }
  const body = document.createElement('div');
  body.innerHTML = `<p>備份檔：${d.snippets.length} 筆 Snippet、${d.categories.length} 個分類、${(d.history || []).length} 筆歷史。<br>匯出時間：${fmtDate(d.exportedAt)}</p>
  <label><input type="radio" name="mode" value="merge" checked> 合併 — 以 id 比對，同一筆保留 <b>修改時間較新</b> 者</label>
  <label><input type="radio" name="mode" value="overwrite"> 覆蓋 — 清空目前所有資料後寫入（會先自動下載一份目前備份）</label>`;
  modal({
    title: '匯入 JSON 備份', body, buttons: [{ text: '取消' }, {
      text: '匯入', cls: 'primary', onClick: async () => {
        const mode = body.querySelector('input[name=mode]:checked').value;
        if (mode === 'overwrite' && !(await confirmDlg('覆蓋會清空目前所有 Snippet、分類與歷史。\n（會先自動下載目前資料的備份）\n確定繼續？', '覆蓋', true))) return false;
        try {
          const r = await importJSON(d, mode); S.selectedId = null; S.editing = null; S.dirty = false; renderAll();
          modal({ title: '匯入完成', body: `<p>新增 ${r.added} 筆、更新 ${r.updated} 筆、略過 ${r.skipped} 筆。</p>`, buttons: [{ text: '關閉', cls: 'primary' }] });
        } catch (e) { handleErr(e); }
      }
    }]
  });
}

  $('#q').addEventListener('input', debounce(e => { S.filter.query = e.target.value; renderList(); }, 200));
  $('#sortSel').addEventListener('change', async e => { await setSetting('sortBy', e.target.value); renderList(); });
  $('#btnMenu').onclick = () => { if (matchMedia('(max-width:1023px)').matches) document.body.classList.toggle('sidebar-open'); else document.body.classList.toggle('sidebar-collapsed'); };
  document.addEventListener('click', e => { if (document.body.classList.contains('sidebar-open') && !e.target.closest('#side') && !e.target.closest('#btnMenu')) document.body.classList.remove('sidebar-open'); });
  $('#btnNew').onclick = startNew;
  $('#btnImpBas').onclick = () => $('#fileBas').click();
  $('#btnBackup').onclick = () => exportJSON(true);
  $('#btnSettings').onclick = settingsDlg;
  $('#btnTheme').onclick = async () => { const o = ['system', 'light', 'dark'], n = o[(o.indexOf(st('theme', 'system')) + 1) % 3]; await setSetting('theme', n); applySettings(); toast('主題：' + { system: '跟隨系統', light: '淺色', dark: '深色' }[n]); };
  $('#btnEmptyTrash').onclick = () => { const ids = S.snippets.filter(s => s.deletedAt).map(s => s.id); if (ids.length) purgeSnippets(ids, `清空垃圾桶，永久刪除 ${ids.length} 筆？`); };
  $('#fileBas').onchange = async e => { const f = [...e.target.files]; e.target.value = ''; await importBasFiles(f); };
  $('#fileJson').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importJsonFile(f); };

  $('#banner').addEventListener('click', e => { const a = e.target.dataset.act; if (a === 'bkNow') exportJSON(true); else if (a === 'bkHide') { S.bannerDismissed = true; renderBanner(); } });

  $('#side').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { const a = act.dataset.act; if (a === 'addCat') addCat(); else if (a === 'renCat') renCat(act.dataset.id); else if (a === 'delCat') delCat(act.dataset.id); else if (a === 'mgTags') mgTagsDlg(); return; }
    const tg = e.target.closest('[data-tag]');
    if (tg) { const k = tg.dataset.tag, t = S.filter.tags.includes(k) ? S.filter.tags.filter(x => x !== k) : [...S.filter.tags, k]; return setFilter({ tags: t }); }
    const nv = e.target.closest('[data-nav]');
    if (nv) { const k = nv.dataset.nav; return setFilter({ view: k, categoryId: null }); }
    const ct = e.target.closest('[data-cat]');
    if (ct) setFilter({ view: 'all', categoryId: ct.dataset.cat });
  });
  $('#side').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const t = e.target.closest('.nav,.tg'); if (t && e.target === t) { e.preventDefault(); t.click(); } } });
  let dragId = null;
  $('#side').addEventListener('dragstart', e => { const c = e.target.closest('[data-cat]'); if (c) { dragId = c.dataset.cat; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); } });
  const isAfter = (e, c) => { const r = c.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; };
  const clearDrag = () => document.querySelectorAll('.dragover,.dragover-after').forEach(x => x.classList.remove('dragover', 'dragover-after'));
  $('#side').addEventListener('dragover', e => { const c = e.target.closest('[data-cat]'); if (c && dragId) { e.preventDefault(); clearDrag(); c.classList.add(isAfter(e, c) ? 'dragover-after' : 'dragover'); } });
  $('#side').addEventListener('drop', e => { const c = e.target.closest('[data-cat]'); if (c && dragId) { e.preventDefault(); reorderCat(dragId, c.dataset.cat, isAfter(e, c)); } dragId = null; clearDrag(); });
  $('#side').addEventListener('dragend', () => { dragId = null; clearDrag(); });

  $('#list').addEventListener('click', e => {
    const act = e.target.closest('[data-act]'), card = e.target.closest('.card');
    if (act) {
      const a = act.dataset.act;
      if (a === 'cardCopy' && card) { e.stopPropagation(); return doCopy(card.dataset.id); }
      if (a === 'cardFav' && card) { e.stopPropagation(); return toggleFav(card.dataset.id); }
      if (a === 'clearSearch') { $('#q').value = ''; S.filter.query = ''; return renderList(); }
      if (a === 'newSnip') return startNew();
      if (a === 'impBas') return $('#fileBas').click();
    }
    if (card) selectSnippet(card.dataset.id);
  });
  $('#list').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); selectSnippet(e.target.dataset.id); } });

  $('#detail').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, s = cur();
    switch (a) {
      case 'back': (async () => { if (!(await guard())) return; S.editing = null; S.dirty = false; document.body.classList.remove('show-detail'); renderDetail(); })(); break;
      case 'fav': s && toggleFav(s.id); break;
      case 'copy': if (s) { const sel = getSelection(), pre = $('pre.code'); doCopy(s.id, (sel && !sel.isCollapsed && pre && pre.contains(sel.anchorNode)) ? sel.toString() : undefined); } break;
      case 'fill': s && fillDlg(s.id); break;
      case 'edit': s && startEdit(s.id); break;
      case 'dup': s && dupSnippet(s.id); break;
      case 'exportBas': s && exportBasDlg(s.id); break;
      case 'history': s && historyDlg(s.id); break;
      case 'del': s && trashSnippet(s.id); break;
      case 'restore': s && restoreSnippet(s.id); break;
      case 'purge': s && purgeSnippets([s.id], `永久刪除「${s.title}」？此動作無法復原。`); break;
      case 'save': saveEdit(); break;
      case 'cancel': cancelEdit(); break;
      case 'rmTag': S.editing.draft.tags.splice(+b.dataset.i, 1); S.dirty = true; renderChips(); break;
    }
  });
  document.addEventListener('selectionchange', () => {
    const btn = $('#btnCopy'); if (!btn) return;
    const sel = getSelection(), pre = $('pre.code');
    btn.textContent = (sel && !sel.isCollapsed && pre && pre.contains(sel.anchorNode)) ? '複製選取' : '複製';
  });
  window.addEventListener('beforeunload', e => { if (S.editing && S.dirty) { e.preventDefault(); e.returnValue = ''; } });

  document.addEventListener('keydown', async e => {
    if (document.querySelector('dialog[open]')) return;
    const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && k.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
    if (ctrl && !e.shiftKey && k.toLowerCase() === 's') { e.preventDefault(); if (S.editing) saveEdit(); return; }
    if ((ctrl && !e.shiftKey && k.toLowerCase() === 'n') || (e.altKey && k.toLowerCase() === 'n')) { e.preventDefault(); startNew(); return; }
    if ((ctrl && e.shiftKey && k.toLowerCase() === 'c') || (e.altKey && k.toLowerCase() === 'c')) { const s = cur(); if (s && !S.editing) { e.preventDefault(); doCopy(s.id); } return; }
    if (k === 'Escape') { if (e.target.id === 'q') { e.target.value = ''; S.filter.query = ''; renderList(); e.target.blur(); } else if (S.editing) cancelEdit(); return; }
    if (typing || ctrl || e.altKey) return;
    if (k === '/') { e.preventDefault(); $('#q').focus(); }
    else if (k === '?') { e.preventDefault(); helpDlg(); }
    else if (k === 'e' || k === 'E') { const s = cur(); if (s && !S.editing && !s.deletedAt) { e.preventDefault(); startEdit(s.id); } }
    else if ((k === 'ArrowDown' || k === 'ArrowUp') && !S.editing) {
      e.preventDefault(); const v = S._vis; if (!v.length) return;
      let i = v.findIndex(x => x.id === S.selectedId); i = k === 'ArrowDown' ? Math.min(v.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
      selectSnippet(v[i].id);
    }
  });
}

/* ---------- Init ---------- */
function fatal(e) {
  document.body.innerHTML = `<div id="fatal"><h2>⚠️ 無法啟動</h2><p>IndexedDB 無法使用：${esc(e && e.message || e)}</p><p>可能原因：瀏覽器隱私／無痕模式、已停用網站資料儲存、或瀏覽器版本過舊。請改用一般視窗的 Microsoft Edge 或 Chrome 最新版開啟。</p></div>`;
}
(async function init() {
  try { await DB.open(); } catch (e) { return fatal(e); }
  try {
    await loadAll(); await seedIfNeeded(); await purgeTrash(); applySettings(); bind();
    if (!S.snippets.some(s => !s.deletedAt)) { /* 空狀態由 renderList 處理 */ }
    renderAll();
  } catch (e) { fatal(e); }
})();
</script>
