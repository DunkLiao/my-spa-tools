  <script>
    // Global Application State
    const AppState = {
      matrix: [], // 2D array of strings: [ [col1, col2], ... ]
      hasHeader: true,
      currentFormat: 'markdown',
      searchQuery: '',
      isDark: false,
      lastFileBuffer: null, // Cached raw ArrayBuffer for instant re-encoding
      selectedEncoding: 'auto'
    };

    // Sample Datasets for Quick Testing
    const SAMPLE_DATA = [
      "季別\t2025-Q1\t2025-Q2\t2025-Q3\t2025-Q4\t2026-Q1",
      "營收 (百萬)\t120.5\t145.2\t168.0\t210.4\t225.8",
      "毛利率 (%)\t42.1\t44.5\t43.8\t46.2\t47.0",
      "研發費用\t18.2\t19.0\t21.5\t23.0\t24.8",
      "活躍用戶 (K)\t840\t920\t1050\t1200\t1350"
    ].join('\n');

    /**
     * RFC 4180 compliant tabular parser.
     * Supports:
     * - Embedded line breaks (\r, \n) inside quoted fields
     * - Escaped double quotes ("") inside quotes
     * - Automatic delimiter inference (Tab, Comma, Semicolon)
     */
    function parseTextToMatrix(text) {
      if (!text || !text.trim()) return [];

      // Detect delimiter by inspecting character distribution outside quotes
      let delimiter = '\t';
      let tabCount = 0;
      let commaCount = 0;
      let semiCount = 0;
      let testInQuotes = false;
      const testLimit = Math.min(text.length, 3000);

      for (let i = 0; i < testLimit; i++) {
        const ch = text[i];
        if (ch === '"') {
          testInQuotes = !testInQuotes;
        } else if (!testInQuotes) {
          if (ch === '\t') tabCount++;
          else if (ch === ',') commaCount++;
          else if (ch === ';') semiCount++;
        }
      }

      if (tabCount > 0 && tabCount >= commaCount && tabCount >= semiCount) {
        delimiter = '\t';
      } else if (commaCount >= semiCount && commaCount > 0) {
        delimiter = ',';
      } else if (semiCount > 0) {
        delimiter = ';';
      }

      // State machine parser compliant with RFC 4180
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;
      const len = text.length;

      for (let i = 0; i < len; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuotes) {
          if (char === '"') {
            if (nextChar === '"') {
              // Escaped double quote ("")
              currentCell += '"';
              i++; // Skip the escaped quote
            } else {
              // Closing quote
              insideQuotes = false;
            }
          } else {
            // Include all characters (including \r and \n) inside quotes
            currentCell += char;
          }
        } else {
          if (char === '"') {
            insideQuotes = true;
          } else if (char === delimiter) {
            currentRow.push(currentCell.trim());
            currentCell = '';
          } else if (char === '\r') {
            // Handle \r\n or standalone \r
            if (nextChar === '\n') {
              i++;
            }
            currentRow.push(currentCell.trim());
            currentCell = '';
            // Only push non-empty rows
            if (currentRow.some(c => c !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
          } else if (char === '\n') {
            currentRow.push(currentCell.trim());
            currentCell = '';
            if (currentRow.some(c => c !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
          } else {
            currentCell += char;
          }
        }
      }

      // Flush final cell and row
      if (currentCell !== '' || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(c => c !== '')) {
          rows.push(currentRow);
        }
      }

      return rows;
    }

    /**
     * Mathematical 2D Matrix Transpose: M[i][j] -> M[j][i]
     */
    function transposeMatrix(grid) {
      if (!grid || grid.length === 0) return [];
      const maxCols = Math.max(...grid.map(row => row.length));
      const result = [];

      for (let c = 0; c < maxCols; c++) {
        const newRow = [];
        for (let r = 0; r < grid.length; r++) {
          newRow.push(grid[r][c] !== undefined ? grid[r][c] : '');
        }
        result.push(newRow);
      }
      return result;
    }

    /**
     * Convert 2D Matrix into standard delimiter separated string
     */
    function matrixToDelimitedText(grid, delimiter = '\t') {
      return grid.map(row => 
        row.map(cell => {
          const str = String(cell || '');
          if (delimiter === ',') {
            if (str.includes(',') || str.includes('\n') || str.includes('\r') || str.includes('"')) {
              return `"${str.replace(/"/g, '""')}"`;
            }
          } else if (delimiter === '\t') {
            if (str.includes('\t') || str.includes('\n') || str.includes('\r') || str.includes('"')) {
              return `"${str.replace(/"/g, '""')}"`;
            }
          }
          return str;
        }).join(delimiter)
      ).join('\n');
    }

    function generateFormattedOutput(grid, format, hasHeader) {
      if (!grid || grid.length === 0) return '';
      
      const headers = hasHeader && grid.length > 0 
        ? grid[0] 
        : Array.from({ length: Math.max(...grid.map(r => r.length)) }, (_, i) => `Col_${i + 1}`);
      const dataRows = hasHeader ? grid.slice(1) : grid;

      switch (format) {
        case 'markdown': {
          if (grid.length === 0) return '';
          // Markdown tables do not support literal newlines in cells; convert to <br>
          const formatMdCell = (text) => (text || '').replace(/\r?\n/g, '<br>').replace(/\|/g, '\\|');

          const safeHeaders = headers.map(h => formatMdCell(h));
          const colWidths = safeHeaders.map((h, i) => {
            const rowMax = dataRows.reduce((max, r) => Math.max(max, formatMdCell(r[i] || '').length), 0);
            return Math.max(h.length, rowMax, 3);
          });

          const headLine = '| ' + safeHeaders.map((h, i) => h.padEnd(colWidths[i])).join(' | ') + ' |';
          const sepLine = '| ' + colWidths.map(w => '-'.repeat(w)).join(' | ') + ' |';
          const bodyLines = dataRows.map(row => 
            '| ' + headers.map((_, i) => formatMdCell(row[i] || '').padEnd(colWidths[i])).join(' | ') + ' |'
          );

          return [headLine, sepLine, ...bodyLines].join('\n');
        }

        case 'json': {
          const records = dataRows.map(row => {
            const obj = {};
            headers.forEach((h, idx) => {
              const key = h || `Column_${idx + 1}`;
              const val = row[idx] !== undefined ? row[idx] : '';
              // Automatic number coercion if purely numeric and without line break
              obj[key] = (!isNaN(val) && val.trim() !== '' && !val.includes('\n')) ? Number(val) : val;
            });
            return obj;
          });
          return JSON.stringify(records, null, 2);
        }

        case 'sql': {
          const tableName = 'import_table';
          const safeCols = headers.map(h => `\`${(h || 'col').replace(/`/g, '')}\``).join(', ');
          
          const insertLines = dataRows.map(row => {
            const values = headers.map((_, i) => {
              const val = row[i] || '';
              if (!isNaN(val) && val.trim() !== '' && !val.includes('\n')) return val;
              return `'${val.replace(/'/g, "''")}'`;
            }).join(', ');
            return `INSERT INTO ${tableName} (${safeCols}) VALUES (${values});`;
          });

          return insertLines.join('\n');
        }

        case 'html': {
          let html = '<table class="data-table">\n  <thead>\n    <tr>\n';
          headers.forEach(h => {
            html += `      <th>${escapeHtml(h)}</th>\n`;
          });
          html += '    </tr>\n  </thead>\n  <tbody>\n';
          dataRows.forEach(row => {
            html += '    <tr>\n';
            headers.forEach((_, i) => {
              const formattedCell = escapeHtml(row[i] || '').replace(/\r?\n/g, '<br>');
              html += `      <td>${formattedCell}</td>\n`;
            });
            html += '    </tr>\n';
          });
          html += '  </tbody>\n</table>';
          return html;
        }

        case 'csv': {
          return matrixToDelimitedText(grid, ',');
        }

        default:
          return '';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m]));
    }

    /**
     * Decode ArrayBuffer with support for all mainstream Traditional Chinese encodings:
     * - UTF-8 (with BOM / without BOM)
     * - Big5 / CP950 (Standard Windows Traditional Chinese)
     * - UTF-16 LE / BE (Common Excel Unicode export formats)
     */
    function decodeFileBuffer(buffer, encodingChoice = 'auto') {
      const bytes = new Uint8Array(buffer);
      
      if (encodingChoice === 'auto') {
        // 1. Check for standard Byte Order Marks (BOM)
        if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
          return { text: new TextDecoder('utf-8').decode(bytes.slice(3)), detected: 'UTF-8 (BOM)' };
        }
        if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
          return { text: new TextDecoder('utf-16le').decode(bytes.slice(2)), detected: 'UTF-16 LE (BOM)' };
        }
        if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
          return { text: new TextDecoder('utf-16be').decode(bytes.slice(2)), detected: 'UTF-16 BE (BOM)' };
        }

        // 2. Strict UTF-8 validation attempt
        try {
          const strictUtf8 = new TextDecoder('utf-8', { fatal: true });
          const text = strictUtf8.decode(bytes);
          return { text, detected: 'UTF-8' };
        } catch (e) {
          // If UTF-8 fails with byte violations, decode using Big5 / CP950
          try {
            const big5Decoder = new TextDecoder('big5');
            const text = big5Decoder.decode(bytes);
            return { text, detected: 'Big5 (CP950 繁中)' };
          } catch (errBig5) {
            // Fallback
            return { text: new TextDecoder('utf-8').decode(bytes), detected: 'UTF-8 (相容)' };
          }
        }
      } else {
        // Manual override from user dropdown
        try {
          const decoder = new TextDecoder(encodingChoice);
          const text = decoder.decode(bytes);
          return { text, detected: encodingChoice.toUpperCase() };
        } catch (err) {
          return { text: new TextDecoder('utf-8').decode(bytes), detected: 'UTF-8' };
        }
      }
    }

    const rawInputEl = document.getElementById('raw-input');
    const theadEl = document.getElementById('preview-thead');
    const tbodyEl = document.getElementById('preview-tbody');
    const tableEmptyEl = document.getElementById('table-empty-state');
    const outputPreviewEl = document.getElementById('output-preview');
    const statRowsEl = document.getElementById('stat-rows');
    const statColsEl = document.getElementById('stat-cols');
    const statCellsEl = document.getElementById('stat-cells');
    const checkHeaderEl = document.getElementById('check-has-header');
    const tableSearchEl = document.getElementById('table-search');
    const gridMetaTextEl = document.getElementById('grid-meta-text');
    const fileInputEl = document.getElementById('file-input');
    const selectEncodingEl = document.getElementById('select-encoding');
    const detectedBadgeEl = document.getElementById('detected-encoding-badge');

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = message;
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    function updateStats() {
      const rows = AppState.matrix.length;
      const cols = rows > 0 ? Math.max(...AppState.matrix.map(r => r.length)) : 0;
      const cells = rows * cols;
      statRowsEl.innerText = rows;
      statColsEl.innerText = cols;
      statCellsEl.innerText = cells;
    }

    function renderTablePreview() {
      theadEl.innerHTML = '';
      tbodyEl.innerHTML = '';

      if (AppState.matrix.length === 0) {
        tableEmptyEl.classList.remove('hidden');
        gridMetaTextEl.innerText = '顯示 0 列';
        return;
      }

      tableEmptyEl.classList.add('hidden');

      const maxCols = Math.max(...AppState.matrix.map(r => r.length));
      const hasHeader = AppState.hasHeader && AppState.matrix.length > 0;
      const headerRow = hasHeader ? AppState.matrix[0] : null;
      const dataRows = hasHeader ? AppState.matrix.slice(1) : AppState.matrix;

      const query = AppState.searchQuery.trim().toLowerCase();
      const filteredRows = query 
        ? dataRows.filter(row => row.some(cell => String(cell || '').toLowerCase().includes(query)))
        : dataRows;

      // Build Header
      const trHead = document.createElement('tr');
      const thIndex = document.createElement('th');
      thIndex.className = 'py-2.5 px-3 font-semibold text-slate-500 dark:text-slate-400 w-12';
      thIndex.innerText = '#';
      trHead.appendChild(thIndex);

      for (let c = 0; c < maxCols; c++) {
        const th = document.createElement('th');
        th.className = 'py-2.5 px-3 font-semibold text-slate-700 dark:text-slate-200 border-l border-slate-200/50 dark:border-slate-800 grid-cell-clamp';
        th.innerText = headerRow && headerRow[c] !== undefined ? headerRow[c] : `欄位 ${c + 1}`;
        trHead.appendChild(th);
      }
      theadEl.appendChild(trHead);

      // Build Data Rows
      filteredRows.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-brand-50/40 dark:hover:bg-slate-800/40 transition-colors align-top';

        const tdIndex = document.createElement('td');
        tdIndex.className = 'py-2 px-3 text-slate-400 font-mono text-[10px] select-none';
        tdIndex.innerText = rowIndex + 1;
        tr.appendChild(tdIndex);

        for (let c = 0; c < maxCols; c++) {
          const td = document.createElement('td');
          const cellValue = row[c] !== undefined ? row[c] : '';
          
          if (cellValue.includes('\n')) {
            // Multiline cell rendering
            td.className = 'py-2 px-3 border-l border-slate-100 dark:border-slate-800/50 min-w-[140px] max-w-[280px]';
            const badge = document.createElement('span');
            badge.className = 'inline-flex items-center px-1.5 py-0.5 rounded text-[9px] bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800 mb-1 select-none font-sans';
            badge.innerText = '↵ 多行';
            
            const content = document.createElement('div');
            content.className = 'grid-cell-multiline font-mono text-[11px]';
            content.innerText = cellValue;
            
            td.appendChild(badge);
            td.appendChild(content);
          } else {
            td.className = 'py-2 px-3 border-l border-slate-100 dark:border-slate-800/50 grid-cell-clamp';
            td.innerText = cellValue;
          }
          
          td.title = cellValue;
          tr.appendChild(td);
        }
        tbodyEl.appendChild(tr);
      });

      gridMetaTextEl.innerText = query 
        ? `過濾後顯示 ${filteredRows.length} / ${dataRows.length} 列` 
        : `顯示 ${dataRows.length} 列`;
    }

    function updateOutputCode() {
      const code = generateFormattedOutput(AppState.matrix, AppState.currentFormat, AppState.hasHeader);
      outputPreviewEl.value = code;
    }

    function syncStateFromRawInput() {
      const text = rawInputEl.value;
      AppState.matrix = parseTextToMatrix(text);
      updateStats();
      renderTablePreview();
      updateOutputCode();
    }

    // Raw Input typing event
    rawInputEl.addEventListener('input', () => {
      syncStateFromRawInput();
    });

    // Transpose Button Click
    document.getElementById('btn-transpose').addEventListener('click', () => {
      if (AppState.matrix.length === 0) {
        showToast('請先輸入或貼上表格資料');
        return;
      }
      AppState.matrix = transposeMatrix(AppState.matrix);
      rawInputEl.value = matrixToDelimitedText(AppState.matrix, '\t');
      updateStats();
      renderTablePreview();
      updateOutputCode();
      showToast('已完成行列矩陣轉置！');
    });

    // Header Toggle
    checkHeaderEl.addEventListener('change', (e) => {
      AppState.hasHeader = e.target.checked;
      renderTablePreview();
      updateOutputCode();
    });

    // Table Search
    tableSearchEl.addEventListener('input', (e) => {
      AppState.searchQuery = e.target.value;
      renderTablePreview();
    });

    // Clean Empty Rows & Cols
    document.getElementById('btn-clean-empty').addEventListener('click', () => {
      if (AppState.matrix.length === 0) return;
      // Remove all-empty rows
      let cleaned = AppState.matrix.filter(row => row.some(c => c && c.trim() !== ''));
      if (cleaned.length === 0) {
        AppState.matrix = [];
      } else {
        // Transpose to remove empty cols then transpose back
        cleaned = transposeMatrix(cleaned);
        cleaned = cleaned.filter(col => col.some(c => c && c.trim() !== ''));
        cleaned = transposeMatrix(cleaned);
        AppState.matrix = cleaned;
      }
      rawInputEl.value = matrixToDelimitedText(AppState.matrix, '\t');
      updateStats();
      renderTablePreview();
      updateOutputCode();
      showToast('已剔除無效空白行列');
    });

    // Trim Cell Spaces
    document.getElementById('btn-trim-cells').addEventListener('click', () => {
      AppState.matrix = AppState.matrix.map(row => row.map(c => (c || '').trim()));
      rawInputEl.value = matrixToDelimitedText(AppState.matrix, '\t');
      renderTablePreview();
      updateOutputCode();
      showToast('已完成儲存格首尾空格修剪');
    });

    // Clear All
    document.getElementById('btn-clear-all').addEventListener('click', () => {
      AppState.matrix = [];
      AppState.lastFileBuffer = null;
      rawInputEl.value = '';
      tableSearchEl.value = '';
      AppState.searchQuery = '';
      detectedBadgeEl.classList.add('hidden');
      updateStats();
      renderTablePreview();
      updateOutputCode();
      showToast('已清空所有內容');
    });

    // Load Sample Data
    document.getElementById('btn-load-sample').addEventListener('click', () => {
      rawInputEl.value = SAMPLE_DATA;
      syncStateFromRawInput();
      showToast('已載入示範財務報表矩陣');
    });

    // Format Tab Buttons
    document.querySelectorAll('.format-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-tab-btn').forEach(b => {
          b.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-brand-300');
        });
        btn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-brand-300');
        AppState.currentFormat = btn.dataset.format;
        updateOutputCode();
      });
    });

    // Direct Clipboard Paste button
    document.getElementById('btn-paste-clipboard').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          rawInputEl.value = text;
          syncStateFromRawInput();
          showToast('已成功讀取剪貼簿內容');
        }
      } catch (err) {
        rawInputEl.focus();
        showToast('請使用鍵盤 Ctrl+V / Cmd+V 貼上');
      }
    });

    // Copy formatted output safely
    document.getElementById('btn-copy-output').addEventListener('click', () => {
      const output = outputPreviewEl.value;
      if (!output) {
        showToast('無可複製之內容');
        return;
      }
      outputPreviewEl.select();
      document.execCommand('copy');
      
      const feedback = document.getElementById('copy-feedback');
      feedback.classList.remove('opacity-0');
      feedback.classList.add('opacity-100');
      setTimeout(() => {
        feedback.classList.remove('opacity-100');
        feedback.classList.add('opacity-0');
      }, 1500);
      showToast('代碼已複製到剪貼簿！');
    });

    // Download CSV
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      if (AppState.matrix.length === 0) return;
      const csvContent = generateFormattedOutput(AppState.matrix, 'csv', AppState.hasHeader);
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `matrix_export_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('CSV 檔案下載完成');
    });

    /**
     * Process an ArrayBuffer representing a loaded CSV/TSV file
     */
    function processUploadedFileBuffer(buffer, fileName = '') {
      AppState.lastFileBuffer = buffer;
      const { text, detected } = decodeFileBuffer(buffer, AppState.selectedEncoding);
      
      rawInputEl.value = text;
      syncStateFromRawInput();

      detectedBadgeEl.innerText = `編碼: ${detected}`;
      detectedBadgeEl.classList.remove('hidden');

      showToast(`已載入 ${fileName || '檔案'} (${detected})`);
    }

    // File Input Trigger Button
    document.getElementById('btn-import-file').addEventListener('click', () => {
      fileInputEl.click();
    });

    // Handle File Input Change
    fileInputEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        processUploadedFileBuffer(event.target.result, file.name);
      };
      reader.readAsArrayBuffer(file);
      fileInputEl.value = ''; // Reset input to allow re-uploading same file
    });

    // Handle Encoding Selector Change
    selectEncodingEl.addEventListener('change', (e) => {
      AppState.selectedEncoding = e.target.value;
      if (AppState.lastFileBuffer) {
        // Instantly re-decode cached file buffer with new encoding selection
        processUploadedFileBuffer(AppState.lastFileBuffer, '重新解碼');
      } else if (rawInputEl.value.trim().length > 0) {
        showToast('建議點擊「匯入 CSV / 檔案」以套用特定繁中編碼解析');
      }
    });

    // Drag & Drop
    const dropArea = rawInputEl;
    const overlay = document.getElementById('drag-drop-overlay');

    ['dragenter', 'dragover'].forEach(name => {
      window.addEventListener(name, (e) => {
        e.preventDefault();
        overlay.classList.remove('hidden');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      overlay.addEventListener(name, (e) => {
        e.preventDefault();
        overlay.classList.add('hidden');
      });
    });

    overlay.addEventListener('drop', (e) => {
      e.preventDefault();
      overlay.classList.add('hidden');
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        const file = files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
          processUploadedFileBuffer(event.target.result, file.name);
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // Theme Toggle
    const themeBtn = document.getElementById('btn-theme-toggle');
    const sunIcon = document.getElementById('theme-sun');
    const moonIcon = document.getElementById('theme-moon');

    function initTheme() {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        AppState.isDark = true;
      }
    }

    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      AppState.isDark = document.documentElement.classList.contains('dark');
      if (AppState.isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    });

    // Init with Sample Data Onload
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      // Select first format tab style
      const firstTab = document.querySelector('.format-tab-btn');
      if (firstTab) {
        firstTab.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-brand-600', 'dark:text-brand-300');
      }
      rawInputEl.value = SAMPLE_DATA;
      syncStateFromRawInput();
    });
  </script>
