<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設計債務分析器 Design Debt Analyzer v1.4</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1d2129;--sub:#5c6370;--line:#e3e6eb;--pri:#4f46e5;--pri2:#eef2ff;--hover:#f0f1f4;
--A:#22a06b;--B:#d4a106;--C:#f18d13;--D:#e5484d;--E:#3b3f46;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04)}
[data-theme=dark]{--bg:#121418;--panel:#1b1e24;--text:#e6e8eb;--sub:#9aa1ac;--line:#2c3038;--pri:#818cf8;--pri2:#262a45;--hover:#242830;--E:#8b919c;--shadow:none}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:16px;margin-right:8px;white-space:nowrap}.logo span{color:var(--pri)}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--hover)}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.pri:hover{opacity:.9}
.sp{flex:1}
.layout{display:flex;min-height:calc(100vh - 56px)}
nav{width:170px;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
nav a{display:block;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;color:var(--text);text-decoration:none}
nav a:hover{background:var(--hover)}nav a.on{background:var(--pri2);color:var(--pri);font-weight:700}
nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
main{flex:1;padding:20px;min-width:0}
h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g7{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.dim{border-left:4px solid var(--pri)}.dim b{font-size:22px}.muted{color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.high{background:#fde2e2;color:#c0262d}.med{background:#fff1d6;color:#a35d00}.low{background:#e3f1ff;color:#1b5fa8}
[data-theme=dark] .high{background:#4a1e22;color:#ff9da1}[data-theme=dark] .med{background:#46340f;color:#ffcf73}[data-theme=dark] .low{background:#163250;color:#8cc3ff}
.sw{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
.swrow{display:flex;flex-wrap:wrap;gap:6px}.swbox{text-align:center;font-size:10px;width:62px}
.cl{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}.cl .ln{width:18px;height:2px;background:var(--sub)}
.vwall{display:flex;flex-wrap:wrap;gap:14px}.vitem{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:150px;text-align:center;position:relative}
.vitem.red{border-color:var(--D);border-style:dashed}.vitem .stage{min-height:60px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--hover) 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:6px;padding:8px;margin-bottom:6px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center;cursor:pointer}.drop.over{border-color:var(--pri);background:var(--pri2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prog{height:8px;background:var(--hover);border-radius:4px;overflow:hidden;margin:10px 0}.prog div{height:100%;background:var(--pri);width:0;transition:width .2s}
#toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.show{opacity:1}
pre{background:var(--hover);padding:12px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px}
details summary{cursor:pointer;color:var(--pri);font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.form{display:grid;grid-template-columns:220px 140px 1fr;gap:8px 12px;align-items:center}
code{background:var(--hover);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">設計債務<span>分析器</span> <small class="muted">v1.4</small></div>
  <select id="projSel" title="專案"></select>
  <button id="btnNewProj" title="新增專案">＋</button>
  <button id="btnRenProj" title="重新命名">✎</button>
  <button id="btnDelProj" title="刪除專案">🗑</button>
  <select id="snapSel" title="快照"></select>
  <div class="sp"></div>
  <button data-go="import">匯入</button>
  <button data-go="export">匯出</button>
  <button data-go="settings">設定</button>
  <button id="btnTheme" title="切換深色模式">🌙</button>
</header>
<div class="layout">
  <nav id="nav">
    <a data-v="dashboard">📊 總覽</a><a data-v="issues">📋 債務清單</a><a data-v="colors">🎨 色彩地圖</a>
    <a data-v="type">🔤 字型階梯</a><a data-v="variants">🧩 變體牆</a><a data-v="spacing">📏 間距分析</a>
    <a data-v="trend">📈 趨勢比較</a><a data-v="suggest">💡 整併建議</a><hr>
    <a data-v="import">📥 匯入</a><a data-v="export">📤 匯出與備份</a><a data-v="settings">⚙️ 設定</a>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<!-- ===================== 核心分析引擎（主執行緒與 Web Worker 共用） ===================== -->
<script type="text/plain" id="core">

function newCol(){return{colors:{},fontSizes:{},fontWeights:{},fontFamilies:{},lineHeights:{},spacings:{},radii:{},shadows:{},components:[],inst:{total:0,detached:0,list:[]},tokenColors:[]}}

function px(v){var m=String(v).match(/(-?[\d.]+)(px|rem|em)?/);if(!m)return null;var n=parseFloat(m[1]);if(m[2]==='rem'||m[2]==='em')n*=16;return Math.round(n*100)/100}
function catOf(s){for(var i=0;i<CATS.length;i++)if(CATS[i][1].test(s))return CATS[i][0];return null}
function firstColor(v){if(!v)return null;CRE.lastIndex=0;var m=CRE.exec(v);CRE.lastIndex=0;if(!m)return null;return m[1]?normHex('#'+m[1]):rgbToHex(+m[2],+m[3],+m[4])}

 else if(p==='font-weight'){var w={normal:400,bold:700,lighter:300,bolder:800}[v]||parseInt(v);if(w)add(col.fontWeights,w,loc)}
 else if(p==='font-family'){add(col.fontFamilies,v.split(',')[0].replace(/['"]/g,'').trim(),loc)}
 else if(p==='line-height'){add(col.lineHeights,v,loc)}
 else if(/^(margin|padding|gap|row-gap|column-gap)(-(top|right|bottom|left|inline|block)(-start|-end)?)?$/.test(p)){(v.match(/-?[\d.]+(px|rem)/g)||[]).forEach(function(t){var n=Math.abs(px(t));if(n>0)add(col.spacings,n,loc)})}

  while((d=dre.exec(body))){var p=d[1].toLowerCase(),v=d[2].trim();props[p]=v;collectDecl(p,v,name+':'+lineAt(bs+d.index)+' '+sel.slice(0,40),col)}
  var cat=catOf(sel);
  if(cat&&!/:(hover|focus|active|disabled|visited|focus-visible|checked)|::/.test(sel)){
   var pr={bg:firstColor(props['background-color']||props.background),color:firstColor(props.color),fontSize:props['font-size'],fontWeight:props['font-weight'],radius:props['border-radius'],padding:props.padding,border:props.border,shadow:props['box-shadow'],height:props.height},o={};
   for(var k in pr)if(pr[k])o[k]=String(pr[k]);
   if(Object.keys(o).length>=2)col.components.push({cat:cat,fp:JSON.stringify(o),props:o,loc:name+':'+lineAt(m.index)+' '+sel.slice(0,40)})}}}
function fcol(c){return rgbToHex(c.r*255,c.g*255,c.b*255)}
function firstText(n){if(n.type==='TEXT')return n;var ch=n.children||[];for(var i=0;i<ch.length;i++){var t=firstText(ch[i]);if(t)return t}return null}
function isFigma(j){return j&&(j.document||j.nodes||(j.type==='DOCUMENT'))}
function parseFigma(data,name,col){
 var roots=[];if(data.document)roots.push(data.document);if(data.nodes)Object.keys(data.nodes).forEach(function(k){var n=data.nodes[k];if(n&&n.document)roots.push(n.document)});if(!roots.length)roots.push(data);
 var cnt=0;
 function walk(n,path,inComp){cnt++;if(cnt%2000===0)progress(null,'已掃描 '+cnt+' 個節點');
  var p=path+'/'+(n.name||n.type),loc='Figma '+name+' '+(p.length>80?'…'+p.slice(-80):p);
  (n.fills||[]).concat(n.strokes||[]).forEach(function(f){if(f&&f.type==='SOLID'&&f.visible!==false&&f.color)add(col.colors,fcol(f.color),loc)});
  if(n.type==='TEXT'&&n.style){var s=n.style;if(s.fontSize)add(col.fontSizes,Math.round(s.fontSize*100)/100,loc);if(s.fontWeight)add(col.fontWeights,s.fontWeight,loc);if(s.fontFamily)add(col.fontFamilies,s.fontFamily,loc);if(s.lineHeightPx)add(col.lineHeights,Math.round(s.lineHeightPx)+'px',loc)}
  if(n.cornerRadius>0)add(col.radii,n.cornerRadius,loc);
  (n.effects||[]).forEach(function(e){if((e.type==='DROP_SHADOW'||e.type==='INNER_SHADOW')&&e.visible!==false){var o=e.offset||{x:0,y:0};add(col.shadows,(e.type==='INNER_SHADOW'?'inset ':'')+o.x+'px '+o.y+'px '+(e.radius||0)+'px '+(e.spread||0)+'px '+(e.color?fcol(e.color):''),loc)}});

   var f=(n.fills||[]).filter(function(x){return x.type==='SOLID'&&x.visible!==false})[0],st=(n.strokes||[]).filter(function(x){return x.type==='SOLID'})[0],t=firstText(n),o={};

function ents(map){return Object.keys(map).map(function(k){return{k:k,count:map[k].count,locs:map[k].locs}}).sort(function(a,b){return b.count-a.count})}

async function importFiles(files,extra=[]){const texts=[...extra],shots=[];const box=$('#progBox');if(box)box.style.display='block';const prog=(p,m)=>{const b=$('#progBar'),t=$('#progTxt');if(b&&p!=null)b.style.width=p+'%';if(t&&m)t.textContent=m};
 try{for(const f of files){if(/\.(png|jpe?g|webp)$/i.test(f.name)){prog(null,'萃取截圖色彩 '+f.name);shots.push({name:f.name,colors:await extractImageColors(f)})}
   else if(/\.(json|css|scss)$/i.test(f.name))texts.push({name:f.name,text:await f.text()});else toast('略過不支援的檔案：'+f.name)}
  if(!texts.length&&!shots.length)return;
  const r=await runCore({files:texts,shots,settings:st.S,tokens:await officialTokens()},prog);
  for(const t of r.rawTokens)await DB.put('tokens',{tokenSetId:uid('t'),projectId:st.pid,type:'official',name:t.name,data:t.data,colors:r.col.tokenColors,createdAt:Date.now()});
  await saveSnapshot(r.col,r.result,[...texts.map(t=>t.name),...shots.map(s=>s.name)]);toast(`分析完成：Debt Score ${r.result.score}`);go('dashboard')}
 catch(e){console.error(e);toast('分析失敗：'+e.message);prog(0,'分析失敗：'+e.message)}}
async function saveSnapshot(col,res,sources){const prev=st.snaps[st.snaps.length-1],prevStatus={};
 if(prev)(await DB.all('issues')).filter(i=>i.snapshotId===prev.snapshotId).forEach(i=>prevStatus[i.key]=i.status);
 const sid=uid('s'),snap={snapshotId:sid,projectId:st.pid,sourceFiles:sources,debtScore:res.score,grade:res.grade,dimensionScores:Object.fromEntries(Object.entries(res.dims).map(([k,v])=>[k,v.score])),dims:res.dims,derived:res.derived,col,createdAt:Date.now()};
 await DB.put('snapshots',snap);await DB.putMany('issues',mkIssues(res.issues,sid,prevStatus));
 const p=st.projects.find(p=>p.projectId===st.pid);p.updatedAt=Date.now();await DB.put('projects',p);st.sid=sid;await loadSnaps(true)}
function mkIssues(list,sid,prevStatus){const rank={high:0,med:1,low:2};return list.slice().sort((a,b)=>rank[a.sev]-rank[b.sev]||b.count-a.count).map((x,i)=>({issueId:sid+'_'+i,snapshotId:sid,no:i+1,code:'DD-'+String(i+1).padStart(3,'0'),key:x.key,dimension:x.dim,severity:x.sev,description:x.desc,count:x.count,locations:x.locs,suggestion:x.sug,status:prevStatus[x.key]||'todo'}))}
async function reanalyze(){if(!st.snap)return toast('目前沒有快照');const col=st.snap.col,res=analyze(col,st.S),prevStatus={};st.issues.forEach(i=>prevStatus[i.key]=i.status);
 for(const i of st.issues)await DB.del('issues',i.issueId);
 Object.assign(st.snap,{debtScore:res.score,grade:res.grade,dimensionScores:Object.fromEntries(Object.entries(res.dims).map(([k,v])=>[k,v.score])),dims:res.dims,derived:res.derived});
 await DB.put('snapshots',st.snap);await DB.putMany('issues',mkIssues(res.issues,st.sid,prevStatus));await loadSnaps(true);toast('已依新設定重新分析')}

function buildSuggested(){const D=st.snap.derived,S=st.S,tok={color:{},fontSize:{},spacing:{},radius:{},shadow:{}};
 D.reps.slice(0,S.maxColors).forEach((c,i)=>{const t=D.colors.find(x=>x.k===c.k)?.tok;tok.color[t?t.replace(/^color\./,'').replace(/\./g,'-'):'c'+String(i+1).padStart(2,'0')]={$type:'color',$value:c.k}});
 D.scale.forEach((v,i)=>tok.fontSize[['xs','sm','md','lg','xl','2xl','3xl','4xl','5xl','6xl','7xl','8xl'][i]||'s'+i]={$type:'dimension',$value:v+'px'});
 [0.5,1,1.5,2,3,4,5,6,8].forEach(m=>{const v=S.grid*m;if(Number.isInteger(v))tok.spacing[String(v/S.grid).replace('.','_')]={$type:'dimension',$value:v+'px'}});
 D.rd.slice(0,S.maxRadii).map(r=>r.v).sort((a,b)=>a-b).forEach((v,i)=>tok.radius[['sm','md','lg','xl','2xl','3xl'][i]||'r'+i]={$type:'dimension',$value:v+'px'});
 D.sh.slice(0,S.maxShadows).forEach((s,i)=>tok.shadow['elevation-'+(i+1)]={$type:'shadow',$value:s.k});return tok}

 <div class="card"><h3>💾 建議版 Design Tokens（W3C DTCG）</h3><div class="row"><button class="pri" id="bTok">下載 JSON</button><button id="bTokSave">存入專案</button></div><pre>${esc(JSON.stringify(tok,null,2))}</pre></div></div>`;

function vImport(){main.innerHTML=`<h2>匯入與分析</h2><div class="card"><div class="drop" id="drop"><div style="font-size:36px">📥</div><b>拖拉檔案到這裡，或點擊選擇檔案（可多選）</b><div class="muted">支援：Figma JSON、CSS / SCSS、Design Tokens JSON（W3C DTCG / Tokens Studio）、截圖 PNG / JPG</div></div>
 <input type="file" id="fIn" multiple accept=".json,.css,.scss,.png,.jpg,.jpeg,.webp" hidden><div id="progBox" style="display:none"><div class="prog"><div id="progBar"></div></div><div class="muted" id="progTxt">準備中…</div></div>
 <div class="row" style="margin-top:12px"><button onclick="loadSample()">🧪 載入範例資料</button><span class="muted">同一次匯入的所有檔案會合併為一個快照</span></div></div>
 <div class="card"><h3>🔗 Figma API 直連</h3><div class="row"><input type="password" id="fgT" placeholder="Personal Access Token" style="width:260px"><input type="text" id="fgK" placeholder="File Key 或檔案網址" style="width:300px" value="${esc(localStorage.getItem('dda_fk')||'')}"><button class="pri" id="fgGo">讀取並分析</button></div><div class="muted">Token 只用於本次請求，不會被儲存；此功能需要連網。</div></div>`;

 drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');importFiles([...e.dataTransfer.files])};

  $('#progBox').style.display='block';$('#progTxt').textContent='從 Figma 下載檔案中…';
  try{const r=await fetch('https://api.figma.com/v1/files/'+encodeURIComponent(k),{headers:{'X-Figma-Token':t}});if(!r.ok)throw new Error('HTTP '+r.status);const txt=await r.text();await importFiles([],[{name:'figma-'+k+'.json',text:txt}])}catch(e){toast('Figma 讀取失敗：'+e.message);$('#progTxt').textContent='讀取失敗：'+e.message}}}
function vExport(){main.innerHTML=`<h2>匯出與備份</h2><div class="grid g2"><div class="card"><h3>📤 分析報告（目前快照）</h3><div class="row"><button class="pri" id="eX">Excel (.xlsx)</button><button id="eM">Markdown</button><button id="eJ">JSON</button><button id="eT">建議 Tokens</button><button id="eP">儀表板 PNG</button></div><div class="muted">Excel 匯出需連網載入 SheetJS；離線時自動改匯出 CSV。</div></div>

 $('#bR').onclick=()=>$('#bF').click();$('#bF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='DesignDebtDB')throw new Error('不是本工具的備份檔');if(!confirm('確定要以備份覆蓋目前所有資料？'))return;

 Object.keys(DIMS).forEach(k=>m+=`| ${k} | ${DIMS[k]} | ${st.S.weights[k]}% | ${s.dims[k].score} | ${s.dims[k].metric} |\n`);
 m+=`\n## 債務明細（${st.issues.length} 項）\n\n| 編號 | 維度 | 嚴重度 | 問題描述 | 次數 | 建議處理 | 狀態 |\n|---|---|---|---|---|---|---|\n`;
 st.issues.forEach(i=>m+=`| ${i.code} | ${i.dimension} | ${SEV[i.severity]} | ${i.description.replace(/\|/g,'\\|')} | ${i.count} | ${i.suggestion.replace(/\|/g,'\\|')} | ${STATUS[i.status]} |\n`);return m}
