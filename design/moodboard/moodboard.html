    if (chips.length) {
      const wrap = el('div', { class: 'result-bar__chips' });
      chips.forEach((chip) => {
        const node = el('span', { class: 'chip chip--filter' }, chip.label,
          el('button', {
            type: 'button',
            'aria-label': '移除篩選：' + chip.label,
            onclick: () => { chip.clear(); state.limit = CONFIG.pageSize; renderAll(); },
          }, icon('close')));
        wrap.append(node);
      });
      wrap.append(el('button', {
        class: 'link-btn', type: 'button', text: '清除全部',
        onclick: clearFilters,
      }));
      nodes.push(wrap);
    }
    if (state.sort === 'manual' && state.view !== 'board') {
      nodes.push(el('span', { class: 'hint', text: '手動排序請切到「看板」拖曳卡片' }));
    }
    resultBar.replaceChildren(...nodes);
  }

  function renderFooter() {
    const active = activeItems();
    const images = active.filter((i) => i.kind === 'image').length;
    const links = active.filter((i) => i.kind === 'link').length;
    const texts = active.length - images - links;
    countEl.textContent = '共 ' + active.length + ' 則 · 圖片 ' + images + ' · 連結 ' + links + ' · 文字 ' + texts;
  }

  function renderView(list) {
    mediaObserver.disconnect();
    viewRoot.replaceChildren();

    if (!list.length) {
      viewRoot.append(emptyState());
      return;
    }
    if (state.showTrash) {
      viewRoot.append(rowsEl(list));
      return;
    }
    if (state.view === 'board') {
      viewRoot.append(boardEl(list));
      return;
    }
    if (state.view === 'list') {
      viewRoot.append(rowsEl(list));
      return;
    }
    const shown = list.slice(0, state.limit);
    const wrap = el('div', { class: 'masonry' });
    shown.forEach((it) => wrap.append(tileEl(it, 'grid')));
    viewRoot.append(wrap);
    if (list.length > shown.length) {
      viewRoot.append(el('div', { class: 'load-more' },
        el('button', {
          class: 'btn', type: 'button',
          text: '載入更多（還有 ' + (list.length - shown.length) + ' 則）',
          onclick: () => { state.limit += CONFIG.pageSize; renderAll(); },
        })));
    }
  }

  function tileEl(it, variant) {
    const tile = el('article', {
      class: 'tile tile--' + variant + (it.favorite ? ' is-fav' : ''),
      dataset: { id: it.id },
      tabIndex: 0,
      'aria-label': (it.title || '未命名') + '，' + STATE_LABEL[it.state],
    });
    tile.addEventListener('click', () => openDetail(it.id));
    tile.addEventListener('keydown', (event) => {
      if (event.target !== tile) return;
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openDetail(it.id);
      }
    });

    const media = el('div', {
      class: 'tile__media',
      dataset: { itemId: it.id, mediaKind: 'thumb' },
    });
    const ratio = it.width && it.height ? it.width + ' / ' + it.height : (variant === 'board' ? '16 / 10' : '4 / 3');
    media.style.aspectRatio = ratio;
    if (it.kind === 'image') {
      media.classList.add('is-loading');
      if (it.colors && it.colors[0]) media.style.backgroundColor = hexAlpha(it.colors[0], 0.14);
      tile.append(media);
      observeMedia(media);
    } else {
      media.classList.add('tile__media--decor');
      media.append(decorPanel(it, 'card'));
      tile.append(media);
    }

    const body = el('div', { class: 'tile__body' });
    body.append(el('p', { class: 'tile__title', text: it.title || (it.url ? domainOf(it.url) : '未命名') }));
    if (variant !== 'board' && it.note && it.kind !== 'text') {
      body.append(el('p', { class: 'tile__note', text: it.note }));
    }
    if (it.tags && it.tags.length) body.append(tagChips(it.tags));

    const foot = el('div', { class: 'tile__foot' },
      el('span', { class: 'state-dot', dataset: { state: it.state }, text: STATE_LABEL[it.state] }),
      el('span', { class: 'tile__date mono', text: fmtShort(it.createdAt) })
    );
    if (it.colors && it.colors.length) {
      const dots = el('span', { class: 'dots' });
      it.colors.slice(0, 4).forEach((c) => {
        const dot = el('span', { class: 'dot' });
        dot.style.background = c;
        dot.title = c;
        dots.append(dot);
      });
      foot.insertBefore(dots, foot.lastChild);
    }
    body.append(foot);
    tile.append(body);

    tile.append(favButton(it));
    if (variant === 'board') attachDrag(tile, it);
    return tile;
  }

  function rowsEl(list) {
    const shown = list.slice(0, state.limit);
    const ul = el('ul', { class: 'rows' });
    shown.forEach((it) => ul.append(rowItemEl(it)));
    const frag = document.createDocumentFragment();
    frag.append(ul);
    if (list.length > shown.length) {
      frag.append(el('div', { class: 'load-more' },
        el('button', {
          class: 'btn', type: 'button',
          text: '載入更多（還有 ' + (list.length - shown.length) + ' 則）',
          onclick: () => { state.limit += CONFIG.pageSize; renderAll(); },
        })));
    }
    return frag;
  }

  function rowItemEl(it) {
    const li = el('li', { class: 'row-item', dataset: { id: it.id }, tabIndex: 0 });
    li.addEventListener('click', () => openDetail(it.id));
    li.addEventListener('keydown', (event) => {
      if (event.target !== li) return;
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDetail(it.id); }
    });

    const thumb = el('div', { class: 'row-item__thumb' });
    if (it.kind === 'image') {
      thumb.append(el('div', {
        style: { position: 'absolute', inset: '0' },
        dataset: { itemId: it.id, mediaKind: 'thumb' },
        class: 'row-thumb-media is-loading',
      }));
      const mediaNode = thumb.firstChild;
      mediaNode.style.position = 'absolute';
      observeMedia(mediaNode);
    } else {
      thumb.append(icon(it.kind === 'link' ? 'link' : 'text'));
    }

    const main = el('div', { class: 'row-item__main' },
      el('p', { class: 'row-item__title', text: it.title || (it.url ? domainOf(it.url) : '未命名') }),
      el('div', { class: 'row-item__meta' },
        el('span', { class: 'state-dot', dataset: { state: it.state }, text: STATE_LABEL[it.state] }),
        el('span', { text: KIND_LABEL[it.kind] }),
        it.tags && it.tags.length ? el('span', { text: '#' + it.tags.slice(0, 2).join(' #') }) : null,
        el('span', { class: 'mono', text: fmtShort(it.createdAt) })
      )
    );

    const actions = el('div', { class: 'row-item__actions' });
    if (state.showTrash) {
      actions.append(
        el('button', {
          class: 'btn btn--sm', type: 'button', text: '復原',
          onclick: (event) => { event.stopPropagation(); restoreItem(it); },
        }),
        el('button', {
          class: 'btn btn--sm btn--danger', type: 'button', text: '永久刪除',
          onclick: (event) => { event.stopPropagation(); purgeItem(it); },
        })
      );
    } else {
      actions.append(
        favButton(it, 'row'),
        el('button', {
          class: 'icon-btn', type: 'button', 'aria-label': '移到回收筒',
          onclick: (event) => { event.stopPropagation(); trashItem(it); },
        }, icon('trash'))
      );
    }
    li.append(thumb, main, actions);
    return li;
  }

  function boardEl(list) {
    const board = el('div', { class: 'board' });
    STATES.forEach((st) => {
      const items = list.filter((i) => i.state === st.id);
      const col = el('section', { class: 'board__col', dataset: { state: st.id } });
      col.append(el('header', { class: 'board__head' },
        el('span', { class: 'board__title', text: st.label }),
        el('span', { class: 'board__count', text: String(items.length) })
      ));
      const drop = el('div', { class: 'board__list', dataset: { state: st.id } });
      if (!items.length) drop.append(el('p', { class: 'board__empty', text: '拖曳卡片到這裡' }));
      items.forEach((it) => drop.append(tileEl(it, 'board')));
      drop.addEventListener('dragover', onBoardDragOver);
      drop.addEventListener('dragleave', (event) => {
        if (!drop.contains(event.relatedTarget)) clearDropHints();
      });
      drop.addEventListener('drop', onBoardDrop);
      col.append(drop);
      board.append(col);
    });
    return board;
  }

  function emptyState() {
    if (state.showTrash) {
      return el('div', { class: 'empty' },
        el('div', { class: 'empty__art' }, el('span', { html: emptyArt() })),
        el('h3', { text: '回收筒是空的' }),
        el('p', { text: '刪除的靈感會先放在這裡，可以復原或永久刪除。' })
      );
    }
    if (!activeItems().length) {
      const trashed = state.items.filter((i) => i.deletedAt).length;
      if (trashed) {
        return el('div', { class: 'empty' },
          el('div', { class: 'empty__art' }, el('span', { html: emptyArt() })),
          el('h3', { text: '收藏庫目前是空的' }),
          el('p', { text: '還有 ' + trashed + ' 則靈感在回收筒裡，可以復原它們，或直接新增下一則。' }),
          el('div', { class: 'row' },
            el('button', {
              class: 'btn', type: 'button', text: '打開回收筒',
              onclick: () => { state.showTrash = true; renderAll(); },
            }),
            el('button', {
              class: 'btn btn--primary', type: 'button', text: '新增靈感',
              onclick: () => openAdd({ kind: 'image' }),
            })
          )
        );
      }
      return el('div', { class: 'empty' },
        el('div', { class: 'empty__art' }, el('span', { html: emptyArt() })),
        el('h3', { text: '從第一則靈感開始' }),
        el('p', { text: '把圖片拖進視窗、直接貼上截圖，或先存一個網址。所有資料只留在這台裝置上，斷網也能用。' }),
        el('div', { class: 'row' },
          el('button', {
            class: 'btn btn--primary', type: 'button',
            onclick: () => openAdd({ kind: 'image' }),
          }, '選擇圖片'),
          el('button', {
            class: 'btn', type: 'button',
            onclick: () => openAdd({ kind: 'link' }),
          }, '貼上網址')
        )
      );
    }
    return el('div', { class: 'empty' },
      el('div', { class: 'empty__art' }, el('span', { html: emptyArt() })),
      el('h3', { text: '這裡沒有符合的靈感' }),
      el('p', { text: state.query.trim() ? '找不到「' + truncate(state.query.trim(), 30) + '」，換個關鍵字或清除篩選試試。' : '目前篩選條件下沒有資料，清除篩選看全部。' }),
      el('div', { class: 'row' }, el('button', { class: 'btn', type: 'button', text: '清除篩選', onclick: clearFilters }))
    );
  }
  function emptyArt() {
    return '<svg viewBox="0 0 168 116" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<rect x="18" y="22" width="56" height="46" rx="8" transform="rotate(-6 18 22)"/>'
      + '<rect x="92" y="30" width="58" height="42" rx="8" transform="rotate(4 92 30)"/>'
      + '<rect x="54" y="48" width="62" height="50" rx="9" fill="var(--surface)"/>'
      + '<circle cx="78" cy="68" r="6"/>'
      + '<path d="M60 92l12-13c2-2 5-2 7 0l7 8 5-5c2-2 5-2 7 0l8 8"/>'
      + '<path d="M138 14l2.6 5.4 5.4.8-4 3.8.9 5.4-4.9-2.6-4.9 2.6.9-5.4-4-3.8 5.4-.8z"/>'
      + '</svg>';
  }

  function tagChips(tags) {
    const wrap = el('div', { class: 'chip-row' });
    tags.slice(0, 3).forEach((tag) => wrap.append(el('span', { class: 'chip', text: '#' + tag })));
    if (tags.length > 3) wrap.append(el('span', { class: 'chip', text: '+' + (tags.length - 3) }));
    return wrap;
  }
  function favButton(it, variant) {
    const btn = el('button', {
      class: 'tile__fav' + (it.favorite ? ' is-on' : '') + (variant === 'row' ? ' tile__fav--row' : ''),
      type: 'button',
      'aria-pressed': String(Boolean(it.favorite)),
      'aria-label': it.favorite ? '取消收藏' : '加入收藏',
      title: it.favorite ? '取消收藏' : '加入收藏',
      onclick: (event) => { event.stopPropagation(); toggleFavorite(it); },
    });
    btn.append(icon('star'));
    return btn;
  }
  function decorPanel(it, size) {
    const box = el('div', { class: 'decor decor--' + size, dataset: { kind: it.kind } });
    if (it.kind === 'link') {
      const domain = domainOf(it.url) || '外部連結';
      box.append(
        el('div', { class: 'decor__chrome' },
          el('span', { class: 'dot-i' }), el('span', { class: 'dot-i' }), el('span', { class: 'dot-i' }),
          el('span', { class: 'decor__url mono', text: domain })
        ),
        el('div', { class: 'decor__linkbody' },
          el('span', { class: 'decor__glyph', html: ICONS.link }),
          el('p', { class: 'decor__domain', text: domain })
        )
      );
    } else {
      box.append(el('span', { class: 'decor__mark', text: '”' }),
        el('p', { class: 'decor__quote', text: (it.note || it.title || '純文字靈感').slice(0, 160) }));
    }
    return box;
  }

  /* ═══════════ 篩選動作 ═══════════ */
  function setStatus(id) {
    state.status = id;
    state.showTrash = false;
    state.limit = CONFIG.pageSize;
    closeSidebar();
    renderAll();
  }
  function toggleTag(tag) {
    if (state.tags.has(tag)) state.tags.delete(tag);
    else state.tags.add(tag);
    state.showTrash = false;
    state.limit = CONFIG.pageSize;
    renderAll();
  }
  function clearFilters() {
    state.query = '';
    state.status = 'all';
    state.tags.clear();
    state.favOnly = false;
    state.showTrash = false;
    state.limit = CONFIG.pageSize;
    searchInput.value = '';
    renderAll();
  }

  /* ═══════════ 新增 ═══════════ */
  function setAddKind(kind) {
    state.addKind = kind;
    $$('.tab', dlgAdd).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)));
    addImagePane.hidden = kind !== 'image';
    addUrlField.hidden = kind !== 'link';
    addSubmit.textContent = '加入收藏庫';
  }
  function clearPreviews() {
    previewURLs.forEach((u) => URL.revokeObjectURL(u));
    previewURLs = [];
    state.addFiles = [];
    addPreview.replaceChildren();
    addPreview.hidden = true;
  }
  function setAddFiles(files) {
    if (!files || !files.length) { clearPreviews(); return; }
    clearPreviews();
    const incoming = Array.from(files);
    state.addFiles = incoming.slice(0, CONFIG.maxFiles);
    addPreview.hidden = false;
    state.addFiles.forEach((file, index) => {
      const url = URL.createObjectURL(file);
      previewURLs.push(url);
      addPreview.append(el('div', { class: 'preview-item' },
        el('img', { src: url, alt: '' }),
        el('div', { class: 'preview-item__meta' },
          el('p', { text: file.name || '貼上的圖片' }),
          el('p', { class: 'hint mono', text: fmtBytes(file.size) })
        ),
        el('button', {
          class: 'icon-btn icon-btn--sm', type: 'button', 'aria-label': '移除這張圖片',
          onclick: () => setAddFiles(state.addFiles.filter((_, i) => i !== index)),
        }, icon('close'))
      ));
    });
    if (incoming.length > state.addFiles.length) {
      addPreview.append(el('p', {
        class: 'hint',
        text: '一次最多 ' + CONFIG.maxFiles + ' 張，已略過 ' + (incoming.length - state.addFiles.length) + ' 張。',
      }));
    }
    if (state.addFiles.length > 1) {
      addPreview.append(el('p', { class: 'hint', text: '多張圖片會以檔名作為標題，並共用同一組標籤與狀態。' }));
    }
    if (state.addFiles.length === 1 && !addTitle.value.trim()) {
      addTitle.value = titleFromFilename(state.addFiles[0].name);
    }
  }
  function hideAddError() {
    addError.hidden = true;
    addError.textContent = '';
  }
  function showAddError(msg) {
    addError.textContent = msg;
    addError.hidden = false;
  }
  function renderAddTagSuggest() {
    const tags = tagCounts().slice(0, 10);
    if (!tags.length) { addTagSuggest.replaceChildren(); return; }
    addTagSuggest.replaceChildren(...tags.map(([tag]) => el('button', {
      class: 'chip', type: 'button', text: '#' + tag,
      onclick: () => {
        const current = parseTags(addTags.value);
        if (!current.includes(tag)) addTags.value = current.concat(tag).join(', ');
        addTags.focus();
      },
    })));
  }
  function openAdd(opts = {}) {
    if (dlgAdd.open) {
      setAddKind(opts.kind || state.addKind);
      if (opts.files && opts.files.length) setAddFiles(opts.files);
      return;
    }
    hideToast();
    formAdd.reset();
    clearPreviews();
    hideAddError();
    setAddKind(opts.kind || 'image');
    addState.value = (!state.showTrash && state.status !== 'all') ? state.status : 'inbox';
    addFav.checked = false;
    if (opts.url) {
      addUrl.value = opts.url;
      addTitle.value = opts.title || '';
      setAddKind('link');
    }
    if (opts.files && opts.files.length) setAddFiles(opts.files);
    renderAddTagSuggest();
    closeSidebar();
    dlgAdd.showModal();
    setTimeout(() => {
      if (state.addKind === 'image' && !state.addFiles.length) addDrop.focus();
      else if (state.addKind === 'link' && !addUrl.value) addUrl.focus();
      else addTitle.focus();
    }, 40);
  }

  async function submitAdd(event) {
    event.preventDefault();
    if (state.busy) return;
    hideAddError();
    const kind = state.addKind;
    const tags = parseTags(addTags.value);
    const note = addNote.value.trim().slice(0, CONFIG.maxNote);
    const st = addState.value;
    const favorite = addFav.checked;
    const typedTitle = addTitle.value.trim().slice(0, CONFIG.maxTitle);

    if (kind === 'image') {
      if (!state.addFiles.length) {
        showAddError('請先選擇圖片，或按 Ctrl/⌘+V 貼上截圖。');
        addDrop.focus();
        return;
      }
      setBusy(true);
      let added = 0;
      const failed = [];
      for (let i = 0; i < state.addFiles.length; i++) {
        const file = state.addFiles[i];
        addSubmit.textContent = '處理中 ' + (i + 1) + '/' + state.addFiles.length;
        try {
          const title = state.addFiles.length > 1
            ? titleFromFilename(file.name)
            : (typedTitle || titleFromFilename(file.name));
          await addImageItem(file, { title, note, tags, state: st, favorite });
          added += 1;
        } catch (err) {
          console.error(err);
          failed.push(file.name || '貼上的圖片');
        }
      }
      setBusy(false);
      if (added) {
        dlgAdd.close();
        clearPreviews();
        showToast('已加入 ' + added + ' 則靈感' + (failed.length ? '，' + failed.length + ' 張失敗' : ''));
      } else {
        showAddError('圖片處理失敗：格式可能不支援（例如 HEIC），請先轉成 JPG／PNG 再試。');
      }
      if (failed.length) {
        showBanner('有 ' + failed.length + ' 張圖片無法處理：' + failed.slice(0, 3).join('、'), { tone: 'warn' });
      }
      return;
    }

    const url = kind === 'link' ? normalizeUrl(addUrl.value) : '';
    if (kind === 'link' && !url) {
      showAddError('請輸入有效的網址，例如 https://example.com。');
      addUrl.focus();
      return;
    }
    if (!typedTitle && !url && !note) {
      showAddError('請至少填寫標題、網址或備註其中一項。');
      addTitle.focus();
      return;
    }

    const item = makeItem({
      kind,
      title: typedTitle || (url ? domainOf(url) : truncate(note, 40)),
      note,
      url,
      tags,
      state: st,
      favorite,
      colors: [],
      order: nextOrder(),
      size: 0,
    });
    if (!await persist(() => dbPut(STORE_ITEMS, item), '新增失敗')) return;
    state.items.push(item);
    dlgAdd.close();
    clearPreviews();
    renderAll();
    refreshUsage();
    notifyChange();
    showToast('已加入收藏庫', '開啟', () => openDetail(item.id));
  }

  function setBusy(busy) {
    state.busy = busy;
    addSubmit.disabled = busy;
    addCancel.disabled = busy;
    addClose.disabled = busy;
    if (!busy) addSubmit.textContent = '加入收藏庫';
  }

  function makeItem(data) {
    const now = nowISO();
    return Object.assign({
      id: uid(),
      kind: 'text',
      title: '',
      note: '',
      url: '',
      tags: [],
      colors: [],
      state: 'inbox',
      order: 0,
      favorite: false,
      width: 0,
      height: 0,
      size: 0,
      mime: '',
      createdAt: now,
      updatedAt: now,
      deletedAt: null,
    }, data);
  }

  async function addImageItem(file, fields) {
    const processed = await processImageFile(file);
    const item = makeItem({
      kind: 'image',
      title: fields.title,
      note: fields.note,
      tags: fields.tags,
      state: fields.state,
      favorite: fields.favorite,
      colors: processed.colors,
      width: processed.width,
      height: processed.height,
      mime: processed.full.type,
      size: processed.full.size + processed.thumb.size,
      order: nextOrder(),
    });
    const blobs = [
      { key: item.id + ':full', itemId: item.id, blob: processed.full, mime: processed.full.type, w: processed.width, h: processed.height, bytes: processed.full.size },
      { key: item.id + ':thumb', itemId: item.id, blob: processed.thumb, mime: processed.thumb.type, w: processed.thumbW, h: processed.thumbH, bytes: processed.thumb.size },
    ];
    await dbPut(STORE_ITEMS, item);
    try {
      await dbBulkPut(STORE_BLOBS, blobs);
    } catch (err) {
      await dbDeleteItem(item.id).catch(() => {});
      throw err;
    }
    state.items.push(item);
    renderAll();
    refreshUsage();
    notifyChange();
    return item;
  }

  /* ═══════════ 刪除 / 復原 ═══════════ */
  async function toggleFavorite(it) {
    const before = it.favorite;
    it.favorite = !it.favorite;
    it.updatedAt = nowISO();
    renderAll();
    if (state.drawerId === it.id) syncDetailButtons(it);
    const ok = await persist(() => dbPut(STORE_ITEMS, { ...it }), '收藏狀態儲存失敗');
    if (!ok) {
      it.favorite = before;
      renderAll();
      if (state.drawerId === it.id) syncDetailButtons(it);
      return;
    }
    notifyChange();
  }

  async function trashItem(it) {
    if (it.deletedAt) return;
    const stamp = nowISO();
    it.deletedAt = stamp;
    it.updatedAt = stamp;
    renderAll();
    const ok = await persist(() => dbPut(STORE_ITEMS, { ...it }), '移到回收筒失敗');
    if (!ok) {
      it.deletedAt = null;
      renderAll();
      return;
    }
    if (state.drawerId === it.id) closeDetail();
    notifyChange();
    showToast('已移到回收筒', '復原', async () => {
      it.deletedAt = null;
      it.updatedAt = nowISO();
      renderAll();
      await persist(() => dbPut(STORE_ITEMS, { ...it }), '復原失敗');
      notifyChange();
    });
  }

  async function restoreItem(it) {
    it.deletedAt = null;
    it.updatedAt = nowISO();
    if (!await persist(() => dbPut(STORE_ITEMS, { ...it }), '復原失敗')) return;
    renderAll();
    notifyChange();
    showToast('已復原「' + truncate(it.title || '未命名', 18) + '」');
  }

  async function purgeItem(it) {
    const ok = await confirmAction(
      '永久刪除？',
      '「' + (it.title || '未命名') + '」與它的圖片會從這台裝置移除，無法復原。',
      '永久刪除',
      true
    );
    if (!ok) return;
    if (!await persist(() => dbDeleteItem(it.id), '永久刪除失敗')) return;
    pendingSaves.delete(it.id);
    state.items = state.items.filter((x) => x.id !== it.id);
    if (state.drawerId === it.id) {
      state.drawerId = null;
      closeDetail();
    }
    revokeItemURLs(it.id);
    renderAll();
    refreshUsage();
    notifyChange();
    showToast('已永久刪除');
  }

  async function purgeTrash() {
    const rows = state.items.filter((i) => i.deletedAt);
    if (!rows.length) return;
    const ok = await confirmAction('清空回收筒？', '這 ' + rows.length + ' 則靈感與圖片會永久移除，無法復原。', '清空回收筒', true);
    if (!ok) return;
    for (const it of rows) {
      const done = await persist(() => dbDeleteItem(it.id), '清除失敗');
      if (!done) return;
      pendingSaves.delete(it.id);
      revokeItemURLs(it.id);
    }
    if (state.drawerId && rows.some((r) => r.id === state.drawerId)) {
      state.drawerId = null;
      closeDetail();
    }
    state.items = state.items.filter((i) => !i.deletedAt);
    renderAll();
    refreshUsage();
    notifyChange();
    showToast('回收筒已清空');
  }

  /* ═══════════ 拖曳 ═══════════ */
  function attachDrag(node, it) {
    node.draggable = true;
    node.addEventListener('dragstart', (event) => {
      dragId = it.id;
      node.classList.add('is-dragging');
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        try { event.dataTransfer.setData('text/plain', it.id); } catch (_) {}
      }
    });
    node.addEventListener('dragend', () => {
      node.classList.remove('is-dragging');
      dragId = null;
      clearDropHints();
    });
  }
  function clearDropHints() {
    $$('.tile.drop-before, .tile.drop-after').forEach((n) => n.classList.remove('drop-before', 'drop-after'));
    $$('.board__list.drop-active').forEach((n) => n.classList.remove('drop-active'));
  }
  function onBoardDragOver(event) {
    if (!dragId) return;
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    const drop = event.currentTarget;
    clearDropHints();
    const card = event.target.closest('.tile');
    if (card && card.dataset.id !== dragId) {
      const rect = card.getBoundingClientRect();
      card.classList.add(event.clientY < rect.top + rect.height / 2 ? 'drop-before' : 'drop-after');
    } else {
      drop.classList.add('drop-active');
    }
  }
  async function onBoardDrop(event) {
    if (!dragId) return;
    event.preventDefault();
    const drop = event.currentTarget;
    const newState = drop.dataset.state;
    const target = event.target.closest('.tile');
    if (target && target.dataset.id === dragId) {
      dragId = null;
      clearDropHints();
      return;
    }
    const after = target ? target.classList.contains('drop-after') : true;
    const id = dragId;
    dragId = null;
    clearDropHints();
    if (!newState) return;
    await moveItem(id, newState, target ? target.dataset.id : null, after);
  }
  async function moveItem(id, newState, anchorId, after) {
    const it = findItem(id);
    if (!it) return;
    if (!STATE_LABEL[newState]) return;
    if (it.state === newState && !anchorId && state.sort === 'manual') {
      const col = activeItems().filter((x) => x.state === newState).sort((a, b) => (a.order || 0) - (b.order || 0));
      if (col.length && col[col.length - 1].id === id) return;
    }

    const col = activeItems()
      .filter((x) => x.state === newState && x.id !== id)
      .sort((a, b) => (a.order || 0) - (b.order || 0));
    let order;
    if (anchorId) {
      const index = col.findIndex((x) => x.id === anchorId);
      if (index < 0) {
        order = (col.length ? col[col.length - 1].order : 0) + 1;
      } else if (after) {
        const next = col[index + 1];
        order = next ? (col[index].order + next.order) / 2 : col[index].order + 1;
      } else {
        const prev = col[index - 1];
        order = prev ? (prev.order + col[index].order) / 2 : col[index].order - 1;
      }
    } else {
      order = (col.length ? col[col.length - 1].order : 0) + 1;
    }
    if (!Number.isFinite(order)) order = 0;

    const before = { state: it.state, order: it.order };
    it.state = newState;
    it.order = order;
    it.updatedAt = nowISO();

    if (state.sort !== 'manual') {
      state.sort = 'manual';
      sortSelect.value = 'manual';
      saveSettings();
      showToast('已切換為手動排序');
    }
    renderAll();
    const ok = await persist(() => dbPut(STORE_ITEMS, { ...it }), '移動卡片失敗');
    if (!ok) {
      Object.assign(it, before);
      renderAll();
      return;
    }
    const collision = col.some((x) => Math.abs(x.order - order) < 1e-6);
    if (collision) await normalizeColumn(newState);
    notifyChange();

    if (before.state !== newState) {
      const snapshot = { ...before };
      showToast('已移到「' + STATE_LABEL[newState] + '」', '復原', async () => {
        it.state = snapshot.state;
        it.order = snapshot.order;
        it.updatedAt = nowISO();
        renderAll();
        await persist(() => dbPut(STORE_ITEMS, { ...it }), '復原移動失敗');
        notifyChange();
      });
    }
  }
  async function normalizeColumn(st) {
    const col = activeItems().filter((x) => x.state === st).sort((a, b) => (a.order || 0) - (b.order || 0));
    col.forEach((x, i) => { x.order = (i + 1) * 10; });
    renderAll();
    await persist(() => dbBulkPut(STORE_ITEMS, col.map((x) => ({ ...x }))), '排序儲存失敗');
  }

  /* ═══════════ 詳情 ═══════════ */
  function openDetail(id) {
    const it = findItem(id);
    if (!it) return;
    hideToast();
    state.drawerId = id;
    fillDetail(it);
    if (!dlgDetail.open) dlgDetail.showModal();
    setTimeout(() => dClose.focus(), 20);
  }
  function closeDetail() {
    if (dlgDetail.open) dlgDetail.close();
  }
  function updateDetailPos() {
    const list = currentList();
    const index = list.findIndex((x) => x.id === state.drawerId);
    dPos.textContent = index >= 0 ? (index + 1) + ' / ' + list.length : '';
    dPrev.disabled = index <= 0;
    dNext.disabled = index < 0 || index >= list.length - 1;
  }
  function fillDetail(it) {
    dTitle.value = it.title || '';
    dUrl.value = it.url || '';
    dNote.value = it.note || '';
    dTags.value = (it.tags || []).join('、');
    dState.value = STATES.some((s) => s.id === it.state) ? it.state : 'inbox';
    dFav.hidden = Boolean(it.deletedAt);
    dDelete.textContent = it.deletedAt ? '永久刪除' : '刪除';
    syncDetailButtons(it);
    dOpen.hidden = !it.url;
    if (it.url) dOpen.href = it.url;

    const swatches = (it.colors || []).map((hex) => {
      const btn = el('button', {
        class: 'swatch', type: 'button', 'aria-label': '複製色碼 ' + hex, title: '複製 ' + hex,
        onclick: async () => {
          const ok = await copyText(hex);
          const message = ok ? '已複製 ' + hex : '複製失敗，請手動選取色碼';
          if (state.drawerId === it.id) dSaved.textContent = message;
          else showToast(message);
        },
      },
      el('span', { class: 'swatch__block' , style: { background: hex } }),
      el('span', { class: 'swatch__code', text: hex.replace('#', '') })
      );
      return btn;
    });
    if (swatches.length) {
      dColors.replaceChildren(...swatches);
    } else {
      dColors.replaceChildren(el('p', { class: 'hint', text: it.kind === 'image' ? '這張圖片抓不到明顯主色。' : '連結與文字沒有主色資料。' }));
    }

    dMeta.replaceChildren(
      metaRow('類型', KIND_LABEL[it.kind] || it.kind),
      metaRow('尺寸', it.width && it.height ? it.width + ' × ' + it.height : '—'),
      metaRow('檔案大小', it.size ? fmtBytes(it.size) : '—'),
      metaRow('建立時間', fmtDate(it.createdAt)),
      metaRow('最後更新', fmtDate(it.updatedAt))
    );

    loadDetailMedia(it);
    updateDetailPos();
    dSaved.textContent = '';
  }
  function metaRow(label, value) {
    const frag = document.createDocumentFragment();
    frag.append(el('dt', { text: label }), el('dd', { text: value }));
    return frag;
  }
  function syncDetailButtons(it) {
    dFav.textContent = it.favorite ? '已收藏' : '收藏';
    dFav.setAttribute('aria-pressed', String(Boolean(it.favorite)));
    dFav.classList.toggle('btn--primary', Boolean(it.favorite));
  }
  async function loadDetailMedia(it) {
    const token = ++detailToken;
    if (detailURL) {
      URL.revokeObjectURL(detailURL);
      detailURL = null;
    }
    dMedia.replaceChildren();
    dMedia.classList.remove('is-decor', 'is-loading');
    dMedia.style.aspectRatio = '';
    dMedia.style.maxHeight = '';
    dMedia.style.width = '100%';
    if (it.kind !== 'image') {
      dMedia.classList.add('is-decor');
      dMedia.append(decorPanel(it, 'large'));
      return;
    }
    dMedia.style.aspectRatio = it.width && it.height ? (it.width + ' / ' + it.height) : '4 / 3';
    dMedia.style.maxHeight = '44vh';
    dMedia.classList.add('is-loading');
    let thumb = null;
    try { thumb = await getBlobURL(it.id + ':thumb'); } catch (_) {}
    if (token !== detailToken) return;
    if (thumb) dMedia.append(el('img', { class: 'is-placeholder', src: thumb, alt: '' }));

    let row = null;
    try { row = await dbGet(STORE_BLOBS, it.id + ':full'); } catch (_) {}
    if (token !== detailToken) return;
    if (!row || !row.blob) {
      dMedia.classList.remove('is-loading');
      return;
    }
    const url = URL.createObjectURL(row.blob);
    if (token !== detailToken) { URL.revokeObjectURL(url); return; }
    detailURL = url;
    const img = el('img', { src: detailURL, alt: it.title || '靈感圖片' });
    img.addEventListener('load', () => {
      dMedia.classList.remove('is-loading');
      const placeholder = dMedia.querySelector('img.is-placeholder');
      if (placeholder) placeholder.remove();
    }, { once: true });
    dMedia.append(img);
  }
  function detailStep(delta) {
    const list = currentList();
    const index = list.findIndex((x) => x.id === state.drawerId);
    const next = index + delta;
    if (next < 0 || next >= list.length) return;
    state.drawerId = list[next].id;
    fillDetail(list[next]);
  }
  function patchDrawer(patch) {
    const it = findItem(state.drawerId);
    if (!it) return;
    Object.assign(it, patch, { updatedAt: nowISO() });
    scheduleSave(it);
    renderSoon();
    if (patch.state) updateDetailPos();
  }
  const renderSoon = debounce(renderAll, 140);

  /* ═══════════ 統計 ═══════════ */
  function openStats() {
    closeSidebar();
    hideToast();
    const active = activeItems();
    const images = active.filter((i) => i.kind === 'image');
    const links = active.filter((i) => i.kind === 'link');
    const totalBytes = active.reduce((sum, i) => sum + (i.size || 0), 0);
    const trashRows = state.items.filter((i) => i.deletedAt);

    const stats = el('div', { class: 'stat-grid' },
      statCard(String(active.length), '總靈感數'),
      statCard(String(images.length), '圖片素材'),
      statCard(String(tagCounts().length), '使用中的標籤'),
      statCard(fmtBytes(totalBytes), '素材容量')
    );

    const stateSection = el('section', { class: 'stats-section' },
      el('h3', { text: '狀態分佈' }),
      ...STATES.map((s) => {
        const n = active.filter((i) => i.state === s.id).length;
        return barRow(s.label, n, Math.max(1, active.length), String(n));
      }),
      el('p', { class: 'hint', text: '連結 ' + links.length + ' 則 · 回收筒 ' + trashRows.length + ' 則' })
    );

    const tagList = tagCounts().slice(0, 8);
    const tagSection = el('section', { class: 'stats-section' },
      el('h3', { text: '標籤 Top 8' }),
      tagList.length
        ? el('div', { class: 'stats-section' }, ...tagList.map(([tag, n]) => barRow('#' + tag, n, tagList[0][1], String(n))))
        : el('p', { class: 'hint', text: '還沒有標籤。' })
    );

    const buckets = new Array(12).fill(0);
    let colorTotal = 0;
    active.forEach((it) => (it.colors || []).forEach((hex) => {
      const hue = hexToHue(hex);
      if (hue < 0) return;
      buckets[Math.min(11, Math.floor(hue / 30))] += 1;
      colorTotal += 1;
    }));
    const maxBucket = Math.max.apply(null, buckets.concat([1]));
    const hueSection = el('section', { class: 'stats-section' },
      el('h3', { text: '主色相分佈（' + colorTotal + ' 色）' }),
      colorTotal
        ? el('div', {},
          el('div', { class: 'hue-strip' }, ...buckets.map((n, i) => el('div', { class: 'hue-col' },
            el('span', {
              class: 'hue-col__bar',
              style: {
                height: Math.max(3, Math.round((n / maxBucket) * 40)) + 'px',
                background: 'hsl(' + (i * 30 + 15) + ' 62% 55%)',
                opacity: n ? '1' : '.22',
              },
              title: i * 30 + '°–' + (i + 1) * 30 + '°：' + n + ' 色',
            })
          ))),
          el('div', { class: 'hue-legend' },
            el('span', { text: '紅 0°' }), el('span', { text: '120°' }), el('span', { text: '240°' }), el('span', { text: '360°' })
          )
        )
        : el('p', { class: 'hint', text: '加入圖片後會自動擷取主色。' })
    );

    statsBody.replaceChildren(stats, stateSection, tagSection, hueSection);
    if (!dlgStats.open) dlgStats.showModal();
  }
  function statCard(value, label) {

  function barRow(label, value, max, display) {

  /* ═══════════ 備份 ═══════════ */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || '');
        const comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : '');
      };
      reader.onerror = () => reject(reader.error || new Error('read failed'));
      reader.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, mime) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime || 'application/octet-stream' });
  }
  function setBtnBusy(btn, busy, busyText) {
    if (busy) {
      btn.dataset.label = btn.textContent;
      btn.disabled = true;
      btn.textContent = busyText;
    } else {
      btn.disabled = false;
      if (btn.dataset.label) btn.textContent = btn.dataset.label;
    }
  }

  async function exportJSON(includeImages) {
    const btn = includeImages ? btnExportJson : btnExportLite;
    setBtnBusy(btn, true, includeImages ? '打包中…' : '匯出中…');
    try {
      await flushSaves();
      const items = await dbGetAll(STORE_ITEMS);
      const blobs = [];
      if (includeImages) {
        const rows = await dbGetAll(STORE_BLOBS);
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          if (!row || !row.blob) continue;
          btn.textContent = '打包中 ' + (i + 1) + '/' + rows.length;
          blobs.push({
            key: row.key, itemId: row.itemId, mime: row.mime,
            w: row.w, h: row.h, bytes: row.bytes,
            data: await blobToBase64(row.blob),
          });
        }
      }
      const payload = {
        app: 'moodboard',
        schemaVersion: CONFIG.version,
        exportedAt: nowISO(),
        counts: { items: items.length, blobs: blobs.length },
        data: { items, blobs },
      };
      const text = JSON.stringify(payload);
      const blob = new Blob([text], { type: 'application/json' });
      if (blob.size > 1024 * 1024 * 700) {
        showBanner('備份檔超過 700 MB，瀏覽器可能無法下載。建議改用「只匯出清單」或先清空回收筒。', { tone: 'warn', sticky: true });
      }
      download(blob, 'moodboard-' + todayStamp() + (includeImages ? '-full' : '-list') + '.json');
      showToast('已匯出 ' + items.length + ' 則' + (includeImages ? '（含 ' + blobs.length + ' 個圖片檔）' : '（不含圖片）'));
    } catch (err) {
      console.error(err);
      showBanner('匯出失敗：' + errText(err), { tone: 'error', sticky: true });
    } finally {
      setBtnBusy(btn, false);
    }
  }

  async function exportCSV() {
    setBtnBusy(btnExportCsv, true, '匯出中…');

      });

  function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const kind = raw.kind === 'image' || raw.kind === 'link' ? raw.kind : 'text';
    const title = String(raw.title == null ? '' : raw.title).trim().slice(0, CONFIG.maxTitle);
    const url = normalizeUrl(raw.url || '');
    const note = String(raw.note == null ? '' : raw.note).slice(0, CONFIG.maxNote);
    if (!title && !url && !note && kind !== 'image') return null;
    if (kind === 'image' && !title) return null;
    const now = nowISO();
    const tags = Array.isArray(raw.tags)
      ? parseTags(raw.tags.map((t) => String(t)).join(','))
      : parseTags(raw.tags);
    return {
      id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
      kind,
      title: title || (url ? domainOf(url) : '未命名'),
      note,
      url,
      tags,
      colors: Array.isArray(raw.colors)
        ? raw.colors.filter((c) => /^#[0-9a-f]{6}$/i.test(String(c))).slice(0, 6)
        : [],
      state: STATES.some((s) => s.id === raw.state) ? raw.state : 'inbox',
      order: Number.isFinite(raw.order) ? raw.order : 0,
      favorite: Boolean(raw.favorite),
      width: Number(raw.width) || 0,
      height: Number(raw.height) || 0,
      size: Number(raw.size) || 0,
      mime: typeof raw.mime === 'string' ? raw.mime : '',
      createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : now,
      updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : now,
      deletedAt: typeof raw.deletedAt === 'string' ? raw.deletedAt : null,
    };
  }

  async function importFile(file) {
    if (!file) return;
    if (file.size > CONFIG.maxImportBytes) {
      showBanner('匯入失敗：檔案超過 ' + Math.round(CONFIG.maxImportBytes / 1024 / 1024) + ' MB，請改用較小的備份。', { tone: 'error', sticky: true });
      return;
    }
    await flushSaves();
    pendingSaves.clear();
    clearTimeout(saveTimer);
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (_) {
      showBanner('匯入失敗：這個檔案不是有效的 JSON。', { tone: 'error', sticky: true });
      return;
    }
    const rawItems = Array.isArray(parsed) ? parsed
      : parsed && parsed.data && Array.isArray(parsed.data.items) ? parsed.data.items
      : parsed && Array.isArray(parsed.items) ? parsed.items
      : null;
    if (!rawItems) {
      showBanner('匯入失敗：找不到資料（預期 JSON 內有 data.items 陣列）。', { tone: 'error', sticky: true });
      return;
    }
    if (parsed && typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > CONFIG.version) {
      showBanner('匯入失敗：備份來自較新版本（v' + parsed.schemaVersion + '），請更新這個工具。', { tone: 'error', sticky: true });
      return;
    }
    const items = rawItems.map(normalizeItem).filter(Boolean);
    if (!items.length) {
      showBanner('匯入失敗：沒有可用的靈感資料（每筆至少要標題、網址或備註）。', { tone: 'error', sticky: true });
      return;
    }
    const rawBlobs = parsed && parsed.data && Array.isArray(parsed.data.blobs) ? parsed.data.blobs : [];

    const mode = await askChoice({
      title: '匯入 ' + items.length + ' 則靈感',
      body: (rawBlobs.length ? '檔案含 ' + rawBlobs.length + ' 個圖片檔。\n' : '')
        + '要與現有資料合併（相同 id 覆蓋），或先清空再取代？',
      actions: [
        { label: '取消', value: 'cancel' },
        { label: '合併', value: 'merge' },
        { label: '取代全部', value: 'replace', variant: 'primary' },
      ],
    });
    if (!mode || mode === 'cancel') return;
    if (mode === 'replace') {
      const sure = await confirmAction('確定取代？', '目前 ' + activeItems().length + ' 則靈感與圖片會被清空，建議先匯出備份。', '清空並匯入', true);
      if (!sure) return;
      if (!await persist(() => dbClearAll(), '清空失敗，匯入已取消')) return;
      state.items = [];
      urlCache.forEach((url) => URL.revokeObjectURL(url));
      urlCache.clear();
    }

    const blobs = [];
    let skippedBlobs = 0;
    for (const row of rawBlobs) {
      if (!row || typeof row.key !== 'string' || typeof row.data !== 'string') { skippedBlobs += 1; continue; }
      try {
        blobs.push({
          key: row.key,
          itemId: typeof row.itemId === 'string' ? row.itemId : row.key.split(':')[0],
          blob: base64ToBlob(row.data, row.mime),
          mime: row.mime || 'image/webp',
          w: Number(row.w) || 0,
          h: Number(row.h) || 0,
          bytes: Number(row.bytes) || 0,
        });
      } catch (_) {
        skippedBlobs += 1;
      }
    }

    if (!await persist(() => dbBulkPut(STORE_ITEMS, items), '匯入資料寫入失敗')) return;
    if (blobs.length && !await persist(() => dbBulkPut(STORE_BLOBS, blobs), '圖片寫入失敗')) return;

    urlCache.forEach((url) => URL.revokeObjectURL(url));
    urlCache.clear();
    state.items = await dbGetAll(STORE_ITEMS).catch(() => state.items);
    renderAll();
    refreshUsage();
    notifyChange();
    showToast('已匯入 ' + items.length + ' 則' + (blobs.length ? '、' + blobs.length + ' 個圖片檔' : ''));
    if (skippedBlobs) showBanner('有 ' + skippedBlobs + ' 個圖片檔格式異常，已略過。', { tone: 'warn' });
  }

  async function resetAll() {
    const ok = await confirmAction('清空全部資料？', '所有靈感、標籤與圖片會從這台裝置刪除，無法復原。建議先匯出備份。', '清空全部', true);
    if (!ok) return;
    pendingSaves.clear();
    clearTimeout(saveTimer);
    if (!await persist(() => dbClearAll(), '清空失敗')) return;
    urlCache.forEach((url) => URL.revokeObjectURL(url));
    urlCache.clear();
    state.items = [];
    state.tags.clear();
    state.query = '';
    searchInput.value = '';
    state.showTrash = false;
    state.status = 'all';
    state.favOnly = false;
    state.limit = CONFIG.pageSize;
    renderAll();
    refreshUsage();
    notifyChange();
    showToast('已清空所有資料');
  }

  async function refreshUsage() {
    const active = activeItems();
    const own = active.reduce((sum, i) => sum + (i.size || 0), 0);
    const trash = state.items.filter((i) => i.deletedAt).reduce((sum, i) => sum + (i.size || 0), 0);
    let text = '素材容量約 ' + fmtBytes(own);
    if (trash) text += ' · 回收筒 ' + fmtBytes(trash);
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const info = await navigator.storage.estimate();
        if (info && info.usage) text += ' · 瀏覽器已用 ' + fmtBytes(info.usage);
      } catch (_) {}
    }
    usageEl.textContent = text;
  }

  /* ═══════════ 對話框 ═══════════ */
  function askChoice({ title, body, actions }) {
    return new Promise((resolve) => {
      if (dlgChoice.open) dlgChoice.close();
      hideToast();
      choiceTitle.textContent = title || '';
      choiceBody.textContent = body || '';
      choiceBody.hidden = !body;
      choiceActions.replaceChildren();
      let settled = false;
      const onCancel = (event) => {
        event.preventDefault();
        finish(null);
      };
      const finish = (value) => {
        if (settled) return;
        settled = true;
        dlgChoice.removeEventListener('cancel', onCancel);
        dlgChoice.close();
        resolve(value);
      };
      actions.forEach((action) => {
        choiceActions.append(el('button', {
          class: 'btn' + (action.variant === 'primary' ? ' btn--primary' : '') + (action.variant === 'danger' ? ' btn--danger-solid' : ''),
          type: 'button',
          text: action.label,
          onclick: () => finish(action.value),
        }));
      });
      dlgChoice.addEventListener('cancel', onCancel);
      dlgChoice.showModal();
    });
  }
  function confirmAction(title, body, okLabel, danger) {
    return askChoice({
      title, body,
      actions: [
        { label: '取消', value: false },
        { label: okLabel || '確定', value: true, variant: danger ? 'danger' : 'primary' },
      ],
    }).then((value) => value === true);
  }

  /* ═══════════ 側欄 / 主題 ═══════════ */
  const narrowView = matchMedia('(max-width: 1000px)');
  function syncSidebarInert() {
    if (!narrowView.matches) {
      sidebar.classList.remove('is-open');
      backdrop.hidden = true;
      btnMenu.setAttribute('aria-expanded', 'false');
    }
    sidebar.inert = narrowView.matches && !sidebar.classList.contains('is-open');
  }
  function openSidebar() {
    sidebar.classList.add('is-open');
    sidebar.inert = false;
    backdrop.hidden = false;
    btnMenu.setAttribute('aria-expanded', 'true');
  }
  function closeSidebar() {
    if (!sidebar.classList.contains('is-open')) return;
    sidebar.classList.remove('is-open');
    syncSidebarInert();
    backdrop.hidden = true;
    btnMenu.setAttribute('aria-expanded', 'false');
  }

  /* ═══════════ 貼上 / 拖放 ═══════════ */
  function hasFiles(event) {
    const dt = event.dataTransfer;
    if (!dt) return false;
    return Array.from(dt.types || []).includes('Files');
  }
  function openAddWithFiles(files) {
    const images = Array.from(files).filter((f) => f && String(f.type).startsWith('image/'));
    if (!images.length) {
      showBanner('只支援圖片檔（JPG／PNG／WebP／GIF／SVG）。', { tone: 'warn' });
      return;
    }
    openAdd({ kind: 'image', files: images });
  }

  /* ═══════════ 事件綁定 ═══════════ */
  const onSearchInput = debounce(() => {
    state.query = searchInput.value;
    state.limit = CONFIG.pageSize;
    renderAll();
  }, 160);

  function bindEvents() {
    btnAdd.addEventListener('click', () => openAdd({ kind: 'image' }));
    btnAdd2.addEventListener('click', () => openAdd({ kind: 'image' }));
    btnTheme.addEventListener('click', cycleTheme);
    btnMenu.addEventListener('click', () => {
      if (sidebar.classList.contains('is-open')) closeSidebar();
      else openSidebar();
    });
    backdrop.addEventListener('click', closeSidebar);

    searchInput.addEventListener('input', onSearchInput);
    sortSelect.addEventListener('change', () => {
      state.sort = sortSelect.value;
      saveSettings();
      renderAll();
    });

    $$('.seg button[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        state.showTrash = false;
        state.limit = CONFIG.pageSize;
        saveSettings();
        closeSidebar();
        renderAll();
      });
    });

    btnFav.addEventListener('click', () => {
      state.favOnly = !state.favOnly;
      state.showTrash = false;
      state.limit = CONFIG.pageSize;
      closeSidebar();
      renderAll();
    });
    btnStats.addEventListener('click', openStats);
    btnTrash.addEventListener('click', () => {
      state.showTrash = true;
      state.status = 'all';
      state.favOnly = false;
      state.tags.clear();
      state.query = '';
      searchInput.value = '';
      state.limit = CONFIG.pageSize;
      closeSidebar();
      renderAll();
    });
    btnClearTags.addEventListener('click', () => {
      state.tags.clear();
      renderAll();
    });

    btnExportJson.addEventListener('click', () => exportJSON(true));
    btnExportLite.addEventListener('click', () => exportJSON(false));
    btnExportCsv.addEventListener('click', exportCSV);
    btnImport.addEventListener('click', () => fileImport.click());
    btnReset.addEventListener('click', resetAll);
    fileImport.addEventListener('change', async () => {
      const file = fileImport.files && fileImport.files[0];
      fileImport.value = '';
      await importFile(file);
    });

    /* add dialog */
    $$('.tab', dlgAdd).forEach((tab) => {
      tab.addEventListener('click', () => {
        setAddKind(tab.dataset.kind);
        hideAddError();
        if (tab.dataset.kind === 'link') addUrl.focus();
        else if (tab.dataset.kind === 'image') addDrop.focus();
        else addTitle.focus();
      });
    });
    addCancel.addEventListener('click', () => { if (!state.busy) dlgAdd.close(); });
    addClose.addEventListener('click', () => { if (!state.busy) dlgAdd.close(); });
    dlgAdd.addEventListener('cancel', (event) => {
      if (state.busy) { event.preventDefault(); return; }
      clearPreviews();
      hideAddError();
    });
    dlgAdd.addEventListener('close', () => {
      clearPreviews();
      hideAddError();
      setBusy(false);
    });
    fileImage.addEventListener('change', () => {
      const files = fileImage.files ? Array.from(fileImage.files) : [];
      fileImage.value = '';
      if (files.length) setAddFiles(files);
    });
    formAdd.addEventListener('submit', submitAdd);

    addDrop.addEventListener('dragover', (event) => {
      event.preventDefault();
      addDrop.classList.add('is-over');
    });
    addDrop.addEventListener('dragleave', () => addDrop.classList.remove('is-over'));
    addDrop.addEventListener('drop', (event) => {
      event.preventDefault();
      event.stopPropagation();
      addDrop.classList.remove('is-over');
      dragDepth = 0;
      dropOverlay.hidden = true;
      const files = event.dataTransfer && event.dataTransfer.files;
      if (files && files.length) setAddFiles(files);
    });
    addDrop.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        fileImage.click();
      }
    });

    /* detail */
    dClose.addEventListener('click', closeDetail);
    dlgDetail.addEventListener('close', () => {
      detailToken += 1;
      flushSaves();
      state.drawerId = null;
      if (detailURL) { URL.revokeObjectURL(detailURL); detailURL = null; }
    });
    dlgDetail.addEventListener('cancel', (event) => {
      event.preventDefault();
      closeDetail();
    });
    dlgDetail.addEventListener('keydown', (event) => {
      const target = event.target;
      const editing = target instanceof Element
        && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
      if (editing) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); detailStep(-1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); detailStep(1); }
    });
    dPrev.addEventListener('click', () => detailStep(-1));
    dNext.addEventListener('click', () => detailStep(1));

    dTitle.addEventListener('input', () => patchDrawer({ title: dTitle.value.slice(0, CONFIG.maxTitle) }));
    dNote.addEventListener('input', () => patchDrawer({ note: dNote.value.slice(0, CONFIG.maxNote) }));
    dUrl.addEventListener('change', () => {
      const value = normalizeUrl(dUrl.value);
      dUrl.value = value;
      patchDrawer({ url: value });
      dOpen.hidden = !value;
      if (value) dOpen.href = value;
      if (!value && dUrl.value.trim()) showBanner('網址格式看起來不對，已清空。', { tone: 'warn' });
    });
    dTags.addEventListener('change', () => {
      const tags = parseTags(dTags.value);
      dTags.value = tags.join('、');
      patchDrawer({ tags });
    });
    dState.addEventListener('change', () => {
      patchDrawer({ state: dState.value });
      flushSaves();
    });
    dFav.addEventListener('click', () => {
      const it = findItem(state.drawerId);
      if (it) toggleFavorite(it);
    });
    dDelete.addEventListener('click', () => {
      const it = findItem(state.drawerId);
      if (!it) return;
      if (it.deletedAt) purgeItem(it);
      else trashItem(it);
    });

    /* stats */
    statsClose.addEventListener('click', () => dlgStats.close());
    dlgStats.addEventListener('cancel', (event) => { event.preventDefault(); dlgStats.close(); });

    /* theme follows system in auto mode */
    const media = matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => { if (state.theme === 'auto') applyTheme('auto'); };
    if (media.addEventListener) media.addEventListener('change', onScheme);
    else if (media.addListener) media.addListener(onScheme);
    if (narrowView.addEventListener) narrowView.addEventListener('change', syncSidebarInert);
    else if (narrowView.addListener) narrowView.addListener(syncSidebarInert);

    /* search shortcut & global keys */
    document.addEventListener('keydown', (event) => {
      const active = document.activeElement;
      const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable);
      if (event.key === 'Escape') {
        closeSidebar();
        return;
      }
      if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.isComposing) return;
      if (document.querySelector('dialog[open]')) return;
      if (event.key === 'n' || event.key === 'N') {
        event.preventDefault();
        openAdd({ kind: 'image' });
      } else if (event.key === '/') {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    /* paste image anywhere */
    document.addEventListener('paste', (event) => {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      const files = [];
      for (const item of items) {
        if (item.kind === 'file' && String(item.type).startsWith('image/')) {
          const file = item.getAsFile();
          if (file) files.push(file);
        }
      }
      if (!files.length) return;
      event.preventDefault();
      if (dlgAdd.open) {
        const next = state.addKind === 'image' ? state.addFiles.concat(files) : files;
        setAddKind('image');
        setAddFiles(next);
        hideAddError();
      } else {
        openAdd({ kind: 'image', files });
      }
    });

    /* global file drop */
    window.addEventListener('dragenter', (event) => {
      if (!hasFiles(event)) return;
      dragDepth += 1;
      dropOverlay.hidden = false;
    });
    window.addEventListener('dragover', (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
    });
    window.addEventListener('dragleave', (event) => {
      if (event.relatedTarget) return;
      dragDepth = 0;
      dropOverlay.hidden = true;
    });
    window.addEventListener('dragend', () => {
      dragDepth = 0;
      dropOverlay.hidden = true;
    });
    window.addEventListener('drop', (event) => {
      dragDepth = 0;
      dropOverlay.hidden = true;
      if (!hasFiles(event)) return;
      event.preventDefault();
      const files = event.dataTransfer && event.dataTransfer.files;
      if (files && files.length) openAddWithFiles(files);
    });

    /* flush pending edits */
    const flushOnHide = () => {
      if (document.visibilityState === 'hidden') flushSaves();
    };
    document.addEventListener('visibilitychange', flushOnHide);
    window.addEventListener('pagehide', () => { flushSaves(); });
    window.addEventListener('beforeunload', () => { flushSaves(); });

    /* 多分頁同步 */
    if ('BroadcastChannel' in window) {
      try {
        const bc = new BroadcastChannel(CONFIG.dbName);
        bc.addEventListener('message', (event) => {
          if (!event.data || event.data.type !== 'changed') return;
          if (document.visibilityState !== 'visible') return;
          if (state.drawerId) return;
          reload();
        });
        state.broadcast = bc;
      } catch (_) {}
    }
  }
  const notifyChange = debounce(function () {
    if (state.broadcast) {
      try { state.broadcast.postMessage({ type: 'changed', at: Date.now() }); } catch (_) {}
    }
  }, 150);

  /* ═══════════ boot ═══════════ */
  let cachedTheme = 'auto';
  try { cachedTheme = localStorage.getItem(THEME_KEY) || 'auto'; } catch (_) {}

  async function reload() {
    try {
      state.items = await dbGetAll(STORE_ITEMS);
    } catch (err) {
      console.error(err);
      state.items = [];
      showBanner('讀取資料失敗，請重新整理頁面。', { tone: 'error', sticky: true });
    }
    renderAll();
    refreshUsage();
  }

  async function boot() {
    applyTheme(cachedTheme);
    bindEvents();
    syncSidebarInert();

    try {
      await db();
    } catch (err) {
      console.warn('IndexedDB unavailable, memory mode:', err);
      idbOK = false;
      storeMode.textContent = '記憶體模式：關閉後資料消失';
      showBanner('目前無法使用瀏覽器資料庫（常見於 file:// 或無痕模式），資料不會保存。請改用本機伺服器開啟，或先匯出備份。', {
        tone: 'error',
        sticky: true,
      });
    }

    if (idbOK) {
      storeMode.textContent = '資料存於 IndexedDB';
      try {
        if (navigator.storage && navigator.storage.persist) {
          const persisted = await navigator.storage.persisted();
          if (!persisted) await navigator.storage.persist();
        }
      } catch (_) {}
    }

    try {
      const row = await dbGet(STORE_META, 'settings');
      const settings = row && row.value ? row.value : null;
      if (settings) {
        if (settings.theme) applyTheme(settings.theme);
        if (settings.view === 'grid' || settings.view === 'list' || settings.view === 'board') state.view = settings.view;
        if (['created', 'updated', 'title', 'manual'].includes(settings.sort)) state.sort = settings.sort;
      }
    } catch (_) {}

    try { await flushSaves(); } catch (_) {}

    await reload();
  }

  boot();
})();
</script>
