<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HookLab － 社群鉤子實驗室</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--panel2:#f0f2f8;--text:#1f2430;--muted:#6b7385;--line:#e1e5ef;--pri:#5b5bf0;--pri2:#4646d6;--priBg:#ececff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 3px rgba(20,25,50,.08),0 4px 14px rgba(20,25,50,.05);--radius:12px}
[data-theme=dark]{--bg:#12141c;--panel:#1b1e29;--panel2:#242838;--text:#e8eaf2;--muted:#9aa1b5;--line:#2e3347;--pri:#8b8bff;--pri2:#a3a3ff;--priBg:#2a2c4d;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
.shell{display:flex;min-height:100vh}
#nav{width:216px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;transition:width .15s}
#nav.collapsed{width:64px}
#nav.collapsed .nl,#nav.collapsed .brand small{display:none}
.brand{font-size:20px;font-weight:800;padding:6px 10px 14px;color:var(--pri)}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.nav-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--text);cursor:pointer;margin-bottom:2px;text-decoration:none!important}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--priBg);color:var(--pri);font-weight:700}
.nav-item .ni{width:20px;text-align:center}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
#main{flex:1;min-width:0;padding:22px 28px 60px}
.page{max-width:1180px;margin:0 auto}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:2px 0 4px}h2{font-size:16px;margin:0 0 10px}h3{margin:0;font-size:16px}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.kpi{text-align:left}.kpi .v{font-size:26px;font-weight:800;color:var(--pri)}.kpi .l{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:9px;cursor:pointer;transition:.12s}
button:hover,.btn:hover{background:var(--panel2)}
button.primary,.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover,.btn.primary:hover{background:var(--pri2)}
button.danger,.btn.danger{color:var(--bad);border-color:var(--bad)}
button.danger.solid{background:var(--bad);color:#fff}
button.sm{padding:3px 9px;font-size:12px}
.icon-btn{border:none;background:transparent;padding:3px 7px;font-size:15px;border-radius:6px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--priBg)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--pri)}
input.invalid{border-color:var(--bad);background:rgba(220,38,38,.08)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;margin-bottom:10px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:10px}.filters.f3{grid-template-columns:2fr 1fr 1fr}.filters.f4{grid-template-columns:2fr 1fr 1fr auto}.g7{grid-template-columns:repeat(7,1fr)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--priBg);color:var(--pri);white-space:nowrap}
.badge.ok{background:rgba(22,163,74,.14);color:var(--ok)}.badge.warn{background:rgba(217,119,6,.15);color:var(--warn)}.badge.bad{background:rgba(220,38,38,.13);color:var(--bad)}.badge.gray{background:var(--panel2);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:hover td{background:rgba(120,120,160,.04)}
.tw{overflow-x:auto}
.mt-input{width:84px;padding:4px 6px}
.mt-input.date{width:132px}
td.calc{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.hooktext{font-weight:600}
.star{cursor:pointer;font-size:17px;color:var(--muted);user-select:none}.star.on{color:#f59e0b}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;cursor:pointer;background:var(--panel2)}
.chip.on{background:var(--priBg);border-color:var(--pri);color:var(--pri)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center}
.swipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.swipe-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.quote{font-size:16px;font-weight:700;line-height:1.5}
.insp{background:linear-gradient(135deg,var(--priBg),var(--panel));}
.insp .quote{font-size:20px}
.scorebar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}.scorebar>i{display:block;height:100%;background:var(--pri)}
.bigscore{font-size:44px;font-weight:800;line-height:1}
.bigscore.good{color:var(--ok)}.bigscore.mid{color:var(--warn)}.bigscore.low{color:var(--bad)}
.hm td{text-align:center;font-size:12px;border:1px solid var(--bg)}
.hm td.n{color:var(--muted);font-style:italic}
.modal-back{position:fixed;inset:0;background:rgba(10,12,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:100;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:820px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;max-height:68vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast-root{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:340px;animation:fi .2s}
.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.banner{background:var(--priBg);border:1px solid var(--pri);color:var(--text);padding:12px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:rgba(217,119,6,.12);border-color:var(--warn)}
.batch{position:sticky;bottom:10px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;display:flex;gap:8px;align-items:center;margin-top:10px}
.batch button{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.insight{padding:8px 12px;border-left:3px solid var(--pri);background:var(--panel2);border-radius:0 8px 8px 0;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sel-list{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.sel-list div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sel-list div:hover,.sel-list div.on{background:var(--priBg)}
@media(max-width:900px){.g5{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.g7{grid-template-columns:repeat(2,1fr)}.filters,.filters.f3,.filters.f4{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.shell{flex-direction:column}#nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%!important;height:auto;flex-direction:row;padding:4px;z-index:50;border-right:none;border-top:1px solid var(--line);overflow-x:auto}.brand,.nav-foot,.nl{display:none!important}.nav-item{flex:1;justify-content:center;margin:0;padding:8px 4px}#main{padding:14px 12px 80px}#toast-root{bottom:76px;right:10px}}
</style>
</head>
<body>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"><section id="view"></section></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<noscript>HookLab 需要啟用 JavaScript。</noscript>

<script>
'use strict';
const APP_VERSION = '1.0.1';
/* =====================================================================
   HookLab – Social Hook Intelligence Workspace (single-file SPA)
   Vanilla JS + IndexedDB · 無外部資源 · 無 API Key · 可離線使用
   ===================================================================== */

/* ---------- 基礎工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const on = (root, ev, sel, fn) => root.addEventListener(ev, e => { const t = e.target.closest(sel); if (t && root.contains(t)) fn(e, t); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pct = v => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(2) + '%';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const splitList = s => String(s || '').split(/[,，、\n]+/).map(x => x.trim()).filter(Boolean);
const uniq = a => [...new Set(a)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製', 'ok'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製', 'ok'); } catch (_) { toast('複製失敗，請手動複製', 'err'); }
    ta.remove();
  }
}
function download(filename, text, mime = 'text/plain') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function toCSV(headers, rows) {
  const q = v => { let s = v == null ? '' : String(v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\uFEFF' + [headers.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n');
}

/* ---------- Modal ---------- */
const Modal = {
  stack: [],
  open({ title, html, buttons = [], wide = false, onMount, onClose }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-back';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-x aria-label="關閉">✕</button></div><div class="modal-b">${html}</div><div class="modal-f"></div></div>`;
    const close = () => { if (!wrap.isConnected) return; wrap.remove(); Modal.stack = Modal.stack.filter(w => w !== wrap); onClose && onClose(); };
    wrap.close = close;
    const f = $('.modal-f', wrap);
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || ''); el.textContent = b.text;
      el.onclick = async () => {
        if (el.disabled) return; el.disabled = true;
        try { if (b.fn) { const r = await b.fn(wrap, close); if (r === false) { el.disabled = false; return; } } close(); }
        catch (err) { console.error(err); el.disabled = false; toast('發生錯誤：' + ((err && err.message) || err), 'err'); }
      };
      f.appendChild(el);
    });
    if (!buttons.length) f.remove();
    $('[data-x]', wrap).onclick = close;
    $('#modal-root').appendChild(wrap); Modal.stack.push(wrap);
    onMount && onMount(wrap, close);
    const fi = $('.modal-b input:not([type=checkbox]):not([type=radio]),.modal-b textarea,.modal-b select', wrap);
    fi && fi.focus();
    return wrap;
  },
  closeTop() { const w = Modal.stack[Modal.stack.length - 1]; if (w) w.close(); }
};
function confirmBox(msg, { okText = '確定', danger = false, title = '請確認' } = {}) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    Modal.open({
      title, html: `<div style="white-space:pre-wrap">${esc(msg)}</div>`,
      buttons: [{ text: '取消', fn: () => fin(false) }, { text: okText, cls: danger ? 'danger solid' : 'primary', fn: () => fin(true) }],
      onClose: () => fin(false)
    });
  });
}
function promptBox(title, label, def = '') {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    Modal.open({
      title, html: `<label class="f"><span>${esc(label)}</span><input id="pb-in" value="${esc(def)}"></label>`,
      buttons: [{ text: '取消', fn: () => fin(null) }, { text: '確定', cls: 'primary', fn: w => { fin($('#pb-in', w).value.trim()); } }],
      onMount: w => { $('#pb-in', w).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $('.btn.primary', w).click(); } }); },
      onClose: () => fin(null)
    });
  });
}

/* ---------- IndexedDB ---------- */
const COLL = ['hooks', 'templates', 'posts', 'variants', 'metrics', 'swipes', 'vocab'];
const DB = {
  db: null, NAME: 'HookLabDB', VER: 1,
  SCHEMA: {
    hooks: { idx: [['type', 'type'], ['topic', 'topic'], ['favorite', 'favorite'], ['createdAt', 'createdAt'], ['tags', 'tags', true], ['platforms', 'platforms', true]] },
    templates: { idx: [['type', 'type'], ['builtIn', 'builtIn']] },
    posts: { idx: [['platform', 'platform'], ['publishedAt', 'publishedAt'], ['campaign', 'campaign'], ['status', 'status']] },
    variants: { idx: [['postId', 'postId'], ['hookId', 'hookId']] },
    metrics: { idx: [['variantId', 'variantId'], ['recordedAt', 'recordedAt']] },
    swipes: { idx: [['platform', 'platform'], ['type', 'type']] },
    vocab: { idx: [['variable', 'variable']] },
    settings: { keyPath: 'key', idx: [] }
  },
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(this.NAME, this.VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const [name, def] of Object.entries(this.SCHEMA)) {
          if (d.objectStoreNames.contains(name)) continue;
          const st = d.createObjectStore(name, { keyPath: def.keyPath || 'id' });
          def.idx.forEach(([n, kp, multi]) => st.createIndex(n, kp, { multiEntry: !!multi }));
        }
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); toast('資料庫已在其他分頁更新，請重新整理頁面', 'err'); }; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('資料庫被其他分頁佔用，請關閉其他 HookLab 分頁後重試'));
    });
  },
  _tx(stores, mode) { return this.db.transaction(stores, mode); },
  all(s) { return new Promise((res, rej) => { const r = this._tx(s, 'readonly').objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(s, v) { return this.bulkPut(s, [v]); },
  bulkPut(s, arr) { return new Promise((res, rej) => { const tx = this._tx(s, 'readwrite'); const st = tx.objectStore(s); arr.forEach(v => st.put(v)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  del(s, k) { return this.bulkDel(s, [k]); },
  bulkDel(s, keys) { return new Promise((res, rej) => { const tx = this._tx(s, 'readwrite'); const st = tx.objectStore(s); keys.forEach(k => st.delete(k)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  clear(s) { return new Promise((res, rej) => { const tx = this._tx(s, 'readwrite'); tx.objectStore(s).clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};

/* ---------- 預設設定 ---------- */
const DEFAULTS = {
  hookTypes: ['好奇', '痛點', '數字', '問題', '警告', '利益', '故事', '反常識', '時效', '挑戰', '情境', '懸念'],
  platforms: ['Facebook', 'Instagram', 'Threads', 'LINE', 'YouTube', '其他'],
  emotions: ['好奇', '焦慮', '期待', '共鳴', '驚訝', '其他'],
  ctaTypes: ['留言', '分享', '收藏', '點擊', '無'],
  scoreWeights: { length: 15, core: 20, number: 10, question: 10, benefit: 15, concrete: 15, urgency: 15 },
  scoreKeywords: {
    benefit: ['省', '賺', '免費', '優惠', '折扣', '回饋', '秘訣', '技巧', '懶人', '輕鬆', '快速', '必學', '必看', '福利', '好康', '升級', '零成本', '提升', '加碼', '搞定'],
    urgency: ['限時', '最後', '今天', '今日', '現在', '立即', '馬上', '倒數', '只到', '僅限', '快搶', '即將', '截止', '別錯過', '錯過', '趁'],
    abstract: ['很多', '非常', '一些', '各種', '不少', '相當', '某些', '大家', '很棒', '超讚', '真的很', '滿滿', '等等', '之類', '有點'],
    question: ['？', '?', '嗎', '為什麼', '為何', '怎麼', '如何', '竟然', '原來', '居然', '知道', '難道', '到底', '…', '...', '秘密', '其實']
  },
  theme: 'light', lastBackupAt: null, seeded: false, minImpressions: 100
};
const SCORE_NAMES = { length: '長度', core: '前段核心', number: '數字', question: '疑問／懸念', benefit: '利益點', concrete: '具體性', urgency: '急迫／CTA' };
const METRICS = { er: '互動率', cr: '留言率', sr: '分享率', svr: '收藏率', ctr: 'CTR' };
const minImp = () => { const n = Number(S.settings.minImpressions); return Number.isFinite(n) && n >= 0 ? n : 100; };

/* ---------- 記憶體 Store ---------- */
const S = { hooks: [], templates: [], posts: [], variants: [], metrics: [], swipes: [], vocab: [], settings: clone(DEFAULTS) };
async function loadAll() {
  for (const k of COLL) S[k] = await DB.all(k);
  const st = await DB.all('settings');
  S.settings = clone(DEFAULTS);
  st.forEach(x => { S.settings[x.key] = x.value; });
}
async function save(coll, obj) {
  const t = nowISO(); obj.updatedAt = t; if (!obj.createdAt) obj.createdAt = t;
  await DB.put(coll, obj);
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  return obj;
}
async function removeMany(coll, ids) {
  if (!ids.length) return;
  await DB.bulkDel(coll, ids);
  const set = new Set(ids); S[coll] = S[coll].filter(x => !set.has(x.id));
}
async function setSetting(k, v) { S.settings[k] = v; await DB.put('settings', { key: k, value: v, updatedAt: nowISO() }); }

/* ---------- 指標計算 ---------- */
function calc(m) {
  const imp = Number(m.impressions) || 0, l = +m.likes || 0, c = +m.comments || 0, s = +m.shares || 0, v = +m.saves || 0, k = +m.clicks || 0;
  const eng = l + c + s + v; const r = x => imp > 0 ? x / imp : null;
  return { imp, eng, er: r(eng), cr: r(c), sr: r(s), svr: r(v), ctr: r(k) };
}
function latestMap() {
  const map = new Map();
  for (const m of S.metrics) {
    if (!(Number(m.impressions) > 0)) continue; // 尚未填曝光的空白列不算「最新成效」
    const cur = map.get(m.variantId);
    const key = (m.recordedAt || '') + '|' + (m.createdAt || '');
    if (!cur || key >= ((cur.recordedAt || '') + '|' + (cur.createdAt || ''))) map.set(m.variantId, m);
  }
  return map;
}
function perfRows() {
  const lm = latestMap(); const hm = new Map(S.hooks.map(h => [h.id, h])); const pm = new Map(S.posts.map(p => [p.id, p]));
  const out = [];
  for (const v of S.variants) {
    const m = lm.get(v.id), h = hm.get(v.hookId), p = pm.get(v.postId);
    if (!m || !h || !p) continue;
    const c = calc(m); if (c.imp <= 0 || c.imp < minImp()) continue;
    out.push({ v, h, p, m, c });
  }
  return out;
}
function hookStats() {
  const lm = latestMap(); const pm = new Map(S.posts.map(p => [p.id, p])); const st = new Map();
  for (const v of S.variants) {
    const p = pm.get(v.postId); const o = st.get(v.hookId) || { uses: 0, bestER: null, lastUsed: null, hasMetric: false };
    o.uses++;
    const d = p && (p.publishedAt || (p.createdAt ? dstr(new Date(p.createdAt)) : ''));
    if (d && (!o.lastUsed || d > o.lastUsed)) o.lastUsed = d;
    const m = lm.get(v.id);
    if (m) { const c = calc(m); if (c.er != null && c.imp >= minImp()) { o.hasMetric = true; if (o.bestER == null || c.er > o.bestER) o.bestER = c.er; } }
    st.set(v.hookId, o);
  }

}
function winnerInfo(variants, metric) {
  const lm = latestMap(), mi = minImp();
  const items = variants.map(v => { const m = lm.get(v.id); const c = m ? calc(m) : null; return { v, m, c, val: c ? c[metric] : null, ok: !!(c && c.imp >= mi && c[metric] != null) }; });
  const el = items.filter(i => i.ok).sort((a, b) => b.val - a.val);

  if (el.length >= 2) {

    close = second > 0 ? (el[0].val - second) / second < 0.10 : el[0].val === 0;
    if (close) note = '差異不明顯（領先幅度 < 10%），建議累積更多曝光再判斷';

}

/* ---------- 相似度（重複偵測） ---------- */
function norm(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}\p{Extended_Pictographic}]/gu, ''); }
function bigrams(s) {
  const t = [...norm(s)]; const set = new Set();
  if (t.length < 2) { if (t.length) set.add(t[0]); return set; }
  for (let i = 0; i < t.length - 1; i++) set.add(t[i] + t[i + 1]);
  return set;
}
function jaccard(a, b) {
  if (!a.size && !b.size) return 0; let inter = 0; for (const x of a) if (b.has(x)) inter++;
  return inter / (a.size + b.size - inter);
}
function findSimilar(text, excludeId, th = 0.7) {
  const A = bigrams(text);
  return S.hooks.filter(h => h.id !== excludeId).map(h => ({ h, s: jaccard(A, bigrams(h.text)) })).filter(x => x.s >= th).sort((a, b) => b.s - a.s).slice(0, 3);
}

/* ---------- Hook Score（規則式） ---------- */
function scoreHook(text, topic) {
  const W = S.settings.scoreWeights, K = S.settings.scoreKeywords;
  const t = String(text || '').trim(); const chars = [...t]; const len = chars.length; const head = chars.slice(0, 20).join('');
  const hit = (list, str) => (list || []).filter(k => k && str.includes(k));
  const items = [];
  const push = (k, f, msg) => items.push({ k, name: SCORE_NAMES[k], f: Math.max(0, Math.min(1, f)), w: Number(W[k]) || 0, msg, ok: f >= 0.8 });
  // 長度
  let f = len === 0 ? 0 : len < 12 ? len / 12 : len <= 30 ? 1 : 1 - (len - 30) / 30;
  push('length', f, len < 12 ? `僅 ${len} 字，偏短，建議 12~30 字` : len > 30 ? `${len} 字偏長，建議精簡到 30 字內` : `${len} 字，長度剛好`);
  // 前段核心
  const tp = (topic || '').trim();
  if (tp) {
    if (head.includes(tp)) push('core', 1, `核心主題「${tp}」出現在前 20 字`);
    else if (t.includes(tp)) push('core', 0.5, `核心主題「${tp}」出現得太晚，建議移到前 20 字`);
    else push('core', 0, `開頭未出現核心主題「${tp}」`);
  } else {
    const hh = hit([...K.benefit, ...K.urgency], head).length + (/\d/.test(head) ? 1 : 0);
    push('core', hh ? 1 : (len >= 8 ? 0.5 : 0), hh ? '前 20 字已有明確資訊（未指定主題，以關鍵詞推估）' : '前 20 字缺少明確資訊（可在上方輸入核心主題以精準評分）');
  }
  // 數字
  const hasNum = /[0-9０-９]+|[一二三四五六七八九十兩]+(?=個|招|種|步|件|大|項|秒|分鐘|天|次|張|%|％|成)/.test(t);
  push('number', hasNum ? 1 : 0, hasNum ? '有明確數字' : '沒有數字，加入具體數字更有說服力');
  // 疑問/懸念
  const qh = hit(K.question, t);
  push('question', qh.length ? 1 : 0, qh.length ? `有疑問／懸念元素（${qh.slice(0, 2).join('、')}）` : '缺少疑問或懸念，可用提問、「原來」「竟然」引發好奇');
  // 利益
  const bh = hit(K.benefit, t);
  push('benefit', bh.length >= 2 ? 1 : bh.length === 1 ? 0.65 : 0, bh.length ? `命中利益詞：${bh.slice(0, 3).join('、')}` : '沒有明確利益點，讓讀者知道「看了能得到什麼」');
  // 具體性
  const ah = hit(K.abstract, t);
  push('concrete', len === 0 ? 0 : 1 - ah.length / 3, ah.length ? `內容較抽象（${ah.slice(0, 3).join('、')}），建議換成具體名詞或數字` : '用字具體');
  // 急迫
  const uh = hit(K.urgency, t);
  push('urgency', uh.length >= 2 ? 1 : uh.length === 1 ? 0.7 : 0, uh.length ? `有急迫感用詞：${uh.slice(0, 3).join('、')}` : '沒有急迫或行動呼籲用詞（適用於活動／限時內容）');
  const sumW = items.reduce((a, i) => a + i.w, 0) || 1;
  items.forEach(i => { i.score = Math.round(i.f * i.w * 10) / 10; });
  const total = Math.round(items.reduce((a, i) => a + i.f * i.w, 0) / sumW * 100);
  return { total, items, len };
}

const scoreBadge = n => `<span class="badge ${n >= 80 ? 'ok' : n >= 60 ? 'warn' : 'bad'}">${n} 分</span>`;

/* ---------- 圖表（SVG / HTML） ---------- */
function barChart(items, fmt = pct) {
  if (!items.length) return '<div class="empty">沒有資料</div>';
  const max = Math.max(...items.map(i => i.value || 0), 1e-9), rowH = 30, lw = 120, w = 640, bw = w - lw - 150;
  const rows = items.map((it, i) => {
    const y = i * rowH, len = Math.max(2, (it.value || 0) / max * bw);
    return `<g transform="translate(0,${y})"><text x="${lw - 8}" y="19" text-anchor="end" style="fill:var(--text);font-size:12px">${esc(it.label)}</text>
      <rect x="${lw}" y="5" width="${len.toFixed(1)}" height="18" rx="4" style="fill:${it.gray ? 'var(--line)' : it.hl ? 'var(--ok)' : 'var(--pri)'}"/>
      <text x="${lw + len + 6}" y="19" style="fill:var(--muted);font-size:12px">${esc(fmt(it.value))}${it.n != null ? ' (n=' + it.n + ')' : ''}${it.hl ? ' 🏆' : ''}</text></g>`;
  }).join('');

}
function lineChart(points, fmt = pct) {
  if (points.length < 1) return '<div class="empty">沒有資料</div>';
  const w = 640, h = 220, pl = 54, pr = 16, pt = 16, pb = 34;
  const vals = points.map(p => p.value), max = Math.max(...vals, 1e-9), min = 0;
  const x = i => pl + (points.length === 1 ? (w - pl - pr) / 2 : i * (w - pl - pr) / (points.length - 1));
  const y = v => pt + (h - pt - pb) * (1 - (v - min) / (max - min));
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const grid = [0, .5, 1].map(r => `<line x1="${pl}" x2="${w - pr}" y1="${y(max * r)}" y2="${y(max * r)}" style="stroke:var(--line)"/><text x="${pl - 6}" y="${y(max * r) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${esc(fmt(max * r))}</text>`).join('');
  const dots = points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" style="fill:var(--pri)"/><text x="${x(i)}" y="${h - 12}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${esc(p.label)}</text><text x="${x(i)}" y="${y(p.value) - 8}" text-anchor="middle" style="fill:var(--text);font-size:11px">${esc(fmt(p.value))}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${grid}<path d="${path}" fill="none" stroke-width="2.5" style="stroke:var(--pri)"/>${dots}</svg>`;
}

async function deleteHooks(ids) {
  const vs = S.variants.filter(v => ids.includes(v.hookId));
  const posts = uniq(vs.map(v => v.postId)).length;
  const msg = vs.length ? `所選 Hook 已用於 ${posts} 篇貼文（${vs.length} 個版本）。\n刪除將連同這些版本與成效紀錄一併刪除，確定嗎？` : `確定刪除 ${ids.length} 筆 Hook？此動作無法復原。`;
  if (!(await confirmBox(msg, { okText: '刪除', danger: true }))) return false;
  await cascadeDeleteVariants(vs.map(v => v.id));
  await removeMany('hooks', ids);
  const affected = uniq(vs.map(v => v.postId)); for (const p of affected) await refreshWinner(p);
  toast('已刪除', 'ok'); return true;
}
async function cascadeDeleteVariants(variantIds) {
  const set = new Set(variantIds);
  await removeMany('metrics', S.metrics.filter(m => set.has(m.variantId)).map(m => m.id));
  await removeMany('variants', variantIds);
}

}

/* ---------- Hook DNA ---------- */
Views.dna = function (root) {
  const st = { period: 'all', platform: '', topic: '', campaign: '', metric: 'er' };
  const used = uniq(S.posts.map(p => p.platform).filter(Boolean));
  root.innerHTML = `<div class="page-h"><div><h1>🧬 Hook DNA</h1><div class="muted">用你的歷史成效，找出自己的「高成效開頭基因」</div></div></div>
    <div class="card"><div class="row"><span class="small muted">期間</span><select id="n-per" style="width:130px"><option value="all">全部</option><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="180">近 180 天</option></select>
    <span class="small muted">平台</span><select id="n-plat" style="width:140px">${opts(used, '', '全部平台')}</select><span class="small muted">主題</span><select id="n-topic" style="width:130px">${opts(uniq(S.hooks.map(h => h.topic).filter(Boolean)), '', '全部主題')}</select><span class="small muted">活動</span><select id="n-camp" style="width:130px">${opts(uniq(S.posts.map(p => p.campaign).filter(Boolean)), '', '全部活動')}</select><span class="small muted">指標</span><select id="n-met" style="width:120px">${Object.entries(METRICS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div></div><div id="n-body"></div>`;
  const grp = (rows, keyFn) => { const m = new Map(); rows.forEach(r => { const k = keyFn(r); if (k == null) return; const o = m.get(k) || { s: 0, n: 0 }; o.s += r.val; o.n++; m.set(k, o); }); return m; };
  const avgOf = o => o.s / o.n;
  function draw() {
    const cutoff = st.period === 'all' ? null : daysAgo(+st.period);
    const rows = perfRows().map(r => Object.assign(r, { val: r.c[st.metric] })).filter(r => r.val != null && (!cutoff || (r.p.publishedAt || '') >= cutoff) && (!st.platform || r.p.platform === st.platform) && (!st.topic || r.h.topic === st.topic) && (!st.campaign || r.p.campaign === st.campaign));
    const body = $('#n-body', root), M = METRICS[st.metric];
    if (!rows.length) { body.innerHTML = '<div class="card empty">目前條件下沒有成效資料<br>到「A/B 實驗」建立貼文並填入曝光與互動數據，或到總覽載入範例資料</div>'; return; }
    const overall = mean(rows.map(r => r.val));
    const byType = [...grp(rows, r => r.h.type)].map(([k, o]) => ({ k, avg: avgOf(o), n: o.n })).sort((a, b) => b.avg - a.avg);
    const platforms = uniq(rows.map(r => r.p.platform)).filter(Boolean), types = byType.map(x => x.k);
    const cell = grp(rows, r => r.p.platform + '||' + r.h.type); let hmMax = 1e-9; cell.forEach(o => { hmMax = Math.max(hmMax, avgOf(o)); });
    const bucket = len => len <= 15 ? '0-15 字' : len <= 25 ? '16-25 字' : len <= 40 ? '26-40 字' : '40+ 字';
    const byLen = grp(rows, r => bucket([...r.h.text].length)); const lenOrder = ['0-15 字', '16-25 字', '26-40 字', '40+ 字'];
    const feats = [['數字', r => /[0-9０-９]/.test(r.h.text)], ['問號', r => /[？?]/.test(r.h.text)], ['Emoji', r => /\p{Extended_Pictographic}/u.test(r.h.text)]].map(([n, fn]) => { const a = rows.filter(fn), b = rows.filter(r => !fn(r)); return { n, a: a.length ? mean(a.map(r => r.val)) : null, an: a.length, b: b.length ? mean(b.map(r => r.val)) : null, bn: b.length }; });
    const byMonth = [...grp(rows, r => (r.p.publishedAt || '').slice(0, 7) || null)].sort((a, b) => a[0].localeCompare(b[0])).map(([k, o]) => ({ label: k, value: avgOf(o) }));
    const best = new Map(); rows.forEach(r => { const c = best.get(r.h.id); if (!c || r.val > c.val) best.set(r.h.id, r); });
    const topAll = [...best.values()].sort((a, b) => b.val - a.val); const topN = Math.max(1, Math.ceil(topAll.length * 0.1)); const top = topAll.slice(0, topN);
    const insights = [];
    const goodTypes = byType.filter(x => x.n >= 3);
    if (goodTypes.length) insights.push(`整體來看，「${goodTypes[0].k}」型 Hook 的平均${M}最高（${pct(goodTypes[0].avg)}，n=${goodTypes[0].n}），為整體平均 ${(goodTypes[0].avg / overall).toFixed(1)} 倍。`);
    platforms.forEach(p => { const rp = rows.filter(r => r.p.platform === p); const ov = mean(rp.map(r => r.val)); const g = [...grp(rp, r => r.h.type)].map(([k, o]) => ({ k, avg: avgOf(o), n: o.n })).filter(x => x.n >= 3).sort((a, b) => b.avg - a.avg)[0]; if (g && ov > 0 && g.avg / ov >= 1.1) insights.push(`${p} 上「${g.k}」型平均${M} ${pct(g.avg)}，高於該平台平均的 ${(g.avg / ov).toFixed(1)} 倍（n=${g.n}）。`); });
    feats.forEach(f => { if (f.an >= 3 && f.bn >= 3 && f.b > 0) { const r = f.a / f.b; if (r >= 1.15) insights.push(`開頭含「${f.n}」的 Hook ${M}較高（${pct(f.a)} vs ${pct(f.b)}，約 ${r.toFixed(1)} 倍）。`); else if (r <= 0.87) insights.push(`開頭含「${f.n}」的 Hook ${M}反而較低（${pct(f.a)} vs ${pct(f.b)}）。`); } });
    const ln = [...byLen].filter(([, o]) => o.n >= 3).sort((a, b) => avgOf(b[1]) - avgOf(a[1]))[0]; if (ln) insights.push(`長度落在「${ln[0]}」的 Hook ${M}最高（${pct(avgOf(ln[1]))}，n=${ln[1].n}）。`);
    if (!insights.length) insights.push('樣本數仍不足（各分類需 n ≥ 3），持續累積資料後洞察會更準確。');
    body.innerHTML = `
      <div class="card"><h2>💡 自動洞察</h2>${insights.map(i => `<div class="insight">${esc(i)}</div>`).join('')}<div class="small muted">共 ${rows.length} 筆有效資料（曝光 ≥ ${minImp()}），整體平均${M}：${pct(overall)}</div></div>
      <div class="grid g2" style="align-items:start"><div class="card"><h2>各 Hook 類型平均${M}</h2>${barChart(byType.map(x => ({ label: x.k + (x.n < 3 ? '＊' : ''), value: x.avg, n: x.n, gray: x.n < 3 })))}<div class="small muted">＊ 樣本不足（n &lt; 3）</div></div>
      <div class="card"><h2>Hook 長度 vs ${M}</h2>${barChart(lenOrder.filter(k => byLen.has(k)).map(k => ({ label: k, value: avgOf(byLen.get(k)), n: byLen.get(k).n, gray: byLen.get(k).n < 3 })))}
      <h2 style="margin-top:14px">字面特徵對照</h2><table><thead><tr><th>特徵</th><th>有</th><th>無</th></tr></thead><tbody>${feats.map(f => `<tr><td>${f.n}</td><td>${pct(f.a)} <span class="muted small">(n=${f.an})</span></td><td>${pct(f.b)} <span class="muted small">(n=${f.bn})</span></td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><h2>平台 × 類型 熱力圖（平均${M}）</h2><div class="tw"><table class="hm"><thead><tr><th></th>${types.map(t => `<th style="text-align:center">${esc(t)}</th>`).join('')}</tr></thead><tbody>${platforms.map(p => `<tr><th>${esc(p)}</th>${types.map(t => { const o = cell.get(p + '||' + t); if (!o) return '<td class="n">—</td>'; const v = avgOf(o); return `<td class="${o.n < 3 ? 'n' : ''}" style="background:rgba(91,91,240,${(0.1 + 0.8 * v / hmMax).toFixed(2)});${v / hmMax > .55 ? 'color:#fff' : ''}" title="n=${o.n}">${pct(v)}<br><span style="opacity:.7">n=${o.n}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div><div class="small muted">斜體淡字＝樣本不足（n &lt; 3）</div></div>
      <div class="card"><h2>月趨勢（平均${M}）</h2>${lineChart(byMonth)}</div>
      <div class="card"><h2>🏆 Winning Hooks（前 10%，共 ${top.length} 筆）</h2><table><tbody>${top.map((r, i) => `<tr><td>${i + 1}</td><td class="hooktext">${esc(r.h.text)}</td><td>${typeBadge(r.h.type)}</td><td class="small muted">${esc(r.p.platform || '')}</td><td><b>${pct(r.val)}</b></td></tr>`).join('')}</tbody></table></div>`;
  }
  $('#n-per', root).onchange = e => { st.period = e.target.value; draw(); }; $('#n-plat', root).onchange = e => { st.platform = e.target.value; draw(); }; $('#n-met', root).onchange = e => { st.metric = e.target.value; draw(); }; $('#n-topic', root).onchange = e => { st.topic = e.target.value; draw(); }; $('#n-camp', root).onchange = e => { st.campaign = e.target.value; draw(); };
  draw();
};

const ID_RE = /^[A-Za-z0-9_-]{1,80}$/;

const STR_FIELDS = ['createdAt', 'updatedAt', 'recordedAt', 'publishedAt', 'type', 'topic', 'platform', 'campaign', 'status', 'label', 'name', 'audience', 'note', 'emotion', 'ctaType', 'sourceName', 'url', 'whyItWorks', 'rewriteIdea', 'body', 'cta', 'source', 'primaryMetric'];
const REC_CHECK = {
  hooks: r => isStr(r.text) && (r.tags = arrS(r.tags), r.platforms = arrS(r.platforms), true),
  templates: r => isStr(r.pattern) && (r.variables = parseVars(r.pattern), true),
  posts: r => isStr(r.title) && (r.hashtags = arrS(r.hashtags), true),

  swipes: r => isStr(r.text) && (r.tags = arrS(r.tags), true),

  if (!obj || obj.app !== 'HookLab' || !obj.data) return toast('這不是 HookLab 備份檔', 'err');
  if (obj.schemaVersion !== 1) return toast(`不相容的備份版本：${obj.schemaVersion}`, 'err');
  for (const k of [...COLL, 'settings']) if (obj.data[k] !== undefined && !Array.isArray(obj.data[k])) return toast(`備份檔資料表「${k}」格式錯誤`, 'err');

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { const w = Modal.stack[Modal.stack.length - 1]; if (w) { e.preventDefault(); const b = $('.modal-f .btn.primary', w); if (b) b.click(); } return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || Modal.stack.length) return;
  if (e.key.toLowerCase() === 'n' && window.__onNew) { e.preventDefault(); window.__onNew(); }
  else if (e.key.toLowerCase() === 'r' && window.__roll) { e.preventDefault(); window.__roll(); }
});
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('發生錯誤：' + ((e.reason && e.reason.message) || e.reason), 'err'); });
window.addEventListener('hashchange', () => { Modal.stack.slice().forEach(w => w.close()); render(); });

(async function init() {
  try {
    if (!window.indexedDB) throw new Error('此瀏覽器不支援 IndexedDB，請改用最新版 Chrome 或 Edge。');
    await DB.open(); await loadAll(); await seedBuiltins(); applyTheme();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
    await render();
  } catch (e) {
    console.error(e);
    document.body.innerHTML = `<div style="max-width:560px;margin:15vh auto;padding:24px;font-family:sans-serif"><h2>⚠ HookLab 無法啟動</h2><p>${esc(e.message || e)}</p><p style="color:#666">若使用無痕／InPrivate 視窗或瀏覽器封鎖網站資料，IndexedDB 可能無法使用。</p></div>`;
  }
})();
