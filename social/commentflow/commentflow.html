<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommentFlow — 留言處理工作台</title>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--panel2:#eef0f5;--text:#1f2430;--muted:#6b7280;--border:#e0e4ea;--primary:#4f6ef7;--primary-ink:#fff;--danger:#e5484d;--warn:#d97706;--warnbg:#fff4d6;--ok:#1f9d63;--sel:#e8edff;--shadow:0 6px 24px rgba(20,30,60,.14)}
[data-theme=dark]{--bg:#13151a;--panel:#1b1e25;--panel2:#252931;--text:#e6e8ee;--muted:#9aa1b0;--border:#2f3440;--primary:#7b93ff;--primary-ink:#0e1220;--danger:#ff6b70;--warn:#fbbf24;--warnbg:#3b3012;--ok:#4ade80;--sel:#262d4a;--shadow:0 6px 24px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
/* top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.logo{font-weight:800;font-size:17px;letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--primary)}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:600}
.nav a:hover{background:var(--panel2)}
.nav a.active{background:var(--sel);color:var(--primary)}
.banner{background:var(--warnbg);color:var(--warn);padding:8px 16px;display:flex;gap:12px;align-items:center;font-weight:600;flex:none}
.banner button{margin-left:auto}
/* buttons / form */
.btn{border:1px solid var(--border);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.icon{border:0;background:transparent;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}
.icon:hover{background:var(--panel2)}
.icon[disabled]{opacity:.3;pointer-events:none}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f>span{display:block}
label.f>*:not(span){margin-top:4px;font-weight:400;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;gap:5px;align-items:center;font-weight:400;color:var(--text);margin-right:10px;font-size:13px}
.chk input{width:auto}
kbd{background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:inherit;font-size:12px}
/* view containers */
#view{flex:1;min-height:0;overflow:auto;position:relative}
#view.view-inbox{overflow:hidden}
#view.view-inbox>.inbox{position:absolute;inset:0;height:auto}
.page{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{margin:0;font-size:20px}
.pagehead .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 8px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--c,#888);color:var(--c,#888);background:color-mix(in srgb,var(--c,#888) 12%,transparent);margin:2px 4px 2px 0;white-space:nowrap}
.chip.sug{border-style:dashed;background:transparent;cursor:pointer}
.chip b{cursor:pointer;font-weight:400;opacity:.7}
.chip b:hover{opacity:1}
.chip.mini{padding:0 6px;font-size:11px}
.badge{display:inline-block;padding:0 7px;border-radius:6px;background:var(--panel2);font-size:11px;color:var(--muted)}
/* inbox */
.inbox{display:grid;grid-template-columns:220px 370px 1fr;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.filters{overflow:auto;padding:12px;border-right:1px solid var(--border);background:var(--panel)}
.filters h4{margin:14px 0 6px;font-size:12px;color:var(--muted);text-transform:none}
.filters h4:first-child{margin-top:0}
.fitem{display:flex;justify-content:space-between;padding:5px 8px;border-radius:7px;cursor:pointer}
.fitem:hover{background:var(--panel2)}
.fitem.on{background:var(--sel);color:var(--primary);font-weight:700}
.fitem .n{color:var(--muted);font-weight:400}
.filters select,.filters input[type=date]{margin-bottom:6px;padding:4px 6px}
.listpane{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border);background:var(--bg)}
.listhead{padding:8px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.listhead .r1{display:flex;gap:6px;align-items:center}
.batch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.batch select{width:auto;padding:2px 4px}
.list{flex:1;min-height:0;overflow:auto;position:relative}
#vwin{position:absolute;left:0;right:0;top:0}
.row{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--panel);cursor:pointer;overflow:hidden}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--sel)}
.row .rk{width:auto;margin-top:3px;flex:none}
.pri{width:4px;border-radius:3px;flex:none;align-self:stretch}
.pri-urgent{background:var(--danger)}.pri-normal{background:#f0b429}.pri-low{background:#c6ccd6}
.rmain{min-width:0;flex:1}
.rtop{display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap;overflow:hidden}
.rtop .st{margin-left:auto;color:var(--muted)}
.rtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.rcats{height:20px;overflow:hidden}
.st-replied .rtext,.st-skipped .rtext{color:var(--muted)}
.detailpane{overflow:auto;padding:16px;background:var(--bg);min-width:0}
.dcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.dhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dhead h3{margin:0;font-size:16px}
.content{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.metarow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.metarow select{width:auto}
.rec{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.rec:hover{border-color:var(--primary)}
.rec.on{border-color:var(--primary);background:var(--sel)}
.rec .k{flex:none}
.rec .tt{font-weight:600}
.rec .pv{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.edwrap{display:grid;grid-template-columns:1fr 190px;gap:10px}
.sidebar{border:1px solid var(--border);border-radius:9px;padding:8px;max-height:300px;overflow:auto;font-size:12px}
.sidebar h5{margin:6px 0 4px;font-size:11px;color:var(--muted)}
.sidebar h5:first-child{margin-top:0}
.sidebar button{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:3px 6px;margin-bottom:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar button:hover{border-color:var(--primary)}
#editor{min-height:130px;font-size:14px}
.preview{white-space:pre-wrap;word-break:break-word;border:1px dashed var(--border);border-radius:9px;padding:9px 11px;margin-top:8px;min-height:44px}
.undef{color:var(--danger);text-decoration:underline wavy var(--danger)}
mark.ban{background:var(--warnbg);color:var(--warn);border-radius:3px;padding:0 2px}
.warn{background:var(--warnbg);color:var(--warn);padding:6px 10px;border-radius:8px;margin-top:6px;font-size:12px}
.counter{font-size:12px;color:var(--muted)}
.counter.over{color:var(--danger);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.backbtn{display:none}
.hint{font-size:12px;color:var(--muted)}
/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(900px,100%)}
.mhead{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.mhead h3{margin:0;flex:1;font-size:16px}
.mbody{padding:14px 16px;overflow:auto}
.mfoot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#222a3a;color:#fff;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:360px}
.toast.error{background:#b42318}.toast.warn{background:#b45309}.toast.ok{background:#147a4d}
.pvtable{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.pvtable input{padding:3px 6px}
tr.dup td{background:var(--warnbg)}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:800}
.kpi .l{color:var(--muted);font-size:12px}
.grid-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.legend{display:flex;flex-direction:column;gap:3px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.pieflex{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vcard{display:flex;gap:12px;align-items:flex-start}
.vcard .body{flex:1;min-width:0}
.vcard .pv{color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
@media (max-width:900px){
 .topbar{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px}
 .nav{order:3;flex-basis:100%}
 .logo{flex:1}
 .inbox{grid-template-columns:1fr}
 .filters{display:none;border-right:0}
 .inbox.fopen .filters{display:block}
 .inbox.fopen .listpane,.inbox.fopen .detailpane{display:none}
 .inbox.dopen .listpane,.inbox.dopen .filters{display:none}
 .inbox:not(.dopen) .detailpane{display:none}
 .backbtn{display:inline-block}
 .edwrap{grid-template-columns:1fr}
 .grid2{grid-template-columns:1fr}
 .grid-charts{grid-template-columns:1fr}
}
@media (min-width:901px){.fbtn{display:none}}
</style>
</head>
<body>
<noscript>CommentFlow 需要啟用 JavaScript。</noscript>
<header class="topbar">
  <div class="logo">Comment<span>Flow</span></div>
  <nav class="nav" id="nav">
    <a href="#/inbox" data-view="inbox">📥 Inbox</a>
    <a href="#/vault" data-view="vault">📝 回覆庫</a>
    <a href="#/blocks" data-view="blocks">🧱 積木</a>
    <a href="#/rules" data-view="rules">🏷️ 規則</a>
    <a href="#/insights" data-view="insights">📊 統計</a>
    <a href="#/settings" data-view="settings">⚙️ 設定</a>
  </nav>
  <button class="btn primary" data-act="openImport">＋貼上留言</button>
  <button class="icon" data-act="toggleTheme" title="切換深色模式" id="themeBtn">🌙</button>
  <button class="icon" data-act="help" title="快捷鍵 (?)">⌨️</button>
</header>
<div id="banner"></div>
<main id="view" class="view"></main>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   CommentFlow v1.1 — 單檔 SPA（Vanilla JS + IndexedDB，無外部資源）
   區塊：1 Utils/Core ｜ 2 DB ｜ 3 Store ｜ 4 Components ｜ 5 Views ｜ 6 Router/Keyboard ｜ 7 Bootstrap
   ===================================================================== */

/* ==== CORE:BEGIN（純函式，可在 Node 中單元測試）==== */
const STATUS = {new:'待處理', in_progress:'處理中', replied:'已回覆', skipped:'略過', escalated:'升級'};
const SENT = {positive:'😊 正面', neutral:'😐 中性', negative:'😠 負面'};
const PRI = {urgent:'🔴 緊急', normal:'🟡 一般', low:'⚪ 低'};
const SENT_RANK = {positive:0, neutral:1, negative:2};
const PRI_RANK = {low:0, normal:1, urgent:2};
const PRI_SORT = {urgent:0, normal:1, low:2};
const DAY = 86400000;

const U = {
  esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  id(prefix){
    const ENC = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
    let t = Date.now(), s = '';
    for (let i = 0; i < 10; i++){ s = ENC[t % 32] + s; t = Math.floor(t / 32); }
    const a = new Uint8Array(8); crypto.getRandomValues(a);
    let r = ''; for (const b of a) r += ENC[b % 32];
    return prefix + '_' + s + r;
  },
  hash(str){ // cyrb53
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  },
  normalize(s){ return String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim(); },
  len(s){ return [...String(s || '')].length; },
  median(a){ if (!a.length) return 0; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; },
  debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  pad(n){ return String(n).padStart(2, '0'); },
  dayKey(ts){ const d = new Date(ts); return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
  startOfDay(ts){ const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); },
  fmtDT(ts){ if (!ts) return '—'; const d = new Date(ts); return d.getFullYear() + '/' + U.pad(d.getMonth() + 1) + '/' + U.pad(d.getDate()) + ' ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes()); },
  ago(ts, now = Date.now()){
    const m = Math.floor((now - ts) / 60000);
    if (m < 1) return '剛剛'; if (m < 60) return m + '分前';
    const h = Math.floor(m / 60); if (h < 24) return h + '小時前';
    const d = new Date(ts); return U.pad(d.getMonth() + 1) + '/' + U.pad(d.getDate());
  },
  dur(ms){ if (!ms) return '—'; const m = ms / 60000; if (m < 1) return '<1 分鐘'; if (m < 60) return Math.round(m) + ' 分鐘'; const h = m / 60; if (h < 24) return h.toFixed(1) + ' 小時'; return (h / 24).toFixed(1) + ' 天'; },
  safeColor(c){ return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#888888'; },
  csvCell(v){ const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
};

const Core = {
  parseCSV(text){
    const rows = []; let row = [], cell = '', q = false;
    const s = String(text || '').replace(/^\uFEFF/, '');
    for (let i = 0; i < s.length; i++){
      const c = s[i];
      if (q){
        if (c === '"'){ if (s[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c;
      } else if (c === '"') q = true;
      else if (c === ','){ row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r'){ if (c === '\r' && s[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  },
  /** mode: line | author | blank | csv；回傳 [{author, content, platform?, time?}] */
  parseComments(text, mode){
    const t = String(text || '');
    const out = [];
    if (mode === 'csv'){
      const rows = Core.parseCSV(t); if (!rows.length) return out;
      const head = rows[0].map(x => x.trim().toLowerCase());
      const hasHead = head.includes('author') || head.includes('content');
      const ix = hasHead ? {a: head.indexOf('author'), c: head.indexOf('content'), p: head.indexOf('platform'), t: head.indexOf('time')} : {a: 0, c: 1, p: 2, t: 3};
      for (const r of (hasHead ? rows.slice(1) : rows)){
        const content = (r[ix.c] || '').trim(); if (!content) continue;
        const o = {author: ix.a >= 0 ? (r[ix.a] || '').trim() : '', content};
        if (ix.p >= 0 && r[ix.p] && r[ix.p].trim()) o.platform = r[ix.p].trim();
        if (ix.t >= 0 && r[ix.t] && r[ix.t].trim()){ const ts = Date.parse(r[ix.t].trim()); if (!isNaN(ts)) o.time = ts; }
        out.push(o);
      }
      return out;
    }
    if (mode === 'blank'){
      for (const b of t.split(/\r?\n\s*\r?\n/)){ const c = b.split(/\r?\n/).map(x => x.trim()).filter(Boolean).join('\n'); if (c) out.push({author: '', content: c}); }
      return out;
    }
    for (const raw of t.split(/\r?\n/)){
      const line = raw.trim(); if (!line) continue;
      if (mode === 'author'){
        let idx = line.indexOf('\t');
        if (idx < 0){ const a = line.indexOf('：'), b = line.indexOf(':'); idx = [a, b].filter(x => x >= 0).sort((x, y) => x - y)[0]; if (idx === undefined) idx = -1; }
        if (idx > 0 && line.substr(idx, 3) !== '://'){ /* FIX: 避免把 http:// 的冒號當成作者分隔 */
          const author = line.slice(0, idx).trim(), content = line.slice(idx + 1).trim();
          if (author && content && [...author].length <= 30){ out.push({author, content}); continue; }
        }
      }
      out.push({author: '', content: line});
    }
    return out;
  },
  ruleRegexError(r){
    if (r.matchType !== 'regex') return null;
    for (const p of (r.keywords || [])){ try { new RegExp(p, 'i'); } catch (e){ return '「' + p + '」不是有效的正規式'; } }
    return null;
  },
  ruleMatches(r, text){
    const kws = (r.keywords || []).map(k => r.matchType === 'regex' ? k : U.normalize(k)).filter(k => k);
    if (!kws.length) return false;
    if (r.matchType === 'all') return kws.every(k => text.includes(k));
    if (r.matchType === 'regex') return kws.some(p => { try { return new RegExp(p, 'i').test(text); } catch (e){ return false; } });
    return kws.some(k => text.includes(k));
  },
  runRules(rules, c){
    const text = U.normalize(c.content);
    const cats = []; let sent = null, pri = null; const hits = [];
    for (const r of [...rules].sort((a, b) => (a.order || 0) - (b.order || 0))){
      if (!r.enabled) continue;
      if (r.platform && r.platform !== c.platform) continue;
      if (!Core.ruleMatches(r, text)) continue;
      hits.push(r);
      const a = r.actions || {};
      (a.categories || []).forEach(id => { if (!cats.includes(id)) cats.push(id); });
      if (a.sentiment && (sent === null || SENT_RANK[a.sentiment] > SENT_RANK[sent])) sent = a.sentiment;
      if (a.priority && (pri === null || PRI_RANK[a.priority] > PRI_RANK[pri])) pri = a.priority;
    }
    return {categories: cats, sentiment: sent || 'neutral', priority: pri || 'normal', hits};
  },
  /** ctx: {vars:{name:value}, blocks: Map('類型/名稱' -> content)} */
  expandTemplate(text, ctx){
    const errors = [], undef = new Set();
    const expandBlocks = (t, depth, stack) => t.replace(/\[\[block:([^\]]+)\]\]/g, (m, ref) => {
      const key = ref.trim();
      if (stack.includes(key)){ errors.push('循環引用：' + key); return ''; }
      if (depth >= 3){ errors.push('積木巢狀超過 3 層：' + key); return ''; }
      if (!ctx.blocks.has(key)){ errors.push('找不到積木：' + key); return m; }
      return expandBlocks(ctx.blocks.get(key), depth + 1, stack.concat(key));
    });
    let out = expandBlocks(String(text || ''), 0, []);
    out = out.replace(/\{\{\s*([^{}]+?)\s*\}\}/g, (m, name) => {
      if (Object.prototype.hasOwnProperty.call(ctx.vars, name)) return ctx.vars[name];
      undef.add(name); return m;
    });
    return {text: out, undefinedVars: [...undef], errors};
  },
  findBanned(text, banned){
    const res = [], low = text.toLowerCase();
    for (const b of banned || []){
      const w = (b.word || '').toLowerCase(); if (!w) continue;
      let i = 0; while ((i = low.indexOf(w, i)) >= 0){ res.push({word: b.word, suggest: b.suggest || '', start: i, end: i + w.length}); i += w.length; }
    }
    return res;
  },
  recommend(templates, c, catIds, now = Date.now()){
    const out = [];
    for (const t of templates){
      const plats = t.platforms && t.platforms.length ? t.platforms : ['all'];
      if (!(plats.includes('all') || plats.includes(c.platform))) continue;
      const hits = (t.categories || []).filter(x => catIds.includes(x)).length;
      const score = hits * 10 + 3 + Math.log((t.useCount || 0) + 1) * 2 + ((t.lastUsedAt && now - t.lastUsedAt < 7 * DAY) ? 1 : 0);
      out.push({t, hits, score});
    }
    out.sort((a, b) => b.score - a.score || String(a.t.title).localeCompare(String(b.t.title)));
    return out.slice(0, 9);
  },
  allCats(c){ return [...new Set([...(c.categories || []), ...(c.suggestedCategories || [])])]; },
  stats(comments, replies, templates, from, to){
    const inR = comments.filter(c => c.createdAt >= from && c.createdAt <= to);
    const replied = inR.filter(c => c.status === 'replied');
    const kpi = {
      total: inR.length, replied: replied.length,
      rate: inR.length ? replied.length / inR.length : 0,
      pending: inR.filter(c => c.status === 'new' || c.status === 'in_progress').length,
      negative: inR.filter(c => c.sentiment === 'negative').length
    };
    const cat = {}, plat = {};
    for (const c of inR){ Core.allCats(c).forEach(id => cat[id] = (cat[id] || 0) + 1); plat[c.platform] = (plat[c.platform] || 0) + 1; }
    const days = [];
    for (const d = new Date(U.startOfDay(from)); d.getTime() <= to; d.setDate(d.getDate() + 1)) days.push(U.dayKey(d.getTime())); /* FIX: 不用 +86400000，避免夏令時間錯位 */
    const dm = {}; days.forEach(k => dm[k] = {created: 0, replied: 0});
    for (const c of inR){ const k = U.dayKey(c.createdAt); if (dm[k]) dm[k].created++; }
    for (const c of comments){ if (c.repliedAt && c.repliedAt >= from && c.repliedAt <= to){ const k = U.dayKey(c.repliedAt); if (dm[k]) dm[k].replied++; } }
    const tcount = {};
    for (const r of replies){ if (r.templateId && r.createdAt >= from && r.createdAt <= to) tcount[r.templateId] = (tcount[r.templateId] || 0) + 1; }
    const covered = new Set(); templates.forEach(t => (t.categories || []).forEach(id => covered.add(id)));
    const uncovered = Object.keys(cat).filter(id => !covered.has(id)).sort((a, b) => cat[b] - cat[a]);
    const med = U.median(replied.filter(c => c.repliedAt).map(c => c.repliedAt - c.createdAt));
    return {kpi, cat, plat, days, dm, tcount, uncovered, median: med};
  }
};

/* ========== 2. DB Layer ========== */
const DB_NAME = 'CommentFlowDB', DB_VERSION = 1;
const STORES = {
  comments: {keyPath: 'id', indexes: [['status', 'status'], ['postId', 'postId'], ['platform', 'platform'], ['createdAt', 'createdAt'], ['hash', 'hash'], ['categories', 'categories', {multiEntry: true}], ['status_createdAt', ['status', 'createdAt']]]},
  posts: {keyPath: 'id', indexes: [['platform', 'platform'], ['createdAt', 'createdAt']]},
  templates: {keyPath: 'id', indexes: [['categories', 'categories', {multiEntry: true}], ['useCount', 'useCount'], ['lastUsedAt', 'lastUsedAt']]},
  blocks: {keyPath: 'id', indexes: [['type', 'type'], ['type_key', ['type', 'key'], {unique: true}]]},
  rules: {keyPath: 'id', indexes: [['order', 'order']]},
  categories: {keyPath: 'id', indexes: []},
  replies: {keyPath: 'id', indexes: [['commentId', 'commentId'], ['templateId', 'templateId'], ['createdAt', 'createdAt']]},
  settings: {keyPath: 'key', indexes: []}
};
const DB = {
  db: null, disabled: false,
  open(){
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('此瀏覽器不支援 IndexedDB'));
      const rq = indexedDB.open(DB_NAME, DB_VERSION);
      rq.onupgradeneeded = e => {
        const db = rq.result, old = e.oldVersion;
        if (old < 1){
          for (const [name, def] of Object.entries(STORES)){
            const os = db.createObjectStore(name, {keyPath: def.keyPath});
            for (const ix of def.indexes) os.createIndex(ix[0], ix[1], ix[2] || {});
          }
        }
        /* 未來版本：if (old < 2) { ... } */
      };
      rq.onsuccess = () => { this.db = rq.result; this.db.onversionchange = () => this.db.close(); res(); };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('資料庫被其他分頁佔用，請關閉其他 CommentFlow 分頁後重試'));
    });
  },
  tx(stores, mode, fn){
    if (this.disabled) return Promise.resolve();
    return new Promise((res, rej) => {
      const t = this.db.transaction(stores, mode);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('交易中止'));
      fn(t);
    });
  },
  getAll(store){
    if (this.disabled) return Promise.resolve([]);
    return new Promise((res, rej) => { const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  put(store, obj){ return this.tx(store, 'readwrite', t => t.objectStore(store).put(obj)); },
  putMany(store, arr){ return this.tx(store, 'readwrite', t => { const os = t.objectStore(store); for (const o of arr) os.put(o); }); },
  del(store, key){ return this.tx(store, 'readwrite', t => t.objectStore(store).delete(key)); },
  delMany(store, keys){ return this.tx(store, 'readwrite', t => { const os = t.objectStore(store); for (const k of keys) os.delete(k); }); },
  clear(store){ return this.tx(store, 'readwrite', t => t.objectStore(store).clear()); }
};

/* ========== 3. Store（記憶體快取 + IndexedDB 持久化）========== */
const S = {
  comments: new Map(), posts: new Map(), templates: new Map(), blocks: new Map(), rules: new Map(), categories: new Map(), replies: new Map(), settings: new Map(),
  keyOf(n){ return n === 'settings' ? 'key' : 'id'; },
  async load(){ for (const n of Object.keys(STORES)){ const arr = await DB.getAll(n); this[n] = new Map(arr.map(o => [o[this.keyOf(n)], o])); } },
  list(n){ return [...this[n].values()]; },
  async save(n, obj){ this[n].set(obj[this.keyOf(n)], obj); await DB.put(n, obj); },
  async saveMany(n, arr){ for (const o of arr) this[n].set(o[this.keyOf(n)], o); await DB.putMany(n, arr); },
  async remove(n, key){ this[n].delete(key); await DB.del(n, key); },
  async removeMany(n, keys){ keys.forEach(k => this[n].delete(k)); await DB.delMany(n, keys); },
  async clearStore(n){ this[n].clear(); await DB.clear(n); },
  get(key, def){ return this.settings.has(key) ? this.settings.get(key).value : def; },
  async set(key, value){ await this.save('settings', {key, value}); }
};

function highlight(text, banned){
  const ranges = [];
  const re = /\{\{\s*[^{}]+?\s*\}\}/g; let m;
  while ((m = re.exec(text))) ranges.push({s: m.index, e: m.index + m[0].length, t: 'u'});
  Core.findBanned(text, banned).forEach(b => ranges.push({s: b.start, e: b.end, t: 'b'}));
  ranges.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  for (const r of ranges){
    if (r.s < pos) continue;
    out += esc(text.slice(pos, r.s));
    const seg = esc(text.slice(r.s, r.e));
    out += r.t === 'u' ? `<span class="undef">${seg}</span>` : `<mark class="ban">${seg}</mark>`;
    pos = r.e;
  }
  return out + esc(text.slice(pos));
}

function openModal({title, body, buttons = [], wide = false, onMount, onClose}){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="mhead"><h3>${esc(title)}</h3><button class="icon" data-close aria-label="關閉">✕</button></div><div class="mbody">${body}</div><div class="mfoot"></div></div>`;
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && ov === [...document.querySelectorAll('.overlay')].pop()){ e.stopPropagation(); close(); } };
  const close = () => { if (closed) return; closed = true; ov.remove(); document.removeEventListener('keydown', onKey, true); if (onClose) onClose(); };
  document.addEventListener('keydown', onKey, true);
  ov.querySelector('[data-close]').onclick = close;
  const foot = ov.querySelector('.mfoot');
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label; if (b.id) el.dataset.bid = b.id;
    el.onclick = async () => {
      try { if (b.onClick){ const r = await b.onClick(ov, close); if (r === false) return; } } catch (err){ console.error(err); toast(err.message || '發生錯誤', 'error'); return; }
      close();
    };
    foot.appendChild(el);
  });
  document.body.appendChild(ov);
  const first = ov.querySelector('input:not([type=checkbox]):not([type=file]),textarea,select'); if (first) first.focus();
  if (onMount) onMount(ov, close);
  return {el: ov, close};
}

  },
  statusOk(c, st){ if (st === 'all') return true; if (st === 'todo') return c.status === 'new' || c.status === 'in_progress'; return c.status === st; },
  filtered(){
    const f = this.filters(), q = U.normalize(f.q);
    let rtext = null;
    if (q){ rtext = new Map(); for (const r of S.list('replies')) rtext.set(r.commentId, (rtext.get(r.commentId) || '') + ' ' + U.normalize(r.finalText)); }
    const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : 0, to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : Infinity;
    const arr = S.list('comments').filter(c => {
      if (!this.statusOk(c, f.status) && c.id !== UI.selectedId) return false;
      if (f.cat && !Core.allCats(c).includes(f.cat)) return false;
      if (f.platform && c.platform !== f.platform) return false;
      if (f.post && c.postId !== f.post) return false;
      if (f.sentiment && c.sentiment !== f.sentiment) return false;
      if (f.priority && c.priority !== f.priority) return false;
      if (f.star && !c.starred) return false;
      if (c.createdAt < from || c.createdAt > to) return false;
      if (q && !(U.normalize(c.author) + ' ' + c.contentNorm + ' ' + U.normalize(c.note) + ' ' + (rtext.get(c.id) || '')).includes(q)) return false;
      return true;
    });

    else if (f.sort === 'oldest') arr.sort((a, b) => a.createdAt - b.createdAt);

}

async function importComments(rows, platform, postId){
  const now = Date.now(), rules = S.list('rules'), existing = new Set(S.list('comments').map(c => c.hash)), out = [];
  const valid = new Set(platforms(true).map(p => p.id));
  rows.forEach((r, i) => {
    const norm = U.normalize(r.content), h = U.hash((postId || '') + '|' + (r.author || '') + '|' + norm);
    let plat = platform;
    if (r.platform){ const hit = platforms(true).find(p => p.id === r.platform.toLowerCase() || U.normalize(p.name) === U.normalize(r.platform)); plat = hit ? hit.id : platform; }
    if (!valid.has(plat)) plat = 'other';
    const res = Core.runRules(rules, {content: r.content, platform: plat});
    out.push({id: U.id('c'), postId: postId || '', platform: plat, author: r.author || '', content: r.content, contentNorm: norm, hash: h, categories: [], suggestedCategories: res.categories, sentiment: res.sentiment, priority: res.priority, status: 'new', starred: false, note: '', escalation: {reason: '', followUpDate: null}, createdAt: r.time || (now + i), updatedAt: now, repliedAt: null});
  });
  await S.saveMany('comments', out); return out.length;
}

const PALETTE = ['#4f6ef7', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#0ea5e9', '#ef4444', '#6b7280'];
const Charts = {
  bars(items){
    if (!items.length) return '<div class="hint">此區間沒有資料</div>';
    const max = Math.max(...items.map(i => i.value)), H = 26, W = 420;
    return `<svg viewBox="0 0 ${W} ${items.length * H}" width="100%" style="max-width:520px" role="img">${items.map((it, i) => { const w = Math.max(2, (it.value / max) * 250); return `<text x="0" y="${i * H + 17}" font-size="12" fill="currentColor">${esc(it.label)}</text><rect x="100" y="${i * H + 5}" width="${w}" height="16" rx="4" fill="${U.safeColor(it.color)}"/><text x="${106 + w}" y="${i * H + 17}" font-size="12" fill="currentColor">${it.value}</text>`; }).join('')}</svg>`;
  },
  pie(items){
    const tot = items.reduce((s, i) => s + i.value, 0); if (!tot) return '<div class="hint">此區間沒有資料</div>';
    const cx = 80, cy = 80, R = 70; let a = -Math.PI / 2;
    const paths = items.map((it, i) => {
      const col = PALETTE[i % PALETTE.length], f = it.value / tot;
      if (f >= 0.9999) return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>`;
      const b = a + f * 2 * Math.PI, x1 = cx + R * Math.cos(a), y1 = cy + R * Math.sin(a), x2 = cx + R * Math.cos(b), y2 = cy + R * Math.sin(b);
      const d = `M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${f > 0.5 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`; a = b; return `<path d="${d}" fill="${col}"/>`;
    }).join('');
    return `<div class="pieflex"><svg viewBox="0 0 160 160" width="160" height="160">${paths}</svg><div class="legend">${items.map((it, i) => `<div><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(it.label)}　${it.value}（${Math.round(it.value / tot * 100)}%）</div>`).join('')}</div></div>`;
  },
  line(days, dm){
    const W = 560, H = 200, P = 30, n = days.length, max = Math.max(1, ...days.map(k => Math.max(dm[k].created, dm[k].replied)));
    const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1)), y = v => H - P - v / max * (H - 2 * P);
    const pts = key => days.map((k, i) => x(i).toFixed(1) + ',' + y(dm[k][key]).toFixed(1)).join(' ');
    const step = Math.max(1, Math.ceil(n / 8));
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:720px"><line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="currentColor" opacity=".3"/><line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="currentColor" opacity=".3"/>
      <text x="4" y="${P + 4}" font-size="11" fill="currentColor">${max}</text><text x="4" y="${H - P}" font-size="11" fill="currentColor">0</text>
      <polyline points="${pts('created')}" fill="none" stroke="#4f6ef7" stroke-width="2"/><polyline points="${pts('replied')}" fill="none" stroke="#10b981" stroke-width="2"/>
      ${days.map((k, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(dm[k].created).toFixed(1)}" r="3" fill="#4f6ef7"/><circle cx="${x(i).toFixed(1)}" cy="${y(dm[k].replied).toFixed(1)}" r="3" fill="#10b981"/>${i % step === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="currentColor">${k.slice(5)}</text>` : ''}`).join('')}
      <text x="${W - 150}" y="14" font-size="11" fill="#4f6ef7">● 新增留言</text><text x="${W - 80}" y="14" font-size="11" fill="#10b981">● 已回覆</text></svg>`;
  }
};

      <div class="grid-charts"><div class="card"><h3>分類分佈（熱門問題 Top 10）</h3>${Charts.bars(catItems)}</div><div class="card"><h3>平台分佈</h3>${Charts.pie(platItems)}</div>

    rows.push(['區間', U.fmtDT(st.from), U.fmtDT(st.to)], [], ['指標', '數值'], ['總留言數', st.kpi.total], ['已回覆', st.kpi.replied], ['已回覆率', Math.round(st.kpi.rate * 100) + '%'], ['待處理', st.kpi.pending], ['負面留言', st.kpi.negative], ['處理時間中位數', U.dur(st.median)], [], ['分類', '留言數']);

    rows.push([], ['平台', '留言數']); Object.entries(st.plat).forEach(([id, v]) => rows.push([platformName(id), v]));
    rows.push([], ['日期', '新增留言', '已回覆']); st.days.forEach(d => rows.push([d, st.dm[d].created, st.dm[d].replied]));

    download('CommentFlow_insights_' + stamp() + '.csv', '\uFEFF' + rows.map(r => r.map(U.csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');

const Backup = {
  collect(scope){
    const names = scope === 'library' ? ['templates', 'blocks', 'rules', 'categories'] : Object.keys(STORES);
    const data = {}; names.forEach(n => data[n] = S.list(n));
    if (scope === 'library') data.settings = S.list('settings').filter(s => ['brand', 'tones', 'bannedWords'].includes(s.key));
    return {app: 'CommentFlow', schemaVersion: DB_VERSION, exportedAt: new Date().toISOString(), scope, data};
  },
  async export(scope){
    const obj = this.collect(scope);
    download('CommentFlow_' + (scope === 'library' ? 'library' : 'backup') + '_' + stamp() + '.json', JSON.stringify(obj, null, 2), 'application/json');
    await S.set('lastExportAt', Date.now()); renderBanner(); toast('已匯出', 'ok');
  },
  migrate(o){ o.schemaVersion = o.schemaVersion || 1; return o; }, // 未來版本在此逐版轉換
  validate(o){
    if (!o || o.app !== 'CommentFlow' || typeof o.data !== 'object') throw new Error('這不是 CommentFlow 的備份檔');
    this.migrate(o); if (o.schemaVersion > DB_VERSION) throw new Error('備份檔版本較新（v' + o.schemaVersion + '），請使用較新的 CommentFlow');
    return o;
  },
  async apply(o, mode){
    const SKIP = ['lastExportAt', 'installedAt', 'theme', 'onboarded', 'seeded'];
    for (const n of Object.keys(STORES)){
      const arr = o.data[n]; if (!Array.isArray(arr)) continue;
      if (n === 'settings'){
        const items = arr.filter(s => s && s.key && !SKIP.includes(s.key));
        if (mode === 'overwrite' && o.scope === 'full'){ for (const s of S.list('settings')) if (!SKIP.includes(s.key)) S.settings.delete(s.key); await DB.clear('settings'); await S.saveMany('settings', S.list('settings').concat(items)); }
        else await S.saveMany('settings', items);
        continue;
      }
      const key = S.keyOf(n); const items = arr.filter(x => x && x[key]);
      if (mode === 'overwrite') await S.clearStore(n);
      if (n === 'blocks'){ // 避免 type+key 唯一索引衝突
        const ids = new Set(items.map(b => b.id)), conflict = S.list('blocks').filter(b => !ids.has(b.id) && items.some(x => x.type === b.type && x.key === b.key)).map(b => b.id);
        if (conflict.length) await S.removeMany('blocks', conflict);
      }
      await S.saveMany(n, items);
    }
    UI.checked.clear(); UI.selectedId = null;
  }
};

function bindEvents(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(err.message || '發生錯誤', 'error'); });
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-chg]'); if (!el) return;
    const fn = CHG[el.dataset.chg]; if (!fn) return;
    Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(err.message || '發生錯誤', 'error'); });
  });
  document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && el.dataset.inp === 'tplPreview' && UI.tplPreview) UI.tplPreview(); });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (document.querySelector('.overlay')) return;
    const t = e.target, typing = t && t.matches && t.matches('input,textarea,select,[contenteditable=true]');
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ if (UI.view === 'inbox' && UI.selectedId){ e.preventDefault(); Inbox.complete(); } return; }
    if (e.key === 'Escape'){ if (typing) t.blur(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === '?'){ e.preventDefault(); showHelp(); return; }
    if (k === 'n' || k === 'N'){ e.preventDefault(); openImport(); return; }
    if (UI.view !== 'inbox') return;
    if (k === 'j' || k === 'J'){ Inbox.move(1); }
    else if (k === 'k' || k === 'K'){ Inbox.move(-1); }
    else if (k === 's' || k === 'S'){ Inbox.skip(); }
    else if (k === 'e' || k === 'E'){ e.preventDefault(); Inbox.escalate(); }
    else if (k === '/'){ e.preventDefault(); const q = $('#q'); if (q) q.focus(); }
    else if (/^[1-9]$/.test(k)){ Inbox.applyRec(+k - 1); }
  });
}

/* ========== 7. Bootstrap ========== */
(async function boot(){
  applyTheme(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  bindEvents();
  try { await DB.open(); } catch (err){
    console.error(err); DB.disabled = true;
    toast('無法使用 IndexedDB（' + err.message + '），本次資料不會被保存，請改用一般模式的瀏覽器視窗', 'error');
  }
  try {
    await S.load();
    if (!S.settings.has('seeded')) await seedDefaults();
    applyTheme(S.get('theme', document.documentElement.getAttribute('data-theme')));
  } catch (err){ console.error(err); toast('資料載入失敗：' + err.message, 'error'); }
  if (!location.hash) { try { history.replaceState(null, '', '#/inbox'); } catch (e){ location.hash = '#/inbox'; } }
  route();
  if (!S.get('onboarded', false) && S.comments.size === 0) showOnboarding();
})();
</script>
